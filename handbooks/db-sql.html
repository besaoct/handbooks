How do you remove all non-numeric characters?`,d:2,p:`String`,c:[`AMZ`,`GS`],a:"`REGEXP_REPLACE(col, '[^0-9]', '')` in MySQL 8. Before that, nested `REPLACE` calls or a stored function."},{q:`What is the difference between LIKE and =?`,d:1,p:`String`,c:[`TCS`,`COG`],a:"`=` is exact equality; `LIKE` interprets `%` and `_`. `LIKE 'abc'` with no wildcards behaves like `=` but may use a different collation path and, on some engines, ignores trailing-space semantics differently."},{q:`Get rows from the last 30 days without breaking the index.`,d:2,p:`Date`,c:[`AMZ`,`GOOG`,`META`],a:"`WHERE d >= CURDATE() - INTERVAL 30 DAY`. Never `DATEDIFF(CURDATE(), d) <= 30` — a function on the column disables the index."},{q:`Filter one calendar day on a DATETIME column.`,d:2,p:`Date`,c:[`AMZ`,`UBER`],a:"Half-open range `>= '2024-01-01' AND < '2024-01-02'`. `DATE(ts) = '2024-01-01'` is both non-sargable and easy to get wrong on boundaries."},{q:`Difference between DATEDIFF and TIMESTAMPDIFF?`,d:2,p:`Date`,c:[`AMZ`,`TCS`],a:"`DATEDIFF(later, earlier)` returns whole days. `TIMESTAMPDIFF(unit, earlier, later)` takes the unit first and the arguments in the opposite order — a very easy mistake."},{q:`Compute someone's age correctly.`,d:2,p:`Date`,c:[`TCS`,`AMZ`,`INFY`],a:"`TIMESTAMPDIFF(YEAR, dob, CURDATE())`. Dividing days by 365 drifts with leap years and is wrong on the birthday itself."},{q:`Get the first and last day of a month.`,d:1,p:`Date`,c:[`TCS`,`AMZ`],a:"`DATE_FORMAT(d, '%Y-%m-01')` for the start and `LAST_DAY(d)` for the end — LAST_DAY handles February and leap years correctly."},{q:`What is the difference between DATETIME and TIMESTAMP?`,d:2,p:`Date`,c:[`AMZ`,`MSFT`,`ORCL`],a:`DATETIME is timezone-naive wall clock, 8 bytes, years 1000–9999. TIMESTAMP is epoch seconds, 4 bytes, converted to and from the session timezone, limited to 1970–2038.`},{q:`How do you handle timezones properly?`,d:3,p:`Date`,c:[`GOOG`,`UBER`,`ATLS`],a:`Store UTC (TIMESTAMP or a UTC DATETIME), convert at the presentation layer, and store the user's timezone separately. Never store local time without an offset — DST makes some local times ambiguous or nonexistent.`},{q:`Bucket timestamps into 15-minute intervals.`,d:2,p:`Date`,c:[`UBER`,`META`,`SNAP`],a:"`FROM_UNIXTIME(FLOOR(UNIX_TIMESTAMP(ts)/900)*900)`. Integer-divide to the bucket size and multiply back. Filter on the bare column so the index still applies."},{q:`How do you add or subtract an interval?`,d:1,p:`Date`,c:[`TCS`,`INFY`],a:"`d + INTERVAL 7 DAY`, `DATE_SUB(d, INTERVAL 1 MONTH)`. Month arithmetic clamps to the end of the target month rather than overflowing."},{q:`Extract the day of week and why are there two functions?`,d:1,p:`Date`,c:[`TCS`,`AMZ`],a:"`WEEKDAY` is 0-based from Monday; `DAYOFWEEK` is 1-based from Sunday. Mixing them up shifts every weekly report by a day."},{q:`Fill gaps in a time series so days with no data still appear.`,d:3,p:`Date`,c:[`META`,`AMZ`,`UBER`],a:`Generate a dense calendar (recursive CTE or a permanent calendar table), CROSS JOIN the dimensions, then LEFT JOIN the facts. GROUP BY alone can only emit dates that exist.`},{q:`Parse a string into a date.`,d:1,p:`Date`,c:[`TCS`,`CAP`],a:"`STR_TO_DATE('15/03/2024','%d/%m/%Y')`. `DATE_FORMAT` is the reverse. An unparseable value yields NULL with a warning, or an error under strict SQL mode."},{q:`Count business days between two dates.`,d:3,p:`Date`,c:[`GS`,`JPMC`,`MS`],a:"Join against a calendar table with an `is_business_day` flag and count. Pure arithmetic on weekday numbers ignores holidays, which finance interviews specifically probe."},{q:`Why did rows recorded after midnight go missing from my BETWEEN filter?`,d:2,p:`Date`,c:[`AMZ`,`GS`],a:"`BETWEEN '2024-01-01' AND '2024-03-31'` on a DATETIME column stops at 00:00:00 on the last day. Use a half-open range ending at the next day."},{q:`Why must you never store money as FLOAT?`,d:2,p:`Numeric`,c:[`GS`,`JPMC`,`MS`,`AMZ`],a:"Binary floating point cannot represent 0.1 exactly, so sums drift and equality fails. Use `DECIMAL(19,4)` or integer minor units."},{q:`What does DECIMAL(10,2) mean?`,d:1,p:`Numeric`,c:[`TCS`,`GS`],a:`Ten total digits, two after the point — maximum 99,999,999.99. Exceeding the scale rounds; exceeding the precision errors under strict mode.`},{q:`Difference between INT, BIGINT and their UNSIGNED forms?`,d:1,p:`Numeric`,c:[`TCS`,`AMZ`],a:"INT is 4 bytes (±2.1 billion), BIGINT 8 bytes. UNSIGNED doubles the positive range and rejects negatives — useful for surrogate ids. Note `INT(11)` sets display width only, not range."},{q:`What happens when you compare a VARCHAR column to a number?`,d:2,p:`Numeric`,c:[`AMZ`,`GOOG`,`MSFT`],a:`MySQL converts the **column** to a number, disabling the index and silently matching '5abc' to 5. Always quote string literals.`},{q:`What does 5/2 return in MySQL?`,d:1,p:`Numeric`,c:[`TCS`,`AMZ`],a:"2.5000 — `/` always yields DECIMAL scaled by `div_precision_increment`. `DIV` does integer division truncating toward zero. Division by zero returns NULL, not an error, unless strict mode is set."},{q:`How do you avoid division by zero?`,d:1,p:`Numeric`,c:[`AMZ`,`GS`,`META`],a:"`x / NULLIF(y, 0)` — returns NULL instead of NULL-with-warning or an error, and makes the intent explicit."},{q:`Difference between ROUND, TRUNCATE, CEIL and FLOOR?`,d:1,p:`Numeric`,c:[`TCS`,`GS`],a:"ROUND rounds half away from zero on DECIMAL; TRUNCATE chops; CEIL/FLOOR go to whole numbers. `FORMAT` returns a **string** with separators — never sort or compare on it."},{q:`Should you use BOOLEAN in MySQL?`,d:1,p:`Numeric`,c:[`TCS`,`AMZ`],a:"`BOOLEAN` is an alias for `TINYINT(1)`; there is no real boolean type. `TRUE` is literally 1 and `FALSE` is 0, so `SUM(cond)` counts matching rows."},{q:`CHAR vs VARCHAR vs TEXT — when do you use each?`,d:2,p:`Numeric`,c:[`AMZ`,`MSFT`,`TCS`],a:`CHAR is fixed width, right-padded — only for genuinely fixed values. VARCHAR is the default. TEXT is stored off-page, cannot have a default, and can only be prefix-indexed, so never use it for a filtered or sorted column.`},{q:`What are the practical problems with ENUM?`,d:2,p:`Numeric`,c:[`AMZ`,`GOOG`],a:`Adding a value needs an ALTER; sorting follows declaration order not alphabetical; comparing to an integer compares the internal index; and it is non-portable. A lookup table with an FK is the usual alternative.`},{q:`When would you use a JSON column?`,d:2,p:`Numeric`,c:[`GOOG`,`ATLS`,`AMZ`],a:`For genuinely schemaless attributes. MySQL 8 validates JSON and lets you index extracted paths via generated columns. Do not use it for data you filter, join or aggregate on regularly — that data wants columns.`},{q:`What is a generated column?`,d:2,p:`Numeric`,c:[`AMZ`,`GOOG`],a:`A column computed from an expression, either VIRTUAL (computed on read, no storage) or STORED (computed on write). Both can be indexed, which is how you make a non-sargable expression fast.`},{q:`What is the difference between a primary key and a unique key?`,d:1,p:`DDL`,c:[`TCS`,`INFY`,`AMZ`,`COG`],a:`One primary key per table, implicitly NOT NULL, and in InnoDB it is the clustered index. Many unique keys allowed, and they permit multiple NULLs.`},{q:`What is a composite key?`,d:1,p:`DDL`,c:[`TCS`,`WIPRO`],a:"A key made of more than one column. Common on junction tables, where `(a_id, b_id)` as the primary key declaratively prevents duplicate relationships."},{q:`What is a candidate key versus a super key?`,d:2,p:`DDL`,c:[`ORCL`,`IBM`,`TCS`],a:`A super key uniquely identifies a row, possibly with redundant columns. A candidate key is a **minimal** super key. One candidate becomes the primary key; the rest should get unique constraints.`},{q:`Surrogate key or natural key?`,d:2,p:`DDL`,c:[`AMZ`,`MSFT`,`ORCL`],a:`Surrogate as the primary key, because natural values change and changing keys cascade painfully. Add a unique constraint on the natural key so the database still enforces the real rule.`},{q:`Why does InnoDB want a small primary key?`,d:3,p:`DDL`,c:[`AMZ`,`GOOG`,`MSFT`],a:`The table is stored inside the primary key's B-tree and every secondary index carries the primary key as its row pointer. A 36-byte UUID inflates every index; random UUIDs also cause page splits.`},{q:`Compare ON DELETE RESTRICT, CASCADE, SET NULL and NO ACTION.`,d:2,p:`DDL`,c:[`AMZ`,`ORCL`,`ACC`],a:`RESTRICT refuses while children exist (safe default). CASCADE deletes children — dangerous in deep hierarchies. SET NULL needs a nullable column and leaves orphans. NO ACTION behaves like RESTRICT in InnoDB.`},{q:`Difference between DELETE, TRUNCATE and DROP?`,d:1,p:`DDL`,c:[`TCS`,`INFY`,`WIPRO`,`AMZ`,`CAP`],a:`DELETE = DML, filterable, logged per row, rollback-able, keeps AUTO_INCREMENT. TRUNCATE = DDL, resets the table and the counter, implicit commit, no triggers, no WHERE. DROP removes the table entirely.`},{q:`How do you add a column to a huge table without downtime?`,d:3,p:`DDL`,c:[`AMZ`,`GOOG`,`UBER`],a:"`ALTER … ALGORITHM=INSTANT` where supported (nullable column at the end, drop, rename). Always specify the algorithm so an unsupported change **errors** instead of silently locking. Otherwise use gh-ost or pt-online-schema-change."},{q:`Does MySQL enforce CHECK constraints?`,d:2,p:`DDL`,c:[`AMZ`,`ORCL`],a:`Only from 8.0.16 — before that they were parsed and ignored, so validation had to live in the application. A CHECK also passes when the expression is UNKNOWN, so it does not imply NOT NULL.`},{q:`What is AUTO_INCREMENT and can it produce gaps?`,d:1,p:`DDL`,c:[`TCS`,`AMZ`],a:`Yes, always. Values are allocated outside the transaction so concurrent inserts do not block, meaning rollbacks and failed inserts burn values permanently. Never assume density or use MAX(id) as a row count.`},{q:`Why name your constraints?`,d:1,p:`DDL`,c:[`AMZ`,`MSFT`],a:"Error messages and later ALTER statements reference the name. `ERROR 1452 (fk_orders_cust)` is debuggable; `CONSTRAINT_1` is not."},{q:`How do you rename a table or column safely?`,d:2,p:`DDL`,c:[`AMZ`,`GOOG`],a:"`RENAME TABLE a TO b` is atomic and instant — used for the copy-and-swap deployment pattern. `ALTER TABLE … RENAME COLUMN` is metadata-only in MySQL 8 but breaks any application still using the old name, so deploy in two steps."},{q:`What is a temporary table and how is it scoped?`,d:1,p:`DDL`,c:[`TCS`,`MSFT`],a:"`CREATE TEMPORARY TABLE` is visible only to the creating session and dropped at disconnect. It can be indexed, which makes it the right tool for an expensive intermediate reused many times."},{q:`What does the InnoDB 3072-byte index key limit mean in practice?`,d:3,p:`DDL`,c:[`AMZ`,`GOOG`],a:"A `VARCHAR(1000)` utf8mb4 column is 4000 bytes and cannot be fully indexed. Use a prefix index `KEY (col(191))`, or hash the value into a separate indexed column."}],C=[{q:`Insert multiple rows in one statement.`,d:1,p:`DML`,c:[`TCS`,`INFY`],a:"`INSERT INTO t (a,b) VALUES (1,2),(3,4),(5,6)` — one round trip, one transaction, far faster than three statements."},{q:`Copy rows from one table into another.`,d:1,p:`DML`,c:[`TCS`,`AMZ`],a:"`INSERT INTO target (cols) SELECT cols FROM source WHERE …`. Column order matters, not names. `CREATE TABLE t2 AS SELECT …` creates and fills but copies no indexes or constraints."},{q:`Write an upsert in MySQL.`,d:2,p:`DML`,c:[`AMZ`,`FLPK`,`TCS`],a:"`INSERT … ON DUPLICATE KEY UPDATE`. Requires a unique constraint; with several unique keys it updates whichever it hits first, which is non-deterministic. It also consumes auto-increment values on update."},{q:`Write an upsert in PostgreSQL.`,d:2,p:`DML`,c:[`GOOG`,`ATLS`],a:"`INSERT … ON CONFLICT (col) DO UPDATE SET x = EXCLUDED.x`. Naming the constraint removes MySQL's multi-key ambiguity."},{q:`What does INSERT IGNORE do and why avoid it?`,d:2,p:`DML`,c:[`AMZ`,`MSFT`],a:"Downgrades errors to warnings so duplicates are skipped — but it also swallows truncation and type errors, hiding real data problems. Prefer `ON DUPLICATE KEY UPDATE`."},{q:`Difference between REPLACE INTO and ON DUPLICATE KEY UPDATE?`,d:2,p:`DML`,c:[`AMZ`,`FLPK`],a:"`REPLACE` deletes the existing row and inserts a new one — firing delete triggers, cascading FKs, and losing columns you did not supply. `ON DUPLICATE KEY UPDATE` modifies in place."},{q:`Update one table using values from another.`,d:2,p:`DML`,c:[`AMZ`,`TCS`,`MSFT`],a:"MySQL allows `UPDATE a JOIN b ON … SET a.x = b.y`. Pre-aggregate the right side to one row per key, or MySQL applies an arbitrary match with no error."},{q:`Why must a correlated UPDATE have a WHERE EXISTS guard?`,d:2,p:`DML`,c:[`AMZ`,`ORCL`],a:`Without it, rows with no matching subquery result are set to NULL, wiping existing values. The guard restricts the update to rows that actually have a match.`},{q:`Delete duplicate rows keeping the lowest id.`,d:2,p:`DML`,c:[`AMZ`,`ADBE`,`TCS`],a:"`DELETE a FROM t a JOIN t b ON b.key = a.key AND b.id < a.id`, or `ROW_NUMBER() > 1` in a doubly-nested subquery. Then add the UNIQUE constraint so it cannot recur."},{q:`Why does MySQL say 'You can't specify target table for delete in FROM clause'?`,d:2,p:`DML`,c:[`AMZ`,`TCS`],a:"You cannot read the table being modified in a direct subquery. Wrap it in an extra `SELECT * FROM (…) x` to force materialisation, or use the join form of DELETE."},{q:`How do you delete 50 million rows without blocking writes?`,d:3,p:`DML`,c:[`AMZ`,`UBER`,`GOOG`],a:"Batch it: `DELETE … ORDER BY id LIMIT 10000` in a loop with a short pause, so locks release and replicas keep up. Better, partition by date and drop the partition — a metadata operation."},{q:`What does RETURNING do?`,d:2,p:`DML`,c:[`GOOG`,`ATLS`],a:"Returns the affected rows from an INSERT/UPDATE/DELETE in one round trip. PostgreSQL and MariaDB support it; MySQL does not — use `LAST_INSERT_ID()` after an insert."},{q:`How do you get the id of the row you just inserted?`,d:1,p:`DML`,c:[`TCS`,`AMZ`],a:"`LAST_INSERT_ID()` — session-scoped, so concurrent inserts do not interfere. For a multi-row insert it returns the **first** generated id, and the rest are consecutive."},{q:`How do you bulk load a large file efficiently?`,d:2,p:`DML`,c:[`AMZ`,`WALM`,`DE`],a:"`LOAD DATA INFILE` is far faster than row-by-row inserts. Drop or disable secondary indexes first and rebuild after, batch commits, and increase the buffer pool. Note it still fires triggers."},{q:`What is the difference between DDL, DML, DQL, DCL and TCL?`,d:1,p:`DML`,c:[`TCS`,`INFY`,`COG`,`CAP`],a:`DDL defines structure (CREATE/ALTER/DROP, implicit commit). DML changes rows (INSERT/UPDATE/DELETE). DQL queries (SELECT). DCL controls access (GRANT/REVOKE). TCL controls transactions (COMMIT/ROLLBACK/SAVEPOINT).`},{q:`What does ACID stand for?`,d:1,p:`Txn`,c:[`TCS`,`AMZ`,`GS`,`INFY`],a:`Atomicity (all or nothing, via undo log), Consistency (constraints hold), Isolation (concurrent transactions do not see intermediates), Durability (committed changes survive a crash, via redo log and fsync).`},{q:`Name the four isolation levels and what each prevents.`,d:2,p:`Txn`,c:[`AMZ`,`ORCL`,`GS`,`MSFT`],a:`READ UNCOMMITTED allows dirty reads. READ COMMITTED prevents them. REPEATABLE READ also prevents non-repeatable reads. SERIALIZABLE prevents phantoms too.`},{q:`What are dirty, non-repeatable and phantom reads?`,d:2,p:`Txn`,c:[`AMZ`,`ORCL`,`IBM`],a:`Dirty: reading uncommitted data. Non-repeatable: the same row changes between two reads. Phantom: the same query returns new rows because someone inserted.`},{q:`What is MySQL's default isolation level, and PostgreSQL's?`,d:2,p:`Txn`,c:[`AMZ`,`GOOG`],a:`InnoDB defaults to REPEATABLE READ; PostgreSQL to READ COMMITTED. The same application code can behave differently across the two.`},{q:`Does REPEATABLE READ allow phantoms in InnoDB?`,d:3,p:`Txn`,c:[`AMZ`,`ORCL`,`GOOG`],a:`The standard says yes, but InnoDB prevents them using next-key locks (row + gap). MySQL's default is therefore stronger than the standard requires — a favourite interview detail.`},{q:`What is MVCC?`,d:2,p:`Txn`,c:[`AMZ`,`GOOG`,`ORCL`],a:`Multi-Version Concurrency Control: multiple row versions let readers avoid blocking writers. InnoDB stores hidden trx-id and roll-pointer columns and keeps old versions in the undo log, which a read view walks back through.`},{q:`Why do long-running transactions hurt performance?`,d:3,p:`Txn`,c:[`AMZ`,`GOOG`,`UBER`],a:`They pin the undo log so old row versions cannot be purged, bloating storage and slowing every read that must walk the version chain. They also hold locks longer, widening the deadlock window.`},{q:`What is a lost update and how do you prevent it?`,d:2,p:`Txn`,c:[`AMZ`,`GS`,`MSFT`],a:"Two transactions read the same value, both write, one change vanishes. Prevent with an atomic `UPDATE t SET n = n + 1`, `SELECT … FOR UPDATE`, or optimistic locking with a version column."},{q:`Difference between pessimistic and optimistic locking?`,d:2,p:`Txn`,c:[`AMZ`,`UBER`,`ATLS`],a:"Pessimistic takes a lock up front (`FOR UPDATE`) — right under high contention. Optimistic detects the conflict at write time via a version column and retries — better under low contention since readers never block."},{q:`What does SELECT … FOR UPDATE SKIP LOCKED do?`,d:3,p:`Txn`,c:[`AMZ`,`UBER`,`ATLS`],a:`Takes exclusive locks on the selected rows but **skips** rows already locked by another session instead of waiting — exactly the semantics a job queue needs, turning a serial bottleneck into parallel throughput.`},{q:`What causes a deadlock and how do you fix it?`,d:3,p:`Txn`,c:[`AMZ`,`UBER`,`MSFT`,`GS`],a:`Two transactions acquiring the same locks in opposite orders. Fix by ordering acquisitions consistently (sort the keys), keeping transactions short, indexing WHERE clauses, and retrying on error 1213.`},{q:`Why can an UPDATE without an index lock the whole table?`,d:3,p:`Txn`,c:[`AMZ`,`GOOG`,`ORCL`],a:`InnoDB locks the index records it **examines**, not just those it modifies. A full scan therefore locks everything. Indexing the WHERE column turns it into a targeted range lock.`},{q:`What is a gap lock and a next-key lock?`,d:3,p:`Txn`,c:[`AMZ`,`ORCL`],a:`A gap lock covers the space between index values, preventing inserts there. A next-key lock is a row lock plus the gap before it — the mechanism by which InnoDB blocks phantoms under REPEATABLE READ.`},{q:`What is a savepoint?`,d:2,p:`Txn`,c:[`ORCL`,`IBM`,`TCS`],a:`A named marker allowing partial rollback inside a transaction. InnoDB keeps row locks acquired after it; PostgreSQL releases them. ORMs use savepoints to fake nested transactions.`},{q:`Which statements cause an implicit commit?`,d:2,p:`Txn`,c:[`AMZ`,`ORCL`],a:"All DDL in MySQL — CREATE, ALTER, DROP, TRUNCATE, RENAME — plus `START TRANSACTION` itself and `SET autocommit=1`. A stray schema statement silently ends your transaction."},{q:`What is autocommit?`,d:1,p:`Txn`,c:[`TCS`,`AMZ`],a:"On by default in MySQL: each statement is its own transaction. `START TRANSACTION` suspends it until COMMIT or ROLLBACK. Bulk inserts are dramatically faster with autocommit off and periodic commits."},{q:`What is two-phase commit?`,d:3,p:`Txn`,c:[`ORCL`,`IBM`,`GS`],a:`A distributed protocol: a coordinator asks all participants to PREPARE, and commits only if all vote yes. It blocks if the coordinator fails mid-protocol, which is why modern systems prefer sagas or idempotent retries.`},{q:`What data structure backs a normal index?`,d:2,p:`Index`,c:[`AMZ`,`GOOG`,`MSFT`,`ORCL`],a:`A B+ tree — values in the leaves, leaves linked in sorted order. High branching factor means 3–4 levels even for a billion rows, and the linked leaves make range scans and ORDER BY cheap.`},{q:`Why not use a hash index by default?`,d:2,p:`Index`,c:[`GOOG`,`AMZ`],a:`O(1) equality but no ranges, no prefix matching, no ordered scans. Used in MEMORY tables and InnoDB's automatic adaptive hash index, not as a general-purpose structure.`},{q:`Clustered versus non-clustered index?`,d:2,p:`Index`,c:[`AMZ`,`MSFT`,`ORCL`],a:`Clustered = the table itself, rows stored in key order, one per table. Secondary indexes store the indexed columns plus the primary key as the pointer, so non-indexed columns need a second lookup.`},{q:`What is the leftmost prefix rule?`,d:2,p:`Index`,c:[`AMZ`,`GOOG`,`MSFT`,`FLPK`],a:"An index on `(a,b,c)` serves `(a)`, `(a,b)` and `(a,b,c)` — never `(b)` or `(b,c)` alone. This is why a single-column index on the leading column is always redundant."},{q:`How do you order columns in a composite index?`,d:3,p:`Index`,c:[`AMZ`,`GOOG`,`MSFT`],a:`Equality predicates first, then the range or ORDER BY column last. Once a range is used, later columns can only filter, not seek.`},{q:`What is a covering index?`,d:2,p:`Index`,c:[`AMZ`,`GOOG`,`MSFT`],a:"One containing every column the query needs, so the table is never touched — `Using index` in EXPLAIN. Often turns seconds into milliseconds. The cost is a wider index and slower writes."},{q:`List six ways to accidentally disable an index.`,d:3,p:`Index`,c:[`AMZ`,`GOOG`,`MSFT`],a:`Function on the column, arithmetic on the column, leading wildcard LIKE, implicit type conversion, OR across different columns, and negation or very low selectivity.`},{q:`What is index selectivity?`,d:2,p:`Index`,c:[`AMZ`,`ORCL`,`MSFT`],a:"`COUNT(DISTINCT col)/COUNT(*)` — the fraction a lookup narrows to. Near 1 is ideal; near 0 (a boolean) means the optimiser will ignore the index and scan instead."},{q:`When should you NOT add an index?`,d:2,p:`Index`,c:[`AMZ`,`GOOG`],a:"Low selectivity, small tables, write-heavy columns, anything already served by an existing index's leftmost prefix, and exact duplicates of another index. Check `sys.schema_unused_indexes`."},{q:`What is a prefix index?`,d:2,p:`Index`,c:[`AMZ`,`GOOG`],a:"`KEY (col(20))` indexes only the first 20 characters — necessary for long columns given InnoDB's 3072-byte key limit. It cannot be a covering index and cannot serve ORDER BY."},{q:`What is a partial / filtered index?`,d:2,p:`Index`,c:[`GOOG`,`MSFT`,`ATLS`],a:"An index over a subset of rows, e.g. `WHERE deleted_at IS NULL`. Much smaller and cheaper to maintain. PostgreSQL and SQL Server support it; MySQL does not."},{q:`What is a functional index?`,d:2,p:`Index`,c:[`AMZ`,`GOOG`,`ORCL`],a:"An index on an expression, `ADD INDEX ((YEAR(d)))` — note the double parentheses. MySQL 8 implements it via a hidden virtual column. It makes an otherwise non-sargable predicate fast."},{q:`Do indexes speed up writes?`,d:1,p:`Index`,c:[`TCS`,`AMZ`],a:`No — every INSERT, UPDATE and DELETE must maintain every affected index, so writes get slower with each one. Indexing is a read/write trade-off, not a free win.`},{q:`What is a bitmap index and where is it used?`,d:3,p:`Index`,c:[`ORCL`,`IBM`,`SAP`],a:`One bitmap per distinct value, combined with bitwise operations. Excellent for low-cardinality columns in read-mostly data warehouses. Oracle has them; MySQL does not, because they lock badly under concurrent writes.`},{q:`What is a full-text index?`,d:2,p:`Index`,c:[`AMZ`,`ATLS`,`ORCL`],a:"An inverted index over words, queried with `MATCH … AGAINST`. Handles relevance ranking and boolean mode. For serious search, a dedicated engine like Elasticsearch is usually the answer."},{q:`How do you index for a query that filters on one column and sorts on another?`,d:3,p:`Index`,c:[`AMZ`,`GOOG`,`META`],a:"One composite index `(filter_col, sort_col)`. The engine seeks the filter value then walks the index in order, eliminating the filesort — this is why `ORDER BY … LIMIT 10` can still be slow with the wrong index."}],w=[{q:`How do you read an EXPLAIN plan?`,d:2,p:`Perf`,c:[`AMZ`,`GOOG`,`MSFT`,`ORCL`],a:"Check `type`, `key`, `rows` and `Extra` first. `type=ALL` with `key=NULL` is a full scan. `Using filesort` and `Using temporary` mean extra work. Estimates come from statistics — use `EXPLAIN ANALYZE` for real numbers."},{q:`Order the EXPLAIN access types from best to worst.`,d:3,p:`Perf`,c:[`AMZ`,`ORCL`,`MSFT`],a:"system > const > eq_ref > ref > range > index > ALL. Anything at `range` or better is normally fine; `index` is a full index scan and `ALL` a full table scan."},{q:`What does 'Using index' mean versus 'Using index condition'?`,d:3,p:`Perf`,c:[`AMZ`,`GOOG`],a:"`Using index` = covering, no table access at all. `Using index condition` = index condition pushdown, where the filter is evaluated at the index level but rows are still fetched."},{q:`What does 'Using temporary; Using filesort' indicate?`,d:2,p:`Perf`,c:[`AMZ`,`MSFT`],a:`The server built an internal temp table (usually for GROUP BY or DISTINCT) and sorted it. Common when grouping or ordering on a column no index provides in that order.`},{q:`How do you find slow queries in production?`,d:2,p:`Perf`,c:[`AMZ`,`GOOG`,`UBER`],a:"Slow query log plus `pt-query-digest`, or `performance_schema.events_statements_summary_by_digest` live. Rank by **total** time (count × latency), not worst single execution."},{q:`What is the N+1 query problem?`,d:2,p:`Perf`,c:[`AMZ`,`ATLS`,`SFDC`],a:"One query for a list, then one per row for related data. The classic ORM bug, invisible with three test rows. Fix with eager loading, a join, or a batched `WHERE id IN (…)`."},{q:`Why did a fast query suddenly become slow?`,d:3,p:`Perf`,c:[`META`,`GOOG`,`AMZ`],a:"Data volume crossed a threshold and the plan flipped; statistics went stale after a bulk load (`ANALYZE TABLE`); an index was dropped; lock waits from another transaction; or a parameter value with different selectivity."},{q:`What does ANALYZE TABLE do?`,d:2,p:`Perf`,c:[`AMZ`,`ORCL`,`MSFT`],a:`Recomputes index statistics and histograms so the cost-based optimiser can estimate cardinality. Stale statistics after a bulk load are a leading cause of sudden bad plans.`},{q:`How do you optimise a query returning millions of rows to the client?`,d:3,p:`Perf`,c:[`GOOG`,`AMZ`],a:`Do not — aggregate or paginate server-side. If the data really must move, stream it with a server-side cursor rather than buffering, and select only the needed columns.`},{q:`What is query caching and why was it removed from MySQL 8?`,d:2,p:`Perf`,c:[`AMZ`,`ORCL`],a:`The old query cache stored result sets keyed by SQL text but invalidated the entire cache for a table on any write, making it a scalability bottleneck. Removed in 8.0; use an application cache like Redis instead.`},{q:`How does the buffer pool affect performance?`,d:2,p:`Perf`,c:[`AMZ`,`ORCL`,`MSFT`],a:"`innodb_buffer_pool_size` holds data and index pages in memory. If the working set fits, reads are memory-speed; if not, every miss is a disk seek. It is usually the single most important MySQL setting — commonly 60–75% of RAM."},{q:`How do you optimise a COUNT of a huge table?`,d:2,p:`Perf`,c:[`AMZ`,`META`],a:"Accept an approximation from `information_schema.TABLES.TABLE_ROWS`, maintain a counter table, or use a summary table. An exact `COUNT(*)` in InnoDB must scan because of MVCC."},{q:`What is a sargable predicate?`,d:2,p:`Perf`,c:[`MSFT`,`AMZ`,`ORCL`],a:`One the engine can satisfy with an index seek — the indexed column appears bare on one side of the comparison. Wrapping it in a function or arithmetic makes it non-sargable.`},{q:`Should you use SELECT COUNT(*) or EXISTS to check for rows?`,d:1,p:`Perf`,c:[`AMZ`,`TCS`],a:"`EXISTS` — it stops at the first matching row, while `COUNT(*)` scans all of them just to compare against zero."},{q:`How do you speed up a very slow GROUP BY?`,d:3,p:`Perf`,c:[`AMZ`,`GOOG`],a:`Index the grouping columns so the engine can use loose index scan instead of a temp table; filter earlier in WHERE; reduce the grouped column width; or pre-aggregate into a summary table if the query is repeated.`},{q:`What is index condition pushdown?`,d:3,p:`Perf`,c:[`AMZ`,`ORCL`],a:"The storage engine evaluates parts of the WHERE clause using the index before fetching rows, so fewer bookmark lookups occur. Visible as `Using index condition` in EXPLAIN."},{q:`What is partition pruning?`,d:2,p:`Perf`,c:[`AMZ`,`ORCL`,`SAP`],a:`The optimiser skips partitions that cannot contain matching rows, based on a filter over the partition key. Without such a filter, partitioning makes queries **slower** by scanning every partition.`},{q:`What is normalization and why do it?`,d:1,p:`Norm`,c:[`TCS`,`INFY`,`COG`,`AMZ`],a:`Organising a schema to eliminate redundancy and the update, insert and delete anomalies it causes. Each normal form removes a specific class of anomaly.`},{q:`Define 1NF, 2NF and 3NF.`,d:1,p:`Norm`,c:[`TCS`,`INFY`,`WIPRO`,`CAP`],a:`1NF: atomic values, no repeating groups. 2NF: 1NF plus no partial dependency on part of a composite key. 3NF: 2NF plus no transitive dependency between non-key columns.`},{q:`What is BCNF and how does it differ from 3NF?`,d:2,p:`Norm`,c:[`ORCL`,`IBM`,`AMZ`],a:`Every determinant must be a candidate key. It only differs from 3NF when a table has overlapping candidate keys — rare in practice, and the usual exam example is the instructor/course case.`},{q:`What are 4NF and 5NF?`,d:3,p:`Norm`,c:[`ORCL`,`IBM`],a:`4NF removes multi-valued dependencies — two independent lists in one table create a spurious cartesian product. 5NF handles join dependencies. Almost no production schema is designed past BCNF.`},{q:`Name the three anomalies normalization prevents.`,d:1,p:`Norm`,c:[`TCS`,`INFY`,`IBM`],a:`Update (one fact stored in many places can diverge), insert (cannot record one fact without another), delete (removing one row loses an unrelated fact).`},{q:`When is denormalization justified?`,d:2,p:`Norm`,c:[`AMZ`,`GOOG`,`UBER`],a:`After measuring, when a read path is too slow, reads dominate writes, and one reliable code path maintains the copy. Try covering indexes, summary tables and generated columns first.`},{q:`Model a many-to-many relationship.`,d:1,p:`Norm`,c:[`TCS`,`AMZ`,`INFY`],a:`A junction table with a composite primary key on both foreign keys, plus a **reverse index** so lookups work from either side. Attributes of the relationship live in the junction table.`},{q:`How do you model a hierarchy in SQL?`,d:3,p:`Norm`,c:[`AMZ`,`GOOG`,`MSFT`],a:`Adjacency list (simple, needs recursive CTE), path enumeration (fast prefix subtree reads, costly moves), nested sets (fastest reads, painful writes), closure table (both directions O(1), more storage).`},{q:`How do you model class inheritance?`,d:2,p:`Norm`,c:[`MSFT`,`SFDC`,`SAP`],a:`Single table with a discriminator and nullable columns; class table with a shared parent plus per-type children; or concrete tables with no parent. Choose by how often you query across types.`},{q:`What is the EAV pattern and why is it usually a mistake?`,d:3,p:`Norm`,c:[`SFDC`,`SAP`,`AMZ`],a:`Attribute-per-row storage. It loses typing and constraints, needs a self-join or pivot per attribute, and defeats the optimiser. A JSON column with functional indexes is usually better.`},{q:`Should you use soft deletes?`,d:2,p:`Norm`,c:[`AMZ`,`ATLS`,`SFDC`],a:`They preserve history and avoid FK breakage, but every query must remember the filter, unique constraints stop behaving as intended, and tables grow without bound. Mitigate with a view and an archival job.`},{q:`How do you model a one-to-one relationship and why?`,d:2,p:`Norm`,c:[`AMZ`,`MSFT`],a:`A unique FK on the optional side. Reasons to split: vertical partitioning to keep large or rarely read columns out of the hot table, separate access control, and genuine optionality.`},{q:`What is referential integrity?`,d:1,p:`Norm`,c:[`TCS`,`INFY`,`ORCL`],a:`The guarantee that every foreign key value exists in the referenced key. Enforced by FK constraints; the referential action (RESTRICT/CASCADE/SET NULL) decides what happens when the parent changes.`},{q:`Should foreign keys be enforced in the database or the application?`,d:2,p:`Norm`,c:[`AMZ`,`GOOG`,`UBER`],a:`The database, because it is the only place that cannot be bypassed by a script, a migration or a second service. Some very-high-write systems drop them for performance and accept the risk — a deliberate trade, not a default.`},{q:`What is a star schema?`,d:2,p:`Norm`,c:[`WALM`,`DELOITTE`,`SAP`,`MCK`],a:`A central fact table of measures with foreign keys to denormalised dimension tables. Deliberately not normalised, because analytical queries join dimensions constantly and star joins optimise well. A snowflake schema normalises the dimensions.`},{q:`Difference between OLTP and OLAP?`,d:1,p:`Norm`,c:[`TCS`,`SAP`,`DELOITTE`],a:`OLTP: many small concurrent read/write transactions, normalised, row-oriented, indexed for point lookups. OLAP: few large analytical scans, denormalised star schemas, often columnar storage.`},{q:`What is a view and does it store data?`,d:1,p:`View`,c:[`TCS`,`INFY`,`AMZ`],a:`A stored query definition. It stores no rows and is re-executed on every reference, so it gives abstraction and access control, not speed.`},{q:`When is a view updatable?`,d:2,p:`View`,c:[`ORCL`,`AMZ`,`MSFT`],a:"When each output row maps to exactly one base row — so no GROUP BY, DISTINCT, UNION, aggregates or window functions. `WITH CHECK OPTION` prevents inserting rows that fall outside the view's own filter."},{q:`How do you create a materialized view in MySQL?`,d:2,p:`View`,c:[`AMZ`,`SAP`],a:`You cannot — build a summary table and refresh it on a schedule with an EVENT, refreshing only recent partitions rather than the whole history. PostgreSQL and Oracle have the real thing.`},{q:`What is an indexed view / materialized view for?`,d:2,p:`View`,c:[`MSFT`,`ORCL`],a:`Precomputing an expensive aggregate or join so reads are cheap. The cost is staleness and refresh work; SQL Server's indexed views maintain themselves synchronously, at write cost.`},{q:`Stored procedure versus stored function?`,d:1,p:`Proc`,c:[`TCS`,`ORCL`,`IBM`],a:"A function returns one value and is usable inside a query (so it runs per row — a performance trap); a procedure returns nothing or result sets, supports OUT parameters, and is called with `CALL`."},{q:`Why does DELIMITER appear before CREATE PROCEDURE?`,d:1,p:`Proc`,c:[`TCS`,`INFY`],a:"The body contains semicolons that would otherwise end the statement early. Change the client delimiter to `$$`, define the routine, then change it back."},{q:`How do you handle errors inside a stored procedure?`,d:2,p:`Proc`,c:[`ORCL`,`AMZ`,`IBM`],a:"`DECLARE EXIT HANDLER FOR SQLEXCEPTION BEGIN ROLLBACK; RESIGNAL; END`. Raise your own with `SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = '…'`. Without RESIGNAL you swallow the error."},{q:`What is a trigger and what are OLD and NEW?`,d:1,p:`Proc`,c:[`TCS`,`ORCL`,`INFY`],a:"Code fired automatically on INSERT/UPDATE/DELETE, BEFORE or AFTER. `OLD` is available in UPDATE and DELETE, `NEW` in INSERT and UPDATE. BEFORE triggers can modify `NEW`."},{q:`Why are triggers controversial?`,d:2,p:`Proc`,c:[`AMZ`,`GOOG`,`ATLS`],a:`Invisible in application code and in EXPLAIN, fire per row so they magnify bulk operations, run inside the caller's transaction extending lock duration, and cascade unpredictably. Fine for auditing, poor for business logic.`},{q:`How many times does a trigger fire on a 1000-row INSERT?`,d:2,p:`Proc`,c:[`AMZ`,`TCS`],a:`1000 — MySQL supports row-level triggers only. This is why a trigger doing anything expensive turns a bulk load into a crawl.`},{q:`What is a cursor and why avoid it?`,d:2,p:`Proc`,c:[`ORCL`,`IBM`,`TCS`],a:"Row-by-row iteration inside a procedure. Almost always the wrong tool because SQL is set-based — a loop updating a million rows is orders of magnitude slower than one `UPDATE … JOIN` and holds locks far longer."},{q:`What is a MySQL EVENT?`,d:2,p:`Proc`,c:[`AMZ`,`SAP`],a:"A scheduled job run by the server — used to refresh summary tables or purge old rows. Requires `event_scheduler = ON`, which is off by default, so the job silently never runs if you forget."},{q:`Should business logic live in the database?`,d:2,p:`Proc`,c:[`AMZ`,`GOOG`,`ATLS`],a:`Mostly no — procedures are hard to version-control, test and profile, and tie you to one engine. The strong cases are batch data manipulation where moving rows to the client is the bottleneck, and invariants that must hold regardless of client.`},{q:`What is SQL injection and how do you prevent it?`,d:1,p:`Security`,c:[`AMZ`,`GOOG`,`TCS`,`PYPL`],a:`Attacker-controlled input altering the statement's structure. Prevented **structurally** by prepared statements with bound parameters — the parameter can only ever be a value, never syntax. Escaping is a weaker fallback.`},{q:`Can you parameterise a table or column name?`,d:2,p:`Security`,c:[`AMZ`,`ATLS`],a:`No — placeholders stand only for values. Dynamic sorting or table selection must validate the identifier against an allowlist, never concatenate user input.`},{q:`How do you grant read-only access to one schema?`,d:1,p:`Security`,c:[`TCS`,`AMZ`,`IBM`],a:"`GRANT SELECT ON analytics.* TO 'user'@'host'` — least privilege, narrowest scope. Avoid `GRANT ALL` and avoid `*.*`. Column-level grants are also possible."},{q:`What is the principle of least privilege in a database context?`,d:1,p:`Security`,c:[`AMZ`,`GS`,`JPMC`],a:`Each account gets only the privileges its role needs: the app user gets DML but not DDL, reporting gets SELECT on a replica, migrations use a separate account. Compromise of one account then has bounded blast radius.`},{q:`How do you store passwords in a database?`,d:2,p:`Security`,c:[`AMZ`,`PYPL`,`GS`],a:`Never in plaintext and never with a fast hash. Use a slow, salted, memory-hard KDF — bcrypt, scrypt or Argon2 — computed in the application, and store only the resulting hash.`},{q:`What is data masking and why use it?`,d:2,p:`Security`,c:[`GS`,`JPMC`,`DELOITTE`],a:`Replacing or obscuring sensitive values in non-production environments or for restricted users. Views with masked expressions, column-level grants, or dedicated masking features. It keeps realistic data shapes without exposing real PII.`},{q:`What is encryption at rest versus in transit?`,d:2,p:`Security`,c:[`AMZ`,`GS`,`MSFT`],a:`At rest = the stored files are encrypted (InnoDB tablespace encryption, disk-level). In transit = TLS on the connection. They defend different threats, and you generally need both plus application-level encryption for the most sensitive columns.`},{q:`How do you audit who changed what?`,d:2,p:`Security`,c:[`GS`,`JPMC`,`DELOITTE`],a:"An audit table populated by AFTER triggers capturing OLD and NEW plus `CURRENT_USER()` and a timestamp, or the server's audit plugin, or the binary log parsed downstream. Application-level logging alone misses direct database access."},{q:`What is row-level security?`,d:3,p:`Security`,c:[`MSFT`,`SFDC`,`ORCL`],a:"Policies that restrict which rows a user can see, applied automatically to every query. PostgreSQL and SQL Server support it natively. MySQL does not — emulate it with views filtered on `CURRENT_USER()`."}],pe=[{q:`Find the Nth highest salary per department.`,d:2,p:`Advanced`,c:[`AMZ`,`META`,`MSFT`,`FLPK`],a:"`DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) = N`. Portable form: exactly N−1 distinct salaries in the department are greater."},{q:`Find employees earning more than their manager.`,d:1,p:`Advanced`,c:[`TCS`,`AMZ`,`INFY`],a:"Self join on `m.emp_id = e.manager_id` with `e.salary > m.salary`. An inner join is correct — managerless employees cannot qualify anyway."},{q:`Find departments where no employee earns above X.`,d:2,p:`Advanced`,c:[`AMZ`,`GOOG`],a:"`GROUP BY dept HAVING MAX(salary) <= X`, or `NOT EXISTS` an employee above X. The HAVING form is one pass."},{q:`Find customers who ordered every product.`,d:3,p:`Advanced`,c:[`GOOG`,`AMZ`,`ORCL`],a:"Relational division: `HAVING COUNT(DISTINCT product_id) = (SELECT COUNT(*) FROM products)`, or nested `NOT EXISTS` — 'no product this customer lacks'."},{q:`Find customers who ordered A but not B.`,d:2,p:`Advanced`,c:[`AMZ`,`META`],a:"`HAVING SUM(product = 'A') > 0 AND SUM(product = 'B') = 0`, or `EXISTS` combined with `NOT EXISTS`. Conditional aggregation handles arbitrary per-group set logic in one pass."},{q:`Return the most recent order per customer.`,d:2,p:`Advanced`,c:[`AMZ`,`UBER`,`FLPK`],a:"`ROW_NUMBER() … ORDER BY order_date DESC, order_id DESC` filtered to 1. Add the id tiebreaker or same-day orders make the result non-deterministic."},{q:`Report month-over-month revenue growth.`,d:2,p:`Advanced`,c:[`AMZ`,`META`,`UBER`],a:"Aggregate to months, then `LAG(revenue) OVER (ORDER BY month)`. Guard the division with `NULLIF(prev,0)`, and generate a dense month series so missing months do not silently shift the comparison."},{q:`Build a cohort retention table.`,d:3,p:`Advanced`,c:[`META`,`UBER`,`SNAP`],a:"Cohort = the user's first activity month; offset = `TIMESTAMPDIFF(MONTH, cohort, activity)`; then pivot with `COUNT(DISTINCT CASE WHEN offset = n THEN user END)` divided by the pre-computed cohort size."},{q:`Compute funnel conversion between steps.`,d:3,p:`Advanced`,c:[`META`,`GOOG`,`SWGY`],a:`Collapse to one row per user with a flag per step, sum the flags, then divide adjacent totals. Ask whether steps must be **ordered** — that requires comparing per-step MIN timestamps.`},{q:`Compute DAU, MAU and stickiness.`,d:3,p:`Advanced`,c:[`META`,`SNAP`,`UBER`],a:"DAU is a daily `COUNT(DISTINCT user)`. Rolling MAU needs a correlated distinct count because rolling distinct is not decomposable — at scale, precompute a daily user table or use HyperLogLog."},{q:`Find users active N consecutive days.`,d:3,p:`Advanced`,c:[`META`,`GOOG`],a:"Gaps and islands: `date − ROW_NUMBER()` is constant within a streak, so group by it and filter `HAVING COUNT(*) >= N`. Deduplicate dates first."},{q:`Detect overlapping bookings or reservations.`,d:3,p:`Advanced`,c:[`UBER`,`ATLS`,`AMZ`],a:"Self join on the resource with `a.start < b.end AND b.start < a.end` and `b.id > a.id` to avoid duplicate pairs. Index `(resource_id, start)` or it is O(n²)."},{q:`Find the median value in MySQL.`,d:3,p:`Advanced`,c:[`META`,`GOOG`,`AMZ`],a:"Rank ascending and descending, keep rows where the two ranks are within one, and average them. PostgreSQL has `PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY x)`."},{q:`Swap adjacent rows (seat exchange).`,d:2,p:`Advanced`,c:[`AMZ`,`ADBE`],a:"`CASE WHEN id is the last odd id THEN id WHEN id odd THEN id+1 ELSE id-1 END`. Test the last-odd case first, or the generic odd rule swallows it."},{q:`Pivot with an unknown number of columns.`,d:3,p:`Advanced`,c:[`AMZ`,`SAP`,`MSFT`],a:"Generate the `SUM(CASE …)` list with `GROUP_CONCAT`, then run it as a prepared statement. Raise `group_concat_max_len` first or the generated SQL is silently truncated."},{q:`Find gaps in a sequence of ids.`,d:2,p:`Advanced`,c:[`AMZ`,`GS`],a:"`SELECT id + 1 AS gap_start FROM t WHERE NOT EXISTS (SELECT 1 FROM t t2 WHERE t2.id = t.id + 1)`, or use `LEAD(id) - id > 1` with a window."},{q:`Deduplicate rows keeping only the newest per key.`,d:2,p:`Advanced`,c:[`AMZ`,`FLPK`,`ADBE`],a:"`ROW_NUMBER() OVER (PARTITION BY key ORDER BY updated_at DESC) = 1` to select, or `> 1` to delete. Then add a unique constraint so it cannot recur."},{q:`Calculate a running balance from a transaction ledger.`,d:2,p:`Advanced`,c:[`GS`,`JPMC`,`PYPL`],a:"`SUM(amount) OVER (PARTITION BY account ORDER BY txn_time, txn_id ROWS UNBOUNDED PRECEDING)`. Include a tiebreaker so same-timestamp entries are deterministic."},{q:`Find the top N products making up 80% of revenue.`,d:3,p:`Advanced`,c:[`AMZ`,`WALM`,`MCK`],a:"Cumulative share: `SUM(rev) OVER (ORDER BY rev DESC) / SUM(rev) OVER ()`, then take rows up to the first exceeding 0.8."},{q:`Compare each row against the group average.`,d:2,p:`Advanced`,c:[`AMZ`,`ORCL`],a:"`AVG(v) OVER (PARTITION BY g)` in a subquery, then compare outside. Pre-window-function, join to a grouped derived table rather than using a correlated subquery."},{q:`Find the first and last event per user in one query.`,d:2,p:`Advanced`,c:[`META`,`AMZ`],a:"`MIN(ts)` and `MAX(ts)` grouped by user for the timestamps; to get the *rows*, use `FIRST_VALUE`/`LAST_VALUE` with a full frame, or two ranked subqueries."},{q:`Compute time between consecutive events per user.`,d:2,p:`Advanced`,c:[`UBER`,`SWGY`,`META`],a:"`TIMESTAMPDIFF(SECOND, LAG(ts) OVER (PARTITION BY user ORDER BY ts), ts)`. The first event per user is NULL, which is correct and should not be coalesced to zero."},{q:`Find employees hired in the same month as their manager.`,d:2,p:`Advanced`,c:[`TCS`,`AMZ`],a:"Self join on the manager relationship, comparing `DATE_FORMAT(e.hire_date,'%Y-%m') = DATE_FORMAT(m.hire_date,'%Y-%m')`. Non-sargable, but the join is already driving the plan."},{q:`Rank customers into deciles by spend.`,d:2,p:`Advanced`,c:[`WALM`,`MCK`,`AMZ`],a:"`NTILE(10) OVER (ORDER BY total_spend DESC)` over a pre-aggregated per-customer total. Remainder rows land in the earlier buckets."},{q:`Return rows where a JSON field matches a value.`,d:2,p:`Advanced`,c:[`ATLS`,`GOOG`,`SFDC`],a:"`WHERE JSON_EXTRACT(doc, '$.status') = 'active'` or the `->>` shorthand. Add a generated column plus an index on the extracted path, or every query is a full scan."},{q:`Find the second most recent order per customer.`,d:3,p:`Advanced`,c:[`AMZ`,`UBER`],a:"`ROW_NUMBER() OVER (PARTITION BY cust ORDER BY date DESC) = 2`. Customers with only one order correctly produce no row — decide whether that is intended before writing it."},{q:`Identify customers whose spend increased three months in a row.`,d:3,p:`Advanced`,c:[`AMZ`,`META`,`WALM`],a:"Monthly totals, then `LAG(v,1)` and `LAG(v,2)` compared against `v`. For arbitrary N, use the island technique on a boolean 'increased' flag."},{q:`Return one random row efficiently from a large table.`,d:3,p:`Advanced`,c:[`GOOG`,`AMZ`],a:"`ORDER BY RAND() LIMIT 1` sorts the whole table. Instead pick a random id in the key range and take the first row at or above it, or sample by a precomputed random column with an index."},{q:`What is an RDBMS and who defined the relational model?`,d:1,p:`Theory`,c:[`TCS`,`INFY`,`IBM`],a:`A database organising data into relations (tables) of tuples (rows), defined by E. F. Codd in 1970. SQL is the query language; the relational model is the underlying mathematics of sets and predicates.`},{q:`What is the difference between a database, a schema and a table?`,d:1,p:`Theory`,c:[`TCS`,`COG`],a:`A database is a container of schemas; a schema is a namespace of tables and other objects; a table is a relation. In MySQL 'database' and 'schema' are synonyms, which differs from PostgreSQL and Oracle.`},{q:`What is the difference between DBMS and RDBMS?`,d:1,p:`Theory`,c:[`TCS`,`INFY`,`WIPRO`],a:`A DBMS stores data with no required relational structure; an RDBMS enforces the relational model — tables, keys, referential integrity and set-based operations expressible in SQL.`},{q:`What is a relation, a tuple and an attribute?`,d:1,p:`Theory`,c:[`IBM`,`ORCL`,`TCS`],a:`The formal names for table, row and column. A relation is a set of tuples, which is why duplicate rows and row order are formally meaningless — a real SQL table is a bag, not a set, unless a key enforces uniqueness.`},{q:`What is cardinality and degree?`,d:1,p:`Theory`,c:[`IBM`,`TCS`],a:`Cardinality is the number of rows; degree is the number of columns. In optimiser terminology, cardinality also means the estimated number of rows a step produces.`},{q:`Compare InnoDB and MyISAM.`,d:2,p:`Theory`,c:[`AMZ`,`TCS`,`ORCL`],a:"InnoDB: transactional, row-level locking, foreign keys, crash recovery, clustered index — the default since 5.5. MyISAM: table-level locking, no transactions, no FKs, but an instant `COUNT(*)`. Use InnoDB."},{q:`What is the difference between MySQL and PostgreSQL?`,d:2,p:`Theory`,c:[`AMZ`,`GOOG`,`ATLS`],a:"PostgreSQL is stricter and richer — real booleans, arrays, `FILTER`, `MATERIALIZED VIEW`, partial indexes, row-level security, and READ COMMITTED default. MySQL is simpler to operate and historically faster on read-heavy simple workloads. Both are excellent now."},{q:`When would you choose NoSQL over an RDBMS?`,d:2,p:`Theory`,c:[`AMZ`,`MSFT`,`GOOG`],a:`Single-key access at very high volume with no joins, genuinely heterogeneous documents, or write scaling beyond one primary with eventual consistency acceptable. You give up joins, multi-row transactions and constraints — and JSON columns cover the schema-flexibility case without leaving SQL.`},{q:`What is the CAP theorem?`,d:2,p:`Theory`,c:[`AMZ`,`GOOG`,`MSFT`],a:`Under a network **partition** a distributed system must choose between consistency and availability. It says nothing about the non-partitioned case, where the real trade-off is latency versus consistency (the PACELC refinement).`},{q:`What is eventual consistency?`,d:2,p:`Theory`,c:[`AMZ`,`UBER`],a:`Replicas converge given no new writes, but a read may return stale data meanwhile. Read replicas in MySQL are eventually consistent — routing a read to a replica immediately after a write can return the old row.`},{q:`What is an index-organized table?`,d:2,p:`Theory`,c:[`ORCL`,`MSFT`],a:`A table stored inside its primary key's B-tree rather than as a separate heap — Oracle's IOT, SQL Server's clustered index, and InnoDB's only storage model. Heap tables (PostgreSQL, Oracle default) store rows unordered with all indexes secondary.`},{q:`What is a write-ahead log?`,d:2,p:`Theory`,c:[`AMZ`,`GOOG`,`ORCL`],a:`Changes are written to a sequential log and fsynced **before** the data pages are updated, so a crash can be recovered by replaying it. InnoDB's redo log; PostgreSQL's WAL. It is what makes durability affordable — sequential writes instead of random ones.`},{q:`What is a checkpoint?`,d:3,p:`Theory`,c:[`ORCL`,`AMZ`],a:"Flushing dirty buffer-pool pages to disk and recording that point in the log, so recovery need only replay from there. Aggressive checkpointing shortens recovery but adds I/O; that is the tuning trade-off behind `innodb_max_dirty_pages_pct`."},{q:`What is a covering versus a filtering predicate in optimiser terms?`,d:3,p:`Theory`,c:[`MSFT`,`ORCL`],a:`An access predicate narrows the index range scanned; a filter predicate is evaluated on rows already retrieved. Only access predicates reduce I/O, which is why column order in a composite index matters so much.`},{q:`What are the ANSI SQL standards?`,d:1,p:`Theory`,c:[`ORCL`,`IBM`,`TCS`],a:`SQL-86 through SQL:2023. Key milestones: SQL-92 (outer joins, the modern JOIN syntax), SQL:1999 (recursive CTEs, triggers), SQL:2003 (window functions, MERGE), SQL:2016 (JSON, row pattern matching). No engine implements all of it.`},{q:`What is the difference between a bag and a set in SQL?`,d:2,p:`Theory`,c:[`IBM`,`ORCL`],a:"The relational model uses sets (no duplicates, no order); SQL tables are bags (duplicates allowed) unless a key prevents them. This is why `DISTINCT` and `UNION ALL` both exist — the language exposes both semantics."}],me=[{q:`What is replication and what is it for?`,d:2,p:`Ops`,c:[`AMZ`,`UBER`,`FLPK`],a:`The primary streams its binary log to replicas that replay it. Used for read scaling, high availability, backups without loading the primary, and geographic locality. Replicas are eventually consistent.`},{q:`Difference between asynchronous, semi-synchronous and synchronous replication?`,d:3,p:`Ops`,c:[`AMZ`,`GOOG`,`UBER`],a:`Async: the primary commits without waiting — fastest, can lose transactions on failover. Semi-sync: waits for at least one replica to acknowledge receipt. Synchronous (Group Replication, Galera): waits for a quorum to apply — safest, highest latency.`},{q:`What is replication lag and how do you handle it?`,d:2,p:`Ops`,c:[`AMZ`,`UBER`,`SWGY`],a:"The delay before a replica catches up. Handle it by routing reads that must be fresh to the primary, using read-your-writes routing after a write, or waiting on the GTID. Monitor `Seconds_Behind_Master` and, better, actual GTID lag."},{q:`What are the binary log formats?`,d:2,p:`Ops`,c:[`AMZ`,`ORCL`],a:`STATEMENT (logs the SQL — compact but unsafe for non-deterministic functions), ROW (logs actual row images — safe, larger), MIXED (switches automatically). ROW is the default and the right choice.`},{q:`Difference between a logical and a physical backup?`,d:2,p:`Ops`,c:[`AMZ`,`ORCL`,`IBM`],a:"Logical (`mysqldump`) produces SQL text — portable, restorable selectively, slow on large data. Physical (`xtrabackup`, filesystem snapshot) copies the data files — fast to restore, version- and platform-specific."},{q:`What is point-in-time recovery?`,d:2,p:`Ops`,c:[`GS`,`AMZ`,`JPMC`],a:`Restore the last full backup, then replay the binary log up to just before the bad statement. It requires binary logging enabled and retained — without it, a backup only gets you to its own timestamp.`},{q:`How do you test that a backup works?`,d:1,p:`Ops`,c:[`GS`,`AMZ`,`DELOITTE`],a:`Restore it to a separate host and run consistency checks. An untested backup is not a backup — silent corruption, missing tables and permission problems only surface on restore.`},{q:`What is sharding and what does it cost you?`,d:3,p:`Ops`,c:[`AMZ`,`UBER`,`GOOG`,`FLPK`],a:`Splitting data across independent databases by a shard key. You gain write scaling and lose cross-shard joins, cross-shard transactions and global uniqueness. Choosing a shard key that avoids hotspots and rarely needs cross-shard queries is the whole problem.`},{q:`Difference between vertical and horizontal scaling?`,d:1,p:`Ops`,c:[`AMZ`,`TCS`],a:`Vertical = a bigger machine, simple but bounded and a single point of failure. Horizontal = more machines via replicas (reads) or shards (writes), unbounded but adds consistency and operational complexity.`},{q:`What is connection pooling and why does it matter?`,d:2,p:`Ops`,c:[`AMZ`,`ATLS`,`PYPL`],a:`Reusing a fixed set of connections instead of opening one per request. Each MySQL connection costs a thread and memory, so thousands of direct connections exhaust the server. ProxySQL or a client-side pool caps concurrency.`},{q:`What is a read replica used for, and what must you not do with it?`,d:2,p:`Ops`,c:[`AMZ`,`UBER`],a:`Offload reporting and read-heavy traffic. Do not write to it, and do not read from it immediately after a write that the user must see — replication lag makes that stale.`},{q:`How do you migrate a schema with zero downtime?`,d:3,p:`Ops`,c:[`GOOG`,`AMZ`,`ATLS`],a:`Expand-migrate-contract: add the new structure, dual-write, backfill, switch reads, then drop the old. Each deploy must be compatible with the previous code version — never rename in one step.`},{q:`What is a blue-green or shadow table deployment for schema changes?`,d:3,p:`Ops`,c:[`GOOG`,`UBER`],a:"Tools like gh-ost and pt-online-schema-change create a shadow table with the new schema, backfill it, keep it in sync via triggers or the binlog, then swap atomically with `RENAME TABLE`. Avoids the long lock of a COPY-algorithm ALTER."},{q:`How do you monitor database health?`,d:2,p:`Ops`,c:[`AMZ`,`UBER`,`ATLS`],a:"Watch replication lag, buffer pool hit ratio, active connections and thread counts, slow query counts, lock waits and deadlocks, InnoDB history list length (long transactions), and disk headroom. `performance_schema` and `sys` expose most of it."},{q:`What is the InnoDB history list length and why watch it?`,d:3,p:`Ops`,c:[`AMZ`,`GOOG`],a:`The number of undo log entries not yet purged. It grows when a long transaction pins old row versions, bloating storage and slowing reads that must walk version chains. A steadily rising value means a forgotten open transaction.`},{q:`List all tables in the current database.`,d:1,p:`Ops`,c:[`TCS`,`INFY`],a:"`SHOW TABLES`, or portably `SELECT table_name FROM information_schema.tables WHERE table_schema = DATABASE()`."},{q:`Show the definition of a table.`,d:1,p:`Ops`,c:[`TCS`,`AMZ`],a:"`SHOW CREATE TABLE t` gives the full DDL including indexes and options; `DESCRIBE t` gives a column summary."},{q:`Find the largest tables in a database.`,d:2,p:`Ops`,c:[`AMZ`,`TCS`],a:"Query `information_schema.tables` summing `data_length + index_length`, ordered descending. Note the row count there is an estimate for InnoDB, not exact.",sql:`SELECT table_name, ROUND((data_length+index_length)/1024/1024) mb FROM information_schema.tables WHERE table_schema = DATABASE() ORDER BY mb DESC;`},{q:`List all indexes on a table and spot unused ones.`,d:2,p:`Ops`,c:[`AMZ`,`MSFT`],a:"`SHOW INDEX FROM t`, or `information_schema.statistics`. For unused ones, `sys.schema_unused_indexes` — dropping them speeds up writes with no read cost."},{q:`Find currently running queries and kill one.`,d:2,p:`Ops`,c:[`AMZ`,`UBER`],a:"`SHOW FULL PROCESSLIST` or `performance_schema.processlist`, then `KILL <id>`. Killing a long DDL may leave a rollback running for as long as the statement took."},{q:`Check for blocking locks.`,d:3,p:`Ops`,c:[`AMZ`,`GOOG`,`ORCL`],a:"`SHOW ENGINE INNODB STATUS` for the latest deadlock, or `performance_schema.data_locks` and `data_lock_waits` for the current wait graph — the latter identifies exactly which transaction blocks which."},{q:`Copy a table's structure without its data.`,d:1,p:`Ops`,c:[`TCS`,`AMZ`],a:"`CREATE TABLE new LIKE old` — copies indexes and options too. `CREATE TABLE new AS SELECT * FROM old WHERE 0` copies columns but **not** indexes, constraints or auto-increment."},{q:`Rename a database.`,d:2,p:`Ops`,c:[`TCS`,`AMZ`],a:"There is no `RENAME DATABASE`. Create the new schema and `RENAME TABLE old.t TO new.t` for each table, which is atomic per table, then drop the empty old schema."},{q:`Find columns of a given name across all tables.`,d:2,p:`Ops`,c:[`AMZ`,`DELOITTE`],a:"Query `information_schema.columns` filtered on `column_name` — the standard way to assess the blast radius of a schema change.",sql:`SELECT table_name FROM information_schema.columns WHERE column_name = 'cust_id' AND table_schema = DATABASE();`},{q:`Export query results to a file.`,d:1,p:`Ops`,c:[`TCS`,`AMZ`],a:"`SELECT … INTO OUTFILE '/path/f.csv' FIELDS TERMINATED BY ','` writes on the **server** and needs FILE privilege plus `secure_file_priv`. Client-side, use `mysql -e '…' > f.tsv`."},{q:`How do you check the MySQL version and current settings?`,d:1,p:`Ops`,c:[`TCS`,`INFY`],a:"`SELECT VERSION()`, `SHOW VARIABLES LIKE 'innodb%'`, `SELECT @@sql_mode`. Checking `sql_mode` first explains most 'why does this behave differently here' questions."},{q:`What is sql_mode and which settings matter?`,d:2,p:`Ops`,c:[`AMZ`,`ORCL`],a:"A per-session set of behaviour flags. `STRICT_TRANS_TABLES` turns silent truncation into errors, `ONLY_FULL_GROUP_BY` enforces the grouping rule, `ERROR_FOR_DIVISION_BY_ZERO` raises instead of returning NULL. Modern defaults enable all three."},{q:`Find the number of rows in every table quickly.`,d:2,p:`Ops`,c:[`AMZ`,`TCS`],a:"`information_schema.tables.TABLE_ROWS` is instant but approximate for InnoDB. Exact counts require `COUNT(*)` per table, which scans. State which one the situation needs."},{q:`How do you detect and fix table fragmentation?`,d:3,p:`Ops`,c:[`AMZ`,`ORCL`],a:"Compare `data_free` against `data_length` in `information_schema.tables`. `OPTIMIZE TABLE` rebuilds it (an online ALTER in InnoDB), reclaiming space and re-densifying pages — worth doing after a very large delete."},{q:`What does FLUSH PRIVILEGES do and when do you need it?`,d:2,p:`Ops`,c:[`TCS`,`AMZ`],a:"Reloads the grant tables into memory. Only needed if you modified the `mysql.user` tables **directly** with DML. `GRANT` and `REVOKE` update memory themselves, so it is unnecessary — and editing the tables directly is discouraged."},{q:`Explain the difference between mysqldump and mysqlpump / xtrabackup.`,d:2,p:`Ops`,c:[`AMZ`,`ORCL`],a:"`mysqldump` is single-threaded logical export. `mysqlpump` parallelises it. `xtrabackup` is a hot **physical** backup that copies data files with redo-log tracking — the practical choice above a few hundred gigabytes."},{q:`How would you find which query is consuming the most I/O?`,d:3,p:`Ops`,c:[`AMZ`,`GOOG`],a:"`sys.statement_analysis` or `performance_schema.events_statements_summary_by_digest`, sorting by rows examined or total latency. The ratio of rows examined to rows sent is the single best indicator of a missing index."},{q:`What is the difference between rows examined and rows sent?`,d:2,p:`Ops`,c:[`AMZ`,`GOOG`,`MSFT`],a:`Examined is what the engine read; sent is what the client received. A ratio of 1000:1 means the server is reading a thousand rows to return one — almost always a missing or wrong index.`}],he=[{q:`Write a query to list all employees hired in 2024.`,d:1,p:`Basics`,c:[`TCS`,`INFY`],a:`Half-open range on the bare column so the index applies.`,sql:`WHERE hire_date >= '2024-01-01' AND hire_date < '2025-01-01'`},{q:`List the 5 most recent orders.`,d:1,p:`Basics`,c:[`TCS`,`AMZ`],a:"`ORDER BY order_date DESC, order_id DESC LIMIT 5`. The id tiebreaker makes the result deterministic when dates collide."},{q:`Return only rows where a text column is empty or whitespace.`,d:1,p:`Basics`,c:[`TCS`,`COG`],a:"`WHERE TRIM(col) = '' OR col IS NULL`. Note `''` and NULL are different — check both if either can occur."},{q:`Select every third row from a table.`,d:2,p:`Basics`,c:[`ZOHO`,`TCS`],a:"`WHERE MOD(ROW_NUMBER() OVER (ORDER BY id), 3) = 0` in a subquery. Using `MOD(id, 3)` is wrong the moment ids have gaps."},{q:`Find rows where two columns are equal, handling NULLs.`,d:2,p:`Null`,c:[`AMZ`,`GS`],a:"`WHERE a <=> b` in MySQL, or `WHERE a IS NOT DISTINCT FROM b` in PostgreSQL. Plain `a = b` drops rows where both are NULL."},{q:`Return the count of orders per status including statuses with zero.`,d:2,p:`Aggregate`,c:[`AMZ`,`META`],a:"LEFT JOIN from a statuses lookup table and `COUNT(o.order_id)`. A GROUP BY on orders alone can only emit statuses that occur."},{q:`Show each department's headcount as a percentage of the company.`,d:2,p:`Aggregate`,c:[`AMZ`,`MCK`],a:"`100.0 * COUNT(*) / SUM(COUNT(*)) OVER ()` — a window over the grouped result gives the grand total without a second query."},{q:`Find the department with the highest average salary.`,d:2,p:`Aggregate`,c:[`TCS`,`AMZ`,`INFY`],a:"`GROUP BY dept ORDER BY AVG(salary) DESC LIMIT 1`, or rank the averages to return all ties."},{q:`List customers whose total spend exceeds 10000.`,d:1,p:`Aggregate`,c:[`TCS`,`AMZ`],a:"`GROUP BY cust_id HAVING SUM(amount) > 10000` — the condition is about a group, so it must be HAVING."},{q:`Count how many orders each customer placed last month.`,d:1,p:`Aggregate`,c:[`TCS`,`FLPK`],a:"Filter the date range in WHERE, group by customer, `COUNT(*)`. Use LEFT JOIN from customers if zero-order customers must appear."},{q:`Find products whose price is above the category average.`,d:2,p:`Window`,c:[`AMZ`,`ADBE`],a:"`AVG(price) OVER (PARTITION BY category)` in a subquery, then compare. Pre-window, join to a grouped derived table."},{q:`List the cheapest product in each category.`,d:2,p:`Window`,c:[`AMZ`,`FLPK`,`WALM`],a:"`ROW_NUMBER() OVER (PARTITION BY category ORDER BY price) = 1`, or join back to a `MIN(price)` derived table if ties should all appear."},{q:`Show the difference between each employee's salary and the department maximum.`,d:2,p:`Window`,c:[`AMZ`,`MSFT`],a:"`MAX(salary) OVER (PARTITION BY dept) - salary`. One pass, detail preserved."},{q:`Number the orders of each customer chronologically.`,d:1,p:`Window`,c:[`AMZ`,`UBER`],a:"`ROW_NUMBER() OVER (PARTITION BY cust_id ORDER BY order_date, order_id)` — the id keeps same-day orders in a stable sequence."},{q:`Flag each customer's first ever order.`,d:2,p:`Window`,c:[`AMZ`,`SWGY`],a:"`ROW_NUMBER() OVER (PARTITION BY cust_id ORDER BY order_date) = 1`, or compare `order_date = MIN(order_date) OVER (PARTITION BY cust_id)` to catch ties."},{q:`Compute the percentage change from the first value in each group.`,d:2,p:`Window`,c:[`META`,`GS`],a:"`100.0 * (v - FIRST_VALUE(v) OVER w) / FIRST_VALUE(v) OVER w` with `w` ordered by time — an indexed baseline comparison."},{q:`Find the three most recent logins per user.`,d:2,p:`Window`,c:[`META`,`AMZ`,`SNAP`],a:"`ROW_NUMBER() OVER (PARTITION BY user ORDER BY ts DESC) <= 3` in a subquery."},{q:`Compute a running count of distinct days a user was active.`,d:3,p:`Window`,c:[`META`,`SNAP`],a:"Windows cannot do rolling distinct. Deduplicate to one row per (user, day) first, then a plain running `COUNT(*)` over that is correct."},{q:`Write an anti-join to find orders whose customer no longer exists.`,d:2,p:`Joins`,c:[`AMZ`,`GS`],a:"`WHERE NOT EXISTS (SELECT 1 FROM customers c WHERE c.cust_id = o.cust_id)` — an orphan check, which a foreign key would have prevented."},{q:`List departments with no employees.`,d:1,p:`Joins`,c:[`TCS`,`AMZ`,`INFY`],a:"`LEFT JOIN employees … WHERE e.emp_id IS NULL`, or `NOT EXISTS`. Test the IS NULL on a non-nullable column of the right table."},{q:`Join three tables and return one row per order with customer and total.`,d:2,p:`Joins`,c:[`AMZ`,`FLPK`],a:"Aggregate `order_items` in a derived table first, then join — joining line items directly duplicates the order row per line."},{q:`Find pairs of customers in the same city.`,d:2,p:`Joins`,c:[`AMZ`,`TCS`],a:"Self join on city with `b.cust_id > a.cust_id` so each pair appears once and nobody pairs with themselves."},{q:`Return orders together with the customer's previous order date.`,d:2,p:`Window`,c:[`AMZ`,`UBER`],a:"`LAG(order_date) OVER (PARTITION BY cust_id ORDER BY order_date)`. Before window functions this needed a correlated MAX subquery."},{q:`Find the busiest hour of the day across all orders.`,d:2,p:`Date`,c:[`SWGY`,`ZOMT`,`UBER`],a:"`GROUP BY HOUR(order_time) ORDER BY COUNT(*) DESC LIMIT 1`. Filter the date range on the bare column so the index still applies."},{q:`Report revenue by weekday name in calendar order.`,d:2,p:`Date`,c:[`WALM`,`SWGY`],a:"Group by `WEEKDAY(d)` for the ordering and select `DAYNAME(d)` for display — grouping by the name alone sorts alphabetically."},{q:`Find records created in the last hour.`,d:1,p:`Date`,c:[`AMZ`,`UBER`],a:"`WHERE created_at >= NOW() - INTERVAL 1 HOUR`. Note `NOW()` is evaluated once per statement, not per row."},{q:`Calculate the number of days each order took to ship.`,d:1,p:`Date`,c:[`AMZ`,`FLPK`],a:"`DATEDIFF(shipped_at, order_date)` — arguments are (later, earlier). Reverse them and every value is negative."},{q:`Find orders shipped later than promised.`,d:2,p:`Date`,c:[`AMZ`,`FLPK`,`WALM`],a:"`WHERE shipped_at > promised_at` — a plain column comparison, fully sargable if a composite index exists, though such predicates rarely use one."},{q:`Return the current quarter's data only.`,d:2,p:`Date`,c:[`GS`,`DELOITTE`],a:"Compute the quarter start as a constant and use a half-open range. `QUARTER(d) = QUARTER(CURDATE())` also matches other years and is non-sargable."},{q:`Round a number to the nearest 5.`,d:2,p:`Numeric`,c:[`ZOHO`,`TCS`],a:"`ROUND(x/5) * 5`. For rounding down use `FLOOR(x/5)*5`. Same trick buckets values into any interval."},{q:`Compute a percentage safely when the denominator can be zero.`,d:1,p:`Numeric`,c:[`AMZ`,`GS`,`META`],a:"`100.0 * a / NULLIF(b, 0)`. Multiply by `100.0` not `100`, or integer arithmetic truncates the result to 0."},{q:`Convert a stored string of digits to a number for sorting.`,d:2,p:`Numeric`,c:[`TCS`,`GS`],a:"`CAST(col AS UNSIGNED)` or `col + 0`. Both disable the index, so the real fix is to store it as an integer column."},{q:`Find rows where a decimal has more precision than expected.`,d:2,p:`Numeric`,c:[`GS`,`JPMC`],a:"`WHERE amount <> ROUND(amount, 2)` — catches values that will round unexpectedly in reporting."},{q:`Insert a row only if it does not already exist.`,d:2,p:`DML`,c:[`AMZ`,`TCS`],a:"`INSERT … ON DUPLICATE KEY UPDATE id = id` (a no-op update), or `INSERT … SELECT … WHERE NOT EXISTS`. Both need a unique constraint to be reliable under concurrency."},{q:`Update every row's value based on another column.`,d:1,p:`DML`,c:[`TCS`,`INFY`],a:"`UPDATE t SET total = qty * price`. In MySQL an UPDATE without WHERE is blocked in safe-update mode — a deliberate guardrail."},{q:`Swap the values of two columns in one statement.`,d:1,p:`DML`,c:[`TCS`,`ZOHO`],a:"`UPDATE t SET a = b, b = a` — the right-hand sides are evaluated against the pre-update row, so no temporary column is required."},{q:`Archive rows older than a year into another table then delete them.`,d:2,p:`DML`,c:[`AMZ`,`GS`],a:"`INSERT INTO archive SELECT … WHERE d < …` then `DELETE … WHERE d < …`, both in one transaction, batched. Or drop a date partition if the table is partitioned."},{q:`Increment a counter atomically.`,d:2,p:`DML`,c:[`AMZ`,`PYPL`],a:"`UPDATE t SET n = n + 1 WHERE id = ?` — atomic. Reading then writing from the application loses concurrent updates."},{q:`Set a column to the row's rank within its group.`,d:3,p:`DML`,c:[`AMZ`,`MSFT`],a:"Compute the rank in a derived table, then `UPDATE t JOIN (…) x ON x.id = t.id SET t.rnk = x.rnk`. MySQL cannot use a window function directly in SET."},{q:`Find and remove orphaned child rows.`,d:2,p:`DML`,c:[`GS`,`AMZ`],a:"`DELETE c FROM child c LEFT JOIN parent p ON p.id = c.parent_id WHERE p.id IS NULL`. Then add the missing foreign key so it cannot recur."},{q:`Copy a table including its indexes.`,d:1,p:`DDL`,c:[`TCS`,`AMZ`],a:"`CREATE TABLE new LIKE old; INSERT INTO new SELECT * FROM old;`. `CREATE TABLE … AS SELECT` copies columns only, losing indexes, constraints and auto-increment."},{q:`Add a NOT NULL column to an existing populated table.`,d:2,p:`DDL`,c:[`AMZ`,`MSFT`],a:"Add it nullable with a default, backfill in batches, then `ALTER … MODIFY … NOT NULL`. Adding NOT NULL without a default fails or rewrites the whole table."},{q:`Enforce that an email is unique but case-insensitive.`,d:2,p:`DDL`,c:[`AMZ`,`ATLS`],a:"The default `_ci` collation already does it. Under a binary collation, add a STORED generated column `LOWER(email)` with a unique index on it."},{q:`Constrain a column to a fixed set of values.`,d:1,p:`DDL`,c:[`TCS`,`AMZ`],a:"A `CHECK (status IN (…))` from MySQL 8.0.16, an ENUM, or a lookup table with a foreign key. The lookup table is the most flexible and the most portable."},{q:`Prevent two rows having the same value only when active.`,d:3,p:`DDL`,c:[`ATLS`,`GOOG`],a:"A partial unique index `WHERE deleted_at IS NULL` in PostgreSQL. MySQL has none — emulate with a generated column that is NULL when inactive, since multiple NULLs are allowed in a unique index."},{q:`Add a foreign key to an existing table with bad data.`,d:2,p:`DDL`,c:[`AMZ`,`GS`],a:"Find and fix orphans first with an anti-join, otherwise the ALTER fails. Or add it with `NOT ENFORCED` where supported, clean up, then enforce."},{q:`Write a query that returns nothing but validates the schema.`,d:2,p:`Ops`,c:[`AMZ`,`DELOITTE`],a:"`SELECT * FROM t WHERE 1=0` — returns column metadata with no rows, a cheap way to check a table's shape from an application."},{q:`Detect rows violating a business rule you cannot express as a constraint.`,d:2,p:`Ops`,c:[`GS`,`DELOITTE`],a:`A scheduled data-quality query returning offenders, run as an EVENT or an external job with alerting. Constraints prevent; audits detect what constraints cannot express.`},{q:`Find columns with a high proportion of NULLs.`,d:2,p:`Ops`,c:[`DELOITTE`,`MCK`],a:"`SELECT COUNT(*) - COUNT(col) FROM t` per column, or generate the query from `information_schema.columns`. A near-total NULL column usually signals a modelling problem."},{q:`Identify tables with no primary key.`,d:2,p:`Ops`,c:[`AMZ`,`MSFT`],a:"Query `information_schema.tables` LEFT JOIN `table_constraints` filtering for a missing PRIMARY KEY. In InnoDB such tables get a hidden row id and replicate badly under ROW format."},{q:`Compare two tables for differences.`,d:2,p:`Advanced`,c:[`GS`,`DELOITTE`,`AMZ`],a:"Full outer join on the key (emulated with UNION in MySQL) and compare columns null-safely, or `(A EXCEPT B) UNION ALL (B EXCEPT A)` for the symmetric difference."},{q:`Validate that a migration copied every row correctly.`,d:2,p:`Ops`,c:[`GS`,`AMZ`],a:`Compare counts, then compare checksums of the sorted key plus a hash of the data columns, in batches. Comparing only counts misses corrupted values.`},{q:`Find the top 3 customers by revenue in each country.`,d:2,p:`Advanced`,c:[`AMZ`,`WALM`,`FLPK`],a:"Aggregate revenue per (country, customer) in a CTE, then `ROW_NUMBER() OVER (PARTITION BY country ORDER BY revenue DESC) <= 3`."},{q:`Calculate each product's contribution to its category's revenue.`,d:2,p:`Advanced`,c:[`AMZ`,`WALM`],a:"`SUM(rev) / SUM(SUM(rev)) OVER (PARTITION BY category)` — a window over the grouped result, no second pass required."},{q:`Find customers who bought in every month of 2024.`,d:3,p:`Advanced`,c:[`AMZ`,`WALM`],a:"`GROUP BY cust HAVING COUNT(DISTINCT MONTH(order_date)) = 12` after filtering to 2024 — relational division over the month dimension."},{q:`Find the longest gap between consecutive orders per customer.`,d:3,p:`Advanced`,c:[`AMZ`,`UBER`],a:"`MAX(DATEDIFF(order_date, LAG(order_date) OVER (PARTITION BY cust ORDER BY order_date)))` computed in a subquery then aggregated."},{q:`Identify customers who churned — no order in 90 days but active before.`,d:2,p:`Advanced`,c:[`SWGY`,`ZOMT`,`UBER`],a:"`GROUP BY cust HAVING MAX(order_date) < CURDATE() - INTERVAL 90 DAY AND COUNT(*) >= 1`. Define 'active before' explicitly — interviewers leave it ambiguous on purpose."},{q:`Compute repeat purchase rate.`,d:2,p:`Advanced`,c:[`FLPK`,`AMZ`,`SWGY`],a:"Customers with ≥2 orders divided by customers with ≥1: `SUM(n >= 2) / COUNT(*)` over a per-customer order-count subquery."},{q:`Find the first product each customer ever bought.`,d:2,p:`Advanced`,c:[`AMZ`,`FLPK`],a:"`ROW_NUMBER() OVER (PARTITION BY cust ORDER BY order_date, order_id, item_id) = 1` across the joined order/item rows — the extra tiebreakers matter when one order has many lines."},{q:`Report the ratio of new to returning customers per month.`,d:3,p:`Advanced`,c:[`SWGY`,`META`,`AMZ`],a:`Compute each customer's first order month, join to monthly orders, and count distinct customers where the order month equals or exceeds the first month.`},{q:`Find the most common pair of products bought together.`,d:3,p:`Advanced`,c:[`AMZ`,`WALM`,`FLPK`],a:"Self join `order_items` on the same order with `b.product_id > a.product_id`, group by the pair, order by count. Market-basket analysis in one query."},{q:`List orders whose total does not match the sum of their line items.`,d:2,p:`Advanced`,c:[`GS`,`AMZ`],a:`Join the stored total against an aggregated line-item sum and compare with a tolerance for decimals. A stored total that can drift is exactly why derived values are risky.`},{q:`Find duplicate customers by fuzzy name match.`,d:3,p:`Advanced`,c:[`DELOITTE`,`GS`],a:"Normalise (lower, strip punctuation) into a generated column and group on it, or use `SOUNDEX`/edit distance for true fuzziness — but do the heavy matching outside the database."},{q:`Rank salespeople and show the gap to the person above them.`,d:2,p:`Advanced`,c:[`AMZ`,`SFDC`],a:"`RANK() OVER (ORDER BY sales DESC)` plus `LAG(sales) OVER (ORDER BY sales DESC) - sales` for the gap."},{q:`Return a comma-separated list of each order's products.`,d:2,p:`Advanced`,c:[`AMZ`,`ZOHO`],a:"`GROUP_CONCAT(p.name ORDER BY p.name SEPARATOR ', ')` grouped by order — raise `group_concat_max_len` or long lists truncate silently."},{q:`Find the shortest and longest order value per customer in one row.`,d:2,p:`Advanced`,c:[`AMZ`,`TCS`],a:"`MIN(amount)`, `MAX(amount)` grouped by customer. To get the *orders* rather than the amounts, use ranked subqueries or FIRST_VALUE with a full frame."},{q:`Detect a sudden drop in daily volume.`,d:3,p:`Advanced`,c:[`META`,`UBER`,`GOOG`],a:"Compare each day against a trailing average: `daily < 0.5 * AVG(daily) OVER (ORDER BY d ROWS BETWEEN 7 PRECEDING AND 1 PRECEDING)`. Excluding the current row from the baseline is the important detail."},{q:`Return the row with the maximum value, breaking ties deterministically.`,d:2,p:`Advanced`,c:[`AMZ`,`MSFT`],a:"`ORDER BY value DESC, id ASC LIMIT 1`, or `ROW_NUMBER()` with the same keys. Without the tiebreaker the answer can change between runs."},{q:`Find employees whose salary is in the top 10% company-wide.`,d:2,p:`Advanced`,c:[`AMZ`,`MCK`],a:"`PERCENT_RANK() OVER (ORDER BY salary DESC) <= 0.1`, or `NTILE(10) = 1`. They differ on ties — say which semantics you want."},{q:`Compute a weighted average.`,d:2,p:`Advanced`,c:[`GS`,`MCK`,`DE`],a:"`SUM(value * weight) / SUM(weight)` — not `AVG(value)`. Guard the denominator with `NULLIF` when all weights could be zero."},{q:`Find the mode of a column per group.`,d:2,p:`Advanced`,c:[`AMZ`,`MCK`],a:"Count per (group, value), then `ROW_NUMBER() OVER (PARTITION BY group ORDER BY cnt DESC) = 1`. Use RANK to return all tied modes."}],ge=[{q:`How does LIMIT differ across MySQL, SQL Server and Oracle?`,d:1,p:`Theory`,c:[`ORCL`,`MSFT`,`TCS`],a:"MySQL/PostgreSQL `LIMIT n OFFSET m`; SQL Server `TOP n` or `OFFSET m ROWS FETCH NEXT n ROWS ONLY`; Oracle 12c+ `FETCH FIRST n ROWS ONLY` (older versions used `ROWNUM`)."},{q:`What is Oracle's ROWNUM and why is it tricky?`,d:2,p:`Theory`,c:[`ORCL`,`TCS`,`IBM`],a:"A pseudo-column assigned **as rows are produced**, before ORDER BY. `WHERE ROWNUM <= 10 ORDER BY x` gives ten arbitrary rows then sorts them — you must order in an inner query first."},{q:`What replaces AUTO_INCREMENT in other engines?`,d:1,p:`Theory`,c:[`ORCL`,`MSFT`,`IBM`],a:"SQL Server `IDENTITY(1,1)`; PostgreSQL `SERIAL` or `GENERATED ALWAYS AS IDENTITY`; Oracle uses a `SEQUENCE` plus a trigger, or an identity column from 12c."},{q:`What is a sequence and how does it differ from AUTO_INCREMENT?`,d:2,p:`Theory`,c:[`ORCL`,`IBM`],a:"A standalone object generating numbers, shareable across tables and callable independently with `NEXTVAL`. AUTO_INCREMENT is tied to one column of one table. Both produce gaps."},{q:`How do you emulate ISNULL / NVL / IFNULL portably?`,d:1,p:`Theory`,c:[`ORCL`,`MSFT`,`TCS`],a:"`COALESCE` — standard SQL and available everywhere. `IFNULL` is MySQL, `NVL` Oracle, `ISNULL` SQL Server."},{q:`Which engines support MERGE?`,d:2,p:`Theory`,c:[`ORCL`,`MSFT`,`IBM`],a:"Oracle, SQL Server, DB2 and PostgreSQL 15+. MySQL has none — use `ON DUPLICATE KEY UPDATE`. SQL Server's MERGE has documented concurrency hazards needing `HOLDLOCK`."},{q:`Which engines have real BOOLEAN and which fake it?`,d:1,p:`Theory`,c:[`ORCL`,`MSFT`,`AMZ`],a:"PostgreSQL has a true boolean. MySQL aliases it to `TINYINT(1)`. SQL Server uses `BIT`. Oracle had none until 23c. This is why `SUM(condition)` works in MySQL and errors in PostgreSQL."},{q:`How does string concatenation differ across engines?`,d:1,p:`Theory`,c:[`ORCL`,`MSFT`,`TCS`],a:"`||` in PostgreSQL and Oracle, `+` in SQL Server, `CONCAT()` in MySQL — where `||` means logical OR unless `PIPES_AS_CONCAT` is set."},{q:`How does the empty string behave in Oracle?`,d:2,p:`Theory`,c:[`ORCL`,`IBM`],a:"Oracle treats `''` as NULL, so `WHERE col = ''` never matches and `NOT NULL` columns reject it. Every other major engine treats it as a zero-length value. A genuine portability landmine."},{q:`What is the difference between TOP and LIMIT with ties?`,d:2,p:`Theory`,c:[`MSFT`,`ORCL`],a:"SQL Server's `TOP n WITH TIES` returns extra rows tying on the last ORDER BY value; Oracle has `FETCH FIRST n ROWS WITH TIES`. MySQL's `LIMIT` has no equivalent — use `RANK() <= n`."},{q:`Which engines support arrays?`,d:2,p:`Theory`,c:[`GOOG`,`ATLS`],a:"PostgreSQL natively, with `unnest` and GIN indexes. MySQL has JSON arrays with `JSON_TABLE` for expansion. Storing a list in a column still violates 1NF in both — use a child table unless the list is genuinely opaque."},{q:`Compare identity of a row across engines: ROWID, ctid, RID.`,d:3,p:`Theory`,c:[`ORCL`,`MSFT`],a:"Oracle `ROWID` is a physical address, stable until the row moves. PostgreSQL `ctid` changes on every update because of MVCC. InnoDB has no exposed row id when a primary key exists. None i
