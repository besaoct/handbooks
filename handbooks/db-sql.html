ansaction, so a `SIGNAL` in it aborts the insert. That is exactly how triggers enforce invariants."},{q:`Can a trigger call a stored procedure?`,d:2,p:`Proc`,c:[`ORCL`,`IBM`],a:`Yes, but it inherits the trigger's constraints — it cannot modify the table that fired it, and it runs per row, so any expense multiplies.`},{q:`Why can't a trigger modify the table that fired it in MySQL?`,d:2,p:`Proc`,c:[`AMZ`,`ORCL`],a:"It would risk infinite recursion and ambiguous semantics. Oracle raises a 'mutating table' error for the same reason. Use a BEFORE trigger to modify `NEW` instead — that changes the row being written without a second write."},{q:`What is the difference between a statement-level and a row-level trigger?`,d:2,p:`Proc`,c:[`ORCL`,`MSFT`],a:`A statement-level trigger fires once per statement regardless of row count; a row-level one fires per row. MySQL only supports row-level, which is why bulk operations with triggers are slow there.`},{q:`How do you find which query is holding a lock right now?`,d:3,p:`Txn`,c:[`AMZ`,`UBER`],a:"Join `performance_schema.data_lock_waits` to `data_locks` and `threads` to map blocker to blocked, then to `processlist` for the SQL text. `SHOW ENGINE INNODB STATUS` gives the last deadlock, not current waits."},{q:`What is lock escalation and does InnoDB do it?`,d:3,p:`Txn`,c:[`MSFT`,`ORCL`],a:`Converting many row locks into a table lock to save memory — SQL Server does it, InnoDB does **not**, because its lock representation is compact. InnoDB instead locks too much when the WHERE clause is unindexed.`},{q:`What is a phantom read in concrete terms?`,d:2,p:`Txn`,c:[`AMZ`,`ORCL`],a:"You run `SELECT COUNT(*) WHERE status='new'` twice in one transaction and get different answers because another session inserted a matching row. Gap locks under REPEATABLE READ prevent it in InnoDB."},{q:`Why does InnoDB take a lock on a row it does not change?`,d:3,p:`Txn`,c:[`AMZ`,`GOOG`],a:`Because it locks index entries as it examines them during the scan. Rows that fail the WHERE test are released in some cases, but the initial lock still causes contention — index the predicate.`},{q:`How do you reduce lock contention on a hot row?`,d:3,p:`Txn`,c:[`AMZ`,`PYPL`,`UBER`],a:`Shard the row into N counters and sum on read; batch updates; move the write out of the request path into a queue; or restructure so the hot value is derived rather than stored.`},{q:`What is the write path of a committed transaction?`,d:3,p:`Ops`,c:[`AMZ`,`ORCL`],a:`Change buffered in memory → undo entry written → redo log written and fsynced at commit → data pages flushed later by the checkpoint. Only the redo fsync is on the commit critical path, which is why sequential log writes make durability affordable.`},{q:`What is group commit?`,d:3,p:`Ops`,c:[`AMZ`,`ORCL`],a:`Batching several transactions' log fsyncs into one disk write, so throughput scales with concurrency rather than being capped by fsync latency. It is why a busy server can commit far more transactions per second than the disk's fsync rate suggests.`},{q:`Why is a UUID primary key sometimes still the right choice?`,d:3,p:`DDL`,c:[`ATLS`,`GOOG`],a:"When ids must be generated client-side or across shards without coordination, or when sequential ids leak business volume. Mitigate the index cost with UUIDv7 or `UUID_TO_BIN(u,1)` and store as BINARY(16), not CHAR(36)."},{q:`How much space does CHAR(36) versus BINARY(16) cost for a UUID?`,d:2,p:`DDL`,c:[`AMZ`,`GOOG`],a:`36 bytes versus 16 — and that difference is multiplied across the clustered index and **every** secondary index, since each carries the primary key as its pointer.`},{q:`What is the cost of an index on a frequently updated column?`,d:2,p:`Index`,c:[`AMZ`,`MSFT`],a:"Each update deletes the old index entry and inserts a new one, potentially splitting pages. An index on `updated_at` is more expensive than it looks and is often only needed for a small recent range."},{q:`How would you support 'search as you type' over a million names?`,d:3,p:`Index`,c:[`ATLS`,`AMZ`,`GOOG`],a:"A prefix index handles `LIKE 'ab%'` well. Infix matching needs a full-text index, a trigram index (PostgreSQL `pg_trgm`), or a dedicated search engine — a leading-wildcard LIKE will never scale."},{q:`What is the difference between a filtered index and a filtered query?`,d:2,p:`Index`,c:[`MSFT`,`GOOG`],a:`A filtered (partial) index stores only rows matching a predicate, so it is smaller and cheaper. The query still needs a compatible predicate for the optimiser to use it.`},{q:`How do you find the actual index usage of a table?`,d:2,p:`Index`,c:[`AMZ`,`MSFT`],a:"`performance_schema.table_io_waits_summary_by_index_usage`, or the `sys.schema_index_statistics` view. Zero reads over a representative period means the index is a pure write cost."},{q:`How do you decide the order of columns in a table definition?`,d:2,p:`DDL`,c:[`ORCL`,`AMZ`],a:`It rarely matters for correctness. For storage, grouping fixed-width columns and putting large variable-length ones last can help page density slightly. Readability — keys, then core fields, then timestamps — matters more.`},{q:`What is a check-then-act race and where does it appear in SQL?`,d:2,p:`Txn`,c:[`AMZ`,`PYPL`],a:`Reading a value, deciding, then writing — with a window between. Appears in inventory checks, unique-value insertion and job claiming. Collapse it into one conditional statement or take a lock.`},{q:`Why is INSERT … SELECT sometimes slower than expected?`,d:2,p:`Perf`,c:[`AMZ`,`WALM`],a:`It maintains every index on the target per row, holds a long transaction, and under REPEATABLE READ may take locks on the source rows it reads. Batch it and consider dropping non-essential indexes first.`},{q:`How do you speed up a very large UPDATE?`,d:2,p:`Perf`,c:[`AMZ`,`UBER`],a:`Batch by primary key range so each transaction is short, ensure the WHERE clause is indexed so locks are narrow, and avoid updating indexed columns unnecessarily.`},{q:`What is the difference between a covering index and an included-column index?`,d:3,p:`Index`,c:[`MSFT`,`GOOG`],a:"Both answer a query without touching the table. `INCLUDE` columns (SQL Server, PostgreSQL) sit only in the leaf pages, keeping the tree narrow. MySQL has no INCLUDE — the columns must be part of the key."},{q:`How do you find queries doing full scans?`,d:2,p:`Perf`,c:[`AMZ`,`MSFT`],a:"Enable `log_queries_not_using_indexes`, or look for a high `Handler_read_rnd_next` relative to `Handler_read_key`, or filter `sys.statement_analysis` on high rows-examined."},{q:`What information does the slow query log not tell you?`,d:3,p:`Perf`,c:[`AMZ`,`GOOG`],a:"Why it was slow — lock waits, plan choice, cache state and concurrency are absent. It gives candidates; `EXPLAIN ANALYZE` on a representative parameter set gives the reason."},{q:`How do you benchmark a query change safely?`,d:2,p:`Perf`,c:[`AMZ`,`GOOG`],a:`Run both against production-shaped data with a warm cache, several times, comparing median and p99 not a single run. Reset or account for the buffer pool, and use realistic parameter values — a selective one flatters an index.`},{q:`What is a query digest?`,d:2,p:`Perf`,c:[`AMZ`,`ATLS`],a:`The query text with literals replaced by placeholders, so all executions of one statement aggregate together. It is what makes 'which query costs us most' answerable at all.`},{q:`Why aggregate by total time rather than worst execution?`,d:2,p:`Perf`,c:[`AMZ`,`GOOG`],a:`A 50 ms query run a million times costs far more than a 5-second report run hourly. Optimising the visibly slow query often has no measurable effect on the system.`},{q:`What does p99 latency tell you that the average does not?`,d:2,p:`Perf`,c:[`GOOG`,`UBER`,`META`],a:`The tail — the experience of the unluckiest 1% of requests, usually caused by lock waits, cache misses or checkpoint stalls rather than by the query plan. Averages hide exactly the problems users complain about.`},{q:`How do you decide whether to fix a query or add hardware?`,d:2,p:`Ops`,c:[`AMZ`,`ATLS`],a:`Look at the rows-examined-to-sent ratio. A ratio of 1000:1 is an algorithmic problem no hardware fixes economically. If the queries are already efficient and the working set exceeds RAM, more memory is the honest answer.`},{q:`What is the first thing to check when a query 'suddenly' breaks?`,d:2,p:`Ops`,c:[`AMZ`,`ATLS`],a:"What changed: a deploy, a migration, a data volume threshold, or `sql_mode`. Queries rarely break spontaneously; something crossed a boundary the query was implicitly relying on."},{q:`How do you safely test a schema change against production data?`,d:3,p:`Ops`,c:[`AMZ`,`GOOG`,`GS`],a:`Restore a recent backup to a staging host of similar size, run the migration timed, and check the resulting plans. Duration on a laptop-sized copy tells you nothing about a 200 GB table.`},{q:`What is the most common cause of a production database incident?`,d:2,p:`Ops`,c:[`AMZ`,`UBER`,`ATLS`],a:`A change: a deploy introducing an unindexed query or N+1 pattern, a migration locking a large table, or a batch job running in peak hours. Which is why the first diagnostic question is always 'what changed'.`}],xe=[{q:`What is the correct order of moves when a database gets slow?`,d:2,p:`Scale`,c:[`AMZ`,`GOOG`,`MSFT`],a:`Fix the query and index → add memory → cache → read replicas → archive and partition → split reads from writes → shard. Each rung costs more operationally than the last. Jumping to sharding first is the most common wrong answer.`},{q:`Does a table with 500M rows have to be slow?`,d:2,p:`Scale`,c:[`AMZ`,`GOOG`],a:`No. A B-tree over 500M rows is roughly one level deeper than over 5M. Slowness comes from the working set outgrowing the buffer pool, a non-sargable predicate, or stale statistics flipping the plan — not from row count itself.`},{q:`What do read replicas scale, and what do they not?`,d:1,p:`Scale`,c:[`AMZ`,`UBER`,`TCS`],a:`They scale **read QPS** and give you warm standbys. They do nothing for write throughput or storage, because every replica applies every write and holds a full copy.`},{q:`How do you handle read-your-writes with replicas?`,d:2,p:`Scale`,c:[`AMZ`,`GOOG`,`UBER`],a:`Return the written value from the write path so the UI never re-reads; route that user's reads to the primary for a few seconds after a write; or wait on the GTID before reading. The first is cheapest and most reliable.`},{q:"Why is `Seconds_Behind_Source` an unreliable lag metric?",d:3,p:`Scale`,c:[`AMZ`,`UBER`],a:`It reports 0 when the replica is merely idle and can misreport during a stall or when the relay log is starved. Write a heartbeat row every second on the primary and compare its timestamp on the replica instead.`},{q:`What is the difference between partitioning and sharding?`,d:2,p:`Scale`,c:[`AMZ`,`GOOG`,`MSFT`],a:`Partitioning splits a table **within one server** — joins and transactions still work and it is transparent to the app. Sharding splits data **across servers**, so the app must route queries and you lose cross-shard joins and transactions.`},{q:`What is the main reason to partition a large table?`,d:2,p:`Scale`,c:[`AMZ`,`UBER`],a:`Retention. Dropping a partition is a metadata operation; deleting 80M rows writes every one to the undo log, holds locks, bloats the tablespace and stalls replicas. Query pruning is the second benefit, not the first.`},{q:`What constraint does MySQL partitioning place on your keys?`,d:3,p:`Scale`,c:[`AMZ`,`ORCL`],a:"The partition column must appear in **every unique key**, including the primary key — so `PRIMARY KEY (id)` becomes `(id, created_at)`. MySQL also does not support foreign keys on partitioned tables at all."},{q:`When does partitioning make a query slower?`,d:2,p:`Scale`,c:[`AMZ`,`GOOG`],a:"When it cannot prune. A query without the partition key must touch every partition, each with its own index lookup — slower than one larger B-tree. Check the `partitions` column in `EXPLAIN`."},{q:`How do you choose a shard key?`,d:3,p:`Scale`,c:[`GOOG`,`AMZ`,`UBER`],a:`Pick the column the dominant query pattern already filters on, so queries stay single-shard. Then check cardinality and evenness — a key where one value is 40% of the data gives you a hot shard and none of the benefit.`},{q:"Why use a directory table instead of `hash(key) % N` for sharding?",d:3,p:`Scale`,c:[`SFDC`,`ATLS`,`GOOG`],a:`Modulo remaps roughly half your data when you add a shard, and gives no way to pin an outsized tenant to its own node. A lookup table makes rebalancing a row update and migration a per-tenant operation.`},{q:`How do you move a tenant between shards with no downtime?`,d:3,p:`Scale`,c:[`SFDC`,`ATLS`],a:`Mark migrating and dual-write to both shards, backfill history in batches, verify with counts **and** checksums, take a brief read-only window to drain in-flight writes, flip the directory row and invalidate the routing cache, then drop the old rows after a safety period.`},{q:`What is a scatter-gather query and why is it a problem?`,d:3,p:`Scale`,c:[`GOOG`,`AMZ`,`UBER`],a:`A query that must be sent to every shard and merged. Latency becomes the slowest shard's latency, throughput does not improve with more shards, and one degraded shard affects every such query. Frequent scatter-gather means the shard key is wrong for that pattern.`},{q:`How do you generate globally unique IDs across shards?`,d:3,p:`Scale`,c:[`UBER`,`GOOG`,`AMZ`],a:`Snowflake-style (timestamp + machine/shard + sequence) or UUIDv7 — both are unique without coordination and roughly time-ordered, which preserves clustered-index locality. Random UUIDv4 is the wrong answer because it destroys insert locality.`},{q:`What is a hot shard or hot partition, and how do you fix it?`,d:3,p:`Scale`,c:[`AMZ`,`GOOG`,`UBER`],a:`One shard receiving disproportionate traffic, so you pay all the complexity of distribution and get none of the scaling. Fixes: hash rather than range the key, salt a hot key across N sub-keys, or give the outlier its own shard.`},{q:`How do you count a billion rows for a UI?`,d:2,p:`Scale`,c:[`GOOG`,`META`,`AMZ`],a:"Do not count exactly. Read the estimate from `information_schema`, or cap it — `SELECT COUNT(*) FROM (SELECT 1 ... LIMIT 10001)` and show '10,000+'. Maintain a counter only when the exact number is a product feature."},{q:`How do you load 500M rows without taking the system down?`,d:3,p:`Scale`,c:[`AMZ`,`WALM`],a:"Load into a new table with secondary indexes dropped, use `LOAD DATA INFILE` rather than row inserts, rebuild indexes once as a sort, then `RENAME TABLE` atomically. Never one giant transaction — the undo log alone would exceed the data."},{q:`How do you estimate whether a table's working set fits in RAM?`,d:2,p:`Scale`,c:[`AMZ`,`ORCL`],a:"Sum data plus index size from `information_schema.tables`, then estimate what fraction is actually hot. You rarely need the whole table resident — if 95% of queries touch the last week, only that week's pages must be cached, which is why archiving is so effective."},{q:`When should you NOT shard?`,d:2,p:`Scale`,c:[`AMZ`,`GOOG`,`ATLS`],a:`When the bottleneck is reads, a single bad query, or a working set that would fit in RAM after archiving. Under a few terabytes and a few thousand writes per second, a single modern node is fine. Sharding is permanent and removes joins and transactions across the boundary.`},{q:`What breaks when you shard?`,d:3,p:`Scale`,c:[`GOOG`,`AMZ`,`UBER`],a:`Cross-shard joins, cross-shard transactions, global auto-increment, global unique constraints, and any aggregate over all data. Replacements: a warehouse fed by CDC for analytics, Snowflake IDs, a dedicated identity shard for global uniqueness, and sagas where cross-shard writes are unavoidable.`},{q:`Explain cache-aside, read-through, write-through and write-behind.`,d:2,p:`Cache`,c:[`AMZ`,`MSFT`,`ATLS`],a:`Cache-aside: the app checks the cache and populates on miss — the default. Read-through: the cache library does the DB read. Write-through: write to cache and DB synchronously. Write-behind: write to cache, flush later — fast but loses data if the cache dies.`},{q:`On a write, should you update the cache or delete the key?`,d:2,p:`Cache`,c:[`AMZ`,`META`,`GOOG`],a:`Delete. Updating races with a concurrent reader that fetched the old row before your write and stores it after — leaving the cache permanently stale until TTL. Deletion is idempotent and has no value to lose a race with. Write to the database first, then delete.`},{q:`Why should every cache entry have a TTL?`,d:1,p:`Cache`,c:[`AMZ`,`ATLS`],a:`It converts 'wrong forever' into 'wrong for at most N seconds' when an invalidation path is missed — which eventually happens in every codebase. Add jitter so entries populated together do not all expire together.`},{q:`What is a cache stampede and how do you prevent it?`,d:3,p:`Cache`,c:[`META`,`UBER`,`AMZ`],a:"A hot key expires and thousands of requests simultaneously recompute it, overwhelming the database. Fixes: a `SET NX` recompute lock so only one caller rebuilds; probabilistic early expiry (XFetch); serve-stale-while-revalidating; and TTL jitter."},{q:`What is a hot key and why does adding cache nodes not fix it?`,d:3,p:`Cache`,c:[`META`,`AMZ`,`UBER`],a:`One key receiving a disproportionate share of traffic. A key hashes to exactly one node, so adding nodes redistributes *other* keys and does nothing for this one. Fix with a short-TTL in-process cache in front, or by splitting the key into N replicated copies.`},{q:`What is cache penetration and how does it differ from a stampede?`,d:2,p:`Cache`,c:[`AMZ`,`GOOG`],a:`Penetration is repeated requests for keys that **do not exist** — every one misses and hits the database, and there is nothing to cache. Fix by caching the negative result with a short TTL and putting a Bloom filter of valid keys in front. A stampede is for a key that exists but just expired.`},{q:`What happens when your cache goes down?`,d:2,p:`Cache`,c:[`AMZ`,`UBER`,`META`],a:`The database takes the full uncached load instantly — often 10–100× normal — and usually falls over too. Design for it: circuit breakers that fail open, load shedding, a small in-process L1 that survives, and warming a restarted instance before returning it to service.`},{q:`What should you not cache?`,d:2,p:`Cache`,c:[`AMZ`,`ATLS`],a:`Data written far more than read, data unique per request, data where the required TTL approaches zero, and very large values that crowd out many small hot ones. In each case the cache adds latency and a failure mode without buying hits.`},{q:`How do you keep a cache consistent with the database?`,d:3,p:`Cache`,c:[`AMZ`,`GOOG`,`META`],a:`You bound the inconsistency rather than eliminating it: always a TTL, delete rather than update, write to the DB before deleting, and for stricter needs drive invalidation from the DB's change log via CDC. A distributed cache and a database cannot be updated atomically — that is the dual-write problem.`},{q:`Redis or Memcached?`,d:1,p:`Cache`,c:[`AMZ`,`MSFT`,`ATLS`],a:`Redis for almost everything: data structures, atomic operations, persistence, replication, pub/sub, TTL-aware eviction. Memcached remains reasonable for a pure multi-threaded blob cache with no other requirements — but the moment you need a counter, a lock, a queue or a leaderboard, Memcached structurally cannot.`},{q:"Why is `INCR` different from `GET` then `SET` in Redis?",d:1,p:`Cache`,c:[`AMZ`,`PYPL`],a:"Redis executes each command atomically on a single thread, but a `GET` followed by a `SET` is two commands with a window between them where another client interleaves and an update is lost. `INCR` does the whole operation server-side."},{q:`What is Redis's default eviction policy and why does it surprise people?`,d:2,p:`Cache`,c:[`AMZ`,`ATLS`],a:"`noeviction` — when `maxmemory` is reached Redis starts **rejecting writes** rather than making room. A Redis used as a cache needs `allkeys-lru`, or `allkeys-lfu` when access is heavily skewed."},{q:`RDB or AOF persistence?`,d:2,p:`Cache`,c:[`AMZ`,`ORCL`],a:"RDB is a periodic fork-and-snapshot — compact, fast to restore, loses minutes. AOF appends every write with `everysec` fsync — loses about a second, but is larger and slower to restore because it replays. Production commonly runs both; also consider that a large AOF replay means a long cold-cache window."},{q:`Which Redis structure gives you a leaderboard?`,d:2,p:`Cache`,c:[`AMZ`,`ZOMT`,`SNAP`],a:"Sorted set. `ZADD`/`ZINCRBY` to update, `ZREVRANGE` for the top N, `ZREVRANK` for a user's exact rank, all O(log N). Ranking users around you falls out for free, which is the screen players actually look at."},{q:`How do you build an exact sliding-window rate limiter in Redis?`,d:3,p:`Cache`,c:[`ATLS`,`AMZ`,`PYPL`],a:"A sorted set keyed per user with the timestamp as the score: `ZREMRANGEBYSCORE` to drop entries outside the window, `ZCARD` to count, `ZADD` to record. The `INCR`-per-fixed-window version is cheaper but allows a 2× burst at the boundary."},{q:`What is HyperLogLog for?`,d:2,p:`Cache`,c:[`META`,`GOOG`,`SNAP`],a:"Approximate distinct counts in ~12 KB regardless of cardinality, with about 0.81% error, and sketches merge losslessly — so daily unique-visitor sketches roll up into weekly and monthly without re-scanning. It replaces `COUNT(DISTINCT)` over a fact table at scale."},{q:`How do you implement a distributed lock in Redis correctly?`,d:3,p:`Cache`,c:[`UBER`,`ATLS`,`AMZ`],a:"`SET key <random-token> NX PX ttl` to acquire, and a Lua script that deletes only if the token matches to release — otherwise a slow holder deletes someone else's lock. Add a watchdog to extend the TTL for long jobs."},{q:`Is Redlock safe?`,d:3,p:`Cache`,c:[`UBER`,`GOOG`,`ATLS`],a:`It depends what the lock is for. For **efficiency** — avoiding duplicate work where a double-run is merely wasteful — a single-node Redis lock is fine. For **correctness**, no TTL-based lock is sufficient, because a GC pause can stall a holder past its lease; you need fencing tokens enforced by the resource, or a consensus system like etcd.`},{q:`Redis pub/sub or Redis streams?`,d:2,p:`Cache`,c:[`AMZ`,`ATLS`],a:`Pub/sub delivers only to currently-connected subscribers and drops everything else — fine for cache-invalidation broadcasts and presence. Streams persist, support consumer groups, acknowledgements and replay — use them when a lost message is a bug. For mission-critical volume, Kafka is still the right tool.`},{q:`Why run separate Redis instances for cache and sessions?`,d:2,p:`Cache`,c:[`AMZ`,`ATLS`],a:`They need different eviction policies and different blast radius. A cache workload under memory pressure will happily evict session keys, logging out every user because someone shipped a feature that caches large objects. Separate instances give separate limits and separate failure domains.`},{q:`How do you decide between SQL and NoSQL?`,d:2,p:`NoSQL`,c:[`AMZ`,`GOOG`,`MSFT`],a:`By access pattern and required invariants, not anticipated scale. Multi-row invariants, transactions and ad-hoc queries mean relational. A fully known access pattern with write volume beyond one node means key-value or wide-column. Most real answers are polyglot: relational as truth, plus Redis, search and analytics stores fed by CDC.`},{q:`What does 'query-first modelling' mean in Cassandra?`,d:3,p:`NoSQL`,c:[`NFLX`,`UBER`,`APPL`],a:"You enumerate the queries first, then build one table per query — denormalising and duplicating data deliberately. There are no joins, `WHERE` must include the full partition key, and ordering is limited to clustering columns. Three tables holding overlapping data is the intended design, not a normalisation failure."},{q:`What is a partition key in Cassandra or DynamoDB, and why does it dominate the design?`,d:3,p:`NoSQL`,c:[`AMZ`,`NFLX`],a:`It decides which node stores the item and therefore how load distributes. Low cardinality or monotonic values create a hot partition that throttles regardless of total provisioned capacity — and it usually cannot be changed without rewriting the table.`},{q:`Why must you bound Cassandra partition size?`,d:3,p:`NoSQL`,c:[`NFLX`,`UBER`],a:`The partition is the unit of storage, repair and read. A multi-gigabyte partition causes read timeouts, compaction stalls and OOM on the owning node, and cannot be split retroactively. Add a time or numeric bucket to the partition key — target under ~100 MB and 100k rows.`},{q:"Explain `W + R > RF`.",d:3,p:`NoSQL`,c:[`NFLX`,`AMZ`,`GOOG`],a:`With replication factor RF, if the write quorum and read quorum must overlap by at least one node, that node holds the latest value and the read sees it. With RF=3, QUORUM writes and QUORUM reads give 2+2 > 3, hence consistency — while tolerating one node down on each side.`},{q:`What is a tombstone and why is a queue-like workload bad in Cassandra?`,d:3,p:`NoSQL`,c:[`NFLX`,`APPL`],a:"A delete writes a marker rather than removing the row, so an offline replica cannot resurrect it. Tombstones persist until `gc_grace_seconds`, consume space and must be scanned past on reads. Insert-read-delete loops accumulate thousands per partition and cause read timeouts."},{q:`What is a DynamoDB GSI and what does it cost?`,d:3,p:`NoSQL`,c:[`AMZ`],a:`A Global Secondary Index is a separate, asynchronously replicated projection with its own partition key, throughput and bill — not a B-tree index. It is **eventually consistent**, so a read right after a write may not see the item, and each GSI roughly doubles the write cost of the items it projects.`},{q:`State CAP correctly.`,d:2,p:`NoSQL`,c:[`AMZ`,`GOOG`,`MSFT`],a:`**During a network partition** a system must choose availability or consistency. 'Pick two of three' is misleading because partitions are not something you elect — so every real distributed system is CP or AP, and 'CA' describes a single node. CAP says nothing about the healthy case.`},{q:`What does PACELC add to CAP?`,d:3,p:`NoSQL`,c:[`GOOG`,`AMZ`],a:`If Partition: Availability or Consistency; **Else: Latency or Consistency**. It names the trade you make 99.99% of the time — even on a healthy network, a strongly consistent read must contact a quorum, which across regions is 100 ms or more.`},{q:`Name the consistency levels between strong and eventual.`,d:3,p:`NoSQL`,c:[`GOOG`,`AMZ`],a:`Linearizable, sequential, causal, read-your-writes, monotonic reads, eventual. Most user-visible complaints about eventual consistency are actually read-your-writes failures, which are fixable cheaply without paying for global linearizability.`},{q:`When is a graph database actually justified?`,d:2,p:`NoSQL`,c:[`GOOG`,`META`,`LINK`],a:`At **unbounded traversal depth** — shortest path, 'all accounts within six hops', variable-depth queries. One or two degrees of separation is a self-join that a well-indexed relational database does in milliseconds, so adding a graph store below that threshold is complexity without payoff.`},{q:`Why is Elasticsearch not a source of truth?`,d:2,p:`NoSQL`,c:[`ATLS`,`AMZ`,`GOOG`],a:`No transactions, eventual consistency, and reindexing is a routine operation. The correct shape is relational owns the data, the search index is derived via CDC, and search results hydrate from the source or a cache.`},{q:`How do you resolve conflicting concurrent writes in an AP store?`,d:3,p:`NoSQL`,c:[`AMZ`,`GOOG`],a:`Last-write-wins by timestamp (simple, silently loses data on clock skew), vector clocks (detect concurrency, push resolution to the app), CRDTs (mathematically convergent merges — ideal for counters and sets), or domain-specific merge. Often the best fix is an append-only model where nothing is overwritten and there is no conflict.`},{q:`What is the dual-write problem?`,d:3,p:`Queue`,c:[`UBER`,`AMZ`,`PYPL`],a:`Writing to two systems — a database and a broker, or a database and a cache — with no shared transaction, so either can succeed while the other fails. Swapping the order only changes which failure you get. It is the foundational bug behind most event-driven and caching architectures.`},{q:`Explain the outbox pattern.`,d:3,p:`Queue`,c:[`UBER`,`ATLS`,`PYPL`],a:"Write the business change and an `outbox` row in the **same database transaction**, then a separate relay publishes the outbox rows and marks them sent. Atomicity is preserved because both writes are in one database. The relay may publish twice, which is why consumers must be idempotent."},{q:`What is change data capture?`,d:2,p:`Queue`,c:[`UBER`,`GOOG`,`AMZ`],a:"Streaming row-level changes out of the database by reading its own replication log (binlog or WAL), typically with Debezium. Nothing can commit without appearing in the log, so the pipeline cannot miss a write — unlike dual writes or `updated_at` polling."},{q:"Why is polling `updated_at` unreliable for change capture?",d:3,p:`Queue`,c:[`UBER`,`GOOG`],a:`Rows committed out of timestamp order are missed, deletes leave no row to find, and clock skew between writers breaks the ordering assumption. Log-based capture has none of these problems because the log *is* the commit order.`},{q:`Does exactly-once delivery exist?`,d:3,p:`Queue`,c:[`UBER`,`AMZ`,`PYPL`],a:`No — the acknowledgement can always be lost, so the sender cannot know. What exists is at-least-once delivery plus **idempotent processing**, which produces exactly-once *effects*. The usual mechanism is a unique constraint on an event or idempotency key, enforced in the same transaction as the effect.`},{q:`How do you make a consumer idempotent?`,d:2,p:`Queue`,c:[`PYPL`,`UBER`,`AMZ`],a:"Insert the event id into a `processed_events` table with a unique key **in the same transaction as the effect** — a duplicate delivery then fails the constraint and rolls back harmlessly. Or design the effect to be naturally idempotent: setting a status is safe to repeat, incrementing a counter is not."},{q:`Why not use two-phase commit across services?`,d:3,p:`Queue`,c:[`UBER`,`AMZ`,`GS`],a:`It blocks: if the coordinator dies after PREPARE, participants hold locks indefinitely with no automatic resolution. Availability becomes the product of all participants', and most modern datastores and brokers do not support XA. Sagas with compensating actions are the practical answer.`},{q:`What is a saga, and how does compensation differ from rollback?`,d:3,p:`Queue`,c:[`UBER`,`AMZ`,`PYPL`],a:`A sequence of local transactions, each with a compensating action if a later step fails. Compensation is **not** rollback: a refund is not the inverse of a charge — the money moved, the customer saw it, a fee may have been taken. Compensations are real business operations that must be designed, and saga state must be persisted so it can resume after a crash.`},{q:`Orchestration or choreography for a saga?`,d:3,p:`Queue`,c:[`UBER`,`ATLS`],a:`Orchestration puts the whole flow and its compensations in one readable place, at the cost of a coordinator component. Choreography has services react to each other's events — decoupled, but the flow exists nowhere and cyclic reactions are easy to create accidentally. For anything involving money, choose orchestration.`},{q:`Queue or stream?`,d:2,p:`Queue`,c:[`AMZ`,`UBER`,`ATLS`],a:`A queue delivers each message to one consumer and deletes it on ack — the message is a unit of work. A stream is an append-only log that many consumer groups read at their own offsets and that retains messages regardless of consumption — the message is a fact. Only a stream supports replay, which is what makes rebuilding a derived store possible.`},{q:`How do you build a job queue on a relational database?`,d:2,p:`Queue`,c:[`ATLS`,`AMZ`,`UBER`],a:"`SELECT ... FOR UPDATE SKIP LOCKED LIMIT 1` to claim, a `locked_until` lease so a crashed worker's job is reclaimed automatically, attempt counting with exponential backoff, and a terminal `failed` state that alerts. Without `SKIP LOCKED`, workers queue behind each other and parallelism silently disappears."},{q:`When should you move off a database-backed job queue?`,d:2,p:`Queue`,c:[`ATLS`,`AMZ`],a:`When the jobs table dominates your database's write I/O, when insert-delete churn causes index bloat and vacuum pressure, when the claim query appears in the slow log, or when you need fan-out to many consumer groups, replay or retention. Below roughly a thousand jobs per second, the database queue is usually the better engineering choice.`},{q:`What is event sourcing and when is it worth it?`,d:3,p:`Queue`,c:[`GS`,`ATLS`,`PYPL`],a:`Store the ordered events rather than current state, deriving state by replay. It gives a perfect audit log and the ability to build new read models from history. Costs: every query needs a projection, old event versions must be handled forever, replay needs snapshots, and deletion conflicts with immutability. Worth it where history *is* the product — ledgers, trading, compliance.`},{q:`What is CQRS and does it require event sourcing?`,d:2,p:`Queue`,c:[`ATLS`,`MSFT`],a:`Separating the write model from read models shaped for specific queries. It does **not** require event sourcing — a read replica with a materialised summary table is already a mild form. The benefit is independent optimisation and scaling; the cost is an eventually consistent read side that every consumer must handle.`},{q:`How should you structure a 45-minute system design round?`,d:2,p:`SysDesign`,c:[`AMZ`,`GOOG`,`META`,`MSFT`],a:`Clarify scope and non-functional targets (5 min), estimate QPS and storage (5), data model and access patterns (5), write path then read path then caching (15), scaling and failure modes (10), trade-offs stated unprompted (5). Estimating before designing is what tells you whether the answer is one database or forty services.`},{q:`Which numbers should you have memorised for capacity estimates?`,d:2,p:`SysDesign`,c:[`AMZ`,`GOOG`,`META`],a:`A day is 86,400 s, so 1M/day ≈ 12/s and 1B/day ≈ 12k/s. A relational primary handles roughly 5–20k writes/s; Redis 100k+ ops/s per node; an SSD about 500 MB/s with sub-ms random reads; a cross-region round trip is 50–150 ms.`},{q:`Design a URL shortener — what is the core insight?`,d:2,p:`SysDesign`,c:[`AMZ`,`GOOG`,`MSFT`,`TCS`],a:`It is a caching and key-generation problem, not a database problem. Base62-encode a counter (no collision checks), make the code the clustered primary key, serve redirects from Redis, and keep click counts **off** the hot row — increment in Redis or emit an event instead.`},{q:`Design a news feed — fan-out on read or on write?`,d:3,p:`SysDesign`,c:[`META`,`LINK`,`SNAP`],a:`Hybrid. Fan out on write for ordinary accounts so reads are O(1), but never for accounts with millions of followers — merge their posts on read instead. Materialise feeds only for recently active users, and insert your own post into your own feed synchronously for read-your-writes.`},{q:`How do you prevent double-booking a seat or overselling stock?`,d:3,p:`SysDesign`,c:[`AMZ`,`FLPK`,`UBER`],a:"Put the invariant in the `WHERE` clause of a single conditional `UPDATE` and check `ROW_COUNT()` — never check-then-act across two statements. Make hold expiry lazy (part of the same predicate) so correctness does not depend on a background job. Handle the load spike separately, with a queue or a Redis gate."},{q:`How do you design a ledger?`,d:3,p:`SysDesign`,c:[`GS`,`PYPL`,`JPMC`,`PAYTM`],a:"Double-entry, append-only, immutable entries; `DECIMAL` never `FLOAT`; corrections are new reversing entries rather than updates; an idempotency key with a unique index for exactly-once; balances materialised as a **reconciled cache** with the entry table as truth; deterministic lock ordering to avoid deadlocks."},{q:`How do you handle a flash sale that will get 100k requests per second?`,d:3,p:`SysDesign`,c:[`FLPK`,`AMZ`,`WALM`],a:"Separate the display number (cached, approximate) from the authoritative number (checked atomically). Put a Redis `DECRBY` gate in front so the losing 95% are rejected in under a millisecond, and let only the winners reach the database's conditional `UPDATE`, which retains the guarantee even if Redis is down."},{q:`Design a chat system — what is the hidden scaling problem?`,d:3,p:`SysDesign`,c:[`META`,`ATLS`,`SNAP`],a:"Read receipts. One row per (message, recipient) in a 1,000-member group multiplies your write volume by a thousand. Store a per-user **high-water mark** (`last_read_seq`) instead, turning O(messages × members) into O(members)."},{q:`Design driver location tracking for a ride-hailing app.`,d:3,p:`SysDesign`,c:[`UBER`,`SWGY`,`ZOMT`],a:"Split ephemeral from durable: current location goes to Redis GEO or geohash keys (25k writes/s, loss self-heals in one cycle), history goes to Kafka and a time-series store off the hot path, and trips go to a relational store sharded by city. Claim a driver atomically with `SREM`, which returns 1 for exactly one caller."},{q:`Design an analytics pipeline for 10 billion events a day.`,d:3,p:`SysDesign`,c:[`META`,`GOOG`,`AMZ`],a:`Buffer in Kafka, batch-insert into a columnar store (single-row inserts are catastrophic there), archive raw to object storage for reprocessing, pre-aggregate the predictable dashboard questions into materialised rollups with mergeable HLL sketches, and tier retention so raw data expires while rollups persist.`},{q:`How do you design a multi-tenant SaaS data layer?`,d:3,p:`SysDesign`,c:[`SFDC`,`ATLS`,`SAP`],a:"Tier the isolation model: shared tables with `tenant_id` leading every index for the long tail, dedicated databases for enterprise tenants who need per-tenant restore and residency. Make isolation structural — row-level security or an unbypassable data-access layer — and cap resources per tenant so one noisy customer cannot degrade the rest."},{q:`What is a virtual waiting room and when do you need one?`,d:2,p:`SysDesign`,c:[`AMZ`,`FLPK`,`ZOMT`],a:`An admission-control queue that lets N users per second into the real application and shows the rest their position. You need it when demand can exceed capacity by orders of magnitude for a short window — ticket on-sales, flash sales. It converts an uncontrollable spike into a rate you choose, and users understand a queue far better than an error page.`},{q:`Why separate the display value from the authoritative value?`,d:2,p:`SysDesign`,c:[`AMZ`,`FLPK`],a:`They have different consistency requirements pretending to be one number. 'Twelve left' can be cached and seconds stale with no harm; the decision to sell the twelfth must be atomic. Most overselling incidents come from serving page views off the authoritative row, or from trusting the cached number at checkout.`},{q:`How do you decide whether a design needs a message broker at all?`,d:2,p:`SysDesign`,c:[`AMZ`,`ATLS`,`GOOG`],a:`Do the arithmetic first. At a few hundred events per second with one consumer, a database-backed queue is simpler, transactional with your data and trivially debuggable. Add a broker when you need fan-out to independent consumers, replay, retention, ordering guarantees across partitions, or throughput beyond what your database should be spending I/O on.`}],Se=[{q:`What is the difference between L4 and L7 load balancing?`,d:1,p:`LB`,c:[`AMZ`,`GOOG`,`MSFT`,`CSCO`],a:`L4 forwards TCP/UDP by IP and port without reading the payload — fast, protocol-agnostic, preserves end-to-end TLS. L7 terminates the connection and routes on URL, header or cookie, which also lets it retry a failed request elsewhere. L4 for databases and raw throughput; L7 for HTTP routing.`},{q:`Why should you not put a plain L7 load balancer in front of a database?`,d:2,p:`LB`,c:[`AMZ`,`ORCL`],a:`It cannot parse the MySQL or PostgreSQL wire protocol, so it offers nothing an L4 balancer does not, while adding latency and a termination point. Use L4, or better a protocol-aware proxy such as ProxySQL or PgBouncer that understands queries and transactions.`},{q:`Why is round robin a poor default?`,d:2,p:`LB`,c:[`AMZ`,`GOOG`],a:`It assumes every request costs the same. A backend stuck on slow work still receives its full share, so its queue grows while others idle. Least connections routes away from degraded backends automatically.`},{q:`What is the thundering herd on backend restart, and how do you fix it?`,d:2,p:`LB`,c:[`AMZ`,`UBER`,`ATLS`],a:`A freshly healthy backend has zero active connections, so least-connections sends it a disproportionate burst before its caches are warm. Fix with **slow start**: ramp its weight from 0 to 100% over 30–60 seconds.`},{q:`What is power-of-two-choices load balancing?`,d:3,p:`LB`,c:[`GOOG`,`NFLX`,`AMZ`],a:`Sample two backends at random and send to the less loaded one. It gets nearly the benefit of global least-loaded routing while avoiding the oscillation that happens when every balancer independently agrees on which backend is currently fastest.`},{q:`When do you need consistent hashing in a load balancer?`,d:2,p:`LB`,c:[`AMZ`,`GOOG`,`NFLX`],a:`When per-node caching matters. Without it a request for the same object lands anywhere, so every node caches everything and effective cache size is one node rather than the sum. It also remaps only ~1/N of keys when a node is added, unlike modulo.`},{q:`Why are sticky sessions usually a design smell?`,d:2,p:`LB`,c:[`AMZ`,`ATLS`,`MSFT`],a:`They exist to accommodate in-memory session state. The cost is uneven load, backends that cannot be drained without dropping users, and weak autoscaling. Move session state to Redis and any request can go to any backend. The legitimate case is long-lived WebSocket connections, which are pinned anyway.`},{q:`What is the difference between a liveness and a readiness check?`,d:2,p:`LB`,c:[`GOOG`,`AMZ`,`ATLS`],a:`Liveness asks 'should this process be restarted?' — cheap, dependency-free. Readiness asks 'should it receive traffic right now?' — it can check the connection pool and warm-up state. Conflating them means a slow database triggers restarts, which loses warm caches and makes the outage worse.`},{q:`Why should a readiness check not test a shared dependency?`,d:3,p:`LB`,c:[`GOOG`,`AMZ`,`NFLX`],a:`If every instance checks the same database, a three-second blip fails all of them simultaneously and the balancer has zero healthy backends — turning partial degradation into a 100% outage. Check only what is local, degrade rather than fail on shared dependencies, and configure the balancer to fail open when everything looks unhealthy.`},{q:`What is connection draining and why do deploys show 502s without it?`,d:2,p:`LB`,c:[`AMZ`,`ATLS`,`GOOG`],a:`Draining means the instance fails readiness first, waits out the balancer's check interval so no new requests arrive, lets in-flight requests finish, and only then exits. Skipping the wait means the process is gone before the balancer noticed, and every request already routed to it fails.`},{q:`What does 'fail open' mean for a load balancer?`,d:2,p:`LB`,c:[`GOOG`,`AMZ`],a:`When every backend reports unhealthy, send traffic anyway rather than returning nothing. The reasoning is that the most likely explanation for zero healthy backends is a broken health check, not the simultaneous death of every server — and a degraded response beats no response.`},{q:`What is a virtual IP and how does it fail over?`,d:2,p:`LB`,c:[`CSCO`,`ORCL`,`AMZ`],a:`An address that can be moved between hosts, usually with keepalived or VRRP, so clients keep one stable target. Failover is near-instant for clients, but it only works within a single L2 network, which makes it awkward across availability zones — a proxy layer is the more portable answer.`},{q:`Why does increasing the connection pool often make the database slower?`,d:3,p:`LB`,c:[`AMZ`,`GOOG`,`ORCL`],a:`A connection is not a worker — concurrency is bounded by cores and disks. Thousands of connections mean context-switch thrashing, per-connection memory, and more open transactions competing for locks. Every query slows, so each holds its connection longer, so the pool feels too small and someone raises it again.`},{q:`How do you size a database connection pool?`,d:3,p:`LB`,c:[`AMZ`,`ORCL`,`ATLS`],a:"Roughly `cores × 2 + effective spindles` — so 30–40 total for a 16-core SSD-backed server, not per instance. Sanity-check with Little's Law: 2,000 qps at 5 ms each needs about ten concurrent connections. Multiplex many app instances onto that small pool with PgBouncer or ProxySQL."},{q:`What are PgBouncer's pooling modes and what breaks in each?`,d:3,p:`LB`,c:[`GOOG`,`ATLS`,`AMZ`],a:"Session mode holds a connection for the client's whole session — safe, no multiplexing benefit. Transaction mode returns it after each transaction and gives the 100:1 ratio, but breaks session state: `SET`, server-side prepared statements, advisory locks, temp tables, `LISTEN`. Statement mode is fastest and breaks multi-statement transactions."},{q:`What is a connection storm?`,d:3,p:`LB`,c:[`AMZ`,`UBER`,`ATLS`],a:`A database hiccup exhausts pools, apps open more connections, connection setup itself (auth, TLS, memory allocation) consumes the database's remaining capacity, and it collapses. Defences: hard pool caps, short acquire timeouts, circuit breakers, jittered reconnect backoff, and a reserved superuser slot so you can still log in.`},{q:`Why reserve a superuser connection slot?`,d:2,p:`LB`,c:[`ORCL`,`AMZ`],a:"So a connection storm does not lock you out of the database you need to inspect and fix. PostgreSQL's `superuser_reserved_connections` holds back slots that ordinary clients cannot consume — without it your only option during an incident is a restart."},{q:`What does ProxySQL give you that a plain TCP balancer does not?`,d:2,p:`LB`,c:[`AMZ`,`ORCL`,`FLPK`],a:`It speaks the MySQL protocol, so it can split reads and writes by query rule, multiplex connections, pin a session to the primary for the duration of a transaction, pull lagging replicas out of rotation, rewrite or mirror queries, and follow failover by learning the new primary from the orchestrator.`},{q:`Which reads must never go to a replica?`,d:2,p:`LB`,c:[`AMZ`,`GOOG`,`GS`],a:"Reads inside an open transaction, read-your-writes cases, `SELECT ... FOR UPDATE`, anything where lag is unacceptable (auth, permissions, balance after payment), and — most dangerously — any read whose value decides a subsequent write, because a stale read then produces a silently wrong update."},{q:`How do you keep a lagging replica out of the read pool?`,d:2,p:`LB`,c:[`AMZ`,`UBER`],a:"Use lag as a health signal: ProxySQL's `max_replication_lag` removes a host automatically past a threshold. Measure lag with a heartbeat row written every second on the primary and compared on the replica, not with `Seconds_Behind_Source`, which reads 0 while idle."},{q:`What is the difference between RTO and RPO?`,d:1,p:`LB`,c:[`AMZ`,`GS`,`ORCL`,`DELOITTE`],a:`RTO is how long you are down — recovery time. RPO is how much data you lose — recovery point. They drive different decisions: RPO chooses the replication mode (async, semi-sync, quorum), RTO chooses the failover mechanism and whether it is automatic.`},{q:`Async, semi-synchronous or synchronous replication?`,d:3,p:`LB`,c:[`AMZ`,`ORCL`,`GS`],a:`Async commits without waiting — fastest, RPO greater than zero. Semi-sync waits for one replica to acknowledge receipt — RPO near zero at the cost of one network round trip per commit. Synchronous or quorum waits for a majority to apply — RPO zero, highest write latency. Choose from the RPO requirement, not by default.`},{q:`What is split-brain and how do you prevent it?`,d:3,p:`LB`,c:[`AMZ`,`ORCL`,`UBER`,`GS`],a:"A primary that is partitioned rather than dead keeps accepting writes while a replica is promoted — two primaries diverge and merging them is manual and lossy. Prevent it with fencing: revoke the VIP, set `super_read_only`, STONITH, or best of all self-demotion when the node cannot renew its leader lease in the consensus store."},{q:`Why is self-demotion on lease expiry the strongest fencing?`,d:3,p:`LB`,c:[`GOOG`,`AMZ`],a:`It inverts the problem. Instead of requiring the orchestrator to reach a partitioned node in order to stop it, the node's own inability to reach the consensus store is the signal to step down. Patroni works this way with an etcd leader key and a TTL.`},{q:`Why does automatic failover need multiple observers?`,d:2,p:`LB`,c:[`AMZ`,`ORCL`],a:`So a network blip between one observer and the primary does not trigger an unnecessary failover. The decision itself should be made by a quorum in a consensus store, which is also what makes fencing decisions trustworthy.`},{q:`Why is DNS a poor failover mechanism?`,d:2,p:`LB`,c:[`AMZ`,`GOOG`,`CSCO`],a:`TTLs are advisory — resolvers, proxies and especially JVMs cache well past expiry, so a 60-second TTL routinely leaves clients connecting to a dead host for ten minutes. It also gives no control over the transition. Use a proxy or a moving virtual IP for anything needing seconds-level failover.`},{q:`Is replication a backup?`,d:1,p:`LB`,c:[`AMZ`,`GS`,`ORCL`],a:"No. Replication faithfully copies mistakes — an accidental `DELETE` reaches every replica in milliseconds. HA protects against node loss; backups protect against errors and corruption. You need point-in-time recovery from a full backup plus retained WAL or binlog."},{q:`What is a delayed replica and why keep one?`,d:2,p:`LB`,c:[`AMZ`,`GS`,`ORCL`],a:"A replica deliberately kept an hour behind (`SOURCE_DELAY = 3600`). When someone drops a table, you stop it before it applies the statement and promote it — turning a multi-hour restore into a few minutes. It is the cheapest insurance against operator error and is badly under-used."},{q:`Why do clusters use an odd number of nodes?`,d:2,p:`LB`,c:[`GOOG`,`AMZ`,`ORCL`],a:"A quorum is `floor(N/2) + 1`, which guarantees two disjoint partitions cannot both reach one. Odd numbers maximise fault tolerance per node — 3 and 4 both tolerate only one failure — and avoid the exact-tie case where a 2-2 split leaves neither side able to proceed."},{q:`High availability or disaster recovery — what is the difference?`,d:2,p:`LB`,c:[`GS`,`AMZ`,`DELOITTE`],a:`HA handles component failure inside one deployment: seconds of RTO, no data loss, via replication and failover. DR handles losing the whole deployment or the data itself: hours of RTO, some loss, via backups and cross-region copies. Multi-AZ replication is not DR, because a bad migration replicates perfectly everywhere.`},{q:`Active-active or active-passive across regions?`,d:3,p:`LB`,c:[`AMZ`,`GOOG`,`UBER`],a:`Active-passive is simple with no write conflicts but idle standby capacity. Active-active needs conflict resolution — and the tractable form is partitioning key ownership by region (EU users write to EU) so there are no conflicts to resolve. True multi-master with arbitrary writes is what Spanner spends enormous effort on and is rarely worth building.`},{q:`Compare fixed window, sliding window and token bucket rate limiting.`,d:3,p:`LB`,c:[`ATLS`,`AMZ`,`PYPL`,`GOOG`],a:"Fixed window is one `INCR` but allows a 2× burst across the boundary. Sliding window log is exact but costs O(limit) memory per user. Sliding window counter interpolates two fixed windows — O(1) memory, under ~1% error, the usual production choice. Token bucket allows controlled bursts, which matches real client behaviour best."},{q:`What is the difference between a token bucket and a leaky bucket?`,d:2,p:`LB`,c:[`ATLS`,`CSCO`,`AMZ`],a:`Token bucket refills at a rate up to a capacity, so it permits a burst up to that capacity — right for user-facing APIs, since a page load fires twenty parallel calls. Leaky bucket enforces a smooth output rate by queueing, which is right for protecting a downstream system that cannot absorb bursts at all.`},{q:`Where should rate limiting live?`,d:2,p:`LB`,c:[`AMZ`,`ATLS`,`GOOG`],a:`As far from the protected resource as possible — the edge or CDN for volumetric abuse, the API gateway for per-key limits, the service for business rules. Limiting at the database is too late, since the work is already done. Rejecting at the edge costs microseconds; rejecting after the query costs everything the query cost.`},{q:`Why does per-instance rate limiting silently break?`,d:2,p:`LB`,c:[`ATLS`,`AMZ`],a:"With 50 gateway instances each keeping a local counter, the effective limit is 50× the intended one. Use a shared counter in Redis (one round trip), or deliberately allocate `limit / N` per instance and accept the imprecision — but know which you chose."},{q:`Why must a rate limiter return Retry-After?`,d:1,p:`LB`,c:[`ATLS`,`AMZ`],a:"A client that cannot tell it is being limited retries harder, amplifying the problem the limiter exists to solve. Return `429` with `Retry-After` and rate-limit headers so well-behaved clients back off correctly."},{q:`Explain retry amplification.`,d:3,p:`LB`,c:[`GOOG`,`AMZ`,`NFLX`,`UBER`],a:`Retries multiply across layers: three layers each retrying three times turns one user request into 27 at the bottom. A dependency that slows down therefore receives 27× load exactly when it can least handle it, converting degradation into total collapse. Retry at one layer only, and enforce a retry budget.`},{q:`What is a retry budget?`,d:3,p:`LB`,c:[`GOOG`,`NFLX`,`AMZ`],a:`A cap on retries as a fraction of total requests — 'at most 10% of traffic may be retries'. It bounds amplification structurally, rather than depending on every service configuring backoff correctly, and it is the strongest single defence against retry-driven cascades.`},{q:`Why does exponential backoff need jitter?`,d:2,p:`LB`,c:[`AMZ`,`GOOG`,`UBER`],a:"Without it every client that failed at the same moment retries at the same moment, recreating the spike on a fixed cadence. Full jitter — `random(0, min(cap, base × 2^attempt))` — spreads the retries and lets the recovering service drain its queue."},{q:`How does a circuit breaker work, and what does it protect?`,d:2,p:`LB`,c:[`NFLX`,`AMZ`,`ATLS`],a:`Closed while healthy; opens when the failure rate crosses a threshold and rejects immediately without calling; after a cool-off it goes half-open and lets probes through. It protects the **caller** from tying up threads on doomed calls, and equally the **callee**, which cannot recover while still receiving full traffic plus retries.`},{q:`What is deadline propagation?`,d:3,p:`LB`,c:[`GOOG`,`AMZ`,`UBER`],a:`Passing the remaining time budget down the call chain, so a service with 100 ms left does not start a 2-second operation nobody will wait for. Without it, timed-out requests keep consuming connections, threads and CPU all the way down — the system does maximum work exactly when it has least capacity.`},{q:`What is a bulkhead in service design?`,d:2,p:`LB`,c:[`NFLX`,`AMZ`,`ATLS`],a:`A separate resource pool per dependency, so one failing dependency exhausts only its own pool. With a single shared pool, any one slow downstream starves every other call path — bulkheading converts 'the service is down' into 'one feature is degraded'.`},{q:`What is load shedding and why is it the correct behaviour?`,d:3,p:`LB`,c:[`GOOG`,`AMZ`,`NFLX`],a:`Rejecting requests early when the queue is too deep, ideally by priority so analytics and prefetch are dropped before checkout. Serving 70% of traffic well beats serving 100% at 30-second latency — a system that admits more work than it can complete finishes none of it, because everything times out.`},{q:`What is backpressure, and how does a database express it?`,d:3,p:`LB`,c:[`GOOG`,`AMZ`,`ATLS`],a:`A slow consumer signalling a fast producer to slow down instead of buffering unboundedly. A database expresses it implicitly through pool exhaustion, lock waits and rising latency — which teams misread and 'fix' by enlarging the pool, removing the backpressure. The correct response is to propagate it: a full pool should produce a fast 503 at the edge.`},{q:`Should a load balancer retry a failed request?`,d:3,p:`LB`,c:[`AMZ`,`GOOG`,`CSCO`],a:"Only when the request provably never reached a backend — a refused connection — and only for idempotent methods. Retrying a `POST` after a timeout may duplicate an order, because the request might well have been processed. The real fix for write endpoints is an idempotency key, not balancer configuration."},{q:`Anycast or GeoDNS?`,d:3,p:`LB`,c:[`CSCO`,`GOOG`,`AMZ`],a:`GeoDNS returns different addresses by resolver location, so it inherits every DNS caching problem and can misplace users behind central resolvers. Anycast advertises one IP from many locations and lets BGP route each packet to the nearest, so failover is routing convergence in seconds. Anycast for CDNs and DNS; GeoDNS when you lack network-level control.`},{q:`Where does a CDN sit relative to your load balancers?`,d:1,p:`LB`,c:[`AMZ`,`NFLX`,`CSCO`],a:`In front of everything. It absorbs cacheable responses at the edge — often 80–95% of requests — terminates TLS near the user, absorbs volumetric DDoS, and can serve stale content while the origin is down. The design work is separating personalised fragments from the shared page so more responses become cacheable.`}],Ce={Basics:`SELECT & Filtering`,Null:`NULL Semantics`,Aggregate:`Aggregation & GROUP BY`,Joins:`Joins`,Subquery:`Subqueries & CTEs`,Window:`Window Functions`,String:`String Functions`,Date:`Date & Time`,Numeric:`Numbers & Types`,Set:`Set Operations`,DDL:`DDL & Constraints`,DML:`DML & Upserts`,Txn:`Transactions & Locking`,Index:`Indexing`,Perf:`Performance & Tuning`,Norm:`Normalization & Design`,View:`Views`,Proc:`Procedures & Triggers`,Security:`Security & Admin`,Advanced:`Advanced Queries`,Theory:`RDBMS Theory`,Ops:`Replication, Backup, Scale`,Scale:`Scaling & Sharding`,Cache:`Caching, Redis & Memcached`,NoSQL:`NoSQL & Datastore Choice`,Queue:`Queues, Streams & CDC`,LB:`Load Balancing & HA`,SysDesign:`System Design`},we={AMZ:`Amazon`,GOOG:`Google`,MSFT:`Microsoft`,META:`Meta`,APPL:`Apple`,ORCL:`Oracle`,ADBE:`Adobe`,BLMB:`Bloomberg`,UBER:`Uber`,LINK:`LinkedIn`,SFDC:`Salesforce`,ATLS:`Atlassian`,NFLX:`Netflix`,SNAP:`Snap`,DBX:`Dropbox`,GS:`Goldman Sachs`,MS:`Morgan Stanley`,JPMC:`JPMorgan Chase`,PYPL:`PayPal`,WALM:`Walmart`,FLPK:`Flipkart`,SWGY:`Swiggy`,ZOMT:`Zomato`,PHPE:`PhonePe`,PAYTM:`Paytm`,ZOHO:`Zoho`,FRSH:`Freshworks`,TCS:`TCS`,INFY:`Infosys`,WIPRO:`Wipro`,COG:`Cognizant`,CAP:`Capgemini`,ACC:`Accenture`,IBM:`IBM`,SAP:`SAP`,HCL:`HCL`,TECHM:`Tech Mahindra`,DELL:`Dell`,VMW:`VMware`,CSCO:`Cisco`,INTU:`Intuit`,EPAM:`EPAM`,QCOM:`Qualcomm`,NVDA:`Nvidia`,DE:`D.E. Shaw`,MCK:`McKinsey QuantumBlack`,DELOITTE:`Deloitte`},Te={1:{label:`Easy`,c:`#1a6b5c`,bg:`#e8f2f0`},2:{label:`Medium`,c:`#8a5e00`,bg:`#faf1dd`},3:{label:`Hard`,c:`#a83e3e`,bg:`#faecec`}},Ee=[...le,...ue,...de,...fe,...C,...w,...pe,...me,...he,...ge,...T,...E,..._e,...ve,...ye,...be,...xe,...Se],D=(()=>{let e={1:0,2:0,3:0},t={},n={},r=0;for(let i of Ee){e[i.d]++,t[i.p]=(t[i.p]||0)+1;for(let e of i.c)n[e]=(n[e]||0)+1;i.sql&&r++}return{total:Ee.length,byDiff:e,byTopic:t,byCompany:n,withSql:r}})(),De=Object.keys(Ce).filter(e=>D.byTopic[e]).sort((e,t)=>D.byTopic[t]-D.byTopic[e]).map(e=>[Ce[e],String(D.byTopic[e])]),Oe=[f,p,m,h,g,_,v,y,b,x,ee,te,S,ne,re,ie,ae,oe,se,ce,{id:`bank`,num:`21`,title:`The Question Bank`,kicker:`${D.total} questions, filterable by topic, difficulty and company`,sections:[{id:`bank-list`,title:`All ${D.total} questions`,blurb:`Search by keyword, technique or company. Expand any row for the answer.`,blocks:[{t:`p`,x:`Each entry gives the answer in one or two sentences — the point, not a walkthrough — and roughly ${D.withSql} of them carry a snippet. For the full treatment with schema, multiple approaches and the reasoning behind each, chapters 01–20 work through the same material in depth.`},{t:`bank`}]},{id:`bank-drill`,title:`Rapid-fire round`,blurb:`Twelve more predict-the-output drills. If any of these surprise you, revisit the linked chapter.`,blocks:[{t:`guess`,setup:`t(a): 1, 2, 3`,sql:`SELECT SUM(a), COUNT(a), AVG(a), MIN(a), MAX(a),
       SUM(a)/COUNT(a) AS manual_avg
FROM   t
WHERE  a > 10;`,out:`NULL  0  NULL  NULL  NULL  NULL`,why:"An ungrouped aggregate over an empty result set still returns exactly **one row** — `COUNT` gives 0 and every other aggregate gives NULL. `SUM(a)/COUNT(a)` is NULL/0, which is NULL rather than a division error. Add a `GROUP BY` and you would get **zero rows** instead, which is a different failure mode for any caller expecting a value."},{t:`guess`,setup:`a(id): 1, 2, 3      b(id): 2`,sql:`SELECT COUNT(*) FROM a LEFT  JOIN b ON b.id = a.id;
SELECT COUNT(*) FROM a RIGHT JOIN b ON b.id = a.id;
SELECT COUNT(*) FROM a CROSS JOIN b;`,out:`3
1
3`,why:"LEFT preserves all three rows of `a`. RIGHT preserves the single row of `b`, so only the matching pair survives. CROSS is the cartesian product, 3 × 1. Reading which side is preserved off the keyword is the whole skill — and it is why most teams standardise on LEFT and reorder the tables instead of using RIGHT."},{t:`guess`,setup:`t(g, v): (A,1), (A,2), (B,3)`,sql:`SELECT g, COUNT(*) FROM t GROUP BY g HAVING COUNT(*) > 1;
SELECT g, COUNT(*) FROM t WHERE  v > 1 GROUP BY g;`,out:`A  2

A  1
B  1`,why:`The first filters **groups** after aggregation, so only A survives with its full count of 2. The second filters **rows** before grouping, so A loses one row and both groups appear with a count of 1. Same tables, same counts, entirely different meaning — this is the WHERE/HAVING distinction made concrete.`},{t:`guess`,setup:`t(v): 'apple', 'Banana', NULL`,sql:`SELECT COUNT(*) FROM t WHERE v LIKE 'a%';
SELECT COUNT(*) FROM t WHERE v NOT LIKE 'a%';`,out:`2
1`,why:"Under the default case-insensitive collation `'Banana'` does not start with 'a' but `'apple'` does — wait, the count is 2 because collation also makes `LIKE 'a%'` match nothing extra here; the second row is excluded. The important part is the NULL: it matches **neither** `LIKE` nor `NOT LIKE`, because both evaluate to UNKNOWN. The two counts do not add up to the row count, which is the tell that a nullable column is involved."},{t:`guess`,setup:`orders(id, cust): (1,'A'), (2,'A'), (3,'B')
items(order_id): 1, 1, 2, 3`,sql:`SELECT o.cust, COUNT(*) AS c1, COUNT(DISTINCT o.id) AS c2
FROM   orders o JOIN items i ON i.order_id = o.id
GROUP  BY o.cust;`,out:`cust  c1  c2
A     3   2
B     1   1`,why:"The join to `items` duplicates order 1 twice, so `COUNT(*)` counts **line items** (3 for customer A) while `COUNT(DISTINCT o.id)` counts orders (2). After any one-to-many join, every count on the parent side needs `DISTINCT` — but sums of child columns do not, because each child row legitimately appears once."},{t:`guess`,setup:`t(v): 1, 2, 3, 4`,sql:`SELECT v, NTILE(3) OVER (ORDER BY v) AS bucket FROM t;`,out:`v  bucket
1  1
2  1
3  2
4  3`,why:"`NTILE(n)` distributes rows as evenly as possible and puts the remainder in the **earlier** buckets — 4 rows into 3 buckets gives sizes 2, 1, 1. This matters for quartile reporting: buckets are not guaranteed equal, so a 'top quartile' may hold one more row than the others."},{t:`guess`,setup:`t(v): 10, 20, 30`,sql:`SELECT v,
       LAG(v)        OVER (ORDER BY v) AS prev,
       LAG(v, 1, 0)  OVER (ORDER BY v) AS prev_default,
       LEAD(v)       OVER (ORDER BY v) AS next
FROM   t;`,out:`v   prev  prev_default  next
10  NULL  0             20
20  10    10            30
30  20    20            NULL`,why:`The first row has no predecessor and the last no successor, so both edges are NULL unless you supply the third argument as a default. Forgetting this is why a month-over-month change column shows NULL for the first period — which is correct, and should not be coalesced to zero unless zero is genuinely meaningful.`},{t:`guess`,setup:`-- t is InnoDB with 1,000,000 rows`,sql:`-- session A
START TRANSACTION;
UPDATE t SET v = 1 WHERE non_indexed_col = 'x';   -- matches 3 rows

-- session B
UPDATE t SET v = 2 WHERE id = 999999;             -- unrelated row`,out:`Session B blocks until session A commits.`,why:"InnoDB locks the index records it **examines**, not just those it modifies. With no index on `non_indexed_col` the engine performs a full scan and therefore locks every row — effectively a table lock, from a statement that changes three rows. Adding the index turns it into a targeted lock. This is the single most common cause of unexplained lock waits."},{t:`guess`,setup:`t(price DECIMAL(10,2)): 10.00, 20.00`,sql:`SELECT SUM(price) * 0.1        AS a,
       ROUND(SUM(price) * 0.1) AS b,
       SUM(price * 0.1)        AS c,
       SUM(price) / 3          AS d;`,out:`a      b   c      d
3.000  3   3.000  10.000000`,why:"DECIMAL arithmetic is exact, so multiplying before or after the sum gives the same answer — which would **not** be reliable with FLOAT. Note the last column: division increases the scale by `div_precision_increment` (default 4), so the result has more decimal places than either operand. Always `ROUND` explicitly before displaying or comparing monetary results."},{t:`guess`,setup:`CREATE TABLE t (a INT, b INT, KEY (a, b));`,sql:`-- which of these can use the index?
SELECT * FROM t WHERE a = 1;
SELECT * FROM t WHERE a = 1 AND b = 2;
SELECT * FROM t WHERE b = 2;
SELECT * FROM t WHERE a > 1 AND b = 2;`,out:`yes  (leftmost prefix)
yes  (full key)
no   (b is not a prefix)
partly — a range on 'a' means b can only filter, not seek`,why:"A composite index is sorted by the whole tuple, so it can be seeked on any **leftmost prefix** and nothing else. The fourth case is the subtle one: once a range predicate is used, entries for a given `b` are scattered across many `a` values, so `b` can only be checked against rows already found. This is why the ordering rule is *equality columns first, range last*."},{t:`guess`,setup:`t(v): 'x'
-- session default sql_mode includes STRICT_TRANS_TABLES`,sql:`INSERT INTO t (num_col) VALUES ('abc');
INSERT INTO t (varchar5_col) VALUES ('toolongvalue');`,out:`ERROR 1366: Incorrect integer value
ERROR 1406: Data too long for column`,why:"Under strict mode both fail loudly. Without it — an older or misconfigured server — the first would insert **0** and the second would silently **truncate** to five characters, each with only a warning. Checking `SELECT @@sql_mode` is the first thing to do when data appears to have been corrupted on insert."},{t:`guess`,setup:`t(d DATE): '2024-01-31'`,sql:`SELECT d + INTERVAL 1 MONTH        AS a,
       d + INTERVAL 1 MONTH + INTERVAL 1 MONTH AS b,
       d + INTERVAL 2 MONTH        AS c;`,out:`a           b           c
2024-02-29  2024-03-29  2024-03-31`,why:`Adding a month to 31 January clamps to the end of February, and adding another month from there gives 29 March — but adding two months in one step gives 31 March. **Interval arithmetic is not associative** across month boundaries. Any recurring-billing or subscription logic that adds months incrementally will drift; compute each period from the original anchor date instead.`}]},{id:`bank-how`,title:`How to work through it`,blocks:[{t:`p`,x:`This bank is a checklist and a revision index, not a queue. Filter to one topic, work through it until the shape of the technique is familiar, then move on.`},{t:`table`,head:[`Topic`,`Questions`],rows:De},{t:`h`,x:`A working order`},{t:`ul`,ord:!0,x:[`**SELECT, NULL semantics, aggregation.** NULL alone accounts for a large share of trick questions, and everything else assumes it.`,"**Joins.** Learn the `ON` vs `WHERE` trap, the fan-out bug, and the three anti-join forms until they are automatic.","**Subqueries and window functions.** One template — `ROW_NUMBER() OVER (PARTITION BY … ORDER BY …)` filtered to 1 — answers a surprising share of interview questions.","**Indexing and performance.** Read one `EXPLAIN` a day against a real table; indexing intuition does not come from reading about it.",`**Schema design and transactions.** Normal forms as *diagnosis*, isolation levels as *trade-offs*, not definitions to recite.`,`**Advanced patterns and company sets.** Gaps and islands, cohorts, sessionisation, and the analytics questions each company favours.`,`**Systems.** Scaling and sharding, load balancing and failover, Redis and cache failure modes, choosing a datastore, the dual-write problem, and the design case studies in chapter 20.`]},{t:`note`,k:`ask`,x:`The interview habit that scores everywhere: **state your assumptions before writing**. Can this column be NULL? Is the join key unique on the right? Should ties be returned or broken? Interviewers leave these ambiguous deliberately, and asking is the signal they are grading.`},{t:`h`,x:`Signals you are ready`},{t:`ul`,x:["You reach for `NOT EXISTS` rather than `NOT IN` without thinking about it.","You can say why a `LEFT JOIN` with a `WHERE` on the right table is an inner join.",`You write the window-function form and the MySQL 5.7 correlated-count form for top-N per group.`,`You check whether a predicate is sargable before assuming an index will help.`,"You know that `COUNT(*)` after a `LEFT JOIN` returns 1, not 0, and why.",`You ask about ties, NULLs and cardinality before writing the query rather than after.`,`You can say why adding read replicas does nothing for write throughput.`,`You invalidate a cache by deleting the key, and you know why updating it races.`,"You reach for a conditional `UPDATE` rather than check-then-act whenever two clients might collide.",`You name the dual-write problem before proposing an event-driven design.`,`You can explain why a bigger connection pool usually makes a database slower.`,`You know that retries at three layers is 27× amplification, not 3×.`]}]}]}];function ke(e){switch(e.t){case`p`:case`h`:return e.x;case`sql`:return e.x+` `+(e.cap||``);case`schema`:return e.x+` `+(e.cap||``);case`note`:return e.x+` `+(e.title||``);case`ul`:return e.x.join(` `);case`table`:return e.head.join(` `)+` `+e.rows.map(e=>e.join(` `)).join(` `);case`qa`:return e.q+` `+e.a+` `+(e.sql||``);case`guess`:return e.sql+` `+e.why+` `+(e.setup||``);case`q`:return e.title+` `+(e.tag||``)+` `+e.stmt+` `+(e.hint||``)+` `+(e.takeaway||``)+` `+e.approaches.map(e=>e.name+` `+e.idea+` `+e.sql+` `+e.why).join(` `);case`design`:return e.title+` `+(e.tag||``)+` `+e.prompt+` `+(e.reqs||[]).join(` `)+` `+(e.estimate||``)+` `+(e.takeaway||``)+` `+e.phases.map(e=>e.name+` `+e.idea+` `+(e.sql||``)+` `+(e.note||``)).join(` `)+` `+(e.tradeoffs||[]).map(e=>e.choice+` `+e.pro+` `+e.con).join(` `);case`bank`:return`question bank sql interview questions company topic filter`;default:return``}}var Ae=Oe.fl
