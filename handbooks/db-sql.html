ed. Denormalise the driver's name and vehicle onto the trip **as a historical snapshot**, since the driver may later change vehicles and the receipt must not change. Money as `DECIMAL`, never `FLOAT`. The reporting workload goes to a replica or a warehouse, never the transactional primary."},{t:`qa`,q:`Goldman Sachs — Why must you never use FLOAT for currency?`,a:"Binary floating point cannot represent decimal fractions like 0.1 exactly, so errors accumulate across arithmetic and equality comparisons fail unpredictably — a reconciliation that should net to zero comes out at 1e-14. Use `DECIMAL(19,4)`, which stores exact digits, or store integer minor units (cents) and divide only for display. The same reasoning applies to `SUM` over millions of rows, where float error compounds. A related trap: `ROUND` on a `FLOAT` uses the C library and can round 2.675 to 2.67, while `ROUND` on a `DECIMAL` rounds half away from zero as expected."}]},{id:`co-prep`,title:`A four-week SQL preparation plan`,blocks:[{t:`table`,head:[`Week`,`Focus`,`Chapters`],rows:[[`**1**`,`SELECT, NULL semantics, aggregation, joins`,`01 – 03`],[`**2**`,`Subqueries, CTEs, window functions, functions`,`04 – 06`],[`**3**`,`Schema, transactions, indexing, normalization`,`07 – 11`],[`**4**`,`Tricky output, advanced problems, company sets, bank`,`12 – 15`]]},{t:`ul`,x:[`**Write every query before revealing the solution.** Reading SQL creates the illusion of understanding faster than any other language.`,"**Say the join cardinality out loud** before you write a join. One-to-many on the right means duplication; plan for `DISTINCT` or pre-aggregation.",`**Ask about NULLs every time.** Can this column be NULL? What should happen if it is? Half the trick questions in chapter 12 are NULL questions in disguise.`,"**Run `EXPLAIN` on anything you write against a real table.** It is the only way indexing intuition becomes reliable.","**Learn one window-function template properly** — `ROW_NUMBER() OVER (PARTITION BY … ORDER BY …)` in a subquery filtered to `= 1`. It answers a surprising share of interview questions.",`**Know both the modern and legacy answers.** Many companies still run MySQL 5.7, and 'I'd use a window function, but without one I'd write a correlated count' is a stronger answer than either alone.`]},{t:`note`,k:`tip`,x:"If you have one day: NULL semantics (chapter 1), the LEFT JOIN `ON` vs `WHERE` trap (chapter 3), top-N per group (chapter 5), and the predict-the-output drills (chapter 12). Those four cover the majority of what actually gets asked."}]}]},re={id:`scale`,num:`15`,title:`Scaling & Large Data`,kicker:`Replication, partitioning, sharding, and what to do when a table hits a billion rows`,sections:[{id:`scale-ladder`,title:`The scaling ladder`,blurb:`Every scaling question has a correct order of moves. Reaching for sharding first is the most common wrong answer in interviews.`,blocks:[{t:`p`,x:`Before any of the techniques below, know the order. Each rung costs more operationally than the one before it, so you climb only when the current rung is genuinely exhausted.`},{t:`table`,head:[`Rung`,`Move`,`Buys you`,`When it runs out`],rows:[[`1`,`Fix the query and the index`,`Often 10–1000× on one endpoint. Free.`,`When the queries are already efficient`],[`2`,`Add memory (buffer pool)`,`The working set fits in RAM; reads stop hitting disk`,`When the working set exceeds affordable RAM`],[`3`,`Cache in front (Redis)`,`Removes repeated reads entirely`,`When the workload is write-heavy or the data is unique per request`],[`4`,`Read replicas`,`Linear read scaling`,`When **writes** are the bottleneck, or lag becomes unacceptable`],[`5`,`Archive and partition`,`Keeps the hot table small; instant purges`,`When even the hot partition is too big for one machine`],[`6`,`Vertical partitioning / CQRS`,`Separates OLTP from analytics`,`When one entity's write volume alone saturates a node`],[`7`,`Shard`,`Linear write scaling`,`Nothing — but you have given up joins and cross-shard transactions`]]},{t:`note`,k:`ask`,x:`The single most valuable sentence in a scaling interview: **"before I shard, what is the actual bottleneck — reads, writes, storage, or a single bad query?"** Candidates who jump to sharding without asking are demonstrating that they have read blog posts rather than operated systems.`},{t:`q`,lvl:`medium`,title:`A 500-million-row table has gone slow. Diagnose it.`,tag:`the opening question of most scaling rounds`,stmt:"An `events` table has grown to 500M rows. Queries that took 50 ms now take 8 seconds. Walk through your diagnosis before proposing any architecture change.",hint:`Row count alone does not make a query slow. A B-tree with 500M rows is only about one level deeper than one with 5M.`,approaches:[{name:`1 — Measure`,idea:`Find out what is actually slow before theorising.`,sql:`-- which queries dominate, by TOTAL time not worst case
SELECT digest_text,
       count_star,
       ROUND(sum_timer_wait/1e12, 1)  AS total_sec,
       ROUND(avg_timer_wait/1e9, 1)   AS avg_ms,
       ROUND(sum_rows_examined / NULLIF(sum_rows_sent,0)) AS examined_per_row
FROM   performance_schema.events_statements_summary_by_digest
ORDER  BY sum_timer_wait DESC
LIMIT  10;`,why:"The `examined_per_row` ratio is the diagnostic that matters. A value near 1 means the access path is right and the problem is volume or hardware. A value of 10,000 means the server is reading ten thousand rows to return one, which is an indexing problem no amount of hardware fixes economically. Rank by **total** time: a 40 ms query run two million times an hour costs far more than the eight-second report someone complained about."},{name:`2 — Check the plan`,idea:`Confirm whether the index is being used and whether it is the right one.`,sql:`EXPLAIN ANALYZE
SELECT * FROM events
WHERE  user_id = 42 AND created_at >= '2024-06-01'
ORDER  BY created_at DESC
LIMIT  50;

-- looking for:
--   type = ALL            -> no index used
--   key  = NULL           -> no index used
--   Using filesort        -> sort not served by the index
--   rows estimate wildly different from actual -> stale statistics`,why:`A B-tree over 500M rows is roughly four levels deep versus three for 5M — one extra page read. Row count on its own almost never explains a 160× slowdown. What does explain it: the working set outgrew the buffer pool so every lookup became a disk seek, statistics went stale and the plan flipped, or a query that was always doing a scan only became noticeable at this size.`},{name:`3 — Check memory`,idea:`The most common real cause: the index no longer fits in RAM.`,sql:`SHOW ENGINE INNODB STATUS;   -- Buffer pool hit rate

SELECT ROUND((data_length + index_length)/1024/1024/1024, 1) AS gb,
       ROUND(index_length/1024/1024/1024, 1)                 AS index_gb
FROM   information_schema.tables
WHERE  table_name = 'events';

SELECT @@innodb_buffer_pool_size / 1024 / 1024 / 1024 AS pool_gb;`,why:`This is the cliff. While the hot index pages fit in the buffer pool, lookups are microseconds. The moment they do not, each lookup becomes a random disk read — roughly 100 µs on NVMe and 10 ms on spinning disk. Nothing about the query changed; the physics did. A buffer pool hit rate that has fallen from 99.9% to 95% means one in twenty reads now hits disk, which is exactly the shape of a sudden 100× regression.`},{name:`4 — Only then, architecture`,idea:`Now the fix follows from the finding.`,sql:`-- finding: wrong index          -> add the composite
CREATE INDEX ix_events_user_time ON events (user_id, created_at);

-- finding: working set > RAM     -> shrink the hot set
--   archive rows older than 90 days into events_archive
--   or partition by month and let old partitions go cold

-- finding: whole table is hot    -> then and only then, shard`,why:`Ninety per cent of 'we need to shard' conversations end at step 1 or 3. Archiving is dramatically underrated: if 95% of queries touch the last 30 days, moving older rows out reduces the hot index to 5% of its size and puts it back in memory. That is a one-afternoon change with none of the permanent complexity of sharding.`}],takeaway:`Row count does not cause slowness — buffer pool misses, bad access paths and stale statistics do. Diagnose in that order, and archiving usually beats sharding.`},{t:`q`,lvl:`medium`,title:`Read traffic has grown 10×`,tag:`read replicas`,stmt:`Your primary is CPU-saturated by read queries. Writes are only 5% of traffic. Design the fix and name everything that breaks.`,approaches:[{name:`The topology`,idea:`Send reads to replicas, writes to the primary.`,sql:`                 ┌──────────┐
   writes ──────▶│ PRIMARY  │
                 └────┬─────┘
                      │ binlog stream (asynchronous)
        ┌─────────────┼─────────────┐
        ▼             ▼             ▼
   ┌─────────┐  ┌─────────┐  ┌─────────┐
   │REPLICA 1│  │REPLICA 2│  │REPLICA 3│ ◀── reads
   └─────────┘  └─────────┘  └─────────┘`,why:`Reads scale linearly with replica count and each replica is a warm standby for failover. Replication is asynchronous by default, so the primary commits without waiting — no write latency cost, but the replicas are always slightly behind.`},{name:`What breaks — read-your-writes`,idea:`A user updates their profile, is redirected, and sees the old value.`,sql:`-- BROKEN: write to primary, immediate read from a lagging replica
UPDATE users SET name = 'Ada' WHERE id = 7;   -- primary
SELECT name FROM users WHERE id = 7;          -- replica: still 'Ada'

-- FIX 1: sticky routing — route this user's reads to the primary
--        for N seconds after any write
-- FIX 2: wait on the position
SELECT WAIT_FOR_EXECUTED_GTID_SET('<gtid from the write>', 1);
-- FIX 3: return the written value from the write path,
--        so the UI never needs to re-read`,why:`This is the failure mode that actually reaches users, and it appears within hours of adding replicas. Fix 3 is the cheapest and most reliable: the application already knows what it just wrote, so it should not ask the database again. Reserve fix 1 for cases where a subsequent page genuinely must reflect the write.`},{name:`What breaks — lag and load`,idea:`Replication is single-threaded per schema by default and lag is not evenly distributed.`,sql:`SHOW REPLICA STATUS\\G
-- Seconds_Behind_Source: 0      <- unreliable; it is 0 while idle too
-- better: compare a heartbeat table's timestamp on both sides

-- parallel replication helps
SET GLOBAL replica_parallel_workers = 8;
SET GLOBAL replica_parallel_type    = 'LOGICAL_CLOCK';`,why:"A single large `DELETE` or `ALTER` on the primary replays serially on each replica, so lag spikes to minutes precisely when traffic is heaviest. Monitor lag with a heartbeat row written every second and compared on the replica, not with `Seconds_Behind_Source`, which reports 0 when the replica is merely idle and misleads during a stall."},{name:`What does not get fixed`,idea:`Replicas do nothing for write throughput or storage.`,sql:`-- every replica holds a FULL copy of the data
-- every replica applies EVERY write

-- so replicas solve:      read QPS
-- replicas do not solve:  write QPS, storage size, single-table hot spots`,why:`This is the sentence that separates a real answer from a memorised one. Adding a tenth replica gives you ten times the read capacity and exactly the same write capacity as one machine, because every replica must apply every write. When writes saturate the primary, replicas are irrelevant and you need partitioning or sharding.`}],takeaway:`Replicas scale reads, not writes or storage. Budget for read-your-writes and lag monitoring from day one, not after the first user complaint.`}]},{id:`scale-partition`,title:`Partitioning and very large tables`,blocks:[{t:`q`,lvl:`medium`,title:`Partition a 2-billion-row events table`,tag:`partitioning`,stmt:`Design partitioning for an events table retaining 2 years of data, where 95% of queries cover the last 7 days and old data must be purged monthly.`,approaches:[{name:`Range partition by time`,idea:`One partition per month, with pruning on the date filter.`,sql:`CREATE TABLE events (
  id         BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
  user_id    BIGINT UNSIGNED NOT NULL,
  kind       VARCHAR(40)     NOT NULL,
  created_at DATETIME        NOT NULL,
  payload    JSON,
  PRIMARY KEY (id, created_at),          -- partition key MUST be in every unique key
  KEY ix_user_time (user_id, created_at)
)
PARTITION BY RANGE (TO_DAYS(created_at)) (
  PARTITION p2024_06 VALUES LESS THAN (TO_DAYS('2024-07-01')),
  PARTITION p2024_07 VALUES LESS THAN (TO_DAYS('2024-08-01')),
  PARTITION p2024_08 VALUES LESS THAN (TO_DAYS('2024-09-01')),
  PARTITION pmax     VALUES LESS THAN MAXVALUE
);`,note:"Queries filtered on `created_at` touch one or two partitions instead of 2 billion rows, and each partition has its own smaller B-tree that is far more likely to stay in the buffer pool.",why:"The constraint that trips everyone up is in the primary key: **MySQL requires the partition column to appear in every unique key**, which is why the PK is `(id, created_at)` and not `id`. That changes referential design — foreign keys pointing at this table now need both columns, and MySQL does not support foreign keys on partitioned tables at all. Say this out loud; it is the detail that shows you have actually done it."},{name:`Purge by dropping partitions`,idea:`The real payoff: deletion becomes a metadata operation.`,sql:`-- purging a month of data: instant, no undo log, no replication storm
ALTER TABLE events DROP PARTITION p2022_06;

-- compare with the alternative
DELETE FROM events WHERE created_at < '2022-07-01';
-- 80M rows, hours of runtime, gigabytes of undo,
-- replicas fall minutes behind, and the space is not returned to the OS

-- add next month ahead of time (automate this)
ALTER TABLE events
  REORGANIZE PARTITION pmax INTO (
    PARTITION p2024_09 VALUES LESS THAN (TO_DAYS('2024-10-01')),
    PARTITION pmax     VALUES LESS THAN MAXVALUE
  );`,note:`Retention goes from a multi-hour maintenance window to a sub-second DDL statement.`,why:"For most large log and event tables this is the *primary* reason to partition, ahead of query performance. A `DELETE` of 80M rows writes every removed row to the undo log, holds locks, bloats the tablespace without returning space, and replays serially on replicas. Dropping a partition unlinks a file. The one operational trap: if nobody automates creating next month's partition, everything lands in `pmax` and pruning silently stops helping."},{name:`When partitioning hurts`,idea:`A query that cannot prune is now slower than before.`,sql:`-- prunes to one partition: fast
SELECT * FROM events
WHERE created_at >= '2024-08-01' AND created_at < '2024-08-08' AND user_id = 42;

-- CANNOT prune: scans all 24 partitions, each with its own index lookup
SELECT * FROM events WHERE user_id = 42;

EXPLAIN SELECT ... ;   -- check the 'partitions' column`,note:"Always verify pruning in `EXPLAIN` — the `partitions` column names exactly which ones will be read.",why:`Partitioning replaces one big B-tree with N smaller ones. A query with the partition key is faster because it touches one tree; a query **without** it is slower because it touches all of them. If a large fraction of your queries cannot supply a time range, partitioning by time is the wrong axis, and you should question it rather than adding it reflexively.`}],takeaway:`Partition for **retention** first and pruning second. The partition key must be in every unique key, which reshapes the primary key and rules out foreign keys.`},{t:`q`,lvl:`hard`,title:`Count and paginate a billion rows`,tag:`large numbers · asked at Google, Meta`,stmt:"A UI needs to show 'about N results' and let users page deep into them. Exact `COUNT(*)` takes 40 seconds and page 50,000 times out. Fix both.",approaches:[{name:`Do not count exactly`,idea:`Almost no interface needs an exact count of a billion rows.`,sql:`-- 1. approximate from the optimiser's statistics: instant
SELECT table_rows
FROM   information_schema.tables
WHERE  table_name = 'events';

-- 2. approximate from EXPLAIN for a filtered count
EXPLAIN SELECT * FROM events WHERE kind = 'click';   -- 'rows' column

-- 3. cap it: "10,000+" is a perfectly good answer
SELECT COUNT(*) FROM (
  SELECT 1 FROM events WHERE kind = 'click' LIMIT 10001
) t;
-- returns at most 10001; the UI shows "10,000+" and stops there

-- 4. maintain a counter when the number is a product feature
UPDATE counters SET n = n + 1 WHERE name = 'events';`,why:"InnoDB cannot store a row count because MVCC means every transaction may legitimately see a different one — so an exact `COUNT(*)` must scan an index. Option 3 is the one most engineers miss and the one Google's own search results use: nobody scrolls past page 20, so counting past 10,001 is pure waste. Option 4 costs you a hot row, which needs the sharded-counter trick under high write rates."},{name:`Do not offset deeply`,idea:"`OFFSET 1000000` produces and discards a million rows.",sql:`-- O(offset): degrades linearly with page depth
SELECT * FROM events ORDER BY created_at DESC, id DESC
LIMIT 20 OFFSET 1000000;

-- keyset: O(1) at any depth, with an index on (created_at, id)
SELECT * FROM events
WHERE  (created_at, id) < (?, ?)      -- last row of the previous page
ORDER  BY created_at DESC, id DESC
LIMIT  20;`,why:`Keyset pagination seeks straight to the position in the index and reads 20 rows, so page 50,000 costs exactly what page 1 costs. It is also **stable**: inserts between requests cannot cause a row to appear twice or be skipped, which offset paging does routinely. The trade-off is that you cannot jump to an arbitrary page number — which is why infinite-scroll interfaces use it and numbered-page interfaces do not.`},{name:`When you truly need page numbers`,idea:`Precompute the boundaries rather than scanning to them.`,sql:`-- a page-index table, refreshed periodically
CREATE TABLE event_pages (
  page_no    INT PRIMARY KEY,
  first_id   BIGINT NOT NULL,
  first_time DATETIME NOT NULL
);

-- populated once by walking the index in order
INSERT INTO event_pages (page_no, first_id, first_time)
SELECT FLOOR((rn - 1) / 20) + 1, id, created_at
FROM  (SELECT id, created_at,
              ROW_NUMBER() OVER (ORDER BY created_at DESC, id DESC) AS rn
       FROM events) t
WHERE MOD(rn - 1, 20) = 0;

-- then any page is a keyset seek
SELECT * FROM events
WHERE (created_at, id) <= (SELECT first_time, first_id
                           FROM event_pages WHERE page_no = 50000)
ORDER BY created_at DESC, id DESC LIMIT 20;`,why:`This converts deep paging into a two-step keyset lookup at the cost of a periodically rebuilt index table. It is worth it only when page numbers are a genuine product requirement — usually they are a UI habit inherited from 2005, and the honest answer in an interview is to challenge the requirement before engineering around it.`}],takeaway:`At a billion rows, 'exact count' and 'jump to page 50,000' are product decisions, not engineering problems. Cap the count and use keyset paging.`},{t:`q`,lvl:`hard`,title:`Load 500 million rows without taking the system down`,tag:`bulk operations`,stmt:"You must import 500M rows into a live table. A naive `INSERT` loop projects to 40 hours and floods replication. Design the load.",approaches:[{name:`Solution`,idea:`Batch, defer index maintenance, and control the replication cost.`,sql:`-- 1. load into a NEW table, not the live one
CREATE TABLE events_new LIKE events;
ALTER TABLE events_new DROP INDEX ix_user_time;   -- drop secondary indexes

-- 2. bulk load, not row-by-row
SET autocommit = 0;
SET unique_checks = 0;         -- restore afterwards
SET foreign_key_checks = 0;
LOAD DATA INFILE '/data/events.csv'
  INTO TABLE events_new
  FIELDS TERMINATED BY ',' ENCLOSED BY '"'
  (id, user_id, kind, created_at);
COMMIT;

-- 3. rebuild indexes once, as a sort rather than 500M random inserts
ALTER TABLE events_new ADD INDEX ix_user_time (user_id, created_at);
SET unique_checks = 1; SET foreign_key_checks = 1;

-- 4. atomic swap
RENAME TABLE events TO events_old, events_new TO events;`,why:"Three separate wins compound here. `LOAD DATA INFILE` skips per-statement parsing and is typically 10–20× faster than individual inserts. Dropping secondary indexes converts 500M random B-tree insertions into one sequential sort at the end. And `RENAME TABLE` is atomic, so there is no window where the table is missing. If the data must land in a live table instead, batch it at 10–50k rows per transaction with a short pause between batches so replicas can keep pace — a single 500M-row transaction would generate an undo log larger than the data and stall replication for hours."}],takeaway:"Bulk loads: new table, no secondary indexes, `LOAD DATA`, rebuild indexes, atomic rename. Never one giant transaction."},{t:`qa`,q:`How do you estimate whether a table will fit in memory?`,a:"Estimate the row size (sum the column widths plus ~20 bytes of InnoDB overhead), multiply by row count, then add the indexes — which for a well-indexed table are often 30–100% of the data size again. Compare the **hot** portion against `innodb_buffer_pool_size`. The key insight is that you rarely need the whole table resident: if 95% of queries touch the last week, only that week's index pages need to be in memory. This is why archiving and time partitioning are so effective — they shrink the working set rather than the total.",sql:`SELECT table_name,
       ROUND(data_length/1024/1024/1024, 2)  AS data_gb,
       ROUND(index_length/1024/1024/1024, 2) AS index_gb,
       ROUND(data_length/NULLIF(table_rows,0)) AS avg_row_bytes
FROM   information_schema.tables
WHERE  table_schema = DATABASE()
ORDER  BY data_length + index_length DESC;`},{t:`qa`,q:`What is the difference between partitioning and sharding?`,a:`**Partitioning** splits one table across multiple files or storage units **within one database server** — the server still sees one logical table, joins and transactions work unchanged, and it is transparent to the application. **Sharding** splits data across **separate database servers**, each with its own connection, and the application (or a proxy) must route each query to the right one. Partitioning buys you retention and pruning; sharding buys you write and storage scaling. Only sharding costs you cross-shard joins, cross-shard transactions and global uniqueness — which is why you exhaust partitioning first.`},{t:`qa`,q:`How do you archive old data safely?`,a:`Copy first, verify, then delete — never the reverse. Run it in batches keyed on the primary key so each transaction is short, and archive whole entity trees together so foreign keys are never left dangling. Verify with counts **and** a checksum of the copied rows, not counts alone. If the table is time-partitioned, the whole exercise collapses into detaching a partition, which is why partitioning and archiving are usually designed together.`,sql:`-- one batch, repeated until zero rows affected
START TRANSACTION;
INSERT INTO events_archive
SELECT * FROM events WHERE created_at < '2023-01-01' ORDER BY id LIMIT 10000;
DELETE FROM events WHERE created_at < '2023-01-01' ORDER BY id LIMIT 10000;
COMMIT;`},{t:`qa`,q:`What is a hot partition or hot shard, and how do you avoid it?`,a:`One partition or shard receiving a disproportionate share of traffic, so it saturates while the others idle — which means you have paid all the complexity of distribution and gained none of the scaling. Causes: sharding by time (all writes go to 'now'), sharding by an unevenly distributed key (one tenant is 40% of your data), or a monotonically increasing key with range sharding. Fixes: hash the shard key rather than range it, add a salt or suffix to spread a hot key across N sub-keys, or give the outsized tenant a dedicated shard.`}]},{id:`scale-shard`,title:`Sharding`,blocks:[{t:`design`,title:`Shard a multi-tenant SaaS database`,tag:`sharding · asked at Salesforce, Atlassian, Stripe-style`,prompt:`A B2B product has 50,000 tenants and one MySQL primary now saturated on writes. The largest tenant is 200× the median. Design the sharding scheme.`,reqs:[`Almost every query is scoped to a single tenant`,`Cross-tenant queries exist only for internal analytics and billing`,`Tenants must be able to move between shards without downtime`,`One enormous tenant must not degrade the others`],estimate:`50,000 tenants · median 20k rows · p99 tenant 4M rows
total ≈ 2.5B rows, ~1.5 TB with indexes
write rate 12k/s peak, read rate 90k/s peak
target: 8 shards → ~190 GB and 1.5k writes/s per shard`,phases:[{name:`Choose the key`,idea:"The shard key is the single most consequential decision, and it is effectively permanent.\n\nCandidates: `tenant_id`, `user_id`, a hash of the primary entity, or time.",sql:`-- tenant_id: almost every query already filters on it
--   ✓ single-shard queries, natural isolation, easy to reason about
--   ✗ uneven — one tenant can dwarf a shard

-- user_id: finer grained, more even
--   ✗ tenant-wide queries now fan out to every shard  -> rejected

-- hash(entity_id): perfectly even
--   ✗ every tenant query becomes a scatter-gather     -> rejected

-- time: writes all land on "now"
--   ✗ guaranteed hot shard                            -> rejected`,note:`Pick the key that the dominant query pattern already filters on. Everything else optimises the wrong axis.`},{name:`Map tenants to shards`,idea:`Use a lookup table, not modulo arithmetic.`,sql:`-- directory service: the mapping is DATA, not a formula
CREATE TABLE tenant_shard (
  tenant_id   BIGINT PRIMARY KEY,
  shard_id    SMALLINT NOT NULL,
  state       ENUM('active','migrating','readonly') DEFAULT 'active',
  moved_at    TIMESTAMP NULL,
  KEY ix_shard (shard_id)
);

-- routing (cached aggressively in the app, invalidated on move)
SELECT shard_id FROM tenant_shard WHERE tenant_id = ?;`,note:`A directory makes rebalancing a row update instead of a full data reshuffle, and lets you pin an outsized tenant to its own shard.`},{name:`Why not modulo`,idea:"`shard = tenant_id % 8` looks elegant and is a trap.",sql:`-- with modulo, going from 8 to 16 shards remaps ~50% of all tenants
--   -> a migration of hundreds of gigabytes, all at once

-- consistent hashing reduces this to ~1/N of keys, but still
-- gives you no way to say "tenant 991 lives alone on shard 12"

-- the directory gives you both:
--   move one tenant  = copy its rows, flip one row, invalidate cache
--   add a shard      = move tenants to it gradually, on your schedule`,note:`The directory costs one cached lookup per request and removes the entire class of 'we cannot rebalance' problems.`},{name:`Move a tenant live`,idea:`Dual-write, backfill, verify, cut over, clean up.`,sql:`-- 1. mark migrating; app begins dual-writing to old and new shard
UPDATE tenant_shard SET state = 'migrating' WHERE tenant_id = 991;

-- 2. backfill historical rows in batches, oldest first

-- 3. verify: row counts AND checksums per table
SELECT COUNT(*), BIT_XOR(CRC32(CONCAT_WS('|', id, col_a, col_b)))
FROM   orders WHERE tenant_id = 991;   -- run on both shards, compare

-- 4. brief read-only window (seconds), drain in-flight writes,
--    flip the directory row, invalidate the routing cache
UPDATE tenant_shard SET shard_id = 12, state = 'active' WHERE tenant_id = 991;

-- 5. stop dual-writing, drop the old rows after a safety period`,note:"The order-independent checksum (`BIT_XOR` of per-row CRCs) catches corrupted values that a row-count comparison would miss entirely."},{name:`Handle what you lost`,idea:`Cross-shard joins, transactions and global uniqueness are gone. Plan replacements up front.`,sql:`-- LOST: joins across tenants
--   -> internal analytics reads from a warehouse fed by CDC, not from shards

-- LOST: AUTO_INCREMENT uniqueness across shards
--   -> Snowflake-style IDs: 41 bits time | 10 bits shard | 12 bits sequence
--   -> or UUIDv7 (time-ordered, so index locality is preserved)

-- LOST: cross-shard transactions
--   -> keep every transaction inside one shard by design
--   -> where genuinely cross-shard: saga with compensating actions,
--      never two-phase commit (it blocks on coordinator failure)

-- LOST: a global unique index on email
--   -> a small dedicated "identity" shard holding email -> tenant_id`,note:`Naming these losses unprompted is the strongest signal you can give in a sharding interview.`}],tradeoffs:[{choice:"Shard by `tenant_id`",pro:`Queries stay single-shard; natural blast-radius isolation per customer`,con:`Uneven distribution; one huge tenant needs special handling`},{choice:`Directory lookup over modulo`,pro:`Move one tenant at a time; pin outliers; add shards without a mass remap`,con:`An extra lookup and a cache to invalidate; the directory is a dependency to make highly available`},{choice:`Snowflake IDs`,pro:`Globally unique with no coordination; roughly time-ordered so index locality holds`,con:`Clock skew needs handling; IDs leak creation time and shard number`},{choice:`Analytics from a warehouse, not shards`,pro:`Cross-tenant queries stay possible without scatter-gather`,con:`Eventual consistency; a CDC pipeline to build and operate`}],takeaway:`That you exhausted the cheaper rungs first, that you chose the key from the dominant query pattern, that you used a directory so rebalancing is possible, and that you named what sharding costs you rather than presenting it as free.`},{t:`qa`,q:`What is a scatter-gather query and why is it dangerous?`,a:`A query that cannot be routed to one shard, so it is sent to all of them and the results merged in the application. It is dangerous for three reasons: latency becomes the **slowest** shard's latency rather than the average, so p99 degrades sharply as shard count grows; every shard does work for every such query, so throughput does not scale with shards; and one slow or failing shard degrades every scatter-gather query at once. If a query pattern needs scatter-gather frequently, the shard key is wrong for that pattern — serve it from a replica, a warehouse, or a differently-partitioned secondary index instead.`},{t:`qa`,q:`How do you generate unique IDs across shards?`,a:"Four options. **Snowflake-style**: timestamp bits + machine/shard id + a per-millisecond sequence — unique without coordination and roughly time-ordered, which keeps B-tree insert locality. **UUIDv7**: standardised, time-ordered, no central service, but 16 bytes rather than 8. **Per-shard offset auto-increment**: shard 3 uses `auto_increment_offset=3` with `auto_increment_increment=N` — simple but breaks when you add shards. **A central ticket server**: correct but a single point of failure and a latency tax on every insert. Snowflake or UUIDv7 is the usual answer; random UUIDv4 is the wrong one because random keys destroy clustered-index locality."},{t:`qa`,q:`When should you NOT shard?`,a:`When the bottleneck is reads (add replicas or a cache), when it is a single bad query or missing index, when the working set would fit in RAM after archiving, when total data is under a few terabytes and writes under a few thousand per second, or when you cannot identify a shard key that the dominant query pattern already filters on. Sharding is permanent, expensive in engineering time, and removes joins and transactions across the boundary. Modern single-node MySQL and PostgreSQL handle far more than most teams assume — tens of thousands of writes per second on decent hardware.`}]}]},ie={id:`loadbalance`,num:`16`,title:`Load Balancing & HA`,kicker:`L4 vs L7, connection pooling, proxies, failover, split-brain and traffic protection`,sections:[{id:`lb-basics`,title:`Load balancing fundamentals`,blurb:`Adding a second server is easy. Deciding which request goes where, and what happens when one dies mid-request, is the actual work.`,blocks:[{t:`q`,lvl:`easy`,title:`Layer 4 or Layer 7?`,tag:`the first question in any LB discussion`,stmt:`Explain the difference between L4 and L7 load balancing and when each is the right choice.`,approaches:[{name:`Layer 4 — transport`,idea:`Forwards TCP/UDP packets by IP and port without reading the payload.`,sql:`client ──TCP──▶ [ L4 LB ]  ──TCP──▶ backend
                     │
              sees: source IP, dest IP, ports
              does NOT see: URL, headers, cookies, HTTP method

-- examples: AWS NLB, HAProxy in tcp mode, IPVS, MetalLB
-- can handle millions of connections/s on modest hardware
-- can pass TLS straight through (no decryption at the LB)`,why:`L4 is fast because it does almost nothing — no parsing, no buffering, often no connection termination at all with direct server return. It is the right choice for raw TCP protocols, and specifically for **database traffic**, because the MySQL and PostgreSQL wire protocols are not HTTP and an L7 balancer has nothing useful to inspect. It also preserves end-to-end TLS, which matters when the balancer must not hold your certificates.`},{name:`Layer 7 — application`,idea:`Terminates the connection, parses the request, routes on its content.`,sql:`client ──▶ [ L7 LB ] ──▶ backend
                  │
           sees the full HTTP request, so it can:
             route /api/*  -> service A,  /img/* -> service B
             route on header, cookie, JWT claim, or geography
             retry a failed request on another backend (safely, if idempotent)
             terminate TLS, compress, cache, rate limit
             produce per-route metrics

-- examples: nginx, Envoy, HAProxy http mode, AWS ALB, Traefik`,why:`The decisive capability is **retry**: because L7 buffers the request, it can resend it elsewhere when a backend dies mid-request, which L4 cannot do — an L4 connection failure surfaces to the client. That, plus content routing and per-route observability, is why service meshes and API gateways are all L7. The cost is CPU, latency in the hundreds of microseconds, and the balancer holding your TLS keys.`},{name:`Choosing`,idea:`Match the layer to the protocol and the requirement.`,sql:`L4 when:
  the protocol is not HTTP        (MySQL, Postgres, Redis, gRPC over raw TCP)
  you need end-to-end TLS
  you need extreme throughput with minimal added latency
  routing depends only on address, not content

L7 when:
  you need path/header/cookie routing
  you need transparent retries on backend failure
  you want TLS termination, compression, or edge caching
  you want per-endpoint metrics and rate limits

-- most real systems run BOTH:
--   L4 at the edge for raw throughput and DDoS absorption
--   L7 behind it for routing and application-aware behaviour`,why:`The mistake worth avoiding is putting an L7 balancer in front of a database. It cannot parse the protocol, so it gives you nothing an L4 balancer does not, while adding latency and a connection-termination point. Database traffic wants either L4 or, better, a **protocol-aware proxy** like ProxySQL or PgBouncer, which is a different category entirely — covered in the next section.`}],takeaway:`L4 for non-HTTP and raw throughput; L7 when you need content routing or transparent retries. Never plain L7 in front of a database — use a protocol-aware proxy instead.`},{t:`q`,lvl:`medium`,title:`Choose a balancing algorithm`,tag:`round robin is rarely the right default`,stmt:`Five algorithms. For each, say when it wins and how it fails.`,approaches:[{name:`Round robin and weighted`,idea:`Distribute requests in rotation, optionally weighted by capacity.`,sql:`round robin:     A, B, C, A, B, C, ...
weighted:        A gets 2x traffic because it has 2x the cores

--  ✓ trivial, stateless, no coordination
--  ✗ assumes every request costs the same
--  ✗ a slow backend keeps receiving its full share and
--    becomes a latency sink for 1/N of your traffic`,why:`Round robin is the default in most configurations and is a poor fit whenever request cost varies — which is nearly always. One backend handling a slow report while the others serve fast lookups still gets every third request, so its queue grows without bound while the others idle.`},{name:`Least connections`,idea:`Send to the backend currently handling the fewest active requests.`,sql:`--  ✓ naturally routes away from slow or degraded backends:
--    a backend that is slow accumulates connections and stops
--    being chosen
--  ✓ the right default for variable request cost
--  ✗ needs shared or per-LB connection state
--  ✗ a freshly started backend has zero connections and gets
--    hammered instantly — "thundering herd on restart"`,why:`This is the sensible default for most services because it is implicitly load-aware without needing health scores. The restart problem is real and has a standard fix: **slow start**, where a newly healthy backend ramps its weight from 0 to 100% over 30–60 seconds so it can fill caches and JIT-compile before taking full traffic.`},{name:`Least response time / EWMA`,idea:`Weight by an exponentially weighted moving average of recent latency.`,sql:`score = active_connections × recent_p50_latency

--  ✓ the most load-aware option; degrades away from sick backends
--    faster than least-connections alone
--  ✗ can oscillate: everyone piles onto the fastest backend,
--    which then becomes slow, so everyone leaves
--  -> mitigate with "power of two choices": pick 2 backends at
--     random, send to the better one. Nearly optimal, no oscillation.`,why:`Power-of-two-choices is worth knowing by name. Sampling two backends at random and choosing the less loaded one gets you most of the benefit of global least-loaded routing while avoiding the herding behaviour that comes from every balancer independently agreeing on which backend is currently best.`},{name:`Consistent hashing`,idea:`Hash a key to a backend so the same key always lands in the same place.`,sql:`backend = consistent_hash(user_id or cache_key)

--  ✓ cache locality: the same key hits the same node, so
--    per-node caches actually get hits
--  ✓ adding/removing a node remaps only ~1/N of keys,
--    not all of them (unlike modulo)
--  ✗ uneven if the key distribution is skewed
--  ✗ a hot key concentrates on one node — no algorithm fixes that

-- used by: CDNs, cache tiers, sharded services, Envoy's ring hash`,why:`This is the algorithm that makes a distributed cache viable: without it, a request for the same object can land on any node, so every node caches everything and your effective cache size is one node's memory rather than the sum. The virtual-node refinement — placing each backend at many points on the ring — is what makes the distribution even.`},{name:`Sticky sessions`,idea:`Pin a client to one backend, usually by cookie.`,sql:`--  ✓ works with in-memory session state
--  ✗ uneven load; a backend cannot be drained without dropping users
--  ✗ restarting a backend logs out everyone pinned to it
--  ✗ makes autoscaling far less effective

-- the better answer is almost always: make backends STATELESS
--   move session state to Redis
--   then any request can go to any backend, and the whole
--   class of problems disappears`,why:`Sticky sessions are a workaround for state in the wrong place. They are legitimate for long-lived WebSocket connections, which are inherently pinned, and occasionally as a short-term migration step — but treating them as an architecture choice means accepting uneven load, painful deploys and weak autoscaling forever.`}],takeaway:`Least connections with slow start is the sensible default; consistent hashing when cache locality matters; power-of-two-choices to avoid herding. Sticky sessions mean state is in the wrong place.`},{t:`q`,lvl:`medium`,title:`Health checks that actually work`,tag:`where outages get amplified`,stmt:`A health check returns 200 while the service is unable to serve requests. Design checks that fail correctly — and explain how a bad health check turns a partial outage into a total one.`,approaches:[{name:`The useless check`,idea:`Checking that the process is running tells you almost nothing.`,sql:`GET /health  ->  200 OK
def health(): return "OK"

-- returns 200 while:
--   the database connection pool is exhausted
--   a downstream dependency is timing out
--   the disk is full
--   the JVM is in a GC death spiral
-- the LB keeps sending traffic to a backend that fails every request`,why:`A liveness check that only proves the process answers TCP is the most common form of this. It is not useless — it catches hard crashes and hangs — but it must not be the only check, or the balancer's picture of health is disconnected from whether requests succeed.`},{name:`Liveness vs readiness`,idea:`Two different questions with two different consequences.`,sql:`LIVENESS  — "should this process be restarted?"
  cheap, no dependencies, almost always returns 200
  failing it triggers a RESTART

READINESS — "should this instance receive traffic right now?"
  checks the DB pool, critical dependencies, warm-up state
  failing it removes the instance from the LB pool
  the process keeps running and can recover

-- conflating them is how a slow database causes a restart loop:
--   DB slow -> health check fails -> pod restarted -> cold cache
--   -> even slower -> restarted again -> cascading outage`,why:`This distinction is the whole answer. Restarting a process because its database is slow makes things strictly worse — you lose the warm cache and the in-flight requests, and the new process hits the same slow database. Readiness removes it from rotation without destroying it, so it can rejoin when the dependency recovers.`},{name:`The dependency trap`,idea:`A readiness check that fails on a shared dependency takes out every instance at once.`,sql:`-- DANGEROUS
def ready():
    db.query("SELECT 1")          # shared by all 200 instances
    redis.ping()
    payment_api.ping()            # a third party!
    return "OK"

-- the database has a 3-second blip
--   -> ALL 200 instances fail readiness simultaneously
--   -> the LB has zero healthy backends
--   -> 100% outage from a partial degradation

-- SAFER
--   check only what is LOCAL to this instance
--   for shared dependencies, degrade rather than fail:
--     serve cached data, return a partial response, shed load
--   and configure the LB to "fail open": if ALL backends are
--     unhealthy, send traffic anyway — a degraded response
--     beats no response`,why:`This is the mechanism by which health checks amplify outages, and it is worth stating unprompted. The fail-open behaviour (HAProxy, Envoy and ALB all support a variant) is the safety net: when every backend looks unhealthy, the most likely explanation is that the health check is wrong, not that every server died.`},{name:`Draining`,idea:`Removing a backend must not kill in-flight requests.`,sql:`deploy or scale-down sequence:
  1. readiness starts returning 503        -- LB stops sending NEW requests
  2. wait for the LB's check interval + a margin  (often 15-30 s)
  3. in-flight requests complete           -- connection draining
  4. THEN stop the process

-- skipping step 2 is why deploys show a spike of 502s:
-- the process is gone before the LB noticed it should stop`,why:"The gap between 'I am shutting down' and 'the balancer knows' is entirely a function of the check interval, and it must be waited out explicitly. Kubernetes calls this the `preStop` hook plus `terminationGracePeriodSeconds`; the principle is identical anywhere. Every deploy that produces a burst of errors is usually this and nothing more."}],takeaway:`Separate liveness from readiness, never fail readiness on a shared dependency, configure fail-open, and drain before stopping. Bad health checks turn degradation into an outage.`}]},{id:`lb-connections`,title:`Database connections and proxies`,blurb:`The database tier has its own balancing problem, and the usual instinct — a bigger connection pool — makes it worse.`,blocks:[{t:`q`,lvl:`hard`,title:`Size a connection pool`,tag:`the counter-intuitive one`,stmt:"Your app has 50 instances, each with a pool of 100 connections, and the database is at `max_connections = 5000` and struggling. What is wrong, and what should the pool size be?",hint:`How many queries can the database actually execute at the same time?`,approaches:[{name:`Why more connections is slower`,idea:`A connection is not a worker. Concurrency is bounded by cores and disks.`,sql:`-- 50 instances × 100 = 5,000 connections
-- the database has 16 cores

-- it cannot execute 5,000 queries at once. It executes ~16 and
-- CONTEXT-SWITCHES between 5,000, while:
--   each connection costs memory (sort buffers, join buffers,
--     per-connection state — often ~1-10 MB in MySQL)
--   the scheduler thrashes
--   lock contention rises because more transactions are open at once
--   every query gets slower, so each holds its connection longer,
--     so the pool feels too small — and someone increases it again`,why:`This is the feedback loop that makes the problem self-reinforcing. Adding connections increases contention, which increases latency, which increases connection hold time, which exhausts the pool, which prompts another increase. The queue has to live somewhere; the question is whether it queues cheaply in the pool or expensively inside the database.`},{name:`The sizing formula`,idea:`Start from cores and disks, not from instance count.`,sql:`connections ≈ (core_count × 2) + effective_spindle_count

-- 16 cores, SSD-backed:  ~32-40 TOTAL connections
-- across 50 app instances, that is fewer than 1 each

-- which is why you need a PROXY between them:
--   50 app instances × pool of 20  (cheap, local, mostly idle)
--        ▼
--   [ PgBouncer / ProxySQL ]  multiplexes onto
--        ▼
--   ~40 real database connections

-- Little's Law sanity check:
--   concurrency = throughput × latency
--   2,000 qps × 5 ms = 10 concurrent queries. Ten. Not 5,000.`,why:`The formula is from PostgreSQL's own guidance and holds broadly. The Little's Law check is the one to do in an interview because it takes ten seconds and is usually startling: a service doing 2,000 queries per second at 5 ms each needs about ten concurrent connections, and anything beyond that is queueing, not parallelism.`},{name:`The proxy layer`,idea:`Connection multiplexing is what makes small pools work with many instances.`,sql:`-- PgBouncer pooling modes
--   session     : connection held for the client's whole session
--                 (no multiplexing benefit; safe for everything)
--   transaction : connection returned after each transaction
--                 (the useful mode — 1000 clients : 40 connections)
--   statement   : returned after each statement
--                 (fastest, breaks multi-statement transactions)

-- transaction mode breaks:
--   session-level state: SET, prepared statements, advisory locks,
--   temp tables, LISTEN/NOTIFY
--   -> your ORM must not rely on them

-- ProxySQL adds, for MySQL:
--   read/write splitting by query rule
--   query rewriting, caching, and mirroring
--   connection multiplexing
--   failover-aware routing (it knows which host is primary)`,why:"Transaction pooling is the mode that delivers the 100:1 multiplexing ratio, and its constraint is worth stating: because a client no longer owns a connection between transactions, anything stored on the connection disappears. Most ORMs are fine; the ones that emit `SET` statements or use server-side prepared statements need configuration."},{name:`Connection storms`,idea:`The failure mode where the pool itself takes the database down.`,sql:`-- database has a 2-second hiccup
--   -> queries queue, pools exhaust
--   -> apps open MORE connections (up to max)
--   -> connection setup itself is expensive (auth, TLS handshake,
--      per-connection memory allocation)
--   -> database now spends its capacity on handshakes
--   -> it gets slower -> more connections -> collapse

-- defences:
--   hard cap the pool, and let requests QUEUE in the app
--   fail fast with a short pool-acquire timeout (say 1-2 s)
--   circuit breaker: stop trying for a while after N failures
--   exponential backoff WITH JITTER on reconnect
--   reserve a superuser connection slot so you can still log in
--     (Postgres: superuser_reserved_connections)`,why:`The reserved connection slot is the detail that saves an incident: without it, a connection storm locks you out of the very database you need to inspect. Jitter on reconnect matters just as much — without it, every instance that lost its connection retries in lockstep and re-creates the storm on a fixed interval.`}],takeaway:"Pool size comes from cores, not instance count — roughly `cores × 2`. Multiplex with PgBouncer or ProxySQL, cap hard, fail fast, and add jitter to reconnects."},{t:`q`,lvl:`medium`,title:`Route reads and writes`,tag:`read/write splitting`,stmt:`You have one primary and three replicas. Design the routing, and name every case where sending a read to a replica is wrong.`,approaches:[{name:`Where to make the decision`,idea:`Three places, with different trade-offs.`,sql:`-- 1. IN THE APPLICATION
--    explicit: db.primary.query(...) / db.replica.query(...)
--    ✓ full control; the developer knows what the query needs
--    ✗ every developer must get it right, every time

-- 2. IN A PROXY (ProxySQL, MaxScale, pgpool)
--    rules: SELECT -> replica, everything else -> primary
--    ✓ no application change; centralised failover awareness
--    ✗ heuristics are wrong sometimes: SELECT ... FOR UPDATE,
--      SELECT from a function that writes, or a SELECT inside
--      an explicit transaction

-- 3. IN THE DRIVER / ORM
--    ✓ transaction-aware: it knows a transaction is open
--    ✗ varies by language; failover handling is often weak

-- practical answer: proxy for the default, with an application
-- override for the cases the proxy cannot know about`,why:"The proxy's blind spot is transactions: once `BEGIN` has been issued, every statement in that transaction must go to the primary, including reads, because the replica has no idea about your uncommitted changes. ProxySQL handles this with a rule that pins a session to the primary for the duration of a transaction — and that rule being present or absent is the difference between working and subtly broken."},{name:`When a replica read is wrong`,idea:`Five cases worth listing explicitly.`,sql:`1. INSIDE A TRANSACTION
   the replica cannot see your uncommitted writes

2. READ-YOUR-WRITES
   user updates their profile, is redirected, reads stale data
   -> route to primary for N seconds after a write, or return
      the written value from the write path

3. READ-MODIFY-WRITE
   SELECT balance (replica, stale) then UPDATE (primary)
   -> the decision was made on stale data. Always read from
      the primary when the value drives a write.

4. SELECT ... FOR UPDATE
   a locking read is a write in disguise; it must be on the primary

5. ANYTHING WHERE LAG IS UNACCEPTABLE
   auth checks, permission checks, balance display after payment`,why:`Case 3 is the one that causes real damage, because it is silent — the query succeeds, the update succeeds, and the result is simply wrong. Any read whose value is used to decide a subsequent write must come from the primary, and putting that rule in words is more valuable than any routing configuration.`},{name:`Load-balancing the replicas`,idea:`Replicas are not interchangeable and must not be treated as such.`,sql:`-- balance across replicas by:
--   least connections, with lag as a health signal
--   REMOVE a replica from rotation when its lag exceeds a threshold

-- ProxySQL: max_replication_lag per host
--   a replica lagging > 10 s stops receiving reads automatically

-- and monitor lag properly:
--   a heartbeat row written every second on the primary,
--   compared on each replica
--   NOT Seconds_Behind_Source, which reads 0 while idle`,why:"Lag-aware routing is what makes replica reads safe in practice. Without it, one replica stalled by a long-running query or a large `ALTER` silently serves minutes-old data to a fraction of your users — which presents as an intermittent, unreproducible bug rather than as an outage."}],takeaway:`Route in a proxy, override in the application. Reads inside a transaction, reads that drive writes, and locking reads all belong on the primary — and pull lagging replicas out of rotation automatically.`}]},{id:`lb-ha`,title:`Failover and high availability`,blocks:[{t:`design`,title:`Highly available database tier`,tag:`failover, split-brain, RTO/RPO · asked at Amazon, Uber, Stripe-style`,prompt:`Design the data tier for a service that must survive the loss of a database node, a whole availability zone, and an operator mistake — and say what each guarantee costs.`,reqs:[`RTO under 60 seconds for a node failure`,`RPO of zero for committed transactions`,`Survive the loss of one availability zone`,"Recover from an accidental `DELETE` from 3 hours ago"],estimate:`writes 3k/s · reads 40k/s · 1.5 TB
3 availability zones
RTO = how long you are down · RPO = how much data you lose
  these two numbers drive every decision below`,phases:[{name:`Topology`,idea:`One primary, replicas spread across zones, with the replication mode chosen from RPO.`,sql:`        AZ-a                AZ-b                AZ-c
     ┌─────────┐        ┌─────────┐        ┌─────────┐
     │ PRIMARY │───────▶│ REPLICA │        │ REPLICA │
     └─────────┘  semi- └─────────┘  async └─────────┘
                   sync

-- ASYNC:      primary commits without waiting
--             RPO > 0 — you lose whatever had not shipped
-- SEMI-SYNC:  primary waits for ONE replica to ACK receipt
--             RPO ≈ 0, at the cost of one network round trip per commit
-- SYNC/quorum: waits for a majority to APPLY  (Group Replication,
--             Patroni with sync mode, Aurora, Spanner)
--             RPO = 0, highest write latency`,note:`RPO zero is not free: it puts a cross-zone round trip — typically 1–2 ms — into every commit. Ask whether the business actually requires it before paying it on every write.`},{name:`Detect and promote`,idea:`Automatic failover needs an orchestrator with a quorum, not a script.`,sql:`-- components
--   Orchestrator (MySQL) / Patroni + etcd (Postgres) / RDS Multi-AZ
--   they hold leadership in a consensus store, so the DECISION
--   to fail over is itself made by a majority

-- sequence
1. several observers agree the primary is unreachable (not one)
2. pick the most advanced replica (highest applied GTID/LSN)
3. FENCE the old primary  -- the critical step
4. promote the chosen replica
5. repoint the other replicas at the new primary
6. update the routing layer

-- timing: detection 10-20 s + promotion 5-10 s ≈ 30 s RTO`,note:`Requiring several independent observers to agree is what prevents a network blip between the orchestrator and the primary from triggering an unnecessary failover.`},{name:`Split-brain`,idea:`The failure mode that destroys data, and the only real defence.`,sql:`-- the primary is not dead, only PARTITIONED from the orchestrator
--   -> a replica is promoted
--   -> two primaries accept writes
--   -> both diverge; merging them is a manual, lossy exercise

-- FENCING — make the old primary unable to accept writes:
--   revoke its VIP / remove it from the proxy's writer hostgroup
--   SET GLOBAL read_only = ON, super_read_only = ON
--   STONITH: power off or network-isolate the node
--   Patroni: the leader key in etcd has a TTL; a primary that
--            cannot renew it DEMOTES ITSELF

-- the self-demotion pattern is the strongest:
--   a partitioned primary removes itself without needing to be
--   reachable by anyone`,note:`Self-demotion on lease expiry inverts the problem: instead of requiring the orchestrator to reach a partitioned node, the node's own inability to reach the consensus store is the signal.`},{name:`Route around it`,idea:`Clients must find the new primary without redeploying.`,sql:`-- DNS with a low TTL
--   ✗ resolvers and JVMs cache beyond the TTL. Slow and unreliable.

-- Virtual IP that moves
--   ✓ instant for clients
--   ✗ only works within one L2 network; awkward across zones

-- PROXY (ProxySQL / HAProxy / RDS endpoint)   ← usually best
--   ✓ clients always connect to one stable address
--   ✓ the proxy learns the new primary from the orchestrator
--   ✓ can queue or fail fast during the window
--   ✗ the proxy must itself be HA — run several behind an L4 LB

-- and the applications must reconnect gracefully:
--   short connect timeouts, retry with jittered backoff,
--   and a circuit breaker so they do not storm the new primary`,note:`The reconnect storm at the moment of promotion is a real secondary failure: every application instance reconnects simultaneously to a database with a cold buffer pool.`},{name:`Backups are a separate axis`,idea:`Replication is not a backup. It replicates mistakes faithfully.`,sql:`-- an accidental DELETE reaches every replica in milliseconds
-- HA protects against node loss; backups protect against ERRORS

-- point-in-time recovery
--   full backup (xtrabackup / pg_basebackup) + retained WAL/binlog
--   -> restore to 3 hours ago, minus one statement

-- delayed replica: a replica deliberately kept 1 hour behind
--   CHANGE REPLICATION SOURCE TO SOURCE_DELAY = 3600;
--   -> for the "we just dropped a table" case, this is the
--      fastest recovery available: stop it before it applies
--      the bad statement

-- and: a backup that has never been restored is not a backup`,note:`The delayed replica is the cheapest insurance against operator error and is under-used — it turns a multi-hour restore into a few minutes.`}],tradeoffs:[{choice:`Semi-synchronous replication`,pro:`RPO near zero without full quorum latency`,con:`Adds a round trip to every commit; degrades if the ACKing replica is slow`},{choice:`Automatic failover`,pro:`RTO in seconds instead of however long a human takes`,con:`Can fail over unnecessarily; without fencing it risks split-brain, which is worse than downtime`},{choice:`Proxy-based routing`,pro:`Stable client endpoint, no DNS caching problems`,con:`The proxy becomes critical infrastructure and must itself be redundant`},{choice:`Delayed replica`,pro:`Minutes-fast recovery from operator error`,con:`An extra node earning nothing in the common case`}],takeaway:`That you separated RTO from RPO, chose the replication mode from RPO rather than by default, named fencing as the defence against split-brain, and stated that replication is not a backup.`},{t:`qa`,q:`What is the difference between high availability and disaster recovery?`,a:"**HA** handles component failure within one deployment — a node or a zone dies and the system continues, typically with RTO in seconds and no data loss, via replication and automatic failover. **DR** handles the loss of the whole deployment — a region outage, a corrupted dataset, a ransomware event — typically with RTO in hours and some data loss, via backups and cross-region copies. They are different budgets solving different problems, and the mistake is assuming multi-AZ replication gives you DR: a bad migration or a `DROP TABLE` replicates perfectly to every replica in every zone."},{t:`qa`,q:`Active-active or active-passive across regions?`,a:`**Active-passive** has one region taking writes and the other on standby: simple, no write conflicts, but the standby capacity is idle and failover means promoting across a WAN. **Active-active** takes writes in both, which requires conflict resolution — last-write-wins, CRDTs, or partitioning the key space so each region owns a disjoint set of records. Partitioning by key ownership (users in EU write to EU) is by far the most tractable form, because there are no conflicts to resolve. True multi-master with arbitrary writes anywhere is what systems like Spanner spend enormous engineering effort on, and is rarely worth building yourself.`},{t:`qa`,q:`Why is DNS a poor failover mechanism?`,a:`TTLs are advisory. Resolvers, corporate proxies, container runtimes and especially JVMs (which historically cached DNS forever by default) hold onto records long past expiry, so a 60-second TTL routinely produces 10+ minutes of clients still connecting to a dead host. DNS also gives you no control over the transition and no way to fail fast. It is acceptable for coarse-grained regional routing where minutes are tolerable; for database failover, a proxy or a moving virtual IP gives a stable client-facing address and switches in seconds.`},{t:`qa`,q:`What is a quorum and why do clusters have an odd number of nodes?`,a:"A quorum is the majority required to make a decision — `floor(N/2) + 1`. Requiring a majority guarantees that two disjoint groups cannot both reach one, which is what prevents split-brain. Odd numbers are used because they maximise fault tolerance per node: 3 nodes tolerate 1 failure and 4 nodes also tolerate only 1, so the fourth node adds cost and no resilience. It also avoids the exact-tie case where a 2-2 partition leaves neither side able to proceed."}]},{id:`lb-protect`,title:`Protecting the system from traffic`,blocks:[{t:`q`,lvl:`hard`,title:`Rate limiting: pick the algorithm`,tag:`asked at Stripe, Cloudflare, Atlassian-style`,stmt:`Implement rate limiting at 100 requests per minute per user. Compare fixed window, sliding window and token bucket, and say where the limiter should live.`,approaches:[{name:`Fixed window`,idea:`Count per calendar minute. Cheapest, and wrong at the boundary.`,sql:`key = "rate:" + user_id + ":" + current_minute
n = redis.INCR(key)
if n == 1: redis.EXPIRE(key, 60)
if n > 100: reject

--  ✓ one round trip, tiny memory
--  ✗ BOUNDARY BURST: 100 requests at 10:00:59 and 100 more at
--    10:01:00 = 200 requests in one second, both "within limit"`,why:`The 2× boundary burst is the known flaw. It is often acceptable — for protecting an API from casual abuse the approximation is fine — but it is not acceptable when the limit exists to protect a downstream system with a hard capacity.`},{name:`Sliding window log`,idea:`Exact, at the cost of storing one entry per request.`,sql:`-- sorted set, score = timestamp
ZREMRANGEBYSCORE rate:991 0 (now - 60000)   -- evict old
n = ZCARD rate:991
if n < 100:
    ZADD rate:991 now  now-uuid
    EXPIRE rate:991 60
else: reject

--  ✓ exact; no boundary burst
--  ✗ memory is O(limit) per user; at a limit of 10,000 that is
--    10,000 entries per active user`,why:`Exactness costs memory proportional to the limit. It is the right choice for low limits where precision matters — login attempts, password resets, expensive API endpoints — and the wrong one for high-volume general throttling.`},{name:`Sliding window counter`,idea:`The practical compromise: interpolate between two fixed windows.`,sql:`-- weight the previous window by how much of it is still in view
prev = count in the previous minute
curr = count in the current minute
elapsed_fraction = seconds_into_current_minute / 60

estimate = prev * (1 - elapsed_fraction) + curr
if estimate > 100: reject

--  ✓ two counters per user, O(1) memory
--  ✓ error under ~1% in practice; no boundary burst
--  -> this is what most production limiters actually use`,why:`This is the default choice at scale — Cloudflare published the approach and it is what most gateways implement. It assumes traffic within the previous window was evenly distributed, which is why it is approximate, but the error is small enough that the memory saving dominates.`},{name:`Token bucket`,idea:`Allows controlled bursts, which is usually what you actually want.`,sql:`-- bucket refills at a steady rate up to a capacity
tokens = min(capacity, tokens + (now - last_refill) * rate)
if tokens >= 1:
    tokens -= 1; allow
else: reject

-- capacity 100, rate 100/min
--   -> sustained 100/min, but a burst of 100 at once is allowed
--   -> matches real client behaviour (page load = 20 parallel calls)

-- leaky bucket is the inverse: enforces a SMOOTH output rate,
-- queueing rather than rejecting — right for protecting a
-- downstream system with fixed throughput`,why:`Token bucket is the best default for user-facing APIs because real clients are bursty by nature and a strict per-second limit rejects legitimate traffic. Leaky bucket is the one to reach for when the thing being protected — a payment provider, a legacy system — cannot absorb bursts at all.`},{name:`Where it lives`,idea:`As far from the protected resource as possible.`,sql:`edge / CDN     -> volumetric abuse, cheapest possible rejection
API gateway    -> per-key and per-endpoint limits (the usual home)
service        -> business rules ("3 password resets per day")
database       -> too late; the work has already been done

-- distributed correctness: with 50 gateway instances, a LOCAL
-- counter means the real limit is 50x the intended one
--   -> shared counter in Redis (one round trip), or
--   -> allocate each instance limit/N and accept the imprecision

-- always return 429 with Retry-After, and rate limit headers.
-- a client that cannot tell it is being limited will retry harder.`,why:`Rejecting at the edge costs a fraction of a millisecond; rejecting after the query has run costs everything the query cost. The distributed-counter point is the one people miss in interviews: per-instance limiting silently multiplies the limit by the instance count, which is the difference between a working limiter and a decorative one.`}],takeaway:"Token bucket for user-facing APIs, sliding-window counter for high-volume throttling, sliding-window log when exactness matters. Limit at the edge, share the counter, and always return `Retry-After`."},{t:`q`,lvl:`hard`,title:`Stop a retry storm`,tag:`cascading failure`,stmt:`A downstream service slows down. Within two minutes the entire system is unavailable even though the original problem affected only one endpoint. Explain the cascade and design the defences.`,approaches:[{name:`The cascade`,idea:`Each layer's reasonable behaviour compounds into collapse.`,sql:`1. service D slows from 50 ms to 5 s
2. callers hold threads/connections 100x longer
3. their pools exhaust -> THEY start failing
4. their callers retry (3x each) -> load on D TRIPLES
5. D, already struggling, now gets 3x traffic -> dies completely
6. retries continue against a dead service, consuming
   every caller's capacity
7. everything is down

-- note step 4: retries turn a partial degradation into an
-- amplification attack you launched against yourself.
-- With 3 layers each retrying 3 times, one user request
-- becomes 27 requests at the bottom.`,why:`Retry amplification is multiplicative across layers, which is why it goes from 'one slow endpoint' to 'total outage' so fast. Naming the exponent — retries per layer, raised to the number of layers — is the clearest way to explain it.`},{name:`Timeouts and budgets`,idea:`Every call needs a timeout, and timeouts must shrink as you go deeper.`,sql:`-- a call with no timeout is a resource leak with extra steps

-- deadline propagation: pass the remaining budget downstream
user request        budget 1000 ms
  -> service A      900 ms remaining
    -> service B    600 ms remaining
      -> database   400 ms remaining

-- if the budget is exhausted, fail IMMEDIATELY rather than
-- starting work whose result nobody will wait for

-- timeouts must be shorter than the caller's, or the caller
-- gives up while you keep holding resources on its behalf`,why:`Deadline propagation is the discipline that prevents work continuing after nobody is waiting for it. Without it, a timed-out request still consumes a database connection, a thread and CPU all the way down the stack — so the system does maximum work at exactly the moment it has least capacity.`},{name:`Circuit breakers`,idea:`Stop calling something that is failing.`,sql:`CLOSED    normal; count failures
   │  failure rate > 50% over the window
   ▼
OPEN      reject IMMEDIATELY without calling. no load on D.
   │  after a cool-off (say 30 s)
   ▼
HALF-OPEN let a few probes through
   ├─ succeed -> CLOSED
   └─ fail    -> OPEN again

-- the breaker does two things at once:
--   protects the CALLER  (threads not tied up on doomed calls)
--   protects the CALLEE  (gets a chance to recover, unloaded)`,why:`The second effect is the one people overlook. A struggling service cannot recover while still receiving full traffic plus retries; opening the breaker gives it the idle time it needs to drain its queues. Half-open probing is what lets recovery be detected without reopening the floodgates.`},{name:`Retries done properly`,idea:`Retry rarely, with jitter, and only when it can help.`,sql:`-- exponential backoff WITH FULL JITTER
sleep = random(0, min(cap, base * 2^attempt))
-- without jitter, every client retries in lockstep and
-- recreates the spike on a fixed cadence

-- retry BUDGET: cap retries as a fraction of total requests
--   "at most 10% of requests may be retries"
--   -> amplification is bounded no matter how bad things get

-- only retry:
--   idempotent operations, or ones with an idempotency key
--   errors that might succeed next time (timeout, 503)
--   NOT 400, 401, 404, or a validation failure

-- do NOT retry at every layer. Pick one — usually the outermost.`,why:`The retry budget is the strongest single defence because it bounds amplification structurally rather than relying on every service configuring backoff correctly. Retrying at one layer only is the other half: three layers each retrying three times is 27× amplification, and no amount of jitter fixes that.`},{name:`Load shedding and bulkheads`,idea:`Decide what to drop before you are forced to drop everything.`,sql:`-- LOAD SHEDDING: reject early when the queue is too deep
if queue_depth > threshold: return 503 immediately
-- serving 70% of traffic well beats serving 100% at 30 s latency
-- shed by priority: drop analytics and prefetch before checkout

-- BULKHEADS: separate pools per dependency
--   pool for service D  (20 connections)
--   pool for service E  (20 connections)
-- D failing exhausts only D's pool. E keeps working.
-- one shared pool means any single failure starves everything.`,why:`Bulkheading is what converts 'a dependency failed' into 'a feature is degraded' rather than 'the service is down'. Load shedding is uncomfortable to propose and is the correct behaviour: a system that admits more work than it can complete does no work at all, and every request times out instead of most requests succeeding.`}],takeaway:`Timeouts everywhere with deadline propagation, circuit breakers, jittered backoff, a retry budget, retries at one layer only, bulkheaded pools, and load shedding by priority.`},{t:`guess`,setup:`-- 3 service layers, each retrying 3 times on failure
-- 1,000 user requests/s reach layer A`,sql:`-- layer D becomes unavailable.
-- how many requests/s does D receive?`,out:`A -> B:  1,000 × 3 =  3,000/s
B -> C:  3,000 × 3 =  9,000/s
C -> D:  9,000 × 3 = 27,000/s

D receives 27x its normal load while already failing.`,why:"Retry amplification is multiplicative across layers, so `retries^layers` is the factor. This is why the guidance is to **retry at exactly one layer** — usually the outermost, closest to the user — and to enforce a retry budget capping retries as a percentage of total traffic. Jittered backoff spreads the spike over time but does not reduce the total, so it is a necessary and insufficient defence on its own."},{t:`qa`,q:`What is backpressure and how does a database express it?`,a:"Backpressure is a slow consumer telling a fast producer to slow down, rather than silently buffering until something bursts. TCP does it with window size; a bounded queue does it by blocking or rejecting on `put`. A database expresses it through connection pool exhaustion, lock waits and rising latency — but these are **implicit** and easy to misread, which is why teams respond by raising the pool size, removing the backpressure and making things worse. The correct response is to propagate it upward: a full pool should cause a fast `503` at the edge, not an unbounded queue of waiting requests."},{t:`qa`,q:`Should a load balancer retry a failed request?`,a:"Only for connection-level failures where the request provably never reached the backend, and only for idempotent methods. An L7 balancer buffering the request can safely retry a `GET` when a backend refuses the connection or dies before responding. It must **not** retry after a timeout on a `POST`, because the request may well have been processed and retrying duplicates it. Envoy and nginx both let you configure exactly which conditions retry, and getting this wrong produces duplicate orders and double charges — which is why an idempotency key on write endpoints is the real fix."},{t:`qa`,q:`How does an anycast IP differ from GeoDNS?`,a:`**GeoDNS** returns different IP addresses depending on where the resolver appears to be, so routing happens at name resolution and inherits every DNS caching problem — including resolvers that are nowhere near the actual user. **Anycast** advertises the same IP from many locations and lets BGP route each packet to the topologically nearest one, so failover is a routing convergence rather than a cache expiry, and it happens in seconds. Anycast is the standard for CDNs and DNS itself; GeoDNS remains common because it needs no network-level control and can express richer policies.`},{t:`qa`,q:`Where should a CDN sit relative to your load balancers?`,a:`In front of everything. A CDN absorbs static assets and cacheable responses at the edge, so they never reach your load balancer or origin at all — often 80–95% of requests for a content-heavy site. It also terminates TLS close to the user, absorbs volumetric DDoS, and can serve stale content while your origin is down, which is a genuinely useful availability property. What it cannot do is cache personalised or authenticated responses, so the design question is which responses can be made cacheable — often more than teams assume, once you separate the personalised fragment from the shared page.`}]}]},ae={id:`cache`,num:`17`,title:`Caching — Redis & Memcached`,kicker:`Patterns, invalidation, Redis data structures, and the failure modes that take sites down`,sections:[{id:`cache-patterns`,title:`Cache patterns and invalidation`,blurb:`Caching is easy to add and hard to make correct. Almost every production incident here comes from invalidation or from a failure mode, not from the cache itself.`,blocks:[{t:`table`,head:[`Pattern`,`How it works`,`Use when`,`Watch out for`],rows:[[`**Cache-aside** (lazy loading)`,`App checks cache; on miss reads DB and populates`,`The default. Most read-heavy workloads`,`First request is always slow; stale data between writes; stampede on expiry`],[`**Read-through**`,`Cache library owns the DB read on miss`,`You want the miss logic in one place`,`Same staleness issues; ties you to the cache client`],[`**Write-through**`,`Write goes to cache and DB synchronously`,`Reads immediately after writes must hit warm cache`,`Every write pays cache latency; caches data that may never be read`],[`**Write-behind** (write-back)`,`Write to cache, flush to DB asynchronously`,`Very high write rates that tolerate loss (counters, metrics)`,`**Data loss** if the cache dies before flushing. Rarely acceptable for source-of-truth data`],[`**Refresh-ahead**`,`Proactively refresh entries before they expire`,`Predictable hot keys where a miss is unacceptable`,`Wasted refreshes for keys nobody asks for again`]]},{t:`q`,lvl:`medium`,title:`Implement cache-aside correctly`,tag:`the pattern everyone writes and few write safely`,stmt:`Write cache-aside for a product page, then identify the race condition in the naive version.`,approaches:[{name:`The naive version`,idea:`Read from cache, fall back to the database, populate on the way out.`,sql:`-- pseudocode
value = redis.GET("product:" + id)
if value is not null:
    return deserialize(value)

row = db.query("SELECT * FROM products WHERE id = ?", id)
redis.SET("product:" + id, serialize(row), EX=300)
return row

-- and on update:
db.query("UPDATE products SET price = ? WHERE id = ?", price, id)
redis.SET("product:" + id, serialize(new_row), EX=300)   -- <- the bug`,why:`The update path writes the new value into the cache, which looks efficient and introduces a race. Two concurrent requests — one reader that missed, one writer — can interleave so the reader's stale value is written **after** the writer's fresh one, leaving the cache permanently wrong until the TTL expires. The read fetched from the database before the write committed, but stored into Redis after it.`},{name:`Fix — delete, do not update`,idea:`On write, invalidate the key rather than repopulating it.`,sql:`-- write path
db.query("UPDATE products SET price = ? WHERE id = ?", price, id)
redis.DEL("product:" + id)          -- next reader repopulates from the DB

-- ordering matters: DB first, then DEL
--   DEL then DB  -> a reader between them caches the OLD value
--   DB then DEL  -> worst case one reader briefly sees stale, then it is gone`,why:"Deleting is idempotent and carries no stale value to lose a race with. The remaining window is much smaller: a reader that already fetched the old row can still write it back after the `DEL`, but that requires the read to span the entire write, which is rare and self-heals at the TTL. This is why **cache invalidation means deletion**, not update, in almost every mature codebase."},{name:`Fix — versioned keys`,idea:`Never mutate a key; change the key.`,sql:`-- the key embeds a version bumped on every write
version = redis.INCR("product:ver:" + id)
key     = "product:" + id + ":v" + version

-- readers always read the current version
v   = redis.GET("product:ver:" + id)
val = redis.GET("product:" + id + ":v" + v)

-- old versions simply expire; no deletion race exists at all`,why:`This eliminates the race entirely because a stale writer can only ever write to a stale key that nobody reads. The cost is extra keys and memory until they expire, plus one additional round trip. It is the right approach when the data is expensive to compute and correctness matters more than a few kilobytes — rendered pages, permission sets, computed aggregates.`},{name:`Fix — TTL as the backstop`,idea:`Whatever invalidation you choose, always set a TTL.`,sql:`redis.SET(key, value, EX=300)     -- always. no exceptions.

-- pick the TTL from how stale the data may be, not from cache size:
--   pricing / inventory   -> 10-60 s
--   user profile          -> 5-15 min
--   product catalogue     -> 1-24 h
--   config / feature flags-> seconds, or push-invalidated`,why:"A cache entry without a TTL is a permanent bug waiting for the one code path that forgets to invalidate it. The TTL converts 'wrong forever' into 'wrong for at most N seconds', which is the difference between an incident and a non-event. Add jitter — `EX = 300 + random(0, 60)` — so that entries populated together do not all expire together and cause a stampede."}],takeaway:`Invalidate by **deleting**, write to the database **before** deleting, and always set a TTL with jitter as the backstop.`},{t:`q`,lvl:`hard`,title:`The cache stampede`,tag:`thundering herd · asked at Meta, Uber, Amazon`,stmt:`A popular key expires. Ten thousand concurrent requests miss simultaneously and all hit the database, which falls over. Give three fixes.`,hint:`The problem is not the miss. It is that ten thousand requests independently decide to recompute the same value.`,approaches:[{name:`Fix 1 — lock and recompute once`,idea:`The first miss takes a lock and recomputes; the others wait or serve stale.`,sql:`value = redis.GET(key)
if value is not null:
    return value

-- SET NX: only the first caller succeeds
got_lock = redis.SET(key + ":lock", token, NX=True, EX=10)

if got_lock:
    value = expensive_db_query()
    redis.SET(key, value, EX=300)
    redis.DEL(key + ":lock")       -- release (compare token first, see below)
    return value
else:
