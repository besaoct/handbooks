departments (dept_id, dept_name, location)
customers   (cust_id, name, city, country, signup_date)
orders      (order_id, cust_id, order_date, status, amount)
order_items (item_id, order_id, product_id, qty, unit_price)
products    (product_id, name, category, price, stock)`,f={id:`select`,num:`01`,title:`SELECT & Filtering`,kicker:`Projection, predicates, NULL logic, sorting and paging`,sections:[{id:`sel-basic`,title:`Projection and predicates`,blurb:`The schema below is used throughout the book. Attempt each query before opening the solution.`,blocks:[{t:`schema`,x:d,cap:`The working schema. Primary keys are the first column of each table; orders.cust_id and employees.dept_id are foreign keys.`},{t:`q`,lvl:`beginner`,title:`Select specific columns with an alias`,tag:`SELECT · alias`,stmt:"Return each employee's name and salary, with the columns labelled `employee` and `monthly_pay`.",approaches:[{name:`Solution`,idea:"Project only the two columns you need and rename them with `AS`.",sql:`SELECT name   AS employee,
       salary AS monthly_pay
FROM   employees;`,out:`employee   monthly_pay
Ada        9200.00
Bruno      7400.00
Chen       8800.00`,why:"`AS` renames a column in the output only — the stored column is untouched. The keyword is optional (`salary monthly_pay` works) but writing it makes the intent unmistakable, and it prevents the classic bug where a missing comma silently turns a column into an alias for the previous one. Prefer explicit column lists over `SELECT *`: the query keeps working when someone adds a column, transfers less data, and can be served by a covering index."}],takeaway:"Never ship `SELECT *` in application code. Name the columns you need."},{t:`q`,lvl:`beginner`,title:`Filter with multiple conditions`,tag:`WHERE · AND/OR`,stmt:`Find employees in department 3 earning more than 8000, **or** anyone at all earning more than 15000.`,hint:"`AND` binds tighter than `OR`. Parenthesise or the logic changes.",approaches:[{name:`Solution`,idea:"Two branches joined by `OR`, with the `AND` pair grouped explicitly.",sql:`SELECT name, dept_id, salary
FROM   employees
WHERE  (dept_id = 3 AND salary > 8000)
    OR salary > 15000;`,why:"`AND` has higher precedence than `OR`, so `a AND b OR c` already parses as `(a AND b) OR c`. Writing the parentheses anyway costs nothing and removes an entire class of review argument. The real trap is the reverse case: `dept_id = 3 AND (salary > 8000 OR salary > 15000)` means something completely different, and without brackets you get the wrong one."}]},{t:`q`,lvl:`beginner`,title:`BETWEEN, IN and NOT IN`,tag:`WHERE · set predicates`,stmt:"Return orders placed in Q1 2024 whose status is `shipped` or `delivered`, excluding customers 7, 9 and 12.",approaches:[{name:`Solution`,idea:"`BETWEEN` for the date range, `IN` for the status list, `NOT IN` for the exclusions.",sql:`SELECT order_id, cust_id, order_date, status
FROM   orders
WHERE  order_date BETWEEN '2024-01-01' AND '2024-03-31'
  AND  status  IN ('shipped', 'delivered')
  AND  cust_id NOT IN (7, 9, 12);`,why:"`BETWEEN` is **inclusive on both ends**, which is a bug source with `DATETIME` columns: `BETWEEN '2024-01-01' AND '2024-03-31'` silently drops everything after midnight on 31 March. For timestamps always use a half-open range, `order_date >= '2024-01-01' AND order_date < '2024-04-01'`. `IN (...)` is shorthand for a chain of `OR`s and is optimised the same way. `NOT IN` is safe here because the list is literal — but with a subquery that can return NULL it behaves surprisingly, which the next problem covers."}],takeaway:"Half-open date ranges (`>= start AND < next_start`) are correct for both DATE and DATETIME. `BETWEEN` on timestamps is a silent data-loss bug."},{t:`q`,lvl:`easy`,title:`Pattern matching with LIKE`,tag:`LIKE · wildcards`,stmt:"Find customers whose name starts with `A`, whose email ends in `.edu`, and whose city has exactly five characters.",approaches:[{name:`Solution`,idea:"`%` matches any run of characters including none; `_` matches exactly one.",sql:`SELECT name, email, city
FROM   customers
WHERE  name  LIKE 'A%'
  AND  email LIKE '%.edu'
  AND  city  LIKE '_____';        -- five underscores`,why:"A leading wildcard (`'%.edu'`) makes the predicate **non-sargable** — the index on `email` cannot be used, because a B-tree is ordered by prefix and you have not supplied one. A trailing wildcard (`'A%'`) *can* use an index range scan. If you genuinely need suffix search at scale, store a reversed copy of the column and index that, or use a full-text index. To search for a literal `%` or `_`, escape it: `LIKE '100\\%' ESCAPE '\\\\'`."}],takeaway:"`col LIKE 'x%'` uses an index. `col LIKE '%x'` cannot. That single rule explains most slow LIKE queries."},{t:`q`,lvl:`easy`,title:`DISTINCT versus GROUP BY`,tag:`DISTINCT`,stmt:`List the distinct pairs of (city, country) that customers come from.`,approaches:[{name:`DISTINCT`,idea:"`DISTINCT` applies to the whole select list, not to one column.",sql:`SELECT DISTINCT city, country
FROM   customers;`,why:"A very common misconception is that `DISTINCT city, country` deduplicates only `city`. It does not — `DISTINCT` is a property of the entire row produced by the select list, so this returns each unique *combination*. There is no `DISTINCT(city), country` syntax; the parentheses are just grouping and are ignored."},{name:`GROUP BY`,idea:`Grouping by the same columns and selecting nothing else is equivalent.`,sql:`SELECT city, country
FROM   customers
GROUP BY city, country;`,why:"These two produce identical results and usually identical plans — most optimisers rewrite one into the other. Prefer `DISTINCT` when you simply want unique rows and `GROUP BY` when you are about to add an aggregate. `GROUP BY` also lets you attach `HAVING`, which `DISTINCT` cannot."}]},{t:`q`,lvl:`easy`,title:`Sort with a custom order and handle ties`,tag:`ORDER BY`,stmt:`List employees by salary descending, then by hire date ascending for ties, then alphabetically.`,approaches:[{name:`Solution`,idea:`Multiple sort keys are applied left to right; each takes its own direction.`,sql:`SELECT name, salary, hire_date
FROM   employees
ORDER BY salary    DESC,
         hire_date ASC,
         name      ASC;`,why:"`ASC` is the default and `DESC` applies only to the key it follows — `ORDER BY a, b DESC` sorts `a` ascending and `b` descending, which surprises people. Without a **total** ordering, rows that tie on every listed key come back in an arbitrary and unstable order, which is exactly why paginated screens duplicate or skip rows. Always end `ORDER BY` with a unique column such as the primary key."}],takeaway:`Every paginated query needs a tiebreaker column, or pages will overlap.`},{t:`q`,lvl:`easy`,title:`Order by a CASE expression`,tag:`ORDER BY · CASE`,stmt:"List orders so that `pending` comes first, then `shipped`, then `delivered`, then everything else — and newest first inside each group.",approaches:[{name:`CASE ranking`,idea:"Map each status to a sort rank in a `CASE`, then sort by that rank.",sql:`SELECT order_id, status, order_date
FROM   orders
ORDER BY CASE status
           WHEN 'pending'   THEN 1
           WHEN 'shipped'   THEN 2
           WHEN 'delivered' THEN 3
           ELSE 4
         END,
         order_date DESC;`,why:"`ORDER BY` accepts arbitrary expressions, not just columns. The `CASE` produces a derived integer used purely for sorting; it never appears in the output. MySQL also offers `ORDER BY FIELD(status,'pending','shipped','delivered')` as a shortcut, but it is non-portable. Note the sort key is computed per row, so no index can satisfy it — the server will always need a filesort here."}]},{t:`q`,lvl:`easy`,title:`Paging with LIMIT and OFFSET`,tag:`LIMIT · pagination`,stmt:`Return page 5 of a product list, 20 rows per page, ordered by price descending. Then explain why this gets slow.`,approaches:[{name:`OFFSET paging`,idea:"Skip `(page − 1) × size` rows and take `size`.",sql:`SELECT product_id, name, price
FROM   products
ORDER BY price DESC, product_id DESC
LIMIT  20 OFFSET 80;          -- MySQL also allows LIMIT 80, 20`,why:`The server must still **produce and discard** the first 80 rows. At offset 500 000 it materialises half a million rows to throw them away, so response time grows linearly with page number. It is also unstable: if a row is inserted between requests, page 6 will repeat or skip an entry.`},{name:`Keyset (seek) paging`,idea:`Remember the last row seen and ask for rows after it. The index does the skipping.`,sql:`-- first page
SELECT product_id, name, price
FROM   products
ORDER BY price DESC, product_id DESC
LIMIT  20;

-- next page: pass the last row's (price, product_id) back in
SELECT product_id, name, price
FROM   products
WHERE  (price, product_id) < (49.99, 1043)     -- row-value comparison
ORDER BY price DESC, product_id DESC
LIMIT  20;`,why:"With an index on `(price, product_id)` the engine seeks straight to the starting position and reads 20 rows — **constant time regardless of depth**. The row-value comparison `(a, b) < (x, y)` is the tuple-comparison operator and expands to the correct lexicographic condition; writing it by hand as `price < x OR (price = x AND product_id < y)` is equivalent but harder to index well. The trade-off is that you cannot jump to an arbitrary page number, which is why infinite-scroll UIs use this and page-number UIs do not."}],takeaway:"Deep `OFFSET` is O(offset). Keyset pagination is O(1) per page and is the standard fix for slow 'page 900' complaints."}]},{id:`sel-null`,title:`NULL semantics`,blurb:`More interview questions come from NULL than from any other single topic.`,blocks:[{t:`q`,lvl:`easy`,title:`Find rows where a column has no value`,tag:`IS NULL`,stmt:`List employees who have no manager assigned.`,approaches:[{name:`Solution`,idea:`NULL is not a value, so it is never equal to anything — including itself.`,sql:`SELECT name
FROM   employees
WHERE  manager_id IS NULL;      -- NOT: manager_id = NULL`,why:"SQL uses **three-valued logic**: TRUE, FALSE, and UNKNOWN. `manager_id = NULL` evaluates to UNKNOWN, not TRUE, and `WHERE` only keeps rows that evaluate to TRUE — so that predicate matches nothing, silently. `IS NULL` and `IS NOT NULL` are the only operators that test for NULL. MySQL also has the null-safe equality operator `<=>`, where `NULL <=> NULL` is TRUE."}],takeaway:"`= NULL` is always UNKNOWN. Use `IS NULL`. In MySQL, `<=>` compares with NULL-equals-NULL semantics."},{t:`q`,lvl:`medium`,title:`Why does NOT IN with NULLs return nothing?`,tag:`NOT IN · NULL trap`,stmt:`Find customers who have never placed an order. A colleague wrote the query below and it returns zero rows even though most customers have no orders. Explain and fix it.`,approaches:[{name:`The broken query`,idea:"`NOT IN` against a subquery that can yield NULL collapses to UNKNOWN for every row.",sql:`SELECT name
FROM   customers
WHERE  cust_id NOT IN (SELECT cust_id FROM orders);   -- returns nothing`,why:"`x NOT IN (a, b, NULL)` expands to `x <> a AND x <> b AND x <> NULL`. That last comparison is UNKNOWN, and `TRUE AND UNKNOWN` is UNKNOWN — so the whole predicate can never be TRUE and every row is filtered out. One NULL anywhere in the subquery result poisons the entire query. Worse, it fails **silently**: no error, just an empty result."},{name:`Fix 1 — NOT EXISTS`,idea:"`NOT EXISTS` uses row existence rather than value comparison, so NULLs are irrelevant.",sql:`SELECT c.name
FROM   customers c
WHERE  NOT EXISTS (
         SELECT 1
         FROM   orders o
         WHERE  o.cust_id = c.cust_id
       );`,why:"`EXISTS` asks only whether the correlated subquery produced at least one row; it never compares values, so three-valued logic does not arise. This is the **safe default** for anti-joins and usually the fastest, because the optimiser can stop at the first matching row and can drive the lookup off the index on `orders.cust_id`."},{name:`Fix 2 — LEFT JOIN … IS NULL`,idea:`Join and keep only the rows that failed to match.`,sql:`SELECT c.name
FROM   customers c
LEFT   JOIN orders o ON o.cust_id = c.cust_id
WHERE  o.cust_id IS NULL;`,why:"The classic anti-join. The outer join fills unmatched rows with NULLs, and the `IS NULL` test on a **non-nullable** column of the right table keeps exactly those. Testing a nullable column here would be a bug — pick the join key or the primary key. Performance is usually comparable to `NOT EXISTS`; on MySQL the optimiser converts both into the same plan."},{name:`Fix 3 — guard the subquery`,idea:"If you must keep `NOT IN`, exclude NULLs explicitly.",sql:`SELECT name
FROM   customers
WHERE  cust_id NOT IN (
         SELECT cust_id FROM orders WHERE cust_id IS NOT NULL
       );`,why:"Correct, but it papers over the hazard rather than removing it — the next person to edit the subquery reintroduces the bug. Use it only when you are patching an existing query under time pressure. Note `IN` does not have this problem for matches: `x IN (a, NULL)` is TRUE when `x = a`; only the negative case is poisoned."}],takeaway:"Prefer `NOT EXISTS` for anti-joins. `NOT IN` plus a nullable subquery column is one of the most expensive silent bugs in SQL."},{t:`q`,lvl:`easy`,title:`Substitute a default for NULL`,tag:`COALESCE · IFNULL`,stmt:"Show each employee's commission, displaying `0` when it is NULL, and their manager's id or `'none'`.",approaches:[{name:`Solution`,idea:"`COALESCE` returns its first non-NULL argument.",sql:`SELECT name,
       COALESCE(commission, 0)             AS commission,
       COALESCE(CAST(manager_id AS CHAR),
                'none')                    AS manager
FROM   employees;`,why:"`COALESCE(a, b, c)` is standard SQL and takes any number of arguments; MySQL's `IFNULL(a, b)` takes exactly two and Oracle's `NVL` is the same idea. All arguments must be type-compatible, which is why `manager_id` is cast to a string before pairing it with `'none'` — mixing an integer and a string otherwise triggers implicit conversion and can produce `0` instead of the text. `NULLIF(a, b)` is the inverse: it returns NULL when `a = b`, which is the standard trick for avoiding division by zero, as `x / NULLIF(y, 0)`."}]},{t:`guess`,setup:`t(v):  1, 2, NULL`,sql:`SELECT COUNT(*)      AS c_star,
       COUNT(v)      AS c_v,
       SUM(v)        AS s,
       AVG(v)        AS a,
       COUNT(DISTINCT v) AS c_d
FROM   t;`,out:`c_star  c_v  s  a     c_d
3       2    3  1.5000  2`,why:"`COUNT(*)` counts **rows**; `COUNT(expr)` counts non-NULL values of that expression. Every other aggregate — `SUM`, `AVG`, `MIN`, `MAX` — also skips NULLs entirely. That makes `AVG(v)` equal to 3/2, **not** 3/3: the NULL row is not treated as zero, it is excluded from both numerator and denominator. If you want NULLs counted as zero you must say so: `AVG(COALESCE(v, 0))`. This distinction is asked in almost every SQL interview."},{t:`guess`,setup:`t(v):  1, NULL`,sql:`SELECT v,
       v = NULL          AS eq,
       v <> NULL         AS neq,
       v IS NULL         AS isnull,
       NULL = NULL       AS nn,
       NULL <=> NULL     AS safe
FROM   t;`,out:`v     eq    neq   isnull  nn    safe
1     NULL  NULL  0       NULL  1
NULL  NULL  NULL  1       NULL  1`,why:"Any comparison **with** NULL yields NULL (UNKNOWN), including `NULL = NULL`. Only `IS NULL` / `IS NOT NULL` return a definite boolean, and MySQL's `<=>` operator does null-safe equality where two NULLs count as equal. In a `WHERE` clause UNKNOWN behaves like FALSE, so the row is dropped — but in a `CHECK` constraint UNKNOWN is treated as **passing**, which is why a `CHECK (age > 18)` does not reject a NULL age."},{t:`guess`,setup:`t(v):  3, 1, NULL, 2`,sql:`SELECT v FROM t ORDER BY v ASC;`,out:`NULL
1
2
3`,why:"MySQL and SQLite sort NULLs **first** in ascending order and last in descending. PostgreSQL and Oracle do the opposite by default, treating NULL as the largest value. This is a genuine portability trap. Standard SQL provides `ORDER BY v ASC NULLS LAST`, supported by PostgreSQL and Oracle but **not** MySQL — there you emulate it with `ORDER BY (v IS NULL), v`, since the boolean sorts 0 before 1."},{t:`qa`,q:`What is the difference between NULL, zero and an empty string?`,a:"`NULL` means **unknown or not applicable** — there is no value. `0` is a known numeric value and `''` is a known string of length zero. They behave completely differently: `COUNT(col)` skips NULL but counts 0 and `''`; `'' = ''` is TRUE while `NULL = NULL` is UNKNOWN; and concatenating with NULL yields NULL in standard SQL (`CONCAT` in MySQL is an exception that ignores NULLs, while `||` in PostgreSQL propagates them). Oracle notoriously treats the empty string as NULL, which breaks portability."},{t:`qa`,q:`Do indexes store NULLs, and can a query use an index to find them?`,a:"In MySQL's InnoDB and in PostgreSQL, B-tree indexes **do** store NULLs, so `WHERE col IS NULL` can use an index range scan. Oracle's B-tree indexes do *not* store rows where all indexed columns are NULL, which is why `IS NULL` there often forces a full scan unless you add a constant to the index. A `UNIQUE` constraint in MySQL and PostgreSQL permits **multiple** NULLs, because two NULLs are not considered equal — a frequent surprise when people expect a unique column to enforce single-occupancy."},{t:`qa`,q:`How do NULLs behave in GROUP BY and in joins?`,a:"`GROUP BY` treats all NULLs as **one group** — the only place in SQL where NULLs are considered equal to each other. In a join, `ON a.x = b.x` never matches NULL to NULL, so rows with NULL keys simply do not join; with an outer join they survive on the preserved side with NULLs filled in on the other. `DISTINCT` also collapses NULLs together, and `UNION` (which deduplicates) treats them as the same value."}]},{id:`sel-expr`,title:`Expressions, CASE and conditional output`,blocks:[{t:`q`,lvl:`easy`,title:`Bucket rows into labelled categories`,tag:`CASE`,stmt:"Label each employee `junior` (< 5000), `mid` (5000–9999), or `senior` (10000+).",approaches:[{name:`Searched CASE`,idea:`Conditions are evaluated top to bottom; the first TRUE wins.`,sql:`SELECT name,
       salary,
       CASE
         WHEN salary <  5000  THEN 'junior'
         WHEN salary < 10000  THEN 'mid'
         ELSE                      'senior'
       END AS band
FROM   employees;`,why:"Because evaluation stops at the first match, the second branch does **not** need `salary >= 5000` — anything reaching it already failed the first test. That short-circuiting is what keeps range ladders readable. Omitting `ELSE` makes unmatched rows NULL rather than raising an error, which is a common source of mysterious NULLs downstream. There is also a *simple* `CASE expr WHEN value THEN …` form, but it only does equality, so it cannot express ranges."}],takeaway:"`CASE` is an expression, so it works in SELECT, WHERE, ORDER BY, GROUP BY and inside aggregates — that last one is how you pivot."},{t:`q`,lvl:`medium`,title:`Conditional counting in one pass`,tag:`CASE inside aggregate`,stmt:`For each department return the total headcount and, in the same row, how many earn over 9000.`,approaches:[{name:`SUM of a CASE`,idea:"Put the condition inside the aggregate rather than in `WHERE`, so both counts come from one scan.",sql:`SELECT dept_id,
       COUNT(*)                                    AS headcount,
       SUM(CASE WHEN salary > 9000 THEN 1 ELSE 0 END) AS high_earners,
       AVG(CASE WHEN salary > 9000 THEN salary END)   AS avg_high_salary
FROM   employees
GROUP  BY dept_id;`,why:"A `WHERE salary > 9000` filter would remove rows before grouping, making `COUNT(*)` wrong. Moving the condition inside the aggregate keeps every row available and evaluates the test per row. Note the third column deliberately has **no ELSE**: the `CASE` returns NULL for low earners and `AVG` skips NULLs, giving the average of high earners only. `COUNT(CASE WHEN … THEN 1 END)` works the same way — but `COUNT(CASE … ELSE 0 END)` would count everything, because 0 is not NULL."},{name:`MySQL boolean shorthand`,idea:`In MySQL a comparison evaluates to 1 or 0, so it can be summed directly.`,sql:`SELECT dept_id,
       COUNT(*)                AS headcount,
       SUM(salary > 9000)      AS high_earners,
       AVG(salary > 9000) * 100 AS pct_high
FROM   employees
GROUP  BY dept_id;`,why:"Concise and idiomatic in MySQL, where booleans are literally `TINYINT(1)`. `AVG` of a 0/1 column gives the proportion directly, which is a neat way to compute percentages. It is **not portable** — PostgreSQL has a real boolean type and will reject `SUM(boolean)`; there you write `COUNT(*) FILTER (WHERE salary > 9000)`, which is the standard and clearest form of all."}],takeaway:"Conditional aggregation — `SUM(CASE WHEN … THEN 1 ELSE 0 END)` — computes many different counts in a single table scan. It is the foundation of pivoting."},{t:`guess`,setup:`products(price):  10.00`,sql:`SELECT 5 / 2        AS a,
       5 DIV 2      AS b,
       5 % 2        AS c,
       -7 DIV 2     AS d,
       10 / 0       AS e,
       'abc' + 0    AS f;`,out:`a       b   c   d   e     f
2.5000  2   1  -3   NULL  0`,why:"In MySQL `/` always produces a decimal even for integer operands, while `DIV` does integer division truncating **toward zero** (so `-7 DIV 2` is −3, not −4 as Python would give). Division by zero returns **NULL** rather than raising, unless `ERROR_FOR_DIVISION_BY_ZERO` is in the SQL mode — this is why silent NULLs appear in rate calculations, and why `x / NULLIF(y, 0)` is the defensive idiom. The last column shows implicit string-to-number coercion: `'abc'` becomes 0 with a warning. PostgreSQL differs on all four counts: `/` on integers truncates, division by zero raises an error, and `'abc' + 0` is a type error."},{t:`qa`,q:`In what order does the database logically process a SELECT statement?`,a:"Not the order you write it. The logical processing order is:\n\n**FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT**\n\nThis explains three things people trip over. First, you cannot reference a `SELECT` alias in `WHERE`, because `WHERE` runs before the select list exists — but you *can* in `ORDER BY`, which runs after (MySQL also permits it in `HAVING` and `GROUP BY` as an extension). Second, `WHERE` filters individual rows before grouping while `HAVING` filters groups afterwards. Third, `LIMIT` applies last, which is why adding it does not make an unindexed `ORDER BY` cheap — the server still sorts everything first."},{t:`qa`,q:`Why can't you use a column alias in the WHERE clause?`,a:"Because `WHERE` is evaluated **before** the `SELECT` list, so the alias does not exist yet. `SELECT salary * 12 AS annual FROM employees WHERE annual > 100000` is an error in standard SQL. The fixes are to repeat the expression (`WHERE salary * 12 > 100000`), to wrap the query in a derived table or CTE and filter outside, or — best for performance — to filter on the bare column so an index can be used: `WHERE salary > 100000 / 12`. Wrapping a column in an expression makes the predicate non-sargable and kills index usage."},{t:`qa`,q:`What is the difference between UNION and UNION ALL, and when does it matter?`,a:"`UNION` removes duplicate rows; `UNION ALL` keeps everything. Deduplication requires a sort or a hash, so `UNION` is meaningfully slower on large results — often two to three times. Use `UNION ALL` whenever you know the branches cannot overlap, which is most of the time (for example, combining this year's and last year's tables). Both require the branches to have the same number of columns with compatible types, and the column names of the **first** branch name the result. `ORDER BY` may appear only once, at the very end, and applies to the combined result.",sql:`SELECT cust_id, 'active' AS kind FROM active_customers
UNION ALL
SELECT cust_id, 'archived'     FROM archived_customers
ORDER BY cust_id;              -- applies to the whole result`},{t:`qa`,q:`How do you emulate INTERSECT and EXCEPT in MySQL 5.7?`,a:"MySQL added `INTERSECT` and `EXCEPT` only in 8.0.31; before that you emulate them with joins. `INTERSECT` becomes an inner join or `IN` on the second set; `EXCEPT` (also called `MINUS` in Oracle) becomes a `LEFT JOIN … IS NULL` or `NOT EXISTS` anti-join. Remember the set operators deduplicate by default, so add `DISTINCT` when emulating them.",sql:`-- INTERSECT
SELECT DISTINCT a.id FROM a JOIN b ON b.id = a.id;

-- EXCEPT / MINUS
SELECT DISTINCT a.id
FROM   a LEFT JOIN b ON b.id = a.id
WHERE  b.id IS NULL;`}]}]},p={id:`aggregate`,num:`02`,title:`Aggregation & GROUP BY`,kicker:`Grouping rules, HAVING, conditional aggregation, pivoting`,sections:[{id:`agg-basic`,title:`Grouping fundamentals`,blocks:[{t:`schema`,x:d},{t:`q`,lvl:`beginner`,title:`Count, sum and average per group`,tag:`GROUP BY`,stmt:`For each department return the headcount, total payroll, average salary rounded to 2 decimals, and the highest and lowest salary.`,approaches:[{name:`Solution`,idea:"One `GROUP BY` key, five aggregates over the rows of each group.",sql:`SELECT dept_id,
       COUNT(*)            AS headcount,
       SUM(salary)         AS payroll,
       ROUND(AVG(salary),2) AS avg_salary,
       MAX(salary)         AS top_salary,
       MIN(salary)         AS low_salary
FROM   employees
GROUP  BY dept_id
ORDER  BY payroll DESC;`,out:`dept_id  headcount  payroll   avg_salary  top_salary  low_salary
3        12         104300.00  8691.67     14200.00    5100.00
1        9           71800.00  7977.78     11000.00    4800.00`,why:"`GROUP BY` collapses every set of rows sharing a key into one output row, and each aggregate is computed over the rows of its own group. `COUNT(*)` counts rows including those with NULL salary, while `SUM`, `AVG`, `MIN` and `MAX` all silently ignore NULLs — so `SUM(salary)/COUNT(*)` and `AVG(salary)` differ whenever any salary is NULL. An index on `dept_id` lets the engine group by reading the index in order and avoid a temporary table."}],takeaway:"Aggregates ignore NULLs; `COUNT(*)` does not ignore rows. That asymmetry is the source of most 'my average looks wrong' bugs."},{t:`q`,lvl:`easy`,title:`Filter groups, not rows`,tag:`HAVING`,stmt:`List departments with more than 5 employees whose average salary exceeds 8000, considering only employees hired since 2020.`,hint:`One condition belongs in WHERE, two belong in HAVING. Decide which is which by asking whether it is about a row or about a group.`,approaches:[{name:`Solution`,idea:"`WHERE` prunes rows before grouping; `HAVING` prunes groups after.",sql:`SELECT dept_id,
       COUNT(*)     AS headcount,
       AVG(salary)  AS avg_salary
FROM   employees
WHERE  hire_date >= '2020-01-01'      -- per-row filter, applied first
GROUP  BY dept_id
HAVING COUNT(*) > 5                   -- per-group filter, applied after
   AND AVG(salary) > 8000;`,why:"The hire-date test is a property of a single row, so it belongs in `WHERE` — putting it in `HAVING` would still work in some engines but would force every row into the grouping phase first, doing far more work. The count and average are properties of a group and simply cannot be expressed in `WHERE`, because at that point no groups exist yet. Rule of thumb: **if the condition mentions an aggregate, it must be `HAVING`; otherwise prefer `WHERE`.**"}],takeaway:"Push every non-aggregate filter into `WHERE`. It reduces the rows that reach the grouping step, which is almost always the expensive part."},{t:`q`,lvl:`medium`,title:`Why does this query fail on some servers?`,tag:`ONLY_FULL_GROUP_BY`,stmt:`The query below runs on an old MySQL install and errors on a new one. Explain and give two correct rewrites.`,approaches:[{name:`The problem`,idea:"`name` is neither grouped nor aggregated, so which of the many names in the group should be returned?",sql:`SELECT dept_id, name, MAX(salary)
FROM   employees
GROUP  BY dept_id;
-- ERROR 1055: Expression #2 of SELECT list is not in GROUP BY clause
--             and contains nonaggregated column 'name'`,why:"Standard SQL requires every select-list column to be either in the `GROUP BY` or wrapped in an aggregate, because a group has many rows and only one output slot. MySQL historically allowed this and returned an **arbitrary** row's name — often not the one belonging to the max salary, which made the result quietly wrong. `ONLY_FULL_GROUP_BY` has been enabled by default since MySQL 5.7 and enforces the standard."},{name:`Fix — window function`,idea:`Rank rows inside each department and keep the top one, which keeps every column available.`,sql:`SELECT dept_id, name, salary
FROM (
  SELECT dept_id, name, salary,
         ROW_NUMBER() OVER (PARTITION BY dept_id
                            ORDER BY salary DESC) AS rn
  FROM   employees
) t
WHERE rn = 1;`,why:"Window functions compute per-row values without collapsing rows, so `name` stays attached to *its own* salary. `ROW_NUMBER` returns exactly one row per department even on ties; use `RANK()` if you want all tied top earners. This is the clearest and usually the fastest solution on MySQL 8+ and PostgreSQL."},{name:`Fix — join back to the aggregate`,idea:`Compute the maximum per department, then join to find the rows that achieve it.`,sql:`SELECT e.dept_id, e.name, e.salary
FROM   employees e
JOIN  (SELECT dept_id, MAX(salary) AS mx
       FROM   employees
       GROUP  BY dept_id) m
  ON   m.dept_id = e.dept_id
 AND   m.mx      = e.salary;`,why:"The portable answer — it works on MySQL 5.7 and every other engine. It returns **all** tied top earners, which may or may not be what you want. It reads the table twice, so with a good index on `(dept_id, salary)` the window version usually wins, but on older servers this is the only option."}],takeaway:`'Pick the row with the max value per group' is the single most-asked SQL interview problem. Know both the window and the self-join answer.`},{t:`q`,lvl:`medium`,title:`COUNT(*) vs COUNT(col) vs COUNT(DISTINCT col)`,tag:`COUNT variants`,stmt:`For each city, report the number of customers, the number with a recorded phone number, and the number of distinct countries.`,approaches:[{name:`Solution`,idea:`Three different counting semantics in one pass.`,sql:`SELECT city,
       COUNT(*)                AS customers,
       COUNT(phone)            AS with_phone,
       COUNT(DISTINCT country) AS countries
FROM   customers
GROUP  BY city;`,why:"`COUNT(*)` counts rows and never inspects a value — the optimiser can answer it from the smallest available index. `COUNT(phone)` counts rows where `phone IS NOT NULL`, so the difference between the two columns is exactly the number of missing phone numbers. `COUNT(DISTINCT country)` must deduplicate, which needs a sort or hash and is materially more expensive; several distinct counts in one query multiply that cost."}],takeaway:"`COUNT(*) - COUNT(col)` is the number of NULLs in `col`. Useful for quick data-quality checks."},{t:`q`,lvl:`medium`,title:`Group by a derived value`,tag:`GROUP BY expression`,stmt:"Count orders per month for 2024, showing the month as `YYYY-MM`.",approaches:[{name:`Group by the expression`,idea:"`GROUP BY` accepts expressions, not only bare columns.",sql:`SELECT DATE_FORMAT(order_date, '%Y-%m') AS ym,
       COUNT(*)                        AS orders,
       SUM(amount)                     AS revenue
FROM   orders
WHERE  order_date >= '2024-01-01'
  AND  order_date <  '2025-01-01'
GROUP  BY DATE_FORMAT(order_date, '%Y-%m')
ORDER  BY ym;`,why:"The `WHERE` clause deliberately filters on the **bare column** with a half-open range so an index on `order_date` can be used. Writing `WHERE YEAR(order_date) = 2024` would be logically identical but wraps the column in a function, making it non-sargable and forcing a full scan. Group by the formatted value, filter by the raw one — that split is the whole trick."},{name:`MySQL shorthand`,idea:`MySQL lets you group by the select-list alias or by ordinal position.`,sql:`SELECT DATE_FORMAT(order_date, '%Y-%m') AS ym,
       COUNT(*) AS orders
FROM   orders
GROUP  BY ym          -- alias: a MySQL/PostgreSQL extension
ORDER  BY 1;          -- ordinal position: portable but fragile`,why:"Grouping by alias is convenient and supported by MySQL and PostgreSQL but not by SQL Server or Oracle. Ordinal positions (`GROUP BY 1`) work widely but break silently the moment someone reorders the select list, so they are fine for ad-hoc analysis and poor for stored code."}],takeaway:`Filter on the raw column so the index applies; group on the derived expression.`},{t:`q`,lvl:`medium`,title:`Subtotals and grand totals`,tag:`ROLLUP`,stmt:`Show revenue by (category, region), with a subtotal per category and one grand total row.`,approaches:[{name:`WITH ROLLUP`,idea:"`ROLLUP` adds super-aggregate rows where trailing group keys become NULL.",sql:`SELECT COALESCE(category, 'ALL')  AS category,
       COALESCE(region,   'ALL')  AS region,
       SUM(amount)                AS revenue
FROM   sales
GROUP  BY category, region WITH ROLLUP;`,out:`category  region  revenue
books     east    1200.00
books     west     900.00
books     ALL     2100.00     <- category subtotal
toys      east     700.00
toys      ALL      700.00
ALL       ALL     2800.00     <- grand total`,why:"`ROLLUP` generates the hierarchy right to left: `(category, region)`, then `(category)`, then `()`. The extra rows carry NULL in the rolled-up columns, which is why they need `COALESCE` for display. That creates an ambiguity when the data itself contains NULLs — use `GROUPING(category)` (MySQL 8+) to distinguish a real NULL from a rollup marker. PostgreSQL and SQL Server also support `CUBE` (all combinations) and `GROUPING SETS` (an explicit list); MySQL supports only `ROLLUP`."}]}]},{id:`agg-pivot`,title:`Conditional aggregation and pivoting`,blocks:[{t:`q`,lvl:`medium`,title:`Pivot rows into columns`,tag:`pivot · asked at Amazon, Meta`,stmt:"Turn a long `sales(product, quarter, amount)` table into one row per product with columns `q1`…`q4`.",schema:`sales
product  quarter  amount
widget   Q1        100
widget   Q2        150
gadget   Q1         80`,hint:`There is no PIVOT keyword in MySQL. One aggregate per output column.`,approaches:[{name:`Conditional aggregation`,idea:"One `SUM(CASE …)` per target column, all over the same group.",sql:`SELECT product,
       SUM(CASE WHEN quarter = 'Q1' THEN amount ELSE 0 END) AS q1,
       SUM(CASE WHEN quarter = 'Q2' THEN amount ELSE 0 END) AS q2,
       SUM(CASE WHEN quarter = 'Q3' THEN amount ELSE 0 END) AS q3,
       SUM(CASE WHEN quarter = 'Q4' THEN amount ELSE 0 END) AS q4,
       SUM(amount)                                          AS total
FROM   sales
GROUP  BY product;`,out:`product  q1   q2   q3  q4  total
gadget    80    0    0   0     80
widget   100  150    0   0    250`,why:"This is the portable pivot and works on every engine. Each `CASE` acts as a filter that lets only the matching quarter contribute to that column, and the shared `GROUP BY product` lines them all up on one row. Use `ELSE 0` when you want zeros for missing quarters and omit the `ELSE` when you want NULLs — the choice matters if you then average the columns. The limitation is that the column list must be **known at write time**; a dynamic set of columns requires building the SQL string in application code or a stored procedure."},{name:`Unpivot (the reverse)`,idea:"Turn wide columns back into rows with `UNION ALL`.",sql:`SELECT product, 'Q1' AS quarter, q1 AS amount FROM wide
UNION ALL SELECT product, 'Q2', q2 FROM wide
UNION ALL SELECT product, 'Q3', q3 FROM wide
UNION ALL SELECT product, 'Q4', q4 FROM wide;`,why:"Unpivoting is how you normalise a spreadsheet-shaped table into something groupable. It scans the source once per branch, so on a large table prefer a single scan joined against a small numbers table. PostgreSQL offers `LATERAL` with `VALUES`, and SQL Server has a native `UNPIVOT` — MySQL has neither."}],takeaway:"Pivot = conditional aggregation. Unpivot = `UNION ALL`. Neither needs a special keyword in MySQL."},{t:`q`,lvl:`medium`,title:`Concatenate group members into one string`,tag:`GROUP_CONCAT`,stmt:`For each department, produce a comma-separated list of employee names ordered alphabetically.`,approaches:[{name:`MySQL`,idea:"`GROUP_CONCAT` is an aggregate that joins values with a separator.",sql:`SELECT dept_id,
       GROUP_CONCAT(name ORDER BY name SEPARATOR ', ') AS members,
       COUNT(*)                                        AS n
FROM   employees
GROUP  BY dept_id;`,out:`dept_id  members              n
1        Ada, Bruno, Chen      3
2        Dara, Eli             2`,why:"The `ORDER BY` **inside** the aggregate controls the order of concatenation — an outer `ORDER BY` would only order the result rows. The critical gotcha is `group_concat_max_len`, which defaults to **1024 bytes**: longer results are truncated silently, only issuing a warning. Raise it with `SET SESSION group_concat_max_len = 1000000` when building lists. `GROUP_CONCAT(DISTINCT …)` deduplicates, which is often what you want."},{name:`PostgreSQL / standard`,idea:"`STRING_AGG` is the standard-SQL equivalent.",sql:`SELECT dept_id,
       STRING_AGG(name, ', ' ORDER BY name) AS members
FROM   employees
GROUP  BY dept_id;`,why:"Same semantics, different name — Oracle calls it `LISTAGG`, SQL Server uses `STRING_AGG` too. None of them has MySQL's silent truncation problem. Knowing all three names is worth a mark in a portability question."}]},{t:`q`,lvl:`hard`,title:`Median without a MEDIAN function`,tag:`asked at Meta, Google`,stmt:"MySQL has no `MEDIAN`. Compute the median salary per department.",hint:`The median is the value at position (n+1)/2, or the average of the two middle values when n is even. Rank the rows and pick the middle.`,approaches:[{name:`Window function`,idea:`Number rows both ascending and descending; the middle rows are those where the two ranks are within one of each other.`,sql:`WITH ranked AS (
  SELECT dept_id, salary,
         ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary)      AS asc_rn,
         ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS desc_rn
  FROM   employees
)
SELECT dept_id, AVG(salary) AS median_salary
FROM   ranked
WHERE  asc_rn BETWEEN desc_rn - 1 AND desc_rn + 1
GROUP  BY dept_id;`,why:"For an odd count the middle row has `asc_rn = desc_rn`, so exactly one row survives and `AVG` returns it unchanged. For an even count the two middle rows differ by one in each direction, both survive, and `AVG` averages them — which is the definition of the median. The `BETWEEN desc_rn - 1 AND desc_rn + 1` window captures both cases without a separate parity branch, which is what makes this elegant enough to be the expected answer."},{name:`PERCENTILE_CONT`,idea:`PostgreSQL, Oracle and SQL Server have a built-in ordered-set aggregate.`,sql:`SELECT dept_id,
       PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY salary) AS median
FROM   employees
GROUP  BY dept_id;`,why:"`PERCENTILE_CONT` interpolates between the two middle values (matching the averaging above) while `PERCENTILE_DISC` returns an actual data point. MySQL has neither, which is precisely why the window trick is asked. Mentioning that you know the built-in exists elsewhere shows breadth."}],takeaway:`Double-ranking ascending and descending is the general trick for 'find the middle' problems.`},{t:`q`,lvl:`medium`,title:`Groups with zero rows`,tag:`LEFT JOIN + GROUP BY`,stmt:`Show every department with its headcount — including departments that currently have no employees.`,approaches:[{name:`The wrong version`,idea:`An inner join silently drops empty departments.`,sql:`SELECT d.dept_name, COUNT(*) AS headcount
FROM   departments d
JOIN   employees   e ON e.dept_id = d.dept_id
GROUP  BY d.dept_name;`,why:`An inner join keeps only departments with at least one match, so empty departments vanish from the report rather than showing zero — an omission that is easy to miss in review because the output looks plausible.`},{name:`The right version`,idea:"Left join, and count a column from the right table rather than `*`.",sql:`SELECT d.dept_name,
       COUNT(e.emp_id) AS headcount
FROM   departments d
LEFT   JOIN employees e ON e.dept_id = d.dept_id
GROUP  BY d.dept_id, d.dept_name;`,out:`dept_name   headcount
Sales       12
Research     9
Archives     0        <- kept, correctly zero`,why:"The left join preserves every department; unmatched ones get a row full of NULLs from `employees`. `COUNT(e.emp_id)` then returns **0** for those, because `COUNT(col)` ignores NULLs. Using `COUNT(*)` here would return **1** — it counts the NULL-filled row — which is the single most common bug in this pattern. Grouping by `d.dept_id` as well as the name is deliberate: two departments could share a name."}],takeaway:"With `LEFT JOIN … GROUP BY`, always `COUNT(right_table.column)`, never `COUNT(*)`."},{t:`guess`,setup:`emp(dept, sal):  (A,100), (A,NULL), (B,200)`,sql:`SELECT dept,
       COUNT(*)     AS c1,
       COUNT(sal)   AS c2,
       SUM(sal)     AS s,
       AVG(sal)     AS a
FROM   emp
GROUP  BY dept;`,out:`dept  c1  c2  s     a
A     2   1   100   100.0000
B     1   1   200   200.0000`,why:"Group A has two rows so `COUNT(*)` is 2, but only one non-NULL salary so `COUNT(sal)` is 1 and `AVG` divides by 1, not 2. If you expected 50 you were treating NULL as zero — SQL does not. Also note that a group of entirely NULL values yields `SUM = NULL`, not 0, whereas `COUNT` of it yields 0; `COALESCE(SUM(sal), 0)` is the usual guard when the total feeds arithmetic downstream."},{t:`guess`,setup:`t is empty`,sql:`SELECT COUNT(*), SUM(v), MAX(v) FROM t;
SELECT v, COUNT(*) FROM t GROUP BY v;`,out:`-- first query: exactly one row
0   NULL   NULL

-- second query: zero rows`,why:"An aggregate **without** `GROUP BY` always returns exactly one row, even over an empty table: `COUNT` gives 0 while `SUM`, `MAX`, `MIN` and `AVG` give NULL. Add a `GROUP BY` and you get one row per group — and an empty table has no groups, so you get **no rows at all**. This distinction matters when a scalar subquery feeds a comparison: the ungrouped form returns NULL and the comparison becomes UNKNOWN, whereas the grouped form returns nothing and behaves differently again."},{t:`qa`,q:`What is the difference between WHERE and HAVING?`,a:"`WHERE` filters **individual rows** before grouping and can use indexes; `HAVING` filters **groups** after aggregation and can reference aggregate functions. Any condition that does not involve an aggregate should go in `WHERE`, because filtering earlier means fewer rows reach the expensive grouping step. MySQL permits `HAVING` on non-aggregated columns as an extension, but doing so is both slower and non-portable."},{t:`qa`,q:`Can you use an aggregate function inside WHERE?`,a:"No. `WHERE` is evaluated before groups are formed, so `WHERE COUNT(*) > 5` is a syntax error. Move it to `HAVING`, or compute the aggregate in a subquery or CTE and filter the outer query. The one apparent exception is an aggregate inside a **subquery** in the `WHERE` clause — `WHERE salary > (SELECT AVG(salary) FROM employees)` — which is legal because the aggregate belongs to the inner query, not the outer one."},{t:`qa`,q:`Why is COUNT(*) sometimes faster than COUNT(id)?`,a:"`COUNT(*)` counts rows without touching any column, so the optimiser is free to scan the **smallest** index on the table — typically a narrow secondary index rather than the full clustered row data. `COUNT(id)` must confirm each value is non-NULL, though for a `NOT NULL` primary key most engines optimise it to the same plan. Neither is instant in InnoDB: because of MVCC, each transaction may see a different row count, so there is no stored counter to read. MyISAM does keep one, which is why `COUNT(*)` is instant there."},{t:`qa`,q:`How do you find duplicate rows in a table?`,a:`Group by the columns that define a duplicate and keep groups with more than one member. To see the offending rows rather than just the keys, join back or use a window function.`,sql:`-- which values are duplicated
SELECT email, COUNT(*) AS n
FROM   users
GROUP  BY email
HAVING COUNT(*) > 1;

-- the actual duplicate rows, keeping the earliest of each
SELECT *
FROM (
  SELECT u.*,
         ROW_NUMBER() OVER (PARTITION BY email ORDER BY id) AS rn
  FROM   users u
) t
WHERE rn > 1;`}]}]},m={id:`joins`,num:`03`,title:`Joins`,kicker:`Inner, outer, self, anti and semi joins — and the duplication trap`,sections:[{id:`join-core`,title:`The join types`,blocks:[{t:`schema`,x:d},{t:`q`,lvl:`beginner`,title:`Inner join two tables`,tag:`INNER JOIN`,stmt:`List each employee with their department name and location.`,approaches:[{name:`Explicit JOIN`,idea:`Match rows on the foreign key; keep only pairs that exist on both sides.`,sql:`SELECT e.name,
       d.dept_name,
       d.location
FROM   employees   e
JOIN   departments d ON d.dept_id = e.dept_id;`,why:"`JOIN` means `INNER JOIN`. Rows with a NULL `dept_id`, or pointing at a department that no longer exists, are **dropped silently** — which is why an inner join sometimes returns fewer rows than the left table has. Always alias tables and qualify every column: unqualified names break the moment someone adds a same-named column to the other table."},{name:`Old comma syntax`,idea:`The pre-1992 form. Shown so you recognise it in legacy code.`,sql:`SELECT e.name, d.dept_name
FROM   employees e, departments d
WHERE  d.dept_id = e.dept_id;`,why:"Semantically identical, but the join condition is mixed in with the filters. Forget the `WHERE` line and you get a silent **cross join** — a million-row table joined to a thousand-row one becomes a billion rows. The explicit `JOIN … ON` syntax makes an accidental cross join a visible `CROSS JOIN` instead, and it is the only syntax that can express outer joins portably."}],takeaway:"Always use explicit `JOIN … ON`. The comma form turns a forgotten predicate into a cartesian explosion."},{t:`q`,lvl:`easy`,title:`Keep rows that have no match`,tag:`LEFT JOIN`,stmt:`List every customer with their total order count, including customers who have never ordered.`,approaches:[{name:`Solution`,idea:`Left join preserves all rows of the left table; unmatched rows get NULLs from the right.`,sql:`SELECT c.cust_id,
       c.name,
       COUNT(o.order_id) AS orders
FROM   customers c
LEFT   JOIN orders o ON o.cust_id = c.cust_id
GROUP  BY c.cust_id, c.name;`,why:"`LEFT JOIN` guarantees at least one output row per left-table row. `COUNT(o.order_id)` correctly yields 0 for customers with no orders, because `COUNT(col)` skips NULLs — `COUNT(*)` would return 1 for them, counting the NULL-padded row. `RIGHT JOIN` is the mirror image and is rarely used in practice: people find it easier to read a query where the preserved table comes first, so most teams standardise on `LEFT`."}]},{t:`q`,lvl:`medium`,title:`Filter in ON versus filter in WHERE`,tag:`outer join trap · asked constantly`,stmt:`You want every customer plus their **2024** orders, keeping customers with none. Explain why moving one predicate breaks it.`,approaches:[{name:`Correct — predicate in ON`,idea:`The condition restricts which right-hand rows are eligible to match, before padding happens.`,sql:`SELECT c.name, o.order_id, o.order_date
FROM   customers c
LEFT   JOIN orders o
       ON  o.cust_id    = c.cust_id
       AND o.order_date >= '2024-01-01'
       AND o.order_date <  '2025-01-01';`,out:`name    order_id  order_date
Ada     101       2024-03-04
Bruno   NULL      NULL          <- kept: no 2024 orders
Chen    NULL      NULL          <- kept: no orders at all`,why:"In an outer join, the `ON` clause decides **what counts as a match**. Non-matching right rows are excluded and the left row is padded with NULLs — so customers survive whether they had no 2024 orders or no orders at all."},{name:`Broken — predicate in WHERE`,idea:"`WHERE` runs after the join and after NULL padding, so it deletes the padded rows.",sql:`SELECT c.name, o.order_id, o.order_date
FROM   customers c
LEFT   JOIN orders o ON o.cust_id = c.cust_id
WHERE  o.order_date >= '2024-01-01'
  AND  o.order_date <  '2025-01-01';       -- silently becomes an INNER JOIN`,why:"The padded rows carry `order_date = NULL`, and `NULL >= '2024-01-01'` is UNKNOWN, so `WHERE` discards them. The outer join has been **demoted to an inner join** without any error. The only exception is an explicit `IS NULL` test, which is how the anti-join idiom deliberately exploits this behaviour. Rule: in an outer join, conditions on the **preserved** table belong in `WHERE`; conditions on the **optional** table belong in `ON`."}],takeaway:`A non-NULL predicate on the right table of a LEFT JOIN, placed in WHERE, cancels the outerness. This is the most-asked join question in interviews.`},{t:`q`,lvl:`medium`,title:`Find rows with no counterpart`,tag:`anti-join`,stmt:`Three ways to list products that have never been ordered. Compare them.`,approaches:[{name:`NOT EXISTS`,idea:`Ask whether a matching row exists; stop at the first hit.`,sql:`SELECT p.product_id, p.name
FROM   products p
WHERE  NOT EXISTS (
         SELECT 1 FROM order_items oi
         WHERE  oi.product_id = p.product_id
       );`,why:"The safest default. `EXISTS` is a pure existence test, so NULLs in `order_items.product_id` cause no trouble, and the optimiser can short-circuit as soon as one row matches. With an index on `order_items(product_id)` each probe is a single index seek."},{name:`LEFT JOIN … IS NULL`,idea:`Join everything, then keep only the failures.`,sql:`SELECT p.product_id, p.name
FROM   products p
LEFT   JOIN order_items oi ON oi.product_id = p.product_id
WHERE  oi.product_id IS NULL;`,why:"Equally correct and on MySQL usually produces the same plan. One subtlety: if a product has 500 order lines, the join materialises all 500 before the filter discards them — `NOT EXISTS` stops at the first. On large child tables that difference is measurable. Always test `IS NULL` on a column that cannot legitimately be NULL, such as the join key or the child's primary key."},{name:`NOT IN (with the caveat)`,idea:`Reads most naturally, and is the most dangerous.`,sql:`SELECT product_id, name
FROM   products
WHERE  product_id NOT IN (
         SELECT product_id FROM order_items
         WHERE  product_id IS NOT NULL      -- mandatory guard
       );`,why:"Without that `IS NOT NULL` guard, a single NULL in the subquery makes the entire predicate UNKNOWN for every row and the query returns **zero rows** with no error. Because the guard is easy to forget and the failure is silent, most teams simply ban `NOT IN` with subqueries."}],takeaway:"Anti-join = `NOT EXISTS`. Use `LEFT JOIN … IS NULL` when it reads better, and avoid `NOT IN` on subqueries entirely."},{t:`q`,lvl:`medium`,title:`Self join for hierarchies`,tag:`self join`,stmt:`List each employee alongside their manager's name, including employees with no manager.`,approaches:[{name:`Solution`,idea:`Join the table to itself with two different aliases.`,sql:`SELECT e.name              AS employee,
       COALESCE(m.name, '—') AS manager
FROM   employees e
LEFT   JOIN employees m ON m.emp_id = e.manager_id
ORDER  BY manager, employee;`,out:`employee  manager
Ada       —
Bruno     Ada
Chen      Ada`,why:"A self join is an ordinary join where both sides happen to be the same physical table; the aliases make them logically distinct. `LEFT` is essential — an inner join would drop the CEO, who has a NULL `manager_id`. This only walks **one** level; for arbitrary depth you need a recursive CTE, covered in chapter 4."}]},{t:`q`,lvl:`medium`,title:`Find pairs within a table`,tag:`self join · pairs`,stmt:`Find all pairs of employees in the same department, without listing a pair twice or pairing anyone with themselves.`,approaches:[{name:`Solution`,idea:`Join on the shared key and add an inequality on the id to break symmetry.`,sql:`SELECT a.name AS emp_a,
       b.name AS emp_b,
       a.dept_id
FROM   employees a
JOIN   employees b
  ON   b.dept_id = a.dept_id
 AND   b.emp_id  > a.emp_id;      -- '>' not '<>'`,why:"Using `b.emp_id <> a.emp_id` would return each pair **twice**, once in each order. Using `>` keeps exactly one representative of each unordered pair and simultaneously excludes self-pairing, so one operator solves both problems. This is the standard pattern for 'find pairs', 'find duplicates' and 'find overlapping intervals' problems. Note the result size is O(n²) within each group, so add selective filters before joining on large tables."}],takeaway:"`b.id > a.id` in a self join = each unordered pair exactly once, no self-pairs."},{t:`q`,lvl:`medium`,title:`Cross join to build a complete grid`,tag:`CROSS JOIN`,stmt:`Produce a report with every (department, month) combination for 2024, showing zero where no hiring occurred.`,hint:`Generate the grid first, then left join the facts onto it.`,approaches:[{name:`Solution`,idea:`Cross join the dimensions to make the full grid, then outer join the measures.`,sql:`WITH months AS (
  SELECT 1 AS m UNION ALL SELECT 2  UNION ALL SELECT 3
  UNION ALL SELECT 4 UNION ALL SELECT 5  UNION ALL SELECT 6
  UNION ALL SELECT 7 UNION ALL SELECT 8  UNION ALL SELECT 9
  UNION ALL SELECT 10 UNION ALL SELECT 11 UNION ALL SELECT 12
)
SELECT d.dept_name,
       mo.m                    AS month,
       COUNT(e.emp_id)         AS hires
FROM   departments d
CROSS  JOIN months mo
LEFT   JOIN employees e
       ON  e.dept_id = d.dept_id
       AND YEAR(e.hire_date)  = 2024
       AND MONTH(e.hire_date) = mo.m
GROUP  BY d.dept_id, d.dept_name, mo.m
ORDER  BY d.dept_name, mo.m;`,why:"A `GROUP BY` alone can only produce rows that exist in the data, so months with no hires would be **missing entirely** rather than showing zero — which breaks charts and moving averages. Cross joining the dimensions first guarantees a dense grid, and the left join fills in the sparse facts. This 'calendar table' technique is the standard answer to 'my time series has gaps'. In production, keep a permanent `calendar` table rather than generating months inline."}],takeaway:`Sparse results with missing periods ⇒ cross join the dimensions, then LEFT JOIN the facts.`},{t:`q`,lvl:`medium`,title:`Emulate FULL OUTER JOIN in MySQL`,tag:`portability`,stmt:"MySQL has no `FULL OUTER JOIN`. Produce one for tables `a` and `b`.",approaches:[{name:`UNION of two outer joins`,idea:`Left join plus the right-only rows.`,sql:`SELECT a.id AS a_id, b.id AS b_id
FROM   a LEFT JOIN b ON b.id = a.id
UNION
SELECT a.id, b.id
FROM   a RIGHT JOIN b ON b.id = a.id;`,why:"`UNION` (not `UNION ALL`) deduplicates the matched rows that both branches produce. If the tables are large, the deduplication is expensive — the cheaper form is `UNION ALL` with the second branch restricted to right-only rows via `WHERE a.id IS NULL`, which produces no duplicates by construction and avoids the sort."},{name:`UNION ALL, no dedup needed`,idea:`Make the branches disjoint so nothing needs deduplicating.`,sql:`SELECT a.id AS a_id, b.id AS b_id
FROM   a LEFT JOIN b ON b.id = a.id
UNION ALL
SELECT NULL, b.id
FROM   b
WHERE  NOT EXISTS (SELECT 1 FROM a WHERE a.id = b.id);`,why:"The first branch covers 'all of a, matched or not'; the second covers only 'rows of b with no partner in a'. They cannot overlap, so `UNION ALL` is safe and skips the sort entirely. This is the form to use on anything large."}]}]},{id:`join-traps`,title:`Join traps and multi-table joins`,blocks:[{t:`q`,lvl:`hard`,title:`Why did my SUM double?`,tag:`fan-out · the classic bug`,stmt:"An order has both `order_items` and `order_payments`. Joining all three inflates the totals. Diagnose and fix.",schema:`orders(order_id, cust_id)
order_items(order_id, amount)      -- 3 rows for order 1
order_payments(order_id, paid)     -- 2 rows for order 1`,approaches:[{name:`The broken query`,idea:`Two one-to-many joins on the same parent multiply each other.`,sql:`SELECT o.order_id,
       SUM(oi.amount) AS items_total,   -- 1.5x too big
       SUM(op.paid)   AS paid_total     -- 3x too big
FROM   orders o
JOIN   order_items    oi ON oi.order_id = o.order_id
JOIN   order_payments op ON op.order_id = o.order_id
GROUP  BY o.order_id;`,why:`Joining a parent to two independent children produces the **cartesian product of the children**: 3 items × 2 payments = 6 rows. Each item amount now appears twice and each payment three times, so both sums are inflated by the *other* side's row count. Nothing errors; the numbers are simply wrong, which is why this bug reaches production so often. The tell-tale sign is a total that is an exact integer multiple of the truth.`},{name:`Fix — aggregate before joining`,idea:`Collapse each child to one row per order first, then join the pre-aggregated results.`,sql:`SELECT o.order_id,
       COALESCE(i.items_total, 0) AS items_total,
       COALESCE(p.paid_total,  0) AS paid_total
FROM   orders o
LEFT   JOIN (SELECT order_id, SUM(amount) AS items_total
             FROM   order_items GROUP BY order_id) i
       ON i.order_id = o.order_id
LEFT   JOIN (SELECT order_id, SUM(paid) AS paid_total
             FROM   order_payments GROUP BY order_id) p
       ON p.order_id = o.order_id;`,why:"Each derived table is now **one row per order**, so the joins are one-to-one and no multiplication can occur. This is the general cure for fan-out and it also tends to be faster, because the aggregation happens on the narrow child tables before any join. `COALESCE` supplies zeros for orders with no items or no payments."},{name:`Fix — correlated scalar subqueries`,idea:`Compute each total inline, once per order.`,sql:`SELECT o.order_id,
       (SELECT COALESCE(SUM(amount), 0) FROM order_items
        WHERE order_id = o.order_id) AS items_total,
       (SELECT COALESCE(SUM(paid), 0)   FROM order_payments
        WHERE order_id = o.order_id) AS paid_total
FROM   orders o;`,why:`Reads cleanly and cannot fan out, since a scalar subquery returns exactly one value. The cost is one execution per outer row unless the optimiser rewrites it, so it suits queries that return few orders and scales poorly across millions. Good for a detail page, wrong for a full export.`}],takeaway:`Never join two one-to-many children of the same parent in one query. Pre-aggregate each child, or use scalar subqueries.`},{t:`q`,lvl:`medium`,title:`Join four tables and aggregate`,tag:`multi-table`,stmt:`For each customer country, report total revenue and distinct products sold in 2024.`,approaches:[{name:`Solution`,idea:`Chain joins along the foreign-key path, filter early, aggregate last.`,sql:`SELECT c.country,
       COUNT(DISTINCT o.order_id)   AS orders,
       COUNT(DISTINCT p.product_id) AS products,
       SUM(oi.qty * oi.unit_price)  AS revenue
FROM   customers   c
JOIN   orders      o  ON o.cust_id    = c.cust_id
JOIN   order_items oi ON oi.order_id  = o.order_id
JOIN   products    p  ON p.product_id = oi.product_id
WHERE  o.order_date >= '2024-01-01'
  AND  o.order_date <  '2025-01-01'
  AND  o.status      = 'delivered'
GROUP  BY c.country
ORDER  BY revenue DESC;`,why:"`COUNT(DISTINCT o.order_id)` is essential: the join to `order_items` duplicates each order once per line item, so a plain `COUNT(*)` would count line items rather than orders. `SUM(oi.qty * oi.unit_price)` is unaffected because each line item legitimately appears once. This is fan-out again, but here it is harmless for the sum and fatal for the count — you have to reason per column. Indexes on `orders(order_date, status)` and the two foreign keys are what keep this query fast."}],takeaway:"After a one-to-many join, every `COUNT` on the parent side needs `DISTINCT`. Sums of child columns do not."},{t:`q`,lvl:`hard`,title:`Latest row per group via join`,tag:`top-N per group · asked at Amazon, Uber`,stmt:`For each customer, return their most recent order.`,approaches:[{name:`Window function`,idea:`Rank orders within each customer and keep rank 1.`,sql:`SELECT cust_id, order_id, order_date, amount
FROM (
  SELECT o.*,
         ROW_NUMBER() OVER (PARTITION BY cust_id
                            ORDER BY order_date DESC, order_id DESC) AS rn
  FROM   orders o
) t
WHERE rn = 1;`,why:"The cleanest solution on MySQL 8+ and PostgreSQL. The tiebreaker `order_id DESC` matters: without it, two orders on the same date make the result non-deterministic. Use `RANK()` instead if you want all ties returned."},{name:`Anti-join (no later row exists)`,idea:`Keep an order only if no strictly later order exists for that customer.`,sql:`SELECT o.*
FROM   orders o
WHERE  NOT EXISTS (
         SELECT 1 FROM orders o2
         WHERE  o2.cust_id    = o.cust_id
           AND (o2.order_date, o2.order_id) > (o.order_date, o.order_id)
       );`,why:"Works on any engine including MySQL 5.7, and with an index on `(cust_id, order_date, order_id)` it is often the **fastest** option — the optimiser can stop at the first later row. The row-value comparison handles the tiebreak in one expression."},{name:`Join to a per-group max`,idea:`Compute the max date per customer, then join back.`,sql:`SELECT o.*
FROM   orders o
JOIN  (SELECT cust_id, MAX(order_date) AS mx
       FROM   orders GROUP BY cust_id) m
  ON   m.cust_id = o.cust_id
 AND   m.mx      = o.order_date;`,why:"Portable and readable, but it returns **duplicates** when a customer placed two orders on the same date — the reason the other two approaches carry an explicit tiebreaker. It also scans `orders` twice. Use it only when the sort key is genuinely unique per group."}],takeaway:"'Latest row per group' has three standard answers. Know the window one for modern engines, the `NOT EXISTS` one for legacy and for speed."},{t:`guess`,setup:`a(id): 1, 2, NULL
b(id): 2, 3, NULL`,sql:`SELECT COUNT(*) FROM a JOIN b ON a.id = b.id;`,out:`1`,why:"Only `id = 2` matches. The NULL in `a` does not join to the NULL in `b`, because `NULL = NULL` is UNKNOWN, not TRUE — join conditions keep only rows evaluating to TRUE. To match NULLs to each other you need MySQL's null-safe operator: `ON a.id <=> b.id` would return 2. This is why rows with NULL foreign keys silently disappear from inner joins."},{t:`guess`,setup:`a(id): 1, 1, 2
b(id): 1, 1, 3`,sql:`SELECT COUNT(*) FROM a JOIN b ON a.id = b.id;`,out:`4`,why:"Joins produce the **cartesian product of matching groups**. Two rows with `id = 1` on each side give 2 × 2 = 4 output rows; `id = 2` and `id = 3` match nothing. This is the mechanism behind every fan-out bug: if your join key is not unique on at least one side, the row count multiplies. Before writing a join, ask whether the key is unique on the right — if not, expect duplication and plan for it."},{t:`qa`,q:`What is the difference between an INNER JOIN and a LEFT JOIN with an IS NOT NULL filter?`,a:"Nothing, in result terms — `LEFT JOIN … WHERE right.key IS NOT NULL` returns exactly the inner-join rows, and most optimisers rewrite it to an inner join. The reason it matters is that the reverse mistake is common: writing a `LEFT JOIN` and then filtering on any non-NULL condition against the right table demotes it to an inner join by accident. If you want an inner join, write one; the intent should be visible in the syntax."},{t:`qa`,q:`How does the database physically execute a join?`,a:"Three main algorithms. **Nested loop**: for each row of the outer table, probe the inner table — excellent when the outer side is small and the inner side has an index on the join key, which is the usual plan in MySQL. **Hash join**: build a hash table on the smaller input, then stream the larger one through it — best for large unindexed joins; MySQL added it in 8.0.18, PostgreSQL has always had it. **Merge join**: sort both inputs on the join key and walk them in lockstep — efficient when both are already sorted, for example when reading in index order. `EXPLAIN` tells you which one was chosen."},{t:`qa`,q:`What is a semi-join and how does it differ from an inner join?`,a:"A semi-join returns rows from the left table that **have** a match, but never duplicates them and never returns right-table columns. `EXISTS` and `IN` express it. An inner join, by contrast, returns one output row per matching pair — so if the right side has three matches you get three rows. When you only need to test membership, `EXISTS` is both semantically correct and faster, because the engine can stop at the first match. The negative form, `NOT EXISTS`, is an anti-join.",sql:`-- semi-join: one row per customer, regardless of order count
SELECT c.* FROM customers c
WHERE EXISTS (SELECT 1 FROM orders o WHERE o.cust_id = c.cust_id);

-- inner join: one row per (customer, order) pair
SELECT c.* FROM customers c JOIN orders o ON o.cust_id = c.cust_id;`},{t:`qa`,q:`Does the order of tables in a JOIN affect performance?`,a:"For inner joins, not logically — the optimiser is free to reorder them and chooses based on statistics. In practice it matters when statistics are stale or the query is complex enough that the optimiser gives up searching (MySQL's `optimizer_search_depth`), in which case the written order can leak into the plan. For **outer** joins the order is semantically significant and cannot be freely reordered, which is one reason a chain of left joins can be slower than expected. Use `STRAIGHT_JOIN` in MySQL or `JOIN` hints only as a last resort after checking that statistics are current."},{t:`qa`,q:`What is the difference between USING and ON?`,a:"`USING (col)` is shorthand for `ON a.col = b.col` when both tables share the column name. It also **merges** the two columns into one in the output, so `SELECT *` returns one `col` rather than two, and you reference it unqualified. `ON` is more general — it supports different column names, inequalities, and multiple unrelated conditions. `NATURAL JOIN` goes further and joins on every same-named column automatically, which makes it dangerous: adding an unrelated `created_at` column to both tables silently changes the join."}]}]},h={id:`subquery`,num:`04`,title:`Subqueries & CTEs`,kicker:`Scalar, correlated, EXISTS, derived tables, WITH and recursion`,sections:[{id:`sub-kinds`,title:`The four kinds of subquery`,blocks:[{t:`schema`,x:d},{t:`q`,lvl:`easy`,title:`Compare against an aggregate`,tag:`scalar subquery`,stmt:`List employees earning more than the company average.`,approaches:[{name:`Solution`,idea:`A scalar subquery returns exactly one value, usable anywhere a literal can go.`,sql:`SELECT name, salary
FROM   employees
WHERE  salary > (SELECT AVG(salary) FROM employees);`,why:"This is legal in `WHERE` even though it contains an aggregate, because the aggregate belongs to the **inner** query. The subquery is **uncorrelated** — it does not reference the outer table — so it is evaluated once and its result reused for every row. If it returned more than one row you would get 'Subquery returns more than 1 row'; if it returns no rows it yields NULL and the comparison becomes UNKNOWN, filtering everything out."}]},{t:`q`,lvl:`medium`,title:`Compare against a per-group aggregate`,tag:`correlated subquery`,stmt:`List employees earning more than the average **for their own department**.`,approaches:[{name:`Correlated subquery`,idea:`The inner query references the outer row, so it is re-evaluated per department.`,sql:`SELECT e.name, e.dept_id, e.salary
FROM   employees e
WHERE  e.salary > (
         SELECT AVG(e2.salary)
         FROM   employees e2
         WHERE  e2.dept_id = e.dept_id     -- correlation
       );`,why:"The reference to `e.dept_id` inside the subquery is what makes it **correlated**: conceptually it runs once per outer row. In practice optimisers often rewrite it into a join against a grouped derived table, but the naive plan is O(n) subquery executions, which is why correlated subqueries have a reputation for being slow."},{name:`Join to a derived table`,idea:`Compute all the averages once, then join.`,sql:`SELECT e.name, e.dept_id, e.salary
FROM   employees e
JOIN  (SELECT dept_id, AVG(salary) AS avg_sal
       FROM   employees GROUP BY dept_id) d
  ON   d.dept_id = e.dept_id
WHERE  e.salary > d.avg_sal;`,why:"One pass to build the averages, one pass to compare — predictable and usually faster on large tables because the aggregation happens once rather than per row. This rewrite is the standard fix when a correlated subquery shows up as the bottleneck in `EXPLAIN`."},{name:`Window function`,idea:`Compute the group average alongside each row without collapsing anything.`,sql:`SELECT name, dept_id, salary
FROM (
  SELECT name, dept_id, salary,
         AVG(salary) OVER (PARTITION BY dept_id) AS avg_sal
  FROM   employees
) t
WHERE salary > avg_sal;`,why:"The most direct expression of the intent and a single pass over the table. `AVG(...) OVER (PARTITION BY ...)` attaches the group average to every row instead of collapsing the group, which is exactly what the comparison needs. Requires MySQL 8+. The wrapping subquery exists only because window functions cannot appear in `WHERE` — they are evaluated after it."}],takeaway:`'Compare a row to its group's aggregate' ⇒ window function on modern engines, derived-table join on older ones.`},{t:`q`,lvl:`medium`,title:`IN, EXISTS, ANY and ALL`,tag:`quantified predicates`,stmt:`Four variations: customers who ordered in 2024; customers who ordered nothing; products cheaper than any electronics item; products cheaper than every electronics item.`,approaches:[{name:`IN and EXISTS`,idea:"Both express membership; `EXISTS` is correlated, `IN` compares values.",sql:`-- ordered in 2024
SELECT name FROM customers c
WHERE  c.cust_id IN (SELECT cust_id FROM orders
                     WHERE order_date >= '2024-01-01');

-- same thing, correlated
SELECT name FROM customers c
WHERE EXISTS (SELECT 1 FROM orders o
              WHERE o.cust_id = c.cust_id
                AND o.order_date >= '2024-01-01');`,why:"Modern optimisers usually produce identical plans for these two. The practical differences: `IN` breaks on NULLs when negated, while `EXISTS` never does; `EXISTS` can short-circuit at the first match; and `IN` with a **literal list** is generally faster than `EXISTS` because there is no subquery to run at all. `SELECT 1` inside `EXISTS` is conventional — the select list is never evaluated, so `SELECT *` is equally fast, just noisier."},{name:`ANY / SOME and ALL`,idea:`Compare one value against every row of a set with a chosen operator.`,sql:`-- cheaper than at least one electronics item
SELECT name, price FROM products
WHERE  price < ANY (SELECT price FROM products WHERE category = 'electronics');
-- equivalent to:  price < (SELECT MAX(price) FROM ...)

-- cheaper than every electronics item
SELECT name, price FROM products
WHERE  price < ALL (SELECT price FROM products WHERE category = 'electronics');
-- equivalent to:  price < (SELECT MIN(price) FROM ...)`,why:"`< ANY` means 'less than the maximum' and `< ALL` means 'less than the minimum' — reasoning through to the MIN/MAX form is usually clearer and lets the optimiser use an index. `= ANY` is exactly `IN`, and `<> ALL` is exactly `NOT IN`, inheriting its NULL hazard: if the subquery yields any NULL, `< ALL` can never be TRUE. Note the **empty-set** behaviour is asymmetric: `ALL` over zero rows is TRUE, `ANY` over zero rows is FALSE."}],takeaway:"`= ANY` is `IN`. `<> ALL` is `NOT IN`. Rewriting `ANY`/`ALL` as MIN/MAX is usually clearer and faster."},{t:`q`,lvl:`medium`,title:`Subquery in the SELECT list`,tag:`scalar in projection`,stmt:`List departments with their headcount and the name of their highest earner.`,approaches:[{name:`Correlated scalar subqueries`,idea:`Each subquery returns one value per outer row.`,sql:`SELECT d.dept_name,
       (SELECT COUNT(*) FROM employees e
        WHERE e.dept_id = d.dept_id)                       AS headcount,
       (SELECT e.name FROM employees e
        WHERE e.dept_id = d.dept_id
        ORDER BY e.salary DESC, e.emp_id LIMIT 1)          AS top_earner
FROM   departments d;`,why:"Convenient and readable, and it cannot fan out. The cost is one execution of each subquery per outer row, so with 10 departments this is fine and with a million rows it is not. Each subquery **must return at most one row** or the query errors at runtime — the `LIMIT 1` plus a deterministic `ORDER BY` guarantees that. Rewrite as joins to pre-aggregated derived tables when the outer row count is large."}]},{t:`q`,lvl:`medium`,title:`Derived table versus CTE`,tag:`WITH`,stmt:`Rewrite a query that uses the same aggregation twice so the logic appears only once.`,approaches:[{name:`Derived table (repeated)`,idea:`The subquery has to be written out at each use.`,sql:`SELECT a.dept_id, a.avg_sal, b.avg_sal AS company_avg
FROM  (SELECT dept_id, AVG(salary) AS avg_sal
       FROM employees GROUP BY dept_id) a
CROSS JOIN
      (SELECT AVG(salary) AS avg_sal FROM employees) b
WHERE a.avg_sal > b.avg_sal;`,why:`A derived table must be given an alias in MySQL — omitting it is a syntax error. Referencing the same derived table twice means writing it twice, which is where copy-paste divergence bugs come from.`},{name:`CTE`,idea:"`WITH` names a result set once and lets you reference it repeatedly.",sql:`WITH dept_avg AS (
  SELECT dept_id, AVG(salary) AS avg_sal
  FROM   employees
  GROUP  BY dept_id
),
company AS (
  SELECT AVG(avg_sal) AS overall FROM dept_avg   -- CTEs can reference earlier CTEs
)
SELECT d.dept_id, d.avg_sal, c.overall
FROM   dept_avg d
CROSS  JOIN company c
WHERE  d.avg_sal > c.overall;`,why:"CTEs make a query readable top-to-bottom instead of inside-out, and later CTEs can reference earlier ones. In MySQL 8 and PostgreSQL 12+ they are **inlined** by default, so there is no performance penalty versus a derived table — but also **no caching**: referencing a CTE three times may execute it three times. PostgreSQL before 12 materialised CTEs unconditionally, acting as an optimisation fence; you can force that behaviour with `WITH x AS MATERIALIZED (…)`."}],takeaway:`CTEs are for readability, not speed. A CTE referenced twice is usually computed twice.`}]},{id:`sub-recursive`,title:`Recursive CTEs`,blocks:[{t:`q`,lvl:`hard`,title:`Walk an organisation chart to any depth`,tag:`recursive CTE · asked at Amazon, Google`,stmt:"Given `employees(emp_id, name, manager_id)`, list every employee under CEO id 1, with their depth and full reporting path.",hint:`An anchor member picks the starting rows; the recursive member joins the CTE back to the base table.`,approaches:[{name:`Solution`,idea:`Anchor at the root, then repeatedly join the previous level's rows to their direct reports.`,sql:`WITH RECURSIVE org AS (
  -- anchor: the starting point
  SELECT emp_id, name, manager_id,
         1 AS depth,
         CAST(name AS CHAR(500)) AS path
  FROM   employees
  WHERE  emp_id = 1

  UNION ALL

  -- recursive member: children of whatever the previous step produced
  SELECT e.emp_id, e.name, e.manager_id,
         o.depth + 1,
         CONCAT(o.path, ' > ', e.name)
  FROM   employees e
  JOIN   org o ON e.manager_id = o.emp_id
  WHERE  o.depth < 20                    -- safety brake against cycles
)
SELECT emp_id, name, depth, path
FROM   org
ORDER  BY path;`,out:`emp_id  name    depth  path
1       Ada     1      Ada
2       Bruno   2      Ada > Bruno
5       Dara    3      Ada > Bruno > Dara
3       Chen    2      Ada > Chen`,why:"The recursive member sees only the rows produced by the **previous iteration**, not the whole CTE, and stops when an iteration produces nothing. Three practical details: the `path` column must be `CAST` to a wide enough type in the anchor because MySQL fixes each column's type from the anchor row and silently truncates otherwise; `UNION ALL` is required (`UNION` would deduplicate and can hide legitimate rows); and MySQL enforces `cte_max_recursion_depth`, default 1000, erroring rather than looping forever. The explicit depth guard protects against genuine cycles in the data, which a self-referencing table can always contain."}],takeaway:"Anchor + `UNION ALL` + recursive join. Always cast text columns wide in the anchor and add a depth guard."},{t:`q`,lvl:`medium`,title:`Generate a series of dates`,tag:`recursive CTE · calendar`,stmt:`Produce every date in 2024 so a report can show days with zero activity.`,approaches:[{name:`Recursive generator`,idea:`Start at the first date and add one day until the end.`,sql:`WITH RECURSIVE dates AS (
  SELECT DATE('2024-01-01') AS d
  UNION ALL
  SELECT d + INTERVAL 1 DAY FROM dates WHERE d < '2024-12-31'
)
SELECT dt.d,
       COUNT(o.order_id) AS orders
FROM   dates dt
LEFT   JOIN orders o ON o.order_date = dt.d
GROUP  BY dt.d
ORDER  BY dt.d;`,why:"This is the portable way to build a calendar without a permanent table, and it is the standard fix for gaps in time series — `GROUP BY order_date` alone can only emit dates that exist in the data. For production reporting, create a real `calendar` table once and index it: recursion generates rows one iteration at a time and cannot be parallelised, so a physical table is faster and lets you attach holiday and fiscal-period columns."}]},{t:`q`,lvl:`hard`,title:`Split a delimited string into rows`,tag:`recursive CTE · tricky`,stmt:"Turn `'a,b,c'` into three rows. MySQL has no `STRING_SPLIT`.",approaches:[{name:`Recursive split`,idea:`Peel one item off the front each iteration.`,sql:`WITH RECURSIVE split (item, rest) AS (
  SELECT SUBSTRING_INDEX('a,b,c', ',', 1),
         CASE WHEN LOCATE(',', 'a,b,c') > 0
              THEN SUBSTRING('a,b,c', LOCATE(',', 'a,b,c') + 1)
              ELSE '' END
  UNION ALL
  SELECT SUBSTRING_INDEX(rest, ',', 1),
         CASE WHEN LOCATE(',', rest) > 0
              THEN SUBSTRING(rest, LOCATE(',', rest) + 1)
              ELSE '' END
  FROM   split
  WHERE  rest <> ''
)
SELECT item FROM split;`,out:`item
a
b
c`,why:"Each iteration takes the first element and carries the remainder forward, terminating when nothing is left. It works, but the existence of this problem is itself the lesson: **storing a delimited list in a column violates first normal form**, and every operation on it — searching, joining, counting — becomes a string exercise that no index can help. The correct fix is a junction table with one row per value. PostgreSQL has `string_to_array` and `unnest`, SQL Server has `STRING_SPLIT`, and MySQL 8 can use `JSON_TABLE` — but none of them make the design good."}],takeaway:`If you need to split a column, the schema is wrong. Normalise into a child table.`},{t:`guess`,setup:`t(n): 1, 2, 3`,sql:`SELECT n,
       (SELECT COUNT(*) FROM t)          AS uncorrelated,
       (SELECT COUNT(*) FROM t t2
        WHERE t2.n <= t.n)               AS correlated
FROM   t;`,out:`n  uncorrelated  correlated
1  3             1
2  3             2
3  3             3`,why:"The uncorrelated subquery does not mention the outer table, so it is evaluated **once** and its constant result repeated. The correlated one references `t.n`, so it is conceptually re-evaluated for each outer row — producing a running count. Spotting the correlation is how you predict both the result and the cost: uncorrelated subqueries are cheap, correlated ones scale with the outer row count unless the optimiser rewrites them into a join."},{t:`guess`,setup:`t(v): 1, 2`,sql:`SELECT v,
       v IN (SELECT NULL)      AS a,
       v IN (SELECT 1)         AS b,
       v IN (SELECT 1 UNION SELECT NULL) AS c
FROM   t;`,out:`v  a     b  c
1  NULL  1  1
