    sleep(50ms); retry a few times   -- or return stale / a default`,why:"`SET key value NX EX 10` is atomic — exactly one of ten thousand callers gets `true`. The `EX` is essential: without it, a crashed holder blocks recomputation forever. Note the lock value should be a random token, and release should only delete if the token still matches, or a slow holder can delete a lock that a later caller now owns."},{name:`Fix 2 — probabilistic early expiry`,idea:`Refresh before expiry, with a probability that rises as the deadline nears.`,sql:`-- store the value together with when it was computed and how long it took
{ value, computed_at, delta }   -- delta = time the recompute took

-- XFetch algorithm
now = time()
if now - delta * beta * ln(random()) >= expiry:
    recompute_and_store()          -- this caller refreshes early
return value                       -- everyone still gets a value immediately`,why:"Each reader independently rolls a die that gets loaded as expiry approaches, so on average exactly one caller refreshes early and **nobody ever experiences a miss**. Expensive recomputes (large `delta`) are refreshed earlier, which is the elegant part. This is the technique used when the value is costly and a stall is unacceptable — feed rankings, aggregate dashboards."},{name:`Fix 3 — serve stale while revalidating`,idea:`Keep two TTLs: a soft one for freshness and a hard one for eviction.`,sql:`-- stored value carries its own soft expiry
{ value, soft_expires_at }
redis.SET(key, payload, EX=3600)        -- hard TTL: 1 hour

v = redis.GET(key)
if v is null:                            -- true miss: must compute
    return compute_and_store()

if now > v.soft_expires_at:              -- stale but usable
    enqueue_background_refresh(key)      -- fire and forget
return v.value                           -- serve immediately`,why:"Readers never block on recomputation and the database sees a trickle of background refreshes instead of a spike. The trade-off is explicit: users may see data up to `hard - soft` seconds old during a refresh failure. This is the same `stale-while-revalidate` semantics HTTP caching uses, and it is usually the best default for read-heavy pages."}],takeaway:`Stampedes are caused by synchronised expiry. Fix with a recompute lock, probabilistic early refresh, stale-while-revalidate — and always add TTL jitter.`},{t:`q`,lvl:`hard`,title:`The hot key problem`,tag:`single-key saturation`,stmt:`One celebrity's profile key receives 400,000 reads per second — more than a single Redis node can serve. The rest of the keyspace is idle. Fix it.`,approaches:[{name:`Why sharding does not help`,idea:`A key lives on exactly one node, by definition.`,sql:`-- Redis Cluster hashes the key to one of 16384 slots
--   slot = CRC16(key) mod 16384
-- one key -> one slot -> one node

-- adding nodes redistributes SLOTS, not the load on a single key
-- a 10-node cluster still sends all 400k rps for this key to one node`,why:`This is the observation the question is testing. Horizontal scaling distributes *keys*, so it does nothing for a workload concentrated on one key. You have to break the key apart or move the reads somewhere else.`},{name:`Fix — client-side / local cache`,idea:`Cache the hottest keys in the application process itself.`,sql:`-- L1: in-process (Caffeine, an LRU map) — TTL of 1-5 seconds
-- L2: Redis                                — TTL of minutes
-- L3: database

value = local.get(key)
if value is null:
    value = redis.GET(key)
    local.put(key, value, ttl=2s)     -- very short TTL
return value`,why:`With 200 application servers and a 2-second local TTL, Redis sees at most 100 requests per second for that key instead of 400,000 — a 4000× reduction, from one line of code. The cost is bounded staleness: a change takes up to 2 seconds to appear everywhere, and you cannot invalidate local caches synchronously. For a celebrity profile that is entirely acceptable; for a bank balance it is not.`},{name:`Fix — split the key`,idea:`Replicate the value across N sub-keys and have readers pick one at random.`,sql:`-- write: fan out to N copies
for i in 0..9:
    redis.SET("profile:991:copy" + i, value, EX=300)

-- read: pick a random copy
i = random(0, 9)
redis.GET("profile:991:copy" + i)

-- each copy hashes to a different slot, so load spreads across nodes`,why:`Ten copies means roughly 40k rps per copy, which any node handles comfortably. The costs are 10× the memory for that key and a fan-out on every write, so this only makes sense for read-dominated hot keys. The same salting trick fixes hot partitions in Cassandra and DynamoDB, where it is the standard answer.`},{name:`Fix — read replicas for the hot slot`,idea:`Redis replicas can serve reads if you accept replication lag.`,sql:`-- Redis Cluster: each master can have replicas
-- clients opt in with READONLY, then reads may go to a replica

READONLY
GET profile:991

-- lag is typically sub-millisecond but is NOT zero
-- writes still all go to the master`,why:`Simple and needs no application change beyond the connection setting, but it scales reads by a small integer factor rather than by orders of magnitude, and it inherits replication lag. Use it in combination with local caching rather than instead of it.`}],takeaway:`Hot keys are not solved by adding nodes. A short-TTL in-process cache in front of Redis is the highest-leverage fix; key splitting is the fallback when staleness is unacceptable.`}]},{id:`cache-redis`,title:`Redis in practice`,blocks:[{t:`table`,head:[``,`Redis`,`Memcached`],rows:[[`Data types`,`Strings, hashes, lists, sets, sorted sets, streams, bitmaps, HyperLogLog, geo`,`Strings only (opaque bytes)`],[`Persistence`,`RDB snapshots and/or AOF log — can survive restart`,`None. Restart loses everything`],[`Replication`,`Built-in primary/replica, Cluster mode, Sentinel failover`,`None. Clients shard by hashing`],[`Threading`,`Single-threaded command execution (I/O threads since 6.0)`,`Multi-threaded — better raw throughput per node for pure GET/SET`],[`Eviction`,"8 policies including LRU, LFU, TTL-aware, `noeviction`",`LRU only`],[`Atomic operations`,`INCR, SETNX, sorted-set ops, Lua scripts, transactions, functions`,`INCR/DECR, CAS`],[`Memory efficiency`,`More overhead per key; slab-free allocator`,`Slightly leaner for a pure key→blob workload`],[`Choose it when`,`You need structures, atomicity, persistence, pub/sub, or queues — i.e. almost always`,`You want a dead-simple, multi-threaded, pure LRU blob cache and nothing more`]]},{t:`note`,k:`ask`,x:`"Redis or Memcached?" is really asking whether you know Redis is a **data structure server** rather than a cache that happens to be popular. Memcached remains a reasonable choice for a pure page-fragment cache, but the moment you need a counter, a leaderboard, a lock, a queue or a set membership test, Redis is doing something Memcached structurally cannot.`},{t:`q`,lvl:`medium`,title:`Pick the right Redis data structure`,tag:`Redis structures`,stmt:`Map each requirement to the structure that solves it in one operation rather than in application code.`,approaches:[{name:`Strings, hashes, counters`,idea:`The building blocks.`,sql:`-- simple value with expiry
SET session:abc123 "{...}" EX 1800

-- atomic counter — no read-modify-write race
INCR  page:views:home
INCRBY user:991:credits -5

-- hash: update ONE field without deserialising the whole object
HSET  user:991 name "Ada" email "ada@x.com" login_count 42
HINCRBY user:991 login_count 1
HGET  user:991 email

-- rate limit: increment and expire together
INCR  rate:user991:60s
EXPIRE rate:user991:60s 60 NX`,why:"`INCR` is the canonical example of why Redis beats a plain cache: the increment is atomic server-side, so a thousand concurrent requests produce exactly a thousand. Doing this with `GET` then `SET` loses updates. Hashes matter for memory too — storing a 20-field object as one hash is far cheaper than 20 separate keys, because each Redis key carries its own overhead."},{name:`Sorted sets — leaderboards, queues, windows`,idea:`A set where every member has a score, kept in score order.`,sql:`-- leaderboard: O(log N) insert, O(log N + M) range read
ZADD  leaderboard 4820 "user:991"
ZREVRANGE     leaderboard 0 9 WITHSCORES     -- top 10
ZREVRANK      leaderboard "user:991"         -- this user's rank
ZINCRBY       leaderboard 50 "user:991"      -- atomic score bump

-- sliding-window rate limiter: score = timestamp
ZREMRANGEBYSCORE rate:user991 0 (now - 60000)   -- drop old entries
ZCARD            rate:user991                    -- count in window
ZADD             rate:user991 now  now-uuid

-- delayed queue: score = "run at" time
ZADD   jobs:delayed 1719849600 "job:5521"
ZRANGEBYSCORE jobs:delayed 0 <now> LIMIT 0 10`,why:"The sorted set is the structure people underuse most. A leaderboard over ten million users answers 'top 10' and 'what is my rank' in microseconds — the equivalent SQL is a full sort or a maintained rank column with a write amplification problem. The sliding-window rate limiter is exact rather than approximate, unlike the fixed-window `INCR` version which allows a 2× burst at the boundary."},{name:`Sets, bitmaps, HyperLogLog`,idea:`Membership, flags and cardinality at scale.`,sql:`-- sets: membership, intersection
SADD    user:991:following 12 45 78
SISMEMBER user:991:following 45
SINTER  user:991:following user:77:following   -- mutual follows

-- bitmap: one bit per user id — 10M users = 1.2 MB
SETBIT  active:2024-06-01 991 1
BITCOUNT active:2024-06-01                     -- daily actives
BITOP AND weekly active:d1 active:d2 ...       -- retained all week

-- HyperLogLog: cardinality of a huge set in 12 KB, ~0.81% error
PFADD   uniques:2024-06-01 "user:991"
PFCOUNT uniques:2024-06-01
PFMERGE uniques:week uniques:d1 uniques:d2     -- exact-set merges are free`,why:`HyperLogLog is the answer to 'count distinct users over 30 days' at a scale where exact counting is unaffordable — 12 KB regardless of cardinality, with under 1% error, and merges are lossless so daily sketches roll up into weekly and monthly. Bitmaps are the exact alternative when ids are dense integers. Both replace queries that would otherwise scan a fact table.`},{name:`Streams and pub/sub`,idea:`Redis as a lightweight message log.`,sql:`-- pub/sub: fire and forget, NO persistence, no replay
PUBLISH  notifications "{...}"
SUBSCRIBE notifications

-- streams: an append-only log with consumer groups and acks
XADD     events * type "click" user 991
XGROUP   CREATE events workers $
XREADGROUP GROUP workers worker1 COUNT 10 STREAMS events >
XACK     events workers 1719849600123-0`,why:`The distinction matters: **pub/sub delivers to whoever is connected right now and drops the message otherwise** — a subscriber that reconnects has missed everything. Streams persist, support consumer groups, track acknowledgements and allow replay. Use pub/sub for cache invalidation broadcasts and live presence; use streams when a lost message is a bug. For anything mission-critical at volume, Kafka is still the right tool.`}],takeaway:`If you are doing read-modify-write against Redis, there is almost certainly a single atomic command that does it. Sorted sets and HyperLogLog replace whole classes of expensive SQL.`},{t:`q`,lvl:`hard`,title:`Distributed lock with Redis`,tag:`asked at Uber, Atlassian · and it has a catch`,stmt:`Implement a lock so only one worker runs a job. Then explain why the naive version is unsafe and what Redlock does and does not guarantee.`,approaches:[{name:`The naive lock and its bugs`,idea:`Three separate bugs in five lines.`,sql:`-- BUG 1: no expiry — a crashed holder locks the job forever
SETNX job:lock 1

-- BUG 2: SET then EXPIRE is two commands — a crash between them
SETNX job:lock 1
EXPIRE job:lock 30

-- BUG 3: anyone can release anyone's lock
DEL job:lock`,why:"Bug 3 is the subtle one. If holder A stalls past the TTL, the lock expires and holder B acquires it — then A wakes up and calls `DEL`, releasing **B's** lock. Now two workers believe they hold it. Every one of these bugs has caused a production incident somewhere."},{name:`The correct single-node lock`,idea:`Atomic acquire with a unique token, and a compare-and-delete release.`,sql:`-- acquire: atomic, with expiry, carrying a token unique to this holder
SET job:lock <random-token> NX PX 30000

-- release: delete ONLY if we still hold it (Lua = atomic)
EVAL "
  if redis.call('get', KEYS[1]) == ARGV[1] then
    return redis.call('del', KEYS[1])
  else
    return 0
  end
" 1 job:lock <random-token>

-- extend while still working (a watchdog, every TTL/3)
EVAL "
  if redis.call('get', KEYS[1]) == ARGV[1] then
    return redis.call('pexpire', KEYS[1], ARGV[2])
  else return 0 end
" 1 job:lock <random-token> 30000`,why:"The token turns release into a compare-and-swap so you can only delete your own lock, and the Lua script makes the check-and-delete atomic — doing it as `GET` then `DEL` reintroduces the race. The watchdog handles jobs that legitimately run longer than the TTL. This is what Redisson, redis-py's `Lock` and most mature clients implement."},{name:`Redlock, and the honest caveat`,idea:`Acquire on a majority of N independent Redis masters.`,sql:`-- acquire the same key on 5 independent masters
-- succeed if a majority (3) grant it AND elapsed time < TTL

-- the criticism (Kleppmann): a lock service built on timing
-- assumptions cannot provide MUTUAL EXCLUSION guarantees, because
--   - a GC pause or VM freeze can stall a holder past its TTL
--   - clock drift breaks the validity calculation
--   - the holder cannot know it has lost the lock

-- the mitigation: fencing tokens
--   lock service returns a monotonically increasing token
--   every write to the protected resource carries the token
--   the resource REJECTS any write with a token lower than the last seen`,why:`The right answer distinguishes two purposes. For **efficiency** — avoiding duplicate work, where an occasional double-run is merely wasteful — a single-node Redis lock is fine and Redlock is over-engineering. For **correctness** — where two holders would corrupt data — no timing-based lock is sufficient, and you need fencing tokens enforced by the resource itself, or a consensus system like ZooKeeper or etcd. Saying 'it depends whether a double-run is wasteful or catastrophic' is the answer interviewers are listening for.`}],takeaway:"`SET key token NX PX ttl` to acquire, Lua compare-and-delete to release, watchdog to extend. For correctness-critical locks, add fencing tokens — no TTL-based lock alone is safe."},{t:`q`,lvl:`medium`,title:`Configure Redis for its job`,tag:`persistence, eviction, memory`,stmt:`Choose persistence and eviction settings for (a) a pure cache, (b) a session store, (c) a rate limiter.`,approaches:[{name:`Persistence: RDB vs AOF`,idea:`Two mechanisms with different loss windows and restart costs.`,sql:`-- RDB: point-in-time fork-and-snapshot
save 900 1        # snapshot if >=1 key changed in 900s
save 300 10
#  ✓ compact file, fast restart, minimal runtime cost
#  ✗ lose everything since the last snapshot (minutes)

-- AOF: append every write command to a log
appendonly yes
appendfsync everysec      # always | everysec | no
#  ✓ lose at most ~1 second with 'everysec'
#  ✗ larger files, slower restart (replays the log), rewrite overhead

-- both together is the common production setting`,why:"'everysec' is the sensible default: `always` fsyncs on every write and destroys throughput, `no` leaves the loss window to the OS. Restart time matters more than people expect — a 50 GB AOF can take many minutes to replay, during which the cache is cold and the database takes the full load, which is its own incident."},{name:`Eviction policy`,idea:"What Redis does when it hits `maxmemory` — and the setting that surprises people.",sql:`maxmemory 8gb
maxmemory-policy allkeys-lru

-- noeviction      : return errors on write. THE DEFAULT.
-- allkeys-lru     : evict least recently used from all keys
-- allkeys-lfu     : evict least FREQUENTLY used  (better for skewed access)
-- volatile-lru    : evict LRU among keys that have a TTL only
-- volatile-ttl    : evict the keys expiring soonest
-- allkeys-random  : evict at random (cheap; surprisingly decent)`,why:"The default is `noeviction`, which means a Redis used as a cache **starts rejecting writes** when it fills up rather than making room — a genuinely common production surprise. For a pure cache set `allkeys-lru`, or `allkeys-lfu` when a small set of keys is much hotter than the rest, since LFU resists a burst of one-off scans flushing your hot set."},{name:`The three workloads`,idea:`Different jobs, different settings — and sometimes different instances.`,sql:`-- (a) pure cache: loss is harmless, refill from the DB
--     persistence: OFF        eviction: allkeys-lru
--     everything has a TTL

-- (b) session store: loss logs everyone out
--     persistence: AOF everysec (+ RDB)   eviction: volatile-lru
--     sessions have TTLs; nothing else should be evicted
--     consider: replicas + Sentinel, or accept re-login on failure

-- (c) rate limiter: loss briefly resets limits — usually acceptable
--     persistence: OFF        eviction: volatile-ttl
--     every key has a short TTL by construction

-- run (a) and (b) as SEPARATE instances: you do not want cache
-- pressure evicting sessions`,why:`The instinct to run one big Redis for everything is where this goes wrong. A cache workload under memory pressure will happily evict your session keys, logging out every user because someone deployed a feature that caches large objects. Separate instances give separate memory limits, separate eviction policies and separate blast radius — the cost is another thing to operate, which is usually worth it.`}],takeaway:"Default `maxmemory-policy` is `noeviction`, which breaks caches. Set it explicitly, give everything a TTL, and never share one instance between cache and session workloads."},{t:`guess`,setup:`-- Redis, single instance, two concurrent clients`,sql:`-- Client A                      -- Client B
GET  counter        -> "5"
                                  GET  counter    -> "5"
SET  counter 6
                                  SET  counter 6

-- versus:
INCR counter                      INCR counter`,out:`read-modify-write:  counter = 6   (one increment lost)
INCR:               counter = 7   (both counted)`,why:"Redis executes commands **single-threaded**, so each individual command is atomic — but a `GET` followed by a `SET` is two commands with a window between them, and concurrent clients interleave there. `INCR` does the whole operation server-side in one command, so nothing can interleave. The general rule: any time you find yourself reading a value from Redis, modifying it in application code and writing it back, look for the atomic command (`INCR`, `HINCRBY`, `ZINCRBY`, `SETNX`, `GETSET`) or wrap it in a Lua script, which also runs atomically."},{t:`qa`,q:`How do you keep the cache consistent with the database?`,a:`You do not, fully — you bound the inconsistency. The practical ladder: (1) always set a TTL, so staleness is time-bounded no matter what else fails; (2) delete rather than update the key on write, and write to the database **before** deleting; (3) for stricter needs, drive invalidation from the database's change log via CDC, so nothing can write to the database without the cache learning about it; (4) accept that a distributed cache and a database cannot be atomically updated together — that is the dual-write problem, and pretending otherwise is where bugs live. Anyone claiming perfect cache consistency is either using a single node or has not looked closely.`},{t:`qa`,q:`What should you not cache?`,a:`Data that is written far more than read, since you pay invalidation cost for no read benefit. Data unique to each request, which never gets a hit. Data where staleness is unacceptable and the TTL would have to be near zero — the cache adds latency and a failure mode for nothing. Very large values, which crowd out many small hot ones and cause latency spikes on the single-threaded server. And anything you cannot afford to serve stale during an invalidation failure, unless the correctness comes from somewhere else.`},{t:`qa`,q:`What happens when the cache goes down?`,a:`The database receives the full uncached read load instantly — often 10–100× normal — and typically falls over too, turning a cache outage into a total outage. This is why cache failure must be a designed-for case: use a circuit breaker so cache errors fail open to the database rather than throwing; rate-limit or shed load at the application tier; keep a small in-process L1 cache that survives Redis being unavailable; and warm the cache before returning a restarted instance to service. A cold restart of a large Redis is the same event as an outage from the database's perspective.`},{t:`qa`,q:`What is a cache penetration attack, and how does it differ from a stampede?`,a:'Penetration is repeated requests for keys that **do not exist** — every one misses the cache and hits the database, and no amount of caching helps because there is nothing to cache. An attacker enumerating random product IDs does this deliberately. The fixes are to cache the negative result too (`SET key "NULL" EX 60`, with a short TTL so a later real insert appears quickly), and to put a Bloom filter of valid keys in front so nonexistent IDs are rejected without touching either store. A stampede, by contrast, is many requests for a key that *does* exist but just expired.'}]}]},oe={id:`datastore`,num:`18`,title:`Choosing a Datastore`,kicker:`NoSQL families, query-first modelling, consistency levels and polyglot persistence`,sections:[{id:`ds-families`,title:`The families and when each wins`,blurb:`"SQL or NoSQL" is the wrong question. The right one is which access pattern dominates, and what you are willing to give up for it.`,blocks:[{t:`table`,head:[`Family`,`Examples`,`Wins at`,`Costs you`],rows:[[`**Relational**`,`PostgreSQL, MySQL`,`Joins, transactions, constraints, ad-hoc queries, correctness by default`,`Single-node write ceiling; schema changes on huge tables`],[`**Key-value**`,`Redis, DynamoDB, Memcached`,`Single-key reads and writes at enormous scale, predictable latency`,`No joins, no ad-hoc queries; you must know the key`],[`**Wide-column**`,`Cassandra, ScyllaDB, HBase`,`Massive write throughput, linear scaling, multi-region writes`,`Query-first modelling; no joins; tuneable but not free consistency`],[`**Document**`,`MongoDB, DocumentDB`,`Nested objects that are read and written as a unit; flexible schema`,`Weak cross-document integrity; easy to model relationally by accident`],[`**Search**`,`Elasticsearch, OpenSearch`,`Full-text relevance, faceting, fuzzy matching, aggregations`,`Not a source of truth; eventually consistent; expensive to operate`],[`**Time-series**`,`TimescaleDB, InfluxDB, Prometheus`,`Append-heavy metrics, downsampling, retention, time-range scans`,`Poor at non-time-ordered access; specialised query languages`],[`**Graph**`,`Neo4j, Neptune`,`Deep traversals — shortest path, N-degree connections`,`Poor at aggregate scans; a niche most apps never need`],[`**Analytical / columnar**`,`ClickHouse, BigQuery, Snowflake, Redshift`,`Scans and aggregates over billions of rows`,`Not transactional; poor at single-row lookups and updates`]]},{t:`note`,k:`ask`,x:`A strong answer usually ends up **polyglot**: PostgreSQL as the source of truth, Redis for caching and counters, Elasticsearch for search, ClickHouse or a warehouse for analytics — with change data capture keeping the derived stores in sync. The weak answer picks one store and contorts every access pattern into it.`},{t:`q`,lvl:`medium`,title:`Choose the store for five workloads`,tag:`the judgement question`,stmt:`For each workload, name the store and, more importantly, the property that decides it.`,approaches:[{name:`User accounts and orders`,idea:`Relational. This is not a close call.`,sql:`-- properties that decide it:
--   multi-row invariants   (order total = sum of line items)
--   transactions           (charge card AND decrement stock, or neither)
--   referential integrity  (no order without a customer)
--   ad-hoc queries         (finance asks a new question every week)

-- volume is not the deciding factor: a single Postgres node
-- comfortably handles tens of millions of orders`,why:`People reach for NoSQL here because of an imagined future scale, then rebuild transactions and joins in application code — badly. Unless you have a concrete write-throughput number that exceeds a single node, relational is the correct answer for anything with money or invariants in it.`},{name:`10M IoT sensor readings per minute`,idea:`Time-series or wide-column. Writes dominate and are append-only.`,sql:`-- properties that decide it:
--   append-only, never updated
--   always queried by (device, time range)
--   old data downsampled then dropped
--   write rate exceeds a single relational node

-- TimescaleDB if you want to keep SQL and joins to metadata
-- Cassandra if you need multi-region writes and linear scaling
-- ClickHouse if the dominant workload is analytical aggregation`,why:`The deciding property is that the access pattern is *entirely* known in advance — always by device and time. That is exactly the condition under which giving up ad-hoc querying costs you nothing. TimescaleDB is the underrated answer because it keeps SQL, joins to your relational metadata, and hypertable partitioning with automatic retention.`},{name:`Product search with typo tolerance and facets`,idea:`Elasticsearch alongside the relational store, never instead of it.`,sql:`-- properties that decide it:
--   relevance ranking      (SQL has no notion of "best match")
--   fuzzy / typo tolerance
--   faceted counts across many attributes
--   these are not transactional reads

-- architecture: Postgres is source of truth
--               CDC (Debezium) -> Elasticsearch index
--               search hits ES, then hydrates from Postgres or a cache`,why:`Elasticsearch is not a source of truth — it has no transactions, its consistency model is eventual, and reindexing is routine. The correct shape is always 'relational owns the data, search owns the index, a pipeline keeps them aligned'. Candidates who make ES the primary store are describing a future data-loss incident.`},{name:`Session store and rate limiting`,idea:`Redis. Ephemeral, keyed, high-throughput, TTL-native.`,sql:`-- properties that decide it:
--   every value has a natural expiry
--   accessed only by key
--   loss is recoverable (re-login) or harmless (limit resets)
--   needs atomic INCR and sorted-set windows

-- do NOT put sessions in your primary relational database:
--   they are the highest-write, lowest-value rows you own`,why:`Sessions in Postgres are a classic self-inflicted wound — every request writes a row, so your most durable, most expensive store handles your least durable data. Redis with a TTL matches the semantics exactly.`},{name:`Social graph — friends of friends`,idea:`Usually still relational. Graph databases are over-prescribed.`,sql:`-- one and two degrees: trivial in SQL, and fast with the right index
SELECT DISTINCT f2.friend_id
FROM   friends f1
JOIN   friends f2 ON f2.user_id = f1.friend_id
WHERE  f1.user_id = 991 AND f2.friend_id <> 991;

-- a graph DB earns its place at UNBOUNDED depth:
--   shortest path between two arbitrary people
--   "all accounts within 6 hops of this fraud ring"
--   recursive traversal where the depth is not known in advance`,why:`One or two degrees of separation is a self-join, and a well-indexed relational database does it in milliseconds. The honest threshold is variable-depth traversal: when the query is 'find any path' rather than 'find neighbours of neighbours', SQL's recursive CTE becomes exponential and a graph engine's index-free adjacency wins decisively. Below that threshold, adding a graph database is complexity without payoff.`}],takeaway:`Decide by access pattern and required invariants, never by anticipated scale. Most systems end up relational-plus-Redis, with a search or analytics store fed by CDC.`},{t:`q`,lvl:`hard`,title:`Model for Cassandra`,tag:`query-first modelling · asked at Netflix, Uber, Apple`,stmt:`Design Cassandra tables for a messaging app: show a user's conversations, and show messages in one conversation. Explain how this differs from relational modelling.`,hint:`In Cassandra you cannot join and you cannot filter on an unindexed column. Start from the queries, and expect to store the same data more than once.`,approaches:[{name:`The mental inversion`,idea:`Relational normalises then queries. Cassandra enumerates queries then builds a table per query.`,sql:`-- RELATIONAL:  one normalised schema  -> many possible queries
-- CASSANDRA:   one table PER QUERY   -> denormalised, duplicated

-- rules that force this:
--   no joins
--   WHERE must include the full partition key
--   ORDER BY only on clustering columns, in their declared order
--   no aggregates across partitions`,why:`This is the single conceptual leap. A Cassandra schema with three tables holding overlapping data is not a normalisation failure — it is the intended design. Writes are cheap and disks are cheap; the constraint being optimised is that every read must hit exactly one partition on one node.`},{name:`Table per query`,idea:`Two queries, two tables, same data written twice.`,sql:`-- QUERY 1: conversations for a user, most recent first
CREATE TABLE conversations_by_user (
  user_id        uuid,
  last_message_at timestamp,
  conversation_id uuid,
  peer_name      text,          -- denormalised: no join available
  last_preview   text,
  PRIMARY KEY ((user_id), last_message_at, conversation_id)
) WITH CLUSTERING ORDER BY (last_message_at DESC);

-- QUERY 2: messages in a conversation, newest first, paged
CREATE TABLE messages_by_conversation (
  conversation_id uuid,
  bucket          int,          -- see the next tab
  sent_at         timestamp,
  message_id      timeuuid,
  sender_id       uuid,
  body            text,
  PRIMARY KEY ((conversation_id, bucket), sent_at, message_id)
) WITH CLUSTERING ORDER BY (sent_at DESC, message_id DESC);`,why:"The partition key (in double parentheses) decides which node holds the data and **must** appear in every query. Clustering columns decide the sort order within the partition, so `ORDER BY sent_at DESC` costs nothing — the data is already stored that way. `peer_name` is copied in because there is no join to fetch it, which means a name change requires updating every row that carries it. That is the trade you are making."},{name:`Bucket to bound partition size`,idea:`An unbounded partition is the classic Cassandra failure.`,sql:`-- a busy conversation could reach millions of messages in one partition
-- Cassandra target: < 100 MB and < 100k rows per partition

-- add a time bucket to the partition key
bucket = year * 100 + month        -- e.g. 202406

-- reads then walk buckets backwards until the page is full
SELECT * FROM messages_by_conversation
WHERE  conversation_id = ? AND bucket = 202406
ORDER  BY sent_at DESC LIMIT 50;`,why:`Partitions are the unit of storage, repair and read; a multi-gigabyte partition causes read timeouts, compaction stalls and out-of-memory errors on the owning node, and it cannot be split retroactively. Bucketing is how you cap it. The cost is that a read spanning a bucket boundary needs two queries — which the application handles, because the alternative is an unrecoverable hot partition.`},{name:`Consistency level per query`,idea:`Cassandra lets you choose the consistency/latency trade per operation.`,sql:`-- with replication factor RF = 3:
--   W + R > RF  =>  strong consistency for that read

INSERT INTO messages_by_conversation (...) VALUES (...)
  USING CONSISTENCY QUORUM;      -- W = 2

SELECT ... USING CONSISTENCY QUORUM;   -- R = 2 ; 2 + 2 > 3  -> consistent

-- cheaper options, chosen per query:
--   ONE           lowest latency, may read stale
--   LOCAL_QUORUM  quorum within the local datacentre (the usual multi-DC default)
--   ALL           strongest, but any node down = failed query`,why:"This is Cassandra's real distinguishing feature: consistency is a **per-query dial**, not a database-wide property. A message send uses `QUORUM` because losing it is unacceptable; a read-receipt display uses `ONE` because a stale tick is harmless. `LOCAL_QUORUM` is the multi-datacentre default because a global quorum pays cross-ocean latency on every operation. Understand `W + R > RF` and you understand the model."}],takeaway:`Cassandra: enumerate queries, build a table per query, put the partition key in every WHERE, bound partition size with bucketing, and set consistency per operation.`},{t:`q`,lvl:`hard`,title:`DynamoDB partition key and single-table design`,tag:`asked at Amazon`,stmt:`Design DynamoDB keys for an e-commerce system that must fetch a customer, their orders, and the items of one order. Explain why the partition key choice dominates everything.`,approaches:[{name:`Single-table design`,idea:`Overload one table with generic key names and typed prefixes.`,sql:`Table: app
  PK (partition)      SK (sort)              attributes
  ------------------  ---------------------  ---------------------------
  CUST#991            PROFILE                name, email, tier
  CUST#991            ORDER#2024-06-01#5521  total, status
  CUST#991            ORDER#2024-06-14#5610  total, status
  ORDER#5521          ITEM#001               sku, qty, price
  ORDER#5521          ITEM#002               sku, qty, price

-- customer + all their orders in ONE query, one partition:
Query(PK = "CUST#991")

-- just the profile:
Query(PK = "CUST#991", SK = "PROFILE")

-- orders in a date range, already sorted:
Query(PK = "CUST#991", SK begins_with "ORDER#2024-06")`,why:`Sort-key prefixes turn one partition into a mini hierarchy, so related entities are co-located and retrieved together. This is why single-table design exists: DynamoDB charges and scales per partition access, so putting everything a request needs into one partition makes the request one round trip at predictable cost. It reads as bizarre coming from SQL and is entirely rational given the constraints.`},{name:`Why the partition key dominates`,idea:`It determines both which physical partition stores the item and how load spreads.`,sql:`-- BAD: low-cardinality partition key
PK = "ORDERS"          -- everything in ONE partition
-- capped at ~3000 read units / 1000 write units, forever

-- BAD: monotonic partition key
PK = "2024-06-14"      -- all of today's writes hit one partition

-- GOOD: high cardinality, evenly accessed
PK = "CUST#991"

-- hot key that cannot be avoided? write-shard it:
PK = "CUST#991#" + random(0..9)
-- reads fan out to 10 partitions and merge`,why:`DynamoDB partitions have hard throughput limits, so an uneven key means you provision for the whole table and still throttle on one partition. This is the same hot-partition problem as Cassandra and as range-sharded SQL, and it has the same fix — hash or salt the key. Getting this wrong is expensive to correct because the partition key cannot be changed without rewriting the table.`},{name:`Secondary indexes`,idea:`Access patterns you did not anticipate need a GSI — and a GSI is a copy.`,sql:`-- GSI: query orders by status, across all customers
GSI1PK = "STATUS#pending"    GSI1SK = "2024-06-14#5610"

-- Local Secondary Index (LSI): same PK, different sort key
--   must be created with the table; shares the partition's 10 GB limit

-- Global Secondary Index (GSI): different PK entirely
--   a separate, asynchronously replicated copy
--   -> EVENTUALLY consistent, and billed as its own table`,why:`A GSI is not an index in the B-tree sense — it is a full replicated projection with its own throughput and cost, updated asynchronously. That means a read immediately after a write may not see the item, which is a genuine correctness consideration for workflows that write then immediately query by the indexed attribute. Each GSI also roughly doubles the write cost of the items it projects, which is how DynamoDB bills surprise teams.`}],takeaway:`In DynamoDB the partition key is the design. High cardinality, even access, everything a request needs in one partition — and remember a GSI is an eventually-consistent copy you pay for twice.`}]},{id:`ds-consistency`,title:`Consistency, quorums and CAP`,blocks:[{t:`q`,lvl:`hard`,title:`Explain CAP without reciting it`,tag:`asked everywhere, answered badly everywhere`,stmt:`State what CAP actually claims, why 'pick two' is misleading, and what PACELC adds.`,approaches:[{name:`What it actually says`,idea:`It is a statement about behaviour **during a network partition**, not a menu.`,sql:`During a partition, a distributed system must choose:

  CP  — refuse requests on the minority side to preserve consistency
        (etcd, ZooKeeper, HBase, MongoDB with majority writes)

  AP  — keep serving on both sides and reconcile later
        (Cassandra, DynamoDB, Riak with tuneable levels)

  CA  — not a real option. You cannot choose to not have partitions;
        the network chooses for you.`,why:`'Pick two of three' is the misleading part. Partitions are not something you elect — they happen — so every real distributed system is either CP or AP, and 'CA' describes a single node. When the network is healthy, which is nearly always, a system can be both consistent and available; CAP says nothing about that case.`},{name:`PACELC — the more useful version`,idea:`It covers the normal case, which is where you actually spend your time.`,sql:`if Partition:  choose Availability or Consistency
Else:          choose Latency      or Consistency

  PC/EC  — consistent always, latency cost always   (Spanner, etcd)
  PA/EL  — available and fast, eventually consistent (Cassandra default,
                                                      Dynamo, Riak)
  PC/EL  — consistent under partition, fast normally (MongoDB, most
                                                      relational + replicas)`,why:`PACELC names the trade you make 99.99% of the time: even with a perfect network, a strongly consistent read must contact a quorum, which costs a round trip — and across regions that is 100 ms or more. That is why a system can be technically consistent and still unusable for a latency-sensitive path, and why 'strongly consistent' is a decision to make per query rather than per system.`},{name:`The levels that matter in practice`,idea:`Between 'strong' and 'eventual' there are useful named guarantees.`,sql:`Strong / linearizable  — every read sees the latest write. Costs a quorum.
Sequential             — all nodes see writes in the same order.
Causal                 — related writes are seen in order; unrelated may reorder.
Read-your-writes       — YOU always see your own writes. Others may lag.
Monotonic reads        — you never see time go backwards.
Eventual               — converges given no new writes. No timing promise.`,why:`Almost every user-facing complaint about eventual consistency is really a **read-your-writes** failure — someone edits their profile and sees the old value. That is fixable cheaply with sticky routing or by returning the written value, without paying for global linearizability. Naming the specific guarantee you need, rather than demanding 'strong consistency', is what separates a designed system from an over-provisioned one.`}],takeaway:`CAP is about partitions only. PACELC covers the normal case, where the real trade is latency versus consistency. Most 'we need strong consistency' requirements are actually read-your-writes.`},{t:`guess`,setup:`-- Cassandra, replication factor RF = 3, 3 nodes`,sql:`-- scenario A
write with CONSISTENCY ONE      then    read with CONSISTENCY ONE
-- scenario B
write with CONSISTENCY QUORUM   then    read with CONSISTENCY QUORUM
-- scenario C
write with CONSISTENCY ALL      then    read with CONSISTENCY ONE`,out:`A:  W=1, R=1 → 1+1 = 2, not > 3  → may read stale
B:  W=2, R=2 → 2+2 = 4     > 3  → guaranteed fresh
C:  W=3, R=1 → 3+1 = 4     > 3  → guaranteed fresh`,why:"The rule is `W + R > RF`. If the write quorum and the read quorum must overlap by at least one node, that node has the latest value and the read sees it. Scenario B is the standard production choice because it tolerates one node being down on either side. Scenario C makes reads maximally cheap but writes fail if **any** replica is unavailable, which usually trades away more availability than it is worth. The same arithmetic governs DynamoDB, Riak and every quorum-replicated store."},{t:`qa`,q:`What is a read repair and an anti-entropy repair?`,a:"**Read repair** happens on the read path: when a coordinator queries several replicas and finds them disagreeing, it returns the newest value and asynchronously pushes it to the stale replicas. It only fixes data that is actually read. **Anti-entropy repair** is a background process (in Cassandra, `nodetool repair`) that compares Merkle trees between replicas and reconciles everything, including data nobody has read. You need both: read repair keeps hot data consistent cheaply, and scheduled anti-entropy stops cold data from drifting permanently — particularly after a node has been down longer than the hint window."},{t:`qa`,q:`What is a tombstone and why does it cause problems?`,a:"In an eventually consistent store, a delete cannot remove the row immediately — if it did, a replica that was offline during the delete would resurrect the row when it came back. So the delete writes a **tombstone**: a marker saying 'deleted at time T', which propagates like any other write and is only purged after `gc_grace_seconds`. The problems: tombstones consume space, reads must scan past them, and a partition with many thousands of tombstones causes read timeouts. This is why queue-like workloads — insert, read, delete, repeat — are a known anti-pattern in Cassandra."},{t:`qa`,q:`How do you handle conflicting concurrent writes in an AP system?`,a:`Four common strategies. **Last-write-wins** using timestamps — simple, and silently loses data when clocks disagree. **Vector clocks** — detect that two writes were genuinely concurrent and hand the conflict to the application (Riak's approach; correct but pushes complexity outward). **CRDTs** — data types whose merge is mathematically guaranteed to converge, ideal for counters, sets and collaborative text. **Application-level merge** — domain logic decides, as with a shopping cart that unions items rather than choosing one version. The best answer often changes the data model: an append-only log of operations has no conflicts to resolve, because nothing is ever overwritten.`},{t:`qa`,q:`When would you put a relational database behind a NoSQL front end, or vice versa?`,a:`The common and correct shape is relational as the **source of truth** with derived stores in front: Redis for hot reads and counters, Elasticsearch for search, a columnar store for analytics — each fed by change data capture so the relational store remains the single place writes land and invariants are enforced. The reverse (NoSQL as truth, relational as a derived view) shows up when write throughput genuinely exceeds a relational node and the source data is append-only — an event log in Kafka or Cassandra, projected into Postgres for reporting. What you should not do is split the source of truth across both, because then no single store can enforce a cross-entity invariant.`}]}]},se={id:`pipelines`,num:`19`,title:`Queues, Streams & Consistency`,kicker:`The dual-write problem, outbox, idempotency, CDC and sagas`,sections:[{id:`pipe-dualwrite`,title:`The dual-write problem`,blurb:`The moment a system has two stores, the hardest bug in distributed systems appears — and almost every caching, search and event-driven architecture has two stores.`,blocks:[{t:`q`,lvl:`hard`,title:`Write to a database and publish an event`,tag:`the foundational distributed-systems bug`,stmt:"An order service must save an order and publish an `OrderPlaced` event to Kafka. Show why the obvious code is broken and give the correct design.",hint:`There is no transaction spanning the database and the message broker.`,approaches:[{name:`The broken version`,idea:`Two writes, no shared transaction, four possible outcomes.`,sql:`-- what everyone writes first
BEGIN;
INSERT INTO orders (...) VALUES (...);
COMMIT;                                    -- (1)
kafka.publish("OrderPlaced", order);       -- (2)

-- outcomes:
--   1 ✓ 2 ✓   correct
--   1 ✗ 2 ✗   correct (nothing happened)
--   1 ✓ 2 ✗   order exists, NOBODY is told  -> no email, no shipment
--   1 ✗ 2 ✓   event published for an order that does not exist

-- swapping the order does not help; it only changes which failure you get`,why:`The failure is not hypothetical: the process can crash, the broker can be briefly unavailable, or the network can drop the publish after the commit. At a thousand orders a minute this happens weekly. And the two-phase commit that would fix it in theory blocks indefinitely if the coordinator dies mid-protocol, which is why essentially nobody uses XA between a database and a broker.`},{name:`Fix — the outbox pattern`,idea:`Write the event into the same database, in the same transaction. Publish it separately.`,sql:`CREATE TABLE outbox (
  id            BIGINT AUTO_INCREMENT PRIMARY KEY,
  aggregate_id  BIGINT       NOT NULL,
  event_type    VARCHAR(60)  NOT NULL,
  payload       JSON         NOT NULL,
  created_at    TIMESTAMP    DEFAULT CURRENT_TIMESTAMP,
  published_at  TIMESTAMP    NULL,
  KEY ix_unpublished (published_at, id)
);

-- ONE transaction. Atomic. No distributed commit.
START TRANSACTION;
  INSERT INTO orders (id, cust_id, total) VALUES (5521, 991, 84.00);
  INSERT INTO outbox (aggregate_id, event_type, payload)
  VALUES (5521, 'OrderPlaced', JSON_OBJECT('order_id',5521,'total',84.00));
COMMIT;

-- a separate relay publishes and marks done
SELECT id, event_type, payload FROM outbox
WHERE  published_at IS NULL ORDER BY id LIMIT 100
FOR UPDATE SKIP LOCKED;          -- several relay instances can run safely

-- ... publish to Kafka ...
UPDATE outbox SET published_at = NOW() WHERE id IN (...);`,why:"The order and the intent-to-publish commit together or not at all, because they are rows in the same database. The relay can crash, retry, or run in duplicate — the worst case is publishing the same event twice, which is why consumers must be idempotent. That converts an unsolvable atomicity problem into a solved deduplication problem. `FOR UPDATE SKIP LOCKED` lets multiple relay instances share the work without stepping on each other."},{name:`Fix — CDC as the relay`,idea:`Skip the relay process; read the database's own replication log.`,sql:`-- Debezium reads the MySQL binlog / Postgres WAL directly

  orders table ──▶ binlog ──▶ Debezium ──▶ Kafka topic

-- you can publish the outbox table specifically
--   (Debezium has an outbox event router transform)
-- or publish row changes from the domain tables themselves`,note:`The database's own durable log becomes the source of events, so nothing can commit without the event being derivable.`,why:`This removes the polling relay entirely and inherits the log's ordering and durability guarantees. It is the strongest version of the pattern, and it is how most mature event-driven systems are actually built. The cost is operational: Debezium plus Kafka Connect is real infrastructure, replication slots must be monitored (an unconsumed Postgres slot will fill your disk), and schema changes need care.`},{name:`Making consumers idempotent`,idea:`At-least-once delivery is guaranteed; exactly-once processing is your job.`,sql:`-- consumer records what it has already handled, in the SAME
-- transaction as the effect
START TRANSACTION;
  INSERT INTO processed_events (event_id) VALUES (?);   -- UNIQUE key
  -- duplicate delivery -> duplicate key error -> roll back, ack, move on

  INSERT INTO shipments (order_id, ...) VALUES (?, ...);
COMMIT;

-- or design the effect to be naturally idempotent
UPDATE orders SET status = 'shipped' WHERE id = ?;   -- safe to repeat
UPDATE counters SET n = n + 1 WHERE ...;             -- NOT safe to repeat`,why:"'Exactly-once delivery' does not exist across a network — the acknowledgement can always be lost. What exists is at-least-once delivery plus idempotent processing, which produces exactly-once **effects**. The unique constraint on `event_id` is the whole mechanism: the database, not the application, enforces that an event is applied once. Note the asymmetry in the last two lines — setting a value is naturally idempotent, incrementing one is not."}],takeaway:`Never write to two systems and hope. Outbox or CDC makes the event atomic with the data; idempotent consumers make redelivery harmless. Together they are exactly-once effects without exactly-once delivery.`},{t:`q`,lvl:`hard`,title:`A transaction that spans three services`,tag:`sagas · asked at Uber, Amazon, PayPal`,stmt:`Placing an order must reserve inventory, charge a card and create a shipment — each owned by a different service with its own database. Design it.`,approaches:[{name:`Why not two-phase commit`,idea:`It is correct on paper and unacceptable in production.`,sql:`-- 2PC: coordinator asks all participants to PREPARE, then COMMIT
--   ✗ every participant holds locks for the ENTIRE protocol
--   ✗ if the coordinator dies after PREPARE, participants block
--     indefinitely, still holding locks
--   ✗ availability = product of all participants' availability
--   ✗ most modern datastores and brokers do not support XA at all`,why:`The blocking property is the killer: a coordinator failure at the wrong moment leaves rows locked in three services with no automatic resolution, requiring manual intervention. Systems that need cross-service atomicity almost always choose a saga and accept temporary inconsistency instead.`},{name:`The saga`,idea:`A sequence of local transactions, each with a compensating action.`,sql:`FORWARD PATH                    COMPENSATION (if a later step fails)
─────────────────────────────   ──────────────────────────────────────
1. reserve inventory        →   release the reservation
2. charge the card          →   refund the charge
3. create the shipment      →   cancel the shipment
4. mark order confirmed     →   mark order failed

-- each step is a LOCAL transaction in its own service
-- state is tracked explicitly so the saga can resume after a crash

CREATE TABLE order_saga (
  order_id   BIGINT PRIMARY KEY,
  step       ENUM('reserving','charging','shipping','done','compensating','failed'),
  attempts   INT DEFAULT 0,
  updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
);`,why:`There is no rollback across services, only forward compensation — and the two are not equivalent. A refund is not the inverse of a charge: the money moved, the customer saw it, a fee may have been taken. Compensations must be designed as real business operations, not imagined as undo. Persisting the saga state is what lets the flow resume after a crash rather than stranding an order half-processed.`},{name:`Orchestration vs choreography`,idea:`Two ways to run the sequence.`,sql:`-- ORCHESTRATION: a coordinator explicitly drives each step
--   ✓ the flow is readable in one place; easy to debug and change
--   ✓ compensation logic lives together with the forward logic
--   ✗ the orchestrator is a component to build and keep available

-- CHOREOGRAPHY: each service reacts to the previous service's event
--   OrderPlaced -> InventoryReserved -> PaymentCharged -> ShipmentCreated
--   ✓ no central component; services stay decoupled
--   ✗ the flow exists nowhere — you reconstruct it by reading five
--     codebases, and cyclic reactions are easy to create by accident`,why:`Choreography is appealing on a whiteboard and painful at three in the morning. For anything with money in it, orchestration is usually the better answer precisely because the sequence and its compensations are visible in one file. A reasonable rule: choreography for two or three steps and simple flows, orchestration once compensation matters.`},{name:`What the user sees`,idea:`Design the intermediate states into the product, not around them.`,sql:`-- the order is NOT atomic, so do not pretend it is
orders.status:  pending -> confirmed
                        -> failed (with a reason)

-- the UI shows "processing" and updates when the saga completes
-- the customer is emailed on the terminal state, not on step 1

-- semantic lock: the reservation prevents overselling during
-- the window, even though nothing is committed yet`,why:"The mistake is trying to hide the asynchrony behind a synchronous API that blocks until the saga finishes — which reintroduces the coupling you removed and times out under load. Exposing a `pending` state is honest, and it is what every real checkout does. The inventory reservation acts as a semantic lock: it makes the temporary inconsistency invisible in the way that matters, because the stock cannot be sold twice."}],tradeoffs:[],takeaway:"No 2PC. Local transactions plus compensations, explicit persisted saga state, orchestration when money is involved, and a `pending` state exposed in the product."}]},{id:`pipe-cdc`,title:`Change data capture and derived stores`,blocks:[{t:`design`,title:`Keep a search index in sync with the database`,tag:`CDC · asked at Atlassian, Shopify-style`,prompt:`Product data lives in PostgreSQL. Search runs on Elasticsearch. Design the synchronisation so search is never more than a few seconds stale and never silently diverges.`,reqs:[`PostgreSQL remains the source of truth for all writes`,`Search results lag by seconds, not minutes`,`A full rebuild must be possible without downtime`,`Divergence must be detectable, not discovered by a customer`],estimate:`12M products · ~40k updates/day, bursty (bulk catalogue imports)
search: 3k queries/s peak
index size ≈ 12M × 2 KB ≈ 24 GB
CDC volume: trivial at steady state; 2M rows in one bulk import burst`,phases:[{name:`Reject dual writes`,idea:`The first instinct is to write to both stores from the application. It is the dual-write problem again.`,sql:`-- BROKEN
db.save(product)
es.index(product)     -- fails silently -> permanent divergence,
                      --   discovered when a customer cannot find a product

-- and there is no transaction to fix it with`,note:`Naming this before proposing a solution is most of the answer.`},{name:`Read the WAL`,idea:`Let PostgreSQL's own replication log drive the pipeline.`,sql:`  Postgres ──WAL──▶ Debezium ──▶ Kafka topic ──▶ indexer ──▶ Elasticsearch

-- logical replication slot
CREATE PUBLICATION products_pub FOR TABLE products, product_variants;

-- Debezium emits one message per row change:
--   { op: "u", before: {...}, after: {...}, ts_ms: ... }`,note:`Nothing can commit to Postgres without appearing in the WAL, so the pipeline cannot miss a write — which dual writes cannot promise.`},{name:`Handle ordering and idempotency`,idea:`Two updates to the same product must not land out of order.`,sql:`-- partition the Kafka topic by product_id
--   -> all changes to one product are in one partition, strictly ordered

-- the indexer is idempotent via optimistic concurrency in ES
PUT /products/_doc/5521?version=1719849600123&version_type=external
-- ES rejects any write with a version lower than the stored one
-- => replays and out-of-order retries are harmless`,note:`External versioning turns 'at-least-once with possible reordering' into a correct final state.`},{name:`Rebuild without downtime`,idea:`Index to a new name and swap an alias.`,sql:`-- 1. create products_v2 with the new mapping
-- 2. Debezium snapshot mode: replay the whole table into v2,
--    while streaming ongoing changes into it as well
-- 3. verify counts and a sample of documents
-- 4. atomic alias swap
POST /_aliases
{ "actions": [
    { "remove": { "index": "products_v1", "alias": "products" }},
    { "add":    { "index": "products_v2", "alias": "products" }}
]}
-- 5. keep v1 for a day, then delete`,note:"Application code always queries the alias `products`, so a reindex, a mapping change or a rollback is one atomic API call."},{name:`Detect divergence`,idea:`Assume the pipeline will break, and find out before a customer does.`,sql:`-- continuous reconciliation, hourly
--   compare COUNT and a checksum per shard of the key space
SELECT COUNT(*),
       BIT_XOR(CRC32(CONCAT_WS('|', id, updated_at))) AS checksum
FROM   products WHERE id % 64 = ?;   -- compare against the same slice in ES

-- also monitor:
--   consumer lag on the Kafka topic
--   replication slot size in Postgres  (an unconsumed slot fills the disk)
--   indexer error rate and dead-letter queue depth`,note:`The replication slot alarm is the one people forget — a stalled consumer will take down the *primary database* by filling its disk with retained WAL.`}],tradeoffs:[{choice:`CDC over dual writes`,pro:`Cannot miss a write; no distributed transaction; no application change`,con:`Real infrastructure to run — Kafka, Connect, slot monitoring`},{choice:`Partition by entity id`,pro:`Per-entity ordering guaranteed, which is all that is needed`,con:`No global ordering across entities; a hot entity can skew one partition`},{choice:`External versioning in ES`,pro:`Replays and retries become no-ops; the indexer can be at-least-once`,con:`Requires a monotonic version — usually the source timestamp or LSN`},{choice:`Alias swap for rebuilds`,pro:`Zero-downtime mapping changes and instant rollback`,con:`Double the index storage during the transition`}],takeaway:`That you identified dual writes as the flaw before proposing anything, that the pipeline derives from the database's own log, that redelivery is made harmless rather than prevented, and that you planned for divergence detection and a rebuild path.`},{t:`q`,lvl:`medium`,title:`Build a job queue on the database`,tag:`when Kafka is overkill`,stmt:`You need background jobs but do not want to operate a broker yet. Build a correct queue in SQL, and say when you should stop.`,approaches:[{name:`The queue`,idea:"`FOR UPDATE SKIP LOCKED` is what makes this work at all.",sql:`CREATE TABLE jobs (
  id           BIGINT AUTO_INCREMENT PRIMARY KEY,
  kind         VARCHAR(40) NOT NULL,
  payload      JSON        NOT NULL,
  status       ENUM('pending','running','done','failed') DEFAULT 'pending',
  run_after    DATETIME    NOT NULL DEFAULT CURRENT_TIMESTAMP,
  attempts     INT         DEFAULT 0,
  locked_until DATETIME    NULL,
  KEY ix_claim (status, run_after)
);

-- claim: several workers can run this concurrently and never collide
START TRANSACTION;
  SELECT id, kind, payload FROM jobs
  WHERE  status = 'pending' AND run_after <= NOW()
  ORDER  BY run_after, id
  LIMIT  1
  FOR UPDATE SKIP LOCKED;

  UPDATE jobs
  SET    status = 'running', attempts = attempts + 1,
         locked_until = NOW() + INTERVAL 5 MINUTE
  WHERE  id = ?;
COMMIT;`,why:"Without `SKIP LOCKED`, every worker queues behind the first one on the same row and your parallel pool becomes serial. With it, each worker takes the next *unlocked* row, so throughput scales with worker count. This one clause is the difference between a working queue and a mysterious throughput ceiling."},{name:`Retries and stuck jobs`,idea:`A worker that dies mid-job must not strand it forever.`,sql:`-- reclaim jobs whose lease expired (the worker crashed)
UPDATE jobs
SET    status = 'pending', locked_until = NULL
WHERE  status = 'running' AND locked_until < NOW();

-- exponential backoff on failure
UPDATE jobs
SET    status    = IF(attempts >= 5, 'failed', 'pending'),
       run_after = NOW() + INTERVAL POW(2, attempts) MINUTE
WHERE  id = ?;

-- 'failed' is a dead-letter state: alert on it, never silently drop`,why:"The lease (`locked_until`) is what makes crash recovery automatic — no separate liveness protocol is needed, because an expired lease is self-evident. Exponential backoff prevents a permanently failing job from consuming a worker in a tight loop, and the terminal `failed` state must be monitored: a queue that silently discards work is worse than no queue."},{name:`When to stop using it`,idea:`The database queue has a real ceiling and clear symptoms.`,sql:`-- fine up to roughly hundreds to low thousands of jobs/second

-- signs you have outgrown it:
--   the jobs table dominates your database's write I/O
--   the claim query shows up in the slow log
--   heavy churn (insert + delete) causes index bloat and vacuum pressure
--   you need fan-out to many independent consumers
--   you need replay, retention, or ordered partitioned streams

-- then: SQS / RabbitMQ for work queues, Kafka for event streams`,why:"A database-backed queue is genuinely the right first choice — one fewer system to operate, transactional with your data, and trivially debuggable with `SELECT`. The mistake is at both extremes: adding Kafka for fifty jobs a minute, or keeping the SQL queue when it is generating most of your database's write load. The insert-and-delete churn is the specific technical reason it eventually stops scaling."}],takeaway:"`FOR UPDATE SKIP LOCKED` plus a lease column plus backoff gives a correct queue in about thirty lines. Move to a broker when queue churn dominates your database I/O, not before."},{t:`qa`,q:`What is the difference between a message queue and an event stream?`,a:`A **queue** delivers each message to one consumer and deletes it once acknowledged — the message is a unit of work, and the queue is a buffer. A **stream** is an append-only log that many independent consumer groups read at their own offsets, and messages persist for a retention period regardless of consumption — the message is a fact, and the log is a record. Queues suit 'do this task'; streams suit 'this happened, and several systems care'. Streams also allow replay, which is what makes rebuilding a derived store possible; a queue cannot do that because the messages are gone.`},{t:`qa`,q:`What is event sourcing and when is it worth it?`,a:`Instead of storing current state, you store the ordered sequence of events that produced it, and derive state by replay. It gives you a perfect audit log, the ability to reconstruct past state, and the ability to build new read models retroactively from history. The costs are substantial: every query needs a projection, schema evolution means handling old event versions forever, replay time grows without snapshots, and deleting personal data conflicts with an immutable log. It is worth it where the history *is* the product — ledgers, trading, compliance, collaborative editing. It is usually not worth it for a CRUD application, and 'we might want an audit trail' is better served by an audit table.`},{t:`qa`,q:`What is CQRS and does it require event sourcing?`,a:`Command Query Responsibility Segregation separates the write model from the read model — writes go through a normalised transactional store, reads are served from denormalised projections shaped for specific queries. It does **not** require event sourcing, though the two are often introduced together: a read replica with a materialised summary table is already a mild form of CQRS. The benefit is that reads and writes can be optimised and scaled independently; the cost is that the read side is eventually consistent, which every consumer of it must handle.`},{t:`qa`,q:`How do you backfill a new consumer without overwhelming the system?`,a:`Read from the earliest retained offset with a rate limit, and keep the backfill separate from the live consumer group so live processing is not delayed. If the stream's retention does not reach far enough back, take a consistent snapshot of the source table, load it, and then start consuming from the log position captured at snapshot time — this is exactly what Debezium's snapshot mode does, and getting the position right is what prevents gaps or duplicates at the boundary. Make the consumer idempotent first, so the overlap between snapshot and stream is harmless rather than something you have to reason about precisely.`}]}]},ce={id:`casestudies`,num:`20`,title:`System Design Case Studies`,kicker:`Twelve full designs — schema, capacity, caching, sharding and the trade-offs named out loud`,sections:[{id:`cs-method`,title:`How to run the 45 minutes`,blurb:`The structure below is what separates candidates who design from candidates who list technologies.`,blocks:[{t:`table`,head:[`Minutes`,`Phase`,`What you are actually doing`],rows:[[`0–5`,`**Clarify**`,`Functional scope, non-functional targets, what is explicitly out of scope. Write them down where the interviewer can see.`],[`5–10`,`**Estimate**`,`QPS, storage, read:write ratio. This decides whether the answer is one Postgres box or forty services.`],[`10–15`,`**Data model**`,`Entities, keys, access patterns. In a database round this is the heart of it.`],[`15–30`,`**Design the path**`,`Write path, read path, then caching, then indexes. One layer at a time.`],[`30–40`,`**Scale and fail**`,`Where it breaks first, hot spots, what happens when each component dies.`],[`40–45`,`**Trade-offs**`,`Say what you gave up. Unprompted.`]]},{t:`note`,k:`ask`,x:`The most common failure is jumping to Kafka and microservices before estimating anything. Do the arithmetic first — at 500 writes per second the answer is one relational database with a replica, and saying so confidently scores far better than an unnecessary distributed architecture.`},{t:`p`,x:`Numbers worth memorising, because they let you finish an estimate in ninety seconds: a well-indexed relational primary handles roughly **5,000–20,000 writes/second** and tens of thousands of reads; Redis handles **100,000+ operations/second** per node; one SSD gives about **500 MB/s** and sub-millisecond random reads; cross-region round trips are **50–150 ms**; a day is **86,400 seconds**, so 1M events/day is about **12/second** and 1B/day is about **12,000/second**.`}]},{id:`cs-read`,title:`Read-heavy systems`,blocks:[{t:`design`,title:`URL shortener`,tag:`the warm-up · asked at almost every company`,prompt:`Design a URL shortener: create a short code for a long URL, redirect on lookup, and report click counts.`,reqs:[`Create a short URL; optional custom alias; optional expiry`,`Redirect with p99 under 50 ms`,`Click analytics, which may lag by minutes`,`Read:write ratio around 500:1`],estimate:`writes: 100M new URLs/month  ≈ 40/s  (peak ~200/s)
reads:  50B redirects/month  ≈ 20k/s (peak ~100k/s)
storage: 100M/mo × 5 yr × ~500 B ≈ 3 TB
key space: 7 chars of [A-Za-z0-9] = 62^7 ≈ 3.5 trillion  → plenty`,phases:[{name:`Generate the code`,idea:`Three options, and the counter-based one is usually right.`,sql:`-- OPTION A: hash the URL, take 7 chars of base62
--   ✗ collisions must be detected and retried
--   ✓ identical URLs collapse to one code (sometimes desirable)

-- OPTION B: random 7 chars
--   ✗ must check for collisions on every insert (a read before write)
--   ✓ unguessable

-- OPTION C: monotonic counter, base62-encoded  ← usually best
--   ✓ no collision check at all
--   ✓ short codes for early URLs
--   ✗ sequential codes are enumerable
--   -> each app node takes a BLOCK of 10,000 ids from a central
--      allocator, then hands them out locally: no per-insert coordination

CREATE TABLE id_blocks (name VARCHAR(20) PRIMARY KEY, next_block BIGINT);
UPDATE id_blocks SET next_block = next_block + 1 WHERE name = 'url';`,note:`Block allocation removes a network round trip from the write path while keeping ids globally unique.`},{name:`Schema`,idea:`One narrow table, clustered on the lookup key.`,sql:`CREATE TABLE urls (
  code        VARCHAR(10)  NOT NULL,
  long_url    VARCHAR(2048) NOT NULL,
  user_id     BIGINT       NULL,
  created_at  TIMESTAMP    NOT NULL DEFAULT CURRENT_TIMESTAMP,
  expires_at  TIMESTAMP    NULL,
  PRIMARY KEY (code)                -- clustered on the read key
) ENGINE = InnoDB;

-- clicks are NOT counted here: a counter column on this row would
-- turn every redirect into a write and serialise on hot links`,note:"Making `code` the primary key means the redirect is a single clustered-index lookup — no secondary index, no bookmark lookup."},{name:`The read path`,idea:`This is a caching problem, not a database problem.`,sql:`GET /aB3xK9q
  1. Redis GET url:aB3xK9q          -- ~0.2 ms, ~95% hit rate
  2. on miss: SELECT long_url FROM urls WHERE code = ?
  3. SET url:aB3xK9q <long> EX 86400
  4. 301 or 302 redirect

-- 301 permanent: browsers cache it, so you never see the click again
--    -> cheapest, but analytics become useless
-- 302 temporary: every click reaches you
--    -> choose 302 if click analytics are a product feature`,note:`Access is extremely Zipfian — a small number of links carry most traffic — so a modest cache absorbs almost everything. The 301/302 choice is a product decision that dominates the traffic estimate.`},{name:`Click analytics`,idea:`Never increment a row per click.`,sql:`-- BAD: UPDATE urls SET clicks = clicks + 1 WHERE code = ?
--   20k writes/s onto rows that are already hot -> lock contention

-- GOOD: increment in Redis, flush periodically
INCR clicks:aB3xK9q
-- a job flushes counters into the analytics store every 60 s

-- BETTER for real analytics: emit an event
--   redirect -> Kafka -> ClickHouse / warehouse
--   gives you geography, referrer, device, time series, retention`,note:`Separating the click stream from the URL row keeps the redirect path a pure read, which is what makes 100k/s achievable on modest hardware.`},{name:`Scale and fail`,idea:`Where it breaks, in order.`,sql:`-- storage: 3 TB is beyond one comfortable node
--   -> shard by hash(code); every lookup knows its code, so
--      every query is single-shard. No scatter-gather ever.

-- Redis down: full 20k/s hits the database
--   -> the DB must be sized to survive it, or shed load
--   -> primary key lookups at 20k/s is achievable across replicas

-- expiry: a background job deletes expired rows in batches;
--   the cache TTL bounds how long an expired link still resolves

-- abuse: rate limit creation per user/IP; scan submitted URLs
--   against a malware blocklist before issuing a code`,note:`Hash-sharding on the code is unusually clean here because the read key is always known — most systems do not get that luxury.`}],tradeoffs:[{choice:`Counter ids over random`,pro:`No collision checks; no read before write`,con:`Codes are enumerable — add a hash salt if that matters`},{choice:`302 over 301`,pro:`Every click is observable, so analytics work`,con:`Roughly 10× the redirect traffic to serve`},{choice:`Clicks in Redis, not in the row`,pro:`Redirect stays a pure read; no hot-row contention`,con:`Counts are approximate and can be lost on a Redis failure`},{choice:`Hash sharding on code`,pro:`Every query is single-shard; perfectly even distribution`,con:`No range scans, and 'all URLs by this user' needs a secondary index table`}],takeaway:`That you recognised this as a cache-and-key-generation problem rather than a database problem, that you refused to put a click counter on the hot row, and that you connected the 301/302 choice to the capacity estimate.`},{t:`design`,title:`News feed / timeline`,tag:`fan-out · asked at Meta, Twitter-style, LinkedIn`,prompt:`Design the home timeline for a social product: users follow others and see a merged, ranked feed of recent posts.`,reqs:[`Feed loads in under 200 ms at p99`,`New posts appear within seconds`,`Some accounts have tens of millions of followers`,`Read:write ratio is roughly 100:1`],estimate:`500M users · 200M daily active
posts:  100M/day  ≈ 1,200/s  (peak ~5,000/s)
reads:  200M DAU × 15 feed loads = 3B/day ≈ 35k/s (peak ~150k/s)
median following: 200 · p99: 5,000
celebrity: 50M followers — this single number decides the design`,phases:[{name:`Fan-out on read`,idea:`Store posts once; assemble the feed at request time.`,sql:`SELECT p.*
FROM   posts p
JOIN   follows f ON f.followee_id = p.author_id
WHERE  f.follower_id = ?
  AND  p.created_at > NOW() - INTERVAL 7 DAY
ORDER  BY p.created_at DESC
LIMIT  50;

--  ✓ writes are trivial: one row per post
--  ✓ no storage amplification
--  ✗ every feed load queries N authors and merges — expensive
--  ✗ p99 users following 5,000 accounts have terrible latency`,note:`Correct, simple, and it does not meet a 200 ms p99 at this scale for users who follow many accounts.`},{name:`Fan-out on write`,idea:`Precompute every follower's feed at post time.`,sql:`-- on post: push the id into each follower's materialised timeline
for follower in followers(author):
    redis.LPUSH("feed:" + follower, post_id)
    redis.LTRIM("feed:" + follower, 0, 799)     -- keep ~800 entries

-- read: one Redis range read, then hydrate the post bodies
LRANGE feed:991 0 49        -- ~0.3 ms

--  ✓ reads are O(1) and trivially cacheable
--  ✗ a post by someone with 50M followers = 50M writes
--  ✗ storage amplification: each post id stored once per follower`,note:`Reads become nearly free, which is the right trade at a 100:1 ratio — until a celebrity posts.`},{name:`The hybrid — the actual answer`,idea:`Fan out ordinary accounts on write; merge celebrity posts on read.`,sql:`-- classify authors by follower count
--   normal (< ~50k followers)  -> fan out on write
--   celebrity (>= 50k)         -> do NOT fan out

-- feed read:
1. LRANGE feed:991 0 49                       -- precomputed portion
2. SELECT * FROM posts
   WHERE author_id IN (celebrities I follow)  -- usually a handful
     AND created_at > NOW() - INTERVAL 1 DAY
3. merge the two lists, rank, return

-- writes are bounded: no post ever costs 50M writes
-- reads add one small query for a short celebrity list`,note:`This is what Twitter and Facebook both converged on. The threshold is tunable and the two paths degrade independently.`},{name:`Storage layout`,idea:`Redis for the hot window, a durable store behind it.`,sql:`-- hot: last ~800 post ids per active user, in Redis lists
--      only for users active in the last 30 days
--      inactive users' feeds are rebuilt lazily on next login

-- durable: posts in a sharded relational store or Cassandra,
--          partitioned by (author_id, created_at)

CREATE TABLE posts (
  author_id  BIGINT,
  created_at DATETIME,
  post_id    BIGINT,
  body       TEXT,
  PRIMARY KEY (author_id, created_at DESC, post_id)
);

-- follows: BOTH directions are needed and both are hot
follows_by_follower (follower_id, followee_id)   -- "who do I follow"
follows_by_followee (followee_id, follower_id)   -- "who to fan out to"`,note:`Only materialising feeds for recently active users cuts the write amplification by roughly the inactive fraction — often 60% or more.`},{name:`Ranking and consistency`,idea:`Ranking changes the caching story completely.`,sql:`-- chronological: the precomputed list IS the feed. Simple.

-- ranked: the list is a CANDIDATE SET, scored per request
--   score = f(recency, affinity, engagement, ...)
--   -> cannot cache the final feed, only the candidates
--   -> add a scoring service between Redis and the response

-- consistency: a feed is eventually consistent BY DESIGN
--   your own post must appear immediately -> insert it into your
--   own feed synchronously, fan out to others asynchronously`,note:`Inserting into your own timeline synchronously is the read-your-writes fix that makes an asynchronous system feel instant to the author.`}],tradeoffs:[{choice:`Hybrid fan-out`,pro:`Bounded write cost and near-constant read cost`,con:`Two code paths, a threshold to tune, and merge logic to maintain`},{choice:`Feeds only for active users`,pro:`Cuts write amplification and Redis memory substantially`,con:`A returning user's first load is slow while the feed is rebuilt`},{choice:`Store post ids, not post bodies`,pro:`Feed lists stay tiny; edits and deletes are reflected automatically`,con:`A hydration step per read — mitigated by caching post bodies too`},{choice:`Eventual consistency for others' feeds`,pro:`Write path stays fast and does not block on fan-out`,con:`A post can take seconds to appear for followers — acceptable, and must be stated`}],takeaway:`That you named both pure strategies, identified the celebrity case as the reason neither works alone, and produced the hybrid — plus the synchronous self-insert for read-your-writes.`},{t:`design`,title:`Real-time leaderboard`,tag:`Redis sorted sets · gaming, fintech, social`,prompt:`Design a leaderboard for 50 million players: global top 100, a player's own rank, and rank within their region and friend group.`,reqs:[`Score updates apply within a second`,`'My rank' must be exact, not approximate`,`Top 100 served at very high read volume`,`Daily, weekly and all-time boards`],estimate:`50M players · 5M daily active
score updates: 10M/day ≈ 120/s (peak ~2,000/s during events)
reads: top-100 ~50k/s · my-rank ~5k/s
Redis memory: 50M members × ~80 B ≈ 4 GB per board`,phases:[{name:`Why not SQL`,idea:`The rank query is the problem, not the storage.`,sql:`-- naive
SELECT COUNT(*) + 1 FROM scores WHERE score > (
  SELECT score FROM scores WHERE user_id = 991
);
-- counts up to 50M rows per rank request

-- maintaining a rank column instead:
--   every score change reorders everyone below it
--   -> unbounded write amplification`,note:`Ranking is inherently a global-order problem, which is exactly what a plain B-tree index does not give you cheaply.`},{name:`Redis sorted sets`,idea:`One data structure answers every required query in O(log N).`,sql:`ZADD    lb:global 4820 "user:991"          -- set score
ZINCRBY lb:global 50   "user:991"          -- atomic increment

ZREVRANGE lb:global 0 99 WITHSCORES        -- top 100      O(log N + 100)
ZREVRANK  lb:global "user:991"             -- my rank      O(log N)
ZSCORE    lb:global "user:991"             -- my score     O(1)

-- players around me — the view users actually want
rank = ZREVRANK lb:global "user:991"
ZREVRANGE lb:global (rank-5) (rank+5) WITHSCORES`,note:`'Show me my neighbours' falls out for free, and it is the screen players look at most.`},{name:`Segmented boards`,idea:`Region, friends and time windows are all just more sorted sets.`,sql:`lb:global
lb:region:eu-west
lb:daily:2024-06-14        EXPIRE 172800     -- self-cleaning
lb:weekly:2024-W24         EXPIRE 1209600

-- friends leaderboard, computed on demand
ZINTERSTORE tmp:991 2 lb:global friends:991 WEIGHTS 1 0
ZREVRANGE   tmp:991 0 19 WITHSCORES
DEL         tmp:991

-- a score update writes to several boards; pipeline them
MULTI
  ZINCRBY lb:global          50 "user:991"
  ZINCRBY lb:region:eu-west  50 "user:991"
  ZINCRBY lb:daily:2024-06-14 50 "user:991"
EXEC`,note:`Time-windowed boards with a TTL need no cleanup job at all — the window expires itself.`},{name:`Durability and ties`,idea:`Redis is the index; something else must be the truth.`,sql:`-- source of truth: relational or an append-only score-events table
--   Redis is a derived structure, rebuildable by replay

INSERT INTO score_events (user_id, delta, reason, created_at) VALUES (...);
-- rebuild: ZADD from a SUM(delta) GROUP BY user_id scan

-- ties: sorted sets order equal scores lexicographically by member,
-- which is arbitrary. To break ties by "who got there first":
--   composite score = score * 1e10 + (MAX_TS - achieved_at)
--   -> earlier achievement wins at equal score, in one float`,note:`The composite-score trick encodes a secondary sort key into the single float a sorted set allows.`},{name:`Scale limits`,idea:`50M members in one key is fine; 500M is not.`,sql:`-- one sorted set: ~4 GB at 50M members. Comfortable.

-- beyond a single node's memory:
--   shard by score BAND, not by user
--   lb:band:0-999, lb:band:1000-9999, ...
--   top-N reads only the highest band
