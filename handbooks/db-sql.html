--   my-rank = rank within my band + total count of all higher bands
--     (band counts maintained as counters)

-- the hot-key problem applies: top-100 at 50k/s is ONE key
--   -> cache the top 100 in-process with a 1-2 s TTL`,note:`The top-100 response is identical for every caller, so a one-second local cache removes essentially all of that read load.`}],tradeoffs:[{choice:`Redis sorted set as the index`,pro:`Every required query is O(log N) with no bespoke code`,con:`Memory-resident and derived — needs a durable source and a rebuild path`},{choice:`A separate key per segment`,pro:`Region, friend and time boards are trivial and independently expiring`,con:`One update fans out to several keys; use a pipeline or transaction`},{choice:`Composite score for ties`,pro:`Deterministic tie-break with no second lookup`,con:`Precision limits; the encoding must be documented or it looks like a bug`},{choice:`Local cache for the top 100`,pro:`Removes the hot key almost entirely`,con:`Up to a couple of seconds of staleness on the most visible screen`}],takeaway:`That you reached for the sorted set immediately and could state its complexities, that you kept a durable source of truth behind it, and that you spotted the top-100 hot key.`}]},{id:`cs-write`,title:`Transactional and write-heavy systems`,blocks:[{t:`design`,title:`Ticket booking without double-selling`,tag:`concurrency · asked at BookMyShow, Ticketmaster-style, Uber`,prompt:`Design seat booking for events. A seat must never be sold twice, and 50,000 users may hit one popular event simultaneously.`,reqs:[`A seat is sold exactly once — this is absolute`,`Users get a temporary hold while they pay`,`Abandoned holds are released automatically`,`Handle a thundering herd at on-sale time`],estimate:`10k events · up to 100k seats each
normal: ~500 bookings/s
on-sale spike: 50,000 concurrent users on ONE event
  -> the contention is on a few thousand rows, not on total volume`,phases:[{name:`State the invariant`,idea:`Everything follows from one rule the database must enforce.`,sql:`CREATE TABLE seats (
  event_id   BIGINT NOT NULL,
  seat_no    VARCHAR(10) NOT NULL,
  status     ENUM('free','held','sold') NOT NULL DEFAULT 'free',
  held_by    BIGINT NULL,
  held_until DATETIME NULL,
  booking_id BIGINT NULL,
  version    INT NOT NULL DEFAULT 0,
  PRIMARY KEY (event_id, seat_no),
  KEY ix_free (event_id, status)
);

-- the invariant: a seat transitions free -> held -> sold, never
-- backwards from sold, and only one actor may perform each transition`,note:`Writing the invariant down first is what stops the design drifting into eventual consistency where it cannot go.`},{name:`Hold a seat atomically`,idea:`Conditional update. Never check-then-act.`,sql:`-- WRONG: two statements, and a race between them
SELECT status FROM seats WHERE event_id=? AND seat_no=?;   -- 'free'
UPDATE seats SET status='held' WHERE event_id=? AND seat_no=?;
-- two users both read 'free' and both write 'held'

-- RIGHT: the condition is IN the update
UPDATE seats
SET    status = 'held', held_by = ?, held_until = NOW() + INTERVAL 8 MINUTE,
       version = version + 1
WHERE  event_id = ? AND seat_no = ?
  AND (status = 'free'
       OR (status = 'held' AND held_until < NOW()));   -- reclaim expired

-- ROW_COUNT() = 1 -> you hold it.  0 -> someone else does.`,note:`One statement, evaluated atomically by the database. This is the entire correctness argument, and it needs no application lock.`},{name:`Release expired holds`,idea:`The reclaim is in the WHERE clause, so no sweeper is required for correctness.`,sql:`-- lazy: the condition above already reclaims expired holds on demand
--   -> correctness does not depend on a background job running

-- a sweeper still runs, for tidiness and accurate availability counts
UPDATE seats
SET    status = 'free', held_by = NULL, held_until = NULL
WHERE  status = 'held' AND held_until < NOW()
LIMIT  1000;                    -- batched`,note:`Making expiry lazy means a crashed sweeper degrades reporting, not correctness — always prefer that arrangement.`},{name:`Survive the on-sale spike`,idea:`50k users on one event is a hot-row problem; solve it before the database.`,sql:`-- 1. VIRTUAL WAITING ROOM
--    admit N users/second from a Redis queue; the rest see a
--    position and an estimated wait. Load becomes a knob you control.

-- 2. CACHE THE SEAT MAP, do not query it per user
--    the map is identical for everyone; refresh every 1-2 s.
--    Availability shown may be slightly stale — the ATOMIC UPDATE
--    is the authority, the map is only a hint.

-- 3. QUEUE THE WRITES per event
--    a small number of workers per event serialise the holds,
--    so the database sees hundreds of requests, not 50,000

-- 4. For general admission (no seat numbers) use a counter, not rows
UPDATE inventory SET remaining = remaining - ?
WHERE  event_id = ? AND remaining >= ?;`,note:`The database can enforce correctness under any load, but it cannot serve 50,000 concurrent connections. Admission control is the fix, and it is a product feature users understand.`},{name:`Payment and the saga`,idea:`The hold spans an external system with its own failure modes.`,sql:`hold seat (8 min)
  -> redirect to payment provider
     -> success  : UPDATE seats SET status='sold', booking_id=?
                   WHERE ... AND status='held' AND held_by=?
     -> failure  : release the hold
     -> TIMEOUT / no callback  : the hold expires by itself

-- the dangerous case: payment succeeded, callback never arrived,
-- hold expired, seat resold
--   -> hold TTL must exceed the provider's maximum settlement time
--   -> reconcile against the provider and refund if the seat is gone
--   -> idempotency key on the booking so a late callback is a no-op`,note:`The uncomfortable case is worth raising unprompted: you cannot make a payment provider and your database atomic, so you bound the window and reconcile.`}],tradeoffs:[{choice:"Conditional UPDATE over `SELECT FOR UPDATE`",pro:`One round trip, no lock held across application logic`,con:"Losers must retry; you must check `ROW_COUNT()` rather than trusting success"},{choice:`Lazy expiry in the WHERE clause`,pro:`Correctness does not depend on a background job`,con:`Availability counts are slightly stale until the sweeper runs`},{choice:`Virtual waiting room`,pro:`Turns an uncontrollable spike into a rate you choose`,con:`Users wait, and it is visible — but far better than a site that is down`},{choice:`Counter for general admission`,pro:`One row, no per-seat contention, trivially fast`,con:`That one row is now the hot spot — shard it if the event is enormous`}],takeaway:`That you put the invariant in the WHERE clause rather than in application logic, that you made expiry lazy so correctness has no background dependency, and that you separated the correctness problem from the load problem.`},{t:`design`,title:`Payment ledger`,tag:`correctness first · asked at Stripe, PayPal, Goldman, Razorpay`,prompt:`Design a ledger for account balances and transfers. Money must never be created or destroyed, and every balance must be explainable.`,reqs:[`Double-entry: every transfer has equal debits and credits`,`Full audit trail; entries are immutable`,`Balance reads must be fast`,`Exactly-once processing under retries`],estimate:`10M accounts · 5M transfers/day ≈ 60/s (peak ~500/s)
entries: 2 per transfer = 10M rows/day ≈ 3.6B/year
this is NOT a scale problem — it is a correctness problem`,phases:[{name:`Double-entry, append-only`,idea:`Never store a mutable balance as the truth. Store immutable entries.`,sql:`CREATE TABLE transfers (
  id              BIGINT PRIMARY KEY,
  idempotency_key VARCHAR(64) NOT NULL,
  status          ENUM('pending','posted','failed') NOT NULL,
  created_at      TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
  UNIQUE KEY uq_idem (idempotency_key)
);

CREATE TABLE entries (                 -- IMMUTABLE. No UPDATE. No DELETE.
  id          BIGINT PRIMARY KEY,
  transfer_id BIGINT        NOT NULL,
  account_id  BIGINT        NOT NULL,
  direction   ENUM('debit','credit') NOT NULL,
  amount      DECIMAL(19,4) NOT NULL,    -- never FLOAT
  currency    CHAR(3)       NOT NULL,
  created_at  TIMESTAMP     NOT NULL DEFAULT CURRENT_TIMESTAMP,
  KEY ix_account_time (account_id, created_at, id),
  CONSTRAINT ck_positive CHECK (amount > 0)
);

-- the system-wide invariant, checkable at any moment:
SELECT SUM(CASE WHEN direction='debit' THEN amount ELSE -amount END)
FROM   entries;        -- must be exactly 0`,note:`Because entries are immutable and always balanced, that one query proves money was neither created nor destroyed — across the entire system, at any point in time.`},{name:`One transfer, one transaction`,idea:`Both entries and the balance check commit together or not at all.`,sql:`START TRANSACTION;

  INSERT INTO transfers (id, idempotency_key, status)
  VALUES (?, ?, 'pending');           -- duplicate key => already processed

  INSERT INTO entries (transfer_id, account_id, direction, amount, currency)
  VALUES (?, @from, 'debit',  100.00, 'USD'),
         (?, @to,   'credit', 100.00, 'USD');

  -- enforce sufficient funds against the MATERIALISED balance
  UPDATE balances SET amount = amount - 100.00, version = version + 1
  WHERE  account_id = @from AND amount >= 100.00;
  -- ROW_COUNT() = 0  ->  insufficient funds  ->  ROLLBACK

  UPDATE balances SET amount = amount + 100.00 WHERE account_id = @to;

  UPDATE transfers SET status = 'posted' WHERE id = ?;

COMMIT;`,note:`The unique idempotency key makes a retried request fail on insert rather than transfer twice — the database enforces exactly-once, not the application.`},{name:`Balances: derived but materialised`,idea:`Summing 3.6 billion entries per read is not viable, so keep a checked cache.`,sql:`CREATE TABLE balances (
  account_id     BIGINT PRIMARY KEY,
  amount         DECIMAL(19,4) NOT NULL DEFAULT 0,
  last_entry_id  BIGINT NOT NULL DEFAULT 0,
  version        BIGINT NOT NULL DEFAULT 0
);

-- reconciliation job, continuously:
SELECT account_id,
       SUM(CASE WHEN direction='credit' THEN amount ELSE -amount END) AS truth
FROM   entries
WHERE  account_id IN (...)
GROUP  BY account_id;
-- compare against balances.amount; ANY mismatch is a P1 alert

-- snapshots keep reconciliation cheap as history grows
CREATE TABLE balance_snapshots (
  account_id BIGINT, as_of_entry_id BIGINT, amount DECIMAL(19,4),
  PRIMARY KEY (account_id, as_of_entry_id)
);`,note:`The balance is a cache with a proof: entries are authoritative, and reconciliation continuously demonstrates the cache still matches.`},{name:`Deadlocks and hot accounts`,idea:`Two things reliably go wrong under concurrency.`,sql:`-- DEADLOCK: A->B and B->A concurrently lock in opposite orders
--   fix: always lock accounts in a deterministic order
UPDATE balances SET ... WHERE account_id = LEAST(@from, @to);
UPDATE balances SET ... WHERE account_id = GREATEST(@from, @to);

-- HOT ACCOUNT: a merchant settlement account receives 1000 credits/s
--   -> every transfer serialises on that one row
--   fix: shard the balance row
CREATE TABLE balance_shards (
  account_id BIGINT, shard SMALLINT, amount DECIMAL(19,4),
  PRIMARY KEY (account_id, shard)
);
-- credits go to a random shard; the balance is SUM over shards
-- debits need care: check the total, then draw from shards in order`,note:`Deterministic lock ordering removes an entire class of intermittent production failure for the cost of two functions.`},{name:`What you refuse to do`,idea:`Say these out loud; they are the point of the question.`,sql:`-- ✗ FLOAT for money           -> DECIMAL(19,4) or integer minor units
-- ✗ UPDATE or DELETE an entry -> corrections are new REVERSING entries
-- ✗ eventual consistency on the debit path -> overdrafts
-- ✗ cross-currency in one entry pair -> two transfers + an FX position
-- ✗ deriving balance on the fly at read time -> unaffordable at scale
-- ✗ trusting the application to dedupe -> the UNIQUE constraint does it`,note:`A ledger is one of the few systems where the correct answer is 'a single relational database, carefully used' rather than a distributed architecture.`}],tradeoffs:[{choice:`Append-only entries`,pro:`Complete audit trail; the zero-sum invariant is provable at any time`,con:`Table grows forever; needs snapshots and archival by period`},{choice:`Materialised balances`,pro:`O(1) balance reads instead of scanning history`,con:`A derived value that can drift — mandates continuous reconciliation`},{choice:`Idempotency key with a unique index`,pro:`The database enforces exactly-once; retries are safe by construction`,con:`Callers must generate and reuse a stable key, which must be documented`},{choice:`Sharded balance rows for hot accounts`,pro:`Removes serialisation on high-volume merchant accounts`,con:`Debits become materially more complex; apply only where measured`}],takeaway:`That you chose double-entry and immutability unprompted, put the sufficient-funds check inside the UPDATE, treated the balance as a reconciled cache rather than the truth, and named DECIMAL over FLOAT without being asked.`},{t:`design`,title:`E-commerce inventory and checkout`,tag:`asked at Amazon, Flipkart, Shopify-style`,prompt:`Design inventory and checkout so a flash sale of 1,000 units cannot oversell, while the product page serves 100,000 requests per second.`,reqs:[`Never oversell; overselling is a refund and a lost customer`,`Product page must stay fast during the sale`,`Cart reservations expire if unpaid`,`Inventory is shared across warehouses`],estimate:`1M SKUs · 500k orders/day ≈ 6/s normal
flash sale: 100k product-page rps, ~20k add-to-cart attempts
             for 1,000 units — 95% of requests MUST fail fast`,phases:[{name:`Separate display from truth`,idea:`Two different consistency requirements pretending to be one number.`,sql:`-- DISPLAY stock ("12 left"): cached, approximate, refreshed every few
--   seconds. Nobody is harmed if it is briefly wrong.

-- AUTHORITATIVE stock: checked only at reservation, atomically.

-- the failure mode to avoid is querying the authoritative row
-- 100,000 times per second to render a page`,note:`Most oversell incidents come from treating the cached display number as the decision, or from making the decision path carry page-view load.`},{name:`Reserve atomically`,idea:`The same conditional-update pattern as ticketing.`,sql:`CREATE TABLE inventory (
  sku        VARCHAR(40) PRIMARY KEY,
  on_hand    INT NOT NULL,
  reserved   INT NOT NULL DEFAULT 0,
  CHECK (on_hand >= reserved AND reserved >= 0)
);

-- reserve: one statement, condition included
UPDATE inventory
SET    reserved = reserved + ?
WHERE  sku = ? AND on_hand - reserved >= ?;
-- ROW_COUNT() = 0  ->  out of stock, tell the user immediately

CREATE TABLE reservations (
  id         BIGINT PRIMARY KEY,
  cart_id    BIGINT NOT NULL,
  sku        VARCHAR(40) NOT NULL,
  qty        INT NOT NULL,
  expires_at DATETIME NOT NULL,
  KEY ix_expiry (expires_at)
);`,note:"Separating `on_hand` from `reserved` means a reservation never destroys stock — an expired reservation simply decrements `reserved` back."},{name:`Absorb the flash sale in Redis`,idea:`Fail 95% of requests before they reach the database.`,sql:`-- pre-load the sale quantity into Redis
SET sale:sku123:remaining 1000

-- atomic decrement; negative means we are out
remaining = redis.DECRBY("sale:sku123:remaining", qty)
if remaining < 0:
    redis.INCRBY("sale:sku123:remaining", qty)   -- give it back
    return "sold out"                            -- ~0.2 ms, no DB touched

-- winners (about 1,000 of them) proceed to the durable reservation
-- so the database sees 1,000 writes, not 20,000

-- Redis is a GATE, not the source of truth: the database
-- conditional UPDATE still runs and still cannot oversell`,note:`Redis absorbs the herd and the database keeps the guarantee. If Redis dies, you fall back to the database path — slower, still correct.`},{name:`Release and reconcile`,idea:`Expiry and multi-warehouse allocation.`,sql:`-- release expired reservations, batched
UPDATE inventory i
JOIN   reservations r ON r.sku = i.sku
SET    i.reserved = i.reserved - r.qty
WHERE  r.expires_at < NOW()
LIMIT  1000;
DELETE FROM reservations WHERE expires_at < NOW() LIMIT 1000;

-- multi-warehouse: reserve globally first, allocate later
--   global availability = SUM(on_hand - reserved) across warehouses
--   allocation to a specific warehouse happens at fulfilment,
--   optimising for distance — this keeps checkout single-row

-- physical reality drifts: cycle counts adjust on_hand and are
-- recorded as explicit adjustment events, never silent edits`,note:`Reserving globally and allocating at fulfilment keeps the hot checkout path touching one row per SKU instead of one per warehouse.`}],tradeoffs:[{choice:`Cached display stock`,pro:`Product page scales without touching the authoritative row`,con:`Users can see 'in stock' and still fail at checkout — design the message for it`},{choice:`Redis gate in front of the DB`,pro:`Rejects the losing 95% in under a millisecond`,con:`Another component in the critical path; needs a correct fallback when it is down`},{choice:"`reserved` separate from `on_hand`",pro:`Expiry is a simple decrement; no stock is ever lost`,con:`Two numbers to keep consistent, and a sweeper to operate`},{choice:`Global reserve, late allocation`,pro:`Checkout stays a single-row update`,con:`A reservation can occasionally not be fulfillable from any single warehouse`}],takeaway:`That you split display stock from authoritative stock, used Redis as a load gate rather than as the source of truth, and kept the oversell guarantee in a single conditional UPDATE.`}]},{id:`cs-realtime`,title:`Real-time and messaging systems`,blocks:[{t:`design`,title:`Chat / messaging`,tag:`asked at Meta, Slack, WhatsApp-style`,prompt:`Design a messaging system: one-to-one and group chats, delivery and read receipts, message history, and online presence.`,reqs:[`Message delivered to online recipients in under 500 ms`,`Full history, searchable, retained indefinitely`,`Group chats up to 1,000 members`,`Delivered and read receipts per recipient`],estimate:`100M users · 20M concurrent connections
messages: 10B/day ≈ 120k/s (peak ~400k/s)
storage: 10B × ~300 B ≈ 3 TB/day — write-dominated
fan-out to a 1,000-member group = 1,000 receipt rows per message`,phases:[{name:`Connections`,idea:`Persistent connections, and the routing problem they create.`,sql:`WebSocket, not polling: 20M connections × 1 poll/s would be 20M rps
of mostly empty responses.

  client ──WS──▶ gateway node ──▶ message service ──▶ store
                      ▲
              which gateway holds user 991?

-- a presence/routing registry in Redis
SET   presence:991 "gw-17" EX 60        -- heartbeat refreshes it
GET   presence:991                      -- where to deliver

-- offline recipients: persist and deliver on reconnect, plus a push
-- notification through APNs / FCM`,note:`Gateways hold connections and nothing else, so they can be scaled and restarted independently of the message logic.`},{name:`Storage model`,idea:`Partition by conversation and bucket by time — an unbounded partition is the failure mode.`,sql:`-- Cassandra-style, or a sharded relational equivalent
CREATE TABLE messages_by_conversation (
  conversation_id uuid,
  bucket          int,        -- yyyymm: caps partition size
  sent_at         timestamp,
  message_id      timeuuid,   -- monotonic, gives ordering AND uniqueness
  sender_id       uuid,
  body            text,
  PRIMARY KEY ((conversation_id, bucket), sent_at, message_id)
) WITH CLUSTERING ORDER BY (sent_at DESC, message_id DESC);

-- conversation list per user, ordered by recency
CREATE TABLE conversations_by_user (
  user_id uuid, last_message_at timestamp, conversation_id uuid,
  peer_name text, last_preview text, unread_count int,
  PRIMARY KEY ((user_id), last_message_at, conversation_id)
) WITH CLUSTERING ORDER BY (last_message_at DESC);`,note:`Clustering by time descending means "last 50 messages" is a sequential read of the front of the partition — no sort at query time.`},{name:`Ordering and idempotency`,idea:`Clocks disagree, and clients retry.`,sql:`-- server-assigned sequence per conversation is the ordering authority,
-- NOT the client clock
INCR conv:seq:<conversation_id>        -- monotonic within a conversation

-- client sends a client_msg_id; the server dedupes on it
UNIQUE KEY (conversation_id, client_msg_id)
--   -> a retried send after a lost ack is a no-op, not a duplicate

-- the client shows: sending -> sent -> delivered -> read
-- each is a distinct state, driven by a distinct acknowledgement`,note:`Per-conversation sequence numbers give a total order where it matters without needing globally synchronised clocks.`},{name:`Receipts without write amplification`,idea:`Per-recipient receipts are the hidden scaling problem.`,sql:`-- naive: one row per (message, recipient)
--   a 1,000-member group × 10B messages/day = catastrophic

-- 1:1 chats: store two small columns on the message. Cheap.

-- groups: store a per-user HIGH-WATER MARK instead of per-message rows
CREATE TABLE read_state (
  conversation_id uuid, user_id uuid,
  last_read_seq   bigint,
  PRIMARY KEY ((conversation_id), user_id)
);
-- "read by 14 people" = count of members whose last_read_seq >= this seq
-- one row per member per conversation, not per message`,note:`The high-water mark turns O(messages × members) into O(members), which is the difference between feasible and not.`},{name:`Search and failure`,idea:`History search is a separate store; delivery must survive a gateway dying.`,sql:`-- search: CDC from the message store into Elasticsearch,
--   partitioned per user for privacy scoping. Not the source of truth.

-- gateway dies with 500k connections:
--   clients reconnect (jittered backoff) and are routed elsewhere
--   presence keys expire in ~60 s and self-heal
--   on reconnect the client sends its last known seq and
--     pulls everything after it -> no message is lost, only delayed

-- media: never through the message path. Upload to object storage,
--   send the URL in the message.`,note:`"Send me everything after sequence N" makes reconnection a simple, idempotent catch-up rather than a delivery-guarantee problem.`}],tradeoffs:[{choice:`WebSocket over polling`,pro:`Sub-second delivery, far less wasted traffic`,con:`Stateful gateways, connection routing, and reconnection storms to handle`},{choice:`Bucketed conversation partitions`,pro:`Bounded partitions; recent messages are a sequential read`,con:`Reads crossing a bucket boundary need two queries`},{choice:`High-water-mark receipts`,pro:`O(members) instead of O(messages × members)`,con:`Cannot express "read message 5 but not 4" — acceptable, since nobody does`},{choice:`Search in a separate index`,pro:`Relevance and fuzzy matching the primary store cannot do`,con:`Eventually consistent; a pipeline and per-user access scoping to maintain`}],takeaway:`That you separated connection handling from storage, bucketed partitions to bound them, spotted receipts as the write-amplification trap, and made reconnection a sequence-based catch-up.`},{t:`design`,title:`Notification system`,tag:`fan-out, dedup, preferences · asked at LinkedIn, Uber`,prompt:`Design a notification service delivering push, email and SMS, respecting user preferences, quiet hours and rate limits, with no duplicates.`,reqs:[`Multiple channels with per-user, per-type preferences`,`No duplicate notifications, ever`,`Respect quiet hours and per-user frequency caps`,`Handle a broadcast to 10M users without starving transactional sends`],estimate:`50M users · 200M notifications/day ≈ 2,300/s
broadcast burst: 10M in 10 minutes ≈ 17k/s
channels: push 70% · email 25% · SMS 5% (most expensive, hardest limits)`,phases:[{name:`Pipeline shape`,idea:`Separate the decision to notify from the act of delivering.`,sql:`event ──▶ notification service ──▶ per-channel queues ──▶ providers
                     │
              preference + dedup + rate-limit checks happen HERE

-- separate queues per channel and per priority
--   transactional (password reset)  -> high priority queue
--   marketing broadcast             -> bulk queue, rate-limited
-- one shared queue means a 10M broadcast delays password resets`,note:`Priority separation is the single most important structural decision, and the one most often missed.`},{name:`Preferences and quiet hours`,idea:`Evaluate against a compact preference row, not a rules engine.`,sql:`CREATE TABLE notification_prefs (
  user_id   BIGINT,
  type      VARCHAR(40),          -- 'order_shipped', 'promo', ...
  channels  SET('push','email','sms') NOT NULL,
  PRIMARY KEY (user_id, type)
);

CREATE TABLE user_settings (
  user_id     BIGINT PRIMARY KEY,
  timezone    VARCHAR(40) NOT NULL,
  quiet_start TIME, quiet_end TIME,
  max_per_day SMALLINT DEFAULT 20
);

-- quiet hours are evaluated in the USER'S timezone, not the server's
-- transactional notifications override quiet hours; marketing does not`,note:`Storing the timezone rather than an offset is what keeps quiet hours correct across daylight-saving transitions.`},{name:`Deduplication`,idea:`At-least-once delivery upstream means duplicates arrive; the database rejects them.`,sql:`CREATE TABLE sent_notifications (
  dedup_key  VARCHAR(120) PRIMARY KEY,   -- user + type + entity + window
  user_id    BIGINT NOT NULL,
  channel    VARCHAR(10) NOT NULL,
  sent_at    TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
  KEY ix_user_time (user_id, sent_at)
);

-- dedup_key = "991:order_shipped:5521"
INSERT INTO sent_notifications (dedup_key, user_id, channel) VALUES (...);
-- duplicate key -> already sent -> drop silently

-- rate cap, from the same table
SELECT COUNT(*) FROM sent_notifications
WHERE  user_id = ? AND sent_at > NOW() - INTERVAL 1 DAY;
-- or, cheaper at volume: INCR + EXPIRE in Redis`,note:`A unique constraint is a stronger dedup guarantee than any application check, because it holds across concurrent workers and process restarts.`},{name:`Delivery and backpressure`,idea:`Providers fail, throttle and cost money.`,sql:`-- retry with exponential backoff, per channel
--   push:  cheap, retry freely
--   SMS:   expensive, retry sparingly, cap hard

-- circuit breaker per provider: stop hammering a failing one,
--   fail over to a secondary, and re-probe periodically

-- batching: email providers accept batch APIs; a 10M broadcast
--   goes out in batches of 1,000 rather than 10M HTTP calls

-- dead letter queue for permanent failures (invalid token,
--   unsubscribed, hard bounce) -> feed back into preferences
--   so you stop trying`,note:`Feeding hard bounces back into the preference store is what stops a notification system slowly degrading into a spam generator.`}],tradeoffs:[{choice:`Priority-separated queues`,pro:`A marketing broadcast cannot delay a password reset`,con:`More queues to size and monitor`},{choice:`Dedup by unique key`,pro:`Correct under concurrency and restarts; no application logic to trust`,con:`The table grows fast — partition by time and drop old partitions`},{choice:`Redis for rate caps`,pro:`Cheap at 17k/s; TTL handles the window automatically`,con:`Approximate if Redis restarts — acceptable for a frequency cap`},{choice:`Per-provider circuit breakers`,pro:`One failing provider does not consume the whole worker pool`,con:`Failover logic and per-provider health to maintain`}],takeaway:`That you separated priorities into distinct queues, enforced dedup with a database constraint rather than application logic, and treated provider failure and cost as first-class design inputs.`},{t:`design`,title:`Ride-hailing: matching and location`,tag:`geospatial · asked at Uber, Lyft, Ola`,prompt:`Design driver location tracking and rider-to-driver matching for a city with 100,000 active drivers.`,reqs:[`Drivers report location every 4 seconds`,`Find nearby available drivers in under 200 ms`,`A driver is assigned to at most one ride`,`Trip history retained for years`],estimate:`100k active drivers × 1 update / 4 s = 25k writes/s per city
matching requests: ~2k/s peak
location writes are ephemeral; trip records are permanent
  -> two completely different storage problems`,phases:[{name:`Split ephemeral from durable`,idea:`Current location and trip history have nothing in common.`,sql:`-- CURRENT location: 25k writes/s, only the latest value matters,
--   loss is recoverable in 4 seconds
--   -> Redis. Never a relational table.

-- LOCATION HISTORY (for receipts, disputes, replay):
--   -> append to Kafka, land in a columnar/time-series store
--   -> NOT on the hot path

-- TRIPS: transactional, permanent, low volume (~50/s)
--   -> relational, sharded by city or region`,note:`Writing 25k location updates per second into a relational table is the mistake this question is designed to catch.`},{name:`Geospatial index`,idea:`Redis geo commands, or geohash prefixes.`,sql:`-- Redis GEO (a sorted set with geohash scores under the hood)
GEOADD    drivers:sf -122.4194 37.7749 "driver:8821"
GEOSEARCH drivers:sf FROMLONLAT -122.41 37.77
          BYRADIUS 3 km ASC COUNT 20

-- availability is a separate set, intersected at match time
SADD  available:sf "driver:8821"

-- alternative: geohash prefix as the key
--   geohash "9q8yy" ≈ a 150 m cell
--   neighbours = the cell plus its 8 adjacent cells
--   -> a plain key lookup, easy to shard by cell`,note:`Both approaches turn "nearby" into a bounded set lookup rather than a distance calculation over 100,000 rows.`},{name:`Matching without double-assignment`,idea:`The same atomic-claim pattern, again.`,sql:`-- candidates from the geo index, then claim atomically
--   SREM returns 1 only for the caller that actually removed it
claimed = redis.SREM("available:sf", "driver:8821")
if claimed == 1:
    -- we own this driver; persist the assignment durably
    INSERT INTO trips (id, rider_id, driver_id, status) VALUES (?,?,?,'matched');
else:
    -- someone matched them first; try the next candidate

-- driver declines or times out -> SADD them back
-- a lease guards against a crashed matcher stranding a driver`,note:"`SREM` returning 1-or-0 is the atomic test-and-set here, exactly as `ROW_COUNT()` is in the SQL version."},{name:`Scale by geography`,idea:`Cities are natural, near-perfect shards.`,sql:`-- shard by city / region:
--   drivers and riders are almost always in one city
--   -> matching is single-shard by construction
--   -> a city outage is contained to that city
--   -> capacity follows demand per city, independently

-- surge pricing: aggregate demand and supply per geohash cell
--   over a 5-minute window, in Redis; a multiplier per cell

-- trips: shard by city too, with a global index of
--   trip_id -> city for direct lookups`,note:`Geography gives an almost ideal shard key — high cardinality, naturally isolated queries, and independently scalable capacity.`}],tradeoffs:[{choice:`Redis for live location`,pro:`Absorbs 25k writes/s trivially; loss self-heals in one update cycle`,con:`Not durable — history must be captured separately`},{choice:`Geohash / GEO index`,pro:`Proximity search becomes a bounded key lookup`,con:`Cell-edge cases need neighbour cells; radius accuracy is approximate`},{choice:"Atomic `SREM` claim",pro:`No distributed lock needed to prevent double-assignment`,con:`Losers must retry, and a crashed matcher needs a lease to recover`},{choice:`Shard by city`,pro:`Near-perfect isolation and independent scaling`,con:`Cross-city trips and analytics need special handling`}],takeaway:`That you refused to put 25k/s of ephemeral location writes into a relational store, used a geo index instead of distance scans, and reused the atomic-claim pattern for assignment.`}]},{id:`cs-analytics`,title:`Analytics and multi-tenant systems`,blocks:[{t:`design`,title:`Metrics and analytics pipeline`,tag:`OLAP · asked at Datadog, Meta, Amplitude-style`,prompt:`Design a product analytics system: ingest 10 billion events per day and answer questions like "weekly active users by country over the last 90 days" in under two seconds.`,reqs:[`10B events/day ingested without loss`,`Interactive dashboard queries in under 2 s`,`Ad-hoc queries over 90 days of raw data`,`Cost must scale sub-linearly with volume`],estimate:`10B events/day ≈ 116k/s (peak ~400k/s)
raw: 10B × 200 B ≈ 2 TB/day → 180 TB for 90 days
dashboards: ~500 concurrent queries, mostly the SAME few aggregates`,phases:[{name:`Ingest`,idea:`Buffer, batch, and never write row-by-row.`,sql:`SDK ──▶ collector ──▶ Kafka ──▶ batch writer ──▶ ClickHouse
                              │
                        also to object storage (S3) as the raw archive

-- Kafka absorbs bursts and decouples ingestion from storage
-- the writer batches 100k rows per insert:
--   columnar stores are catastrophically slow at single-row inserts
-- partition Kafka by user_id so per-user event order is preserved`,note:`The archive in object storage is the safety net: if the warehouse schema is wrong, you reprocess from raw rather than losing the data.`},{name:`Columnar storage`,idea:`The storage engine choice is most of the performance.`,sql:`CREATE TABLE events (
  event_time DateTime,
  user_id    UInt64,
  event_type LowCardinality(String),
  country    LowCardinality(String),
  properties String
) ENGINE = MergeTree()
PARTITION BY toYYYYMM(event_time)
ORDER BY (event_type, event_time, user_id);

-- why this is 100x faster than a row store here:
--   reads only the columns the query touches (2 of 5, not all)
--   per-column compression: LowCardinality country ≈ 1 byte/row
--   ORDER BY gives data skipping — irrelevant granules are never read
--   partition pruning on the date range`,note:`Compression is not a storage optimisation here, it is a speed optimisation: less data read from disk means a proportionally faster scan.`},{name:`Pre-aggregate the known questions`,idea:`Dashboards ask the same few questions constantly. Do not recompute them.`,sql:`-- rollup, maintained incrementally
CREATE MATERIALIZED VIEW daily_actives_mv
ENGINE = AggregatingMergeTree()
ORDER BY (day, country)
AS SELECT toDate(event_time) AS day,
          country,
          uniqState(user_id) AS uniq_users     -- HLL sketch, mergeable
   FROM events GROUP BY day, country;

-- the dashboard reads the rollup, not the raw table
SELECT day, country, uniqMerge(uniq_users)
FROM   daily_actives_mv
WHERE  day >= today() - 90
GROUP  BY day, country;
-- ~1,000 rows scanned instead of 900 billion`,note:"`uniqState` stores a mergeable HyperLogLog sketch, so weekly and monthly distinct counts roll up from daily ones without touching raw events."},{name:`Tiering and cost`,idea:`Cost control is a design requirement, not an afterthought.`,sql:`-- hot   (0-7 days)  : SSD, full raw detail
-- warm  (8-90 days) : cheaper disks, raw retained
-- cold  (90+ days)  : object storage, rollups only, raw dropped

ALTER TABLE events MODIFY TTL
  event_time + INTERVAL 7  DAY  TO VOLUME 'warm',
  event_time + INTERVAL 90 DAY  DELETE;

-- sampling for exploratory queries
SELECT ... FROM events SAMPLE 0.01    -- 1% sample, ~100x faster
-- exact numbers come from the rollups; exploration uses samples`,note:`Rollups are small enough to keep for years even after the raw events they summarise have been deleted.`}],tradeoffs:[{choice:`Kafka between collector and store`,pro:`Absorbs bursts; decouples ingestion; enables replay`,con:`Real infrastructure to run; adds seconds of ingestion latency`},{choice:`Columnar over row store`,pro:`10–100× on analytical scans, with far better compression`,con:`Poor at single-row lookups and updates; not transactional`},{choice:`Materialised rollups`,pro:`Sub-second dashboards regardless of raw volume`,con:`Only answers anticipated questions; new dimensions need backfill`},{choice:`HLL sketches for distinct counts`,pro:`Mergeable across time and dimensions; tiny`,con:`~1% error — unacceptable for billing, fine for analytics`}],takeaway:`That you separated ingestion from storage with a buffer, chose columnar for the right reason, pre-aggregated the predictable questions, and treated retention tiering as part of the design.`},{t:`design`,title:`Multi-tenant SaaS data layer`,tag:`isolation · asked at Salesforce, Atlassian, Snowflake-style`,prompt:`Design the data layer for a B2B SaaS with 50,000 tenants ranging from 5 users to 50,000 users, where one tenant must never see another's data and a noisy tenant must not degrade others.`,reqs:[`Hard data isolation between tenants`,`Per-tenant backup and restore`,`Noisy-neighbour containment`,`Schema migrations across 50,000 tenants must be tractable`],estimate:`50k tenants · median 20k rows · p99 4M rows
total ≈ 2.5B rows, ~1.5 TB
the largest tenant is 200× the median — this drives the design`,phases:[{name:`Three isolation models`,idea:`Pick per tenant tier, not once for everyone.`,sql:`-- A. SHARED TABLES + tenant_id
--    ✓ cheapest; one migration; efficient for small tenants
--    ✗ isolation depends on every query filtering correctly
--    ✗ per-tenant restore is genuinely painful

-- B. SCHEMA PER TENANT
--    ✓ real isolation; per-schema backup; per-tenant customisation
--    ✗ 50,000 schemas × 40 tables = 2M objects; the catalog degrades
--    ✗ migrations run 50,000 times

-- C. DATABASE PER TENANT
--    ✓ strongest isolation; per-tenant restore, scaling and residency
--    ✗ operationally heaviest; poor resource utilisation for small tenants

-- the real answer: A for the long tail, C for enterprise tiers`,note:`Tiering by tenant size gives most of the isolation benefit for a small fraction of the operational cost.`},{name:`Make isolation structural`,idea:`A forgotten WHERE clause must not be a data breach.`,sql:`-- every table carries tenant_id, and it LEADS every index
PRIMARY KEY (tenant_id, id)
KEY ix_status (tenant_id, status, created_at)
--   -> tenant data is physically co-located; scans stay per-tenant

-- do not rely on developers remembering the filter
-- PostgreSQL: row-level security enforces it in the engine
CREATE POLICY tenant_isolation ON orders
  USING (tenant_id = current_setting('app.tenant_id')::bigint);
ALTER TABLE orders ENABLE ROW LEVEL SECURITY;

-- MySQL has no RLS: enforce with per-tenant views, or a data-access
-- layer that no query may bypass, plus tests that assert isolation`,note:"Leading every index with `tenant_id` gives clustering and isolation from the same decision."},{name:`Noisy neighbours`,idea:`Isolation of data is not isolation of resources.`,sql:`-- one tenant running a 10-minute report degrades everyone
--   -> per-tenant connection pool caps
--   -> statement timeouts, set per tier
--   -> route reporting queries to replicas, never the primary
--   -> per-tenant rate limits at the API edge

-- the outlier tenant: move them to their own database
--   the tenant->shard directory from chapter 15 makes this a
--   data change rather than an architectural one

-- monitor cost and load PER TENANT, not just in aggregate:
--   without it you cannot tell who to move, or who to charge more`,note:`Per-tenant observability is what turns "the database is slow" into "tenant 8821 is running a cartesian join".`},{name:`Migrations and backup`,idea:`Both get harder in exactly proportion to how much isolation you bought.`,sql:`-- shared tables: ONE migration, but it locks a 2.5B-row table
--   -> gh-ost / pt-online-schema-change, expand-migrate-contract

-- schema/DB per tenant: 50,000 migrations
--   -> run in waves, track per-tenant version, tolerate mixed versions
--      in production, and make code backward compatible by default

-- per-tenant restore:
--   shared tables -> restore to a scratch database, extract
--                    WHERE tenant_id = ?, reinsert. Slow, error-prone.
--   DB per tenant -> restore that database. Minutes.

-- offboarding / GDPR deletion: same asymmetry, same conclusion`,note:`"Restore one tenant to yesterday" is the requirement that most often forces the move to database-per-tenant for enterprise customers.`}],tradeoffs:[{choice:`Shared tables for the long tail`,pro:`One migration; efficient packing of 49,000 small tenants`,con:`Isolation depends on query correctness; per-tenant restore is painful`},{choice:`Database per enterprise tenant`,pro:`True isolation, per-tenant restore, residency and independent scaling`,con:`Operationally heavy; migrations must handle mixed versions`},{choice:"`tenant_id` leading every index",pro:`Physical co-location and isolation from one decision`,con:`Cross-tenant internal queries become scans — send them to a warehouse`},{choice:`Row-level security`,pro:`The engine enforces isolation; a missing filter cannot leak data`,con:`PostgreSQL only; some overhead; policies must be tested like code`}],takeaway:`That you tiered the isolation model instead of choosing one globally, made isolation structural rather than conventional, and identified per-tenant restore and noisy neighbours as the requirements that actually drive the choice.`}]}]},le=[{q:`What does SELECT * do and why avoid it in application code?`,d:1,p:`Basics`,c:[`TCS`,`INFY`,`AMZ`],a:`Returns every column. Avoid it: it breaks when columns are added or reordered, transfers unneeded data, and prevents a covering index from being used.`},{q:`How do you rename a column in the result set?`,d:1,p:`Basics`,c:[`TCS`,`COG`],a:"`AS alias`. The keyword is optional but explicit is safer — a missing comma silently turns a column into an alias for the previous one.",sql:`SELECT salary AS monthly_pay FROM employees;`},{q:`What is the difference between DISTINCT and GROUP BY?`,d:1,p:`Basics`,c:[`INFY`,`AMZ`,`WIPRO`],a:"Both deduplicate. `DISTINCT` applies to the whole select list; `GROUP BY` creates groups you can aggregate over and attach `HAVING` to. Optimisers usually produce the same plan."},{q:`Does DISTINCT apply to one column or all of them?`,d:1,p:`Basics`,c:[`TCS`,`ADBE`],a:"All of them. `SELECT DISTINCT a, b` returns unique *combinations*; there is no `DISTINCT(a), b` syntax — the parentheses are just grouping."},{q:`Write a query for rows where a value is between two bounds.`,d:1,p:`Basics`,c:[`TCS`,`CAP`],a:"`BETWEEN` is inclusive on both ends. On DATETIME columns use a half-open range instead or you lose everything after midnight on the end date.",sql:`WHERE d >= '2024-01-01' AND d < '2024-04-01'`},{q:`What is the difference between IN and a chain of ORs?`,d:1,p:`Basics`,c:[`TCS`,`INFY`],a:"None semantically — `IN` is shorthand and is optimised identically. `IN` with a subquery is different, and its negation has a NULL hazard."},{q:`Explain LIKE wildcards.`,d:1,p:`Basics`,c:[`TCS`,`COG`,`ACC`],a:"`%` matches any run of characters including none; `_` matches exactly one. Escape literals with `LIKE '100\\%' ESCAPE '\\\\'`."},{q:`Why is LIKE '%abc' slow but LIKE 'abc%' fast?`,d:2,p:`Basics`,c:[`AMZ`,`MSFT`,`GOOG`],a:`A B-tree is ordered by prefix. A trailing wildcard leaves a usable prefix so the engine can range-scan; a leading wildcard supplies none, forcing a full scan.`},{q:`How do you sort by multiple columns in different directions?`,d:1,p:`Basics`,c:[`TCS`,`AMZ`],a:"`ORDER BY a DESC, b ASC` — each direction applies only to the key it follows. `ASC` is the default.",sql:`ORDER BY salary DESC, hire_date ASC, name`},{q:`Why does pagination sometimes repeat or skip rows?`,d:2,p:`Basics`,c:[`GOOG`,`AMZ`,`UBER`],a:"The `ORDER BY` is not a total order, so tied rows come back in an unstable sequence. Always append a unique tiebreaker such as the primary key."},{q:`Why is LIMIT 20 OFFSET 1000000 slow, and what replaces it?`,d:2,p:`Basics`,c:[`GOOG`,`META`,`UBER`],a:`The server produces and discards a million rows. Use keyset pagination: remember the last row's sort key and seek past it.`,sql:`WHERE (created_at, id) < (?, ?) ORDER BY created_at DESC, id DESC LIMIT 20`},{q:`Can you use a column alias in WHERE? In ORDER BY?`,d:1,p:`Basics`,c:[`AMZ`,`INFY`,`ADBE`],a:"Not in `WHERE` — it runs before the select list exists. Yes in `ORDER BY`, which runs after. MySQL also permits it in `GROUP BY` and `HAVING` as an extension."},{q:`State the logical processing order of a SELECT.`,d:2,p:`Basics`,c:[`AMZ`,`GOOG`,`MSFT`,`META`],a:`FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT. This explains alias scoping, WHERE vs HAVING, and why LIMIT does not make a sort cheap.`},{q:`How do you sort in a custom, non-alphabetical order?`,d:2,p:`Basics`,c:[`AMZ`,`ADBE`],a:"`ORDER BY CASE status WHEN 'pending' THEN 1 WHEN 'shipped' THEN 2 ELSE 3 END`. MySQL's `FIELD()` is a shorter non-portable alternative. No index can serve it."},{q:`What does the ternary-like CASE expression look like?`,d:1,p:`Basics`,c:[`TCS`,`INFY`],a:"Searched form `CASE WHEN cond THEN x ELSE y END` handles ranges; simple form `CASE col WHEN val THEN x END` only does equality and cannot match NULL."},{q:`How do you return the top N rows in different engines?`,d:1,p:`Basics`,c:[`ORCL`,`MSFT`,`IBM`],a:"MySQL/PostgreSQL `LIMIT n`; SQL Server `SELECT TOP n` or `OFFSET … FETCH NEXT n ROWS ONLY`; Oracle 12c+ also uses `FETCH FIRST n ROWS ONLY`."},{q:`What does SELECT 1 FROM t do?`,d:1,p:`Basics`,c:[`AMZ`,`TCS`],a:"Returns the constant 1 once per row. Used inside `EXISTS`, where the select list is never evaluated at all — `SELECT *` there is equally fast."},{q:`How do you select rows with no WHERE clause match — an empty result vs NULL?`,d:2,p:`Basics`,c:[`META`,`GOOG`],a:"A filtered `SELECT` returns zero rows; an ungrouped aggregate always returns exactly one row with NULLs. Wrap in `MAX(...)` when the caller needs NULL rather than nothing."},{q:`Write a query to swap the values of two columns in every row.`,d:1,p:`Basics`,c:[`TCS`,`ZOHO`],a:"A single `UPDATE` with both assignments — SQL evaluates the right-hand sides against the pre-update row, so no temp column is needed.",sql:`UPDATE t SET a = b, b = a;`},{q:`What is the difference between a scalar, a row and a table expression?`,d:2,p:`Theory`,c:[`ORCL`,`IBM`],a:`Scalar = one value (usable where a literal goes). Row = one tuple (usable in row-value comparisons). Table = a set of rows (usable in FROM).`},{q:`What is NULL and how does it differ from 0 and ''?`,d:1,p:`Null`,c:[`TCS`,`AMZ`,`INFY`,`COG`],a:"NULL means unknown or not applicable — an absence of value. `0` and `''` are known values. `'' = ''` is TRUE; `NULL = NULL` is UNKNOWN."},{q:`Why does WHERE col = NULL return nothing?`,d:1,p:`Null`,c:[`AMZ`,`TCS`,`MSFT`],a:"Any comparison with NULL yields UNKNOWN, and WHERE keeps only TRUE. Use `IS NULL`, or MySQL's null-safe `<=>`."},{q:`Explain three-valued logic.`,d:2,p:`Null`,c:[`ORCL`,`AMZ`,`GOOG`],a:"Predicates evaluate to TRUE, FALSE or UNKNOWN. `TRUE AND UNKNOWN` = UNKNOWN, `TRUE OR UNKNOWN` = TRUE, `NOT UNKNOWN` = UNKNOWN. WHERE keeps TRUE only; CHECK constraints accept UNKNOWN."},{q:`Why does NOT IN with a subquery containing NULL return zero rows?`,d:2,p:`Null`,c:[`AMZ`,`GOOG`,`META`,`MSFT`],a:"It expands to a chain of `<>` including `x <> NULL` = UNKNOWN, so the whole predicate can never be TRUE. Use `NOT EXISTS`."},{q:`How do COUNT(*), COUNT(col) and COUNT(DISTINCT col) differ?`,d:1,p:`Null`,c:[`AMZ`,`TCS`,`ADBE`],a:"`COUNT(*)` counts rows; `COUNT(col)` counts non-NULL values; `COUNT(DISTINCT col)` counts distinct non-NULL values. `COUNT(*) - COUNT(col)` is the NULL count."},{q:`Does AVG treat NULL as zero?`,d:1,p:`Null`,c:[`AMZ`,`INFY`,`GS`],a:"No — NULLs are excluded from both numerator and denominator. `AVG(v)` over (1, 2, NULL) is 1.5, not 1. Use `AVG(COALESCE(v,0))` if you want them counted."},{q:`What is the difference between COALESCE, IFNULL, NVL and NULLIF?`,d:1,p:`Null`,c:[`ORCL`,`AMZ`,`TCS`],a:"`COALESCE(a,b,c…)` returns the first non-NULL (standard, any arity). `IFNULL` is MySQL's two-argument version; `NVL` is Oracle's. `NULLIF(a,b)` returns NULL when a=b — the standard divide-by-zero guard."},{q:`How do NULLs sort?`,d:2,p:`Null`,c:[`ORCL`,`GOOG`,`AMZ`],a:"MySQL and SQLite sort them first ascending; PostgreSQL and Oracle sort them last. Standard `NULLS FIRST/LAST` is unsupported in MySQL — emulate with `ORDER BY (v IS NULL), v`."},{q:`How does GROUP BY treat NULLs?`,d:2,p:`Null`,c:[`AMZ`,`META`],a:"All NULLs form one group — the only place SQL treats NULLs as equal. `DISTINCT` and `UNION` do the same."},{q:`Do NULLs join to each other?`,d:2,p:`Null`,c:[`AMZ`,`GOOG`],a:"No. `ON a.x = b.x` is UNKNOWN when either is NULL, so those rows never match. MySQL's `<=>` operator matches NULL to NULL."},{q:`Can a UNIQUE column contain multiple NULLs?`,d:2,p:`Null`,c:[`MSFT`,`AMZ`,`ORCL`],a:`In MySQL and PostgreSQL, yes — two NULLs are not equal so uniqueness is not violated. SQL Server allows only one. This surprises people expecting single-occupancy.`},{q:`Does a CHECK constraint reject NULL?`,d:2,p:`Null`,c:[`ORCL`,`MSFT`],a:"No. A CHECK passes unless it evaluates to FALSE, and `NULL > 18` is UNKNOWN. Add an explicit `NOT NULL` if that is what you mean."},{q:`What does CONCAT do with NULL?`,d:1,p:`Null`,c:[`AMZ`,`TCS`],a:"MySQL's `CONCAT` returns NULL if any argument is NULL. `CONCAT_WS` skips NULLs. PostgreSQL's `||` propagates NULL like MySQL's CONCAT."},{q:`How do you count NULLs in a column?`,d:1,p:`Null`,c:[`TCS`,`AMZ`],a:"`COUNT(*) - COUNT(col)`, or `SUM(col IS NULL)` in MySQL, or `COUNT(*) FILTER (WHERE col IS NULL)` in PostgreSQL."},{q:`Why does CASE col WHEN NULL THEN … never match?`,d:2,p:`Null`,c:[`GOOG`,`ORCL`],a:"The simple CASE compiles to `col = NULL`, which is UNKNOWN. Only the searched form with `WHEN col IS NULL` works."},{q:`What is the result of SUM over a group with only NULLs?`,d:2,p:`Null`,c:[`AMZ`,`GS`],a:"NULL, not 0 — while `COUNT` of the same group is 0. Wrap in `COALESCE(SUM(x),0)` when the value feeds arithmetic."},{q:`What does an empty scalar subquery return, and why does it matter?`,d:2,p:`Null`,c:[`META`,`GOOG`],a:`NULL. Any comparison against it becomes UNKNOWN, so the outer query silently returns nothing — a common cause of 'my report is empty'.`},{q:`How do you make an aggregate ignore rows conditionally?`,d:2,p:`Null`,c:[`AMZ`,`META`],a:`Put the condition in a CASE with no ELSE — the aggregate then skips the NULLs.`,sql:`AVG(CASE WHEN salary > 9000 THEN salary END)`},{q:`Does an index store NULLs?`,d:2,p:`Null`,c:[`ORCL`,`MSFT`,`AMZ`],a:"InnoDB and PostgreSQL B-trees do, so `IS NULL` can use an index. Oracle omits entries where all indexed columns are NULL, forcing a scan unless you add a constant column."},{q:`What is the null-safe equality operator?`,d:2,p:`Null`,c:[`AMZ`,`MSFT`],a:"MySQL's `<=>`: `NULL <=> NULL` is TRUE and `1 <=> NULL` is FALSE. The standard equivalent is `IS NOT DISTINCT FROM`, supported by PostgreSQL."},{q:`What is the difference between UNION and UNION ALL?`,d:1,p:`Set`,c:[`TCS`,`AMZ`,`INFY`,`ADBE`],a:"`UNION` deduplicates via a sort or hash and is meaningfully slower; `UNION ALL` keeps everything. Use ALL whenever the branches cannot overlap."},{q:`What rules apply to the branches of a UNION?`,d:1,p:`Set`,c:[`TCS`,`AMZ`],a:"Same column count with compatible types. The first branch names the result columns. `ORDER BY` appears once, at the end, and applies to the whole result."},{q:`How do you emulate INTERSECT and EXCEPT in MySQL 5.7?`,d:2,p:`Set`,c:[`AMZ`,`INFY`],a:"INTERSECT = inner join or `IN` with DISTINCT. EXCEPT/MINUS = `LEFT JOIN … IS NULL` or `NOT EXISTS`. MySQL added the real operators in 8.0.31."},{q:`What is Oracle's MINUS equivalent to?`,d:1,p:`Set`,c:[`ORCL`,`IBM`],a:"Standard SQL's `EXCEPT`. Both return rows in the first set not present in the second, with duplicates removed."},{q:`Do set operators remove duplicates by default?`,d:1,p:`Set`,c:[`ORCL`,`TCS`],a:"Yes — UNION, INTERSECT and EXCEPT all imply DISTINCT. Add `ALL` to keep duplicates, which also avoids the deduplication sort."},{q:`How do you emulate FULL OUTER JOIN in MySQL?`,d:2,p:`Set`,c:[`AMZ`,`MSFT`],a:"`LEFT JOIN` UNION `RIGHT JOIN`. Better: `LEFT JOIN` UNION ALL the right-only rows filtered by `NOT EXISTS`, which needs no deduplication sort."},{q:`Can you ORDER BY inside a UNION branch?`,d:2,p:`Set`,c:[`AMZ`,`ORCL`],a:"Only with a `LIMIT` in MySQL, and even then the ordering of the combined result is not guaranteed. Put the ORDER BY once at the end."},{q:`How do you find rows present in A but not B, and vice versa, in one query?`,d:2,p:`Set`,c:[`GOOG`,`AMZ`],a:"A full outer join emulation with a tag column, or `(A EXCEPT B) UNION ALL (B EXCEPT A)` — the symmetric difference, useful for data reconciliation."},{q:`What is a CROSS JOIN and when is it useful?`,d:1,p:`Set`,c:[`AMZ`,`TCS`],a:`The cartesian product. Legitimately used to build a dense dimension grid (every department × every month) which you then LEFT JOIN facts onto, so periods with no data still appear.`},{q:`How do you generate a numbers or dates table without one existing?`,d:2,p:`Set`,c:[`GOOG`,`AMZ`,`UBER`],a:`A recursive CTE, or cross-joining a small digits table to itself. For production reporting, create a permanent indexed calendar table instead.`,sql:`WITH RECURSIVE d AS (SELECT DATE('2024-01-01') x UNION ALL SELECT x + INTERVAL 1 DAY FROM d WHERE x < '2024-12-31') SELECT * FROM d;`}],ue=[{q:`Name every join type and what each returns.`,d:1,p:`Joins`,c:[`TCS`,`INFY`,`WIPRO`,`AMZ`],a:`INNER = matching pairs only. LEFT/RIGHT = all rows of one side, NULL-padded. FULL OUTER = both sides (not in MySQL). CROSS = cartesian product. SELF = a table joined to itself with two aliases.`},{q:`What is the difference between an INNER JOIN and a comma join?`,d:1,p:`Joins`,c:[`TCS`,`ORCL`],a:"None semantically, but the comma form mixes join conditions into WHERE — forget one and you get a silent cross join. Explicit `JOIN … ON` also supports outer joins."},{q:`Why does filtering the right table in WHERE break a LEFT JOIN?`,d:2,p:`Joins`,c:[`AMZ`,`GOOG`,`META`,`MSFT`],a:"Padded rows carry NULLs, and any non-IS-NULL predicate on them is UNKNOWN, so WHERE drops them — demoting the outer join to an inner join silently. Put the condition in `ON`."},{q:`Write an anti-join three ways.`,d:2,p:`Joins`,c:[`AMZ`,`GOOG`,`META`],a:"`NOT EXISTS` (safest, short-circuits), `LEFT JOIN … WHERE right.key IS NULL`, and `NOT IN` (only with an explicit `IS NOT NULL` guard).",sql:`SELECT * FROM a WHERE NOT EXISTS (SELECT 1 FROM b WHERE b.id = a.id);`},{q:`What is a semi-join?`,d:2,p:`Joins`,c:[`ORCL`,`GOOG`,`AMZ`],a:"Returns left rows that *have* a match, without duplicating them and without right-side columns — expressed by `EXISTS` or `IN`. An inner join would emit one row per matching pair."},{q:`Why did my SUM double after adding a join?`,d:2,p:`Joins`,c:[`AMZ`,`META`,`GS`],a:`Fan-out: joining a parent to two one-to-many children produces the cartesian product of the children, so each value repeats. Pre-aggregate each child to one row per parent before joining.`},{q:`When do you need COUNT(DISTINCT) after a join?`,d:2,p:`Joins`,c:[`AMZ`,`UBER`],a:"Whenever the join multiplies parent rows. `COUNT(DISTINCT o.order_id)` counts orders; `COUNT(*)` would count line items. Sums of child columns are unaffected."},{q:`Write a self join to list employees with their manager's name.`,d:1,p:`Joins`,c:[`TCS`,`AMZ`,`INFY`],a:"Two aliases on the same table, joined on `m.emp_id = e.manager_id`. Use LEFT JOIN or you drop the CEO, whose manager_id is NULL.",sql:`SELECT e.name, m.name AS manager FROM employees e LEFT JOIN employees m ON m.emp_id = e.manager_id;`},{q:`Find all pairs of rows in a table without duplicates or self-pairs.`,d:2,p:`Joins`,c:[`AMZ`,`GOOG`,`FLPK`],a:"Self join with `b.id > a.id` — the strict inequality both breaks symmetry and excludes self-pairing in one operator."},{q:`What is the difference between USING and ON?`,d:1,p:`Joins`,c:[`ORCL`,`AMZ`],a:"`USING (col)` requires the same column name and merges the two columns into one in the output. `ON` is general — different names, inequalities, multiple conditions."},{q:`Why avoid NATURAL JOIN?`,d:2,p:`Joins`,c:[`ORCL`,`AMZ`],a:"It joins on every same-named column implicitly, so adding an unrelated `created_at` to both tables silently changes the join and breaks the query with no error."},{q:`What are the three physical join algorithms?`,d:2,p:`Joins`,c:[`ORCL`,`GOOG`,`MSFT`,`AMZ`],a:"Nested loop (small outer + indexed inner), hash join (large unindexed inputs; MySQL 8.0.18+), merge join (both inputs already sorted). `EXPLAIN` shows which was chosen."},{q:`Does the written order of tables in a join affect the plan?`,d:2,p:`Joins`,c:[`ORCL`,`MSFT`],a:"For inner joins the optimiser reorders freely based on statistics. For outer joins the order is semantically significant. `STRAIGHT_JOIN` forces MySQL's hand — a last resort after checking statistics."},{q:`How do you join on a range rather than equality?`,d:2,p:`Joins`,c:[`GOOG`,`AMZ`,`UBER`],a:"A non-equi join: `ON v.amount BETWEEN t.lo AND t.hi`. Common for tier/bracket lookups. It cannot use a hash join, so index the range columns and keep the outer side small."},{q:`Find rows in A whose value falls between two rows of B — overlapping intervals.`,d:3,p:`Joins`,c:[`UBER`,`AMZ`,`ATLS`],a:"Two half-open ranges overlap iff `a.start < b.end AND b.start < a.end`. Memorise this rather than enumerating the four positional cases.",sql:`JOIN b ON a.start < b.end AND b.start < a.end`},{q:`How do you join a table to the *latest* matching row of another?`,d:3,p:`Joins`,c:[`AMZ`,`UBER`,`GOOG`],a:"Window `ROW_NUMBER() … = 1` in a subquery, or `NOT EXISTS` (no later row), or PostgreSQL's `LATERAL … LIMIT 1`. The NOT EXISTS form is often fastest with the right index."},{q:`What is a LATERAL join / CROSS APPLY?`,d:3,p:`Joins`,c:[`MSFT`,`GOOG`,`ORCL`],a:"A derived table on the right that may reference columns from the left — a per-row subquery in FROM position. Ideal for top-N per group. PostgreSQL/Oracle `LATERAL`, SQL Server `CROSS APPLY`; MySQL has `LATERAL` from 8.0.14."},{q:`Why does an inner join sometimes return fewer rows than the left table?`,d:1,p:`Joins`,c:[`TCS`,`AMZ`],a:`Rows with a NULL foreign key, or one pointing at a deleted parent, never match and are dropped silently. Use a LEFT JOIN if they must be preserved.`},{q:`How would you find rows that exist in both tables but differ in some column?`,d:2,p:`Joins`,c:[`GS`,`AMZ`,`DELOITTE`],a:`Inner join on the key, then compare with a null-safe operator so NULL-vs-value differences are caught.`,sql:`WHERE NOT (a.col <=> b.col)`},{q:`What happens if you join on a non-indexed column?`,d:2,p:`Joins`,c:[`AMZ`,`MSFT`],a:`Nested loop degrades to a full scan of the inner table per outer row, or the optimiser falls back to a hash join with a large build. Always index foreign keys — MySQL does it automatically for declared FKs.`},{q:`Explain a three-table join and how the optimiser executes it.`,d:2,p:`Joins`,c:[`TCS`,`AMZ`,`IBM`],a:`Joins are binary and left-associative: A⋈B produces an intermediate, which is then joined to C. The optimiser chooses the order; putting the most selective filter first shrinks the intermediate.`},{q:`How do you deduplicate the result of a join without DISTINCT?`,d:2,p:`Joins`,c:[`AMZ`,`META`],a:"Replace the join with `EXISTS` when you only need existence, or aggregate the many-side first. `DISTINCT` on a large joined result forces a sort and hides the real problem."},{q:`Difference between WHERE and HAVING?`,d:1,p:`Aggregate`,c:[`TCS`,`INFY`,`AMZ`,`CAP`],a:`WHERE filters rows before grouping and can use indexes; HAVING filters groups after aggregation and can reference aggregates. Push everything non-aggregate into WHERE.`},{q:`Can you use an aggregate in WHERE?`,d:1,p:`Aggregate`,c:[`TCS`,`AMZ`],a:"No — groups do not exist yet. Move it to HAVING, or compute it in a subquery. `WHERE x > (SELECT AVG(x) FROM t)` is legal because the aggregate belongs to the inner query."},{q:`What is ONLY_FULL_GROUP_BY and why was it enabled?`,d:2,p:`Aggregate`,c:[`AMZ`,`MSFT`,`ORCL`],a:`It enforces the standard rule that every select-list column must be grouped or aggregated. MySQL previously returned an arbitrary row's value, producing quietly wrong results. Default since 5.7.`},{q:`Find the row with the maximum value per group.`,d:2,p:`Aggregate`,c:[`AMZ`,`GOOG`,`META`,`MSFT`],a:"`ROW_NUMBER() OVER (PARTITION BY g ORDER BY v DESC) = 1`, or join back to a `MAX` derived table (returns ties), or `NOT EXISTS` a larger row. The most-asked SQL question there is."},{q:`Why does COUNT(*) return 1 instead of 0 after a LEFT JOIN?`,d:2,p:`Aggregate`,c:[`AMZ`,`META`,`ADBE`],a:"It counts the NULL-padded row. Use `COUNT(right_table.column)`, which skips NULLs and correctly returns 0."},{q:`How do you compute a percentage per group?`,d:2,p:`Aggregate`,c:[`AMZ`,`UBER`,`META`],a:"Divide the group aggregate by a window total: `100.0 * SUM(x) / SUM(SUM(x)) OVER ()`. Multiply by 100.0 not 100, or integer division truncates."},{q:`What is conditional aggregation and what is it used for?`,d:2,p:`Aggregate`,c:[`AMZ`,`META`,`GOOG`],a:"Putting the filter inside the aggregate: `SUM(CASE WHEN c THEN 1 ELSE 0 END)`. It computes many different counts in one scan and is how you pivot rows into columns."},{q:`How do you pivot rows into columns in MySQL?`,d:2,p:`Aggregate`,c:[`AMZ`,`META`,`ADBE`],a:"There is no PIVOT keyword — use one `SUM(CASE …)` per target column over a shared GROUP BY. A dynamic column list requires generating the SQL text."},{q:`How do you unpivot columns into rows?`,d:2,p:`Aggregate`,c:[`AMZ`,`MSFT`],a:"`UNION ALL` one branch per column. SQL Server has native `UNPIVOT`; PostgreSQL uses `LATERAL (VALUES …)`. MySQL has neither."},{q:`What does WITH ROLLUP do?`,d:2,p:`Aggregate`,c:[`ORCL`,`AMZ`,`SAP`],a:"Adds super-aggregate subtotal rows where trailing group keys become NULL, plus a grand total. Use `GROUPING()` to distinguish a rollup NULL from a real one. MySQL lacks CUBE and GROUPING SETS."},{q:`Concatenate all values in a group into one string.`,d:2,p:`Aggregate`,c:[`AMZ`,`ADBE`,`ZOHO`],a:"MySQL `GROUP_CONCAT(x ORDER BY x SEPARATOR ', ')` — watch `group_concat_max_len`, which truncates at 1024 bytes silently. PostgreSQL `STRING_AGG`, Oracle `LISTAGG`."},{q:`Compute a median in MySQL.`,d:3,p:`Aggregate`,c:[`META`,`GOOG`,`AMZ`],a:"No MEDIAN function. Rank ascending and descending and average the rows where the ranks are within one, or use `ROW_NUMBER` with `FLOOR/CEIL((n+1)/2)`."},{q:`Compute a mode (most frequent value).`,d:2,p:`Aggregate`,c:[`AMZ`,`GOOG`],a:"`GROUP BY v ORDER BY COUNT(*) DESC LIMIT 1` for one, or `RANK()` over the counts to return all tied modes."},{q:`What is the difference between STDDEV_POP and STDDEV_SAMP?`,d:2,p:`Aggregate`,c:[`GOOG`,`MCK`,`DE`],a:"Population divides by n, sample divides by n−1 (Bessel's correction). MySQL's `STDDEV` and `STD` are population; `STDDEV_SAMP` is the sample form."},{q:`Find duplicate rows in a table.`,d:1,p:`Aggregate`,c:[`TCS`,`AMZ`,`ADBE`,`INFY`],a:"`GROUP BY the defining columns HAVING COUNT(*) > 1`. To see the actual rows, use `ROW_NUMBER() … > 1` in a subquery."},{q:`How many rows does an aggregate return over an empty table?`,d:2,p:`Aggregate`,c:[`GOOG`,`AMZ`],a:`One row without GROUP BY (COUNT = 0, others NULL); zero rows with GROUP BY, since there are no groups. This changes how a scalar subquery behaves.`},{q:`Count rows per group including groups with zero rows.`,d:2,p:`Aggregate`,c:[`AMZ`,`META`],a:"LEFT JOIN from the dimension table and `COUNT(fact.column)`. For missing time periods, cross join a generated calendar first."},{q:`What is the difference between COUNT(1) and COUNT(*)?`,d:1,p:`Aggregate`,c:[`TCS`,`AMZ`,`ORCL`],a:"None — both count rows and modern optimisers treat them identically. The persistent belief that `COUNT(1)` is faster is folklore."},{q:`Why is COUNT(*) slow on a large InnoDB table?`,d:2,p:`Aggregate`,c:[`AMZ`,`MSFT`,`ORCL`],a:`MVCC means each transaction may see a different count, so there is no stored counter — the engine scans the smallest index. MyISAM keeps a count, which is why it is instant there.`},{q:`How do you group by a computed value while keeping the filter sargable?`,d:2,p:`Aggregate`,c:[`AMZ`,`GOOG`],a:"Filter on the bare column with a range, group on the expression. `WHERE d >= '2024-01-01' AND d < '2025-01-01' GROUP BY DATE_FORMAT(d,'%Y-%m')`."},{q:`What is FILTER (WHERE …) and which engines support it?`,d:2,p:`Aggregate`,c:[`GOOG`,`META`],a:"Standard SQL syntax for conditional aggregation: `COUNT(*) FILTER (WHERE x > 5)`. PostgreSQL and SQLite support it; MySQL does not, so use `SUM(CASE …)`."},{q:`Return groups where every member satisfies a condition.`,d:3,p:`Aggregate`,c:[`GOOG`,`AMZ`,`META`],a:"`HAVING COUNT(*) = COUNT(CASE WHEN cond THEN 1 END)` — the counts match only when no row fails. Equivalently `HAVING MIN(cond) = 1` in MySQL."},{q:`Find groups containing at least one of X and none of Y.`,d:3,p:`Aggregate`,c:[`META`,`GOOG`],a:"`HAVING SUM(x = 'X') > 0 AND SUM(x = 'Y') = 0`. Conditional aggregation expresses arbitrary per-group set conditions in one pass."},{q:`Relational division: find entities related to *every* member of a set.`,d:3,p:`Aggregate`,c:[`GOOG`,`AMZ`,`ORCL`],a:"Count form: `HAVING COUNT(DISTINCT x) = (SELECT COUNT(*) FROM required)`. Formal form: nested `NOT EXISTS` — 'no required item that this entity lacks'."},{q:`What does GROUPING SETS do?`,d:3,p:`Aggregate`,c:[`ORCL`,`SAP`,`MSFT`],a:"Computes several different groupings in one pass — `GROUPING SETS ((a,b),(a),())` gives detail, subtotal and grand total. `CUBE` is all combinations, `ROLLUP` is the hierarchy. MySQL supports only ROLLUP."}],de=[{q:`What is a scalar subquery?`,d:1,p:`Subquery`,c:[`TCS`,`AMZ`],a:`One returning exactly one row and one column, usable anywhere a literal can appear. More than one row raises an error; zero rows yields NULL.`},{q:`What is a correlated subquery?`,d:2,p:`Subquery`,c:[`AMZ`,`ORCL`,`INFY`],a:`One that references a column from the outer query, so it is conceptually re-evaluated per outer row. Optimisers often decorrelate it into a join.`},{q:`When is a correlated subquery faster than a join?`,d:2,p:`Subquery`,c:[`GOOG`,`ORCL`],a:"When it can short-circuit — `EXISTS` stops at the first match rather than materialising all of them — or when the outer set is tiny. It loses badly when the outer set is large."},{q:`IN vs EXISTS — which and when?`,d:2,p:`Subquery`,c:[`AMZ`,`ORCL`,`MSFT`],a:"Modern optimisers usually produce the same plan. `EXISTS` is NULL-safe and short-circuits; `IN` with a literal list needs no subquery at all. Always prefer `NOT EXISTS` over `NOT IN`."},{q:`What do ANY and ALL mean?`,d:2,p:`Subquery`,c:[`ORCL`,`IBM`,`AMZ`],a:"`x < ANY (s)` is `x < MAX(s)`; `x < ALL (s)` is `x < MIN(s)`. `= ANY` is `IN`, `<> ALL` is `NOT IN` and inherits its NULL hazard. Over an empty set, ALL is TRUE and ANY is FALSE."},{q:`What is a derived table and what must it have?`,d:1,p:`Subquery`,c:[`TCS`,`AMZ`],a:`A subquery in the FROM clause. MySQL requires an alias — omitting it is a syntax error.`},{q:`What is a CTE and how does it differ from a derived table?`,d:1,p:`Subquery`,c:[`AMZ`,`MSFT`,`GOOG`],a:"A named result set declared with `WITH`, readable top-down, referenceable more than once, and able to recurse. Same performance as a derived table in MySQL 8 and PostgreSQL 12+."},{q:`Is a CTE materialised or inlined?`,d:2,p:`Subquery`,c:[`GOOG`,`ORCL`,`MSFT`],a:"Inlined by default in MySQL 8 and PostgreSQL 12+, so referencing it twice may execute it twice. PostgreSQL before 12 always materialised it; `AS MATERIALIZED` forces that behaviour explicitly."},{q:`Write a recursive CTE to walk an org chart.`,d:3,p:`Subquery`,c:[`AMZ`,`GOOG`,`MSFT`],a:"Anchor member picks the root; recursive member joins the CTE to the base table. Use `UNION ALL`, cast text columns wide in the anchor, and add a depth guard against cycles.",sql:`WITH RECURSIVE org AS (SELECT id, name, 1 lvl FROM emp WHERE id = 1 UNION ALL SELECT e.id, e.name, o.lvl+1 FROM emp e JOIN org o ON e.mgr_id = o.id) SELECT * FROM org;`},{q:`Why must a recursive CTE use UNION ALL rather than UNION?`,d:3,p:`Subquery`,c:[`GOOG`,`ORCL`],a:"`UNION` deduplicates, which can drop legitimate rows appearing at different depths and adds a sort per iteration. MySQL also restricts the recursive member's shape."},{q:`What limits recursion depth in MySQL?`,d:2,p:`Subquery`,c:[`AMZ`,`ORCL`],a:"`cte_max_recursion_depth`, default 1000 — it errors rather than looping forever. Add your own depth predicate as a semantic guard against cyclic data."},{q:`Why does a recursive CTE truncate my concatenated path?`,d:3,p:`Subquery`,c:[`GOOG`,`AMZ`],a:"Column types are fixed by the anchor row, so a short first value caps the width. `CAST(name AS CHAR(500))` in the anchor fixes it."},{q:`Can a CTE modify data?`,d:2,p:`Subquery`,c:[`GOOG`,`ATLS`],a:"In PostgreSQL yes — `WITH x AS (DELETE … RETURNING *)` enables pipelines in one statement. MySQL does not allow DML inside a CTE."},{q:`How do you filter on a window function result?`,d:2,p:`Subquery`,c:[`AMZ`,`META`,`GOOG`],a:`You cannot in the same query level — windows are evaluated after WHERE. Wrap it in a subquery or CTE and filter outside.`},{q:`How do you find the Nth highest value?`,d:2,p:`Subquery`,c:[`AMZ`,`TCS`,`ADBE`,`MSFT`],a:"`DENSE_RANK() = N`, or `LIMIT 1 OFFSET N-1` on distinct values, or the portable correlated count: exactly N−1 distinct values are greater."},{q:`Write a query for the second highest salary that returns NULL if absent.`,d:1,p:`Subquery`,c:[`TCS`,`INFY`,`AMZ`],a:"`SELECT MAX(salary) FROM emp WHERE salary < (SELECT MAX(salary) FROM emp)` — the outer aggregate guarantees exactly one row, so NULL rather than an empty result."},{q:`Difference between a subquery in SELECT, FROM and WHERE?`,d:2,p:`Subquery`,c:[`ORCL`,`AMZ`],a:`In SELECT it must be scalar and runs per outer row. In FROM it is a derived table producing a set. In WHERE it can be scalar, a quantified predicate, or an EXISTS test.`},{q:`How do you avoid repeating an expensive subquery three times?`,d:2,p:`Subquery`,c:[`AMZ`,`MSFT`],a:`Name it in a CTE, or materialise it into a temporary table when it is genuinely expensive and reused — remembering that a CTE reference may be re-executed.`},{q:`What is the difference between a temp table and a CTE?`,d:2,p:`Subquery`,c:[`MSFT`,`AMZ`,`IBM`],a:`A temp table physically stores rows, can be indexed, and lives for the session — right when an intermediate is expensive and used many times. A CTE is just a named query, re-executed each reference.`},{q:`How do you compare each row to its group's aggregate without a window function?`,d:2,p:`Subquery`,c:[`AMZ`,`ORCL`],a:"Join to a grouped derived table: `JOIN (SELECT g, AVG(v) a FROM t GROUP BY g) x ON x.g = t.g WHERE t.v > x.a`. Cheaper than the correlated form because the aggregation runs once."},{q:`How do ROW_NUMBER, RANK and DENSE_RANK differ?`,d:1,p:`Window`,c:[`AMZ`,`META`,`GOOG`,`MSFT`],a:`ROW_NUMBER always distinct (1,2,3) and arbitrary on ties. RANK ties then skips (1,1,3). DENSE_RANK ties without skipping (1,1,2) — the right one for 'Nth highest distinct'.`},{q:`What does PARTITION BY do?`,d:1,p:`Window`,c:[`AMZ`,`META`,`UBER`],a:`Restarts the window calculation for each group, like GROUP BY but without collapsing rows — every input row still appears with its window value attached.`},{q:`Where can window functions appear in a query?`,d:2,p:`Window`,c:[`AMZ`,`GOOG`],a:`SELECT and ORDER BY only. Not WHERE, GROUP BY or HAVING, because those run first. Not nested inside each other either.`},{q:`Write a query for the top 3 rows per group.`,d:2,p:`Window`,c:[`AMZ`,`META`,`MSFT`,`FLPK`],a:"`DENSE_RANK() OVER (PARTITION BY g ORDER BY v DESC)` in a subquery, filtered to `<= 3`. Use ROW_NUMBER for exactly three rows regardless of ties."},{q:`What is the default window frame and why does it matter?`,d:3,p:`Window`,c:[`GOOG`,`AMZ`,`META`],a:"With ORDER BY it is `RANGE UNBOUNDED PRECEDING TO CURRENT ROW`, which is why `SUM(x) OVER (ORDER BY d)` gives a running total rather than a group total."},{q:`ROWS versus RANGE in a frame?`,d:3,p:`Window`,c:[`GOOG`,`META`,`ORCL`],a:`ROWS counts physical rows; RANGE groups rows with equal sort keys as peers, giving them the same value. If your running total repeats on duplicate dates, you wanted ROWS.`},{q:`Why does LAST_VALUE return the current row's own value?`,d:3,p:`Window`,c:[`GOOG`,`AMZ`],a:"The default frame ends at CURRENT ROW. Extend it with `ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING`, or reverse the sort and use FIRST_VALUE."},{q:`Compute a running total.`,d:2,p:`Window`,c:[`AMZ`,`META`,`GS`],a:"`SUM(x) OVER (ORDER BY d ROWS UNBOUNDED PRECEDING)`. Be explicit about ROWS so duplicate sort keys do not share a cumulative value."},{q:`Compute a 7-day moving average.`,d:2,p:`Window`,c:[`META`,`UBER`,`AMZ`],a:"`AVG(x) OVER (ORDER BY d ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)`. Use `RANGE BETWEEN INTERVAL 6 DAY PRECEDING` if dates can be missing."},{q:`Compare each row to the previous one.`,d:2,p:`Window`,c:[`AMZ`,`META`,`UBER`],a:"`LAG(x) OVER (ORDER BY d)`. The first row is NULL — supply a default with `LAG(x, 1, 0)`. Guard percentage change with `NULLIF(prev, 0)`."},{q:`What is NTILE used for?`,d:2,p:`Window`,c:[`GOOG`,`MCK`,`AMZ`],a:`Splits rows into n roughly equal buckets — quartiles, deciles, percentile bands. Remainder rows go into the earlier buckets.`},{q:`Difference between PERCENT_RANK and CUME_DIST?`,d:3,p:`Window`,c:[`GOOG`,`DE`],a:"`PERCENT_RANK` = (rank−1)/(rows−1), so the top row is always 0. `CUME_DIST` = fraction of rows at or below this one, so the last row is always 1."},{q:`What does an empty OVER () do?`,d:2,p:`Window`,c:[`AMZ`,`META`],a:`Aggregates the entire result set and repeats it on every row — the clean way to add a grand total or compute each row's share of the whole.`},{q:`How do you name and reuse a window definition?`,d:2,p:`Window`,c:[`GOOG`,`ORCL`],a:"The `WINDOW w AS (PARTITION BY … ORDER BY …)` clause after HAVING, referenced as `OVER w`. Prevents duplicated definitions drifting apart and lets the engine reuse one sort."},{q:`Solve gaps and islands: find runs of consecutive dates.`,d:3,p:`Window`,c:[`META`,`GOOG`,`AMZ`],a:"`date − ROW_NUMBER()` is constant within a run, so it becomes a group key. Deduplicate dates first or repeated entries split the run."},{q:`Sessionize an event stream with a 30-minute inactivity gap.`,d:3,p:`Window`,c:[`META`,`UBER`,`SNAP`],a:"Flag rows where the LAG gap exceeds 30 minutes, then `SUM(flag) OVER (PARTITION BY user ORDER BY ts)` to manufacture a session id, then GROUP BY it."},{q:`Find users active N days in a row.`,d:3,p:`Window`,c:[`META`,`GOOG`,`SNAP`],a:"Row-number-difference islands on distinct login dates, then `GROUP BY user, grp HAVING COUNT(*) >= N`."},{q:`Find three or more consecutive rows with the same value.`,d:2,p:`Window`,c:[`AMZ`,`META`],a:"`LAG(v,1)` and `LAG(v,2)` compared to `v`, or a triple self-join on consecutive ids. The self-join version assumes no gaps in the id sequence."},{q:`Are window functions faster than self-joins?`,d:2,p:`Window`,c:[`GOOG`,`AMZ`,`MSFT`],a:`Usually much. A correlated self-join for a running total is O(n²); a window makes one ordered pass. The cost is a sort per distinct window definition, removable with a matching index.`},{q:`How do you emulate ROW_NUMBER in MySQL 5.7?`,d:3,p:`Window`,c:[`AMZ`,`INFY`,`TCS`],a:"A correlated count, or user variables (`@rn := @rn + 1`) — the latter is officially undefined behaviour because select-list evaluation order is not guaranteed, so prefer the correlated form."},{q:`Can you use DISTINCT inside a window aggregate?`,d:3,p:`Window`,c:[`GOOG`,`META`],a:"Not in MySQL — `COUNT(DISTINCT x) OVER (…)` is unsupported, and rolling distinct counts are not decomposable anyway. Use a correlated subquery, a pre-aggregated table, or HyperLogLog at scale."},{q:`Rank within a group after aggregating.`,d:2,p:`Window`,c:[`AMZ`,`UBER`],a:"Windows are evaluated after GROUP BY, so `RANK() OVER (ORDER BY SUM(x) DESC)` in the same query ranks the grouped results — no subquery needed."},{q:`Compute a cumulative percentage for a Pareto chart.`,d:3,p:`Window`,c:[`AMZ`,`MCK`,`DELOITTE`],a:"`SUM(v) OVER (ORDER BY v DESC) / SUM(v) OVER ()`. The row where it first exceeds 80% marks the vital few."},{q:`Compute a year-over-year comparison.`,d:2,p:`Window`,c:[`AMZ`,`META`,`WALM`],a:"`LAG(revenue, 12) OVER (ORDER BY month)` on a dense monthly series. Ensure the series has no missing months first, or the offset silently compares the wrong periods."}],fe=[{q:`How do you concatenate strings in MySQL, PostgreSQL and SQL Server?`,d:1,p:`String`,c:[`TCS`,`ORCL`,`MSFT`],a:"MySQL `CONCAT(a,b)` (the `||` operator means OR unless PIPES_AS_CONCAT is set). PostgreSQL and Oracle use `||`. SQL Server uses `+` or `CONCAT`."},{q:`Difference between CONCAT and CONCAT_WS?`,d:1,p:`String`,c:[`AMZ`,`TCS`],a:"`CONCAT` returns NULL if any argument is NULL; `CONCAT_WS(sep, …)` skips NULLs and inserts the separator only between present values — the right tool for optional fields."},{q:`Extract a substring by position.`,d:1,p:`String`,c:[`TCS`,`INFY`,`COG`],a:"`SUBSTRING(s, pos, len)`, 1-indexed; omit len to run to the end. A negative pos counts from the right. Position 0 returns an empty string."},{q:`Extract the domain from an email address.`,d:2,p:`String`,c:[`AMZ`,`ZOHO`,`TCS`],a:"`SUBSTRING_INDEX(email, '@', -1)`. Nest two calls to get the part between two delimiters. PostgreSQL has `split_part`."},{q:`How do you trim characters other than spaces?`,d:1,p:`String`,c:[`TCS`,`ADBE`],a:"`TRIM(BOTH 'x' FROM col)`, or `LEADING`/`TRAILING`. Plain `TRIM(col)` removes spaces only."},{q:`Difference between LENGTH and CHAR_LENGTH?`,d:2,p:`String`,c:[`AMZ`,`GOOG`,`SAP`],a:"`LENGTH` counts bytes, `CHAR_LENGTH` counts characters. Under utf8mb4 an emoji is 1 character and 4 bytes — using LENGTH for validation rejects legitimate input."},{q:`Pad a number to a fixed width with leading zeros.`,d:1,p:`String`,c:[`TCS`,`INFY`],a:"`LPAD(id, 8, '0')`. `RPAD` pads on the right. Both truncate if the value is longer than the target width."},{q:`Replace all occurrences of a substring.`,d:1,p:`String`,c:[`TCS`,`CAP`],a:"`REPLACE(s, from, to)` — replaces every occurrence, is case-sensitive on binary collations and case-insensitive on `_ci` ones."},{q:`How do you do case-insensitive comparison in MySQL?`,d:2,p:`String`,c:[`AMZ`,`MSFT`],a:"It is already case-insensitive under the default `_ci` collation. Under `_bin`/`_cs`, wrap in `LOWER()` — but that kills the index, so prefer a generated lowercase column with its own index."},{q:`Match a pattern with a regular expression.`,d:2,p:`String`,c:[`AMZ`,`GOOG`],a:"`col REGEXP '^[0-9]{3}-[0-9]{4}$'`. Anchor with `^` and `$` or it matches anywhere. MySQL 8 adds `REGEXP_SUBSTR`, `REGEXP_REPLACE`, `REGEXP_LIKE`. Never sargable."},{q:`Reverse a string and test for a palindrome.`,d:1,p:`String`,c:[`TCS`,`ZOHO`,`WIPRO`],a:"`WHERE LOWER(s) = LOWER(REVERSE(s))`. Full-table operation; no index can help, so compute and store the flag if it matters."},{q:`Split a delimited column into rows.`,d:3,p:`String`,c:[`AMZ`,`TCS`],a:"MySQL: a recursive CTE peeling one item at a time, or `JSON_TABLE`. PostgreSQL `unnest(string_to_array(...))`. The real fix is to normalise — a delimited list violates 1NF."},{q:`Find rows where a column contains only digits.`,d:2,p:`String`,c:[`GS`,`AMZ`,`TCS`],a:"`col REGEXP '^[0-9]+$'`. Do not use `col = col + 0` — implicit conversion makes '5abc' equal 5, silently accepting bad data."},{q:`Capitalise the first letter of each word.`,d:2,p:`String`,c:[`TCS`,`INFY`],a:"MySQL has no `INITCAP` (Oracle and PostgreSQL do). Build it with `UPPER(LEFT(s,1)) || LOWER(SUBSTRING(s,2))` for one word; multi-word needs a split, which belongs in the application."},{q:`
