s a substitute for a real key."},{q:`Which engines support partial and functional indexes?`,d:2,p:`Index`,c:[`GOOG`,`MSFT`,`ORCL`],a:`PostgreSQL has both; SQL Server has filtered indexes; Oracle has function-based indexes. MySQL 8 has functional indexes but no partial index — emulate with a generated column that is NULL for excluded rows.`},{q:`How do MySQL and PostgreSQL differ on default isolation?`,d:2,p:`Txn`,c:[`AMZ`,`GOOG`],a:`MySQL REPEATABLE READ (and blocks phantoms via next-key locks); PostgreSQL READ COMMITTED, where each statement sees a fresh snapshot. Identical application code can behave differently.`},{q:`A query filters on A and sorts on B. Which index?`,d:3,p:`Index`,c:[`AMZ`,`GOOG`,`META`],a:"One composite index `(A, B)`. The engine seeks the A value and reads B in order, removing the filesort. Two separate indexes cannot do this."},{q:`A query filters on A = ? AND B > ? and sorts on C. What index?`,d:3,p:`Index`,c:[`GOOG`,`AMZ`],a:"`(A, B)` or `(A, C)` — not `(A, B, C)`, because once the range on B is used, C cannot be read in order. Choose based on whether the range or the sort is more selective; sometimes both indexes and measurement are needed."},{q:`Why does the optimiser ignore my index?`,d:3,p:`Index`,c:[`AMZ`,`ORCL`,`MSFT`],a:"Because it estimates a scan is cheaper — usually low selectivity (matching a large fraction of rows), stale statistics, an implicit type conversion, or a function wrapping the column. Check `EXPLAIN` and run `ANALYZE TABLE` before forcing anything."},{q:`When is FORCE INDEX justified?`,d:3,p:`Index`,c:[`AMZ`,`UBER`],a:`Almost never as a permanent fix — it freezes a decision that data changes will invalidate. Use it to prove a hypothesis during diagnosis, then fix the underlying cause (statistics, index design, sargability).`},{q:`What is index merge?`,d:3,p:`Index`,c:[`AMZ`,`ORCL`],a:"The optimiser uses two separate indexes for an OR or AND predicate and merges the row sets. It is usually a sign that a proper composite index is missing, and it often loses to a `UNION` rewrite."},{q:`How do you index for a LIKE 'prefix%' search?`,d:2,p:`Index`,c:[`AMZ`,`GOOG`],a:`An ordinary B-tree on the column works, because a prefix is a range. A leading wildcard cannot use it — store a reversed copy, extract the searched part into its own column, or use a full-text index.`},{q:`Does an index on (a, b) help a query ordering by a DESC, b DESC?`,d:3,p:`Index`,c:[`GOOG`,`MSFT`],a:"Yes — the engine can read the index backwards when **all** keys reverse together. Mixed directions (`a ASC, b DESC`) need a descending index, supported properly only from MySQL 8."},{q:`Why is my index bigger than my table?`,d:2,p:`Index`,c:[`AMZ`,`GOOG`],a:"Too many indexes, wide composite indexes, or a large primary key that every secondary index carries. Audit with `sys.schema_unused_indexes` and consider whether a narrower covering index replaces two others."},{q:`What happens to indexes during a bulk insert?`,d:2,p:`Perf`,c:[`AMZ`,`WALM`],a:`Each is updated per row, which dominates the cost. For very large loads, drop secondary indexes, load, then rebuild — the rebuild is a sequential sort rather than millions of random B-tree updates.`},{q:`Why is an INSERT with a random UUID primary key slow?`,d:3,p:`Index`,c:[`AMZ`,`GOOG`,`UBER`],a:"Random keys land at random points in the clustered index, causing page splits and defeating the buffer pool's locality. Use a sequential id, or UUIDv7 / `UUID_TO_BIN(u, 1)` which reorders the timestamp bytes to be monotonic."},{q:`How do you find missing indexes?`,d:2,p:`Perf`,c:[`AMZ`,`MSFT`],a:"Look for a high rows-examined to rows-sent ratio in `sys.statement_analysis`, enable `log_queries_not_using_indexes`, and check `EXPLAIN` for `type = ALL`. SQL Server also exposes a missing-index DMV, which suggests candidates rather than truths."},{q:`Your query returns 10 rows but examines 2 million. What is wrong?`,d:2,p:`Perf`,c:[`AMZ`,`GOOG`,`META`],a:"The filter cannot use an index — non-sargable predicate, missing index, or the sort forces a full read before `LIMIT` applies. The ratio itself is the diagnostic."},{q:`How would you speed up a report that takes 10 minutes and runs hourly?`,d:3,p:`Perf`,c:[`AMZ`,`WALM`,`DELOITTE`],a:`Precompute it: an incrementally refreshed summary table covering only recent partitions. Optimising the ad-hoc query buys a constant factor; materialising the result changes the complexity of the workload.`},{q:`How do you handle a table that has grown to 500 GB?`,d:3,p:`Ops`,c:[`AMZ`,`UBER`,`GOOG`],a:`Archive or partition by date and drop old partitions; move cold columns to a side table; compress; and check whether the workload actually needs all of it online. Sharding is the last resort, not the first.`},{q:`Why does the same query run fast for one parameter and slow for another?`,d:3,p:`Perf`,c:[`MSFT`,`ORCL`,`AMZ`],a:`Parameter-sensitive plans: a selective value suits an index seek while a common value suits a scan, and the cached plan fits only one. Histograms help the optimiser distinguish; SQL Server calls the pathology parameter sniffing.`},{q:`What is a histogram in the optimiser and when do you need one?`,d:3,p:`Perf`,c:[`ORCL`,`AMZ`,`MSFT`],a:"A distribution summary for a column, letting the optimiser estimate selectivity for skewed data instead of assuming uniformity. MySQL 8: `ANALYZE TABLE t UPDATE HISTOGRAM ON col`. Needed when one value dominates a column."},{q:`How does LIMIT interact with ORDER BY on a large table?`,d:2,p:`Perf`,c:[`AMZ`,`GOOG`],a:"If no index provides the order, the server sorts everything and then takes n — `LIMIT` does not reduce the work. With a matching index it stops after n rows. This is why the right composite index turns seconds into milliseconds."},{q:`Why can adding a WHERE clause make a query slower?`,d:3,p:`Perf`,c:[`GOOG`,`ORCL`],a:"It can change the plan — the optimiser may switch from a covering index scan to an index it thinks is more selective, then pay for bookmark lookups. Estimated versus actual row counts in `EXPLAIN ANALYZE` reveal it."},{q:`What is the cost of ORDER BY RAND()?`,d:2,p:`Perf`,c:[`AMZ`,`GOOG`],a:`It assigns a random value to every row, sorts them all, then takes n — O(n log n) over the whole table. Sample by picking a random key in the id range, or precompute a random column with an index.`},{q:`How do you profile a single query in MySQL?`,d:2,p:`Perf`,c:[`AMZ`,`ORCL`],a:"`EXPLAIN ANALYZE` for actual per-operator timings and row counts, `performance_schema.events_stages_history` for phase breakdown, and `SHOW STATUS LIKE 'Handler%'` before and after to see rows actually read."},{q:`What does a high Handler_read_rnd_next indicate?`,d:3,p:`Perf`,c:[`AMZ`,`ORCL`],a:"Many sequential reads of the data file — i.e. full table scans. Compare against `Handler_read_key` (index lookups); a bad ratio points straight at missing indexes."},{q:`How do you decide between adding an index and rewriting the query?`,d:3,p:`Perf`,c:[`GOOG`,`AMZ`],a:`If the predicate is non-sargable, rewrite first — no index can help until it is. If it is sargable and still scanning, index. If the query does inherently too much work (fan-out, N+1, unnecessary DISTINCT), neither helps until the shape changes.`},{q:`What is the difference between logical and physical reads?`,d:2,p:`Perf`,c:[`ORCL`,`MSFT`],a:`Logical reads hit the buffer pool; physical reads hit disk. A query with few physical reads may still be slow if it does millions of logical reads — the buffer pool hides I/O, not CPU.`},{q:`Why might a query be slow only in production?`,d:2,p:`Perf`,c:[`AMZ`,`META`,`ATLS`],a:"Data volume and distribution differ, statistics differ, the buffer pool is cold or contended, concurrent load causes lock waits, and production may run a different engine version or `sql_mode`. Reproduce with production-shaped data, not production-shaped code."}],T=[{q:`TCS — What is SQL and what are its sublanguages?`,d:1,p:`Theory`,c:[`TCS`,`INFY`,`WIPRO`,`CAP`],a:`Structured Query Language, the standard language for relational databases. Sublanguages: DDL (define), DML (manipulate), DQL (query), DCL (permissions), TCL (transactions).`},{q:`Infosys — What is a self join and give a use case.`,d:1,p:`Joins`,c:[`INFY`,`TCS`,`COG`],a:`A table joined to itself with two aliases. Used for hierarchies (employee/manager), finding pairs, and comparing rows within a table.`},{q:`Wipro — What is the difference between UNION and JOIN?`,d:1,p:`Set`,c:[`WIPRO`,`TCS`,`ACC`],a:`A JOIN combines columns from different tables **side by side** on a matching condition. A UNION stacks rows from two result sets **on top of each other** and requires matching column counts and types.`},{q:`Cognizant — Can a table have more than one primary key?`,d:1,p:`DDL`,c:[`COG`,`TCS`,`CAP`],a:`No — one primary key per table, though it may span several columns as a composite key. Additional uniqueness rules are expressed with UNIQUE constraints.`},{q:`Capgemini — What is a composite primary key and when do you use one?`,d:1,p:`DDL`,c:[`CAP`,`TCS`,`ACC`],a:"A primary key of two or more columns, most commonly on a junction table where `(a_id, b_id)` prevents duplicate relationships declaratively."},{q:`Accenture — What is an alias and where can it be used?`,d:1,p:`Basics`,c:[`ACC`,`TCS`],a:"A temporary name via `AS`, for columns or tables. Column aliases are usable in ORDER BY (and in MySQL, GROUP BY/HAVING) but not in WHERE, which runs first."},{q:`IBM — What is a schema and what does it contain?`,d:1,p:`Theory`,c:[`IBM`,`TCS`,`SAP`],a:`A namespace holding tables, views, indexes, procedures and permissions. In MySQL it is a synonym for database; in PostgreSQL and Oracle a database contains many schemas.`},{q:`HCL — What is the difference between CHAR and VARCHAR?`,d:1,p:`Numeric`,c:[`HCL`,`TCS`,`TECHM`],a:`CHAR is fixed width and space-padded; VARCHAR stores the actual length plus a small prefix. CHAR is only efficient for genuinely fixed values such as country codes or fixed-length hashes.`},{q:`Tech Mahindra — How do you find the third highest salary?`,d:1,p:`Advanced`,c:[`TECHM`,`TCS`,`INFY`],a:"`DENSE_RANK() = 3` over distinct salaries, `LIMIT 1 OFFSET 2` on distinct values, or the portable correlated count where exactly 2 distinct salaries are greater."},{q:`Zoho — Write a query to display the current date and time.`,d:1,p:`Date`,c:[`ZOHO`,`TCS`],a:"`SELECT NOW()`, `CURDATE()`, `CURTIME()`. `NOW()` is evaluated once per statement; `SYSDATE()` is evaluated per call, which matters inside a long statement."},{q:`Deloitte — What is a data warehouse and how does it differ from a database?`,d:2,p:`Norm`,c:[`DELOITTE`,`SAP`,`MCK`],a:`A warehouse stores historical, integrated, subject-oriented data optimised for analysis — denormalised star schemas, columnar storage, batch loads. An operational database is normalised and tuned for many small concurrent transactions.`},{q:`EPAM — What is an ER diagram and what do the cardinalities mean?`,d:1,p:`Norm`,c:[`EPAM`,`TCS`,`IBM`],a:`A model of entities, attributes and relationships. Cardinality states how many instances relate — one-to-one, one-to-many, many-to-many — and drives whether you need a foreign key or a junction table.`},{q:`Amazon — Write a query for the top 5 products by revenue per category.`,d:2,p:`Advanced`,c:[`AMZ`,`WALM`],a:"Aggregate revenue per (category, product) in a CTE, then `DENSE_RANK() OVER (PARTITION BY category ORDER BY revenue DESC) <= 5`. Cover the aggregation with an index on `order_items(product_id, qty, unit_price)`."},{q:`Amazon — How do you handle a query joining a 2-billion-row fact table?`,d:3,p:`Perf`,c:[`AMZ`,`GOOG`],a:`Filter the fact table first with a partition-pruned date range, index the join key, use a covering index, and consider a pre-aggregated summary. Never let a scan of the fact table be the driving step.`},{q:`Amazon — Design the schema for an e-commerce order system.`,d:2,p:`Norm`,c:[`AMZ`,`FLPK`,`WALM`],a:`customers, addresses, products, orders, order_items, payments, shipments. Snapshot the price and address onto the order because they must not change retroactively. Money as DECIMAL; status transitions in an append-only event table.`},{q:`Microsoft — Explain the difference between a clustered and non-clustered index with an example.`,d:2,p:`Index`,c:[`MSFT`,`AMZ`],a:`Clustered stores the rows in key order — one per table. Non-clustered stores keys plus a pointer, so retrieving other columns costs a lookup. Adding those columns to the index makes it covering and removes the lookup.`},{q:`Microsoft — How would you find the employee with the second highest salary in each department without window functions?`,d:3,p:`Advanced`,c:[`MSFT`,`AMZ`],a:`Correlated count: exactly one distinct salary in the same department is greater. Reframing 'Nth highest' as a count of greater values removes the need for ranking entirely.`},{q:`Meta — Write a query to compute 7-day retention.`,d:3,p:`Advanced`,c:[`META`,`SNAP`],a:`Take each user's signup date, LEFT JOIN activity where the activity date is exactly signup + 7 days, and count distinct returning users over the cohort size. Define whether 'day 7' means exactly or within.`},{q:`Meta — Find users who logged in on consecutive days.`,d:3,p:`Window`,c:[`META`,`GOOG`],a:"Gaps and islands on distinct login dates: `date − ROW_NUMBER()` is constant within a streak, then group and filter on the length."},{q:`Meta — How do you compute the median session duration?`,d:3,p:`Advanced`,c:[`META`,`SNAP`],a:`Sessionize with a LAG gap flag and a running sum, aggregate to one duration per session, then apply the double-ranking median technique.`},{q:`Google — How do you paginate 50 million rows efficiently?`,d:3,p:`Perf`,c:[`GOOG`,`AMZ`,`UBER`],a:"Keyset pagination on an indexed sort key — `WHERE (sort_col, id) < (?, ?)` — which is constant time at any depth. OFFSET is O(offset) and unstable under concurrent inserts."},{q:`Google — When would you denormalize, and what do you give up?`,d:3,p:`Norm`,c:[`GOOG`,`AMZ`],a:`After measuring, on a read-dominated path, with one code path maintaining the copy. You give up the guarantee that the derived value cannot diverge — which is why a covering index or summary table is preferable when it suffices.`},{q:`Google — Explain how you would shard this table and what breaks.`,d:3,p:`Ops`,c:[`GOOG`,`UBER`,`AMZ`],a:`Pick a shard key aligned with the dominant access pattern (usually customer or tenant id) to keep queries single-shard. You lose cross-shard joins, cross-shard transactions and global auto-increment; you gain write scaling.`},{q:`Uber — Design a query to find surge periods per city.`,d:3,p:`Advanced`,c:[`UBER`,`SWGY`],a:`Bucket requests into time windows per city, compute a rolling baseline with a window function excluding the current bucket, and flag buckets exceeding a multiple of it. Islands then merge adjacent flagged buckets into surge periods.`},{q:`Uber — How do you implement a job queue in SQL safely?`,d:3,p:`Txn`,c:[`UBER`,`ATLS`,`AMZ`],a:"`SELECT … FOR UPDATE SKIP LOCKED LIMIT 1` inside a transaction, then update the status and commit. Plain SELECT races; plain FOR UPDATE serialises workers instead of parallelising them."},{q:`Flipkart — Find products that are in stock but never ordered.`,d:2,p:`Joins`,c:[`FLPK`,`AMZ`,`WALM`],a:"`WHERE stock > 0 AND NOT EXISTS (SELECT 1 FROM order_items WHERE product_id = p.product_id)`. Index `order_items(product_id)` or each probe is a scan."},{q:`Swiggy — Compute average delivery time per restaurant per hour.`,d:2,p:`Date`,c:[`SWGY`,`ZOMT`,`UBER`],a:"`AVG(TIMESTAMPDIFF(MINUTE, order_time, delivered_at))` grouped by restaurant and `HOUR(order_time)`, with the date range filtered on the bare column."},{q:`PayPal — How do you guarantee a payment is never processed twice?`,d:3,p:`Txn`,c:[`PYPL`,`GS`,`AMZ`],a:`An idempotency key with a unique constraint: insert the key first, and a duplicate request fails the constraint rather than re-processing. Combine with a transaction so the insert and the effect commit together.`},{q:`Goldman Sachs — Compute a daily running P&L per trader.`,d:3,p:`Window`,c:[`GS`,`JPMC`,`MS`],a:"`SUM(pnl) OVER (PARTITION BY trader ORDER BY trade_date ROWS UNBOUNDED PRECEDING)` over a per-day aggregate, with a dense calendar so non-trading days do not silently disappear."},{q:`Goldman Sachs — Why must financial calculations avoid FLOAT?`,d:2,p:`Numeric`,c:[`GS`,`JPMC`,`MS`],a:`Binary floating point cannot represent decimal fractions exactly, so reconciliations that should net to zero do not, and equality comparisons fail. Use DECIMAL or integer minor units.`},{q:`JPMorgan — How would you audit every change to a sensitive table?`,d:2,p:`Security`,c:[`JPMC`,`GS`,`DELOITTE`],a:"AFTER triggers writing OLD and NEW plus `CURRENT_USER()` and a timestamp into an append-only audit table, or the server audit plugin. Application logging alone misses direct database access."},{q:`Atlassian — Design a schema for a permissions system.`,d:3,p:`Norm`,c:[`ATLS`,`SFDC`,`MSFT`],a:`users, roles, permissions, plus junction tables user_roles and role_permissions. Resolve effective permissions with a join, cache it, and model resource-scoped grants with an additional resource column on the grant table.`},{q:`Salesforce — How would you support user-defined custom fields?`,d:3,p:`Norm`,c:[`SFDC`,`SAP`,`ATLS`],a:`A JSON column with functional indexes on the few queried keys, or a fixed set of spare typed columns, or EAV as a last resort. EAV loses typing, constraints and cardinality estimates — say why before proposing it.`},{q:`Netflix — How do you compute the top 10 most watched titles per country per day?`,d:3,p:`Advanced`,c:[`NFLX`,`AMZ`,`META`],a:`Pre-aggregate views per (day, country, title) in a summary table, then rank within each partition. Ranking directly over the raw event table is not viable at that volume.`},{q:`Bloomberg — Return the latest price per instrument as of a given timestamp.`,d:3,p:`Advanced`,c:[`BLMB`,`GS`,`MS`],a:"`NOT EXISTS` a later row at or before the cutoff, or `ROW_NUMBER() OVER (PARTITION BY instrument ORDER BY ts DESC) = 1` after filtering `ts <= cutoff`. Index `(instrument, ts)`."},{q:`Adobe — Delete duplicate rows keeping one, without a unique key.`,d:2,p:`DML`,c:[`ADBE`,`AMZ`,`TCS`],a:"Self join on the duplicate columns with `b.id < a.id` and delete the higher ids, or use `ROW_NUMBER() > 1` in a doubly-nested subquery. Then add the constraint."},{q:`Oracle — What is a PL/SQL block and its structure?`,d:2,p:`Proc`,c:[`ORCL`,`IBM`,`TCS`],a:"`DECLARE … BEGIN … EXCEPTION … END;` — declarations, executable statements, and an exception handler. It adds procedural control flow to SQL and is Oracle-specific."},{q:`SAP — What is the difference between a fact and a dimension table?`,d:1,p:`Norm`,c:[`SAP`,`DELOITTE`,`WALM`],a:`A fact table holds measures and foreign keys and is very tall; dimension tables hold descriptive attributes and are wide but short. Facts are queried by aggregation, dimensions by filtering and grouping.`},{q:`VMware — How do you detect and resolve a table lock in production?`,d:3,p:`Txn`,c:[`VMW`,`AMZ`,`ORCL`],a:"`performance_schema.data_lock_waits` joined to `data_locks` and `processlist` identifies the blocker; `SHOW ENGINE INNODB STATUS` shows the latest deadlock. Kill the blocking transaction, then fix the missing index that caused an over-broad lock."},{q:`Intuit — How do you version rows so history is queryable?`,d:3,p:`Norm`,c:[`INTU`,`GS`,`SFDC`],a:"Slowly-changing-dimension type 2: `valid_from`, `valid_to` and an `is_current` flag, with a unique partial index on the current row. Point-in-time queries then filter on the validity range."},{q:`Cisco — What is the difference between a hot and cold backup?`,d:2,p:`Ops`,c:[`CSCO`,`ORCL`,`IBM`],a:`A hot backup runs while the database serves traffic (xtrabackup, snapshots with log tracking); a cold backup requires shutdown. Hot backups need the engine's cooperation to produce a consistent point-in-time image.`},{q:`D.E. Shaw — Compute a correlation between two columns in SQL.`,d:3,p:`Advanced`,c:[`DE`,`MCK`,`GS`],a:"Pearson's r expands to sums: `(n*Σxy − Σx*Σy) / SQRT((n*Σx² − (Σx)²)*(n*Σy² − (Σy)²))`. PostgreSQL has `CORR()` built in; MySQL does not."},{q:`McKinsey QuantumBlack — Bucket customers into value tiers and report the mix.`,d:2,p:`Advanced`,c:[`MCK`,`DELOITTE`],a:"`NTILE(4)` or a CASE ladder over per-customer spend, then group by the tier and compute counts and share with a window total."},{q:`Walmart — Compute year-over-year same-store sales.`,d:3,p:`Advanced`,c:[`WALM`,`AMZ`],a:"Aggregate per store-month, restrict to stores present in both periods (an inner join on store between the two years), then compare with `LAG(revenue, 12)`. The 'same store' restriction is the part candidates forget."},{q:`Dropbox — Find files shared with users who no longer have access.`,d:2,p:`Joins`,c:[`DBX`,`ATLS`],a:"Anti-join the share table against the current permission table with `NOT EXISTS`. A recurring data-quality query, not a one-off — schedule it and alert."},{q:`Snap — Compute the average number of sessions per user per week.`,d:3,p:`Advanced`,c:[`SNAP`,`META`],a:`Sessionize with a gap flag and running sum, count sessions per (user, week), then average across users — averaging the per-user values, not dividing total sessions by total users, if the metric is per-user.`},{q:`Freshworks — Return tickets with no response within SLA.`,d:2,p:`Advanced`,c:[`FRSH`,`ATLS`,`ZOHO`],a:"LEFT JOIN the first response per ticket (a ranked subquery) and filter where it is NULL or later than `created_at + sla_interval`."},{q:`Paytm — Detect duplicate transactions within a short window.`,d:3,p:`Advanced`,c:[`PAYTM`,`PYPL`,`PHPE`],a:"Self join on (user, amount, merchant) with a timestamp difference under the threshold and `b.id > a.id`, or `LAG` over the ordered per-user stream. The real fix is an idempotency key with a unique constraint."},{q:`PhonePe — Reconcile two ledgers and report mismatches.`,d:3,p:`Advanced`,c:[`PHPE`,`GS`,`PAYTM`],a:"Full outer join on the transaction key (emulated in MySQL), compare amounts null-safely with `<=>`, and classify each row as missing-left, missing-right or amount-mismatch."},{q:`Zomato — Rank restaurants by rating with a minimum review count.`,d:2,p:`Aggregate`,c:[`ZOMT`,`SWGY`,`AMZ`],a:"`GROUP BY restaurant HAVING COUNT(*) >= 50 ORDER BY AVG(rating) DESC`. Without the HAVING, a single 5-star review outranks everything — a Bayesian average is the better production answer."},{q:`Dell — What is the impact of adding a column to a 200 GB table?`,d:3,p:`DDL`,c:[`DELL`,`AMZ`,`ORCL`],a:"With `ALGORITHM=INSTANT` it is metadata-only and instant. Otherwise it rebuilds the table — hours of lock. Always specify the algorithm so an unsupported change errors instead of silently locking."},{q:`Qualcomm — How do you store and query time-series sensor data?`,d:3,p:`Ops`,c:[`QCOM`,`CSCO`,`GOOG`],a:"Partition by time, index `(device_id, ts)`, downsample into rollup tables for long ranges, and drop old partitions rather than deleting rows. A purpose-built time-series store is often the right answer above a certain volume."}],E=[{q:`Return employees whose name starts with a vowel.`,d:1,p:`String`,c:[`TCS`,`ZOHO`],a:"`WHERE LEFT(LOWER(name),1) IN ('a','e','i','o','u')` or `name REGEXP '^[aeiou]'`. Neither is sargable — acceptable on small tables, not on millions of rows."},{q:`Find names containing a literal percent sign.`,d:2,p:`String`,c:[`TCS`,`AMZ`],a:"`WHERE name LIKE '%\\%%' ESCAPE '\\\\'`, or use `INSTR(name, '%') > 0` which needs no escaping at all."},{q:`Return the last 4 characters of a column.`,d:1,p:`String`,c:[`TCS`,`GS`],a:"`RIGHT(col, 4)` or `SUBSTRING(col, -4)` — a negative start position counts from the end."},{q:`Count occurrences of a character in a string.`,d:2,p:`String`,c:[`ZOHO`,`TCS`],a:"`CHAR_LENGTH(s) - CHAR_LENGTH(REPLACE(s, 'a', ''))` — the length difference is the count. For multi-character substrings, divide by the substring length."},{q:`Mask all but the last four digits of a card number.`,d:2,p:`String`,c:[`PYPL`,`GS`,`JPMC`],a:"`CONCAT(REPEAT('*', CHAR_LENGTH(c) - 4), RIGHT(c, 4))`. Better still, never store the full number — store a token."},{q:`Normalise phone numbers by stripping formatting.`,d:2,p:`String`,c:[`AMZ`,`TCS`],a:"`REGEXP_REPLACE(phone, '[^0-9]', '')` in MySQL 8; nested `REPLACE` calls before that. Store the normalised form in a generated column and index it."},{q:`Split a full name into first and last.`,d:2,p:`String`,c:[`TCS`,`INFY`,`CAP`],a:"`SUBSTRING_INDEX(name,' ',1)` and `SUBSTRING_INDEX(name,' ',-1)`. Fragile with middle names or single-word names — which is the argument for storing them as separate columns."},{q:`Find rows where two text columns differ only by case or whitespace.`,d:2,p:`String`,c:[`GS`,`DELOITTE`],a:"`WHERE a <> b AND LOWER(TRIM(a)) = LOWER(TRIM(b))` — a standard data-quality check before deduplication."},{q:`Return the position of a substring.`,d:1,p:`String`,c:[`TCS`,`ZOHO`],a:"`LOCATE(sub, str)` or `INSTR(str, sub)` — note the argument order is reversed between them. Both return 0 when absent, not NULL."},{q:`Concatenate a customer's address into one display line.`,d:1,p:`String`,c:[`TCS`,`AMZ`],a:"`CONCAT_WS(', ', line1, line2, city, postcode)` — skips NULL parts, unlike `CONCAT` which nulls the whole result."},{q:`Count orders per customer, showing zero for customers with none.`,d:2,p:`Joins`,c:[`TCS`,`AMZ`,`INFY`],a:"LEFT JOIN and `COUNT(o.order_id)`. `COUNT(*)` would return 1 for the NULL-padded row — the single most common bug in this pattern."},{q:`List customers with more than 3 orders in the last month.`,d:2,p:`Aggregate`,c:[`AMZ`,`FLPK`],a:"Filter the date range in WHERE, `GROUP BY cust_id HAVING COUNT(*) > 3`. Row filter in WHERE, group filter in HAVING."},{q:`Find the employee count per manager including managers with none.`,d:2,p:`Joins`,c:[`AMZ`,`TCS`],a:"Self LEFT JOIN from the manager side and `COUNT(e.emp_id)`. The direction of the join decides which side is preserved."},{q:`Return each order with its line count and total.`,d:2,p:`Joins`,c:[`AMZ`,`FLPK`],a:`Join to an aggregated derived table on order_items, or use two correlated scalar subqueries. Joining the line items directly and grouping also works, but breaks if you later join a second child table.`},{q:`List all products with their category name, including uncategorised ones.`,d:1,p:`Joins`,c:[`TCS`,`WALM`],a:"LEFT JOIN categories, and `COALESCE(c.name,'Uncategorised')` for display. An inner join would silently hide products with a NULL category."},{q:`Find customers in the same city as customer 42.`,d:1,p:`Subquery`,c:[`TCS`,`AMZ`],a:"`WHERE city = (SELECT city FROM customers WHERE cust_id = 42) AND cust_id <> 42`. Exclude the reference customer explicitly."},{q:`Return orders that contain both product A and product B.`,d:2,p:`Aggregate`,c:[`AMZ`,`WALM`],a:"`GROUP BY order_id HAVING SUM(product_id = A) > 0 AND SUM(product_id = B) > 0`. Two EXISTS clauses work too but scan twice."},{q:`Find categories where every product is out of stock.`,d:2,p:`Aggregate`,c:[`FLPK`,`WALM`],a:"`GROUP BY category HAVING MAX(stock) = 0`, or `SUM(stock > 0) = 0`. 'Every' becomes a condition on the group aggregate."},{q:`Return the number of distinct customers per product.`,d:1,p:`Aggregate`,c:[`AMZ`,`WALM`],a:"`COUNT(DISTINCT o.cust_id)` grouped by product across the joined order/item rows — DISTINCT is required because a customer may buy the product many times."},{q:`Show orders alongside the customer's lifetime order count.`,d:2,p:`Window`,c:[`AMZ`,`UBER`],a:"`COUNT(*) OVER (PARTITION BY cust_id)` — group context on every detail row without a join or a second query."},{q:`Find the day with the highest revenue in each month.`,d:3,p:`Window`,c:[`AMZ`,`WALM`],a:"Aggregate to daily revenue, then `ROW_NUMBER() OVER (PARTITION BY month ORDER BY revenue DESC) = 1`. Two levels of aggregation, then ranking."},{q:`Compute the difference between each row and the group's first value.`,d:2,p:`Window`,c:[`GS`,`META`],a:"`v - FIRST_VALUE(v) OVER (PARTITION BY g ORDER BY t)` — an indexed-to-baseline comparison, common in cohort and performance reporting."},{q:`Return the top row per group without window functions.`,d:3,p:`Advanced`,c:[`INFY`,`AMZ`,`TCS`],a:"Join back to a grouped `MAX` derived table (returns ties), or `NOT EXISTS` a greater row in the same group (no ties, and usually fastest with the right index)."},{q:`Compute a cumulative count of new users over time.`,d:2,p:`Window`,c:[`META`,`SNAP`],a:"Daily new-user counts, then `SUM(new) OVER (ORDER BY d ROWS UNBOUNDED PRECEDING)`. Generate a dense calendar first so flat days still appear."},{q:`Number rows restarting at each change of a value.`,d:3,p:`Window`,c:[`GOOG`,`AMZ`],a:"Islands: flag where the value differs from LAG, running-sum the flags into a group id, then `ROW_NUMBER() OVER (PARTITION BY group_id ORDER BY …)`."},{q:`Find the row before and after a given id in sort order.`,d:2,p:`Window`,c:[`AMZ`,`ATLS`],a:"`LAG(id)` and `LEAD(id)` over the sort order, filtered to the target row in an outer query. Common for 'previous / next article' navigation."},{q:`Calculate the percentage of total for each row.`,d:1,p:`Window`,c:[`AMZ`,`MCK`],a:"`100.0 * v / SUM(v) OVER ()` — the empty OVER gives the grand total on every row."},{q:`Compute a 3-row centred moving average.`,d:3,p:`Window`,c:[`GOOG`,`MCK`],a:"`AVG(v) OVER (ORDER BY t ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING)`. Endpoints average over fewer rows, which is usually acceptable — otherwise filter them out."},{q:`Return the earliest and latest order date overall.`,d:1,p:`Aggregate`,c:[`TCS`,`AMZ`],a:"`SELECT MIN(order_date), MAX(order_date) FROM orders` — one row, and with an index on order_date both are index-endpoint reads rather than scans."},{q:`Count how many orders fall into each amount band.`,d:2,p:`Aggregate`,c:[`AMZ`,`MCK`],a:"`GROUP BY CASE WHEN amount < 50 THEN '<50' WHEN amount < 200 THEN '50-199' ELSE '200+' END` — bucket in the expression and group on it."},{q:`Find months where revenue fell compared to the previous month.`,d:2,p:`Window`,c:[`AMZ`,`WALM`],a:"`WHERE revenue < LAG(revenue) OVER (ORDER BY month)` applied in an outer query, since windows cannot appear in WHERE."},{q:`List the products never sold in a given country.`,d:3,p:`Joins`,c:[`AMZ`,`WALM`],a:"`NOT EXISTS` a joined order/item/customer chain restricted to that country. Be explicit about whether products never sold anywhere should appear."},{q:`Find the average order value excluding the top and bottom 5%.`,d:3,p:`Advanced`,c:[`MCK`,`GS`],a:"Rank with `PERCENT_RANK()` or `NTILE(20)`, exclude the extreme buckets, then average — a trimmed mean, resistant to outliers."},{q:`Count rows added per day for the last 30 days including empty days.`,d:2,p:`Date`,c:[`META`,`AMZ`],a:"Generate the 30-day series with a recursive CTE, LEFT JOIN the facts, and `COUNT(fact.id)` so zero days show 0 rather than vanishing."},{q:`Return the most recent status per entity from an event log.`,d:2,p:`Advanced`,c:[`UBER`,`AMZ`,`ATLS`],a:"`ROW_NUMBER() OVER (PARTITION BY entity_id ORDER BY event_time DESC, event_id DESC) = 1`. Index `(entity_id, event_time)`."},{q:`Find entities whose status changed more than 5 times.`,d:2,p:`Aggregate`,c:[`UBER`,`ATLS`],a:"`GROUP BY entity_id HAVING COUNT(*) > 5` over the event log — or count only actual *changes* by comparing against LAG first, if repeated identical events exist."},{q:`Compute time spent in each status.`,d:3,p:`Window`,c:[`UBER`,`ATLS`,`SWGY`],a:"`LEAD(event_time) OVER (PARTITION BY entity ORDER BY event_time) - event_time` gives the duration of each status; the final row has no successor and needs NOW() or exclusion."},{q:`Find records inserted and deleted on the same day.`,d:2,p:`Date`,c:[`GS`,`DELOITTE`],a:"`WHERE DATE(deleted_at) = DATE(created_at)` — acceptable for an audit query on a small set, but wrap both in a range filter first so the scan is bounded."},{q:`Return only the first row of each duplicate group.`,d:2,p:`Advanced`,c:[`AMZ`,`ADBE`,`TCS`],a:"`ROW_NUMBER() OVER (PARTITION BY dup_key ORDER BY id) = 1`. The ORDER BY defines which copy is 'first' — state that choice explicitly."},{q:`Find keys present in one table but with different values in another.`,d:2,p:`Joins`,c:[`GS`,`DELOITTE`],a:"Inner join on the key and `WHERE NOT (a.v <=> b.v)` — the null-safe comparison catches value-vs-NULL differences that `<>` would miss."},{q:`Count rows matching each of several conditions in one pass.`,d:2,p:`Aggregate`,c:[`AMZ`,`META`],a:"Conditional aggregation: one `SUM(CASE WHEN … THEN 1 ELSE 0 END)` per condition. Far cheaper than several separate queries or a UNION."},{q:`Return a boolean flag for whether any matching row exists.`,d:1,p:`Subquery`,c:[`AMZ`,`ATLS`],a:"`SELECT EXISTS (SELECT 1 FROM t WHERE …)` returns 0 or 1 in one row and short-circuits at the first match."},{q:`Retrieve rows where a value appears in a comma-separated column.`,d:2,p:`String`,c:[`TCS`,`INFY`],a:"`FIND_IN_SET('x', col) > 0` in MySQL. It works and cannot use an index — the presence of this need means the schema should have a child table."},{q:`Return rows in a specific manual order given a list of ids.`,d:2,p:`Basics`,c:[`AMZ`,`ATLS`],a:"`ORDER BY FIELD(id, 5, 3, 9)` in MySQL, or join to a `VALUES` list carrying a sort position — the portable and index-friendlier option."},{q:`Limit results to one row per group, arbitrarily.`,d:2,p:`Advanced`,c:[`AMZ`,`GOOG`],a:"`ROW_NUMBER() … = 1` with an explicit ORDER BY. 'Arbitrarily' is rarely what you want — pick a deterministic rule or results change between runs."},{q:`Return the number of weekdays between two dates.`,d:3,p:`Date`,c:[`GS`,`JPMC`],a:"Count rows in a calendar table where `is_weekday` and the date falls in the range. Arithmetic on weekday numbers works for weekends but ignores holidays."},{q:`Detect rows where a numeric column is not a whole number.`,d:1,p:`Numeric`,c:[`GS`,`TCS`],a:"`WHERE v <> FLOOR(v)` or `WHERE MOD(v, 1) <> 0`. Careful with FLOAT, where the comparison itself can be unreliable."},{q:`Find the maximum of several columns in the same row.`,d:1,p:`Numeric`,c:[`TCS`,`ZOHO`],a:"`GREATEST(a, b, c)` and `LEAST(a, b, c)`. They return NULL if any argument is NULL, so wrap each in COALESCE if that is not intended."},{q:`Return rows where a column is within X% of another.`,d:2,p:`Numeric`,c:[`GS`,`MCK`],a:"`WHERE ABS(a - b) <= 0.05 * b` — and guard `b = 0` separately. Never compare computed floats for exact equality."}],_e=[{q:`How do you store a user's multiple phone numbers?`,d:1,p:`Norm`,c:[`TCS`,`AMZ`,`INFY`],a:"A child table `user_phones(user_id, phone, type)` with a foreign key. Columns `phone1, phone2, phone3` violate 1NF and break the moment someone needs a fourth."},{q:`How do you model an order that can have multiple statuses over time?`,d:2,p:`Norm`,c:[`AMZ`,`UBER`,`FLPK`],a:"A current status column on the order for fast reads plus an append-only `order_status_events` table for history. Deriving the current status from the log alone is correct but expensive on every read."},{q:`Where should you store a computed order total?`,d:2,p:`Norm`,c:[`AMZ`,`GS`],a:`Derive it from line items unless the historical value must be frozen — then store it explicitly as a snapshot and never recompute it. A stored total that can drift from its components is a classic bug.`},{q:`How do you handle currency in a multi-currency system?`,d:3,p:`Norm`,c:[`GS`,`PYPL`,`AMZ`],a:`Store the amount as DECIMAL, the currency code, and the exchange rate **used at the time** plus the converted base amount. Rates change, so recomputing history from today's rate silently rewrites the past.`},{q:`How do you store addresses that must not change on historical orders?`,d:2,p:`Norm`,c:[`AMZ`,`FLPK`],a:"Snapshot the address onto the order (or into an immutable `order_addresses` row). Referencing the customer's current address means an old invoice changes when they move."},{q:`Should you add a status column or a separate table per state?`,d:2,p:`Norm`,c:[`AMZ`,`ATLS`],a:`A status column with a constraint, plus an events table if history matters. Separate tables per state require moving rows between tables — losing the id, breaking foreign keys and complicating every query.`},{q:`What is the right primary key for a junction table?`,d:2,p:`DDL`,c:[`AMZ`,`TCS`],a:"The composite `(a_id, b_id)`, which enforces uniqueness declaratively. Add a reverse index `(b_id, a_id)` so lookups work from both directions."},{q:`How do you enforce that exactly one row per group is flagged as primary?`,d:3,p:`DDL`,c:[`ATLS`,`GOOG`,`SFDC`],a:"A partial unique index on `(group_id) WHERE is_primary` in PostgreSQL. In MySQL, a generated column that equals group_id when primary and NULL otherwise, with a unique index — since multiple NULLs are allowed."},{q:`How do you prevent negative stock?`,d:2,p:`DDL`,c:[`AMZ`,`WALM`,`FLPK`],a:"`CHECK (stock >= 0)` from MySQL 8.0.16, plus doing the decrement as `UPDATE … SET stock = stock - ? WHERE id = ? AND stock >= ?` so the check and the write are one atomic operation."},{q:`What is a lookup table and why prefer it to ENUM?`,d:1,p:`Norm`,c:[`TCS`,`AMZ`],a:`A small table of valid values referenced by a foreign key. Adding a value is an INSERT rather than an ALTER, it can carry extra attributes, sorting is explicit, and it is portable.`},{q:`How do you version a schema across environments?`,d:2,p:`Ops`,c:[`ATLS`,`AMZ`,`EPAM`],a:`Numbered, immutable, forward-only migration files in version control, applied by a tool that records what ran. Never edit an applied migration; never make manual changes in production.`},{q:`How do you deploy a column rename without breaking the app?`,d:3,p:`Ops`,c:[`GOOG`,`ATLS`,`AMZ`],a:`Expand-migrate-contract: add the new column, dual-write both, backfill, switch reads, stop writing the old, then drop it. Each deploy must be compatible with the previous code version.`},{q:`What breaks if a table has no primary key?`,d:2,p:`DDL`,c:[`AMZ`,`MSFT`],a:`InnoDB creates a hidden row id; row-based replication has to scan to locate rows, making replicas fall behind; and no stable way exists to reference a row. Always define one.`},{q:`How large should a VARCHAR be?`,d:1,p:`DDL`,c:[`TCS`,`AMZ`],a:"Only as large as genuinely needed. Storage is by actual length, but the declared maximum affects temporary tables and sort buffers, which allocate the full width — so `VARCHAR(255)` everywhere is not free."},{q:`What is the cost of an over-wide row?`,d:2,p:`Perf`,c:[`AMZ`,`ORCL`],a:`Fewer rows per 16 KB page means more pages read per query and less of the table cached. Splitting rarely-read wide columns into a 1:1 side table is vertical partitioning.`},{q:`Two users edit the same record simultaneously. How do you handle it?`,d:2,p:`Txn`,c:[`AMZ`,`ATLS`,`SFDC`],a:"Optimistic locking: carry a version or updated_at, and update `WHERE id = ? AND version = ?`. Zero rows affected means someone else won — show a conflict rather than overwriting."},{q:`How do you implement a counter that many clients increment?`,d:2,p:`Txn`,c:[`AMZ`,`PYPL`],a:"`UPDATE t SET n = n + 1 WHERE id = ?` — atomic. Under extreme contention, shard the counter into N rows and sum them, so writers do not queue on one row."},{q:`How do you reserve inventory without overselling?`,d:3,p:`Txn`,c:[`AMZ`,`FLPK`,`WALM`],a:"Conditional update in one statement: `UPDATE stock SET qty = qty - ? WHERE sku = ? AND qty >= ?`. Zero rows affected means insufficient stock. Check-then-act across two statements is a race."},{q:`Why does a long transaction slow down unrelated queries?`,d:3,p:`Txn`,c:[`AMZ`,`GOOG`],a:`It pins undo log entries so old row versions cannot be purged, growing the history list and forcing every reader to walk longer version chains. It also holds locks and blocks DDL.`},{q:`What happens if the application crashes mid-transaction?`,d:2,p:`Txn`,c:[`TCS`,`AMZ`,`GS`],a:`The connection drops and the server rolls the transaction back — atomicity guarantees no partial state. Uncommitted locks are released; committed work survives via the redo log.`},{q:`Why do I get 'Lock wait timeout exceeded'?`,d:2,p:`Txn`,c:[`AMZ`,`UBER`],a:"Another transaction holds a conflicting lock longer than `innodb_lock_wait_timeout` (default 50s). Usually a forgotten open transaction or an unindexed UPDATE locking far more rows than intended."},{q:`Difference between a deadlock and a lock wait timeout?`,d:2,p:`Txn`,c:[`AMZ`,`MSFT`],a:`A deadlock is a detected cycle — InnoDB immediately rolls back the cheaper victim with error 1213. A timeout is one-directional waiting that simply ran out of patience, error 1205. Both are retryable.`},{q:`Should the application retry on deadlock?`,d:2,p:`Txn`,c:[`AMZ`,`UBER`,`PYPL`],a:`Yes, with a bounded count and randomised backoff. Deadlocks are normal under concurrency and the loser's transaction is fully rolled back, so a clean retry is safe — provided the operation is idempotent or wholly inside the transaction.`},{q:`How do you make an operation idempotent?`,d:3,p:`Txn`,c:[`PYPL`,`AMZ`,`UBER`],a:`A client-supplied idempotency key with a unique constraint, inserted in the same transaction as the effect. A retry hits the constraint instead of repeating the work.`},{q:`When would you deliberately use READ UNCOMMITTED?`,d:2,p:`Txn`,c:[`AMZ`,`ORCL`],a:`Almost never. Occasionally for an approximate progress count on a long batch, where a dirty read is acceptable. Modern MVCC engines make it unnecessary because ordinary reads do not block.`},{q:`Why is SERIALIZABLE rarely used in MySQL?`,d:3,p:`Txn`,c:[`AMZ`,`ORCL`],a:"InnoDB implements it by turning every plain SELECT into a locking read, so concurrency collapses and deadlocks multiply. REPEATABLE READ with explicit `FOR UPDATE` where needed gives the same guarantees at far lower cost."},{q:`You have indexes on (a) and (a,b). Which can you drop?`,d:2,p:`Index`,c:[`AMZ`,`GOOG`,`MSFT`],a:"Drop `(a)` — the composite serves it via the leftmost prefix. Keeping both wastes space and slows every write for no read benefit."},{q:`Should you index every foreign key?`,d:2,p:`Index`,c:[`AMZ`,`ORCL`],a:`Yes — MySQL creates one automatically for declared FKs, but PostgreSQL does not. Without it, a parent DELETE or UPDATE has to scan the child table to check the referential action.`},{q:`How many indexes is too many?`,d:2,p:`Index`,c:[`AMZ`,`MSFT`],a:"There is no fixed number — the test is whether each is used. Every index slows writes and consumes buffer pool. Audit with `sys.schema_unused_indexes` and remove duplicates and prefixes."},{q:`How do you index a column used in both equality and range predicates?`,d:3,p:`Index`,c:[`GOOG`,`AMZ`],a:`Composite index with equality columns first, then the range column. Only one range column can be used for seeking; everything after it filters only.`},{q:`Why is my ORDER BY still doing a filesort despite an index?`,d:3,p:`Index`,c:[`AMZ`,`GOOG`],a:"The sort columns do not follow the equality columns in the same index, the directions are mixed, or the sort column comes from a different table. Check `Using filesort` in EXPLAIN and align the index."},{q:`How do you index for pagination?`,d:3,p:`Index`,c:[`GOOG`,`AMZ`,`UBER`],a:"One composite index on exactly the keyset columns `(sort_col, id)` in the same order and direction as the ORDER BY, so the engine can seek to the last position and read forward."},{q:`Does adding an index help a query that returns 60% of the table?`,d:2,p:`Index`,c:[`AMZ`,`ORCL`],a:`No — following an index for that many rows means mostly random reads, which is slower than a sequential scan. The optimiser will correctly ignore it.`},{q:`What is the trade-off of a very wide covering index?`,d:2,p:`Index`,c:[`AMZ`,`MSFT`],a:`Faster reads for that one query, but more disk, more buffer pool consumed, and slower writes. Cover the queries that matter, not every query.`},{q:`How would you index for a query joining three tables?`,d:3,p:`Index`,c:[`AMZ`,`GOOG`],a:"Index the join keys on the inner tables and the filter columns on the driving table, ideally as one composite covering the filter plus the join key. Then check `EXPLAIN` to confirm the driving order matches your assumption."},{q:`What happens to an index when you update the indexed column?`,d:2,p:`Index`,c:[`AMZ`,`ORCL`],a:"The old entry is deleted and a new one inserted at the new position — potentially causing page splits. Frequently updated columns are expensive to index, which is why an `updated_at` index costs more than it looks."},{q:`The database is at 95% CPU. What do you check first?`,d:3,p:`Ops`,c:[`AMZ`,`UBER`,`GOOG`],a:"Top queries by total time in `events_statements_summary_by_digest`, then their rows-examined ratio. High CPU with low I/O usually means full scans served from the buffer pool — a missing index, not a hardware problem."},{q:`Disk is filling up. What do you look at?`,d:2,p:`Ops`,c:[`AMZ`,`UBER`],a:"Largest tables and indexes, binary log retention, undo tablespace growth from a long-running transaction, and temp files from big sorts. Deleting rows does not return space to the OS without `OPTIMIZE TABLE`."},{q:`Replication has stopped with an error. What do you do?`,d:3,p:`Ops`,c:[`AMZ`,`UBER`,`FLPK`],a:"Read `SHOW REPLICA STATUS` for the failing statement and reason. Fix the data divergence — never blind-skip the event, which silently deepens the divergence. With GTIDs, re-clone the replica if drift is confirmed."},{q:`How do you take a consistent backup of a live system?`,d:2,p:`Ops`,c:[`AMZ`,`GS`,`ORCL`],a:"`mysqldump --single-transaction` for InnoDB (a consistent snapshot without locking), or a physical hot backup with redo tracking. Backing up from a replica avoids loading the primary."},{q:`How do you validate a restore actually works?`,d:2,p:`Ops`,c:[`GS`,`AMZ`],a:`Restore to a separate host, run schema and row-count checks, and execute a sample of real queries. An untested backup is a hypothesis, not a recovery plan.`},{q:`How would you find the cause of intermittent slow requests?`,d:3,p:`Ops`,c:[`UBER`,`META`,`ATLS`],a:`Correlate the application's slow requests with the slow query log by timestamp, then check lock waits, replication lag, buffer pool churn and checkpoint spikes. Intermittent usually means contention or cache misses, not a bad query plan.`},{q:`What do you monitor to catch a problem before users do?`,d:2,p:`Ops`,c:[`AMZ`,`ATLS`,`UBER`],a:`p99 query latency, replication lag, connection count against the limit, lock waits and deadlock rate, buffer pool hit ratio, disk headroom, and InnoDB history list length. Alert on trends, not just thresholds.`}],ve=[{q:`What does SELECT COUNT(*) FROM t WHERE col <> 'x' return when col has NULLs?`,d:2,p:`Null`,c:[`AMZ`,`GOOG`,`TCS`],a:"It excludes the NULL rows, because `NULL <> 'x'` is UNKNOWN. Add `OR col IS NULL` if they should count."},{q:`What is the result of 'abc' = 0 in MySQL?`,d:2,p:`Numeric`,c:[`AMZ`,`GOOG`],a:"TRUE (1). The string coerces to 0 with a warning. This is why `WHERE status = 0` can match textual junk and why you must quote string literals."},{q:`What does SELECT 1/0 return?`,d:1,p:`Numeric`,c:[`TCS`,`GS`],a:"NULL in MySQL under the default SQL mode — not an error. With `ERROR_FOR_DIVISION_BY_ZERO` set it raises. This silent NULL is why `NULLIF(y,0)` is the defensive idiom."},{q:`What does ORDER BY on a VARCHAR column of numbers give?`,d:1,p:`Numeric`,c:[`TCS`,`GS`,`AMZ`],a:`Lexicographic order: '10' before '9'. Cast to sort numerically, but the real fix is to store numbers in a numeric column.`},{q:`Does 'a' = 'A' in MySQL?`,d:1,p:`String`,c:[`AMZ`,`TCS`],a:"Yes under the default `_ci` collation. Under `_bin` or `_cs` it does not. String comparison behaviour is a property of the collation, not the query."},{q:`What does SELECT * FROM t LIMIT 5 return without ORDER BY?`,d:1,p:`Basics`,c:[`AMZ`,`GOOG`],a:"Five arbitrary rows, and which five may change between executions as the plan changes. `LIMIT` without `ORDER BY` is never deterministic."},{q:`How many rows does a JOIN return when both sides have duplicate keys?`,d:2,p:`Joins`,c:[`AMZ`,`META`,`GS`],a:`The product of the matching group sizes — 2 rows joined to 3 gives 6. This is the mechanism behind every doubled-SUM bug.`},{q:`What does a LEFT JOIN with a WHERE on the right table return?`,d:2,p:`Joins`,c:[`AMZ`,`META`,`MSFT`],a:"The same as an inner join, because the NULL-padded rows fail the predicate. Move the condition into `ON` to preserve the outerness."},{q:`What happens when you GROUP BY a nullable column?`,d:2,p:`Null`,c:[`AMZ`,`META`],a:`All NULLs collapse into one group and appear as a single NULL row — the only context where SQL treats NULLs as equal.`},{q:`What does SUM return over an empty set?`,d:2,p:`Aggregate`,c:[`AMZ`,`GS`],a:"NULL, while `COUNT` returns 0. Wrap in `COALESCE(SUM(x), 0)` whenever the value feeds arithmetic downstream."},{q:`Does an ungrouped aggregate over an empty table return a row?`,d:2,p:`Aggregate`,c:[`GOOG`,`AMZ`],a:"Yes, exactly one row with NULLs (or 0 for COUNT). Add a `GROUP BY` and you get zero rows, because there are no groups."},{q:`What does 2 IN (1, NULL) evaluate to?`,d:2,p:`Null`,c:[`AMZ`,`GOOG`],a:`NULL, not FALSE — the engine cannot rule out that the NULL might have been a 2. In WHERE it behaves as false, but negate it and the query silently returns nothing.`},{q:`What does AUTO_INCREMENT do after a rollback?`,d:2,p:`DDL`,c:[`AMZ`,`MSFT`],a:`The value is consumed permanently. Ids are allocated outside the transaction so concurrent inserts never block, which means gaps are guaranteed. Never assume density.`},{q:`Does DELETE reset AUTO_INCREMENT?`,d:1,p:`DDL`,c:[`TCS`,`AMZ`],a:"No — `TRUNCATE` does, because it recreates the table. Since MySQL 8 the counter is persisted to the redo log, so it no longer reverts after a restart."},{q:`What does SELECT with an alias in WHERE do?`,d:1,p:`Basics`,c:[`AMZ`,`INFY`],a:`Errors — the alias does not exist yet, because WHERE runs before the select list. It works in ORDER BY, which runs after.`},{q:`What does a trigger do on a 1000-row INSERT?`,d:2,p:`Proc`,c:[`AMZ`,`TCS`],a:`Fires 1000 times — MySQL has row-level triggers only. An expensive trigger turns a bulk load into a crawl.`},{q:`What happens to a transaction when you run CREATE TABLE inside it?`,d:2,p:`Txn`,c:[`AMZ`,`ORCL`],a:`MySQL commits it implicitly. All DDL causes an implicit commit, so a stray schema statement silently ends your transaction and makes prior work permanent.`},{q:`What does SELECT COUNT(*) return inside a REPEATABLE READ transaction after another session inserts?`,d:3,p:`Txn`,c:[`AMZ`,`ORCL`],a:"The original count — plain reads use the transaction's snapshot. A locking read (`FOR UPDATE`) bypasses it and sees the latest committed data, which can look contradictory in the same transaction."},{q:`When would you choose a composite key over a surrogate?`,d:2,p:`Norm`,c:[`AMZ`,`ORCL`],a:`On junction tables, where the composite *is* the natural identity and enforces the relationship uniqueness. Elsewhere a surrogate keeps foreign keys narrow and stable.`},{q:`Should IDs be sequential or random, and why?`,d:3,p:`DDL`,c:[`AMZ`,`GOOG`,`ATLS`],a:"Sequential for InnoDB insert performance and index locality; random when ids are exposed publicly and enumeration is a concern. UUIDv7 or `UUID_TO_BIN(u,1)` gives both by keeping the timestamp bits leading."},{q:`Where should validation live — application or database?`,d:2,p:`Norm`,c:[`AMZ`,`GOOG`,`ATLS`],a:`Both. The database is the last line that no script, migration or second service can bypass; the application gives good error messages and catches problems earlier. Constraints are cheap insurance.`},{q:`How do you decide between a JSON column and proper columns?`,d:2,p:`Norm`,c:[`GOOG`,`ATLS`,`SFDC`],a:`Columns for anything you filter, join, aggregate or constrain on. JSON for genuinely open-ended, sparse, or client-defined data. Extract the few queried JSON paths into indexed generated columns.`},{q:`When is a materialised summary table the right answer?`,d:2,p:`Perf`,c:[`AMZ`,`WALM`,`MCK`],a:`When an expensive aggregate is read far more often than the underlying data changes, and some staleness is acceptable. Refresh incrementally over recent partitions, not the whole history.`},{q:`How do you decide what to index on a new table?`,d:2,p:`Index`,c:[`AMZ`,`MSFT`],a:`Start with the primary key and foreign keys, then add composite indexes for the actual query patterns — equality columns first, then range or sort. Do not speculatively index; add after observing queries.`},{q:`How do you handle very wide reporting queries against a transactional database?`,d:3,p:`Ops`,c:[`AMZ`,`WALM`,`DELOITTE`],a:`Route them to a read replica or an analytical copy, never the primary. Long analytical scans hold read views open, bloat undo and evict the buffer pool that OLTP traffic depends on.`},{q:`How do you archive old data without breaking foreign keys?`,d:3,p:`Ops`,c:[`GS`,`AMZ`],a:`Archive whole entity trees together in dependency order, or use partitioning so a whole time range detaches at once. Archiving a parent while children remain is the usual cause of broken references.`},{q:`How do you support multi-tenancy?`,d:3,p:`Norm`,c:[`SFDC`,`ATLS`,`SAP`],a:"Shared tables with a `tenant_id` on every table and as the leading index column (simple, cheap, needs disciplined filtering); schema per tenant (better isolation, painful at thousands); or database per tenant (best isolation, highest operational cost)."},{q:`How do you prevent one tenant's query from affecting others?`,d:3,p:`Ops`,c:[`SFDC`,`ATLS`],a:"Lead every index with `tenant_id`, enforce the filter in a view or row-level security rather than trusting application code, cap result sizes, and set per-connection resource limits."},{q:`What is the difference between logical and physical data models?`,d:1,p:`Norm`,c:[`IBM`,`DELOITTE`,`TCS`],a:`The logical model describes entities, attributes and relationships independent of any engine; the physical model adds tables, data types, indexes, partitioning and storage choices for a specific database.`},{q:`How do you document a schema for a new team member?`,d:1,p:`Norm`,c:[`ATLS`,`EPAM`,`DELOITTE`],a:`An ER diagram of the core entities, column comments in the DDL itself so they travel with the schema, and a short document explaining the non-obvious decisions — especially deliberate denormalisation.`},{q:`What is technical debt in a schema and how do you pay it down?`,d:2,p:`Norm`,c:[`ATLS`,`AMZ`],a:`Nullable columns that should not be, missing constraints, denormalised copies with no owner, unused indexes and columns. Pay down incrementally with expand-migrate-contract, adding a constraint only after cleaning the data behind it.`},{q:`What is a surrogate key generator in a distributed system?`,d:3,p:`Ops`,c:[`UBER`,`GOOG`,`AMZ`],a:`Snowflake-style ids: timestamp bits plus a machine id plus a sequence, so ids are unique across nodes and roughly time-ordered without coordination. Auto-increment does not work across shards.`},{q:`What is an ORM and what should you watch for?`,d:2,p:`Perf`,c:[`ATLS`,`SFDC`,`EPAM`],a:"It maps objects to rows. Watch for N+1 queries, `SELECT *` fetching every column, lazily loaded relations in loops, and generated queries that ignore your indexes. Always be able to see the SQL it emits."},{q:`What is a connection leak and how do you spot one?`,d:2,p:`Ops`,c:[`AMZ`,`ATLS`],a:"Connections opened and never returned to the pool, eventually hitting `max_connections`. Spot it as a steadily rising connection count with flat traffic, and `Sleep`-state threads in the process list."},{q:`What is the difference between a database view and a report?`,d:1,p:`View`,c:[`TCS`,`DELOITTE`],a:`A view is a reusable stored query definition inside the database; a report is a presentation of query results. Views help by centralising complex joins and restricting column access.`},{q:`When would you use a stored procedure over application code?`,d:2,p:`Proc`,c:[`ORCL`,`IBM`,`AMZ`],a:`Batch data manipulation where moving rows to the client is the bottleneck, and invariants that must hold no matter which client writes. Against: hard to version, test and profile, and it ties you to one engine.`},{q:`How do you test SQL?`,d:2,p:`Ops`,c:[`ATLS`,`EPAM`,`AMZ`],a:`Seed a known dataset, assert on results, and include edge cases — empty tables, NULLs, duplicates, boundary dates. Run migrations in the test setup so the schema under test is the one you will deploy.`},{q:`What is a database migration rollback strategy?`,d:3,p:`Ops`,c:[`ATLS`,`AMZ`,`GOOG`],a:`Prefer forward-only, backward-compatible migrations so no rollback is needed — that is the point of expand-migrate-contract. A destructive migration cannot be rolled back once data is gone, only restored from backup.`},{q:`What is the difference between a cache and a read replica?`,d:2,p:`Ops`,c:[`AMZ`,`UBER`,`ATLS`],a:`A cache stores computed results keyed by request and must be invalidated; a replica stores the whole dataset and stays current via replication. Cache for expensive derived results, replica for read volume.`},{q:`When is a full table scan actually the right plan?`,d:2,p:`Perf`,c:[`ORCL`,`GOOG`,`AMZ`],a:`When the query touches a large fraction of the table, when the table is small enough to sit in a few pages, or when sequential I/O beats scattered index lookups. The optimiser choosing a scan is often correct, not a bug.`},{q:`How do you explain a slow dashboard to a non-technical stakeholder?`,d:2,p:`Perf`,c:[`DELOITTE`,`MCK`,`ATLS`],a:`Frame it as work per request: the query reads far more data than it returns. Offer the trade-offs — precompute nightly (fast but up to a day stale), add an index (fast, slightly slower writes), or narrow the date range.`},{q:`What single change most often fixes a slow query?`,d:2,p:`Perf`,c:[`AMZ`,`GOOG`,`MSFT`],a:`The right composite index — equality columns first, then the range or sort column, ideally covering the selected columns. Second most common: making a non-sargable predicate sargable.`}],ye=[{q:`What is a tuple in relational terms?`,d:1,p:`Theory`,c:[`TCS`,`IBM`],a:`A row — an ordered set of attribute values. The formal model treats a relation as a set of tuples, which is why row order carries no meaning.`},{q:`What is a domain?`,d:1,p:`Theory`,c:[`IBM`,`ORCL`],a:`The set of permitted values for an attribute — effectively the column's data type plus any constraints narrowing it.`},{q:`What is data integrity and what kinds are there?`,d:1,p:`Norm`,c:[`TCS`,`IBM`,`INFY`],a:`Entity integrity (every row uniquely identifiable — the primary key), referential integrity (foreign keys point at existing rows), and domain integrity (values fall within their permitted set).`},{q:`What is a constraint?`,d:1,p:`DDL`,c:[`TCS`,`COG`],a:`A declarative rule the engine enforces on every write: NOT NULL, UNIQUE, PRIMARY KEY, FOREIGN KEY, CHECK, DEFAULT. Enforcement in the database cannot be bypassed by any client.`},{q:`What is a cursor's alternative in set-based thinking?`,d:2,p:`Proc`,c:[`ORCL`,`IBM`],a:"Express the loop body as a join or an aggregate. A cursor updating a million rows one at a time is orders of magnitude slower than one `UPDATE … JOIN` and holds locks far longer."},{q:`What is an execution plan?`,d:1,p:`Perf`,c:[`MSFT`,`ORCL`,`AMZ`],a:"The optimiser's chosen strategy — access methods, join order and algorithms, sorts. `EXPLAIN` shows the estimate; `EXPLAIN ANALYZE` shows what actually happened."},{q:`What is a covering query?`,d:2,p:`Index`,c:[`AMZ`,`MSFT`],a:"One whose every referenced column exists in a single index, so the table is never read. Shows as `Using index` in EXPLAIN and is often the largest single speedup available."},{q:`What is cardinality estimation and why does it matter?`,d:3,p:`Perf`,c:[`ORCL`,`MSFT`,`GOOG`],a:`The optimiser's guess at how many rows each step produces. Everything downstream — join order, join algorithm, index choice — depends on it, which is why stale statistics cause sudden bad plans.`},{q:`What is a heap table?`,d:2,p:`Theory`,c:[`ORCL`,`MSFT`],a:`A table with no clustered index, where rows are stored unordered and all indexes point at physical addresses. PostgreSQL and Oracle default to heaps; InnoDB has no heap option.`},{q:`What is a tablespace?`,d:2,p:`Ops`,c:[`ORCL`,`IBM`,`SAP`],a:"A storage container mapping logical objects onto files. InnoDB has the shared system tablespace plus per-table files when `innodb_file_per_table` is on — which it should be, so dropping a table returns space to the OS."},{q:`What is the redo log versus the undo log?`,d:3,p:`Txn`,c:[`AMZ`,`ORCL`],a:`Redo records changes for crash recovery (durability); undo records previous versions for rollback and MVCC reads (atomicity and isolation). A long transaction bloats undo, not redo.`},{q:`What is a dirty page?`,d:2,p:`Ops`,c:[`ORCL`,`AMZ`],a:`A buffer-pool page modified in memory but not yet written to disk. Checkpointing flushes them; too many dirty pages lengthens crash recovery, too aggressive flushing costs I/O.`},{q:`What is a latch versus a lock?`,d:3,p:`Txn`,c:[`ORCL`,`AMZ`],a:`A lock is a logical, transaction-scoped protection of data. A latch is a short physical mutex protecting an in-memory structure for microseconds. Latch contention shows up as high CPU with no lock waits.`},{q:`What is write amplification?`,d:3,p:`Perf`,c:[`GOOG`,`AMZ`],a:`One logical write causing several physical writes — redo log, data page, every index, plus SSD-level rewriting. It is why each extra index costs more than it appears to.`},{q:`What is a bloom filter and where do databases use one?`,d:3,p:`Theory`,c:[`GOOG`,`AMZ`],a:`A probabilistic structure answering 'definitely not present' or 'possibly present' in constant space. LSM-tree engines use them to skip files that cannot contain a key.`},{q:`What is an LSM tree and how does it differ from a B-tree?`,d:3,p:`Theory`,c:[`GOOG`,`AMZ`,`UBER`],a:`Log-Structured Merge: buffer writes in memory, flush sorted runs, merge in the background. Excellent write throughput, more read amplification. B-trees update in place — better reads, more random writes.`},{q:`What is columnar storage and when does it win?`,d:2,p:`Theory`,c:[`SAP`,`GOOG`,`DELOITTE`],a:`Values of a column stored contiguously, so a scan reads only the columns needed and compresses far better. Ideal for analytics; poor for retrieving whole rows, which is why OLTP stays row-oriented.`},{q:`What is vectorised execution?`,d:3,p:`Theory`,c:[`GOOG`,`SAP`],a:`Processing batches of rows per operator call rather than one at a time, amortising interpreter overhead and enabling SIMD. Central to modern analytical engines.`},{q:`Return the total number of rows in every table of a schema.`,d:2,p:`Ops`,c:[`AMZ`,`DELOITTE`],a:"Approximately from `information_schema.tables.TABLE_ROWS`; exactly requires a `COUNT(*)` per table. State which precision the situation needs."},{q:`Find the column with the most distinct values in a table.`,d:2,p:`Ops`,c:[`DELOITTE`,`MCK`],a:"Generate one `COUNT(DISTINCT col)` per column from `information_schema.columns`, or read index cardinality from `SHOW INDEX` where an index exists."},{q:`List foreign keys pointing at a given table.`,d:2,p:`Ops`,c:[`AMZ`,`MSFT`],a:"Query `information_schema.key_column_usage` filtering on `referenced_table_name` — the way to assess what breaks before dropping or renaming a table."},{q:`Find tables using a deprecated data type.`,d:2,p:`Ops`,c:[`DELOITTE`,`IBM`],a:"`SELECT table_name, column_name FROM information_schema.columns WHERE data_type = 'year'` — schema audits are ordinary SQL against the catalog."},{q:`Return the first N rows of each group as a comma list.`,d:3,p:`Advanced`,c:[`AMZ`,`ZOHO`],a:"Rank within the group, filter to `<= N`, then `GROUP_CONCAT` the survivors. Doing GROUP_CONCAT first then trimming the string is wrong and truncation-prone."},{q:`Find rows whose value changed since yesterday's snapshot.`,d:2,p:`Advanced`,c:[`GS`,`DELOITTE`],a:"Join today's and yesterday's snapshots on the key and compare null-safely with `<=>`, classifying rows as added, removed or changed."},{q:`Return a leaderboard with ties sharing a position.`,d:2,p:`Window`,c:[`ZOMT`,`AMZ`],a:"`RANK() OVER (ORDER BY score DESC)` — ties share a rank and the next position skips, which is exactly leaderboard semantics. `DENSE_RANK` would not skip."},{q:`Compute the difference between the highest and lowest value per group.`,d:1,p:`Aggregate`,c:[`TCS`,`AMZ`],a:"`MAX(v) - MIN(v)` grouped by the key — one pass, no self-join."},{q:`Find the second most frequent value.`,d:2,p:`Advanced`,c:[`AMZ`,`ADBE`],a:"Count per value, then `DENSE_RANK() OVER (ORDER BY cnt DESC) = 2`, or `LIMIT 1 OFFSET 1` on the ordered counts."},{q:`Return rows where a value appears exactly once.`,d:1,p:`Aggregate`,c:[`TCS`,`AMZ`],a:"`GROUP BY v HAVING COUNT(*) = 1`. To return the whole row, use `COUNT(*) OVER (PARTITION BY v) = 1` in a subquery."},{q:`Find the earliest order for each product.`,d:2,p:`Window`,c:[`AMZ`,`WALM`],a:"`ROW_NUMBER() OVER (PARTITION BY product_id ORDER BY order_date, order_id) = 1` over the joined item rows."},{q:`Compute the number of days since each customer's last order.`,d:2,p:`Date`,c:[`SWGY`,`AMZ`],a:"`DATEDIFF(CURDATE(), MAX(order_date))` grouped by customer — the recency component of an RFM analysis."},{q:`Build an RFM segmentation.`,d:3,p:`Advanced`,c:[`WALM`,`MCK`,`AMZ`],a:"Per customer compute recency (days since last order), frequency (order count) and monetary (total spend), then `NTILE(5)` each and concatenate the three scores into a segment code."},{q:`Find the conversion rate from trial to paid.`,d:2,p:`Advanced`,c:[`ATLS`,`SFDC`],a:"`SUM(converted) / COUNT(*)` over one row per trial, with `converted` computed by an EXISTS against the subscriptions table. Define the conversion window explicitly."},{q:`Compute average time to first purchase after signup.`,d:2,p:`Advanced`,c:[`SWGY`,`AMZ`,`META`],a:"Join each user's signup date to their earliest order and `AVG(DATEDIFF(...))`. Decide whether users who never purchased are excluded or counted as censored — it changes the number materially."},{q:`Find products whose price changed more than twice this year.`,d:2,p:`Aggregate`,c:[`WALM`,`AMZ`],a:"`GROUP BY product_id HAVING COUNT(*) > 2` over a price-history table filtered to the year — or count actual changes by comparing to LAG first."},{q:`Return the running maximum of a column.`,d:2,p:`Window`,c:[`GS`,`AMZ`],a:"`MAX(v) OVER (ORDER BY t ROWS UNBOUNDED PRECEDING)` — a high-water mark, used for drawdown and peak-tracking calculations."},{q:`Compute drawdown from a running peak.`,d:3,p:`Window`,c:[`GS`,`JPMC`,`DE`],a:"`v - MAX(v) OVER (ORDER BY t ROWS UNBOUNDED PRECEDING)` gives the drop from the peak so far; divide by the peak for percentage drawdown."},{q:`Find overlapping date ranges within the same entity.`,d:3,p:`Advanced`,c:[`ATLS`,`UBER`,`GS`],a:"Self join on the entity with `a.start < b.end AND b.start < a.end AND b.id > a.id`. Index `(entity_id, start)` or it is quadratic."},{q:`Merge adjacent or overlapping date ranges into one.`,d:3,p:`Advanced`,c:[`GS`,`ATLS`,`GOOG`],a:"Islands: flag a row as starting a new range when its start exceeds the running `MAX(end)` of prior rows, running-sum the flags, then `MIN(start), MAX(end)` per group."},{q:`Return every date a resource was booked.`,d:3,p:`Advanced`,c:[`ATLS`,`UBER`],a:"Join the bookings against a calendar table on `d BETWEEN start AND end` — expanding a range into rows is a join against a date series, not string manipulation."},{q:`Count concurrent sessions at each point in time.`,d:3,p:`Advanced`,c:[`UBER`,`META`,`ATLS`],a:"Sweep line: `UNION ALL` a +1 row at each start and a −1 at each end, order by time, and take a running `SUM`. The maximum of that running sum is peak concurrency."},{q:`Compute peak concurrent users per day.`,d:3,p:`Advanced`,c:[`META`,`SNAP`,`UBER`],a:"The same sweep-line running sum, partitioned by day, then `MAX()` per day. Far cheaper than testing every minute against every session."},{q:`Find the shortest path length in a hierarchy.`,d:3,p:`Subquery`,c:[`AMZ`,`GOOG`],a:`A recursive CTE tracking depth, stopping when the target is reached. Add a visited-set guard or cyclic data loops until the recursion limit.`},{q:`Count all descendants of each node.`,d:3,p:`Subquery`,c:[`AMZ`,`MSFT`],a:"Recursive CTE producing every (ancestor, descendant) pair, then `GROUP BY ancestor`. A closure table stores those pairs permanently and answers it with a single indexed lookup."},{q:`Return the root of each node in a tree.`,d:3,p:`Subquery`,c:[`AMZ`,`GOOG`],a:`Recursive CTE carrying the anchor's id down every branch — the root travels unchanged while depth increases.`},{q:`Flatten a hierarchy into a breadcrumb string.`,d:3,p:`Subquery`,c:[`AMZ`,`SFDC`],a:`Recursive CTE concatenating names with a separator. Cast the path column wide in the anchor or MySQL truncates it to the anchor value's length.`},{q:`What is an idempotent operation and why does it matter in SQL?`,d:2,p:`Txn`,c:[`PYPL`,`UBER`,`AMZ`],a:"One that produces the same result whether applied once or many times. It makes retries safe after timeouts and deadlocks. `UPDATE … SET status='done'` is idempotent; `SET n = n + 1` is not."},{q:`What is optimistic concurrency in one sentence?`,d:1,p:`Txn`,c:[`AMZ`,`ATLS`],a:`Assume no conflict, detect it at write time via a version column, and retry — no locks held while the user thinks.`},{q:`Why do ORMs generate SELECT N+1 queries?`,d:2,p:`Perf`,c:[`ATLS`,`SFDC`,`EPAM`],a:"Lazy loading: accessing a related object triggers a query, and doing so inside a loop triggers one per row. Fix with eager loading, a join, or batched `IN` fetching."},{q:`What is a database connection pool sized for?`,d:2,p:`Ops`,c:[`AMZ`,`ATLS`],a:`Roughly the number of concurrent queries the database can usefully run — often far smaller than developers expect, near the core count for CPU-bound work. Oversized pools cause contention, not throughput.`},{q:`Why does adding application servers not always increase throughput?`,d:3,p:`Ops`,c:[`AMZ`,`UBER`],a:`The database becomes the bottleneck. More connections mean more contention on the same locks and buffer pool. Scale reads with replicas, writes with sharding, or reduce work per request with caching and indexes.`},{q:`What is the difference between latency and throughput here?`,d:2,p:`Perf`,c:[`GOOG`,`AMZ`],a:`Latency is how long one query takes; throughput is how many complete per second. Batching improves throughput and worsens per-item latency — knowing which one the requirement is about decides the design.`},{q:`What does 'the database is slow' usually actually mean?`,d:2,p:`Perf`,c:[`AMZ`,`ATLS`,`UBER`],a:`One query doing far more work than necessary, an N+1 pattern, lock contention, or a cold cache. Start from the top queries by total time and the rows-examined-to-sent ratio, not from server settings.`},{q:`When should you tune server configuration rather than queries?`,d:2,p:`Ops`,c:[`ORCL`,`AMZ`],a:"After the queries are right. The exception is `innodb_buffer_pool_size`, which is so impactful that an obviously undersized value is worth fixing first. Most other defaults are reasonable."},{q:`What is the single biggest MySQL configuration setting?`,d:2,p:`Ops`,c:[`AMZ`,`ORCL`],a:"`innodb_buffer_pool_size` — typically 60–75% of RAM on a dedicated server. If the working set fits, reads are memory-speed; if not, every miss is a disk seek."},{q:`What does innodb_flush_log_at_trx_commit control?`,d:3,p:`Ops`,c:[`AMZ`,`ORCL`,`GS`],a:"Durability versus speed. `1` fsyncs on every commit (ACID-safe, default). `2` writes but does not fsync — much faster, can lose about a second of committed transactions on power loss. `0` is faster still and less safe."},{q:`What is the binlog used for besides replication?`,d:2,p:`Ops`,c:[`AMZ`,`UBER`],a:`Point-in-time recovery, and change-data-capture feeds into search indexes, caches and data warehouses. Tools like Debezium read it to stream row changes downstream.`},{q:`Which downstream systems are typically fed from the binlog?`,d:2,p:`Ops`,c:[`UBER`,`GOOG`,`AMZ`],a:`Search indexes, caches, data warehouses, and audit stores — all kept current by streaming row changes rather than polling. Tools like Debezium read the log and publish to Kafka; the database stays the single place writes land.`},{q:`Why is polling with updated_at unreliable for change capture?`,d:3,p:`Ops`,c:[`UBER`,`GOOG`],a:`Rows committed out of timestamp order can be missed, deletes leave no row to find, and clock skew between writers breaks the ordering assumption. Log-based capture has none of these problems.`},{q:`What is a dead tuple / undo bloat and how do you fix it?`,d:3,p:`Ops`,c:[`GOOG`,`AMZ`],a:`Old row versions that cannot be purged because a transaction still needs them. Fix by finding and ending long-running transactions; PostgreSQL additionally needs autovacuum to be keeping up.`},{q:`What is an advisory lock?`,d:3,p:`Txn`,c:[`ATLS`,`GOOG`],a:"An application-defined lock the database tracks but does not associate with any data — `GET_LOCK()` in MySQL. Used to serialise a job across instances without a dedicated coordination service."},{q:`How do you implement a distributed mutex with a database?`,d:3,p:`Txn`,c:[`ATLS`,`UBER`,`AMZ`],a:`A leases table with a unique key and an expiry timestamp: insert to acquire, and treat expired rows as free. Always include an expiry, or a crashed holder blocks the job forever.`},{q:`How would you rate-limit using SQL?`,d:3,p:`Advanced`,c:[`ATLS`,`PYPL`],a:`Count events per key within a rolling window and reject above the threshold — correct but write-heavy, so it belongs in Redis in production. As an interview answer, mention both the SQL form and why you would not ship it.`},{q:`What is the outbox pattern?`,d:3,p:`Ops`,c:[`UBER`,`ATLS`,`PYPL`],a:`Write the business change and an outbox row in the **same transaction**, then publish the outbox asynchronously. It avoids the dual-write problem where the database commits but the message send fails.`},{q:`Why can't you reliably write to a database and a message queue together?`,d:3,p:`Txn`,c:[`UBER`,`AMZ`,`PYPL`],a:`There is no shared transaction, so either can succeed while the other fails. Two-phase commit solves it in theory and blocks in practice; the outbox pattern plus idempotent consumers is the standard answer.`},{q:`What is eventual consistency in the context of read replicas?`,d:2,p:`Ops`,c:[`AMZ`,`UBER`],a:`A replica may lag the primary by milliseconds to seconds, so a read straight after a write can return stale data. Route read-your-writes traffic to the primary or wait on the GTID.`},{q:`How do you decide between adding a replica and adding a cache?`,d:2,p:`Ops`,c:[`AMZ`,`ATLS`],a:`A replica if the volume of ordinary reads is the problem; a cache if a few expensive derived results dominate. A cache also needs an invalidation story, which is the part that usually goes wrong.`},{q:`What is the thundering herd problem for caches?`,d:3,p:`Ops`,c:[`AMZ`,`UBER`,`META`],a:`A popular cache entry expires and every request simultaneously hits the database to recompute it. Mitigate with a lock so one request recomputes, staggered expiries, or serving stale while refreshing.`}],be=[{q:`What does SELECT DISTINCT do to performance?`,d:2,p:`Perf`,c:[`AMZ`,`GOOG`],a:`Forces a sort or hash to deduplicate. Reaching for it to fix duplicate rows usually hides a join problem — find out why the duplicates exist first.`},{q:`Why might SELECT * be slower than listing columns?`,d:2,p:`Perf`,c:[`AMZ`,`MSFT`],a:`It transfers more data, prevents a covering index from being used, and pulls off-page TEXT and BLOB columns you did not need.`},{q:`What is the cost of a correlated subquery in the SELECT list?`,d:2,p:`Perf`,c:[`AMZ`,`ORCL`],a:`One execution per outer row unless the optimiser decorrelates it. Fine for a detail page returning ten rows, wrong for a full export.`},{q:`How do you rewrite OR into something indexable?`,d:2,p:`Index`,c:[`AMZ`,`GOOG`],a:"Split into a `UNION` of two queries, each using its own index. A single index cannot seek on two independent columns at once."},{q:`What is the difference between IN with a list and IN with a subquery?`,d:2,p:`Subquery`,c:[`AMZ`,`ORCL`],a:`A literal list is a constant the optimiser can use directly for an index lookup. A subquery must be executed or transformed into a semi-join, and if it can produce NULLs, negating it is unsafe.`},{q:`When does the optimiser convert a subquery into a join?`,d:3,p:`Perf`,c:[`ORCL`,`MSFT`,`AMZ`],a:"Routinely for `IN` and `EXISTS` — the semi-join transformation. It cannot when the subquery has LIMIT, aggregation with correlation, or side effects. `EXPLAIN` shows the result."},{q:`What is short-circuit evaluation in a WHERE clause?`,d:2,p:`Basics`,c:[`AMZ`,`ORCL`],a:"SQL gives **no ordering guarantee** for predicate evaluation — unlike most programming languages. You cannot rely on `WHERE x <> 0 AND y/x > 1` avoiding a division by zero; use CASE if you need ordering."},{q:`Can you rely on the order of rows without ORDER BY?`,d:1,p:`Basics`,c:[`AMZ`,`TCS`,`ORCL`],a:`No. Any apparent ordering is an accident of the plan and can change when data, statistics or the version changes. If order matters, say so explicitly.`},{q:`What is a stable sort and does SQL guarantee one?`,d:2,p:`Basics`,c:[`GOOG`,`ORCL`],a:`One preserving the relative order of equal keys. SQL guarantees nothing of the kind — rows tying on every ORDER BY key come back arbitrarily, which is why pagination needs a unique tiebreaker.`},{q:`How do you make a query deterministic?`,d:2,p:`Basics`,c:[`AMZ`,`GS`],a:"A total ordering (append the primary key), no reliance on unaggregated columns in a GROUP BY, and no non-deterministic functions like `RAND()` or `NOW()` in the comparison logic."},{q:`What does COUNT return for a group of all NULLs?`,d:1,p:`Null`,c:[`AMZ`,`TCS`],a:"`COUNT(col)` returns 0, while `SUM` and `MAX` return NULL. The asymmetry matters when the value feeds arithmetic."},{q:`Why does a percentage calculation return 0 unexpectedly?`,d:1,p:`Numeric`,c:[`TCS`,`AMZ`],a:"Integer division: `100 * a / b` with integer columns truncates. Multiply by `100.0` or cast one operand to force decimal arithmetic."},{q:`How do you round half-up rather than banker's rounding?`,d:2,p:`Numeric`,c:[`GS`,`JPMC`],a:"MySQL's `ROUND` on DECIMAL already rounds half away from zero. On FLOAT it defers to the C library and can surprise you — another reason financial values should never be FLOAT."},{q:`What is the difference between CAST and CONVERT?`,d:1,p:`Numeric`,c:[`ORCL`,`MSFT`,`TCS`],a:"`CAST(x AS type)` is standard SQL. `CONVERT` is engine-specific — in MySQL it also converts character sets, in SQL Server it takes a style code for date formatting."},{q:`Why is my UNION losing rows?`,d:2,p:`Set`,c:[`AMZ`,`TCS`],a:"`UNION` deduplicates. If both branches legitimately produce identical rows that should both appear, use `UNION ALL` — which is also faster since it skips the sort."},{q:`What is the difference between a natural key changing and a surrogate key changing?`,d:2,p:`Norm`,c:[`AMZ`,`ORCL`],a:`A natural key changes with the business — an email, a product code — and every referencing row must cascade. A surrogate never changes by design, which is precisely its value.`},{q:`How do you enforce a rule spanning two tables?`,d:3,p:`DDL`,c:[`ORCL`,`AMZ`],a:`No engine supports cross-table CHECK constraints. Use a trigger, a denormalised column maintained in one place, or accept application-level enforcement plus a scheduled audit query.`},{q:`What happens when you insert into a table with a BEFORE INSERT trigger that fails?`,d:2,p:`Proc`,c:[`AMZ`,`ORCL`],a:"The whole statement is rolled back — the trigger runs inside the caller's tr
