2  NULL  0  NULL`,why:"`IN` returns TRUE on a match, FALSE only when there is no match **and** no NULLs, and NULL when there is no match but a NULL is present. So `2 IN (1, NULL)` is NULL rather than FALSE — the engine cannot rule out that the NULL might have been a 2. In a `WHERE` clause NULL behaves as false, which is why the bug is invisible until you negate it: `NOT IN` then also yields NULL and filters out rows you expected to keep."},{t:`qa`,q:`When is a correlated subquery slower than a join, and when is it faster?`,a:"It is **slower** when the outer query returns many rows and the subquery has to run for each one — a million outer rows means a million executions unless the optimiser rewrites it. It is **faster** when the outer set is small or when the subquery can short-circuit, which is exactly the `EXISTS` case: the engine stops at the first matching row rather than materialising all matches as a join would. Modern MySQL and PostgreSQL decorrelate many of these automatically, so check `EXPLAIN` before rewriting on instinct."},{t:`qa`,q:`What is the difference between a derived table, a CTE, a view and a temporary table?`,a:"A **derived table** is a subquery in `FROM`, scoped to one query, and must be aliased. A **CTE** is the same thing with a name declared up front, readable top-down, referenceable more than once, and able to recurse. A **view** is a stored query definition — no data, re-executed on every reference, and shared across sessions. A **temporary table** actually materialises rows, is visible only to the creating session, is dropped at disconnect, and can be indexed — which makes it the right tool when an intermediate result is expensive and used many times."},{t:`qa`,q:`Can a CTE be updated, and can it reference itself without RECURSIVE?`,a:"In PostgreSQL a CTE can contain `INSERT`/`UPDATE`/`DELETE` with `RETURNING`, which enables data-modifying pipelines in one statement. MySQL does not allow that. A CTE can only reference itself when declared `WITH RECURSIVE`, and in MySQL the keyword must appear once at the start even if only one of several CTEs is actually recursive. A recursive CTE may reference itself exactly once, and not inside a subquery, an outer join's null-supplying side, or with `GROUP BY`/`DISTINCT` in the recursive member."},{t:`qa`,q:`How would you find the Nth highest salary?`,a:"Three standard answers. `LIMIT`/`OFFSET` on distinct values is simplest but MySQL-specific. `DENSE_RANK()` is the clearest and handles ties as most interviewers intend. A correlated count is the portable, pre-window-function answer and the one older interviewers often expect.",sql:`-- 1. LIMIT/OFFSET (N = 3)
SELECT DISTINCT salary FROM employees
ORDER BY salary DESC LIMIT 1 OFFSET 2;

-- 2. DENSE_RANK: ties share a rank
SELECT DISTINCT salary FROM (
  SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS r
  FROM employees
) t WHERE r = 3;

-- 3. correlated count: portable to any engine
SELECT DISTINCT e.salary FROM employees e
WHERE 3 = (SELECT COUNT(DISTINCT e2.salary)
           FROM employees e2 WHERE e2.salary >= e.salary);`}]}]},g={id:`window`,num:`05`,title:`Window Functions`,kicker:`Ranking, offsets, running totals, frames and gaps-and-islands`,sections:[{id:`win-rank`,title:`Ranking and numbering`,blocks:[{t:`schema`,x:d},{t:`q`,lvl:`easy`,title:`ROW_NUMBER, RANK and DENSE_RANK`,tag:`the three ranking functions`,stmt:`Rank employees by salary descending using all three functions and explain how they differ on ties.`,approaches:[{name:`Solution`,idea:`All three number rows in a sort order; they disagree only when values tie.`,sql:`SELECT name, salary,
       ROW_NUMBER() OVER (ORDER BY salary DESC) AS rn,
       RANK()       OVER (ORDER BY salary DESC) AS rnk,
       DENSE_RANK() OVER (ORDER BY salary DESC) AS dr,
       NTILE(4)     OVER (ORDER BY salary DESC) AS quartile
FROM   employees;`,out:`name    salary  rn  rnk  dr  quartile
Ada     9000    1   1    1   1
Bruno   9000    2   1    1   1
Chen    8000    3   3    2   2
Dara    7000    4   4    3   3`,why:"`ROW_NUMBER` always gives distinct consecutive integers, breaking ties arbitrarily — so it is **non-deterministic** unless the `ORDER BY` is unique. `RANK` gives ties the same number then **skips** (1, 1, 3), which matches sporting rankings. `DENSE_RANK` gives ties the same number and does **not** skip (1, 1, 2), which is what you want for 'the Nth highest distinct salary'. `NTILE(n)` splits rows into n buckets as evenly as possible, putting the remainder in the earlier buckets."}],takeaway:"Nth highest **distinct** value ⇒ `DENSE_RANK`. Exactly one row per group ⇒ `ROW_NUMBER` with a tiebreaker."},{t:`q`,lvl:`medium`,title:`Top 3 per group`,tag:`PARTITION BY · asked everywhere`,stmt:`Return the three highest-paid employees in each department.`,approaches:[{name:`Solution`,idea:"`PARTITION BY` restarts the numbering for each group.",sql:`SELECT dept_id, name, salary
FROM (
  SELECT dept_id, name, salary,
         DENSE_RANK() OVER (PARTITION BY dept_id
                            ORDER BY salary DESC) AS r
  FROM   employees
) t
WHERE  r <= 3
ORDER  BY dept_id, salary DESC;`,why:"`PARTITION BY` is to window functions what `GROUP BY` is to aggregates, except it does not collapse rows — every input row still appears, with the window value attached. The subquery wrapper is mandatory: window functions are evaluated **after** `WHERE`, so you cannot filter on `r` in the same query level. `DENSE_RANK` returns all employees tied for third; use `ROW_NUMBER` if you want exactly three rows regardless of ties."}],takeaway:`Window functions run after WHERE and before ORDER BY, so filtering on them always needs a subquery or CTE.`},{t:`q`,lvl:`medium`,title:`Compare each row to the previous one`,tag:`LAG / LEAD`,stmt:`For each month's revenue, show the previous month's value, the absolute change and the percentage change.`,approaches:[{name:`Solution`,idea:"`LAG` reaches backwards in the ordered partition; `LEAD` reaches forwards.",sql:`WITH monthly AS (
  SELECT DATE_FORMAT(order_date, '%Y-%m') AS ym,
         SUM(amount)                      AS revenue
  FROM   orders
  GROUP  BY DATE_FORMAT(order_date, '%Y-%m')
)
SELECT ym,
       revenue,
       LAG(revenue) OVER (ORDER BY ym)                     AS prev_revenue,
       revenue - LAG(revenue) OVER (ORDER BY ym)           AS change,
       ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY ym))
             / NULLIF(LAG(revenue) OVER (ORDER BY ym), 0), 1) AS pct_change
FROM   monthly
ORDER  BY ym;`,out:`ym       revenue  prev_revenue  change  pct_change
2024-01  1000     NULL          NULL    NULL
2024-02  1250     1000          250     25.0
2024-03  1100     1250         -150    -12.0`,why:"The first row has no predecessor, so `LAG` returns NULL and the derived columns follow — supply a default with `LAG(revenue, 1, 0)` if you would rather see zeros. `NULLIF(x, 0)` guards the division: if last month's revenue was zero, the percentage is undefined and this returns NULL instead of erroring or producing infinity. `LAG(col, 2)` looks two rows back, which is how you compare against the same month last year in a monthly series."}],takeaway:"Row-over-row deltas are `LAG`. Always wrap the divisor in `NULLIF(x, 0)` when computing percentage change."},{t:`q`,lvl:`medium`,title:`Group aggregate alongside each row`,tag:`aggregate window`,stmt:`Show each employee with their department's average salary and their share of the department payroll.`,approaches:[{name:`Solution`,idea:"Any aggregate becomes a window function by adding `OVER`.",sql:`SELECT name, dept_id, salary,
       AVG(salary) OVER (PARTITION BY dept_id)             AS dept_avg,
       SUM(salary) OVER (PARTITION BY dept_id)             AS dept_payroll,
       ROUND(100.0 * salary
             / SUM(salary) OVER (PARTITION BY dept_id), 1) AS pct_of_dept,
       COUNT(*)    OVER (PARTITION BY dept_id)             AS dept_size,
       salary - AVG(salary) OVER (PARTITION BY dept_id)    AS vs_avg
FROM   employees;`,why:"Without `OVER`, `AVG(salary)` collapses the table to one row and forces every other column into `GROUP BY`. With `OVER`, the aggregate is computed across the partition and **attached to every row**, leaving the detail intact. This is the single most useful window pattern: 'row-level detail plus group-level context' used to require a self-join or a derived-table join, and now needs one clause. Note an empty `OVER ()` partitions over the whole result set, giving grand totals on every row."}]}]},{id:`win-frames`,title:`Frames: running totals and moving averages`,blocks:[{t:`q`,lvl:`medium`,title:`Running total and running average`,tag:`frame clause`,stmt:`Show a cumulative revenue total by date, plus a 7-day moving average.`,approaches:[{name:`Solution`,idea:`The frame clause says which rows of the partition each calculation sees.`,sql:`SELECT order_date,
       daily,
       SUM(daily) OVER (ORDER BY order_date
                        ROWS BETWEEN UNBOUNDED PRECEDING
                                 AND CURRENT ROW)       AS running_total,
       AVG(daily) OVER (ORDER BY order_date
                        ROWS BETWEEN 6 PRECEDING
                                 AND CURRENT ROW)       AS ma_7,
       SUM(daily) OVER ()                               AS grand_total
FROM (
  SELECT order_date, SUM(amount) AS daily
  FROM   orders GROUP BY order_date
) d
ORDER BY order_date;`,why:"Adding `ORDER BY` inside `OVER` without an explicit frame gives the **default** frame `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW` — which is why a plain `SUM(x) OVER (ORDER BY d)` already produces a running total. The explicit `ROWS` version is safer: `RANGE` groups **peer rows** with equal sort keys together, so two rows on the same date both get the full day's cumulative value, while `ROWS` counts physical rows. For a moving average over calendar days rather than rows, use `RANGE BETWEEN INTERVAL 6 DAY PRECEDING AND CURRENT ROW`, which correctly handles missing dates."}],takeaway:"`ROWS` counts physical rows; `RANGE` groups ties as peers. If your running total jumps on duplicate dates, you wanted `ROWS`."},{t:`q`,lvl:`medium`,title:`First and last value in a partition`,tag:`FIRST_VALUE / LAST_VALUE`,stmt:`For each customer, show every order alongside their first-ever and most-recent order amounts.`,approaches:[{name:`Solution`,idea:"`LAST_VALUE` needs an explicit frame or it only sees up to the current row.",sql:`SELECT cust_id, order_date, amount,
       FIRST_VALUE(amount) OVER w                              AS first_amount,
       LAST_VALUE(amount)  OVER (PARTITION BY cust_id
                                 ORDER BY order_date
                                 ROWS BETWEEN UNBOUNDED PRECEDING
                                          AND UNBOUNDED FOLLOWING) AS last_amount,
       NTH_VALUE(amount, 2) OVER w                             AS second_amount
FROM   orders
WINDOW w AS (PARTITION BY cust_id ORDER BY order_date);`,why:"This is the classic `LAST_VALUE` trap. With the default frame ending at `CURRENT ROW`, `LAST_VALUE` returns the current row's own value on every row, which looks broken. Extending the frame to `UNBOUNDED FOLLOWING` fixes it. The alternative is `FIRST_VALUE(amount) OVER (PARTITION BY cust_id ORDER BY order_date DESC)`, which many people find easier to reason about. The `WINDOW` clause at the end names a reusable window definition — pure readability, and it prevents the definitions drifting apart when edited."}],takeaway:"`LAST_VALUE` with the default frame is almost always a bug. Either extend the frame or reverse the sort and use `FIRST_VALUE`."},{t:`q`,lvl:`hard`,title:`Consecutive runs — the gaps and islands problem`,tag:`hard · asked at Meta, Google, Amazon`,stmt:`Given login dates per user, find each streak of consecutive days and its length.`,schema:`logins(user_id, login_date)
1, 2024-03-01
1, 2024-03-02
1, 2024-03-03
1, 2024-03-07
1, 2024-03-08`,hint:`Subtract the row number from the date. Consecutive dates produce a constant.`,approaches:[{name:`Row-number difference`,idea:"For a run of consecutive dates, `date − row_number` is constant, so it identifies the island.",sql:`WITH numbered AS (
  SELECT user_id, login_date,
         ROW_NUMBER() OVER (PARTITION BY user_id
                            ORDER BY login_date) AS rn
  FROM  (SELECT DISTINCT user_id, login_date FROM logins) d
),
islands AS (
  SELECT user_id, login_date,
         login_date - INTERVAL rn DAY AS grp    -- constant within a streak
  FROM   numbered
)
SELECT user_id,
       MIN(login_date) AS streak_start,
       MAX(login_date) AS streak_end,
       COUNT(*)        AS streak_length
FROM   islands
GROUP  BY user_id, grp
HAVING COUNT(*) >= 2
ORDER  BY user_id, streak_start;`,out:`user_id  streak_start  streak_end  streak_length
1        2024-03-01    2024-03-03  3
1        2024-03-07    2024-03-08  2`,why:"Both the dates and the row numbers increase by exactly one within a streak, so their difference stays fixed — and jumps whenever a gap appears. That difference becomes a synthetic group key you can `GROUP BY`. The `DISTINCT` in the innermost query matters: duplicate logins on the same day would advance `rn` without advancing the date and would split a genuine streak in two. This technique generalises to consecutive ids, consecutive seat numbers and contiguous time ranges."},{name:`Gap flag plus running sum`,idea:`Mark where a new island starts, then cumulatively sum the flags to number the islands.`,sql:`WITH flagged AS (
  SELECT user_id, login_date,
         CASE WHEN login_date =
                   LAG(login_date) OVER (PARTITION BY user_id
                                         ORDER BY login_date) + INTERVAL 1 DAY
              THEN 0 ELSE 1 END AS is_new_island
  FROM  (SELECT DISTINCT user_id, login_date FROM logins) d
),
grouped AS (
  SELECT user_id, login_date,
         SUM(is_new_island) OVER (PARTITION BY user_id
                                  ORDER BY login_date) AS island_id
  FROM   flagged
)
SELECT user_id, MIN(login_date) AS s, MAX(login_date) AS e, COUNT(*) AS len
FROM   grouped
GROUP  BY user_id, island_id;`,why:`More verbose but more flexible — the 'is this a new island?' test can be any rule at all, not just 'exactly one day later'. Use this version when the definition of contiguous is fuzzy, for example 'within 30 minutes' for sessionising clickstreams, which is exactly how session ids are built in analytics pipelines.`}],takeaway:"Gaps-and-islands = make a constant group key, then `GROUP BY` it. Row-number difference for regular steps, LAG-flag plus running sum for anything else."},{t:`q`,lvl:`hard`,title:`Three or more consecutive rows meeting a condition`,tag:`LeetCode 180/601 style`,stmt:"Find all numbers that appear at least three times **consecutively** in a table `logs(id, num)` with contiguous ids.",approaches:[{name:`LAG / LEAD`,idea:`Compare each row with its two predecessors.`,sql:`SELECT DISTINCT num AS consecutive_nums
FROM (
  SELECT num,
         LAG(num, 1) OVER (ORDER BY id) AS p1,
         LAG(num, 2) OVER (ORDER BY id) AS p2
  FROM   logs
) t
WHERE  num = p1 AND num = p2;`,why:"Reading two rows back turns 'three consecutive' into a single-row test. It generalises to N by adding offsets, though beyond three or four the self-join becomes unwieldy and the island technique is better. Note this assumes ids have no gaps; if they can, use `ROW_NUMBER() OVER (ORDER BY id)` as the ordering key instead of `id` itself."},{name:`Self join (portable)`,idea:`Join the table to itself twice on adjacent ids.`,sql:`SELECT DISTINCT a.num AS consecutive_nums
FROM   logs a
JOIN   logs b ON b.id = a.id + 1 AND b.num = a.num
JOIN   logs c ON c.id = a.id + 2 AND c.num = a.num;`,why:`The MySQL 5.7 answer and still the most common expected solution. It relies on ids being strictly consecutive with no gaps — a deleted row silently breaks it, which is exactly the kind of assumption worth stating out loud in an interview.`}]},{t:`guess`,setup:`t(v): 10, 20, 20, 30`,sql:`SELECT v,
       SUM(v) OVER (ORDER BY v)                          AS default_frame,
       SUM(v) OVER (ORDER BY v ROWS UNBOUNDED PRECEDING) AS rows_frame
FROM   t;`,out:`v   default_frame  rows_frame
10  10             10
20  50             30
20  50             50
30  80             80`,why:"The default frame with `ORDER BY` is `RANGE UNBOUNDED PRECEDING`, and `RANGE` treats rows with **equal sort keys as peers** — both 20s see the same cumulative total of 50. Switching to `ROWS` counts physical rows, so the first 20 sees 30 and the second sees 50. This is the difference behind 'my running total repeats itself'. Whenever duplicates are possible in the sort key, say `ROWS` explicitly."},{t:`guess`,setup:`emp(dept, sal): (A,100), (A,100), (A,90)`,sql:`SELECT sal,
       ROW_NUMBER() OVER (ORDER BY sal DESC) rn,
       RANK()       OVER (ORDER BY sal DESC) rk,
       DENSE_RANK() OVER (ORDER BY sal DESC) dr,
       PERCENT_RANK() OVER (ORDER BY sal DESC) pr
FROM   emp;`,out:`sal  rn  rk  dr  pr
100  1   1   1   0
100  2   1   1   0
90   3   3   2   1`,why:"`ROW_NUMBER` never repeats and the assignment between the two tied 100s is **arbitrary** — rerun the query and it may flip, which is why paginating on `ROW_NUMBER` over a non-unique sort key produces unstable pages. `RANK` skips to 3 after two ties; `DENSE_RANK` does not skip. `PERCENT_RANK` is `(rank − 1) / (rows − 1)`, so the top is always 0 and the bottom always 1."},{t:`qa`,q:`What is the difference between GROUP BY and a window function?`,a:"`GROUP BY` **collapses** each group into a single output row, so detail columns are no longer available. A window function computes across a set of rows but **returns a value for every input row**, leaving the detail intact. That is why 'show each employee and their department average side by side' needs a window, while 'show one row per department' needs `GROUP BY`. They can be combined: window functions are evaluated after grouping, so `RANK() OVER (ORDER BY SUM(x) DESC)` ranks the grouped results."},{t:`qa`,q:`Where in the query can window functions appear, and where can they not?`,a:"They may appear in the `SELECT` list and in `ORDER BY` only. They are **not** allowed in `WHERE`, `GROUP BY` or `HAVING`, because those clauses are evaluated before windows are computed — the window needs to know the final row set first. To filter on a window result, wrap the query in a subquery or CTE and filter outside. You also cannot nest window functions inside each other, though you can layer CTEs to get the same effect."},{t:`qa`,q:`Are window functions faster than self-joins?`,a:"Usually yes, and often dramatically. A correlated self-join for a running total is O(n²) — each row rescans its predecessors — while a window function makes a single ordered pass, O(n log n) including the sort or O(n) if an index already provides the order. The cost is a sort per distinct `PARTITION BY … ORDER BY` combination, so reusing one window definition via the `WINDOW` clause is cheaper than three slightly different ones. Check `EXPLAIN` for 'Using filesort' — an index matching the partition and order columns removes it."},{t:`qa`,q:`Which version of MySQL added window functions, and what do you do without them?`,a:"MySQL 8.0 (2018); PostgreSQL has had them since 8.4 (2009). On MySQL 5.7 you emulate them with correlated subqueries, self-joins, or user variables. The user-variable trick — `SET @rn := @rn + 1` inside a `SELECT` — is widely seen in older code but is officially **undefined behaviour**, because MySQL does not guarantee the order in which select-list expressions are evaluated. It usually works and occasionally does not, which is why the correlated-count formulation is the safer legacy answer.",sql:`-- MySQL 5.7 row numbering per group, using variables (fragile)
SELECT dept_id, name, salary, rn FROM (
  SELECT e.*,
         @rn := IF(@d = dept_id, @rn + 1, 1) AS rn,
         @d  := dept_id
  FROM   employees e, (SELECT @rn := 0, @d := NULL) init
  ORDER  BY dept_id, salary DESC
) t WHERE rn <= 3;`}]}]},_={id:`functions`,num:`06`,title:`Strings, Dates & Numbers`,kicker:`The built-in functions that appear in real queries and screening tests`,sections:[{id:`fn-string`,title:`String problems`,blocks:[{t:`q`,lvl:`beginner`,title:`Capitalise a name stored in mixed case`,tag:`asked at TCS, Infosys`,stmt:`Return each customer's name with the first letter uppercase and the rest lowercase.`,approaches:[{name:`Solution`,idea:"Combine `UPPER` on the first character with `LOWER` on the remainder.",sql:`SELECT name,
       CONCAT(UPPER(LEFT(name, 1)),
              LOWER(SUBSTRING(name, 2))) AS proper
FROM   customers;`,out:`name        proper
aDA lOVE    Ada love
BRUNO       Bruno`,why:"MySQL has no `INITCAP` (Oracle and PostgreSQL do), so you build it. Note it only capitalises the **first word** — proper-casing every word needs a split, which is a strong hint that display formatting belongs in the application layer rather than in SQL. `SUBSTRING(name, 2)` is 1-indexed and runs to the end when no length is given; passing 0 as the position returns an empty string, which surprises people used to 0-indexed languages."}]},{t:`q`,lvl:`easy`,title:`Extract parts of an email address`,tag:`SUBSTRING_INDEX`,stmt:"From `ada@example.com`, return the local part, the domain, and the top-level domain.",approaches:[{name:`Solution`,idea:"`SUBSTRING_INDEX(str, delim, n)` returns everything before the nth delimiter; a negative n counts from the right.",sql:`SELECT email,
       SUBSTRING_INDEX(email, '@', 1)                     AS local_part,
       SUBSTRING_INDEX(email, '@', -1)                    AS domain,
       SUBSTRING_INDEX(email, '.', -1)                    AS tld,
       SUBSTRING_INDEX(SUBSTRING_INDEX(email,'@',-1),'.',1) AS domain_name
FROM   customers;`,out:`email             local_part  domain       tld  domain_name
ada@example.com   ada         example.com  com  example`,why:"Nesting two `SUBSTRING_INDEX` calls is the standard MySQL idiom for 'the part between two delimiters' — the inner call trims one side, the outer trims the other. The equivalent using `LOCATE` and `SUBSTRING` is longer and easier to get wrong. On PostgreSQL you would use `split_part(email, '@', 2)`, which reads better. None of these can use an index, so filtering on a domain at scale means storing it as its own column."}],takeaway:`If you frequently filter on a derived part of a string, store it as a real column — or a generated column with an index.`},{t:`q`,lvl:`easy`,title:`Clean and normalise text`,tag:`TRIM · REPLACE`,stmt:`Strip surrounding whitespace, collapse the string to lowercase, remove hyphens, and pad an id to 8 characters with leading zeros.`,approaches:[{name:`Solution`,idea:"Chain the cleaning functions; `LPAD` handles fixed-width formatting.",sql:`SELECT TRIM(name)                            AS trimmed,
       LOWER(TRIM(name))                     AS normalised,
       REPLACE(phone, '-', '')               AS digits_only,
       LPAD(cust_id, 8, '0')                 AS padded_id,
       TRIM(BOTH 'x' FROM 'xxhixx')          AS custom_trim,
       CHAR_LENGTH(name)                     AS chars,
       LENGTH(name)                          AS bytes
FROM   customers;`,why:"`TRIM` removes spaces by default but accepts `LEADING`, `TRAILING` or `BOTH` with a custom character set. The last two columns matter for internationalised data: `CHAR_LENGTH` counts **characters** while `LENGTH` counts **bytes**, and under `utf8mb4` an emoji is one character but four bytes. Using `LENGTH` for a validation check on names is a classic bug that rejects legitimate non-ASCII input."}]},{t:`q`,lvl:`medium`,title:`Find and fix duplicate emails case-insensitively`,tag:`collation · asked at Amazon`,stmt:`Identify email addresses that appear more than once when case is ignored.`,approaches:[{name:`Solution`,idea:"Normalise before grouping so `Ada@X.com` and `ada@x.com` collide.",sql:`SELECT LOWER(email)   AS normalised,
       COUNT(*)       AS n,
       GROUP_CONCAT(cust_id) AS ids
FROM   customers
GROUP  BY LOWER(email)
HAVING COUNT(*) > 1;`,why:"Whether you need `LOWER` at all depends on the column's **collation**. MySQL's default `utf8mb4_0900_ai_ci` ends in `_ci` for case-insensitive, so comparisons and `GROUP BY` already ignore case — and a `UNIQUE` index would already have rejected the duplicate. With a `_bin` or `_cs` collation they are distinct values. Wrapping the column in `LOWER()` also makes the predicate non-sargable, so for a large table the better fix is a generated column `email_lc` with a unique index on it."}],takeaway:"In MySQL, string comparison behaviour is a property of the **collation**, not the query. Check it before adding `LOWER()` everywhere."},{t:`q`,lvl:`medium`,title:`Reverse a string and check for a palindrome`,tag:`screening test classic`,stmt:`Return words that read the same forwards and backwards, ignoring case.`,approaches:[{name:`Solution`,idea:"`REVERSE` plus a case-insensitive comparison.",sql:`SELECT word
FROM   dictionary
WHERE  LOWER(word) = LOWER(REVERSE(word))
  AND  CHAR_LENGTH(word) > 1;`,why:"Simple, and a common written-test question. Worth noting that this is a full-table operation no index can accelerate — the predicate depends on a function of the column, so every row must be read and transformed. In a real system you would compute and store the flag at write time. `REVERSE` also operates on characters, not bytes, so it is safe with multi-byte text."}]},{t:`q`,lvl:`medium`,title:`Search with regular expressions`,tag:`REGEXP`,stmt:"Find customers whose phone number is not in the format `123-456-7890`.",approaches:[{name:`Solution`,idea:"`REGEXP` (alias `RLIKE`) matches a pattern anywhere unless anchored.",sql:`SELECT cust_id, phone
FROM   customers
WHERE  phone NOT REGEXP '^[0-9]{3}-[0-9]{3}-[0-9]{4}$';

-- extract with MySQL 8
SELECT REGEXP_SUBSTR(notes, '[0-9]{4}-[0-9]{2}-[0-9]{2}') AS found_date,
       REGEXP_REPLACE(notes, '[^0-9]', '')                AS digits,
       REGEXP_LIKE(email, '@(gmail|yahoo)\\\\.com$')         AS is_free_mail
FROM   customers;`,why:"The `^` and `$` anchors are essential — without them the pattern matches a valid phone number embedded anywhere inside a longer string, so malformed rows slip through. MySQL 8 replaced the old regex engine with ICU, which added `REGEXP_SUBSTR`, `REGEXP_REPLACE` and `REGEXP_LIKE` but also changed some escaping behaviour from 5.7. Regex predicates are never sargable, so treat them as validation and reporting tools, not as the access path for a large table."}]}]},{id:`fn-date`,title:`Date and time problems`,blocks:[{t:`q`,lvl:`easy`,title:`Rows from the last 30 days — the sargable way`,tag:`date filtering · performance`,stmt:`Count orders placed in the last 30 days. Two versions are given; only one uses the index.`,approaches:[{name:`Wrong — function on the column`,idea:`Wrapping the indexed column in a function defeats the index.`,sql:`SELECT COUNT(*)
FROM   orders
WHERE  DATEDIFF(CURDATE(), order_date) <= 30;    -- full table scan`,why:"The optimiser cannot use an index on `order_date` because it would have to evaluate `DATEDIFF` for every possible key value to know which ones qualify. The same applies to `YEAR(order_date) = 2024`, `DATE(created_at) = '2024-01-01'` and `MONTH(d) = 3` — all of them force a full scan on a table where an index exists and would have worked."},{name:`Right — bare column, computed bound`,idea:`Move the arithmetic to the constant side of the comparison.`,sql:`SELECT COUNT(*)
FROM   orders
WHERE  order_date >= CURDATE() - INTERVAL 30 DAY;

-- single day on a DATETIME column: half-open range, never DATE()
SELECT COUNT(*) FROM orders
WHERE  created_at >= '2024-01-01'
  AND  created_at <  '2024-01-02';`,why:"`CURDATE() - INTERVAL 30 DAY` is a constant the optimiser evaluates once, so the comparison becomes a plain range scan on the index. The second query shows the `DATETIME` version of the same principle: `DATE(created_at) = '2024-01-01'` is both non-sargable and, on a timestamp column, the reason people 'lose' rows recorded after midnight. Half-open ranges handle both correctly."}],takeaway:"Never wrap an indexed column in a function inside `WHERE`. Transform the constant instead."},{t:`q`,lvl:`easy`,title:`Date arithmetic and formatting`,tag:`DATE_ADD · DATE_FORMAT`,stmt:`Show the order date, the date 7 days later, the first and last day of its month, its quarter, and the day name.`,approaches:[{name:`Solution`,idea:`Interval arithmetic plus the formatting helpers.`,sql:`SELECT order_date,
       order_date + INTERVAL 7 DAY                    AS in_a_week,
       DATE_SUB(order_date, INTERVAL 1 MONTH)         AS last_month,
       DATE_FORMAT(order_date, '%Y-%m-01')            AS month_start,
       LAST_DAY(order_date)                           AS month_end,
       QUARTER(order_date)                            AS q,
       DAYNAME(order_date)                            AS day_name,
       WEEKDAY(order_date)                            AS dow_0mon,
       DATE_FORMAT(order_date, '%d/%m/%Y')            AS uk_format,
       DATEDIFF(CURDATE(), order_date)                AS days_ago,
       TIMESTAMPDIFF(MONTH, order_date, CURDATE())    AS months_ago
FROM   orders;`,why:"`DATEDIFF` returns whole **days** and takes its arguments as (later, earlier) — reversing them gives a negative. `TIMESTAMPDIFF` takes the unit first and the arguments in the opposite order, (earlier, later), which is a genuinely easy mistake. `LAST_DAY` handles leap years correctly, which is why it beats manual month arithmetic. `WEEKDAY` is 0-based from Monday while `DAYOFWEEK` is 1-based from Sunday — always check which one you have."}]},{t:`q`,lvl:`medium`,title:`Calculate age correctly`,tag:`interview classic`,stmt:"Compute each employee's age in whole years from their date of birth. `DATEDIFF / 365` is wrong — explain why.",approaches:[{name:`Solution`,idea:"`TIMESTAMPDIFF` with the `YEAR` unit handles leap years and month boundaries.",sql:`SELECT name, dob,
       TIMESTAMPDIFF(YEAR, dob, CURDATE())      AS age,
       -- the naive version, for comparison
       FLOOR(DATEDIFF(CURDATE(), dob) / 365)    AS naive_age
FROM   employees;`,why:"Dividing days by 365 ignores leap years, so it drifts by roughly one day every four years and eventually reports someone as a year older than they are on their birthday. `TIMESTAMPDIFF(YEAR, …)` counts **completed** years by comparing month and day, which is the calendar definition of age. Using 365.25 reduces the drift but still gets the boundary wrong on the birthday itself. For 'birthdays this month', compare `MONTH(dob)` — but only in the select list or on a small table, since it is not sargable."}]},{t:`q`,lvl:`medium`,title:`Bucket timestamps into intervals`,tag:`time series`,stmt:`Count events per 15-minute bucket.`,approaches:[{name:`Solution`,idea:`Convert to a numeric timestamp, floor to the bucket size, convert back.`,sql:`SELECT FROM_UNIXTIME(
         FLOOR(UNIX_TIMESTAMP(created_at) / 900) * 900
       )        AS bucket,
       COUNT(*) AS events
FROM   events
WHERE  created_at >= '2024-03-01'
  AND  created_at <  '2024-03-02'
GROUP  BY bucket
ORDER  BY bucket;`,why:"900 is 15 × 60 seconds. Integer division floors to the bucket start and multiplying back gives the bucket's timestamp — the same arithmetic works for any interval by changing the constant. Note the `WHERE` clause still filters the **bare column** so the index applies; only the `GROUP BY` uses the derived expression. Buckets with zero events are missing from the output, so join against a generated series when you need a dense chart."}]},{t:`guess`,setup:`-- session timezone is UTC`,sql:`SELECT DATE('2024-03-15 23:45:00')            AS d,
       DATEDIFF('2024-03-01', '2024-03-15')   AS dd,
       TIMESTAMPDIFF(MONTH, '2024-01-31', '2024-02-29') AS td,
       DATE_ADD('2024-01-31', INTERVAL 1 MONTH) AS plus_month,
       '2024-02-30' + INTERVAL 0 DAY           AS invalid;`,out:`d           dd   td  plus_month  invalid
2024-03-15  -14  0   2024-02-29  NULL`,why:"`DATEDIFF(a, b)` is `a − b`, so passing them in reading order gives a negative — the arguments are (later, earlier). `TIMESTAMPDIFF(MONTH, …)` counts only **complete** months, and 31 Jan to 29 Feb is one day short, so it returns 0. `DATE_ADD` clamps an overflowing day to the end of the target month rather than rolling into March. An impossible date yields NULL with a warning under the default SQL mode and an error under `STRICT_TRANS_TABLES` — another reason to check `sql_mode` before trusting date arithmetic."},{t:`qa`,q:`What is the difference between DATETIME and TIMESTAMP in MySQL?`,a:"`DATETIME` stores a literal wall-clock value with no timezone awareness, uses 8 bytes (5 since MySQL 5.6), and spans years 1000–9999. `TIMESTAMP` stores seconds since the Unix epoch in 4 bytes, is **converted from the session timezone on write and back on read**, and is limited to 1970–2038. Use `TIMESTAMP` for 'when did this happen' in a multi-timezone system so the value is unambiguous; use `DATETIME` for wall-clock values that must not shift, such as a scheduled appointment at 09:00 local time. The 2038 limit is a real consideration for anything storing future dates."},{t:`qa`,q:`How do you store and compare money?`,a:"Use `DECIMAL(19,4)` or an integer count of minor units — never `FLOAT` or `DOUBLE`. Binary floating point cannot represent 0.1 exactly, so sums drift and equality comparisons fail unpredictably; `DECIMAL` is stored as exact digits and arithmetic is exact. `DECIMAL(p, s)` means p total digits with s after the point, so `DECIMAL(10,2)` maxes out at 99,999,999.99. Storing integer cents is the alternative and is faster, at the cost of remembering to divide at every display point."},{t:`qa`,q:`What are CHAR, VARCHAR and TEXT, and when do you use each?`,a:"`CHAR(n)` is fixed length, right-padded with spaces and stripped on read — efficient only for genuinely fixed values like country codes or hashes. `VARCHAR(n)` stores the actual length plus a 1–2 byte prefix and is the default choice. `TEXT` is stored partly **off-page** with only a pointer in the row, cannot have a default value, and can only be indexed with a prefix length — so a column you filter or sort on should be `VARCHAR`, not `TEXT`. The `n` in `VARCHAR(n)` is a character count under `utf8mb4`, and the InnoDB index key limit of 3072 bytes means a `VARCHAR(1000)` utf8mb4 column cannot be fully indexed."},{t:`qa`,q:`How do you round, truncate and control decimal output?`,a:"`ROUND(x, d)` rounds half away from zero on `DECIMAL` and uses the underlying C library on `FLOAT`, which is why float rounding sometimes looks inconsistent. `TRUNCATE(x, d)` chops without rounding. `CEIL`/`FLOOR` go to whole numbers. `FORMAT(x, d)` returns a **string** with thousands separators — never use it in a comparison or an `ORDER BY`, because it sorts lexically so '1,000' comes before '900'. Division in MySQL produces a `DECIMAL` scaled by `div_precision_increment` (default 4), which is why `5/2` shows as 2.5000."}]}]},v={id:`ddl`,num:`07`,title:`DDL, Constraints & Types`,kicker:`Creating tables, keys, referential actions and schema changes`,sections:[{id:`ddl-create`,title:`Creating and altering tables`,blocks:[{t:`q`,lvl:`easy`,title:`Design a table with every constraint type`,tag:`CREATE TABLE`,stmt:"Create an `orders` table with a surrogate key, a mandatory foreign key, a checked amount, a default status and a unique reference code.",approaches:[{name:`Solution`,idea:"Name every constraint so error messages and later `ALTER` statements can refer to it.",sql:`CREATE TABLE orders (
  order_id    BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
  cust_id     INT UNSIGNED    NOT NULL,
  ref_code    CHAR(12)        NOT NULL,
  status      ENUM('pending','shipped','delivered','cancelled')
                              NOT NULL DEFAULT 'pending',
  amount      DECIMAL(12,2)   NOT NULL,
  created_at  TIMESTAMP       NOT NULL DEFAULT CURRENT_TIMESTAMP,
  updated_at  TIMESTAMP       NOT NULL DEFAULT CURRENT_TIMESTAMP
                              ON UPDATE CURRENT_TIMESTAMP,

  PRIMARY KEY (order_id),
  UNIQUE  KEY uq_orders_ref (ref_code),
  KEY     ix_orders_cust_date (cust_id, created_at),

  CONSTRAINT fk_orders_cust
    FOREIGN KEY (cust_id) REFERENCES customers (cust_id)
    ON DELETE RESTRICT ON UPDATE CASCADE,

  CONSTRAINT ck_orders_amount CHECK (amount >= 0)
) ENGINE = InnoDB DEFAULT CHARSET = utf8mb4;`,why:"Several decisions worth defending in an interview. `UNSIGNED BIGINT` doubles the positive range and prevents negative ids. `ON UPDATE CURRENT_TIMESTAMP` maintains `updated_at` without a trigger. The composite index `(cust_id, created_at)` serves 'this customer's recent orders' — column order matters and is covered in chapter 9. `CHECK` constraints were parsed but **ignored** before MySQL 8.0.16, so on older servers that validation has to live in the application. `ENGINE = InnoDB` is the default now but stating it prevents surprises on inherited configs."}],takeaway:"Name your constraints. `ERROR 1452 (fk_orders_cust)` is debuggable; `CONSTRAINT_1` is not."},{t:`q`,lvl:`medium`,title:`Choose the right referential action`,tag:`ON DELETE`,stmt:"A customer is deleted. What should happen to their orders? Compare `RESTRICT`, `CASCADE`, `SET NULL` and `NO ACTION`.",approaches:[{name:`Comparison`,idea:`Each option encodes a different business rule about orphaned children.`,sql:`-- refuse the delete while children exist (the safe default)
FOREIGN KEY (cust_id) REFERENCES customers(cust_id) ON DELETE RESTRICT

-- delete the children too
FOREIGN KEY (cust_id) REFERENCES customers(cust_id) ON DELETE CASCADE

-- keep the children, null out the link (column must be NULLable)
FOREIGN KEY (cust_id) REFERENCES customers(cust_id) ON DELETE SET NULL

-- standard-SQL deferred check; in InnoDB behaves exactly like RESTRICT
FOREIGN KEY (cust_id) REFERENCES customers(cust_id) ON DELETE NO ACTION`,why:"`RESTRICT` is the right default for financial data — you almost never want deleting a customer to silently erase their order history. `CASCADE` suits genuinely owned children such as `order_items` under `orders`, but it is dangerous in deep hierarchies where one delete can cascade across millions of rows in a single transaction, holding locks the whole time. `SET NULL` requires the column to be nullable, which conflicts with `NOT NULL`, and leaves orphan rows that every subsequent query must handle. In practice most production systems avoid the question entirely with **soft deletes**: a `deleted_at` column and a filter, so nothing is ever physically removed."}]},{t:`q`,lvl:`medium`,title:`Add a column to a huge table without downtime`,tag:`ALTER · production concern`,stmt:`You need to add a nullable column to a 200-million-row table on MySQL 8. What are the risks and options?`,approaches:[{name:`Solution`,idea:`Check whether the change qualifies as INSTANT or INPLACE before reaching for a tool.`,sql:`-- MySQL 8.0.12+: metadata-only, milliseconds regardless of table size
ALTER TABLE orders
  ADD COLUMN discount DECIMAL(6,2) NULL,
  ALGORITHM = INSTANT;

-- rebuilds the table but allows concurrent reads and writes
ALTER TABLE orders
  ADD INDEX ix_status (status),
  ALGORITHM = INPLACE, LOCK = NONE;

-- fails loudly rather than silently locking the table for hours
ALTER TABLE orders
  MODIFY COLUMN status VARCHAR(20) NOT NULL,
  ALGORITHM = INPLACE, LOCK = NONE;
-- ERROR 1846: ALGORITHM=INPLACE is not supported. Try ALGORITHM=COPY.`,why:"The danger is `ALGORITHM = COPY`, which rebuilds the entire table while holding a write lock — hours of downtime on a large table. **Specifying the algorithm explicitly turns a silent outage into an error message**, which is the single most useful habit here. `INSTANT` handles adding a nullable column at the end, dropping a column, renaming, and extending a `VARCHAR` within the same length-prefix size. Changing a column type, adding a `PRIMARY KEY` or converting the charset generally requires `COPY`, which is when you reach for `pt-online-schema-change` or `gh-ost` — both create a shadow table, backfill it, keep it in sync with triggers or the binlog, then swap atomically."}],takeaway:"Always write `ALGORITHM = INPLACE, LOCK = NONE` on production `ALTER`s. If it errors, you have learned something before the outage rather than during it."},{t:`q`,lvl:`medium`,title:`Generated columns and functional indexes`,tag:`MySQL 5.7 / 8`,stmt:"Queries filter on `LOWER(email)` and on the year of `created_at`, both of which defeat the index. Fix it without changing the application.",approaches:[{name:`Generated column + index`,idea:`Materialise the expression as a column the optimiser can index.`,sql:`ALTER TABLE customers
  ADD COLUMN email_lc VARCHAR(255)
      GENERATED ALWAYS AS (LOWER(email)) STORED,
  ADD UNIQUE INDEX uq_email_lc (email_lc);

-- MySQL 8 can index the expression directly
ALTER TABLE orders
  ADD INDEX ix_year ((YEAR(created_at)));`,why:"A `STORED` generated column is computed on write and physically stored, so it can be indexed like any column and read costs nothing extra. A `VIRTUAL` one is computed on read, takes no space, and **can still be indexed** in InnoDB — the index materialises the values even though the column does not. Choose `VIRTUAL` when writes dominate and `STORED` when reads do. MySQL 8's functional index is syntactic sugar over a hidden virtual column; note the **double parentheses**, without which it is parsed as an ordinary column name. The optimiser matches the query expression to the index automatically, so no query change is needed."}]},{t:`q`,lvl:`easy`,title:`DROP, TRUNCATE and DELETE`,tag:`asked in almost every screening test`,stmt:`Explain the difference between the three and when each is appropriate.`,approaches:[{name:`Comparison`,idea:`One removes rows, one resets the table, one removes the table.`,sql:`DELETE FROM orders WHERE status = 'cancelled';   -- DML, row by row
TRUNCATE TABLE staging_orders;                    -- DDL, resets the table
DROP TABLE old_orders;                            -- DDL, removes the definition`,why:"`DELETE` is DML: it removes rows one at a time, fires triggers, writes every row to the undo log so it can be rolled back, respects `WHERE`, and does **not** reset `AUTO_INCREMENT`. `TRUNCATE` is DDL: it drops and recreates the table internally, so it is far faster on large tables, resets `AUTO_INCREMENT` to 1, fires no triggers, cannot be filtered, and causes an implicit commit — meaning it **cannot be rolled back** in MySQL. `DROP` removes the table, its data, its indexes and its definition entirely. `TRUNCATE` also fails if another table has a foreign key pointing at it, whereas `DELETE` respects the referential action."}],takeaway:`TRUNCATE is fast because it is DDL — which is also why it commits and cannot be undone.`},{t:`guess`,setup:`CREATE TABLE t (id INT AUTO_INCREMENT PRIMARY KEY, v INT);
INSERT INTO t (v) VALUES (1), (2), (3);
DELETE FROM t;`,sql:`INSERT INTO t (v) VALUES (4);
SELECT id, v FROM t;`,out:`id  v
4   4`,why:"`DELETE` does not reset the auto-increment counter, so the next id continues from 4 rather than restarting at 1. `TRUNCATE TABLE t` would have reset it, giving id 1. In InnoDB before MySQL 8 the counter lived in memory and **reverted after a restart**, causing id reuse — 8.0 persists it to the redo log, which fixed a long-standing source of duplicate-key surprises after a crash."},{t:`qa`,q:`What is the difference between a primary key, a unique key and a foreign key?`,a:"A **primary key** uniquely identifies a row: exactly one per table, implicitly `NOT NULL`, and in InnoDB it is the **clustered index** that physically orders the data. A **unique key** also enforces uniqueness but you can have several, and it permits NULLs — multiple NULLs are allowed, because two NULLs are not considered equal. A **foreign key** enforces referential integrity by requiring each value to exist in the referenced table's primary or unique key; it does not enforce uniqueness itself and MySQL creates an index on it automatically if one does not exist."},{t:`qa`,q:`Why does InnoDB want a small primary key?`,a:"Because InnoDB is a **clustered index**: the table's rows are stored inside the primary key's B-tree, and **every secondary index stores the primary key as its row pointer**. A 36-byte UUID primary key therefore adds 36 bytes to every entry of every secondary index, inflating them and reducing how much fits in the buffer pool. Random UUIDs are worse still: inserts land at random points in the tree, causing page splits and fragmentation instead of appending at the end. Use `BIGINT AUTO_INCREMENT`, or UUIDv7 / `UUID_TO_BIN(uuid, 1)` which reorders the timestamp bytes so values stay roughly sequential."},{t:`qa`,q:`What are the practical problems with ENUM?`,a:"It is stored compactly as an integer and enforces its list, which is genuinely useful. The problems: adding a value requires an `ALTER TABLE`; the values are **ordered by their internal index**, so `ORDER BY status` sorts by declaration order rather than alphabetically, which surprises people; comparing an ENUM to an integer compares against the index, not the label; and it is non-portable. The usual alternative is a lookup table with a foreign key, which costs a join but makes the value set data rather than schema."},{t:`qa`,q:`Should you use a surrogate key or a natural key?`,a:`A **surrogate** key is a meaningless generated id; a **natural** key is real data such as an email or ISBN. Surrogates win in practice because natural keys change — people change email addresses, countries change codes — and a changing key has to cascade through every referencing table. They are also narrower, which matters for clustered-index size. The right compromise is a surrogate primary key **plus a unique constraint on the natural key**, so you get stable references and the database still enforces the real-world uniqueness rule.`},{t:`qa`,q:`What happens if you index a column that is almost always the same value?`,a:"The optimiser will ignore it. Index usefulness depends on **selectivity** — the fraction of rows a lookup eliminates. A `gender` or `is_active` column with two values has selectivity around 0.5, so following the index means reading half the rows via random access, which is slower than a sequential full scan. The index still costs write time and disk. Such a column is only useful as the **trailing** part of a composite index, or as the leading column when the distribution is heavily skewed and you always query the rare value — in which case a partial or filtered index is even better where the engine supports it."}]}]},y={id:`dml`,num:`08`,title:`DML, Transactions & Locking`,kicker:`Upserts, isolation levels, deadlocks and concurrency bugs`,sections:[{id:`dml-write`,title:`Writing data`,blocks:[{t:`q`,lvl:`easy`,title:`Insert or update in one statement`,tag:`UPSERT`,stmt:`Insert a product, or increment its stock if the SKU already exists.`,approaches:[{name:`MySQL`,idea:"`ON DUPLICATE KEY UPDATE` fires when any unique constraint would be violated.",sql:`INSERT INTO products (sku, name, stock)
VALUES ('ABC-1', 'Widget', 10)
ON DUPLICATE KEY UPDATE
  stock = stock + VALUES(stock),      -- MySQL 5.7 syntax
  name  = VALUES(name);

-- MySQL 8.0.19+ preferred form, VALUES() is deprecated
INSERT INTO products (sku, name, stock)
VALUES ('ABC-1', 'Widget', 10) AS new
ON DUPLICATE KEY UPDATE
  stock = products.stock + new.stock;`,why:"It requires a `UNIQUE` or `PRIMARY KEY` on `sku` — without one, every insert simply appends. Two gotchas: it consumes an auto-increment value even when it performs an update, leaving gaps; and if the table has **several** unique keys, MySQL updates the row matching whichever one it hits first, which is non-deterministic and can silently modify the wrong row. `INSERT IGNORE` is the weaker cousin that swallows the error and does nothing — it also swallows unrelated errors like truncation, so avoid it."},{name:`PostgreSQL / standard`,idea:"`ON CONFLICT` names the constraint explicitly, removing the ambiguity.",sql:`INSERT INTO products (sku, name, stock)
VALUES ('ABC-1', 'Widget', 10)
ON CONFLICT (sku) DO UPDATE
  SET stock = products.stock + EXCLUDED.stock;

-- standard SQL, supported by Oracle and SQL Server
MERGE INTO products p
USING (SELECT 'ABC-1' AS sku, 10 AS stock) s ON p.sku = s.sku
WHEN MATCHED     THEN UPDATE SET p.stock = p.stock + s.stock
WHEN NOT MATCHED THEN INSERT (sku, stock) VALUES (s.sku, s.stock);`,why:"`ON CONFLICT (sku)` states which constraint you mean, so the multi-unique-key ambiguity cannot arise. `EXCLUDED` refers to the row that would have been inserted. MySQL has no `MERGE`; SQL Server's implementation has documented concurrency hazards and generally needs `HOLDLOCK`. Being able to name all three forms is a common portability question."}],takeaway:`Upsert needs a unique constraint. Without one it silently degrades to a plain insert.`},{t:`q`,lvl:`medium`,title:`Update one table from another`,tag:`UPDATE with JOIN`,stmt:"Set each customer's `last_order_date` from their most recent order.",approaches:[{name:`MySQL multi-table UPDATE`,idea:"MySQL allows joins directly in `UPDATE`.",sql:`UPDATE customers c
JOIN  (SELECT cust_id, MAX(order_date) AS last_dt
       FROM   orders GROUP BY cust_id) o
  ON   o.cust_id = c.cust_id
SET    c.last_order_date = o.last_dt;`,why:"Aggregating in a derived table first keeps the join one-to-one. Joining `orders` directly would match many rows per customer and MySQL would apply an **arbitrary** one — no error, just a nondeterministic result. Note MySQL forbids referencing the table being updated in a subquery in the `SET` clause, which is why the derived table is required."},{name:`Correlated update (portable)`,idea:`A scalar subquery per row, supported everywhere.`,sql:`UPDATE customers c
SET    last_order_date = (
         SELECT MAX(order_date) FROM orders o
         WHERE  o.cust_id = c.cust_id
       )
WHERE  EXISTS (SELECT 1 FROM orders o WHERE o.cust_id = c.cust_id);`,why:"The `WHERE EXISTS` guard is the important part: without it, customers with no orders are updated to **NULL**, wiping any existing value. Correlated updates run the subquery once per row, so on a large table the join form is much faster where it is available."}],takeaway:"Every correlated `UPDATE` needs a `WHERE EXISTS` guard, or rows with no match get nulled out."},{t:`q`,lvl:`medium`,title:`Delete duplicates, keeping the earliest`,tag:`asked at Amazon, Adobe`,stmt:"A `users` table has duplicate emails. Keep the row with the lowest id for each email and delete the rest.",approaches:[{name:`Self join`,idea:`Delete any row that has a smaller-id twin with the same email.`,sql:`DELETE u1
FROM   users u1
JOIN   users u2
  ON   u2.email = u1.email
 AND   u2.id    < u1.id;`,why:"The `DELETE alias FROM` syntax is how MySQL deletes from one side of a join. Because the condition is strict inequality, exactly one survivor remains per email — the minimum id, which has no smaller twin. This runs in a single statement, so on a large table it holds locks for a long time; batch it with `LIMIT` in a loop for production."},{name:`Window function`,idea:`Number the rows per email and delete everything after the first.`,sql:`DELETE FROM users
WHERE  id IN (
  SELECT id FROM (
    SELECT id,
           ROW_NUMBER() OVER (PARTITION BY email ORDER BY id) AS rn
    FROM   users
  ) t
  WHERE rn > 1
);`,why:"Clearer, and the ranking rule is easy to change — swap `ORDER BY id` for `ORDER BY created_at DESC` to keep the newest instead. The **double subquery nesting is mandatory** in MySQL: 'You can't specify target table for delete in FROM clause' is raised if you reference `users` one level down, and wrapping it in an extra `SELECT` forces materialisation, which sidesteps the restriction. Afterwards, add `UNIQUE (email)` so the problem cannot recur."}]},{t:`q`,lvl:`medium`,title:`Delete millions of rows without locking the table`,tag:`production concern`,stmt:"You must delete 50 million old rows. A single `DELETE` runs for hours and blocks writes. What do you do?",approaches:[{name:`Batched delete`,idea:`Many small transactions instead of one enormous one.`,sql:`-- repeat until zero rows affected
DELETE FROM events
WHERE  created_at < '2023-01-01'
ORDER  BY id
LIMIT  10000;

-- keyset variant, avoids rescanning the same prefix each time
DELETE FROM events
WHERE  id > @last_id AND created_at < '2023-01-01'
ORDER  BY id
LIMIT  10000;`,why:"One huge `DELETE` builds an undo log proportional to the rows removed, holds locks for its whole duration, and blocks replication because replicas apply it as one statement. Batching keeps each transaction short so locks are released frequently and replicas keep up. Add a short sleep between batches to let other traffic through."},{name:`Partition drop`,idea:`If the table is partitioned by time, dropping a partition is instant.`,sql:`ALTER TABLE events DROP PARTITION p2022;

-- or: copy what you keep, then swap
CREATE TABLE events_new LIKE events;
INSERT INTO events_new SELECT * FROM events WHERE created_at >= '2023-01-01';
RENAME TABLE events TO events_old, events_new TO events;
DROP TABLE events_old;`,why:"Dropping a partition is a metadata operation — effectively free regardless of row count, which is the main reason to range-partition large log tables by date in the first place. The copy-and-swap approach works without partitioning and is often faster when you are keeping a small fraction, since it writes only the survivors; `RENAME TABLE` is atomic, so there is no window where the table is missing."}],takeaway:`Large deletes are an operational problem, not a SQL problem. Batch them, or design for partition drops.`}]},{id:`dml-txn`,title:`Transactions, isolation and locking`,blocks:[{t:`q`,lvl:`medium`,title:`Transfer money safely`,tag:`ACID · classic`,stmt:`Move 100 from account A to account B. Write it so a crash between the two updates cannot lose money.`,approaches:[{name:`Solution`,idea:`Wrap both updates in one transaction and verify before committing.`,sql:`START TRANSACTION;

UPDATE accounts SET balance = balance - 100
WHERE  id = 'A' AND balance >= 100;      -- guard in the WHERE, not the app

-- if zero rows were affected, the balance was insufficient
SELECT ROW_COUNT();                      -- must be 1

UPDATE accounts SET balance = balance + 100 WHERE id = 'B';

COMMIT;                                  -- or ROLLBACK on any failure`,why:"**Atomicity** guarantees both updates happen or neither does; **durability** guarantees a committed transfer survives a crash. Putting `balance >= 100` in the `WHERE` rather than checking it first in the application is the key detail — a separate `SELECT` then `UPDATE` leaves a window where another transaction spends the same money. Here the check and the decrement are one atomic operation, and `ROW_COUNT() = 0` tells you it failed. Note that DDL such as `TRUNCATE` or `ALTER` causes an **implicit commit**, so a stray schema statement inside a transaction silently ends it."}],takeaway:"Put the invariant in the `WHERE` clause. Check-then-act across two statements is a race condition."},{t:`q`,lvl:`hard`,title:`The four isolation levels and what each permits`,tag:`asked at every level`,stmt:`Name the concurrency anomalies and which isolation level prevents each.`,approaches:[{name:`The anomalies`,idea:`Three classic read anomalies, plus lost updates.`,sql:`-- DIRTY READ: T1 reads a value T2 wrote but has not committed
-- NON-REPEATABLE READ: T1 reads a row twice, T2 updated it in between
-- PHANTOM READ: T1 runs the same query twice, T2 inserted a matching row
-- LOST UPDATE: T1 and T2 both read x=5, both write x=6; one update vanishes`,why:"The first three are defined by the SQL standard; lost updates are the practical one that bites most often, and it is the reason `UPDATE t SET n = n + 1` is safe while read-modify-write in application code is not."},{name:`The levels`,idea:`Higher isolation prevents more anomalies at increasing concurrency cost.`,sql:`SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED; -- allows all three
SET TRANSACTION ISOLATION LEVEL READ COMMITTED;   -- no dirty reads
SET TRANSACTION ISOLATION LEVEL REPEATABLE READ;  -- MySQL InnoDB DEFAULT
SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;     -- no anomalies at all

SELECT @@transaction_isolation;`,why:"The standard says `REPEATABLE READ` still permits phantoms, but **InnoDB prevents them anyway** using next-key locks, which lock the gaps between index entries as well as the rows. That makes MySQL's default stronger than the standard requires — a favourite interview detail. PostgreSQL's default is `READ COMMITTED`, so the same application code can behave differently across engines. `SERIALIZABLE` in InnoDB silently converts every plain `SELECT` into `SELECT … LOCK IN SHARE MODE`, which is why it deadlocks so readily."}],takeaway:`MySQL defaults to REPEATABLE READ and blocks phantoms via next-key locks. PostgreSQL defaults to READ COMMITTED. Know both.`},{t:`q`,lvl:`hard`,title:`Two workers grab the same job`,tag:`SELECT FOR UPDATE · race condition`,stmt:`A job queue lets two workers claim the same row. Fix it.`,approaches:[{name:`The race`,idea:"A plain `SELECT` takes no lock, so both workers see the same pending job.",sql:`-- worker 1 and worker 2 both run this at the same time
SELECT id FROM jobs WHERE status = 'pending' ORDER BY id LIMIT 1;
-- both get job 42
UPDATE jobs SET status = 'running' WHERE id = 42;
-- job 42 runs twice`,why:"Under MVCC, reads do not block and do not lock, so nothing prevents two sessions reading the same row. The gap between the `SELECT` and the `UPDATE` is the entire bug."},{name:`Fix — pessimistic locking`,idea:"`FOR UPDATE` takes an exclusive lock, so the second worker waits.",sql:`START TRANSACTION;

SELECT id FROM jobs
WHERE  status = 'pending'
ORDER  BY id
LIMIT  1
FOR UPDATE SKIP LOCKED;      -- MySQL 8 / PostgreSQL 9.5+

UPDATE jobs SET status = 'running', worker = @me WHERE id = @id;
COMMIT;`,why:"`FOR UPDATE` locks the selected rows until commit. Plain `FOR UPDATE` would make worker 2 **block** until worker 1 commits and then get the same row — now claimed — so it would find nothing. `SKIP LOCKED` tells it to ignore locked rows and take the next available one instead, which is exactly the semantics a work queue needs and turns a serial bottleneck into parallel throughput. `FOR UPDATE NOWAIT` is the third option: fail immediately rather than wait."},{name:`Fix — optimistic locking`,idea:`No locks; detect the conflict at write time using a version column.`,sql:`-- read
SELECT id, version FROM jobs WHERE status = 'pending' LIMIT 1;

-- claim: succeeds only if nobody changed it in between
UPDATE jobs
SET    status = 'running', version = version + 1
WHERE  id = @id AND version = @version;

-- ROW_COUNT() = 0  =>  someone else won, retry with another row`,why:"The conditional `UPDATE` is atomic, so exactly one worker can match a given version. This scales better than locking under low contention because readers never block, and it degrades under high contention because losers must retry. The same pattern prevents lost updates in web forms: include the version in the form, and a stale submission fails rather than overwriting."}],takeaway:"Job queues: `FOR UPDATE SKIP LOCKED`. Web edits: optimistic version column. Never check-then-act across two statements."},{t:`q`,lvl:`hard`,title:`Diagnose and prevent a deadlock`,tag:`asked at Amazon, Uber`,stmt:`Two transactions deadlock intermittently. Explain the mechanism and give three fixes.`,approaches:[{name:`The mechanism`,idea:`Two transactions acquire the same locks in opposite orders.`,sql:`-- T1                              -- T2
START TRANSACTION;                 START TRANSACTION;
UPDATE acct SET b=b-10 WHERE id=1; UPDATE acct SET b=b-10 WHERE id=2;
                                   -- T2 holds lock on row 2
UPDATE acct SET b=b+10 WHERE id=2; UPDATE acct SET b=b+10 WHERE id=1;
-- T1 waits for row 2                -- T2 waits for row 1  -> DEADLOCK

SHOW ENGINE INNODB STATUS;    -- LATEST DETECTED DEADLOCK section`,why:`InnoDB detects the cycle in its wait-for graph and **rolls back the transaction that has done less work**, returning error 1213 to that client. Deadlocks are normal under concurrency, not a sign of corruption — the application must be prepared to retry.`},{name:`Fix 1 — consistent lock ordering`,idea:`If every transaction touches rows in the same order, no cycle can form.`,sql:`-- always update the lower id first
UPDATE acct SET b = b - 10 WHERE id = LEAST(@from, @to);
UPDATE acct SET b = b + 10 WHERE id = GREATEST(@from, @to);`,why:"The most reliable fix, and the only one that eliminates the deadlock rather than coping with it. Sorting the keys before locking is the general principle — it applies equally to multi-row updates, where `ORDER BY id` on the affected set imposes a deterministic acquisition order."},{name:`Fix 2 & 3 — shorter transactions and retry`,idea:`Reduce the window, and treat 1213 as retryable.`,sql:`-- keep transactions short: no HTTP calls, no user input between BEGIN and COMMIT
-- retry loop in the application
for attempt in 1..3:
    try:  run_transaction(); break
    except DeadlockError(1213):  sleep(random_backoff()); continue`,why:"Every extra millisecond between `BEGIN` and `COMMIT` widens the window for a conflict, so the single biggest practical improvement is moving anything slow — network calls, user prompts — outside the transaction. Randomised backoff prevents the two retrying transactions from colliding again immediately. Also index your `WHERE` clauses: an unindexed `UPDATE` locks far more rows than intended, since InnoDB locks every row it **examines**, not only those it changes."}],takeaway:`Deadlocks are expected. Order lock acquisition consistently, keep transactions short, and always implement a retry.`},{t:`guess`,setup:`-- InnoDB, REPEATABLE READ
-- Session A                        -- Session B
START TRANSACTION;
SELECT COUNT(*) FROM t;  -- 5
                                    INSERT INTO t VALUES (6);
                                    COMMIT;`,sql:`-- back in Session A, same transaction
SELECT COUNT(*) FROM t;
SELECT COUNT(*) FROM t FOR UPDATE;`,out:`5      -- consistent snapshot read
6      -- locking read sees the latest committed data`,why:"Under `REPEATABLE READ`, a plain `SELECT` reads from the **snapshot** established by the transaction's first read, so it keeps returning 5 no matter what others commit — that is the 'repeatable' guarantee, implemented with MVCC and undo logs. A **locking** read (`FOR UPDATE` or `LOCK IN SHARE MODE`) bypasses the snapshot and reads the current committed version, because it must lock rows that actually exist. Mixing the two in one transaction is a genuine source of confusion, and it is how a transaction can 'see' a row it just claimed does not exist."},{t:`qa`,q:`What does ACID stand for?`,a:"**Atomicity** — a transaction is all or nothing; a partial failure rolls everything back, implemented via the undo log. **Consistency** — the database moves from one valid state to another, with constraints and triggers enforced. **Isolation** — concurrent transactions do not see each other's intermediate states, controlled by the isolation level. **Durability** — once committed, the change survives a crash, implemented via the redo log and `fsync`. In MySQL, durability specifically depends on `innodb_flush_log_at_trx_commit = 1`; setting it to 2 is much faster and can lose up to a second of committed transactions on power loss."},{t:`qa`,q:`What is MVCC and how does InnoDB implement it?`,a:"Multi-Version Concurrency Control lets readers and writers avoid blocking each other by keeping multiple versions of each row. InnoDB stores hidden `DB_TRX_ID` and `DB_ROLL_PTR` columns on every row; an update writes the new version in place and pushes the old one to the **undo log**. A reading transaction consults its read view and follows the roll pointer backwards until it finds a version visible to it. This is why `SELECT` never blocks, why long-running transactions bloat the undo log and hurt performance, and why `COUNT(*)` cannot be a stored constant — each transaction may legitimately see a different count."},{t:`qa`,q:`What is the difference between a shared lock and an exclusive lock?`,a:"A **shared (S)** lock allows other transactions to read but not write the row; several can be held simultaneously. An **exclusive (X)** lock blocks both reading-with-a-lock and writing, and only one can be held. `SELECT … LOCK IN SHARE MODE` (MySQL 8: `FOR SHARE`) takes S; `SELECT … FOR UPDATE`, `UPDATE` and `DELETE` take X. InnoDB also uses **intention locks** (IS/IX) at table level so it can tell quickly whether any row-level lock exists, and **gap locks** and **next-key locks** which lock the space between index values to prevent phantoms under `REPEATABLE READ`."},{t:`qa`,q:`Why can an UPDATE without an index lock the whole table?`,a:"InnoDB places locks on the **index records it examines**, not on the rows that ultimately match. Without a usable index the engine performs a full scan, examining and therefore locking every row — effectively a table lock, even though the statement modifies one row. Adding an index on the `WHERE` column turns it into a targeted range lock. This is the single most common cause of unexplained lock waits and deadlocks in an otherwise well-behaved application, and it is why `EXPLAIN` on your `UPDATE` statements is as important as on your `SELECT`s."},{t:`qa`,q:`What is a savepoint?`,a:"A named marker inside a transaction that you can roll back to without discarding the whole thing — useful when one optional step may fail but the rest should still commit. `SAVEPOINT sp1; … ROLLBACK TO SAVEPOINT sp1; … COMMIT;`. Rolling back to a savepoint releases locks acquired after it in PostgreSQL but **not** in InnoDB, where row locks are held until the transaction ends. Savepoints are also how ORMs implement nested transactions, since SQL has no true nesting."}]}]},b={id:`index`,num:`09`,title:`Indexing & Optimization`,kicker:`B-trees, composite order, covering indexes, EXPLAIN and why queries go slow`,sections:[{id:`idx-design`,title:`Index design problems`,blocks:[{t:`q`,lvl:`medium`,title:`Get the composite index column order right`,tag:`leftmost prefix · asked constantly`,stmt:"These three queries run against `orders`. Design the minimum set of indexes.",schema:`A: WHERE cust_id = ? AND status = ? ORDER BY created_at DESC
B: WHERE cust_id = ?
C: WHERE status = ? AND created_at > ?`,hint:`A composite index can serve any leftmost prefix of its columns, and nothing else.`,approaches:[{name:`Solution`,idea:`Equality columns first, then the range or sort column.`,sql:`-- serves A fully, and B via the leftmost prefix (cust_id)
CREATE INDEX ix_cust_status_created ON orders (cust_id, status, created_at);

-- serves C; status is equality, created_at is the range
CREATE INDEX ix_status_created ON orders (status, created_at);

-- NOT needed: (cust_id) alone is redundant with the first index`,why:"A B-tree is sorted by the whole tuple, so it can be used for `(cust_id)`, `(cust_id, status)` and `(cust_id, status, created_at)` — but **not** for `(status)` alone, because entries for a given status are scattered across every `cust_id` block. That is the **leftmost-prefix rule**, and it is why query B needs no separate index while C does. The ordering rule inside a composite index is: **equality predicates first, then one range or `ORDER BY` column last**. Once a range is used, columns after it can no longer be used for seeking — only for filtering the rows already found."}],takeaway:`Composite index order: equality columns, then the range/sort column. A single-column index on the leading column is always redundant.`},{t:`q`,lvl:`medium`,title:`Make an index cover the query`,tag:`covering index`,stmt:"This query is slow despite using an index. `EXPLAIN` shows 500 000 rows examined. Fix it.",approaches:[{name:`The problem`,idea:`The index finds the rows, but every row needs a second lookup to fetch the other columns.`,sql:`SELECT cust_id, status, amount
FROM   orders
WHERE  created_at >= '2024-01-01';

-- index: (created_at)
-- plan: range scan on the index, then 500k random reads into the clustered index`,why:"In InnoDB a secondary index stores only the indexed columns plus the primary key. To return `amount` the engine must take the primary key from each index entry and look up the full row in the clustered index — a **bookmark lookup**. Half a million random reads is often slower than a sequential full table scan, which is why the optimiser sometimes *ignores* your index and is right to."},{name:`The fix`,idea:`Add the selected columns to the index so the index alone answers the query.`,sql:`CREATE INDEX ix_covering ON orders (created_at, cust_id, status, amount);

EXPLAIN SELECT cust_id, status, amount
FROM   orders WHERE created_at >= '2024-01-01';
-- Extra: Using index      <- covering: no table access at all`,out:`id  select_type  table   type   key          rows    Extra
1   SIMPLE       orders  range  ix_covering  480000  Using index`,why:"`Using index` in the Extra column means the query is **covered** — every column it needs is in the index, so the clustered index is never touched. This routinely turns a multi-second query into milliseconds. The cost is a wider index: more disk, more buffer pool, slower writes. Do not add every column reflexively; cover the queries that matter. PostgreSQL and SQL Server offer `INCLUDE` columns, which live only in the leaf pages and keep the tree itself narrow — MySQL has no equivalent."}],takeaway:"`Using index` = covered = fast. `Using index condition` = pushed-down filter but still fetching rows."},{t:`q`,lvl:`medium`,title:`Six ways to accidentally disable an index`,tag:`sargability`,stmt:`Each query below has an index on the filtered column and still scans the table. Identify why and fix each.`,approaches:[{name:`The six`,idea:`All of them break the ordering the B-tree relies on.`,sql:`-- 1. function on the column
WHERE YEAR(created_at) = 2024
  ->  WHERE created_at >= '2024-01-01' AND created_at < '2025-01-01'

-- 2. arithmetic on the column
WHERE price * 1.2 > 100
  ->  WHERE price > 100 / 1.2

-- 3. leading wildcard
WHERE email LIKE '%@gmail.com'
  ->  store a reversed or extracted domain column and index that

-- 4. implicit type conversion (phone is VARCHAR)
WHERE phone = 12345
  ->  WHERE phone = '12345'

-- 5. OR across different columns
WHERE cust_id = 5 OR status = 'new'
  ->  SELECT ... WHERE cust_id = 5
      UNION
      SELECT ... WHERE status = 'new'

-- 6. negation / low selectivity
WHERE status <> 'delivered'
  ->  WHERE status IN ('pending','shipped','cancelled')`,why:"A B-tree can only seek when the predicate constrains the **stored value**, so anything that transforms the column first forces the engine to evaluate every row. Case 4 is the nastiest because it is invisible: comparing a string column to a number makes MySQL convert the **column**, not the literal, silently disabling the index — and it can also produce wrong results, since `'12345abc'` converts to 12345. Case 5 fails because a single index cannot be seeked on two independent columns at once; the `UNION` rewrite lets each branch use its own index, and MySQL's index-merge optimisation sometimes does this for you. Case 6 is not strictly non-sargable but usually matches too many rows to be worth an index."}],takeaway:`Keep the indexed column bare on one side of the comparison. Watch for implicit string-to-number conversion — it is silent.`},{t:`q`,lvl:`hard`,title:`Read an EXPLAIN plan`,tag:`EXPLAIN`,stmt:`Interpret this plan and say what to fix.`,approaches:[{name:`The plan`,idea:"Read `type`, `key`, `rows` and `Extra` first — they carry most of the signal.",sql:`EXPLAIN
SELECT c.name, COUNT(*)
FROM   customers c
JOIN   orders o ON o.cust_id = c.cust_id
WHERE  o.status = 'pending'
GROUP  BY c.name;`,out:`id  table  type   key       rows     Extra
1   o      ALL    NULL      2000000  Using where; Using temporary; Using filesort
1   c      eq_ref PRIMARY   1        `,why:"`type = ALL` on `orders` means a **full table scan** of two million rows, and `key = NULL` confirms no index was used for the `status` filter — that is the primary problem. `Using temporary; Using filesort` means the `GROUP BY` needed an internal temp table and a sort, expected here because grouping by a column from the other table cannot use the driving index. `eq_ref` on `customers` is the best possible join type: one row fetched per outer row via a unique key. The fix is `CREATE INDEX ix_status ON orders(status)`, or better `(status, cust_id)` so the join column is covered too."},{name:`The type ladder`,idea:`Learn the access types from best to worst; the goal is to move leftward.`,sql:`system  > const  > eq_ref > ref  > range > index > ALL
  |         |        |        |      |       |       |
  |         |        |        |      |       |       full table scan  (worst)
  |         |        |        |      |       full index scan
  |         |        |        |      index range scan       <- usually the target
  |         |        |        non-unique index lookup
  |         |        unique index lookup, one row per outer row
  |         primary/unique key with a constant, read once
  single-row table`,why:"Anything at `range` or better is normally fine. `index` is a full scan of the index rather than the table — cheaper, but still O(n). `ALL` on a large table is the thing to hunt. The `rows` column is the optimiser's **estimate** from statistics, not a measurement; if it is wildly wrong, run `ANALYZE TABLE`. `EXPLAIN ANALYZE` in MySQL 8.0.18+ actually executes the query and reports real timings and row counts per operator, which is far more trustworthy for diagnosis."}],takeaway:"Scan `EXPLAIN` for `type = ALL`, `key = NULL` and a large `rows`. Use `EXPLAIN ANALYZE` when the estimate looks implausible."},{t:`q`,lvl:`medium`,title:`Why is my ORDER BY … LIMIT 10 slow?`,tag:`filesort`,stmt:`The query returns ten rows but takes seconds. Explain and fix.`,approaches:[{name:`Solution`,idea:"`LIMIT` applies last — the server may sort everything before taking ten rows.",sql:`-- slow: filters on one column, sorts on another
SELECT * FROM orders
WHERE  status = 'pending'
ORDER  BY created_at DESC
LIMIT  10;
-- index (status) alone: finds 800k rows, sorts them all, returns 10

-- fast: one index provides both the filter and the order
CREATE INDEX ix_status_created ON orders (status, created_at);
-- now the engine seeks to status='pending' and walks the index
-- backwards, stopping after 10 rows. No sort at all.`,why:"Within a fixed `status`, the index is already ordered by `created_at`, so reading it in reverse produces the rows in the required order — the optimiser can stop after ten and `Using filesort` disappears from `EXPLAIN`. The rule generalises: **an index can satisfy `ORDER BY` only if the sort columns follow the equality columns, in the same order and with compatible direction.** Mixed directions (`ORDER BY a ASC, b DESC`) need a descending index, which MySQL only supports properly from 8.0. If the sort column comes from a different table than the filter, no single index can help and a temp file sort is unavoidable."}],takeaway:"`LIMIT` does not make an unindexed sort cheap. Put the filter and the sort in one index, in that order."}]},{id:`idx-theory`,title:`Index and optimizer questions`,blocks:[{t:`qa`,q:`What data structure backs a normal index, and why not a hash table?`,a:"A **B+ tree**: a balanced tree where all values live in the leaves, which are linked together in sorted order. Lookups are O(log n) with a very high branching factor, so even a billion-row index is three or four levels deep. The linked leaves are what make **range scans** and `ORDER BY` cheap — you seek once and then walk sideways. A hash index gives O(1) equality lookups but cannot do ranges, prefix matches or ordered scans at all, which is why it is a niche option (`MEMORY` tables, InnoDB's automatic adaptive hash index) rather than the default."},{t:`qa`,q:`What is the difference between a clustered and a non-clustered index?`,a:"A **clustered** index *is* the table — the rows are stored inside its leaf pages in key order, so there is exactly one per table. In InnoDB that is the primary key, or the first `NOT NULL` unique key, or a hidden 6-byte row id if neither exists. A **secondary** index stores the indexed columns plus the primary key value as its pointer, so any column not in the index requires a second lookup into the clustered index. This is why a wide primary key inflates every secondary index, and why sequential primary keys insert faster than random ones — rows land at the end of the tree rather than causing page splits."},{t:`qa`,q:`When should you NOT add an index?`,a:"On a low-selectivity column such as a boolean flag, where following the index costs more than scanning. On a small table that fits in a page or two. On a column that is written far more often than it is read, since every index multiplies the write cost. When an existing composite index already covers the need via its leftmost prefix. And when it duplicates another index — MySQL will happily let you create `(a)` alongside `(a, b)`, which wastes space and write time for no benefit. Use `sys.schema_unused_indexes` to find indexes nothing has read."},{t:`qa`,q:`What is index selectivity and how do you measure it?`,a:"Selectivity is `COUNT(DISTINCT col) / COUNT(*)` — the fraction of rows a lookup narrows to. A value near 1 (an email column) is highly selective and ideal; near 0 (a status with three values) is not. The optimiser estimates it from statistics gathered by `ANALYZE TABLE` and stored in histograms; when those are stale it can choose badly. In a composite index, put the more selective column first **unless** query patterns dictate otherwise — the leftmost-prefix rule and the equality-before-range rule take priority over raw selectivity.",sql:`SELECT COUNT(DISTINCT status) / COUNT(*) AS status_sel,
       COUNT(DISTINCT email)  / COUNT(*) AS email_sel
FROM   customers;`},{t:`qa`,q:`How do you find slow queries in production?`,a:"Enable the **slow query log** with `long_query_time` set to something meaningful (0.5s or lower) and `log_queries_not_using_indexes`, then aggregate it with `pt-query-digest` — the top query by total time is almost never the one people suspect. `performance_schema.events_statements_summary_by_digest` gives the same picture live, without log parsing. Then take the worst offender and run `EXPLAIN ANALYZE` on it. Optimise by total time (`count × latency`), not by worst single execution: a 50 ms query run a million times matters more than a 5-second report run hourly.",sql:`SELECT digest_text, count_star, 
       ROUND(sum_timer_wait/1e12, 2) AS total_sec,
       ROUND(avg_timer_wait/1e9, 2)  AS avg_ms
FROM   performance_schema.events_statements_summary_by_digest
