ORDER  BY sum_timer_wait DESC LIMIT 10;`},{t:`qa`,q:`What is the N+1 query problem?`,a:"Fetching a list with one query and then issuing one additional query per row — 1 query for 100 orders, then 100 queries for their customers. It is the most common ORM performance bug, and it is invisible in development where the list has three rows. The fixes are to **eager load** with a join or a second `WHERE id IN (…)` query, or to use `DataLoader`-style batching. The signature in a query log is the same statement repeated hundreds of times with different parameters."},{t:`qa`,q:`What does the query optimizer actually do?`,a:"It transforms the SQL into a logical plan, generates alternative physical plans — different join orders, join algorithms and index choices — estimates the cost of each using table statistics and cardinality estimates, and picks the cheapest. It also rewrites: pushing predicates down, converting subqueries to joins, eliminating redundant joins, and merging views. It is **cost-based**, so bad statistics produce bad plans; that is why `ANALYZE TABLE` after a bulk load, and histograms on skewed columns, matter more than most query tuning."},{t:`qa`,q:`Should you denormalise for performance?`,a:"Only after measuring, and knowing exactly what you are trading. Denormalising — storing a customer's name on the order, or a cached `order_count` — removes joins and speeds reads, at the cost of **update anomalies**: every copy must be kept in sync, and any missed path lets them diverge. The safer intermediate steps are a covering index, a materialised summary table refreshed on a schedule, or a generated column. If you do denormalise, make the derived value maintained by a trigger or a single well-tested code path, never by whichever service happens to write next."},{t:`qa`,q:`What is partitioning and when does it help?`,a:"Splitting one logical table into physical pieces by a key — usually `RANGE` on a date. It helps in three specific ways: **partition pruning**, where a query filtered on the partition key reads only the relevant partitions; **instant deletion** of old data by dropping a partition; and smaller per-partition indexes. It is **not** a general performance fix — a query that does not filter on the partition key now has to scan every partition, which is slower than one unpartitioned table. In MySQL every unique key must contain the partition column, which frequently makes partitioning impossible without a schema change.",sql:`CREATE TABLE events (
  id BIGINT, created_at DATE,
  PRIMARY KEY (id, created_at)          -- partition key must be in every unique key
) PARTITION BY RANGE (YEAR(created_at)) (
  PARTITION p2023 VALUES LESS THAN (2024),
  PARTITION p2024 VALUES LESS THAN (2025),
  PARTITION pmax  VALUES LESS THAN MAXVALUE
);`}]}]},x={id:`design`,num:`10`,title:`Normalization & Design`,kicker:`Normal forms as diagnosis, keys, relationships and modelling problems`,sections:[{id:`norm-forms`,title:`Normalize a broken table`,blocks:[{t:`q`,lvl:`medium`,title:`Take a table from unnormalized to 3NF`,tag:`the classic normalization question`,stmt:`Normalise this order table. Name the anomaly each step removes.`,schema:`orders_flat
order_id | cust_name | cust_city | products              | order_date | total
1        | Ada       | Paris     | "widget, gadget"      | 2024-01-05 | 150
2        | Bruno     | Lyon      | "widget"              | 2024-01-06 |  50`,approaches:[{name:`1NF — atomic values`,idea:`No repeating groups and no multi-valued columns.`,sql:`-- violation: 'products' holds a comma-separated list
-- fix: one row per product

orders(order_id, cust_name, cust_city, order_date, total)
order_lines(order_id, product_name, qty, unit_price)`,why:"A delimited list cannot be indexed, joined or aggregated — finding every order containing 'widget' becomes a `LIKE '%widget%'` scan that also matches 'widget-pro'. First normal form is the difference between data and text that happens to live in a column. The recursive string-splitting query in chapter 4 exists only because someone skipped this step."},{name:`2NF — no partial dependency`,idea:`Every non-key column must depend on the **whole** composite key, not part of it.`,sql:`-- order_lines key is (order_id, product_name)
-- but unit_price depends only on product_name  -> partial dependency

products(product_id, product_name, unit_price)
order_lines(order_id, product_id, qty)`,why:"With `unit_price` sitting in `order_lines`, the price is repeated on every line and a price change means updating thousands of rows — an **update anomaly**. Splitting products out means the price lives in exactly one place. In practice you often *do* copy the price onto the line deliberately, because an order must record the price **at the time of sale**; that is a documented historical snapshot, not a normalisation failure. Knowing the difference is what an interviewer is checking."},{name:`3NF — no transitive dependency`,idea:`Non-key columns must not depend on other non-key columns.`,sql:`-- orders holds cust_name and cust_city, which depend on the customer,
-- which depends on order_id  ->  transitive dependency

customers(cust_id, cust_name, cust_city)
orders(order_id, cust_id, order_date)`,why:"Leaving customer details on the order causes all three anomalies at once. **Update**: a customer moving city requires editing every one of their orders, and missing one leaves the data inconsistent. **Insert**: you cannot register a customer before they order. **Delete**: removing their last order erases the customer entirely. Note `total` also disappears — it is derivable by summing the lines, and a stored total that can drift from its components is a classic bug source. Store it only if you need the historical value locked, and then treat it as a snapshot."},{name:`BCNF and beyond`,idea:`Every determinant must be a candidate key.`,sql:`-- BCNF violation: a non-key column determines part of the key
enrolment(student, course, instructor)
-- rule: each instructor teaches exactly one course
-- so instructor -> course, but instructor is not a candidate key

-- fix
teaches(instructor, course)
enrolled(student, instructor)`,why:`BCNF is a stricter 3NF that only differs when a table has **overlapping candidate keys**, which is rare in practice. Beyond it, 4NF removes multi-valued dependencies (a person's independent lists of skills and languages, which would otherwise produce a cartesian product) and 5NF handles join dependencies. Almost no production schema goes past BCNF deliberately — reaching 3NF and then denormalising consciously where measurements justify it is the real-world target.`}],takeaway:`1NF: atomic. 2NF: whole key. 3NF: nothing but the key. Each form removes a specific anomaly — name the anomaly, not just the form.`},{t:`q`,lvl:`medium`,title:`Model a many-to-many relationship`,tag:`junction table`,stmt:`Students enrol in many courses and each course has many students. Design it.`,approaches:[{name:`Solution`,idea:`A junction table with a composite primary key.`,sql:`CREATE TABLE students (student_id INT PRIMARY KEY, name VARCHAR(100));
CREATE TABLE courses  (course_id  INT PRIMARY KEY, title VARCHAR(100));

CREATE TABLE enrolments (
  student_id INT NOT NULL,
  course_id  INT NOT NULL,
  enrolled_at DATE NOT NULL,
  grade      CHAR(2) NULL,               -- attribute OF the relationship

  PRIMARY KEY (student_id, course_id),   -- prevents double enrolment
  KEY ix_course (course_id, student_id), -- serves lookups from the course side
  FOREIGN KEY (student_id) REFERENCES students(student_id),
  FOREIGN KEY (course_id)  REFERENCES courses(course_id)
);`,why:"A relational database cannot express many-to-many directly, so it becomes two one-to-many relationships through a junction table. Three details matter. The **composite primary key** enforces 'at most one enrolment per student per course' declaratively — an application check would race. The **second index with the columns reversed** is needed because the primary key can only be seeked from `student_id`; without it, 'who is in course 7' is a full scan. And `grade` belongs here because it is a property of the *relationship*, not of either entity — that is the tell that a junction table needs its own columns."}],takeaway:`Junction tables need a composite PK **and** a reverse index. Attributes of the relationship live in the junction table.`},{t:`q`,lvl:`hard`,title:`Model a hierarchy`,tag:`trees in SQL`,stmt:`Categories nest arbitrarily deep. Compare the storage options.`,approaches:[{name:`Adjacency list`,idea:`Each row points at its parent.`,sql:`CREATE TABLE categories (
  id INT PRIMARY KEY,
  name VARCHAR(100),
  parent_id INT NULL REFERENCES categories(id)
);
-- read a subtree with a recursive CTE`,why:`Trivial to store and to move a node (one update), and the natural default. Reading an arbitrary-depth subtree requires a recursive CTE, which is fine on MySQL 8 and PostgreSQL but impossible on MySQL 5.7. Depth-unbounded reads cost one join per level.`},{name:`Path enumeration`,idea:`Store the full ancestry as a string.`,sql:`CREATE TABLE categories (
  id INT PRIMARY KEY, name VARCHAR(100),
  path VARCHAR(500)    -- '/1/7/23/'
);
CREATE INDEX ix_path ON categories(path);

-- entire subtree in one indexed range scan
SELECT * FROM categories WHERE path LIKE '/1/7/%';`,why:"Subtree reads become a single prefix `LIKE`, which **is** sargable and therefore fast. The costs: moving a node requires rewriting the path of every descendant, the path length caps the depth, and it duplicates information the parent pointers already hold. Excellent for read-heavy trees that rarely change, such as a category taxonomy."},{name:`Nested sets and closure table`,idea:`Two more options with different read/write trade-offs.`,sql:`-- nested sets: pre-order left/right numbering
categories(id, name, lft, rgt)
SELECT * FROM categories WHERE lft BETWEEN 4 AND 17;   -- subtree, one range scan

-- closure table: one row per ancestor-descendant pair
category_paths(ancestor_id, descendant_id, depth)
SELECT c.* FROM category_paths p JOIN categories c ON c.id = p.descendant_id
WHERE p.ancestor_id = 7;`,why:`**Nested sets** make any subtree a single range scan, but inserting a node renumbers roughly half the table — read-optimised to an extreme. The **closure table** stores every ancestor-descendant pair explicitly, giving O(1) queries in both directions and easy 'all ancestors' lookups, at the cost of O(depth) rows per node and more complex writes. It is the most flexible option and the usual choice when the tree is both deep and frequently queried in both directions.`}],takeaway:`Adjacency list by default; path enumeration or closure table when subtree reads dominate; nested sets only when writes are rare.`},{t:`q`,lvl:`medium`,title:`Should this be one table or several?`,tag:`inheritance modelling`,stmt:"Your app has `Car`, `Truck` and `Motorcycle`, sharing some fields and differing in others. Model it three ways.",approaches:[{name:`Single table inheritance`,idea:`One table with a discriminator and nullable columns for the variants.`,sql:`vehicles(id, type, make, model, year,
         num_doors,      -- cars only
         payload_kg,     -- trucks only
         engine_cc)      -- motorcycles only`,why:"Simple, no joins, and easy to query across all types. The cost is a wide table full of NULLs and **no way to enforce** that a truck has a payload — a `NOT NULL` constraint would break the other types. Add a `CHECK` on the discriminator to recover some integrity. Fine when the variants are few and mostly overlap."},{name:`Class table inheritance`,idea:`A shared parent table plus one child table per type.`,sql:`vehicles(id, type, make, model, year)
cars(vehicle_id PK/FK, num_doors)
trucks(vehicle_id PK/FK, payload_kg)`,why:"Fully normalised and each subtype's columns can be `NOT NULL`. Querying one type needs a join, and querying across all types needs a `UNION` of joins, which gets tedious. This is what most ORMs generate for a class hierarchy, and it is the right answer when the subtypes have substantially different attributes."},{name:`Concrete table inheritance`,idea:`One independent table per type, no shared parent.`,sql:`cars(id, make, model, year, num_doors)
trucks(id, make, model, year, payload_kg)`,why:`No joins and no NULLs, but the shared columns are duplicated and there is no single id space — you cannot have one foreign key pointing at 'any vehicle'. Choose it when the types are genuinely independent and rarely queried together. The key question in all three is: **how often do you query across types?** Frequently ⇒ single table. Rarely ⇒ concrete tables. In between ⇒ class table.`}]},{t:`qa`,q:`What is denormalization and when is it justified?`,a:"Deliberately introducing redundancy to avoid joins or aggregation at read time — storing `order_count` on the customer, or copying a product name onto an order line. It is justified when a measured read path is too slow, the data is read far more than written, and you have a single reliable place that maintains the copy. It is **not** justified as a default design choice: every duplicate is a consistency bug waiting to happen. Prefer, in order: a covering index, a materialised summary table refreshed on a schedule, a generated column, and only then true denormalisation."},{t:`qa`,q:`What is the EAV pattern and why is it usually a mistake?`,a:"Entity-Attribute-Value stores each attribute as a row — `(entity_id, attribute_name, value)` — so new attributes need no schema change. The costs are severe: `value` must be a string so all typing and constraints are lost; retrieving one entity with ten attributes needs ten self-joins or a pivot; nothing can be indexed usefully; and the optimiser cannot estimate cardinality. Legitimate uses are genuinely open-ended user-defined fields and product catalogues with thousands of sparse attributes — and even then a `JSON` column with functional indexes on the few queried keys is usually better in MySQL 8."},{t:`qa`,q:`What is a candidate key, a composite key and a super key?`,a:`A **super key** is any set of columns that uniquely identifies a row — including sets with redundant columns. A **candidate key** is a minimal super key: remove any column and uniqueness is lost. One candidate key is chosen as the **primary key**; the others become **alternate keys** and should get unique constraints. A **composite key** is simply a key made of more than one column. A **surrogate key** is an artificial candidate key with no business meaning.`},{t:`qa`,q:`How do you model a one-to-one relationship, and why would you?`,a:"Put a unique foreign key on one side, usually the optional one: `user_profiles(user_id PK/FK, bio, avatar_url)`. The reason to split rather than adding columns to `users` is **vertical partitioning** — moving large or rarely read columns (a TEXT bio, a BLOB) out of the hot table keeps more rows per page and more of the hot table in the buffer pool. The other reasons are security, where sensitive columns get separate access control, and genuine optionality where most rows would have NULLs."},{t:`qa`,q:`Should you use soft deletes?`,a:"A `deleted_at TIMESTAMP NULL` column instead of physically removing rows. It preserves history, makes 'undo' trivial, and avoids breaking foreign keys — which is why audit-sensitive systems use it. The costs are real: **every query must remember the filter** or deleted rows leak into results, unique constraints stop working as intended (a deleted email still blocks re-registration), and tables grow without bound. Mitigations are a view that applies the filter, a partial unique index where supported, and an archival job that moves old soft-deleted rows out."},{t:`qa`,q:`What is a surrogate key versus a natural key, in one sentence each?`,a:`A **natural key** is existing business data that uniquely identifies a row, such as an ISBN or a country code; a **surrogate key** is a system-generated identifier with no business meaning. Prefer a surrogate primary key because business data changes and changing keys cascade painfully, but always add a **unique constraint on the natural key** so the database still enforces the real-world rule.`}]}]},ee={id:`programmatic`,num:`11`,title:`Views, Procedures & Triggers`,kicker:`Server-side objects, and when they help rather than hurt`,sections:[{id:`prog-views`,title:`Views`,blocks:[{t:`q`,lvl:`easy`,title:`Create a view and understand what it is not`,tag:`VIEW`,stmt:`Create a view of active customers with their order totals, then explain what happens when the underlying data changes.`,approaches:[{name:`Solution`,idea:`A view is a stored query, not stored data.`,sql:`CREATE OR REPLACE VIEW v_customer_summary AS
SELECT c.cust_id,
       c.name,
       c.country,
       COUNT(o.order_id)            AS order_count,
       COALESCE(SUM(o.amount), 0)   AS lifetime_value
FROM   customers c
LEFT   JOIN orders o ON o.cust_id = c.cust_id
WHERE  c.status = 'active'
GROUP  BY c.cust_id, c.name, c.country;

SELECT * FROM v_customer_summary WHERE country = 'FR';`,why:"The view holds no rows — the definition is expanded into your query and executed every time, so results are always current. That also means **no performance benefit**: querying the view above with a country filter still aggregates every active customer's orders first unless the optimiser can push the predicate down, which it often cannot through a `GROUP BY`. Views earn their place through **abstraction and security**: hide a complex join, expose a subset of columns, and grant access to the view rather than the tables."}],takeaway:`A view is a named query. It simplifies code and restricts access; it does not make anything faster.`},{t:`q`,lvl:`medium`,title:`When is a view updatable?`,tag:`updatable views`,stmt:"Which of these views can you `INSERT` into, and why?",approaches:[{name:`Solution`,idea:`A view is updatable only if each output row maps to exactly one base-table row.`,sql:`-- updatable: simple projection and filter
CREATE VIEW v_fr AS
SELECT cust_id, name, country FROM customers WHERE country = 'FR';

UPDATE v_fr SET name = 'Ada L.' WHERE cust_id = 1;   -- works

-- NOT updatable: aggregation destroys the row mapping
CREATE VIEW v_totals AS
SELECT country, SUM(amount) AS total FROM orders GROUP BY country;

-- also not updatable: DISTINCT, UNION, GROUP BY, HAVING,
-- window functions, or a subquery in the select list

-- WITH CHECK OPTION stops rows escaping the view's own filter
CREATE VIEW v_fr_checked AS
SELECT cust_id, name, country FROM customers WHERE country = 'FR'
WITH CHECK OPTION;

INSERT INTO v_fr_checked VALUES (99, 'X', 'DE');
-- ERROR 1369: CHECK OPTION failed`,why:"The engine must be able to translate a change to a view row into a change to exactly one base row; aggregation, `DISTINCT` and `UNION` all break that mapping. Without `WITH CHECK OPTION`, inserting a German customer through a French-only view **succeeds and then vanishes** from the view — a genuinely confusing bug. For non-updatable views, PostgreSQL and Oracle offer `INSTEAD OF` triggers to define the write behaviour manually; MySQL does not."}]},{t:`q`,lvl:`medium`,title:`Materialized views in MySQL`,tag:`portability`,stmt:"MySQL has no `MATERIALIZED VIEW`. How do you get one?",approaches:[{name:`Summary table plus refresh`,idea:`Build a real table and keep it up to date on a schedule.`,sql:`CREATE TABLE mv_daily_revenue (
  day DATE PRIMARY KEY,
  orders INT NOT NULL,
  revenue DECIMAL(14,2) NOT NULL,
  refreshed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- full refresh
REPLACE INTO mv_daily_revenue (day, orders, revenue)
SELECT DATE(order_date), COUNT(*), SUM(amount)
FROM   orders
GROUP  BY DATE(order_date);

-- incremental refresh: only recent days
REPLACE INTO mv_daily_revenue (day, orders, revenue)
SELECT DATE(order_date), COUNT(*), SUM(amount)
FROM   orders
WHERE  order_date >= CURDATE() - INTERVAL 3 DAY
GROUP  BY DATE(order_date);

-- schedule it
CREATE EVENT ev_refresh_revenue
  ON SCHEDULE EVERY 1 HOUR
  DO REPLACE INTO mv_daily_revenue ... ;`,why:"PostgreSQL and Oracle have `CREATE MATERIALIZED VIEW` with `REFRESH` built in; in MySQL you build it yourself. The incremental variant is the one that matters in production — recomputing every day of history hourly does not scale, whereas refreshing the last few days does. `REPLACE INTO` needs the primary key to match so it overwrites rather than duplicating; `INSERT … ON DUPLICATE KEY UPDATE` is the gentler alternative since `REPLACE` deletes and reinserts, which fires delete triggers and churns auto-increment values. Note MySQL events require `event_scheduler = ON`, which is off by default."}],takeaway:`A materialised view in MySQL is a summary table plus a scheduled incremental refresh. Refresh recent partitions, not the whole history.`}]},{id:`prog-proc`,title:`Stored procedures, functions and triggers`,blocks:[{t:`q`,lvl:`medium`,title:`Write a stored procedure with error handling`,tag:`procedures`,stmt:`Write a procedure that transfers money between accounts and rolls back cleanly on any failure.`,approaches:[{name:`Solution`,idea:`Declare an exit handler that rolls back and re-raises.`,sql:`DELIMITER $$

CREATE PROCEDURE transfer_funds(
  IN  p_from    INT,
  IN  p_to      INT,
  IN  p_amount  DECIMAL(12,2),
  OUT p_status  VARCHAR(50)
)
BEGIN
  DECLARE v_balance DECIMAL(12,2);

  -- any SQL exception: undo everything and report it
  DECLARE EXIT HANDLER FOR SQLEXCEPTION
  BEGIN
    ROLLBACK;
    SET p_status = 'failed';
    RESIGNAL;                      -- do not swallow the original error
  END;

  START TRANSACTION;

    SELECT balance INTO v_balance
    FROM   accounts WHERE id = p_from FOR UPDATE;

    IF v_balance < p_amount THEN
      SIGNAL SQLSTATE '45000'
        SET MESSAGE_TEXT = 'Insufficient funds';
    END IF;

    UPDATE accounts SET balance = balance - p_amount WHERE id = p_from;
    UPDATE accounts SET balance = balance + p_amount WHERE id = p_to;

  COMMIT;
  SET p_status = 'ok';
END$$

DELIMITER ;

CALL transfer_funds(1, 2, 100.00, @st);
SELECT @st;`,why:"`DELIMITER` is required because the procedure body contains semicolons that would otherwise end the statement early — a constant stumbling block for people writing their first procedure. `EXIT HANDLER FOR SQLEXCEPTION` catches any error, and `RESIGNAL` re-raises it so the caller is not left thinking the operation succeeded quietly. `SIGNAL SQLSTATE '45000'` is how you raise a custom application error; 45000 is the reserved 'unhandled user-defined exception' state. `FOR UPDATE` locks the source row so the balance check and the debit cannot be raced."}],takeaway:"Every procedure that opens a transaction needs an `EXIT HANDLER` with `ROLLBACK` and `RESIGNAL`. Without it, a failure leaves the transaction open."},{t:`q`,lvl:`medium`,title:`Stored function versus stored procedure`,tag:`comparison`,stmt:`Write a function that returns a customer's lifetime value, and explain when a function is the wrong choice.`,approaches:[{name:`Solution`,idea:`A function returns one value and can be used inside a query; a procedure cannot.`,sql:`DELIMITER $$
CREATE FUNCTION customer_ltv(p_cust INT)
RETURNS DECIMAL(14,2)
DETERMINISTIC READS SQL DATA
BEGIN
  DECLARE v DECIMAL(14,2);
  SELECT COALESCE(SUM(amount), 0) INTO v
  FROM   orders WHERE cust_id = p_cust;
  RETURN v;
END$$
DELIMITER ;

SELECT name, customer_ltv(cust_id) AS ltv FROM customers;`,why:"This works and is a **performance trap**: the function executes once per row, so a hundred thousand customers means a hundred thousand separate aggregate queries. MySQL cannot inline it or parallelise it, and `EXPLAIN` will not show the hidden work. A single `LEFT JOIN … GROUP BY` produces the same result in one pass. The characteristics matter too — declaring `DETERMINISTIC` when the function is not is a correctness bug, because the optimiser and the binary log may cache or replay it incorrectly."},{name:`Comparison`,idea:`The practical differences.`,sql:`-- FUNCTION                        -- PROCEDURE
-- returns exactly one value       -- returns nothing, or result sets, or OUT params
-- usable inside SELECT/WHERE      -- invoked with CALL only
-- IN parameters only              -- IN, OUT, INOUT
-- cannot (usefully) do DDL/DML    -- can do anything
-- runs per row: watch the cost    -- runs once per call`,why:`Choose a function when you need a reusable scalar expression and the row count is small. Choose a procedure for multi-step operations, batch jobs and anything transactional. The broader design question — whether business logic belongs in the database at all — usually resolves against it: procedures are hard to version-control, hard to test, invisible to application profilers, and tie you to one engine. The strong cases for them are batch data manipulation where moving rows to the client is the bottleneck, and enforcing invariants that must hold no matter which client writes.`}]},{t:`q`,lvl:`medium`,title:`Write an audit trigger`,tag:`triggers`,stmt:"Record every change to `salary` in an audit table, capturing old and new values.",approaches:[{name:`Solution`,idea:"`AFTER UPDATE` with the `OLD` and `NEW` pseudo-rows.",sql:`CREATE TABLE salary_audit (
  audit_id   BIGINT AUTO_INCREMENT PRIMARY KEY,
  emp_id     INT NOT NULL,
  old_salary DECIMAL(12,2),
  new_salary DECIMAL(12,2),
  changed_by VARCHAR(100),
  changed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

DELIMITER $$
CREATE TRIGGER trg_salary_audit
AFTER UPDATE ON employees
FOR EACH ROW
BEGIN
  IF NEW.salary <=> OLD.salary = 0 THEN      -- null-safe inequality
    INSERT INTO salary_audit (emp_id, old_salary, new_salary, changed_by)
    VALUES (OLD.emp_id, OLD.salary, NEW.salary, CURRENT_USER());
  END IF;
END$$
DELIMITER ;`,why:"`OLD` is available in `UPDATE` and `DELETE` triggers, `NEW` in `INSERT` and `UPDATE`. The null-safe comparison matters: `NEW.salary <> OLD.salary` is UNKNOWN when either is NULL, so a change from NULL to a value would go unrecorded. Use `BEFORE` triggers to modify `NEW` values or reject a row with `SIGNAL`; use `AFTER` for logging and side effects. MySQL supports **one trigger per timing/event combination per table** before 8.0.9 and multiple with `FOLLOWS`/`PRECEDES` after — but multiple triggers on one table make execution order a subtle dependency."}],takeaway:"Triggers are invisible in application code and in `EXPLAIN`. Use them for auditing and hard invariants, never for business workflow."},{t:`guess`,setup:`CREATE TRIGGER t BEFORE INSERT ON a FOR EACH ROW
  SET NEW.code = UPPER(NEW.code);`,sql:`INSERT INTO a (code) VALUES ('abc');
SELECT code FROM a;

-- then, in one statement:
INSERT INTO a (code) VALUES ('x'), ('y'), ('z');
-- how many times does the trigger fire?`,out:`ABC

-- three times: FOR EACH ROW means per row, not per statement`,why:"MySQL supports only **row-level** triggers, so a multi-row `INSERT` fires the trigger once per row — which is why a trigger doing anything expensive turns a bulk load into a crawl. `LOAD DATA INFILE` also fires them. `BEFORE INSERT` can modify `NEW`, which is how normalisation-on-write is implemented; an `AFTER` trigger cannot, because the row is already stored. Note that a trigger failing rolls back the whole statement, and in InnoDB the trigger runs inside the same transaction, so it can deadlock with the statement that fired it."},{t:`qa`,q:`What are the main arguments against triggers?`,a:"They are **invisible**: nothing in the application code hints that inserting a row also writes three others, so debugging means knowing to look. They do not appear in `EXPLAIN`, so their cost is unattributed. They fire per row, magnifying bulk operations. They run inside the caller's transaction, so they extend lock duration and can deadlock. And cascading triggers — one firing another — are genuinely hard to reason about. Legitimate uses are auditing, maintaining a denormalised counter, and enforcing an invariant that must hold regardless of which client writes."},{t:`qa`,q:`What is a cursor and why should you usually avoid one?`,a:"A cursor iterates a result set row by row inside a procedure. It is almost always the wrong tool, because SQL is set-based: a loop that updates a million rows one at a time will be orders of magnitude slower than a single `UPDATE … JOIN`, and holds locks far longer. Legitimate uses are calling an external procedure per row, or batching an enormous operation into chunks deliberately. If you find yourself writing `DECLARE … CURSOR FOR SELECT`, the first question should be whether the loop body could be expressed as a join.",sql:`DECLARE done INT DEFAULT 0;
DECLARE cur CURSOR FOR SELECT id FROM t;
DECLARE CONTINUE HANDLER FOR NOT FOUND SET done = 1;
OPEN cur;
read_loop: LOOP
  FETCH cur INTO v_id;
  IF done THEN LEAVE read_loop; END IF;
  -- per-row work
END LOOP;
CLOSE cur;`},{t:`qa`,q:`What is a prepared statement and why does it matter for security?`,a:`The SQL text is sent once with placeholders and parsed into a plan; the parameters are sent separately and are never interpolated into the statement text. That makes **SQL injection structurally impossible** — a parameter can only ever be a value, never syntax. It also saves reparsing on repeated execution. The critical limitation is that placeholders can only stand in for values, not identifiers: you cannot parameterise a table or column name, so dynamic sorting must validate the column against an allowlist rather than concatenating user input.`,sql:`PREPARE stmt FROM 'SELECT * FROM users WHERE email = ?';
SET @e = 'ada@example.com';
EXECUTE stmt USING @e;
DEALLOCATE PREPARE stmt;`},{t:`qa`,q:`How do you grant a user read-only access to one schema?`,a:"Grant the minimum privilege at the narrowest scope. Avoid `GRANT ALL` and avoid granting on `*.*`. Privileges take effect on the user's next connection unless you `FLUSH PRIVILEGES` after editing the grant tables directly — which you should not do.",sql:`CREATE USER 'reporting'@'10.0.%' IDENTIFIED BY '...';
GRANT SELECT ON analytics.* TO 'reporting'@'10.0.%';
GRANT SELECT (id, name) ON app.customers TO 'reporting'@'10.0.%';  -- column-level
REVOKE SELECT ON analytics.salaries FROM 'reporting'@'10.0.%';
SHOW GRANTS FOR 'reporting'@'10.0.%';`},{t:`qa`,q:`What is the difference between DDL, DML, DQL, DCL and TCL?`,a:"**DDL** (Data Definition) — `CREATE`, `ALTER`, `DROP`, `TRUNCATE`: defines structure and causes an implicit commit in MySQL. **DML** (Data Manipulation) — `INSERT`, `UPDATE`, `DELETE`: changes rows and is transactional. **DQL** (Data Query) — `SELECT`. **DCL** (Data Control) — `GRANT`, `REVOKE`. **TCL** (Transaction Control) — `COMMIT`, `ROLLBACK`, `SAVEPOINT`. The practical consequence worth stating is the implicit commit: a `CREATE TABLE` in the middle of a transaction silently commits everything before it."}]}]},te={id:`tricky`,num:`12`,title:`Predict the Output`,kicker:`Snippets that separate memorising syntax from understanding semantics`,sections:[{id:`tricky-null`,title:`NULLs and three-valued logic`,blurb:`Commit to an answer before revealing. These come up verbatim in screening tests.`,blocks:[{t:`guess`,setup:`t(a, b):  (1, 1), (2, NULL), (NULL, 3)`,sql:`SELECT COUNT(*), COUNT(a), COUNT(b), COUNT(a + b) FROM t;`,out:`3   2   2   1`,why:"`COUNT(*)` counts rows. `COUNT(a)` and `COUNT(b)` each count non-NULL values, so both are 2. `COUNT(a + b)` counts non-NULL **results of the expression** — and any arithmetic involving NULL yields NULL, so only the `(1, 1)` row contributes. Arithmetic propagates NULL; only `COALESCE`, `IFNULL` and the `IS` operators stop it."},{t:`guess`,setup:`t(v): 1, 2, 3, NULL`,sql:`SELECT COUNT(*) FROM t WHERE v <> 2;`,out:`2`,why:"Rows 1 and 3 match. The NULL row evaluates `NULL <> 2` to UNKNOWN, and `WHERE` keeps only TRUE — so it is excluded even though a NULL is certainly 'not 2' in plain English. To include it you must say so explicitly: `WHERE v <> 2 OR v IS NULL`. This is why a `NOT` filter on a nullable column almost always loses rows people expected to keep."},{t:`guess`,setup:`a(x): 1, 2       b(y): 2, NULL`,sql:`SELECT COUNT(*) FROM a WHERE x IN     (SELECT y FROM b);
SELECT COUNT(*) FROM a WHERE x NOT IN (SELECT y FROM b);`,out:`1
0`,why:"`IN` works fine: `2 IN (2, NULL)` is TRUE, `1 IN (2, NULL)` is UNKNOWN, so one row matches. `NOT IN` collapses entirely — `1 NOT IN (2, NULL)` expands to `1<>2 AND 1<>NULL`, which is `TRUE AND UNKNOWN` = UNKNOWN, so **no row can ever be TRUE**. The query silently returns nothing. `NOT EXISTS` would correctly return 1."},{t:`guess`,setup:`t(g, v):  (A,1), (A,NULL), (B,NULL), (B,NULL)`,sql:`SELECT g, COUNT(v), SUM(v), MAX(v) FROM t GROUP BY g;`,out:`g  COUNT(v)  SUM(v)  MAX(v)
A  1         1       1
B  0         NULL    NULL`,why:"Group B has rows but no non-NULL values, so `COUNT` gives **0** while `SUM` and `MAX` give **NULL**. That asymmetry matters when the total feeds arithmetic downstream: `SUM(v) * 2` becomes NULL rather than 0. Wrap it — `COALESCE(SUM(v), 0)` — whenever the result is consumed rather than displayed."},{t:`guess`,setup:`t(v): NULL, NULL, 1`,sql:`SELECT COUNT(DISTINCT v) FROM t;
SELECT v FROM t GROUP BY v;
SELECT DISTINCT v FROM t;`,out:`1

NULL
1

NULL
1`,why:"`COUNT(DISTINCT v)` ignores NULL entirely, giving 1. But `GROUP BY` and `DISTINCT` both **treat all NULLs as a single group** and emit one NULL row — the only place in SQL where NULLs are considered equal to each other. So the count says one distinct value while the grouping shows two rows, which looks contradictory until you know the rule."},{t:`guess`,setup:`t(v): 5, NULL`,sql:`SELECT v,
       CASE v WHEN NULL THEN 'is null' ELSE 'not null' END AS simple_case,
       CASE WHEN v IS NULL THEN 'is null' ELSE 'not null' END AS searched_case
FROM t;`,out:`v     simple_case  searched_case
5     not null     not null
NULL  not null     is null`,why:"The **simple** `CASE v WHEN NULL` compiles to `v = NULL`, which is UNKNOWN and therefore never matches — so the NULL row falls through to `ELSE`. Only the **searched** form with an explicit `IS NULL` works. This is the same `= NULL` trap in a different costume, and it is one of the most commonly missed puzzles because the simple form looks correct."}]},{id:`tricky-join`,title:`Joins, grouping and ordering`,blocks:[{t:`guess`,setup:`a(id): 1, 2, 3
b(id, v): (1,'x'), (1,'y'), (2,'z')`,sql:`SELECT COUNT(*) FROM a LEFT JOIN b ON b.id = a.id;
SELECT COUNT(*) FROM a LEFT JOIN b ON b.id = a.id WHERE b.v IS NOT NULL;
SELECT COUNT(*) FROM a LEFT JOIN b ON b.id = a.id AND b.v = 'x';`,out:`4
3
4`,why:"First: id 1 matches twice, id 2 once, id 3 is padded — 2 + 1 + 1 = 4. Second: the `WHERE` drops the padded row, demoting it to an inner join, so 3. Third: the extra condition moves into `ON`, so it only restricts **which right rows are eligible** — id 1 now matches only 'x', ids 2 and 3 are padded, still 4 rows. Same predicate, two positions, different answers: this is the LEFT JOIN trap in numeric form."},{t:`guess`,setup:`a(id): 1, 1, 2
b(id): 1, 1, 1`,sql:`SELECT COUNT(*) FROM a JOIN b ON a.id = b.id;`,out:`6`,why:"Two rows with id 1 on the left times three on the right gives 2 × 3 = 6; id 2 matches nothing. Joins produce the **cartesian product of matching groups**, which is the mechanism behind every doubled-`SUM` bug. Before writing a join, check whether the key is unique on at least one side — if not, expect multiplication and use `COUNT(DISTINCT …)` or pre-aggregate."},{t:`guess`,setup:`emp(dept, sal): (A,10), (A,20), (B,30)`,sql:`SELECT dept, sal FROM emp GROUP BY dept;`,out:`-- MySQL 5.6 or ONLY_FULL_GROUP_BY disabled:
A  10        <- arbitrary row from the group
B  30

-- MySQL 5.7+ default / PostgreSQL / standard SQL:
ERROR 1055: 'sal' is not in GROUP BY and is not aggregated`,why:"A group has many rows and one output slot, so the value of `sal` is undefined. MySQL historically picked one arbitrarily, producing results that looked right in testing and were wrong in production — someone's salary paired with a different person's department. `ONLY_FULL_GROUP_BY` has been on by default since 5.7. When you genuinely want 'the row with the max', use a window function or a self-join, not an unaggregated column."},{t:`guess`,setup:`t(v): 'b', 'A', 'a', 'B'`,sql:`SELECT v FROM t ORDER BY v;
SELECT COUNT(*) FROM t WHERE v = 'a';`,out:`-- with the default utf8mb4_0900_ai_ci collation
A
a
b
B

2`,why:"MySQL's default collation ends in `_ci` — **case-insensitive** — so `'a' = 'A'` is TRUE and the count is 2, while the sort treats them as equal and their relative order is unspecified. Under a `_bin` or `_cs` collation the count would be 1 and the sort would be by code point, putting all uppercase first. String behaviour in MySQL is a property of the column's collation, not of the query, which is why the same SQL gives different answers on different servers."},{t:`guess`,setup:`t(v): 10, 9, 100`,sql:`-- v is VARCHAR
SELECT v FROM t ORDER BY v;
SELECT v FROM t ORDER BY v + 0;`,out:`10
100
9

9
10
100`,why:"A `VARCHAR` column sorts **lexicographically**, so '100' comes before '9' because '1' < '9'. Adding zero forces a numeric conversion and the correct order. The real lesson is upstream: numbers stored as strings sort wrongly, compare wrongly, and — because `WHERE v = 9` forces MySQL to convert the **column** rather than the literal — silently disable the index. Fix the column type rather than patching every query."},{t:`guess`,setup:`t(v): 1, 2, 3, 4, 5`,sql:`SELECT v FROM t ORDER BY v DESC LIMIT 2 OFFSET 1;
SELECT COUNT(*) FROM (SELECT v FROM t LIMIT 2) x;`,out:`4
3

2`,why:"`LIMIT 2 OFFSET 1` skips one row of the ordered result and returns the next two — so the second and third largest. The second query shows `LIMIT` applying **inside** the derived table before the outer aggregate, which is how you count a capped subset. Note that `LIMIT` without `ORDER BY` returns an arbitrary set of rows, and the arbitrariness can change between executions as the plan changes."}]},{id:`tricky-misc`,title:`Types, functions and evaluation order`,blocks:[{t:`guess`,setup:`t(id INT, code VARCHAR(10))
rows: (1,'5'), (2,'5abc'), (3,'abc')`,sql:`SELECT COUNT(*) FROM t WHERE code = 5;`,out:`2`,why:"Comparing a string column to a number makes MySQL convert the **column to a number**, not the literal to a string. `'5'` becomes 5 and `'5abc'` also becomes 5 with a truncation warning, so both match; `'abc'` becomes 0. Two things go wrong at once: the result is wrong, and converting the column disables any index on `code`. Always quote string literals — `WHERE code = '5'` returns 1 row and uses the index."},{t:`guess`,sql:`SELECT 0.1 + 0.2 = 0.3            AS decimal_cmp,
       CAST(0.1 AS DOUBLE) + CAST(0.2 AS DOUBLE) = 0.3 AS float_cmp,
       1/3 * 3 = 1                AS div_cmp;`,out:`decimal_cmp  float_cmp  div_cmp
1            0          0`,why:"Unsuffixed decimal literals in MySQL are `DECIMAL`, which is exact, so the first comparison is TRUE. Force them to binary floating point and 0.1 + 0.2 lands one ulp above 0.3, so it is FALSE — the same behaviour as every other language. The third fails because `1/3` is rounded to four decimal places by `div_precision_increment`, and 0.3333 × 3 is 0.9999. Never compare computed floats for equality; compare with a tolerance, and store money as `DECIMAL`."},{t:`guess`,setup:`t(v): 1, 2, 3`,sql:`SELECT v, v * 2 AS dbl FROM t WHERE dbl > 2;
SELECT v, v * 2 AS dbl FROM t ORDER BY dbl DESC;`,out:`-- first: ERROR 1054: Unknown column 'dbl' in 'where clause'

-- second: works
3  6
2  4
1  2`,why:"`WHERE` is evaluated **before** the `SELECT` list, so the alias does not exist yet. `ORDER BY` runs **after**, so it can see it — as can `GROUP BY` and `HAVING` in MySQL as an extension. Knowing the logical processing order (FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT) explains this and half a dozen related surprises."},{t:`guess`,setup:`t(v): 'a', 'b'`,sql:`SELECT CONCAT('x', NULL, 'y')      AS mysql_concat,
       CONCAT_WS('-', 'a', NULL, 'b') AS concat_ws,
       'x' + NULL                     AS arith;`,out:`mysql_concat  concat_ws  arith
NULL          a-b        NULL`,why:"`CONCAT` propagates NULL — one NULL argument nulls the whole result, which is why building a display name from optional parts silently produces NULL rows. `CONCAT_WS` ('with separator') **skips** NULLs, making it the right tool for joining optional fields. In PostgreSQL the `||` operator propagates NULL the same way, so `COALESCE` each part."},{t:`guess`,setup:`-- MySQL, default sql_mode`,sql:`SELECT ''      = 0    AS a,
       'abc'   = 0    AS b,
       NULL    = 0    AS c,
       0       = FALSE AS d,
       'a'     = 'A'  AS e;`,out:`a  b  c     d  e
1  1  NULL  1  1`,why:"Comparing a string to a number coerces the string: `''` and `'abc'` both become 0, so both equal 0 — which is why `WHERE status = 0` can match textual junk. `FALSE` is literally the integer 0 in MySQL, since there is no real boolean type. And `'a' = 'A'` is TRUE under the default case-insensitive collation. Four different surprises in five comparisons, all stemming from MySQL's permissive type coercion."},{t:`guess`,setup:`t(v): 3, 1, 2`,sql:`SELECT v,
       SUM(v) OVER (ORDER BY v) AS running,
       SUM(v) OVER ()           AS total,
       COUNT(*) OVER ()         AS n
FROM t;`,out:`v  running  total  n
1  1        6      3
2  3        6      3
3  6        6      3`,why:"Adding `ORDER BY` inside `OVER` implicitly sets the frame to 'everything up to the current row', producing a running total — many people expect the group total and are surprised. An **empty** `OVER ()` has no ordering and therefore no frame restriction, so it aggregates the whole result set and repeats it on every row, which is the neat way to add a grand total or compute each row's share of the whole."},{t:`guess`,setup:`CREATE TABLE t (id INT PRIMARY KEY AUTO_INCREMENT, v INT);
INSERT INTO t (v) VALUES (1), (2);
-- one transaction inserts and rolls back
START TRANSACTION; INSERT INTO t (v) VALUES (3); ROLLBACK;`,sql:`INSERT INTO t (v) VALUES (4);
SELECT id FROM t;`,out:`1
2
4      <- id 3 was consumed and never reused`,why:"Auto-increment values are allocated **outside** the transaction so that concurrent inserters never block each other waiting for a sequence. A rollback therefore burns the value permanently. The same happens with failed inserts and with `ON DUPLICATE KEY UPDATE`. The practical consequence is that auto-increment ids guarantee uniqueness and rough ordering, but **never** density — any code that assumes 'no gaps' or uses `MAX(id)` as a row count is wrong."},{t:`guess`,setup:`t(v): 1, 2, 3`,sql:`SELECT * FROM t WHERE v > (SELECT AVG(v) FROM t);
SELECT * FROM t WHERE v > (SELECT AVG(v) FROM t WHERE v > 10);`,out:`3

-- second query: no rows`,why:"The first subquery returns 2, so only 3 qualifies. The second subquery matches nothing, and an aggregate over an empty set returns **NULL** rather than zero or an error — so the comparison becomes `v > NULL`, which is UNKNOWN for every row and the result is empty. An empty scalar subquery silently poisons the outer predicate, which is why a report that returns nothing is often an upstream filter problem rather than a missing-data problem."}]}]},S={id:`advanced`,num:`13`,title:`Advanced Problem Set`,kicker:`The queries that decide SQL rounds: ranking, cohorts, sessions, hierarchies`,sections:[{id:`adv-rank`,title:`Ranking and top-N`,blocks:[{t:`q`,lvl:`medium`,title:`Nth highest salary, three ways`,tag:`LeetCode 177 · asked everywhere`,stmt:`Return the 2nd highest **distinct** salary. Return NULL if it does not exist.`,approaches:[{name:`DENSE_RANK`,idea:`Ties share a rank and no ranks are skipped, which matches 'distinct'.`,sql:`SELECT MAX(salary) AS second_highest
FROM (
  SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS r
  FROM   employees
) t
WHERE r = 2;`,why:"The outer `MAX` is doing quiet work: an aggregate with no `GROUP BY` always returns exactly one row, so when there is no second salary it returns **NULL** rather than an empty result — which is what the problem asks for. Without it, a bare `SELECT salary … WHERE r = 2` returns zero rows. `RANK()` would be wrong here: with two people tied at the top it skips rank 2 entirely."},{name:`LIMIT / OFFSET`,idea:`Skip N−1 distinct values.`,sql:`SELECT (
  SELECT DISTINCT salary
  FROM   employees
  ORDER  BY salary DESC
  LIMIT  1 OFFSET 1
) AS second_highest;`,why:"Wrapping it in an outer `SELECT` is the trick that produces NULL instead of no rows when the offset runs past the end. Simple and fast for small N, but `OFFSET` is O(N) — asking for the 10,000th highest scans 10,000 rows."},{name:`Correlated count (portable)`,idea:`A value is the Nth highest when exactly N−1 distinct values exceed it.`,sql:`SELECT DISTINCT e.salary
FROM   employees e
WHERE  1 = (SELECT COUNT(DISTINCT e2.salary)
            FROM   employees e2
            WHERE  e2.salary > e.salary);`,why:"Works on any engine including MySQL 5.7 and is the answer older interviewers expect. The cost is a subquery per row, so it is O(n²) without a supporting index — correct but not something to run on a large table. Change `1` to `N−1` for the general case."}],takeaway:`Wrap the result in an aggregate or an outer SELECT so 'no such row' returns NULL rather than an empty set.`},{t:`q`,lvl:`medium`,title:`Department top three earners`,tag:`LeetCode 185 · asked at Amazon, Meta`,stmt:`For each department, list employees whose salary is among the top three **distinct** salaries in that department.`,approaches:[{name:`DENSE_RANK`,idea:`Partition by department, rank by salary, keep ranks 1–3.`,sql:`SELECT d.dept_name, t.name, t.salary
FROM (
  SELECT e.*,
         DENSE_RANK() OVER (PARTITION BY dept_id
                            ORDER BY salary DESC) AS r
  FROM   employees e
) t
JOIN   departments d ON d.dept_id = t.dept_id
WHERE  t.r <= 3
ORDER  BY d.dept_name, t.salary DESC;`,why:"`DENSE_RANK` is specified because the question says *distinct salaries* — five people all earning the top salary should all appear, and they all get rank 1. `ROW_NUMBER` would return exactly three people, and `RANK` would skip ranks after ties so you might get fewer than three distinct levels. Reading the tie requirement carefully is most of this problem."},{name:`Correlated count (MySQL 5.7)`,idea:`Count how many distinct higher salaries exist in the same department.`,sql:`SELECT d.dept_name, e.name, e.salary
FROM   employees e
JOIN   departments d ON d.dept_id = e.dept_id
WHERE  3 > (SELECT COUNT(DISTINCT e2.salary)
            FROM   employees e2
            WHERE  e2.dept_id = e.dept_id
              AND  e2.salary  > e.salary);`,why:"'Fewer than three distinct salaries above me' is exactly 'I am in the top three'. It is the pre-window-function idiom and still appears in legacy code. Needs an index on `(dept_id, salary)` to be usable at all."}]},{t:`q`,lvl:`medium`,title:`Rank with a running percentile`,tag:`reporting`,stmt:`For each product, show its revenue, its rank, its share of total revenue, and the cumulative share — so you can find the products making up 80% of sales.`,approaches:[{name:`Solution`,idea:`Combine a partitionless total, a rank, and a running sum in one pass.`,sql:`WITH rev AS (
  SELECT p.product_id, p.name, SUM(oi.qty * oi.unit_price) AS revenue
  FROM   products p
  JOIN   order_items oi ON oi.product_id = p.product_id
  GROUP  BY p.product_id, p.name
)
SELECT name,
       revenue,
       RANK() OVER (ORDER BY revenue DESC)                       AS rnk,
       ROUND(100.0 * revenue / SUM(revenue) OVER (), 2)          AS pct,
       ROUND(100.0 * SUM(revenue) OVER (ORDER BY revenue DESC)
                   / SUM(revenue) OVER (), 2)                    AS cumulative_pct
FROM   rev
ORDER  BY revenue DESC;`,out:`name    revenue  rnk  pct    cumulative_pct
widget  5000     1    50.00  50.00
gadget  3000     2    30.00  80.00
doodad  2000     3    20.00  100.00`,why:"Three windows over the same data. `SUM(revenue) OVER ()` with an empty window gives the grand total on every row. `SUM(revenue) OVER (ORDER BY revenue DESC)` gets the implicit running frame, producing the cumulative total. Dividing one by the other gives the Pareto curve — the row where `cumulative_pct` first exceeds 80 marks the boundary of the vital few. Doing this with self-joins would need two extra passes."}],takeaway:"`SUM(x) OVER ()` = grand total on every row. `SUM(x) OVER (ORDER BY …)` = running total. Their ratio is a cumulative share."}]},{id:`adv-analytics`,title:`Cohorts, retention and sessions`,blocks:[{t:`q`,lvl:`hard`,title:`Month-over-month growth`,tag:`asked at Meta, Uber, Amazon`,stmt:`Report monthly revenue with the previous month's value, the absolute change, and the percentage change.`,approaches:[{name:`Solution`,idea:"Aggregate to months in a CTE, then `LAG` over the ordered series.",sql:`WITH monthly AS (
  SELECT DATE_FORMAT(order_date, '%Y-%m-01') AS month_start,
         SUM(amount)                         AS revenue
  FROM   orders
  WHERE  status <> 'cancelled'
  GROUP  BY DATE_FORMAT(order_date, '%Y-%m-01')
),
with_prev AS (
  SELECT month_start, revenue,
         LAG(revenue) OVER (ORDER BY month_start) AS prev_revenue
  FROM   monthly
)
SELECT month_start,
       revenue,
       prev_revenue,
       revenue - prev_revenue AS change,
       ROUND(100.0 * (revenue - prev_revenue)
             / NULLIF(prev_revenue, 0), 1) AS pct_change
FROM   with_prev
ORDER  BY month_start;`,why:"Two details make this production-ready. `NULLIF(prev_revenue, 0)` prevents a division-by-zero NULL or error when a month had no revenue. And computing `LAG` **once in its own CTE** rather than repeating it three times in the select list keeps it readable and lets the optimiser evaluate the window a single time. A subtle trap remains: a month with **no orders at all** is simply absent from `monthly`, so `LAG` would compare against two months ago without saying so — join against a generated month series if gaps are possible."}],takeaway:`Time-series windows silently skip missing periods. Generate a dense calendar first whenever gaps are possible.`},{t:`q`,lvl:`hard`,title:`Cohort retention`,tag:`hard · asked at Meta, Airbnb-style`,stmt:`Group users by signup month and show what fraction were still active 1, 2 and 3 months later.`,approaches:[{name:`Solution`,idea:`Assign each user a cohort, compute each activity's month offset, then pivot.`,sql:`WITH cohorts AS (
  SELECT user_id,
         DATE_FORMAT(MIN(created_at), '%Y-%m-01') AS cohort_month
  FROM   users
  GROUP  BY user_id
),
activity AS (
  SELECT c.cohort_month,
         a.user_id,
         TIMESTAMPDIFF(MONTH, c.cohort_month, a.active_date) AS month_offset
  FROM   cohorts c
  JOIN   user_activity a ON a.user_id = c.user_id
),
sized AS (
  SELECT cohort_month, COUNT(DISTINCT user_id) AS cohort_size
  FROM   cohorts GROUP BY cohort_month
)
SELECT s.cohort_month,
       s.cohort_size,
       ROUND(100.0 * COUNT(DISTINCT CASE WHEN a.month_offset = 1
                                         THEN a.user_id END) / s.cohort_size, 1) AS m1,
       ROUND(100.0 * COUNT(DISTINCT CASE WHEN a.month_offset = 2
                                         THEN a.user_id END) / s.cohort_size, 1) AS m2,
       ROUND(100.0 * COUNT(DISTINCT CASE WHEN a.month_offset = 3
                                         THEN a.user_id END) / s.cohort_size, 1) AS m3
FROM   sized s
LEFT   JOIN activity a ON a.cohort_month = s.cohort_month
GROUP  BY s.cohort_month, s.cohort_size
ORDER  BY s.cohort_month;`,out:`cohort_month  cohort_size  m1    m2    m3
2024-01       1200         42.5  31.0  24.8
2024-02       1450         45.1  33.7  NULL`,why:"Three ideas stacked. The **cohort** is the user's first-ever month, computed once so it never shifts. The **offset** converts an absolute date into a relative month, which is what makes different cohorts comparable. The **pivot** is conditional aggregation, with `COUNT(DISTINCT CASE …)` rather than `SUM` because a user active five times in month 1 must count once. Dividing by the pre-computed `cohort_size` rather than by a count from the joined data avoids the denominator being inflated by the join."}],takeaway:"Cohort analysis = first-event month + relative offset + conditional aggregation. Always `COUNT(DISTINCT user)`, never `COUNT(*)`."},{t:`q`,lvl:`hard`,title:`Sessionize an event stream`,tag:`hard · gaps and islands`,stmt:`Group events into sessions, where a gap of more than 30 minutes starts a new session. Report each session's start, end and event count.`,approaches:[{name:`Flag and cumulative sum`,idea:`Mark rows that begin a new session, then running-sum the flags to make a session id.`,sql:`WITH gaps AS (
  SELECT user_id, event_time,
         CASE WHEN TIMESTAMPDIFF(
                     MINUTE,
                     LAG(event_time) OVER (PARTITION BY user_id
                                           ORDER BY event_time),
                     event_time) > 30
                OR LAG(event_time) OVER (PARTITION BY user_id
                                         ORDER BY event_time) IS NULL
              THEN 1 ELSE 0 END AS is_new_session
  FROM   events
),
sessions AS (
  SELECT user_id, event_time,
         SUM(is_new_session) OVER (PARTITION BY user_id
                                   ORDER BY event_time) AS session_id
  FROM   gaps
)
SELECT user_id, session_id,
       MIN(event_time)  AS session_start,
       MAX(event_time)  AS session_end,
       COUNT(*)         AS events,
       TIMESTAMPDIFF(MINUTE, MIN(event_time), MAX(event_time)) AS duration_min
FROM   sessions
GROUP  BY user_id, session_id
ORDER  BY user_id, session_start;`,why:"The pattern is: **detect a boundary, then cumulatively sum the boundary flags to manufacture a group key**. Because the running sum only increases when a new session starts, every event in the same session shares an id — and then it is an ordinary `GROUP BY`. The `IS NULL` branch handles each user's very first event, which has no predecessor and must start session 1. This same three-step shape solves every gaps-and-islands problem; only the boundary rule changes."}],takeaway:`Boundary flag → running sum → group key. Change only the boundary condition and this template sessionises anything.`},{t:`q`,lvl:`hard`,title:`Users active N days in a row`,tag:`streaks · asked at Meta`,stmt:`Find users who logged in on at least 5 consecutive calendar days.`,approaches:[{name:`Row-number difference`,idea:"Within a run of consecutive dates, `date − row_number` is constant.",sql:`WITH distinct_days AS (
  SELECT DISTINCT user_id, DATE(login_at) AS d FROM logins
),
grouped AS (
  SELECT user_id, d,
         DATE_SUB(d, INTERVAL
                  ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY d) DAY) AS grp
  FROM   distinct_days
)
SELECT user_id,
       MIN(d)   AS streak_start,
       MAX(d)   AS streak_end,
       COUNT(*) AS streak_len
FROM   grouped
GROUP  BY user_id, grp
HAVING COUNT(*) >= 5;`,why:"Both the date and the row number advance by one within a streak, so subtracting one from the other yields a constant that changes only at a gap — a synthetic group key you can aggregate on. The `DISTINCT` is essential: two logins on the same day would advance the row number without advancing the date, splitting one genuine streak into two. The same technique finds consecutive seat numbers, contiguous id ranges and unbroken subscription periods."}]}]},{id:`adv-misc`,title:`Harder classics`,blocks:[{t:`q`,lvl:`medium`,title:`Exchange adjacent rows`,tag:`LeetCode 626`,stmt:`Swap every pair of adjacent student ids: 1↔2, 3↔4, and leave the last odd one alone.`,approaches:[{name:`CASE arithmetic`,idea:`Odd ids go up by one, even ids go down by one, unless the odd id is the last.`,sql:`SELECT CASE
         WHEN id % 2 = 1 AND id = (SELECT MAX(id) FROM seat) THEN id
         WHEN id % 2 = 1 THEN id + 1
         ELSE id - 1
       END AS id,
       student
FROM   seat
ORDER  BY id;`,why:"Branch order matters: the last-odd-id case must be tested first, or it would be caught by the generic odd rule and swapped into a nonexistent seat. The `ORDER BY id` refers to the **computed** alias, which is legal because `ORDER BY` runs after `SELECT`. A window alternative uses `LEAD`/`LAG` to fetch the neighbour's student directly, which reads better when the swap involves more columns."}]},{t:`q`,lvl:`hard`,title:`Find the median without PERCENTILE_CONT`,tag:`MySQL · asked at Meta`,stmt:`Compute the median of a numeric column in MySQL.`,approaches:[{name:`Double ranking`,idea:`Number rows ascending and descending; the middle rows agree within one.`,sql:`WITH r AS (
  SELECT salary,
         ROW_NUMBER() OVER (ORDER BY salary)      AS a,
         ROW_NUMBER() OVER (ORDER BY salary DESC) AS d,
         COUNT(*)     OVER ()                     AS n
  FROM   employees
)
SELECT AVG(salary) AS median
FROM   r
WHERE  a IN (FLOOR((n + 1) / 2), CEIL((n + 1) / 2));`,why:"For an odd count, `FLOOR` and `CEIL` of `(n+1)/2` are the same index, so one row is selected and `AVG` returns it unchanged. For an even count they differ by one, both middle rows are selected, and `AVG` averages them — the standard definition. `COUNT(*) OVER ()` supplies `n` on every row without a second pass. The `a`/`d` symmetry check (`a BETWEEN d-1 AND d+1`) is an equivalent formulation you will see in solutions."}]},{t:`q`,lvl:`hard`,title:`Second-highest per group with ties and no window functions`,tag:`MySQL 5.7 · tricky`,stmt:`Without window functions, find each department's second-highest distinct salary.`,approaches:[{name:`Correlated count`,idea:`Exactly one distinct salary in the department is higher.`,sql:`SELECT DISTINCT e.dept_id, e.salary
FROM   employees e
WHERE  1 = (SELECT COUNT(DISTINCT e2.salary)
            FROM   employees e2
            WHERE  e2.dept_id = e.dept_id
              AND  e2.salary  > e.salary);`,why:"Reframing 'Nth highest' as 'exactly N−1 distinct values above me' removes the need for any ranking construct, which is why this works on every engine ever shipped. `COUNT(DISTINCT)` is what makes ties collapse correctly — two people tied for first still leave the runner-up as the second distinct salary. The cost is a correlated subquery per row; an index on `(dept_id, salary)` makes it tolerable, but a window function is an order of magnitude better where available."}],takeaway:`'Nth highest' ⇔ 'exactly N−1 distinct values are greater'. This reframing solves the whole family without window functions.`},{t:`q`,lvl:`hard`,title:`Detect overlapping bookings`,tag:`intervals · asked at Uber, Booking-style`,stmt:`Find pairs of bookings for the same room whose time ranges overlap.`,approaches:[{name:`Interval overlap test`,idea:`Two half-open ranges overlap when each starts before the other ends.`,sql:`SELECT a.booking_id AS b1, b.booking_id AS b2,
       a.room_id,
       GREATEST(a.starts_at, b.starts_at) AS overlap_start,
       LEAST(a.ends_at,   b.ends_at)      AS overlap_end
FROM   bookings a
JOIN   bookings b
  ON   b.room_id    = a.room_id
 AND   b.booking_id > a.booking_id        -- each pair once, no self-pairs
 AND   a.starts_at  < b.ends_at           -- the overlap condition
 AND   b.starts_at  < a.ends_at;`,why:"The overlap test `a.start < b.end AND b.start < a.end` is worth memorising — it is correct for half-open intervals and far less error-prone than enumerating the four positional cases people usually try. Strict `<` means ranges that merely touch (one ends exactly when the other starts) do not count as overlapping, which is normally the desired booking semantics. `b.booking_id > a.booking_id` returns each pair once. An index on `(room_id, starts_at)` is essential, since this is otherwise O(n²) within each room."}],takeaway:"Intervals overlap iff `a.start < b.end AND b.start < a.end`. Learn it once; it covers scheduling, availability and conflict detection."},{t:`q`,lvl:`hard`,title:`Pivot an unknown number of columns`,tag:`dynamic SQL`,stmt:`Pivot sales by category when the categories are not known in advance.`,approaches:[{name:`Build the SQL then execute it`,idea:"Generate the `CASE` list with `GROUP_CONCAT`, then run it as a prepared statement.",sql:`SET SESSION group_concat_max_len = 100000;

SELECT GROUP_CONCAT(DISTINCT
         CONCAT('SUM(CASE WHEN category = ''', category,
                ''' THEN amount ELSE 0 END) AS \`', category, '\`')
       ) INTO @cols
FROM   sales;

SET @sql = CONCAT('SELECT region, ', @cols,
                  ' FROM sales GROUP BY region');

PREPARE stmt FROM @sql;
EXECUTE stmt;
DEALLOCATE PREPARE stmt;`,why:"SQL's result shape must be fixed at parse time, so a genuinely dynamic column list requires generating the statement text. Two cautions. `group_concat_max_len` defaults to 1024 bytes and **truncates silently**, producing malformed SQL — raise it first. And any value interpolated into the text is an injection vector, so this is only safe when the values come from a trusted column, never from user input. In practice, pivoting in the application or BI layer is usually the better answer."}]}]}]},ne={id:`companies`,num:`14`,title:`Company-Wise Questions`,kicker:`What each round actually tests, from service companies to FAANG data roles`,sections:[{id:`co-format`,title:`How SQL rounds differ`,blocks:[{t:`table`,head:[`Company tier`,`Round format`,`What they weight`],rows:[[`**TCS, Infosys, Wipro, Cognizant, Capgemini, Accenture**`,`MCQ + 2–3 short queries`,"Joins, `GROUP BY`, `DELETE` vs `TRUNCATE`, normal forms, key definitions"],[`**Amazon (SDE / BIE)**`,`OA + 2 SQL rounds`,`Window functions, self-joins, top-N per group, and *why* your query is correct`],[`**Meta (Data Engineer / Analyst)**`,`45 min, 2–3 problems`,"Speed. Cohorts, retention, funnels, `LAG`/`LEAD` — expected in minutes, not tens of minutes"],[`**Google**`,`Query + design + follow-up`,`Optimality and scale: 'now the table has a billion rows', 'now it is sharded'`],[`**Microsoft**`,`Query + schema design`,`Indexing, execution plans, normalization trade-offs`],[`**Goldman Sachs, Morgan Stanley, JPMC**`,`HackerRank + technical`,"Correctness on edge cases, `DECIMAL` vs `FLOAT`, transactions and isolation"],[`**Uber, Swiggy, Zomato, Flipkart**`,`SQL + case study`,`Business metrics: DAU/MAU, funnels, cohorts, sessionisation`],[`**Oracle, SAP, IBM**`,`Deep engine questions`,`Optimizer internals, PL/SQL, partitioning, locking`]]},{t:`note`,k:`ask`,x:`The habit that scores in every round: **state your assumptions before writing** — can this column be NULL, is the join key unique, do ties matter, what does 'active' mean. Interviewers deliberately leave those ambiguous, and asking is the signal they are grading.`}]},{id:`co-service`,title:`TCS · Infosys · Wipro · Cognizant · Capgemini`,blurb:`Freshers rounds: definitions and short queries.`,blocks:[{t:`qa`,q:`TCS — What is the difference between DELETE, TRUNCATE and DROP?`,a:"`DELETE` is DML: removes rows, accepts `WHERE`, fires triggers, is logged row by row, can be rolled back, and does **not** reset `AUTO_INCREMENT`. `TRUNCATE` is DDL: internally drops and recreates the table, so it is far faster, resets `AUTO_INCREMENT`, fires no triggers, takes no `WHERE`, and causes an implicit commit — meaning it cannot be rolled back in MySQL. `DROP` removes the table, its data, indexes and definition entirely."},{t:`qa`,q:`Infosys — What is the difference between a primary key and a unique key?`,a:"A table has exactly one primary key and it is implicitly `NOT NULL`; you may have many unique keys and they **permit NULLs** — including multiple NULLs, since two NULLs are not considered equal. In InnoDB the primary key is also the clustered index, meaning the rows are physically stored in its order and every secondary index carries it as the row pointer, which is why a narrow primary key matters for performance."},{t:`qa`,q:`Wipro — What are the different types of JOIN?`,a:"`INNER` returns only matching pairs. `LEFT` keeps all left rows, padding unmatched ones with NULLs; `RIGHT` is the mirror. `FULL OUTER` keeps both sides — not supported in MySQL, so you emulate it with a `UNION`. `CROSS` returns the cartesian product. `SELF` is any of these applied to one table with two aliases, used for hierarchies and pairs. A `NATURAL JOIN` joins on all same-named columns automatically and is best avoided, because adding a column to both tables silently changes the join."},{t:`qa`,q:`Cognizant — What is normalization? Explain 1NF, 2NF and 3NF.`,a:`Organising a schema to eliminate redundancy and the anomalies it causes. **1NF**: every column holds a single atomic value — no lists, no repeating groups. **2NF**: 1NF plus every non-key column depends on the *whole* composite key, not part of it. **3NF**: 2NF plus no non-key column depends on another non-key column. Each form removes a specific anomaly: update (changing one fact in many places), insert (unable to record one fact without another) and delete (losing a fact as a side effect).`},{t:`qa`,q:`Capgemini — What is the difference between WHERE and HAVING?`,a:"`WHERE` filters individual rows **before** grouping and can use indexes. `HAVING` filters groups **after** aggregation and can reference aggregate functions. Any condition not involving an aggregate belongs in `WHERE`, because filtering earlier means fewer rows reach the expensive grouping step."},{t:`qa`,q:`Accenture — What is a foreign key and what does ON DELETE CASCADE do?`,a:"A foreign key constrains a column to contain only values present in another table's primary or unique key, enforcing referential integrity. `ON DELETE CASCADE` means deleting the parent automatically deletes the children — appropriate for genuinely owned data like `order_items` under `orders`, dangerous in deep hierarchies where one delete can cascade across millions of rows inside a single transaction. `RESTRICT` (refuse the delete) is the safer default for anything financial or audited."},{t:`q`,lvl:`beginner`,title:`Second highest salary`,tag:`TCS · Infosys · asked in almost every fresher round`,stmt:"Return the second highest salary from `employees`, or NULL if there is no such value.",approaches:[{name:`Portable subquery`,idea:`The maximum among values below the overall maximum.`,sql:`SELECT MAX(salary) AS second_highest
FROM   employees
WHERE  salary < (SELECT MAX(salary) FROM employees);`,why:"The most commonly expected answer in a fresher round. It handles ties naturally — several people on the top salary still leave the same runner-up — and returns NULL when everyone earns the same, because `MAX` over an empty set is NULL. Works on every engine."},{name:`LIMIT / OFFSET`,idea:`Sort distinct salaries and skip one.`,sql:`SELECT DISTINCT salary FROM employees
ORDER BY salary DESC LIMIT 1 OFFSET 1;`,why:`Shorter but MySQL-specific, and it returns **zero rows** rather than NULL when there is no second salary — mention that difference, because some graders test exactly that case.`}]},{t:`q`,lvl:`beginner`,title:`Employees earning more than their manager`,tag:`LeetCode 181 · TCS, Infosys, Amazon`,stmt:`List employees whose salary exceeds their manager's.`,approaches:[{name:`Self join`,idea:`Join the table to itself on the manager relationship.`,sql:`SELECT e.name AS employee, e.salary, m.name AS manager, m.salary AS mgr_salary
FROM   employees e
JOIN   employees m ON m.emp_id = e.manager_id
WHERE  e.salary > m.salary;`,why:"An `INNER` join is correct here — employees with no manager cannot satisfy the condition anyway, so excluding them is intentional rather than a bug. The two aliases are what make one physical table act as two logical ones. Add an index on `manager_id` if this runs often."}]},{t:`q`,lvl:`easy`,title:`Duplicate emails`,tag:`LeetCode 182 · asked everywhere`,stmt:`Find all email addresses that appear more than once.`,approaches:[{name:`GROUP BY … HAVING`,idea:`Group by the value and keep groups larger than one.`,sql:`SELECT email, COUNT(*) AS occurrences
FROM   person
GROUP  BY email
HAVING COUNT(*) > 1;`,why:"The canonical answer. The follow-up is always 'now delete the duplicates, keeping the lowest id', which is `DELETE p1 FROM person p1 JOIN person p2 ON p2.email = p1.email AND p2.id < p1.id` — and then adding a `UNIQUE` constraint so it cannot happen again. The real answer to 'how do we prevent this' is the constraint, not the query."}]}]},{id:`co-faang`,title:`Amazon · Meta · Google · Microsoft`,blurb:`Window functions, analytics and scale follow-ups.`,blocks:[{t:`q`,lvl:`medium`,title:`Customers who ordered every product`,tag:`relational division · Amazon, Google`,stmt:`Find customers who have ordered **every** product in the catalogue.`,hint:`'For all' has no direct SQL operator. Count matches, or use double negation.`,approaches:[{name:`Count comparison`,idea:`A customer qualifies when their distinct product count equals the catalogue size.`,sql:`SELECT o.cust_id
FROM   orders o
JOIN   order_items oi ON oi.order_id = o.order_id
GROUP  BY o.cust_id
HAVING COUNT(DISTINCT oi.product_id) = (SELECT COUNT(*) FROM products);`,why:"The clearest formulation and usually the fastest. `DISTINCT` is essential — ordering the same product twice must not count twice. This is **relational division**, the SQL expression of 'for all'."},{name:`Double negation`,idea:`No product exists that this customer has not ordered.`,sql:`SELECT c.cust_id
FROM   customers c
WHERE  NOT EXISTS (
  SELECT 1 FROM products p
  WHERE  NOT EXISTS (
    SELECT 1 FROM orders o
    JOIN   order_items oi ON oi.order_id = o.order_id
    WHERE  o.cust_id = c.cust_id AND oi.product_id = p.product_id
  )
);`,why:`The textbook relational-division form: 'for all x, P(x)' becomes 'there is no x where not P(x)'. It handles edge cases the counting version can miss — for instance if the catalogue is empty, this correctly returns every customer. Harder to read, and interviewers who ask this question are usually checking whether you recognise the pattern by name.`}],takeaway:"'For all' ⇒ relational division. Count-equals-total is the practical form; nested `NOT EXISTS` is the formal one."},{t:`q`,lvl:`medium`,title:`Daily active users and rolling DAU/MAU`,tag:`Meta, Uber · product analytics`,stmt:`Report daily active users and the 30-day rolling monthly actives, plus the stickiness ratio.`,approaches:[{name:`Solution`,idea:`DAU is a simple group-by; MAU needs a rolling distinct count, which windows cannot do directly.`,sql:`WITH daily AS (
  SELECT DATE(event_time) AS d,
         COUNT(DISTINCT user_id) AS dau
  FROM   events
  GROUP  BY DATE(event_time)
),
mau AS (
  SELECT d.d,
         (SELECT COUNT(DISTINCT e.user_id)
          FROM   events e
          WHERE  e.event_time >= d.d - INTERVAL 29 DAY
            AND  e.event_time <  d.d + INTERVAL 1 DAY) AS mau
  FROM   daily d
)
SELECT daily.d, daily.dau, mau.mau,
       ROUND(100.0 * daily.dau / NULLIF(mau.mau, 0), 1) AS stickiness_pct
FROM   daily JOIN mau ON mau.d = daily.d
ORDER  BY daily.d;`,why:"The key insight is that **`COUNT(DISTINCT …)` is not supported as a window function** in MySQL, and even where it is, a rolling distinct count is not decomposable — you cannot add and subtract users the way you can with a rolling sum, because a user leaving the window might still be present via another event. Hence the correlated subquery. At scale this is expensive, and the production answer is a pre-aggregated daily `user_id` table or an approximate structure like HyperLogLog. Saying that out loud is what distinguishes a strong answer."}]},{t:`q`,lvl:`hard`,title:`Funnel conversion`,tag:`Meta, Google · product analytics`,stmt:`For a signup funnel (view → signup → activate → purchase), report how many users reached each step and the step-over-step conversion rate.`,approaches:[{name:`Conditional aggregation`,idea:`Count distinct users who ever hit each step, then compare adjacent counts.`,sql:`WITH per_user AS (
  SELECT user_id,
         MAX(step = 'view')     AS did_view,
         MAX(step = 'signup')   AS did_signup,
         MAX(step = 'activate') AS did_activate,
         MAX(step = 'purchase') AS did_purchase
  FROM   funnel_events
  GROUP  BY user_id
),
totals AS (
  SELECT SUM(did_view)     AS s1,
         SUM(did_signup)   AS s2,
         SUM(did_activate) AS s3,
         SUM(did_purchase) AS s4
  FROM   per_user
)
SELECT s1, s2, s3, s4,
       ROUND(100.0 * s2 / NULLIF(s1,0), 1) AS view_to_signup,
       ROUND(100.0 * s3 / NULLIF(s2,0), 1) AS signup_to_activate,
       ROUND(100.0 * s4 / NULLIF(s3,0), 1) AS activate_to_purchase,
       ROUND(100.0 * s4 / NULLIF(s1,0), 1) AS overall
FROM   totals;`,why:"Collapsing to one row per user first is what makes the counts correct — counting events directly would let a user who viewed the page five times inflate step 1. `MAX(step = 'view')` exploits MySQL's boolean-as-integer to produce a 0/1 flag per user; the portable form is `MAX(CASE WHEN step = 'view' THEN 1 ELSE 0 END)`. The important follow-up is **ordering**: this counts users who did each step *at all*, not those who did them in sequence. A strict funnel needs each step's timestamp to exceed the previous one, which requires `MIN(CASE WHEN step = 'x' THEN ts END)` per step and comparisons between them."}],takeaway:`Funnels: collapse to one row per user first, then aggregate. Ask whether the steps must be ordered — the answer changes the query.`},{t:`q`,lvl:`medium`,title:`Products never ordered — and the scale follow-up`,tag:`Google · anti-join at scale`,stmt:`Find products with no orders. Then: the tables have 10 million and 2 billion rows. What changes?`,approaches:[{name:`The query`,idea:`An anti-join, expressed three ways.`,sql:`SELECT p.product_id, p.name
FROM   products p
WHERE  NOT EXISTS (SELECT 1 FROM order_items oi
                   WHERE oi.product_id = p.product_id);`,why:"`NOT EXISTS` short-circuits at the first matching row, which matters enormously when the child table is huge — `LEFT JOIN … IS NULL` would materialise every match before discarding it. `NOT IN` is disqualified outright by the NULL hazard."},{name:`The scale answer`,idea:`What the interviewer is actually asking about.`,sql:`-- 1. index: order_items(product_id) must exist, ideally covering
CREATE INDEX ix_oi_product ON order_items (product_id);

-- 2. if 'never ordered' is queried constantly, maintain it:
--    a last_ordered_at column on products, updated by trigger or job
SELECT product_id FROM products WHERE last_ordered_at IS NULL;

-- 3. if the fact table is partitioned by date, the anti-join must still
--    scan every partition -- an aggregate summary table is the answer:
CREATE TABLE product_order_counts (product_id INT PRIMARY KEY, n BIGINT);`,why:`At two billion rows the query is not the problem — the access pattern is. With the index, each probe is a single index seek and the whole thing is 10 million seeks, which is minutes not hours. Better, recognise that 'never ordered' is a **slowly changing fact** and precompute it. The general principle is that analytical questions over huge fact tables should be answered from a maintained aggregate, not recomputed each time. Google-style follow-ups are testing whether you reach for that instinctively.`}]},{t:`qa`,q:`Amazon — How would you find the top 5 products by revenue in each category, and what index would you add?`,a:"`DENSE_RANK() OVER (PARTITION BY category ORDER BY revenue DESC)` in a subquery, filtered to `<= 5`, with revenue pre-aggregated in a CTE. For the index, the aggregation is the expensive part, so the useful index is on the fact table's join and grouping columns — `order_items(product_id, qty, unit_price)` as a covering index means the aggregate never touches the base rows. Ranking itself needs a sort per partition; no index removes that once you are aggregating, but keeping the input narrow makes it cheap."},{t:`qa`,q:`Meta — A query that ran in 200ms yesterday takes 30 seconds today. Walk me through your diagnosis.`,a:"In order: check whether the **data volume** changed — a table that crossed a threshold may have flipped the plan. Run `EXPLAIN` and compare against the expected plan; a `type = ALL` where there used to be a `range` means an index is unused or missing. Check whether **statistics are stale** after a bulk load, and run `ANALYZE TABLE`. Check for **lock waits** in `performance_schema.data_locks` or `SHOW ENGINE INNODB STATUS` — a long-running transaction elsewhere can block. Check whether someone dropped an index or changed the schema. Finally check the parameters: a query fast for a selective value can be slow for a common one, which is parameter-sensitive plan behaviour."},{t:`qa`,q:`Google — How do you paginate 50 million rows efficiently?`,a:"Not with `OFFSET`. `LIMIT 20 OFFSET 1000000` makes the server produce and discard a million rows, so latency grows linearly with page depth, and concurrent inserts make pages overlap or skip. Use **keyset pagination**: remember the last row's sort key and ask for rows after it, `WHERE (created_at, id) < (?, ?) ORDER BY created_at DESC, id DESC LIMIT 20`. With an index on those columns the engine seeks directly to the position — constant time at any depth. The trade-off is that you cannot jump to an arbitrary page number, which is why infinite scroll uses it and numbered pagination does not."},{t:`qa`,q:`Microsoft — When would you choose a NoSQL store over a relational database?`,a:`When the access pattern is a single key lookup at very high volume and the data has no meaningful relationships to join — session stores, caches, event logs. When the schema is genuinely heterogeneous per record. When you need horizontal write scaling beyond what a single primary can absorb, and you can accept eventual consistency for it. What you give up is real: joins, multi-row transactions, declarative constraints, and ad-hoc querying. Most systems that 'need NoSQL' actually need an index, a cache, or a read replica — and modern MySQL and PostgreSQL both have JSON columns with indexing, which covers the schema-flexibility case without leaving the relational model.`},{t:`qa`,q:`Uber / Flipkart — How would you design the schema for a ride-hailing trip history?`,a:"Core entities: `users`, `drivers`, `vehicles`, `trips`, `trip_events`, `payments`. `trips` holds the immutable facts — rider, driver, start and end timestamps, fare, status — with foreign keys and a composite index on `(rider_id, started_at DESC)` for the 'my trips' screen and `(driver_id, started_at DESC)` for the driver side. `trip_events` is an append-only log for state transitions, partitioned by month so old partitions can be dropp
