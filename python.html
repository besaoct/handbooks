    return "" if best[0] == float("inf") else s[best[1]:best[2] + 1]`,time:`O(n + m)`,space:`O(m)`,why:"`right` advances n times and `left` advances at most n times over the entire run, so the combined pointer movement is at most 2n — linear despite the nested `while`. Every operation inside is an O(1) dict update. Building `need` is O(m). Space is the size of the requirement map, O(m), or O(1) for a fixed alphabet. The elegance is `missing`: it collapses 'is this window valid?' from an O(alphabet) check into a single integer comparison, which is what keeps the inner loop O(1)."}],takeaway:`The hardest window problems all reduce to: find an O(1) summary of 'is the window valid'. Here it is one integer. Recomputing validity from scratch is what makes the naive version quadratic.`},{t:`drill`,lvl:`medium`,title:`3Sum — all unique triplets summing to zero`,tag:`sort + two pointers · LeetCode 15 · asked at Amazon, Meta`,stmt:"Return every unique triplet `[a,b,c]` with `a + b + c == 0`. No duplicate triplets in the output.",ex:`[-1,0,1,2,-1,-4]  ->  [[-1,-1,2],[-1,0,1]]`,hint:`Fix the first element, then it becomes Two Sum on the rest — and the rest is sorted.`,approaches:[{name:`Brute force O(n³)`,idea:`Every triple, deduplicated with a set.`,code:`def three_sum(a):
    out = set()
    n = len(a)
    for i in range(n):
        for j in range(i+1, n):
            for k in range(j+1, n):
                if a[i] + a[j] + a[k] == 0:
                    out.add(tuple(sorted((a[i], a[j], a[k]))))
    return [list(t) for t in out]`,time:`O(n³)`,space:`O(n) for the output set`,why:`All C(n,3) ≈ n³/6 triples. Sorting each found triple to canonicalise it is O(1) since it is always three elements.`},{name:`Optimal — sort + two pointers`,idea:"Sort once. Fix index `i`, then sweep two pointers inward over the remaining suffix looking for the complement of `a[i]`. Sortedness gives both the pointer logic and easy duplicate skipping.",code:`def three_sum(a):
    a.sort()
    n, out = len(a), []
    for i in range(n - 2):
        if a[i] > 0:
            break                          # sorted: no way to reach 0 with positives
        if i > 0 and a[i] == a[i-1]:
            continue                       # skip duplicate first elements
        lo, hi = i + 1, n - 1
        while lo < hi:
            total = a[i] + a[lo] + a[hi]
            if total < 0:
                lo += 1                    # too small -> raise the floor
            elif total > 0:
                hi -= 1                    # too big -> lower the ceiling
            else:
                out.append([a[i], a[lo], a[hi]])
                lo += 1
                hi -= 1
                while lo < hi and a[lo] == a[lo-1]:
                    lo += 1                # skip duplicate seconds
    return out`,time:`O(n²)`,space:`O(1) extra (O(n) if the sort copies)`,why:"The sort is O(n log n). The outer loop runs n times, and for each `i` the two pointers together traverse the suffix once — O(n). So n × n = O(n²), which dominates the sort. We removed one full factor of n compared to brute force because sortedness lets us decide *which pointer to move* from the sign of the sum, instead of testing every pair. Deduplication is O(1) per skip and relies entirely on equal values being adjacent after sorting."}],takeaway:`k-Sum reduces to (k−1)-Sum by fixing one element. Sorting is what turns the innermost search into a two-pointer sweep — the same idea scales to 4Sum at O(n³).`}]}]},{id:`practice-search`,num:`17`,title:`Practice · Searching, Sorting, Greedy`,kicker:`Binary search templates, heaps, and when greedy is provably right`,sections:[{id:`ps-binary`,title:`Binary search, properly`,blurb:`Most people can describe it and still write it wrong. Learn one template.`,blocks:[{t:`p`,x:"Binary search is not about finding a value in a sorted array. It is about **any monotone predicate**: a boolean function that is `False, False, …, False, True, True, …, True` over the search space. Once you can phrase your problem that way, the template never changes."},{t:`code`,x:`# THE template: find the first index where predicate(i) is True
lo, hi = 0, n                 # hi is EXCLUSIVE -> the answer lives in [lo, hi]
while lo < hi:
    mid = (lo + hi) // 2
    if predicate(mid):
        hi = mid              # mid might be the answer, so keep it
    else:
        lo = mid + 1          # mid is definitely not, discard it
return lo                     # lo == hi == first True (or n if none)`,cap:`Loop invariant: everything below lo is False, everything at or above hi is True. It terminates because hi - lo strictly shrinks every iteration.`},{t:`note`,k:`gotcha`,x:"The three bugs, in order of frequency: using `lo <= hi` with an exclusive `hi` (infinite loop), writing `hi = mid - 1` when `mid` could be the answer (skips it), and computing `mid = lo + (hi - lo) // 2` out of overflow habit — harmless but unnecessary in Python, where ints never overflow."},{t:`drill`,lvl:`beginner`,title:`Classic binary search`,tag:`LeetCode 704`,stmt:"Return the index of `target` in a sorted array, or −1.",ex:`[-1,0,3,5,9,12], target = 9  ->  4`,approaches:[{name:`Linear scan`,idea:`The baseline that sortedness lets you beat.`,code:`def search(a, target):
    for i, x in enumerate(a):
        if x == target:
            return i
    return -1`,time:`O(n)`,space:`O(1)`,why:`Every element in the worst case. This is the correct answer for *unsorted* data — no comparison-based method beats O(n) there, because you cannot rule out any unexamined element.`},{name:`Binary search`,idea:`Halve the search range each step by comparing against the middle.`,code:`def search(a, target):
    lo, hi = 0, len(a) - 1
    while lo <= hi:                # INCLUSIVE hi -> use <=
        mid = (lo + hi) // 2
        if a[mid] == target:
            return mid
        if a[mid] < target:
            lo = mid + 1
        else:
            hi = mid - 1
    return -1

import bisect
def search(a, target):             # stdlib version
    i = bisect.bisect_left(a, target)
    return i if i < len(a) and a[i] == target else -1`,time:`O(log n)`,space:`O(1)`,why:`The range starts at size n and halves every iteration: n → n/2 → n/4 → … → 1. The number of halvings until the range is empty is the k satisfying n/2ᵏ = 1, so k = log₂ n. For n = 10⁶ that is 20 comparisons instead of a million. Space is O(1) because the loop is iterative — a recursive version would be O(log n) for the call stack.`}],takeaway:`Sortedness is information. Binary search converts it into a log factor. Match your loop condition to your bound convention and stick to one.`},{t:`drill`,lvl:`easy`,title:`First and last occurrence of a target`,tag:`LeetCode 34 · asked at Amazon, Microsoft`,stmt:"In a sorted array with duplicates, return the first and last index of `target`, or `[-1,-1]`.",ex:`[5,7,7,8,8,10], target = 8  ->  [3,4]`,hint:`Two separate binary searches: one biased left, one biased right.`,approaches:[{name:`Find then expand`,idea:`Binary search once, then walk outward. Tempting and wrong on complexity.`,code:`def search_range(a, target):
    i = bisect.bisect_left(a, target)
    if i == len(a) or a[i] != target:
        return [-1, -1]
    j = i
    while j + 1 < len(a) and a[j+1] == target:    # linear walk!
        j += 1
    return [i, j]`,time:`O(log n + k) → O(n) worst case`,space:`O(1)`,why:"The expansion walks over every duplicate, so if the array is all one value it degrades to O(n). Interviewers ask this exact follow-up: 'what if the array is `[8]*10**6`?'"},{name:`Optimal — two biased searches`,idea:"`bisect_left` gives the first position where target could go; `bisect_right` gives the position after the last one.",code:`import bisect

def search_range(a, target):
    lo = bisect.bisect_left(a, target)    # first index >= target
    if lo == len(a) or a[lo] != target:
        return [-1, -1]
    hi = bisect.bisect_right(a, target)   # first index > target
    return [lo, hi - 1]

# by hand, using the one template twice
def first_true(n, pred):
    lo, hi = 0, n
    while lo < hi:
        mid = (lo + hi) // 2
        if pred(mid): hi = mid
        else:         lo = mid + 1
    return lo

def search_range_manual(a, t):
    lo = first_true(len(a), lambda i: a[i] >= t)
    hi = first_true(len(a), lambda i: a[i] > t)
    return [lo, hi - 1] if lo < len(a) and a[lo] == t else [-1, -1]`,time:`O(log n)`,space:`O(1)`,why:"Two independent binary searches, each O(log n), so 2 log n = O(log n) regardless of how many duplicates exist. The count of occurrences comes free as `hi - lo`. This is why the 'first index satisfying a monotone predicate' framing is worth internalising — both bounds are the same template with a different predicate."}],takeaway:"`a[i] >= t` and `a[i] > t` are both monotone predicates. One template, two predicates, both boundaries."},{t:`drill`,lvl:`medium`,title:`Search in a rotated sorted array`,tag:`LeetCode 33 · asked at Amazon, Meta, Microsoft`,stmt:"A sorted array was rotated at an unknown pivot. Find `target` in O(log n). No duplicates.",ex:`[4,5,6,7,0,1,2], target = 0  ->  4`,hint:`At any midpoint, at least one half is still perfectly sorted. Determine which, then check whether the target lies inside it.`,approaches:[{name:`Linear scan`,idea:`Ignore the structure entirely.`,code:`def search(a, target):
    return a.index(target) if target in a else -1`,time:`O(n)`,space:`O(1)`,why:`Correct but discards the sortedness the problem deliberately preserved. The rotation only breaks the order at one point — the rest of the structure is still exploitable.`},{name:`Optimal — modified binary search`,idea:"Compare `a[mid]` with `a[lo]` to identify which half is sorted, then use the ordinary range test to decide where the target must be.",code:`def search(a, target):
    lo, hi = 0, len(a) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if a[mid] == target:
            return mid

        if a[lo] <= a[mid]:                     # LEFT half is sorted
            if a[lo] <= target < a[mid]:
                hi = mid - 1                    # target is inside the sorted left
            else:
                lo = mid + 1
        else:                                   # RIGHT half is sorted
            if a[mid] < target <= a[hi]:
                lo = mid + 1
            else:
                hi = mid - 1
    return -1`,time:`O(log n)`,space:`O(1)`,why:"Every iteration still discards half the range, so the halving argument is unchanged: log₂ n iterations. The extra work per iteration is a constant number of comparisons, which does not affect the class. The correctness argument is the interesting part: a rotated sorted array cut at any midpoint always leaves at least one contiguous sorted half, and inside a sorted half you can decide membership with a single range check. With duplicates allowed the `a[lo] <= a[mid]` test becomes ambiguous and the worst case degrades to O(n) — mention that if asked."}],takeaway:`Binary search works whenever you can eliminate half the space with O(1) reasoning. It does not require a fully sorted array — only a decidable half.`},{t:`drill`,lvl:`medium`,title:`Koko eating bananas — binary search on the answer`,tag:`LeetCode 875 · asked at Google, Amazon`,stmt:"Piles of bananas and `h` hours. At speed `k` per hour, a pile of size `p` takes `ceil(p/k)` hours. Find the minimum integer `k` that finishes all piles within `h` hours.",ex:`piles = [3,6,7,11], h = 8  ->  4`,hint:`You are not searching the array — you are searching the *answer space* 1..max(piles). Is 'can finish at speed k' monotone in k?`,approaches:[{name:`Brute force`,idea:`Try every speed from 1 upward until one works.`,code:`import math

def min_speed(piles, h):
    for k in range(1, max(piles) + 1):
        if sum(math.ceil(p / k) for p in piles) <= h:
            return k`,time:`O(n · max(piles))`,space:`O(1)`,why:`Up to max(piles) candidate speeds, each costing an O(n) feasibility check. With piles up to 10⁹ this is hopeless — and that constraint is precisely the hint that the answer space must be searched logarithmically.`},{name:`Optimal — binary search on k`,idea:"`feasible(k)` is monotone: if speed `k` works then every speed above it works too. That is a `False…False True…True` predicate, so the template applies directly to the answer range.",code:`def min_speed(piles, h):
    def feasible(k):
        hours = 0
        for p in piles:
            hours += (p + k - 1) // k       # integer ceiling division
            if hours > h:
                return False               # early exit
        return hours <= h

    lo, hi = 1, max(piles)                 # speed 1 is slowest, max(piles) always works
    while lo < hi:
        mid = (lo + hi) // 2
        if feasible(mid):
            hi = mid                       # mid works, maybe something smaller does too
        else:
            lo = mid + 1
    return lo`,time:`O(n log(max piles))`,space:`O(1)`,why:`The search range is the value range 1..max(piles), so there are log₂(max) iterations — about 30 for 10⁹. Each iteration runs an O(n) feasibility check, giving n log(max). Note the log is over the **magnitude of the answer**, not the array length: this is why the technique scales to enormous value ranges where the array itself is small. The whole method rests on monotonicity — always state why the predicate is monotone, because if it is not, binary search is simply invalid.`}],takeaway:"'Minimise the maximum' / 'maximum the minimum' / 'find the smallest capacity that works' ⇒ binary search on the answer. Write `feasible(x)`, prove it is monotone, apply the template."}]},{id:`ps-sort-heap`,title:`Sorting, selection and heaps`,blocks:[{t:`drill`,lvl:`medium`,title:`Kth largest element`,tag:`LeetCode 215 · asked at Meta, Amazon, Microsoft`,stmt:`Return the kth largest element in an unsorted array (kth in sorted order, not kth distinct).`,ex:`[3,2,1,5,6,4], k = 2  ->  5`,hint:`You do not need the whole array sorted — only the boundary between the top k and the rest.`,approaches:[{name:`Sort`,idea:`Sort descending and index.`,code:`def kth_largest(a, k):
    return sorted(a, reverse=True)[k - 1]`,time:`O(n log n)`,space:`O(n)`,why:`Correct in one line, and often the right production answer. But it computes a total order over all n elements when the question only asks about one position — that surplus work is what the follow-up targets.`},{name:`Min-heap of size k`,idea:`Keep the k largest seen so far in a min-heap. The smallest of those sits at the root, and that is the answer once everything is processed.`,code:`import heapq

def kth_largest(a, k):
    h = a[:k]
    heapq.heapify(h)                   # O(k)
    for x in a[k:]:
        if x > h[0]:                   # bigger than our current kth largest
            heapq.heapreplace(h, x)    # pop-then-push in one sift
    return h[0]

def kth_largest_short(a, k):
    return heapq.nlargest(k, a)[-1]    # same idea, stdlib`,time:`O(n log k)`,space:`O(k)`,why:`Heapify is O(k), then each of the remaining n−k elements does at most one O(log k) sift. When k is small — 'top 10 of a billion' — log k is tiny and this crushes the sort. It is also the **streaming** answer: it never needs all n elements in memory at once, which is why it is the standard reply when the interviewer says 'now the data doesn't fit in RAM'.`},{name:`Quickselect — O(n) average`,idea:`Partition like quicksort, but only recurse into the side containing the target position.`,code:`import random

def kth_largest(a, k):
    target = len(a) - k                 # kth largest == index (n-k) when ascending

    def select(lo, hi):
        if lo == hi:
            return a[lo]
        p = random.randint(lo, hi)      # random pivot avoids the adversarial worst case
        a[p], a[hi] = a[hi], a[p]
        pivot = a[hi]
        store = lo
        for i in range(lo, hi):         # Lomuto partition
            if a[i] < pivot:
                a[store], a[i] = a[i], a[store]
                store += 1
        a[store], a[hi] = a[hi], a[store]

        if store == target: return a[store]
        if store < target:  return select(store + 1, hi)
        return select(lo, store - 1)

    return select(0, len(a) - 1)`,time:`O(n) average, O(n²) worst`,space:`O(1) with an iterative loop, O(log n) stack when recursive`,why:`Each partition is O(size). If the pivot splits roughly in half we do n + n/2 + n/4 + … which is a geometric series summing to **2n** — that is why the average is linear rather than n log n: unlike quicksort we discard one side entirely instead of recursing into both. The worst case is O(n²) when every pivot is extremal, which a random pivot makes vanishingly unlikely. Say 'average O(n), worst O(n²), randomised pivot' — the qualifier is the point.`}],takeaway:`Full sort O(n log n) → heap of size k O(n log k) → quickselect O(n) average. Which is best depends on k, on whether the data streams, and on whether you can tolerate a bad worst case.`},{t:`drill`,lvl:`medium`,title:`Merge k sorted lists`,tag:`heap · LeetCode 23 · asked at Amazon, Google, Uber`,stmt:"Merge `k` sorted lists into one sorted list. Total number of elements is `N`.",ex:`[[1,4,5],[1,3,4],[2,6]]  ->  [1,1,2,3,4,4,5,6]`,approaches:[{name:`Concatenate and sort`,idea:`Ignore that the inputs are sorted.`,code:`def merge_k(lists):
    return sorted(x for lst in lists for x in lst)`,time:`O(N log N)`,space:`O(N)`,why:`Works, and Timsort actually detects the sorted runs and does better than the bound suggests. But it discards the k-way structure, and the interviewer wants the heap.`},{name:`Optimal — k-way merge with a heap`,idea:`Put the head of each list in a min-heap. Repeatedly pop the global minimum and push that list's next element.`,code:`import heapq

def merge_k(lists):
    h = []
    for i, lst in enumerate(lists):
        if lst:
            heapq.heappush(h, (lst[0], i, 0))    # (value, which list, index in it)

    out = []
    while h:
        val, li, idx = heapq.heappop(h)
        out.append(val)
        if idx + 1 < len(lists[li]):
            heapq.heappush(h, (lists[li][idx + 1], li, idx + 1))
    return out

# stdlib does exactly this, lazily
print(list(heapq.merge(*lists)))`,time:`O(N log k)`,space:`O(k)`,why:"Every one of the N elements is pushed once and popped once, and each heap operation costs O(log k) because the heap never holds more than k items — one per list. So N × log k. Compared with N log N this is a real win when k ≪ N: merging 4 lists of a million elements each gives log 4 = 2 instead of log 4 000 000 ≈ 22. The tuple's second field `i` is a tiebreaker that prevents Python from comparing the third field or raising when values are equal."}],takeaway:`'Merge k sorted things' or 'k-th smallest across sorted sources' ⇒ heap of size k. The heap holds one candidate per source, never the whole dataset.`},{t:`drill`,lvl:`medium`,title:`Count inversions`,tag:`merge sort · asked at Goldman Sachs, Amazon`,stmt:"Count pairs `(i, j)` with `i < j` and `a[i] > a[j]` — how far the array is from sorted.",ex:`[2,4,1,3,5]  ->  3   ((2,1), (4,1), (4,3))`,hint:`During a merge, when you take an element from the right half, it is smaller than everything remaining in the left half — all at once.`,approaches:[{name:`Brute force`,idea:`Check every pair.`,code:`def inversions(a):
    return sum(1 for i in range(len(a))
                 for j in range(i + 1, len(a))
                 if a[i] > a[j])`,time:`O(n²)`,space:`O(1)`,why:`All n(n−1)/2 pairs. Fine for n ≤ 5 000, dead beyond that.`},{name:`Optimal — merge sort counting`,idea:"Sort with merge sort and count inversions as a side effect. Whenever an element from the right half is placed before `len(left) - i` remaining left elements, that is exactly that many inversions.",code:`def inversions(a):
    def sort_count(arr):
        if len(arr) <= 1:
            return arr, 0
        mid = len(arr) // 2
        left, x = sort_count(arr[:mid])
        right, y = sort_count(arr[mid:])

        merged, inv = [], x + y
        i = j = 0
        while i < len(left) and j < len(right):
            if left[i] <= right[j]:
                merged.append(left[i]); i += 1
            else:
                merged.append(right[j]); j += 1
                inv += len(left) - i        # left[i:] are ALL greater than right[j]
        merged += left[i:]
        merged += right[j:]
        return merged, inv

    return sort_count(a)[1]`,time:`O(n log n)`,space:`O(n)`,why:"The recursion tree has log n levels because the array halves each time, and at every level the merges together touch all n elements once — n work per level × log n levels. The counting adds no extra factor: `inv += len(left) - i` records up to n inversions in a single O(1) operation, which is the whole trick. Space is O(n) for the merged buffers plus O(log n) recursion stack. A Fenwick tree over compressed values gives the same O(n log n) iteratively if recursion depth is a concern."}],takeaway:`When a problem counts pairs with an order relation, ask whether merge sort or a Fenwick tree can count them in bulk during a pass that was happening anyway.`}]},{id:`ps-greedy`,title:`Greedy — and how to know it works`,blocks:[{t:`p`,x:`Greedy takes the locally best choice and never revisits it. It is only correct when the problem has the **greedy-choice property**: some optimal solution contains the choice you just made. If you cannot argue that, greedy is a guess and DP is the safe answer.`},{t:`drill`,lvl:`easy`,title:`Best time to buy and sell stock`,tag:`LeetCode 121 · asked at Amazon, Bloomberg`,stmt:`One buy and one sell, sell must come after buy. Maximise profit; return 0 if no profit is possible.`,ex:`[7,1,5,3,6,4]  ->  5   (buy at 1, sell at 6)`,approaches:[{name:`Brute force`,idea:`Try every buy/sell pair.`,code:`def max_profit(prices):
    best = 0
    for i in range(len(prices)):
        for j in range(i + 1, len(prices)):
            best = max(best, prices[j] - prices[i])
    return best`,time:`O(n²)`,space:`O(1)`,why:"All ordered pairs. The waste: for a fixed sell day `j`, we re-scan every earlier day to find the cheapest — but the cheapest-so-far can be carried forward."},{name:`Optimal — track the running minimum`,idea:"Scan once, remembering the lowest price seen. At each day, the best profit selling today is `today − min_so_far`.",code:`def max_profit(prices):
    best = 0
    lowest = float("inf")
    for p in prices:
        lowest = min(lowest, p)       # cheapest buy day so far
        best = max(best, p - lowest)  # best profit if we sell today
    return best`,time:`O(n)`,space:`O(1)`,why:`One pass, two variables, O(1) work per day. The greedy choice is provably safe: for any sell day, buying at the minimum price before it is at least as good as any other buy day, so we never lose an optimal solution by keeping only the minimum. This is the same 'answer ending here depends on one carried value' structure as Kadane — in fact, running Kadane on the array of daily differences gives the identical answer.`}],takeaway:`Before writing a nested loop, ask what the inner loop is computing. If it is 'min/max/sum of everything before me', it can be carried in a variable.`},{t:`drill`,lvl:`medium`,title:`Non-overlapping intervals / activity selection`,tag:`greedy · LeetCode 435 · asked at Google, Adobe`,stmt:`Remove the minimum number of intervals so the rest do not overlap. Equivalently: keep the maximum number of mutually non-overlapping intervals.`,ex:`[[1,2],[2,3],[3,4],[1,3]]  ->  1  (remove [1,3])`,hint:`Which interval should you definitely keep first — the one that starts earliest, is shortest, or ends earliest?`,approaches:[{name:`DP`,idea:`Sort, then longest-chain DP. Correct but heavier than needed.`,code:`def erase_overlap(intervals):
    intervals.sort()
    n = len(intervals)
    dp = [1] * n                            # dp[i] = longest chain ending at i
    for i in range(n):
        for j in range(i):
            if intervals[j][1] <= intervals[i][0]:
                dp[i] = max(dp[i], dp[j] + 1)
    return n - max(dp, default=0)`,time:`O(n²)`,space:`O(n)`,why:`A nested loop over all pairs after sorting. It always works for chain problems, which is why it is the fallback when you cannot justify a greedy rule.`},{name:`Optimal — greedy by earliest end time`,idea:`Sort by **end** time and always keep the interval that finishes soonest. Finishing early leaves the most room for everything after it.`,code:`def erase_overlap(intervals):
    if not intervals:
        return 0
    intervals.sort(key=lambda iv: iv[1])     # sort by END, not start
    kept = 1
    last_end = intervals[0][1]
    for start, end in intervals[1:]:
        if start >= last_end:                # no overlap -> keep it
            kept += 1
            last_end = end
    return len(intervals) - kept`,time:`O(n log n)`,space:`O(1) extra`,why:"The sort dominates; the sweep is O(n) with O(1) work per interval. **Why earliest-end is provably optimal** (this is the part that earns the marks): take any optimal solution and look at its first interval. Swapping it for the globally earliest-ending interval cannot cause a conflict, because the replacement finishes no later, so the rest of the solution still fits. Repeating the argument shows a greedy solution matching the optimal size exists — this is an *exchange argument*, the standard proof technique for greedy correctness. Sorting by start time instead fails on `[[1,100],[2,3],[4,5]]`."}],takeaway:`Interval scheduling ⇒ sort by end time. If you cannot construct an exchange argument for your greedy rule, fall back to DP — an unjustified greedy is the most common wrong answer in interviews.`},{t:`drill`,lvl:`medium`,title:`Jump game`,tag:`greedy · LeetCode 55 · asked at Amazon, Meta`,stmt:"Each `a[i]` is the maximum jump length from index `i`. Can you reach the last index?",ex:`[2,3,1,1,4]  ->  True
[3,2,1,0,4]  ->  False`,approaches:[{name:`DP / backtracking`,idea:`Mark reachability from the end backwards.`,code:`def can_jump(a):
    n = len(a)
    good = [False] * n
    good[-1] = True
    for i in range(n - 2, -1, -1):
        for step in range(1, a[i] + 1):
            if i + step < n and good[i + step]:
                good[i] = True
                break
    return good[0]`,time:`O(n²)`,space:`O(n)`,why:`Each index tries up to n jump lengths. Correct, and the natural first DP formulation — worth writing before optimising.`},{name:`Optimal — furthest reach`,idea:`Sweep left to right carrying the furthest index reachable so far. If you ever stand beyond that reach, you are stuck.`,code:`def can_jump(a):
    reach = 0
    for i, jump in enumerate(a):
        if i > reach:            # cannot even get here
            return False
        reach = max(reach, i + jump)
        if reach >= len(a) - 1:
            return True
    return True`,time:`O(n)`,space:`O(1)`,why:"One pass, O(1) per index. The DP's inner loop asked 'is any of my landing spots good?', but reachability is an **interval**, not a scattered set: if index i is reachable then so is everything between the start and `i + a[i]`. Tracking a single frontier value therefore captures the entire reachable set, collapsing the inner loop into a `max`. Recognising that a set of states is a contiguous interval is the general move that turns many O(n²) DPs into O(n) greedies."}],takeaway:`If the set of reachable states is always a contiguous prefix or interval, you can represent it with one number and drop a loop.`}]}]},{id:`practice-dp`,num:`18`,title:`Practice · Recursion, Backtracking, DP`,kicker:`Recursion → memo → tabulation → rolled space, every time`,sections:[{id:`pd-ladder`,title:`The four-step DP ladder`,blurb:`Every DP problem in this chapter follows the same escalation. Learn the ladder, not the problems.`,blocks:[{t:`p`,x:`You do not need to invent a DP table. You write the **recursion** first — it is usually obvious — and then mechanically improve it. Doing this out loud in an interview is worth more than jumping straight to a table you half-remember.`},{t:`ul`,ord:!0,x:["**Recursion.** Define `solve(state)` in terms of smaller states. State the base case. Complexity is usually exponential — say so.","**Memoise.** Add `@lru_cache`. Time becomes *number of distinct states × work per state*. This is the step that does the real work.",`**Tabulate.** Convert to a bottom-up loop filling an array in dependency order. Same complexity, no recursion limit, better constants.`,"**Roll the space.** If row `i` only reads row `i−1`, keep two rows instead of n. Often collapses further to a couple of variables."]},{t:`note`,k:`tip`,x:`The universal complexity formula: **time = states × transition cost**, **space = states** (plus recursion depth if top-down). Once you can name your state, you can state your complexity before writing a line of code.`},{t:`drill`,lvl:`beginner`,title:`Climbing stairs`,tag:`LeetCode 70 · the ladder in miniature`,stmt:"You can climb 1 or 2 steps at a time. How many distinct ways to reach step `n`?",ex:`n = 3  ->  3   (1+1+1, 1+2, 2+1)`,hint:`To arrive at step n you came from n−1 or n−2. That is the whole recurrence.`,approaches:[{name:`1 · Recursion`,idea:`Ways to reach n = ways to reach n−1 plus ways to reach n−2.`,code:`def climb(n):
    if n <= 2:
        return n
    return climb(n - 1) + climb(n - 2)`,time:`O(2ⁿ)`,space:`O(n)`,why:"Each call spawns two more and the tree is n deep, so the node count is roughly 2ⁿ. Space is the call stack depth, O(n). The waste is visible in the tree: `climb(n-2)` is computed by both branches, and its subtree is recomputed exponentially many times."},{name:`2 · Memoised`,idea:"Cache by `n`. Each distinct value is computed once.",code:`from functools import lru_cache

@lru_cache(maxsize=None)
def climb(n):
    if n <= 2:
        return n
    return climb(n - 1) + climb(n - 2)`,time:`O(n)`,space:`O(n)`,why:`There are exactly n distinct states (the values 1..n) and each does O(1) work once cached, so time = n × O(1) = O(n). Space is the cache O(n) plus the stack O(n). This is the single highest-leverage line of code in DP: one decorator turned 2ⁿ into n by eliminating repeated subtrees.`},{name:`3 · Tabulation`,idea:`Fill an array bottom-up in dependency order — no recursion at all.`,code:`def climb(n):
    if n <= 2:
        return n
    dp = [0] * (n + 1)
    dp[1], dp[2] = 1, 2
    for i in range(3, n + 1):
        dp[i] = dp[i-1] + dp[i-2]
    return dp[n]`,time:`O(n)`,space:`O(n)`,why:"Same state count, same transition cost. What changed is that we removed the recursion, so there is no stack-depth limit and no function-call overhead — a meaningful constant-factor win in Python, where calls are expensive. The order of the loop encodes the dependency: `dp[i]` is only read after both its inputs are written."},{name:`4 · Rolled space`,idea:"`dp[i]` reads only the previous two entries, so two variables suffice.",code:`def climb(n):
    a, b = 1, 2                 # ways to reach step 1 and step 2
    for _ in range(3, n + 1):
        a, b = b, a + b
    return b if n > 1 else 1`,time:`O(n)`,space:`O(1)`,why:`The array was storing n values but only two were ever alive at once. Dropping it takes space from O(n) to O(1) with no change to time. This is Fibonacci — and it is also the exact shape of house robber, decode ways, and min-cost climbing stairs. Recognise the shape and all four rungs come for free.`}],takeaway:`Recursion → memo → table → rolled variables. Announce this ladder at the start of any DP question; it structures the whole conversation.`}]},{id:`pd-backtracking`,title:`Backtracking`,blurb:`Build a partial solution, recurse, undo. The complexity is the size of the search tree.`,blocks:[{t:`code`,x:`# the universal backtracking skeleton
def backtrack(path, choices):
    if is_complete(path):
        results.append(path[:])      # COPY -- path is mutated on the way back up
        return
    for choice in choices:
        if not valid(choice, path):
            continue
        path.append(choice)          # make
        backtrack(path, next_choices(choice))
        path.pop()                   # UNDO -- this is the "backtrack"`,cap:`Forgetting path[:] (copying) or path.pop() (undoing) are the two bugs that account for most wrong answers.`},{t:`drill`,lvl:`medium`,title:`All subsets (power set)`,tag:`LeetCode 78 · asked at Amazon, Meta`,stmt:`Return every subset of a list of distinct integers.`,ex:`[1,2,3]  ->  [[],[1],[2],[3],[1,2],[1,3],[2,3],[1,2,3]]`,hint:`For each element you make a binary decision: include it or not.`,approaches:[{name:`Backtracking`,idea:`At each index, branch on include vs exclude.`,code:`def subsets(nums):
    out, path = [], []

    def bt(start):
        out.append(path[:])              # every node is a valid subset
        for i in range(start, len(nums)):
            path.append(nums[i])
            bt(i + 1)                    # i+1 prevents reusing earlier elements
            path.pop()

    bt(0)
    return out`,time:`O(n · 2ⁿ)`,space:`O(n) recursion + O(n · 2ⁿ) output`,why:"There are 2ⁿ subsets because each of the n elements is independently in or out. The extra factor of n is the `path[:]` copy — each subset costs up to n to write into the output. This is **output-bound**: you cannot do better than 2ⁿ when the answer itself has 2ⁿ entries, so this is optimal. Recursion depth is at most n."},{name:`Bitmask iteration`,idea:`Every integer from 0 to 2ⁿ−1 is a membership bitmask.`,code:`def subsets(nums):
    n = len(nums)
    out = []
    for mask in range(1 << n):                      # 2^n masks
        out.append([nums[i] for i in range(n) if mask >> i & 1])
    return out`,time:`O(n · 2ⁿ)`,space:`O(n · 2ⁿ) output`,why:"Identical complexity, no recursion. The mapping is exact: bit `i` of the mask says whether `nums[i]` is included, so the 2ⁿ integers enumerate the 2ⁿ subsets exactly once. This is the form to use when n ≤ 20 and you want to iterate subsets inside a DP — it is the foundation of bitmask DP."}],takeaway:`2ⁿ is not a failure when the output has 2ⁿ items. Distinguish 'exponential because wasteful' from 'exponential because the answer is exponential'.`},{t:`drill`,lvl:`medium`,title:`All permutations`,tag:`LeetCode 46 · asked at Microsoft, Adobe`,stmt:`Return all permutations of a list of distinct integers.`,ex:`[1,2,3]  ->  6 permutations`,approaches:[{name:`Backtracking with a used set`,idea:`At each depth, try every element not yet placed.`,code:`def permute(nums):
    out, path = [], []
    used = [False] * len(nums)

    def bt():
        if len(path) == len(nums):
            out.append(path[:])
            return
        for i, x in enumerate(nums):
            if used[i]:
                continue
            used[i] = True; path.append(x)
            bt()
            path.pop(); used[i] = False       # undo BOTH mutations

    bt()
    return out`,time:`O(n · n!)`,space:`O(n) recursion, O(n · n!) output`,why:`The tree has n choices at the root, n−1 at the next level, and so on: n! leaves. Each leaf costs O(n) to copy into the output, giving n·n!. Again output-bound and therefore optimal. Note n! explodes fast — 10! is 3.6 million, 13! exceeds a billion, so these problems always have n ≤ 10 or so.`},{name:`In-place swapping`,idea:`Swap each candidate into the current position rather than tracking a used array.`,code:`def permute(nums):
    out = []
    def bt(start):
        if start == len(nums):
            out.append(nums[:])
            return
        for i in range(start, len(nums)):
            nums[start], nums[i] = nums[i], nums[start]
            bt(start + 1)
            nums[start], nums[i] = nums[i], nums[start]   # swap back
    bt(0)
    return out

from itertools import permutations
print(list(permutations([1,2,3])))          # stdlib, C-speed`,time:`O(n · n!)`,space:`O(n) recursion`,why:"Same asymptotics with a lower constant — no `used` array, no `path` list, and the input array doubles as the working buffer. For duplicates you must sort first and skip equal siblings (`if i > start and nums[i] == nums[start]: continue`), otherwise identical permutations appear more than once."}],takeaway:`Permutations are n!, subsets are 2ⁿ, combinations of size k are C(n,k). Identify which shape the problem has and you have its complexity immediately.`},{t:`drill`,lvl:`medium`,title:`Combination sum`,tag:`LeetCode 39 · asked at Amazon, Uber`,stmt:`Given distinct candidates and a target, return all unique combinations summing to the target. Each candidate may be reused unlimited times.`,ex:`candidates = [2,3,6,7], target = 7  ->  [[2,2,3],[7]]`,hint:`To avoid permutations of the same multiset, never go back to an earlier candidate.`,approaches:[{name:`Backtracking with pruning`,idea:"Recurse on the remaining target. Pass `i` rather than `i+1` to allow reuse; sort so you can break early when the candidate exceeds the remainder.",code:`def combination_sum(candidates, target):
    candidates.sort()                     # enables the early break
    out, path = [], []

    def bt(start, remaining):
        if remaining == 0:
            out.append(path[:])
            return
        for i in range(start, len(candidates)):
            if candidates[i] > remaining:
                break                     # sorted -> everything after is too big
            path.append(candidates[i])
            bt(i, remaining - candidates[i])   # i, not i+1 -> reuse allowed
            path.pop()

    bt(0, target)
    return out`,time:`O(n^(target/min)) worst case`,space:`O(target/min) recursion depth`,why:"The search tree's depth is bounded by target divided by the smallest candidate, since each level subtracts at least that much. Branching is up to n. There is no clean polynomial bound — this is exponential search with pruning, and the pruning is what makes it practical: sorting plus the `break` cuts entire subtrees the moment the remainder is too small. Passing `start` instead of restarting from 0 is what prevents `[2,3]` and `[3,2]` both appearing, which would otherwise multiply the output by a factorial."}],takeaway:"Two pruning levers in every backtracking problem: (1) order the choices so you can `break` early, (2) pass a start index so you enumerate combinations rather than permutations."},{t:`drill`,lvl:`hard`,title:`N-Queens`,tag:`LeetCode 51 · asked at Google, Amazon`,stmt:"Place `n` queens on an n×n board so none attack each other. Return all distinct solutions.",ex:`n = 4  ->  2 solutions`,hint:`Place one queen per row. Track attacked columns and both diagonal directions in sets for O(1) checks.`,approaches:[{name:`Backtracking with O(1) conflict sets`,idea:"Row by row. A cell `(r, c)` is safe if its column, its `r−c` diagonal and its `r+c` anti-diagonal are all free.",code:`def solve_n_queens(n):
    out = []
    cols, diag, anti = set(), set(), set()
    placement = []

    def bt(row):
        if row == n:
            out.append(["." * c + "Q" + "." * (n - c - 1) for c in placement])
            return
        for c in range(n):
            if c in cols or (row - c) in diag or (row + c) in anti:
                continue                              # O(1) conflict test
            cols.add(c); diag.add(row - c); anti.add(row + c)
            placement.append(c)

            bt(row + 1)

            placement.pop()
            cols.discard(c); diag.discard(row - c); anti.discard(row + c)

    bt(0)
    return out`,time:`O(n!) upper bound, far less in practice`,space:`O(n)`,why:"Row 0 has n choices, row 1 has at most n−1 non-conflicting ones, and so on — an n! upper bound on the tree. Pruning removes the overwhelming majority of branches, so real runtimes are orders of magnitude below n!. The key design choice is the conflict test: a naive scan over placed queens costs O(n) per candidate and adds a factor of n, while the three sets make it O(1). The identities `r − c` (constant along a ↘ diagonal) and `r + c` (constant along a ↙ diagonal) are what make that possible. Space is O(n) for the sets plus O(n) recursion depth."}],takeaway:`Backtracking performance is decided by how cheaply you can test validity and how early you can prune. Encode constraints so the check is O(1).`}]},{id:`pd-dp`,title:`Core DP problems`,blocks:[{t:`drill`,lvl:`easy`,title:`House robber`,tag:`LeetCode 198 · asked at Amazon, Microsoft`,stmt:`Maximise the loot from a row of houses, but you cannot rob two adjacent ones.`,ex:`[2,7,9,3,1]  ->  12  (rob houses 0, 2, 4)`,hint:`At each house: rob it and skip the previous, or skip it and keep the previous best.`,approaches:[{name:`Memoised recursion`,idea:"`best(i)` = max of (rob house i + best(i−2)) and (skip it, best(i−1)).",code:`from functools import lru_cache

def rob(nums):
    @lru_cache(maxsize=None)
    def best(i):
        if i < 0:
            return 0
        return max(nums[i] + best(i - 2), best(i - 1))
    return best(len(nums) - 1)`,time:`O(n)`,space:`O(n)`,why:`n distinct states, O(1) transition each — the formula again. Without the cache this branches twice per call and is O(2ⁿ). Space is cache plus stack, both O(n).`},{name:`Rolled variables`,idea:`Only the two previous answers matter.`,code:`def rob(nums):
    prev2 = prev1 = 0          # best up to i-2 and i-1
    for x in nums:
        prev2, prev1 = prev1, max(prev1, x + prev2)
    return prev1

def rob_circular(nums):        # houses in a circle: first and last are adjacent
    if len(nums) == 1:
        return nums[0]
    return max(rob(nums[:-1]), rob(nums[1:]))   # exclude first OR exclude last`,time:`O(n)`,space:`O(1)`,why:`Same n states, but the table collapses to two variables because the recurrence reaches back only two steps. The circular variant costs two linear passes — still O(n) — and the trick is realising that in any valid solution the first and last house cannot both be robbed, so solving both restricted lines and taking the max covers every case.`}],takeaway:`'Cannot pick adjacent' is the canonical linear DP. Its shape — depend on i−1 and i−2 — is identical to climbing stairs.`},{t:`drill`,lvl:`medium`,title:`Coin change — fewest coins`,tag:`LeetCode 322 · asked at Amazon, Goldman Sachs`,stmt:`Given coin denominations and an amount, return the fewest coins that make it, or −1 if impossible. Unlimited supply of each coin.`,ex:`coins = [1,2,5], amount = 11  ->  3   (5+5+1)`,hint:`Greedy (always take the biggest coin) is WRONG here. Try coins = [1,3,4], amount = 6.`,approaches:[{name:`Greedy (incorrect — know why)`,idea:`Take the largest coin that fits, repeatedly.`,code:`def coin_change_greedy(coins, amount):
    coins.sort(reverse=True)
    count = 0
    for c in coins:
        take = amount // c
        count += take
        amount -= take * c
    return count if amount == 0 else -1

# coins=[1,3,4], amount=6:  greedy gives 4+1+1 = 3 coins
#                           optimal is    3+3   = 2 coins`,time:`O(n log n)`,space:`O(1)`,why:`Fast and wrong. Greedy only works for *canonical* coin systems (like real currency). The exchange argument fails: taking the largest coin can leave a remainder that needs many small coins. Being able to produce this counterexample on demand is worth more in an interview than the correct algorithm alone.`},{name:`Memoised recursion`,idea:"`best(rem)` = 1 + min over coins of `best(rem − coin)`.",code:`from functools import lru_cache

def coin_change(coins, amount):
    @lru_cache(maxsize=None)
    def best(rem):
        if rem == 0:  return 0
        if rem < 0:   return float("inf")
        return 1 + min((best(rem - c) for c in coins), default=float("inf"))
    r = best(amount)
    return -1 if r == float("inf") else r`,time:`O(amount × len(coins))`,space:`O(amount)`,why:"States = the distinct remainders 0..amount, so `amount + 1` of them. Transition = try every coin, so O(len(coins)) work per state. Multiply: **states × transition = amount × coins**. That is the formula in action, and it is why the complexity depends on the *value* of the amount, not just the input length — a pseudo-polynomial bound."},{name:`Bottom-up tabulation`,idea:"Fill `dp[a]` for every amount from 1 upward.",code:`def coin_change(coins, amount):
    INF = float("inf")
    dp = [0] + [INF] * amount              # dp[a] = fewest coins to make a
    for a in range(1, amount + 1):
        for c in coins:
            if c <= a and dp[a - c] + 1 < dp[a]:
                dp[a] = dp[a - c] + 1
    return -1 if dp[amount] == INF else dp[amount]

def coin_change_ways(coins, amount):       # COUNT combinations instead
    dp = [1] + [0] * amount
    for c in coins:                        # coin loop OUTSIDE -> combinations
        for a in range(c, amount + 1):     # coin loop inside -> permutations
            dp[a] += dp[a - c]
    return dp[amount]`,time:`O(amount × len(coins))`,space:`O(amount)`,why:"Identical state and transition counts, now iterative — no recursion limit for large amounts, and much better constants. The counting variant beneath it is worth memorising: **loop order decides whether you count combinations or permutations**. Coins outside means each coin is considered once for the whole table, so `{1,2}` and `{2,1}` are the same. Swap the loops and they are counted separately."}],takeaway:`When greedy is tempting, look for a counterexample first. Pseudo-polynomial DP over amounts is the standard fallback, and loop order carries real meaning.`},{t:`drill`,lvl:`medium`,title:`0/1 knapsack`,tag:`the DP archetype · asked at Amazon, Goldman Sachs, Flipkart`,stmt:`Each item has a weight and a value, and can be taken at most once. Maximise value under a weight capacity.`,ex:`weights = [1,3,4,5], values = [1,4,5,7], cap = 7  ->  9  (items 1 and 3)`,approaches:[{name:`Memoised recursion`,idea:`At each item, take it or leave it.`,code:`from functools import lru_cache

def knapsack(weights, values, cap):
    n = len(weights)
    @lru_cache(maxsize=None)
    def best(i, remaining):
        if i == n or remaining == 0:
            return 0
        skip = best(i + 1, remaining)
        if weights[i] > remaining:
            return skip
        take = values[i] + best(i + 1, remaining - weights[i])
        return max(take, skip)
    return best(0, cap)`,time:`O(n × cap)`,space:`O(n × cap)`,why:"The state is the pair `(item index, remaining capacity)` — that is n × cap distinct states, each doing O(1) work. Without memoisation the two branches per item give O(2ⁿ). Space is the cache, which holds one entry per state."},{name:`2D table`,idea:"`dp[i][c]` = best value using the first `i` items with capacity `c`.",code:`def knapsack(weights, values, cap):
    n = len(weights)
    dp = [[0] * (cap + 1) for _ in range(n + 1)]
    for i in range(1, n + 1):
        w, v = weights[i-1], values[i-1]
        for c in range(cap + 1):
            dp[i][c] = dp[i-1][c]                          # skip item i
            if w <= c:
                dp[i][c] = max(dp[i][c], dp[i-1][c-w] + v) # take it
    return dp[n][cap]`,time:`O(n × cap)`,space:`O(n × cap)`,why:"The double loop visits every state once with O(1) work. Reading `dp[i-1][...]` makes the dependency explicit: row `i` only ever looks at row `i−1`, which is exactly the signal that the space can be rolled."},{name:`1D rolled table`,idea:`Keep one row and iterate capacity **backwards**, so each item is used at most once.`,code:`def knapsack(weights, values, cap):
    dp = [0] * (cap + 1)
    for w, v in zip(weights, values):
        for c in range(cap, w - 1, -1):        # BACKWARDS = 0/1
            dp[c] = max(dp[c], dp[c - w] + v)
    return dp[cap]

def unbounded_knapsack(weights, values, cap):
    dp = [0] * (cap + 1)
    for w, v in zip(weights, values):
        for c in range(w, cap + 1):            # FORWARDS = unlimited reuse
            dp[c] = max(dp[c], dp[c - w] + v)
    return dp[cap]`,time:`O(n × cap)`,space:`O(cap)`,why:"Same state count, one row of memory. **Why backwards?** Going forwards, `dp[c - w]` would already have been updated *with the current item* during this same pass, so the item could be taken twice. Iterating downwards guarantees `dp[c - w]` still holds the previous item's value. That single loop direction is the entire difference between 0/1 and unbounded knapsack, and it is the most common follow-up question on this problem."}],takeaway:`Knapsack is the template for 'choose a subset under a budget': subset-sum, partition-equal-subset, target-sum and coin-change are all this with different transitions.`},{t:`drill`,lvl:`medium`,title:`Longest increasing subsequence`,tag:`LeetCode 300 · asked at Google, Microsoft`,stmt:`Return the length of the longest strictly increasing subsequence (not necessarily contiguous).`,ex:`[10,9,2,5,3,7,101,18]  ->  4   ([2,3,7,101])`,hint:`The O(n log n) version does not store the subsequence — it stores the smallest possible tail for each length.`,approaches:[{name:`DP O(n²)`,idea:"`dp[i]` = length of the LIS ending at index i. Look back at every smaller earlier element.",code:`def lis(a):
    if not a: return 0
    dp = [1] * len(a)                    # every element alone is a subsequence
    for i in range(len(a)):
        for j in range(i):
            if a[j] < a[i]:
                dp[i] = max(dp[i], dp[j] + 1)
    return max(dp)`,time:`O(n²)`,space:`O(n)`,why:`n states (one per ending index) with an O(n) transition (scan all previous indices): n × n. Straightforward, always correct, and the version to write if you cannot recall the optimal one. It also extends naturally to reconstructing the actual subsequence by storing predecessors.`},{name:`Optimal O(n log n) — patience`,idea:"Maintain `tails`, where `tails[k]` is the **smallest possible tail value** of an increasing subsequence of length k+1. For each new element, binary search for where it belongs and overwrite.",code:`import bisect

def lis(a):
    tails = []
    for x in a:
        i = bisect.bisect_left(tails, x)     # bisect_right for NON-decreasing
        if i == len(tails):
            tails.append(x)                  # extends the longest run
        else:
            tails[i] = x                     # smaller tail for this length = better
    return len(tails)`,time:`O(n log n)`,space:`O(n)`,why:"n elements × O(log n) binary search each. The invariant is what makes it work: `tails` is always sorted, and keeping the smallest tail for every length maximises the chance of extending later. **`tails` is not the LIS itself** — its contents can be a subsequence that never existed — but its *length* is always correct. If asked to return the actual subsequence, keep a parent-pointer array alongside and reconstruct. The n² inner scan collapsed into a log n search because the array we were scanning is sorted by construction."}],takeaway:`When an O(n) inner scan is over data that happens to be sorted, binary search replaces it. That single observation converts many n² DPs into n log n.`},{t:`drill`,lvl:`hard`,title:`Edit distance (Levenshtein)`,tag:`LeetCode 72 · asked at Google, Amazon, Microsoft`,stmt:`Minimum number of insertions, deletions or substitutions to turn word A into word B.`,ex:`"horse" -> "ros"  =  3`,hint:`Compare the last characters. If they match, the cost is whatever it took for the prefixes. If not, you pay 1 plus the best of three smaller problems.`,approaches:[{name:`2D DP`,idea:"`dp[i][j]` = edit distance between the first `i` characters of A and the first `j` of B.",code:`def edit_distance(a, b):
    m, n = len(a), len(b)
    dp = [[0] * (n + 1) for _ in range(m + 1)]

    for i in range(m + 1): dp[i][0] = i     # delete everything
    for j in range(n + 1): dp[0][j] = j     # insert everything

    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if a[i-1] == b[j-1]:
                dp[i][j] = dp[i-1][j-1]     # free — characters match
            else:
                dp[i][j] = 1 + min(
                    dp[i-1][j-1],           # substitute
                    dp[i-1][j],             # delete from a
                    dp[i][j-1],             # insert into a
                )
    return dp[m][n]`,time:`O(m × n)`,space:`O(m × n)`,why:"States are all prefix pairs `(i, j)` — (m+1)(n+1) of them — with an O(1) transition looking at three neighbours. The base cases encode 'turning a string into the empty string costs one deletion per character'. Every DP over two sequences has this shape; LCS and longest common substring differ only in the transition."},{name:`Rolled to O(min(m,n)) space`,idea:"Row `i` reads only row `i−1` and the cell to its left. Keep two rows.",code:`def edit_distance(a, b):
    if len(a) < len(b):
        a, b = b, a                          # ensure b is the shorter -> smaller rows
    m, n = len(a), len(b)
    prev = list(range(n + 1))

    for i in range(1, m + 1):
        cur = [i] + [0] * n
        for j in range(1, n + 1):
            if a[i-1] == b[j-1]:
                cur[j] = prev[j-1]
            else:
                cur[j] = 1 + min(prev[j-1], prev[j], cur[j-1])
        prev = cur
    return prev[n]`,time:`O(m × n)`,space:`O(min(m, n))`,why:"Time is unchanged — every state is still visited once. Space falls because the full table was never needed: the recurrence reaches back exactly one row. Swapping so that `b` is the shorter string makes the retained rows as small as possible. The trade-off is that you can no longer backtrack through the table to reconstruct the actual edit script; if the interviewer wants the operations listed, keep the full 2D table."}],takeaway:`Two-sequence DP ⇒ a 2D table indexed by prefix lengths. If the recurrence looks back one row, roll it. If you need to reconstruct the answer, don't.`}]}]},{id:`practice-ds`,num:`19`,title:`Practice · Lists, Stacks, Trees, Graphs`,kicker:`Pointer manipulation, monotonic stacks, traversals, BFS/DFS`,sections:[{id:`pds-linked`,title:`Linked lists`,blurb:`Python rarely needs them in production, but interviews love them — they test pointer discipline.`,blocks:[{t:`code`,x:`class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

def build(values):                    # helper for testing
    head = tail = None
    for v in values:
        node = ListNode(v)
        if head is None: head = tail = node
        else: tail.next = node; tail = node
    return head`,cap:`The two universal techniques: a dummy head node (removes edge cases at the front) and slow/fast pointers.`},{t:`drill`,lvl:`easy`,title:`Reverse a linked list`,tag:`LeetCode 206 · asked everywhere`,stmt:`Reverse a singly linked list and return the new head.`,ex:`1->2->3->4  ->  4->3->2->1`,hint:`You need three pointers: previous, current, and a saved copy of next before you overwrite it.`,approaches:[{name:`Iterative`,idea:"Walk forward, flipping each `next` pointer to point backwards. Save the next node before overwriting or you lose the rest of the list.",code:`def reverse(head):
    prev = None
    cur = head
    while cur:
        nxt = cur.next        # SAVE first -- we are about to destroy this link
        cur.next = prev       # flip
        prev = cur            # advance both
        cur = nxt
    return prev               # prev is the old tail = the new head`,time:`O(n)`,space:`O(1)`,why:`One pass, each node's pointer rewritten exactly once. Constant space — three pointers regardless of list length. This is the answer interviewers want; the four-line loop body is worth having in muscle memory because half a dozen other problems embed it.`},{name:`Recursive`,idea:`Reverse the tail, then attach the head to the end.`,code:`def reverse(head):
    if head is None or head.next is None:
        return head
    new_head = reverse(head.next)     # reverse everything after head
    head.next.next = head             # make the next node point BACK at head
    head.next = None                  # head becomes the new tail
    return new_head`,time:`O(n)`,space:`O(n)`,why:`Same linear time, but the recursion goes n frames deep before unwinding, so space is O(n) for the call stack — and with Python's 1000-frame default limit it crashes on long lists. When an interviewer asks for both versions, this is the space distinction they are checking.`}],takeaway:`Save the next pointer before you overwrite it. That single habit prevents most linked-list bugs.`},{t:`drill`,lvl:`easy`,title:`Detect a cycle and find its start`,tag:`Floyd's algorithm · LeetCode 141/142 · asked at Amazon, Microsoft`,stmt:`Does the list contain a cycle? If so, return the node where it begins.`,ex:`3->2->0->-4 with -4 pointing back to 2  ->  cycle starts at node 2`,hint:`Two runners on a circular track, one twice as fast, must eventually meet.`,approaches:[{name:`Hash set`,idea:`Record visited nodes; a repeat means a cycle.`,code:`def detect_cycle(head):
    seen = set()
    cur = head
    while cur:
        if cur in seen:            # hashes by identity by default
            return cur
        seen.add(cur)
        cur = cur.next
    return None`,time:`O(n)`,space:`O(n)`,why:`One pass with O(1) set operations. Simple and correct — the interviewer's follow-up is always 'now in O(1) space'.`},{name:`Optimal — Floyd's tortoise and hare`,idea:"Move `slow` one step and `fast` two. If they meet, there is a cycle. Then reset one pointer to the head and advance both one step at a time — they meet at the cycle's entrance.",code:`def detect_cycle(head):
    slow = fast = head
    while fast and fast.next:
        slow = slow.next
        fast = fast.next.next
        if slow is fast:                  # meeting point inside the cycle
            slow = head
            while slow is not fast:       # phase 2: both move ONE step
                slow = slow.next
                fast = fast.next
            return slow                   # the cycle entrance
    return None`,time:`O(n)`,space:`O(1)`,why:"Phase 1: inside a cycle of length C, the gap between the pointers shrinks by one per step, so they meet within C steps — total O(n). Phase 2 is the part worth being able to prove: let `a` be the distance from the head to the cycle entrance and `b` the distance from the entrance to the meeting point. When they meet, slow has travelled `a + b` and fast has travelled twice that, so `2(a+b) = a + b + kC`, giving `a = kC − b`. That means walking `a` steps from the head and `a` steps from the meeting point lands on the same node — the entrance. Two pointers, no memory."}],takeaway:`Slow/fast pointers also find the middle of a list (fast reaches the end when slow is at the midpoint) and the nth node from the end (offset the fast pointer by n first).`},{t:`drill`,lvl:`easy`,title:`Merge two sorted linked lists`,tag:`LeetCode 21 · asked at Amazon, Adobe`,stmt:`Merge two sorted lists into one sorted list by splicing nodes, not copying values.`,ex:`1->2->4  and  1->3->4  ->  1->1->2->3->4->4`,approaches:[{name:`Dummy head + splice`,idea:`A dummy node removes the 'is this the first element?' special case entirely.`,code:`def merge(a, b):
    dummy = ListNode()          # sentinel; never part of the answer
    tail = dummy
    while a and b:
        if a.val <= b.val:      # <= keeps the merge STABLE
            tail.next, a = a, a.next
        else:
            tail.next, b = b, b.next
        tail = tail.next
    tail.next = a or b          # attach whatever remains
    return dummy.next`,time:`O(n + m)`,space:`O(1)`,why:`Each node from both lists is visited and relinked exactly once. No allocation beyond the single dummy node, so space is O(1) — we are rewiring existing nodes, not building new ones. The dummy is the technique to internalise: without it you need a branch to initialise the head, and that branch is where bugs live.`}],takeaway:`Use a dummy head whenever the result list is built incrementally. It converts 'special-case the first node' into 'no special case at all'.`}]},{id:`pds-stack`,title:`Stacks and monotonic stacks`,blocks:[{t:`p`,x:`A **monotonic stack** keeps its elements sorted (increasing or decreasing). It answers 'what is the next greater/smaller element' for every position in a single O(n) pass, because each element is pushed once and popped once.`},{t:`drill`,lvl:`easy`,title:`Valid parentheses`,tag:`LeetCode 20 · asked everywhere`,stmt:"Given a string of `()[]{}`, decide whether every bracket is correctly closed and nested.",ex:`"{[()]}"  ->  True
"([)]"    ->  False`,approaches:[{name:`Stack`,idea:`Push openers; on a closer, the top of the stack must be its match.`,code:`def valid(s):
    pairs = {")": "(", "]": "[", "}": "{"}
    stack = []
    for c in s:
        if c in "([{":
            stack.append(c)
        elif c in pairs:
            if not stack or stack.pop() != pairs[c]:
                return False
    return not stack          # leftovers = unclosed brackets`,time:`O(n)`,space:`O(n)`,why:'One pass, O(1) per character. Space is O(n) in the worst case `"((((("`. Nesting is inherently last-in-first-out, which is exactly what a stack models — that mapping from problem structure to data structure is what the question tests. The final `not stack` check catches `"("`, which everyone forgets on the first attempt.'}],takeaway:`Nesting, matching and undo all map to stacks. If the problem says 'most recent unmatched thing', it is a stack.`},{t:`drill`,lvl:`medium`,title:`Next greater element`,tag:`monotonic stack · LeetCode 496/739 · asked at Amazon, Google`,stmt:`For each element, find the next element to its right that is strictly greater. Use −1 when none exists.`,ex:`[2,1,2,4,3]  ->  [4,2,4,-1,-1]`,hint:`Keep a stack of indices whose answer is still unknown. A new bigger element resolves all of them at once.`,approaches:[{name:`Brute force`,idea:`For each element, scan rightwards.`,code:`def next_greater(a):
    out = [-1] * len(a)
    for i in range(len(a)):
        for j in range(i + 1, len(a)):
            if a[j] > a[i]:
                out[i] = a[j]
                break
    return out`,time:`O(n²)`,space:`O(1)`,why:`Worst case (a decreasing array) every element scans to the end. The waste: adjacent elements rescan almost the same suffix.`},{name:`Optimal — monotonic decreasing stack`,idea:`Hold indices whose answer is still pending, in decreasing value order. When a bigger value arrives, it is the answer for everything smaller on the stack — pop them all.`,code:`def next_greater(a):
    out = [-1] * len(a)
    stack = []                       # indices, values strictly decreasing
    for i, x in enumerate(a):
        while stack and a[stack[-1]] < x:
            out[stack.pop()] = x     # x is the next greater for that index
        stack.append(i)
    return out                       # anything left on the stack keeps -1

def daily_temperatures(t):           # same pattern, answer is the DISTANCE
    out = [0] * len(t)
    stack = []
    for i, x in enumerate(t):
        while stack and t[stack[-1]] < x:
            j = stack.pop()
            out[j] = i - j
        stack.append(i)
    return out`,time:`O(n)`,space:`O(n)`,why:"The inner `while` makes it look quadratic, but **each index is pushed exactly once and popped at most once**, so the total number of pop operations across the entire run is at most n. Add the n pushes and you get at most 2n stack operations — amortised O(n). This is the same amortised argument as the sliding window and `list.append`; recognising it is what separates a correct complexity answer from a wrong one here."}],takeaway:`'Next/previous greater or smaller' ⇒ monotonic stack, O(n). It also underpins largest-rectangle-in-histogram and trapping rain water.`},{t:`drill`,lvl:`medium`,title:`Min stack — O(1) minimum`,tag:`design · LeetCode 155 · asked at Amazon, Bloomberg`,stmt:"Design a stack supporting push, pop, top and `get_min`, all in O(1).",approaches:[{name:`Auxiliary min stack`,idea:`Alongside the values, push the minimum-so-far. The two stacks stay in lockstep.`,code:`class MinStack:
    def __init__(self):
        self.stack = []
        self.mins = []                   # mins[i] = min of stack[0..i]

    def push(self, x):
        self.stack.append(x)
        self.mins.append(x if not self.mins else min(x, self.mins[-1]))

    def pop(self):
        self.mins.pop()
        return self.stack.pop()

    def top(self):
        return self.stack[-1]

    def get_min(self):
        return self.mins[-1]`,time:`O(1) per operation`,space:`O(n)`,why:"Every operation is a constant number of list appends/pops, which are amortised O(1). The insight is that a stack's minimum is *history-dependent*: after popping, the minimum must revert to what it was before that push. Storing a parallel history makes the reversion free rather than requiring an O(n) rescan. Space doubles, which is the trade — you can halve it by only pushing to `mins` when a new minimum appears, at the cost of a comparison in `pop`."}],takeaway:`Design questions are usually 'what extra state makes the expensive query cheap?'. Here, storing the min-history turns an O(n) scan into an O(1) peek.`},{t:`drill`,lvl:`hard`,title:`Largest rectangle in a histogram`,tag:`LeetCode 84 · asked at Google, Amazon`,stmt:`Given bar heights of width 1, find the area of the largest rectangle fitting entirely inside the histogram.`,ex:`[2,1,5,6,2,3]  ->  10  (bars of height 5 and 6, width 2)`,hint:`For each bar, the widest rectangle of that height extends until the first shorter bar on each side.`,approaches:[{name:`Brute force`,idea:`For each bar, expand left and right while bars are at least as tall.`,code:`def largest_rect(h):
    best = 0
    for i in range(len(h)):
        left = right = i
        while left > 0 and h[left-1] >= h[i]:  left -= 1
        while right < len(h)-1 and h[right+1] >= h[i]: right += 1
        best = max(best, h[i] * (right - left + 1))
    return best`,time:`O(n²)`,space:`O(1)`,why:`Each bar can expand across the whole array. It is a correct baseline, and stating it lets you name the exact waste: finding 'the nearest shorter bar on each side' is being recomputed from scratch for every index — which is precisely what a monotonic stack computes for all indices at once.`},{name:`Optimal — monotonic increasing stack`,idea:"Keep indices of increasing heights. When a shorter bar arrives, every taller bar on the stack has found its right boundary, so pop and compute its area. A sentinel `0` at the end flushes the stack.",code:`def largest_rect(h):
    stack = []                     # indices, heights increasing
    best = 0
    for i, x in enumerate(h + [0]):        # sentinel forces a full flush
        while stack and h[stack[-1]] >= x:
            height = h[stack.pop()]
            # left boundary is the new stack top; width spans between the boundaries
            width = i if not stack else i - stack[-1] - 1
            best = max(best, height * width)
        stack.append(i)
    return best`,time:`O(n)`,space:`O(n)`,why:"Each index is pushed once and popped once, so despite the nested `while` the total work is at most 2n operations — amortised linear, the same argument as next-greater-element. When a bar is popped at position `i`, its right boundary is `i` (the first shorter bar) and its left boundary is the element now on top of the stack (the previous shorter bar), so the maximal width is available in O(1). The sentinel `0` is what guarantees every remaining bar gets popped and measured instead of being stranded on the stack."}],takeaway:`When a problem needs 'nearest smaller element on both sides' for every index, the monotonic stack gives all 2n boundaries in one linear pass.`}]},{id:`pds-trees`,title:`Trees`,blocks:[{t:`code`,x:`class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val, self.left, self.right = val, left, right`},{t:`drill`,lvl:`beginner`,title:`Maximum depth of a binary tree`,tag:`LeetCode 104`,stmt:`Return the number of nodes on the longest root-to-leaf path.`,approaches:[{name:`Recursive DFS`,idea:`Depth of a node = 1 + max depth of its children.`,code:`def max_depth(root):
    if not root:
        return 0
    return 1 + max(max_depth(root.left), max_depth(root.right))`,time:`O(n)`,space:`O(h)`,why:"Every node is visited exactly once, so time is O(n) regardless of shape. Space is the recursion depth `h` — **O(log n) for a balanced tree, O(n) for a degenerate one shaped like a linked list**. That distinction between n and h is the single most common tree-complexity question, so always answer in terms of h and then say what h is in each case."},{name:`Iterative BFS`,idea:`Count levels with a queue — no recursion limit.`,code:`from collections import deque

def max_depth(root):
    if not root: return 0
    q = deque([root])
    depth = 0
    while q:
        depth += 1
        for _ in range(len(q)):         # snapshot the level size FIRST
            node = q.popleft()
            if node.left:  q.append(node.left)
            if node.right: q.append(node.right)
    return depth`,time:`O(n)`,space:`O(w)`,why:"Same linear time. Space is the maximum queue size, which is the tree's **widest level** — up to n/2 for a complete tree, so O(n) worst case. Note the trade: DFS space is the height, BFS space is the width. For a deep skinny tree BFS wins; for a wide shallow tree DFS wins. The `for _ in range(len(q))` is the standard level-separation idiom."}],takeaway:`Tree complexity is O(n) time and O(h) space for DFS, O(w) for BFS. Always state whether h is log n or n for the shape in question.`},{t:`drill`,lvl:`medium`,title:`Validate a binary search tree`,tag:`LeetCode 98 · asked at Amazon, Meta, Microsoft`,stmt:`Is the tree a valid BST? Every node in the left subtree must be strictly less than the node, and every node on the right strictly greater.`,ex:`[5,1,4,null,null,3,6]  ->  False  (3 is right of 5 but less than it)`,hint:"Checking only `node.left.val < node.val` is wrong — the constraint is inherited from every ancestor, not just the parent.",approaches:[{name:`Naive local check (wrong)`,idea:`The trap answer. Worth writing so you can explain why it fails.`,code:`def is_bst(root):                       # INCORRECT
    if not root: return True
    if root.left and root.left.val >= root.val:  return False
    if root.right and root.right.val <= root.val: return False
    return is_bst(root.left) and is_bst(root.right)

#     5
#    / \\
#   1   4        <- 4's left child is 3, which is < 4 (locally fine)
#      / \\         but 3 is in 5's RIGHT subtree and 3 < 5. Invalid.
#     3   6`,time:`O(n)`,space:`O(h)`,why:`The complexity is fine; the logic is not. A BST constrains every node against a *range* inherited from all its ancestors, not just an immediate comparison. Interviewers use this problem specifically because the local check looks right.`},{name:`Range propagation`,idea:"Pass down the allowed `(low, high)` interval. Going left tightens the upper bound; going right tightens the lower.",code:`def is_bst(root, low=float("-inf"), high=float("inf")):
    if not root:
        return True
    if not (low < root.val < high):
        return False
    return (is_bst(root.left,  low, root.val) and
            is_bst(root.right, root.val, high))`,time:`O(n)`,space:`O(h)`,why:"Each node is visited once with O(1) work. Space is the recursion depth h. The bounds carry the ancestor constraints downward, which is exactly the information the naive version discards. Strict `<` enforces 'no duplicates'; if the problem allows equal values on one side, relax that comparison accordingly."},{name:`Inorder traversal`,idea:`An inorder walk of a BST yields strictly increasing values. Check that as you go, without storing the list.`,code:`def is_bst(root):
    prev = None
    stack, node = [], root
    while stack or node:
        while node:                       # go as far left as possible
            stack.append(node); node = node.left
        node = stack.pop()
        if prev is not None and node.val <= prev:
            return False                  # order violated
        prev = node.val
        node = node.right
    return True`,time:`O(n)`,space:`O(h)`,why:`Same bounds, iterative so there is no recursion limit, and it short-circuits on the first violation. Only the previous value is stored rather than the whole traversal, keeping space at O(h) for the stack instead of O(n) for a list. This inorder-is-sorted property is the defining characteristic of a BST and shows up in kth-smallest, BST-to-sorted-list and successor problems.`}],takeaway:`BST ⇒ inorder is sorted. Constraints in trees usually propagate from ancestors; passing bounds downward is the general fix for local-check bugs.`},{t:`drill`,lvl:`medium`,title:`Lowest common ancestor`,tag:`LeetCode 236 · asked at Meta, Amazon, Google`,stmt:"Find the deepest node that has both `p` and `q` as descendants. A node may be its own descendant.",approaches:[{name:`Recursive post-order`,idea:"Ask each subtree whether it contains `p` or `q`. If both sides report a hit, the current node is the LCA.",code:`def lca(root, p, q):
    if root is None or root is p or root is q:
        return root                      # found one, or hit the bottom

    left  = lca(root.left,  p, q)
    right = lca(root.right, p, q)

    if left and right:
        return root                      # p and q are on opposite sides -> this is it
    return left or right                 # both on one side -> pass the finding upward`,time:`O(n)`,space:`O(h)`,why:`One post-order visit per node with O(1) work, so O(n). Space is the recursion depth h. The elegance is the return contract: the function returns either the LCA, or whichever of p/q was found in this subtree, or None. That single value carries enough information for the parent to decide, which is why no extra bookkeeping or parent pointers are needed. For a **BST** you can do better — walk down comparing values and go left or right until the target values split, giving O(h) time.`}],takeaway:`Post-order recursion where each call returns a summary of its subtree solves most 'find something about a subtree' problems in one pass.`},{t:`drill`,lvl:`medium`,title:`Level order traversal`,tag:`BFS · LeetCode 102 · asked at Amazon, Microsoft`,stmt:`Return the node values level by level, as a list of lists.`,ex:`[3,9,20,null,null,15,7]  ->  [[3],[9,20],[15,7]]`,approaches:[{name:`BFS with level snapshots`,idea:`Record the queue length before processing a level — that is exactly how many nodes belong to it.`,code:`from collections import deque

def level_order(root):
    if not root: return []
    out, q = [], deque([root])
    while q:
        level = []
        for _ in range(len(q)):          # freeze the count BEFORE appending children
            node = q.popleft()
            level.append(node.val)
            if node.left:  q.append(node.left)
            if node.right: q.append(node.right)
        out.append(level)
    return out

def zigzag(root):                        # alternate direction per level
    out, q, left_to_right = [], deque([root] if root else []), True
    while q:
        level = deque()
        for _ in range(len(q)):
            node = q.popleft()
            level.append(node.val) if left_to_right else level.appendleft(node.val)
            if node.left:  q.append(node.left)
            if node.right: q.append(node.right)
        out.append(list(level))
        left_to_right = not left_to_right
    return out`,time:`O(n)`,space:`O(w)`,why:"Every node enters and leaves the queue exactly once — O(n). Space is the maximum level width w, which for a complete binary tree is about n/2, so O(n) worst case. `len(q)` must be read *before* the inner loop starts appending children, otherwise the loop bleeds into the next level; that is the single bug this problem is designed to catch. Using `deque` matters: `list.pop(0)` would be O(n) and turn this into O(n²)."}],takeaway:`BFS + the len(queue) snapshot is the template for every level-based tree question: right-side view, average per level, zigzag, minimum depth.`}]},{id:`pds-graphs`,title:`Graphs`,blocks:[{t:`p`,x:"For a graph with `V` vertices and `E` edges, both BFS and DFS are **O(V + E)** with an adjacency list: every vertex is dequeued once and every edge is examined once. With an adjacency *matrix* it becomes O(V²), because finding a vertex's neighbours requires scanning a whole row."},{t:`drill`,lvl:`medium`,title:`Number of islands`,tag:`grid DFS/BFS · LeetCode 200 · asked at Amazon, Google, Meta`,stmt:"Count connected groups of `'1'` (land) in a grid of `'1'` and `'0'`, connected 4-directionally.",ex:`11000
11000
00100
00011   ->  3`,hint:`Every unvisited land cell starts a new island; flood-fill it so it is never counted again.`,approaches:[{name:`DFS flood fill`,idea:`Scan the grid. On each unvisited land cell, increment the count and sink the whole connected component.`,code:`def num_islands(grid):
    if not grid: return 0
    R, C = len(grid), len(grid[0])
    count = 0

    def sink(r, c):
        if r < 0 or r >= R or c < 0 or c >= C or grid[r][c] != "1":
            return
        grid[r][c] = "0"                     # mark visited by mutating the grid
        sink(r+1, c); sink(r-1, c); sink(r, c+1); sink(r, c-1)

    for r in range(R):
        for c in range(C):
            if grid[r][c] == "1":
                count += 1
                sink(r, c)
    return count`,time:`O(R × C)`,space:`O(R × C) recursion worst case`,why:"Every cell is examined by the outer loops once, and sunk by at most one flood fill — after which it is `'0'` and never re-entered. So the total work is proportional to the number of cells, not to cells × components. Space is the recursion depth, which for a grid that is entirely land is the full R×C. That stack depth exceeds Python's limit around a 32×32 all-land grid, which is exactly why the BFS version matters."},{name:`BFS with a queue`,idea:`Same flood fill, iterative — no recursion limit.`,code:`from collections import deque

def num_islands(grid):
    if not grid: return 0
    R, C = len(grid), len(grid[0])
    count = 0
    DIRS = ((1,0),(-1,0),(0,1),(0,-1))

    for r in range(R):
        for c in range(C):
            if grid[r][c] != "1":
                continue
            count += 1
            grid[r][c] = "0"
            q = deque([(r, c)])
            while q:
                cr, cc = q.popleft()
                for dr, dc in DIRS:
                    nr, nc = cr + dr, cc + dc
                    if 0 <= nr < R and 0 <= nc < C and grid[nr][nc] == "1":
                        grid[nr][nc] = "0"      # mark WHEN ENQUEUEING, not when dequeuing
                        q.append((nr, nc))
    return count`,time:`O(R × C)`,space:`O(min(R, C)) for the queue`,why:`Same linear-in-cells time. The queue holds at most one BFS frontier, which in a grid is bounded by the smaller dimension — a real space improvement over DFS's worst case. Marking cells visited **when you enqueue them** rather than when you dequeue is essential; otherwise the same cell can be added multiple times before being processed, and the queue blows up.`}],takeaway:`Grid problems are graph problems where neighbours are computed rather than stored. Mutating the grid to mark visits saves O(R×C) space — mention it, and ask whether mutating the input is allowed.`},{t:`drill`,lvl:`medium`,title:`Course schedule — cycle detection in a directed graph`,tag:`topological sort · LeetCode 207 · asked at Amazon, Google, Uber`,stmt:`Given course prerequisites as directed edges, can all courses be finished? Equivalently: is the graph acyclic?`,ex:`n = 2, prerequisites = [[1,0]]        ->  True
n = 2, prerequisites = [[1,0],[0,1]]  ->  False`,hint:`A valid ordering exists exactly when the graph has no cycle. Kahn's algorithm finds one or proves none exists.`,approaches:[{name:`Kahn's algorithm (BFS topological sort)`,idea:`Repeatedly remove a node with no remaining prerequisites. If you cannot place every node, a cycle blocked you.`,code:`from collections import deque, defaultdict
