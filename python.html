def can_finish(n, prerequisites):
    adj = defaultdict(list)
    indeg = [0] * n
    for course, prereq in prerequisites:
        adj[prereq].append(course)         # prereq -> course
        indeg[course] += 1

    q = deque(i for i in range(n) if indeg[i] == 0)
    placed = 0
    while q:
        u = q.popleft()
        placed += 1
        for v in adj[u]:
            indeg[v] -= 1                  # one prerequisite satisfied
            if indeg[v] == 0:
                q.append(v)
    return placed == n                     # fewer placed => a cycle remains`,time:`O(V + E)`,space:`O(V + E)`,why:`Building the adjacency list and in-degree array is O(V + E). Each vertex is enqueued and dequeued at most once, and each edge is relaxed exactly once when its source is processed — so the main loop is also O(V + E). Space is the adjacency list O(E) plus the in-degree array and queue O(V). The correctness argument: a vertex in a cycle can never reach in-degree 0, because every member of the cycle depends on another member, so any cycle leaves its vertices permanently unplaced.`},{name:`DFS with three colours`,idea:`Colour nodes white (unvisited), grey (on the current path), black (fully explored). An edge into a grey node is a back edge — a cycle.`,code:`def can_finish(n, prerequisites):
    adj = defaultdict(list)
    for course, prereq in prerequisites:
        adj[prereq].append(course)

    WHITE, GREY, BLACK = 0, 1, 2
    colour = [WHITE] * n

    def has_cycle(u):
        colour[u] = GREY                   # on the current recursion path
        for v in adj[u]:
            if colour[v] == GREY:
                return True                # back edge -> cycle
            if colour[v] == WHITE and has_cycle(v):
                return True
        colour[u] = BLACK                  # fully explored, safe
        return False

    return not any(colour[i] == WHITE and has_cycle(i) for i in range(n))`,time:`O(V + E)`,space:`O(V + E)`,why:`Each vertex is coloured grey once and each edge inspected once, giving O(V + E). The three colours are essential: two states cannot distinguish 'already finished, harmless' (black) from 'currently on my path, therefore a cycle' (grey). Using a plain visited set would report false cycles on any diamond-shaped DAG. Recursion depth is O(V), so a deep graph needs the iterative Kahn version in Python.`}],takeaway:`'Can this ordering exist?' ⇒ topological sort. Kahn's gives the order and detects cycles; three-colour DFS detects cycles and gives the reverse order.`},{t:`drill`,lvl:`medium`,title:`Rotting oranges — multi-source BFS`,tag:`LeetCode 994 · asked at Amazon, Microsoft`,stmt:`Each minute, every rotten orange rots its 4-directional fresh neighbours. Return the minutes until none are fresh, or −1 if impossible.`,ex:`[[2,1,1],[1,1,0],[0,1,1]]  ->  4`,hint:`Start the BFS from **all** rotten oranges simultaneously, not one at a time.`,approaches:[{name:`Multi-source BFS`,idea:`Seed the queue with every rotten cell at once. BFS levels then correspond directly to elapsed minutes.`,code:`from collections import deque

def oranges_rotting(grid):
    R, C = len(grid), len(grid[0])
    q = deque()
    fresh = 0
    for r in range(R):
        for c in range(C):
            if grid[r][c] == 2: q.append((r, c))    # ALL sources seeded together
            elif grid[r][c] == 1: fresh += 1

    minutes = 0
    DIRS = ((1,0),(-1,0),(0,1),(0,-1))
    while q and fresh:
        minutes += 1
        for _ in range(len(q)):                     # process exactly one minute
            r, c = q.popleft()
            for dr, dc in DIRS:
                nr, nc = r + dr, c + dc
                if 0 <= nr < R and 0 <= nc < C and grid[nr][nc] == 1:
                    grid[nr][nc] = 2
                    fresh -= 1
                    q.append((nr, nc))
    return -1 if fresh else minutes`,time:`O(R × C)`,space:`O(R × C)`,why:`Every cell enters the queue at most once and each has four neighbour checks, so the work is linear in the number of cells. The multi-source seeding is what makes the level count equal the answer: BFS explores in order of distance from the *nearest* source, so a cell's level is the minute it rots. Running a separate BFS per rotten orange would be O((R×C)²) and would also compute the wrong thing — the minimum over sources, which you would then have to combine manually.`}],takeaway:`BFS from many sources at once gives the distance to the nearest source for every cell in one linear pass. It solves 'nearest exit', 'walls and gates' and '01 matrix' identically.`},{t:`drill`,lvl:`hard`,title:`Word ladder`,tag:`BFS shortest path · LeetCode 127 · asked at Amazon, Meta, LinkedIn`,stmt:"Transform `begin` into `end`, changing one letter at a time, where every intermediate word must be in the dictionary. Return the shortest transformation length, or 0.",ex:`begin="hit", end="cog", words=["hot","dot","dog","lot","log","cog"]  ->  5`,hint:`The words are nodes; an edge joins words differing by one letter. Shortest path in an unweighted graph means BFS.`,approaches:[{name:`Compare all pairs`,idea:`Build the graph explicitly by comparing every pair of words.`,code:`def ladder_length(begin, end, words):
    # build adjacency by comparing every pair: N^2 comparisons of length L
    ...`,time:`O(N² × L)`,space:`O(N²)`,why:`N words compared pairwise, each comparison scanning L characters. When the dictionary is large this dominates everything, and it is entirely avoidable — you never actually need the edge list, only the ability to generate neighbours on demand.`},{name:`BFS with wildcard patterns`,idea:"Never build the graph. For a word of length L, generate its L wildcard patterns (`h*t`, `*ot`, `ho*`) and use a precomputed pattern → words map to find neighbours in O(L).",code:`from collections import deque, defaultdict

def ladder_length(begin, end, words):
    word_set = set(words)
    if end not in word_set:
        return 0
    L = len(begin)

    buckets = defaultdict(list)                  # "h*t" -> ["hit", "hot", ...]
    for w in word_set:
        for i in range(L):
            buckets[w[:i] + "*" + w[i+1:]].append(w)

    q = deque([(begin, 1)])
    seen = {begin}
    while q:
        word, steps = q.popleft()
        for i in range(L):
            pattern = word[:i] + "*" + word[i+1:]
            for nxt in buckets[pattern]:
                if nxt == end:
                    return steps + 1
                if nxt not in seen:
                    seen.add(nxt)
                    q.append((nxt, steps + 1))
            buckets[pattern] = []                # exhausted: never revisit this bucket
    return 0`,time:`O(N × L²)`,space:`O(N × L²)`,why:"Preprocessing builds L patterns per word, each costing O(L) to construct as a string slice — N × L × L. The BFS itself visits each word once and does the same L pattern lookups. **BFS finds the shortest path** because it explores in non-decreasing distance order, so the first time `end` is reached the step count is minimal — this is only valid because every edge has weight 1; weighted edges would require Dijkstra. Clearing each bucket after use is the optimisation that prevents re-scanning large buckets and keeps the bound tight."}],takeaway:`Shortest path in an unweighted graph is always BFS, never DFS. When the graph is implicit, generate neighbours on demand instead of materialising O(N²) edges.`}]}]},{id:`companies`,num:`20`,title:`Company-Wise Questions`,kicker:`What actually gets asked, from service companies to FAANG`,sections:[{id:`co-how`,title:`How company rounds differ`,blurb:`Prepare for the format, not just the topics.`,blocks:[{t:`p`,x:`The same candidate can ace one company and fail another purely on format. Service companies test breadth and output prediction; product companies test one hard algorithm in depth; finance tests precision and edge cases. Aim your practice accordingly.`},{t:`table`,head:[`Company tier`,`Typical rounds`,`What they weight most`],rows:[[`**TCS, Infosys, Wipro, Cognizant, Capgemini, Accenture**`,`Aptitude → MCQ/output prediction → 1–2 easy coding → HR`,`Python syntax accuracy, output prediction, basic loops and strings, OOP definitions`],[`**TCS Digital / Infosys Power Programmer / Wipro Turbo**`,`Advanced coding, 2 problems in 90 min`,`One medium DSA problem, clean code, complexity stated`],[`**Amazon**`,`OA (2 problems + workstyle) → 3–4 onsite loops`,`Arrays, hash maps, BFS/DFS, heaps, plus **Leadership Principles** behavioural — weighted equally`],[`**Microsoft**`,`OA → 3–4 rounds`,`Linked lists, trees, strings, DP; clarity of communication and edge-case handling`],[`**Google**`,`Phone screen → 4–5 onsite`,`Algorithmic depth, optimality, precise complexity analysis, follow-up scaling questions`],[`**Meta**`,`Phone screen → 2 coding + 1 design + 1 behavioural`,`Speed — two medium problems in 35 minutes; graphs, strings, intervals`],[`**Adobe, Salesforce, Oracle, SAP**`,`OA → 2–3 technical`,`Strings, matrices, OOP design, moderate DP`],[`**Goldman Sachs, Morgan Stanley, JPMC**`,`HackerRank → CoderPad → superday`,`Mathematical correctness, overflow and precision, probability, careful edge cases`],[`**Flipkart, Swiggy, Zomato, Uber, Atlassian**`,`OA → 2 DSA → machine coding / low-level design`,`One 90-minute machine-coding round building a working class-based system`]]},{t:`note`,k:`ask`,x:`The single highest-leverage habit for any of these: **state the brute force and its complexity before you write anything**, then say what is wasteful about it, then optimise. Interviewers score the reasoning path, not just the final code.`}]},{id:`co-service`,title:`TCS · Infosys · Wipro · Cognizant · Capgemini`,blurb:`Freshers rounds: output prediction, syntax, and one straightforward program.`,blocks:[{t:`p`,x:`These rounds reward accuracy over cleverness. Most rejections come from output-prediction MCQs about mutability and integer division, not from failing to invent an algorithm.`},{t:`qa`,q:`TCS — What is the difference between a list and a tuple? Which would you use for coordinates?`,a:"A list is mutable, over-allocates memory so appends are cheap, and models a homogeneous sequence. A tuple is immutable, exactly sized, **hashable**, and models a fixed-size record. For coordinates use a tuple: the pair `(x, y)` has fixed arity, should not change accidentally, and being hashable lets it act as a dictionary key — for example a `visited` set in a grid traversal."},{t:`qa`,q:"Infosys — What are `*args` and `**kwargs`?",a:"In a function definition they collect surplus arguments: `*args` gathers extra positional arguments into a **tuple**, `**kwargs` gathers extra keyword arguments into a **dict**. At a call site the same symbols do the reverse — they unpack an iterable or mapping into individual arguments. They let a function accept a variable number of inputs, which is why decorator wrappers are almost always written `def wrapper(*args, **kwargs)`.",code:`def total(*args, **kwargs):
    print(args, kwargs)

total(1, 2, 3, scale=2)      # (1, 2, 3) {'scale': 2}

nums = [1, 2, 3]
total(*nums)                 # unpacking at the call site`},{t:`qa`,q:`Wipro — Explain mutable vs immutable with an example of how it bites you.`,a:"Immutable types (`int`, `str`, `tuple`, `frozenset`) cannot be changed after creation; any 'modification' returns a new object. Mutable types (`list`, `dict`, `set`) can. The classic bite is the mutable default argument: `def f(x, acc=[])` creates the list **once** at definition time, so it accumulates across calls. The fix is `acc=None` with `if acc is None: acc = []` inside.",code:`def add(x, acc=[]):
    acc.append(x)
    return acc

print(add(1))    # [1]
print(add(2))    # [1, 2]  <- same list reused`},{t:`qa`,q:"Cognizant — What is the difference between `/` and `//`? What does `-7 // 2` give?",a:"`/` is true division and always returns a float: `7 / 2 == 3.5`. `//` is floor division and rounds **toward negative infinity**, not toward zero: `7 // 2 == 3` but `-7 // 2 == -4`. This pairs with `%` taking the divisor's sign (`-7 % 3 == 2`) so that `a == (a // b) * b + a % b` always holds — which is what makes `arr[i % n]` work correctly for negative indices."},{t:`qa`,q:"Capgemini — What is `__init__`? Is it a constructor?",a:"It is the **initialiser**, not the constructor. `__new__` is the actual constructor — it allocates and returns the instance. `__init__` then receives that already-created object as `self` and sets up its attributes, and must return `None`. You almost never override `__new__` except for singletons or when subclassing an immutable type like `int` or `tuple`."},{t:`qa`,q:"TCS — What is the difference between `is` and `==`?",a:"`==` compares **values** by calling `__eq__`. `is` compares **identity** — whether both names refer to the same object in memory. Use `is` only for `None`, `True`, `False` and sentinel objects. Small integers (−5 to 256) and compile-time string literals are cached, so `is` can appear to work on them and then fail on larger values — which is exactly why it is unsafe as a value test."},{t:`guess`,code:`a = [1, 2, 3]
b = a
b.append(4)
print(a)

x = "hello"
y = x
y += " world"
print(x)`,out:`[1, 2, 3, 4]
hello`,why:'`b = a` makes both names label the **same list**, and `append` mutates it, so the change is visible through `a`. Strings are immutable, so `y += " world"` builds a brand-new string and rebinds only `y`; `x` still points at the original. This exact pair is the most common output-prediction question in service-company MCQs.'},{t:`guess`,code:`print(10 / 3)
print(10 // 3)
print(10 % 3)
print(-10 // 3)
print(2 ** 3 ** 2)
print(bool(""), bool("0"), bool([]))`,out:`3.3333333333333335
3
1
-4
512
False True False`,why:'`/` always yields a float. `//` floors toward negative infinity, so `-10 // 3` is `-4` rather than `-3`. `**` is right-associative, making it `2 ** 9 = 512`, not `8 ** 2`. And `"0"` is a non-empty string, therefore truthy — only the empty string is falsy.'},{t:`drill`,lvl:`beginner`,title:`Count vowels, consonants, digits and spaces in a string`,tag:`TCS · Infosys · coding round`,stmt:`Given a string, report how many vowels, consonants, digits and spaces it contains.`,ex:`"Hello World 123"  ->  vowels 3, consonants 7, digits 3, spaces 2`,approaches:[{name:`Single pass`,idea:"One loop, classify each character with the string `is*` predicates.",code:`def classify(s):
    counts = {"vowels": 0, "consonants": 0, "digits": 0, "spaces": 0}
    for c in s:
        if c.isalpha():
            if c.lower() in "aeiou":
                counts["vowels"] += 1
            else:
                counts["consonants"] += 1
        elif c.isdigit():
            counts["digits"] += 1
        elif c.isspace():
            counts["spaces"] += 1
    return counts

print(classify("Hello World 123"))`,time:`O(n)`,space:`O(1)`,why:'One pass over n characters with a fixed number of checks each. The `in "aeiou"` test scans at most 5 characters, which is a constant, so it does not add a factor of n. Space is a fixed-size dictionary of four counters regardless of input length.'}],takeaway:"Use `isalpha`, `isdigit`, `isspace` rather than manual ASCII ranges — they handle Unicode and read better."},{t:`drill`,lvl:`beginner`,title:`Check if a number is an Armstrong number`,tag:`Wipro · Capgemini · aptitude coding`,stmt:`An Armstrong number equals the sum of its own digits each raised to the power of the digit count. 153 = 1³ + 5³ + 3³.`,ex:`153  ->  True
154  ->  False`,approaches:[{name:`String digits`,idea:`Convert to a string to get the digits and the count in one step.`,code:`def armstrong(n):
    digits = str(n)
    power = len(digits)
    return n == sum(int(d) ** power for d in digits)

print([n for n in range(1000) if armstrong(n)])`,time:`O(d) where d = number of digits`,space:`O(d)`,why:"The work is proportional to the digit count `d`, which is log₁₀(n) — so in terms of the value it is O(log n), not O(n). This distinction between 'size of the number' and 'value of the number' is exactly what interviewers probe when they ask 'what is the complexity in terms of n?'. Space is the string of digits, O(d)."},{name:`Pure arithmetic`,idea:"Extract digits with `%` and `//` — the answer to give if string conversion is disallowed.",code:`def armstrong(n):
    power, temp = 0, n
    while temp:
        power += 1; temp //= 10

    total, temp = 0, n
    while temp:
        total += (temp % 10) ** power
        temp //= 10
    return total == n`,time:`O(d)`,space:`O(1)`,why:"Two passes over the digits, each removing one digit per iteration via `//= 10`. Space is constant since nothing is stored. Same asymptotics as the string version but with no allocation — the version to write when asked 'without converting to a string'."}],takeaway:"`n % 10` peels the last digit and `n //= 10` drops it. That pair covers palindrome numbers, digit sums, reversing an integer and Armstrong checks."},{t:`drill`,lvl:`easy`,title:`Print a pattern`,tag:`TCS · Infosys · almost guaranteed`,stmt:"Print a right-angled triangle, an inverted one, and a pyramid of `*` for a given height n.",ex:`n = 4 pyramid:
   *
  ***
 *****
*******`,approaches:[{name:`Nested loops`,idea:`The outer loop is the row; the inner expressions compute spaces and stars from the row index.`,code:`def triangle(n):
    for i in range(1, n + 1):
        print("*" * i)

def inverted(n):
    for i in range(n, 0, -1):
        print("*" * i)

def pyramid(n):
    for i in range(1, n + 1):
        print(" " * (n - i) + "*" * (2 * i - 1))

def diamond(n):
    for i in list(range(1, n + 1)) + list(range(n - 1, 0, -1)):
        print(" " * (n - i) + "*" * (2 * i - 1))

pyramid(4)`,time:`O(n²)`,space:`O(n) per line`,why:"Row `i` prints about `2i` characters, so the total output is 1 + 3 + 5 + … + (2n−1) = n² characters — quadratic in the height, and unavoidable because the output itself is quadratic. Using string multiplication rather than an inner character loop keeps the Python-level work O(n) with the repetition happening in C."}],takeaway:"Express the pattern as a formula in the row index — `spaces = n - i`, `stars = 2i - 1` — instead of nesting more loops."}]},{id:`co-amazon`,title:`Amazon · Microsoft`,blurb:`Arrays, hash maps, trees, heaps — plus behavioural weight at Amazon.`,blocks:[{t:`note`,k:`ask`,x:`Amazon scores **Leadership Principles** as heavily as code. Prepare 6–8 STAR stories (Situation, Task, Action, Result) covering ownership, dealing with ambiguity, disagreeing with a decision, and a failure. They will be asked in every round, including the coding ones.`},{t:`drill`,lvl:`medium`,title:`K closest points to the origin`,tag:`Amazon · heap · LeetCode 973`,stmt:"Given points on a plane, return the `k` closest to the origin.",ex:`points = [[1,3],[-2,2]], k = 1  ->  [[-2,2]]`,hint:`You never need the actual distance — the square of it orders identically and avoids a sqrt.`,approaches:[{name:`Sort`,idea:`Sort by squared distance and slice.`,code:`def k_closest(points, k):
    return sorted(points, key=lambda p: p[0]**2 + p[1]**2)[:k]`,time:`O(n log n)`,space:`O(n)`,why:"Perfectly acceptable and often the right production answer. Note we compare **squared** distances: `sqrt` is monotonic, so it preserves ordering while costing a float operation per point and introducing precision risk. Dropping it is a free optimisation interviewers like to hear justified."},{name:`Max-heap of size k`,idea:`Keep only the k best so far. Python's heap is a min-heap, so negate the distances to simulate a max-heap.`,code:`import heapq

def k_closest(points, k):
    h = []
    for x, y in points:
        d = -(x*x + y*y)              # negate -> largest distance sits at the root
        if len(h) < k:
            heapq.heappush(h, (d, x, y))
        elif d > h[0][0]:             # closer than our current worst
            heapq.heapreplace(h, (d, x, y))
    return [[x, y] for _, x, y in h]`,time:`O(n log k)`,space:`O(k)`,why:`Each of n points does at most one O(log k) heap operation. When k ≪ n this beats sorting — 'top 100 of 10 million' gives log 100 ≈ 7 instead of log 10⁷ ≈ 23. It is also the **streaming** answer: only k points are ever held in memory, which is the follow-up when they say the points arrive from a firehose.`},{name:`Quickselect`,idea:`Partition around a pivot until the k smallest occupy the first k slots.`,code:`import random

def k_closest(points, k):
    def dist(p): return p[0]**2 + p[1]**2

    def select(lo, hi):
        if lo >= hi: return
        p = random.randint(lo, hi)
        points[p], points[hi] = points[hi], points[p]
        pivot, store = dist(points[hi]), lo
        for i in range(lo, hi):
            if dist(points[i]) < pivot:
                points[store], points[i] = points[i], points[store]
                store += 1
        points[store], points[hi] = points[hi], points[store]

        if store == k: return
        if store < k: select(store + 1, hi)
        else:         select(lo, store - 1)

    select(0, len(points) - 1)
    return points[:k]`,time:`O(n) average, O(n²) worst`,space:`O(1)`,why:`Each partition is linear in the region size, and we recurse into only one side. With balanced splits the total is n + n/2 + n/4 + … = 2n, hence average O(n) — strictly better than both alternatives. The trade-offs: an adversarial pivot sequence gives O(n²) (mitigated by randomisation), the input array is mutated, and the returned k points are in arbitrary order. Say all three when you present it.`}],takeaway:`'Top k' has three standard answers: sort O(n log n), heap O(n log k), quickselect O(n) average. Pick based on k relative to n and whether the data streams.`},{t:`drill`,lvl:`medium`,title:`Design an LRU cache`,tag:`Amazon · Microsoft · design · LeetCode 146`,stmt:"Implement `get(key)` and `put(key, value)` in **O(1)**, evicting the least recently used entry when capacity is exceeded.",hint:`You need O(1) lookup and O(1) reordering. One structure gives each.`,approaches:[{name:`OrderedDict`,idea:"`OrderedDict` is precisely a hash map plus a doubly linked list, with the reordering exposed as `move_to_end`.",code:`from collections import OrderedDict

class LRUCache:
    def __init__(self, capacity):
        self.cap = capacity
        self.data = OrderedDict()

    def get(self, key):
        if key not in self.data:
            return -1
        self.data.move_to_end(key)          # mark as most recently used
        return self.data[key]

    def put(self, key, value):
        if key in self.data:
            self.data.move_to_end(key)
        self.data[key] = value
        if len(self.data) > self.cap:
            self.data.popitem(last=False)   # evict the oldest`,time:`O(1) per operation`,space:`O(capacity)`,why:"Dict lookup is O(1) average, and `move_to_end` / `popitem` relink a fixed number of node pointers — O(1), not a shift. Space is bounded by the capacity by construction. This is the correct answer, but many interviewers follow with 'now without OrderedDict', because they want to see the structure underneath."},{name:`Hash map + doubly linked list`,idea:`The dict gives O(1) lookup of a node; the linked list gives O(1) removal and re-insertion. Sentinel head and tail nodes remove every edge case.`,code:`class Node:
    __slots__ = ("key", "val", "prev", "next")
    def __init__(self, key=0, val=0):
        self.key, self.val = key, val
        self.prev = self.next = None

class LRUCache:
    def __init__(self, capacity):
        self.cap = capacity
        self.map = {}                       # key -> Node
        self.head = Node()                  # sentinel: most recent side
        self.tail = Node()                  # sentinel: least recent side
        self.head.next, self.tail.prev = self.tail, self.head

    def _remove(self, node):
        node.prev.next = node.next
        node.next.prev = node.prev

    def _add_front(self, node):
        node.next = self.head.next
        node.prev = self.head
        self.head.next.prev = node
        self.head.next = node

    def get(self, key):
        if key not in self.map:
            return -1
        node = self.map[key]
        self._remove(node); self._add_front(node)    # refresh recency
        return node.val

    def put(self, key, value):
        if key in self.map:
            self._remove(self.map[key])
        node = Node(key, value)
        self.map[key] = node
        self._add_front(node)
        if len(self.map) > self.cap:
            lru = self.tail.prev
            self._remove(lru)
            del self.map[lru.key]           # delete from BOTH structures`,time:`O(1) per operation`,space:`O(capacity)`,why:"Every operation is a constant number of pointer rewrites plus one dict access. **Why a doubly linked list?** Removing a node from the middle requires knowing its predecessor; with a singly linked list that costs O(n) to find. **Why sentinels?** They guarantee `node.prev` and `node.next` are never `None`, eliminating every empty-list and single-element branch. Storing `key` inside the node is essential — on eviction you have the node and need to delete the corresponding dict entry."}],takeaway:`'O(1) for everything including ordering' ⇒ hash map + doubly linked list. The same pairing gives LFU (with frequency buckets) and the all-O(1) data structure problem.`},{t:`drill`,lvl:`medium`,title:`Top K frequent elements`,tag:`Amazon · Microsoft · LeetCode 347`,stmt:"Return the `k` most frequent elements in an array.",ex:`[1,1,1,2,2,3], k = 2  ->  [1,2]`,approaches:[{name:`Count then sort`,idea:"Count with a `Counter`, sort by frequency.",code:`from collections import Counter

def top_k(nums, k):
    return [x for x, _ in Counter(nums).most_common(k)]`,time:`O(n log n)`,space:`O(n)`,why:"Counting is O(n); sorting the distinct values is O(d log d) where d ≤ n. `most_common(k)` actually uses `heapq.nlargest` internally when k is given, so it is already O(n log k) — worth knowing so you can say the one-liner is not as naive as it looks."},{name:`Bucket sort — O(n)`,idea:"A frequency can never exceed `n`, so index buckets by frequency directly and read them from the top down. No comparisons needed.",code:`from collections import Counter

def top_k(nums, k):
    counts = Counter(nums)
    buckets = [[] for _ in range(len(nums) + 1)]   # buckets[f] = values with frequency f
    for val, freq in counts.items():
        buckets[freq].append(val)

    out = []
    for freq in range(len(buckets) - 1, 0, -1):    # walk down from the highest frequency
        for val in buckets[freq]:
            out.append(val)
            if len(out) == k:
                return out
    return out`,time:`O(n)`,space:`O(n)`,why:"Counting is O(n), filling the buckets is O(d), and the downward scan touches each bucket index once — n + 1 of them — plus each distinct value once. Total O(n), beating the sorting bound because we are **not comparison sorting**: frequencies are bounded integers in `[1, n]`, so they can be used as array indices directly. That bounded-key observation is the general condition under which counting or bucket sort escapes the n log n lower bound."}],takeaway:`When the sort key is a bounded integer, bucket or counting sort gives O(n). The n log n lower bound only applies to comparison-based sorting.`},{t:`qa`,q:`Microsoft — How would you detect a loop in a linked list without extra memory?`,a:"Floyd's cycle detection. Advance a slow pointer one node and a fast pointer two nodes per step; if they ever meet, a cycle exists. To find the **entry point**, reset one pointer to the head and advance both one step at a time — they meet at the cycle's start. The proof: if `a` is the distance from head to entrance and `b` from entrance to meeting point, then `2(a+b) = a + b + kC`, so `a = kC − b`, meaning both pointers arrive at the entrance simultaneously. O(n) time, O(1) space."},{t:`qa`,q:`Amazon — You have a 10 GB file of URLs and 1 GB of RAM. Find the most frequent URL.`,a:"Hash-partition the file into buckets: read it streaming, compute `hash(url) % 100`, and append each URL to the corresponding one of 100 files. Every occurrence of the same URL lands in the same bucket, so each bucket can be counted independently in memory — roughly 100 MB each. Take the top entry per bucket, then take the max over the 100 candidates. Time is O(n) over two passes; memory is bounded by the bucket size. If a single bucket is still too large because one URL dominates, recurse with a different hash seed."}]},{id:`co-google`,title:`Google · Meta`,blurb:`Depth, optimality, and follow-up scaling questions.`,blocks:[{t:`note`,k:`ask`,x:`Google interviewers almost always ask a follow-up: 'now do it in O(1) space', 'now the input streams', 'now it doesn't fit on one machine'. Reaching a working solution quickly and leaving time for the follow-up matters more than an elegant first attempt.`},{t:`drill`,lvl:`hard`,title:`Median of two sorted arrays`,tag:`Google · Meta · LeetCode 4`,stmt:`Two sorted arrays of sizes m and n. Find the median of their union in **O(log(m+n))**.`,ex:`[1,3] and [2]     ->  2.0
[1,2] and [3,4]   ->  2.5`,hint:`Do not merge. Binary search for the correct **partition point** so that everything on the left is ≤ everything on the right.`,approaches:[{name:`Merge`,idea:`Merge and index the middle.`,code:`def median(a, b):
    merged = sorted(a + b)
    n = len(merged)
    return merged[n//2] if n % 2 else (merged[n//2 - 1] + merged[n//2]) / 2`,time:`O((m+n) log(m+n))`,space:`O(m+n)`,why:`Discards the sortedness entirely. A proper two-pointer merge gets it to O(m+n) time, which is the answer to give as a stepping stone — but the problem explicitly asks for logarithmic, which is the signal that binary search is required.`},{name:`Optimal — binary search on the partition`,idea:"Cut both arrays so the combined left half has exactly half the elements. The cut is correct when `maxLeftA <= minRightB` and `maxLeftB <= minRightA`. Binary search the cut position in the **shorter** array.",code:`def median(a, b):
    if len(a) > len(b):
        a, b = b, a                      # binary search the SHORTER array
    m, n = len(a), len(b)
    half = (m + n + 1) // 2              # size of the combined left half

    lo, hi = 0, m
    while lo <= hi:
        i = (lo + hi) // 2               # take i elements from a
        j = half - i                     # and j from b

        left_a  = a[i-1] if i > 0 else float("-inf")
        right_a = a[i]   if i < m else float("inf")
        left_b  = b[j-1] if j > 0 else float("-inf")
        right_b = b[j]   if j < n else float("inf")

        if left_a <= right_b and left_b <= right_a:      # correct partition
            if (m + n) % 2:
                return max(left_a, left_b)               # odd -> left half's max
            return (max(left_a, left_b) + min(right_a, right_b)) / 2
        elif left_a > right_b:
            hi = i - 1                   # took too many from a
        else:
            lo = i + 1                   # took too few from a`,time:`O(log(min(m, n)))`,space:`O(1)`,why:"We binary search over the number of elements taken from the shorter array — a range of size min(m,n) — halving each iteration, so log(min(m,n)) steps with O(1) work each. **Why searching the shorter array is safe and better:** `j = half - i` is determined by `i`, so one variable fully specifies the cut, and bounding the search by the smaller size tightens the log. The ±infinity sentinels handle empty partitions without special cases. This is one of the hardest binary-search problems precisely because the search space is a *partition index*, not a value in the array — recognising that reframing is the whole insight."}],takeaway:`Binary search does not require searching for a value. Here we search for a partition; in 'Koko eating bananas' we search the answer space. Anything monotone is fair game.`},{t:`drill`,lvl:`medium`,title:`Word break`,tag:`Google · Meta · DP · LeetCode 139`,stmt:"Can the string `s` be segmented into a sequence of one or more dictionary words?",ex:`s = "leetcode", dict = ["leet","code"]  ->  True
s = "catsandog", dict = ["cats","dog","sand","and","cat"]  ->  False`,approaches:[{name:`Plain recursion`,idea:`Try every prefix that is a word and recurse on the remainder.`,code:`def word_break(s, words):
    word_set = set(words)
    def solve(start):
        if start == len(s):
            return True
        return any(s[start:end] in word_set and solve(end)
                   for end in range(start + 1, len(s) + 1))
    return solve(0)`,time:`O(2ⁿ)`,space:`O(n)`,why:'Each position branches on every possible split point, and the same suffix is re-solved through many different prefix paths — exponential. The `"aaaa...aab"` family of inputs is the standard TLE case.'},{name:`Memoised`,idea:`The answer for a start index never changes. Cache it.`,code:`from functools import lru_cache

def word_break(s, words):
    word_set = set(words)
    max_len = max(map(len, words), default=0)

    @lru_cache(maxsize=None)
    def solve(start):
        if start == len(s):
            return True
        for end in range(start + 1, min(start + max_len, len(s)) + 1):
            if s[start:end] in word_set and solve(end):
                return True
        return False

    return solve(0)`,time:`O(n × L)`,space:`O(n)`,why:"There are n states (one per start index) and the transition tries at most `max_len` split points, each costing O(L) to slice and hash the substring. Capping `end` at `start + max_len` is the optimisation people miss: without it the transition is O(n) and the total becomes O(n²·L) for no reason, since no dictionary word can be longer than the longest one."},{name:`Bottom-up`,idea:"`dp[i]` = can `s[:i]` be segmented. Iterative, no recursion limit.",code:`def word_break(s, words):
    word_set = set(words)
    n = len(s)
    dp = [False] * (n + 1)
    dp[0] = True                       # the empty prefix is always segmentable

    for i in range(1, n + 1):
        for j in range(i):
            if dp[j] and s[j:i] in word_set:
                dp[i] = True
                break                  # one valid split is enough
    return dp[n]`,time:`O(n² × L)`,space:`O(n)`,why:"The double loop gives n² pairs and each substring slice-and-hash costs O(L) where L is the slice length. Adding the `max_len` cap to the inner loop brings it to O(n × L). Space is the boolean array O(n). A trie over the dictionary is the further optimisation — it lets you walk forward character by character without slicing at all."}],takeaway:`'Can this be split into valid pieces' ⇒ DP over prefix positions. Bounding the transition by the longest dictionary word is a free order-of-magnitude win.`},{t:`drill`,lvl:`medium`,title:`Valid palindrome after deleting at most one character`,tag:`Meta · very frequently asked · LeetCode 680`,stmt:"Return `True` if the string can become a palindrome by removing at most one character.",ex:`"abca"  ->  True   (remove 'c')
"abc"   ->  False`,hint:`Run the normal two-pointer check. On the first mismatch you have exactly two candidate repairs.`,approaches:[{name:`Two pointers with one allowed skip`,idea:`Converge from both ends. At the first mismatch, test whether skipping the left character or the right one leaves a palindrome.`,code:`def valid_palindrome(s):
    def is_pal(i, j):
        while i < j:
            if s[i] != s[j]:
                return False
            i += 1; j -= 1
        return True

    i, j = 0, len(s) - 1
    while i < j:
        if s[i] != s[j]:
            # exactly two repairs are possible; try both
            return is_pal(i + 1, j) or is_pal(i, j - 1)
        i += 1; j -= 1
    return True`,time:`O(n)`,space:`O(1)`,why:"The main loop is a single converging pass, O(n). On a mismatch we call the helper at most twice, and each helper call is itself at most O(n) — but this happens **only once** for the whole string, because the helper does not allow further skips. So the total is bounded by 3n = O(n), not O(n²). Space is O(1): only indices, no slicing. Writing `s[i+1:j+1] == s[i+1:j+1][::-1]` would be O(n) space per check — a common and avoidable regression."}],takeaway:`'At most one exception allowed' ⇒ run the strict check and branch once at the first violation. It does not need DP.`},{t:`qa`,q:`Google — Design a system to find the top 10 trending search queries in the last hour.`,a:`Sketch the layers. **Ingestion**: queries stream in and are sharded by hash of the query string so all occurrences of one query reach the same node. **Per-shard counting**: use a sliding window of one-minute buckets — 60 counters per query, incrementing the current bucket and dropping the expired one, so 'last hour' is a rolling sum. For unbounded query cardinality, use Count-Min Sketch for approximate counts in fixed memory, plus a min-heap of size 10 per shard. **Aggregation**: each shard emits its top 10 (or top 100 for accuracy) every minute; a coordinator merges the shard heaps into a global top 10. Trade-offs to name explicitly: exact counts need memory proportional to distinct queries; the sketch trades a bounded error for O(1) memory; and a heavy-hitter query can hot-spot a shard, which you mitigate by salting its key.`},{t:`qa`,q:`Meta — Why would you use BFS instead of DFS, and vice versa?`,a:`**BFS** explores in non-decreasing distance order, so it finds the shortest path in an **unweighted** graph — DFS does not, and no amount of patching makes it. BFS's memory is the frontier width, which can be huge in a wide graph. **DFS** uses memory proportional to depth, which is far smaller in wide graphs, and it is the natural fit for problems about paths, cycles, topological order, and connected components where distance is irrelevant. Practical Python note: DFS written recursively hits the 1000-frame limit, so deep graphs need an explicit stack.`}]},{id:`co-finance`,title:`Goldman Sachs · Morgan Stanley · JPMC`,blurb:`Precision, overflow, probability, and careful edge cases.`,blocks:[{t:`note`,k:`ask`,x:`Finance rounds punish sloppiness with numbers. Expect questions about floating-point money, integer overflow (a non-issue in Python — say so and explain why it matters in C++), and precise off-by-one boundaries.`},{t:`qa`,q:`Goldman Sachs — Why should you never use float for money, and what do you use instead?`,a:"IEEE-754 doubles are binary, and 0.1 has no exact binary representation — so `0.1 + 0.2 == 0.30000000000000004`. Errors compound across many operations, and financial reconciliation requires exactness. Use `decimal.Decimal` constructed **from strings** (`Decimal(\"0.1\")`, never `Decimal(0.1)`, which has already lost the precision), and set the rounding mode explicitly, since Python's built-in `round` uses banker's rounding (round-half-to-even) while finance usually wants ROUND_HALF_UP. The alternative is to store integer minor units — cents — and divide only at display time.",code:`from decimal import Decimal, ROUND_HALF_UP

print(0.1 + 0.2 == 0.3)                                # False
print(Decimal("0.1") + Decimal("0.2") == Decimal("0.3"))  # True
print(Decimal("2.675").quantize(Decimal("0.01"), rounding=ROUND_HALF_UP))  # 2.68
print(round(2.675, 2))                                 # 2.67  <- banker's + float error`},{t:`qa`,q:`Morgan Stanley — Does integer overflow exist in Python?`,a:"No. Python's `int` is arbitrary precision — it grows to whatever memory allows, so `2 ** 1000` is exact and there is no wraparound. That removes a whole class of bugs, but it has two consequences worth stating: arithmetic on huge integers is no longer O(1) (multiplication cost grows with digit count), and if you are porting an algorithm that *relies* on 32-bit wraparound — some hash functions, or `mid = (lo + hi) // 2` overflow workarounds — you must mask explicitly with `& 0xFFFFFFFF`."},{t:`drill`,lvl:`medium`,title:`Stock span problem`,tag:`Goldman Sachs · monotonic stack`,stmt:`For each day, the span is the number of consecutive days up to and including today where the price was less than or equal to today's price.`,ex:`[100,80,60,70,60,75,85]  ->  [1,1,1,2,1,4,6]`,approaches:[{name:`Brute force`,idea:`Walk backwards from each day while prices are lower.`,code:`def spans(prices):
    out = []
    for i in range(len(prices)):
        span = 1
        j = i - 1
        while j >= 0 and prices[j] <= prices[i]:
            span += 1; j -= 1
        out.append(span)
    return out`,time:`O(n²)`,space:`O(1)`,why:`A non-increasing price series makes every day walk back to the start. The waste is that the same low-price stretch is re-traversed by each subsequent day.`},{name:`Optimal — monotonic decreasing stack`,idea:`Keep indices of days with strictly higher prices. Popping a lower day lets you jump over its entire span in one step.`,code:`def spans(prices):
    out = []
    stack = []                          # indices, prices strictly decreasing
    for i, p in enumerate(prices):
        while stack and prices[stack[-1]] <= p:
            stack.pop()                 # these days are absorbed into i's span
        out.append(i + 1 if not stack else i - stack[-1])
        stack.append(i)
    return out`,time:`O(n)`,space:`O(n)`,why:"Each index is pushed once and popped at most once, so the total stack work across the whole run is at most 2n — amortised linear despite the inner `while`. The insight that removes the rescan: once a day is popped because a higher price arrived, it can never be the answer's boundary for any future day, so it is safe to discard forever. When the stack is empty, every previous price was lower, so the span is `i + 1`."}],takeaway:`This is 'previous greater element' in disguise. Recognising the disguise is the skill — the monotonic stack template is unchanged.`},{t:`qa`,q:`JPMC — You have 8 balls, one is heavier. Find it in 2 weighings on a balance scale.`,a:`Split into groups of 3, 3 and 2. **Weigh 1:** the two groups of 3 against each other. If they balance, the heavy ball is in the group of 2, and weighing those two against each other identifies it. If one side is heavier, the heavy ball is among those 3. **Weigh 2:** take any 2 of those 3 and weigh them; if one is heavier it is the answer, if they balance it is the third. The general principle is that a three-outcome balance gives log₃ information per weighing, so k weighings distinguish up to 3ᵏ items — 2 weighings handle up to 9 balls, so 8 is comfortable.`}]},{id:`co-product`,title:`Flipkart · Uber · Swiggy · Atlassian`,blurb:`Machine coding: build a small working system in 90 minutes.`,blocks:[{t:`p`,x:`Machine coding rounds are not algorithm rounds. You are judged on **class design, separation of concerns, extensibility and working code** — not on complexity. A brute-force lookup inside a clean design scores better than an optimal algorithm inside a single 300-line function.`},{t:`ul`,x:["**Model the entities first.** Nouns become classes: `User`, `Ride`, `Driver`, `Booking`. Ten minutes of design saves an hour of rework.","**Use an interface for anything with variants.** Pricing strategies, matching strategies and notification channels should be abstract base classes, not `if` chains — extensibility is explicitly scored.",`**Keep storage behind a repository class.** An in-memory dict is fine; what matters is that swapping it for a database would touch one file.`,"**No frameworks, no database, no UI.** In-memory only, with a `main()` that demonstrates the flows.",`**Write it to run.** A working subset beats a complete design that does not execute.`]},{t:`drill`,lvl:`medium`,title:`Design a parking lot`,tag:`Flipkart · Uber · machine coding`,stmt:`Multiple floors, multiple vehicle sizes, ticket issuing, fee calculation on exit. Show the class design.`,hint:`Where does the fee calculation belong? Not inside ParkingLot — make it swappable.`,approaches:[{name:`Class design`,idea:`Separate the domain entities from the allocation policy and the pricing policy, so each can change independently.`,code:`from abc import ABC, abstractmethod
from dataclasses import dataclass, field
from datetime import datetime
from enum import Enum
import itertools

class VehicleType(Enum):
    BIKE, CAR, TRUCK = 1, 2, 3

@dataclass(frozen=True)
class Vehicle:
    plate: str
    kind: VehicleType

@dataclass
class Spot:
    spot_id: str
    floor: int
    kind: VehicleType
    occupied_by: str | None = None

    @property
    def is_free(self) -> bool:
        return self.occupied_by is None

@dataclass
class Ticket:
    ticket_id: str
    plate: str
    spot_id: str
    entry: datetime = field(default_factory=datetime.now)

# ---- swappable policies -------------------------------------------------
class PricingStrategy(ABC):
    @abstractmethod
    def fee(self, ticket: Ticket, exit_time: datetime, kind: VehicleType) -> float: ...

class HourlyPricing(PricingStrategy):
    RATES = {VehicleType.BIKE: 10, VehicleType.CAR: 20, VehicleType.TRUCK: 40}
    def fee(self, ticket, exit_time, kind):
        hours = max(1, int((exit_time - ticket.entry).total_seconds() // 3600) + 1)
        return hours * self.RATES[kind]

class SpotAllocator(ABC):
    @abstractmethod
    def find(self, spots: list[Spot], kind: VehicleType) -> Spot | None: ...

class NearestFirst(SpotAllocator):
    def find(self, spots, kind):
        return next((s for s in spots if s.is_free and s.kind == kind), None)

# ---- the lot orchestrates, it does not compute policy -------------------
class ParkingLot:
    def __init__(self, spots, allocator: SpotAllocator, pricing: PricingStrategy):
        self.spots = {s.spot_id: s for s in spots}
        self.allocator = allocator
        self.pricing = pricing
        self.active: dict[str, Ticket] = {}
        self._ids = itertools.count(1)

    def park(self, vehicle: Vehicle) -> Ticket:
        spot = self.allocator.find(list(self.spots.values()), vehicle.kind)
        if spot is None:
            raise ValueError(f"no free spot for {vehicle.kind.name}")
        spot.occupied_by = vehicle.plate
        ticket = Ticket(f"T{next(self._ids)}", vehicle.plate, spot.spot_id)
        self.active[ticket.ticket_id] = ticket
        return ticket

    def unpark(self, ticket_id: str) -> float:
        ticket = self.active.pop(ticket_id, None)
        if ticket is None:
            raise ValueError("unknown or already-used ticket")
        spot = self.spots[ticket.spot_id]
        fee = self.pricing.fee(ticket, datetime.now(), spot.kind)
        spot.occupied_by = None
        return fee`,time:`park/unpark O(n) with a list scan, O(1) with per-type free lists`,space:`O(number of spots)`,why:"The complexity here is deliberately secondary — but be ready to improve it. Scanning all spots is O(n); keeping a `dict[VehicleType, deque[Spot]]` of free spots per type makes both allocation and release O(1), which is the natural follow-up. What the round actually scores is the **separation**: `PricingStrategy` and `SpotAllocator` are abstract, so adding weekend rates or a 'nearest to lift' policy means writing one new class, not editing `ParkingLot`. That is the open/closed principle, and articulating it is the point of the exercise."}],takeaway:`In machine coding, put every rule that might change behind an interface. Interviewers test extensibility by asking 'now add X' at the end — a good design absorbs it in one class.`},{t:`qa`,q:`Uber — How would you design a rate limiter?`,a:"Four standard algorithms, each with a different trade. **Fixed window**: a counter per key per interval — trivial, but allows a 2× burst at the boundary. **Sliding window log**: store timestamps in a sorted structure and evict expired ones — exact, but O(requests) memory per key. **Sliding window counter**: interpolate between the previous and current fixed windows — near-exact with O(1) memory, and the usual production choice. **Token bucket**: refill tokens at a fixed rate up to a cap; each request consumes one — allows controlled bursts, which is why API gateways prefer it. For a distributed system, hold the counters in Redis and use an atomic `INCR` with `EXPIRE`, or a Lua script for the token bucket, so concurrent nodes cannot race.",code:`import time
from collections import deque

class SlidingWindowLimiter:
    def __init__(self, limit, window_seconds):
        self.limit, self.window = limit, window_seconds
        self.hits = {}                     # key -> deque of timestamps

    def allow(self, key):
        now = time.time()
        q = self.hits.setdefault(key, deque())
        while q and q[0] <= now - self.window:
            q.popleft()                    # evict expired
        if len(q) < self.limit:
            q.append(now)
            return True
        return False`},{t:`qa`,q:`Atlassian — What is the difference between concurrency and parallelism in Python?`,a:"**Concurrency** is dealing with many tasks at once by interleaving them; **parallelism** is executing them simultaneously on multiple cores. Because of the GIL, CPython threads give concurrency but not parallelism for pure-Python CPU work — only one thread executes bytecode at a time. `asyncio` is concurrency without threads: a single thread cooperatively switching at `await` points, which is ideal for thousands of I/O operations. True parallelism requires `multiprocessing` (separate interpreters, each with its own GIL) or C extensions like NumPy that release the GIL during long operations."}]},{id:`co-plan`,title:`A four-week preparation plan`,blocks:[{t:`p`,x:`Practice without structure produces the illusion of progress. This ordering front-loads the patterns that appear most often, and each week ends with timed practice so the format stops being a surprise.`},{t:`table`,head:[`Week`,`Focus`,`From this handbook`],rows:[[`**1 — Foundations**`,`Python internals, complexity reasoning, arrays and strings`,`Chapters 01–05, 14, 15`],[`**2 — Core patterns**`,`Hashing, two pointers, sliding window, binary search, sorting, greedy`,`Chapters 16, 17`],[`**3 — Recursion and structures**`,`Backtracking, DP ladder, linked lists, stacks, trees, graphs`,`Chapters 18, 19`],[`**4 — Interview simulation**`,`Timed mocks, output prediction, company sets, behavioural stories`,`Chapters 10–12, 20`]]},{t:`ul`,x:[`**Solve before you read.** Open each drill's statement, spend 15–20 minutes, then reveal. A solution you read is forgotten; a solution you struggled toward is not.`,`**Always write the brute force first**, even when you already know the optimal one. That is the habit the interview rewards.`,`**Say the complexity out loud** before checking. If you cannot derive it, re-read chapter 14 rather than memorising the answer.`,`**Redo anything you failed after three days**, then again after a week. Spaced repetition is what converts recognition into recall.`,`**Time yourself from week 2.** Easy in 15 minutes, medium in 25–30, hard in 40–45. Running out of time is the most common failure mode and it is trainable.`,`**Write on a plain editor or paper.** Autocomplete and a linter will not be there.`,`**Prepare 6–8 STAR stories.** At Amazon and Microsoft the behavioural round can sink an otherwise strong loop.`]},{t:`note`,k:`tip`,x:`If you only have one week: chapter 14 (complexity), the six patterns in chapters 16–17, the DP ladder in chapter 18, and the tricky-output drills in chapter 11. Those cover the overwhelming majority of what gets asked.`}]}]}];function f(e){switch(e.t){case`p`:case`h`:return e.x;case`code`:return e.x+` `+(e.cap||``);case`note`:return e.x+` `+(e.title||``);case`ul`:return e.x.join(` `);case`table`:return e.head.join(` `)+` `+e.rows.map(e=>e.join(` `)).join(` `);case`qa`:return e.q+` `+e.a+` `+(e.code||``);case`guess`:return e.code+` `+e.why;case`prob`:return e.title+` `+e.stmt+` `+e.code+` `+(e.note||``);case`drill`:return e.title+` `+(e.tag||``)+` `+e.stmt+` `+(e.hint||``)+` `+(e.takeaway||``)+` `+e.approaches.map(e=>e.name+` `+e.idea+` `+e.code+` `+e.time+` `+e.why).join(` `);default:return``}}var p=d.flatMap(e=>e.sections.map(t=>({chapterId:e.id,chapterNum:e.num,chapterTitle:e.title,sectionId:t.id,sectionTitle:t.title,haystack:(t.title+` `+(t.blurb||``)+` `+t.blocks.map(f).join(` `)).toLowerCase()}))),m=(()=>{let e=0,t=0,n=0,r=0,i=0,a=0,o=0;for(let s of d)for(let c of s.sections){e++;for(let e of c.blocks)e.t===`code`&&t++,e.t===`qa`&&n++,e.t===`guess`&&r++,e.t===`prob`&&i++,e.t===`drill`&&(a++,o+=e.approaches.length,t+=e.approaches.length)}return{chapters:d.length,sections:e,code:t,qa:n,guess:r,prob:i,drill:a,solutions:o}})(),h=new Set(`False.None.True.and.as.assert.async.await.break.class.continue.def.del.elif.else.except.finally.for.from.global.if.import.in.is.lambda.nonlocal.not.or.pass.raise.return.
