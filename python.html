ble_strictMode&&(n=!0),t.identifierPrefix!==void 0&&(r=t.identifierPrefix),t.onUncaughtError!==void 0&&(i=t.onUncaughtError),t.onCaughtError!==void 0&&(a=t.onCaughtError),t.onRecoverableError!==void 0&&(o=t.onRecoverableError)),t=ep(e,1,!1,null,null,n,r,null,i,a,o,Pp),e[_t]=t.current,Sd(e),new Fp(t)}})),c=e(((e,t)=>{function n(){if(!(typeof __REACT_DEVTOOLS_GLOBAL_HOOK__>`u`||typeof __REACT_DEVTOOLS_GLOBAL_HOOK__.checkDCE!=`function`))try{__REACT_DEVTOOLS_GLOBAL_HOOK__.checkDCE(n)}catch(e){console.error(e)}}n(),t.exports=s()})),l=n(),u=c(),d=[{id:`runtime`,num:`01`,title:`How Python Runs`,kicker:`Source text to bytecode to the evaluation loop`,sections:[{id:`compiled-or-interpreted`,title:`Compiled or interpreted?`,blurb:`Both. The question is malformed, and interviewers love it.`,blocks:[{t:`p`,x:"Python is **compiled to bytecode, then interpreted**. When you run `python script.py`, CPython does not hand your text to the CPU. It runs a four-stage pipeline first, and only the last stage looks anything like 'interpreting'."},{t:`ul`,ord:!0,x:["**Tokenizer (lexer)** — turns the character stream into tokens: `NAME`, `NUMBER`, `OP`, `NEWLINE`, `INDENT`, `DEDENT`. This is where indentation becomes real syntax.",`**Parser** — builds an Abstract Syntax Tree (AST) from the tokens using a PEG parser (since Python 3.9). Syntax errors are raised here, before a single line executes.`,`**Compiler** — walks the AST, builds a control-flow graph, and emits **bytecode**: a flat sequence of instructions for a stack machine. The result is packed into a *code object*.`,"**PVM (Python Virtual Machine)** — the evaluation loop in `ceval.c` reads bytecode instructions one at a time and executes them against a value stack. This is the interpreter."]},{t:`note`,k:`ask`,x:"'Is Python compiled or interpreted?' The answer that scores: *Python source is compiled to bytecode, and that bytecode is interpreted by the CPython virtual machine. The compilation step is implicit and cached in `__pycache__`, which is why people call it interpreted.*"},{t:`p`,x:`Crucially, **Python the language** is a specification. **CPython** is the reference implementation written in C. Other implementations make entirely different choices, and the compiled-vs-interpreted answer changes with them.`},{t:`table`,head:[`Implementation`,`Written in`,`Execution strategy`],rows:[[`CPython`,`C`,"Compile to bytecode → interpret in a loop. The default `python`."],[`PyPy`,`RPython`,`Tracing JIT: hot loops compile to machine code. Often 5–20× faster.`],[`Jython`,`Java`,`Compiles to JVM bytecode. No GIL.`],[`IronPython`,`C#`,`Compiles to .NET CIL.`],[`MicroPython`,`C`,`Bytecode VM trimmed for microcontrollers.`],[`Cython`,`C`,`Not an implementation — a compiler from annotated Python to C.`]]}]},{id:`bytecode`,title:`Reading the bytecode`,blurb:`The dis module makes every abstraction in this handbook visible.`,blocks:[{t:`p`,x:"`dis` disassembles a function into the instruction stream the VM actually walks. It is the single best debugging tool for 'why is this slower' and 'what does this syntax really do'."},{t:`code`,x:`import dis

def add(a, b):
    total = a + b
    return total

dis.dis(add)`,out:`  2           LOAD_FAST                a
              LOAD_FAST                b
              BINARY_OP                0 (+)
              STORE_FAST               total

  3           LOAD_FAST                total
              RETURN_VALUE`,cap:`Exact opcode names and formatting vary between versions; the shape does not.`},{t:`p`,x:"Read it as a stack machine. `LOAD_FAST a` pushes the value of local `a`. `BINARY_OP +` pops two, pushes the sum. `STORE_FAST total` pops into a local slot. `RETURN_VALUE` pops and returns."},{t:`h`,x:`Locals are array slots, globals are dict lookups`},{t:`p`,x:`This is the mechanical reason local variable access is faster than global access, a classic optimisation question.`},{t:`code`,x:`import dis

x = 10                 # module-level global

def uses_global():
    return x

def uses_local():
    x = 10
    return x

dis.dis(uses_global)   # -> LOAD_GLOBAL  x
dis.dis(uses_local)    # -> LOAD_FAST    x`,cap:`LOAD_FAST indexes a C array. LOAD_GLOBAL hashes a string and probes two dicts (globals, then builtins).`},{t:`note`,k:`perf`,x:"The classic micro-optimisation `_len = len` inside a hot loop turns a `LOAD_GLOBAL` into a `LOAD_FAST`. In modern CPython (3.11+) globals are cached inline, so the win is much smaller than it used to be — measure before you contort your code."},{t:`h`,x:`The compiler folds constants`},{t:`code`,x:`import dis
dis.dis(compile("x = 2 * 60 * 60", "<s>", "exec"))
# LOAD_CONST 7200   <- multiplication already done at compile time`,cap:`Write 24 * 60 * 60 for readability; it costs nothing at runtime.`}]},{id:`pyc`,title:`Code objects and __pycache__`,blocks:[{t:`p`,x:`The compiler's output is a **code object** — an immutable object holding bytecode plus everything needed to run it. Every function, every class body, every module has one.`},{t:`code`,x:`def greet(name, punct="!"):
    msg = "hi " + name
    return msg + punct

c = greet.__code__
print(c.co_name)         # greet
print(c.co_varnames)     # ('name', 'punct', 'msg')
print(c.co_consts)       # (None, 'hi ')
print(c.co_argcount)     # 2
print(c.co_names)        # ()  names looked up globally
print(type(c.co_code))   # <class 'bytes'>  the raw instructions`},{t:`table`,head:[`Attribute`,`Holds`],rows:[["`co_code`","Raw bytecode as a `bytes` object"],["`co_consts`",`Constant pool: literals, docstring, nested code objects`],["`co_names`",`Global/attribute names referenced`],["`co_varnames`",`Local variable names, in slot order`],["`co_freevars` / `co_cellvars`",`Closure plumbing (see Closures)`],["`co_flags`","Bit flags: is it a generator, does it use `*args`, etc."]]},{t:`h`,x:`Why __pycache__ exists`},{t:`p`,x:"Compiling costs time. When you **import** a module, CPython caches the marshalled code object as a `.pyc` file under `__pycache__/module.cpython-312.pyc`. Next import, if the source timestamp and size still match the header, the parse and compile stages are skipped entirely."},{t:`ul`,x:[`The script you run directly is **never** cached — only imported modules are.`,"The interpreter tag (`cpython-312`) is in the filename, so caches from different versions coexist.","`.pyc` is not obfuscation or protection. `dis` reads it back happily.","`python -B` or `PYTHONDONTWRITEBYTECODE=1` suppresses writing them."]},{t:`note`,k:`gotcha`,x:"A stale `.pyc` whose source file has been deleted used to be importable and caused ghost modules. Since PEP 3147 the cache lives in `__pycache__/` and is ignored without its source, which fixed that class of bug."}]},{id:`gil`,title:`The GIL, threads, and processes`,blurb:`The most-asked systems question about Python.`,blocks:[{t:`p`,x:`The **Global Interpreter Lock** is a mutex inside CPython that allows only one thread to execute Python bytecode at a time. It exists because CPython's memory management — specifically reference counting — is not thread-safe, and one coarse lock is far cheaper than fine-grained locking on every object.`},{t:`ul`,x:[`**CPU-bound threads do not scale.** Four threads doing arithmetic run no faster than one, and often slower due to lock contention.`,"**I/O-bound threads scale fine.** The GIL is released around blocking calls: sockets, disk reads, `time.sleep`, subprocess waits.",`**C extensions may release it.** NumPy drops the GIL for big array operations, so numeric code can genuinely parallelise.`,`**It is a CPython detail**, not a language feature. Jython and IronPython have no GIL.`]},{t:`code`,x:`import threading, multiprocessing, time

def burn(n):
    while n > 0:
        n -= 1

N = 20_000_000

t0 = time.perf_counter()
ts = [threading.Thread(target=burn, args=(N,)) for _ in range(4)]
[t.start() for t in ts]; [t.join() for t in ts]
print("threads   ", round(time.perf_counter() - t0, 2), "s")

if __name__ == "__main__":
    t0 = time.perf_counter()
    ps = [multiprocessing.Process(target=burn, args=(N,)) for _ in range(4)]
    [p.start() for p in ps]; [p.join() for p in ps]
    print("processes ", round(time.perf_counter() - t0, 2), "s")`,cap:`Threads show ~no speedup on CPU work. Processes scale with cores because each has its own interpreter and its own GIL.`},{t:`table`,head:[`Workload`,`Use`,`Why`],rows:[[`CPU-bound pure Python`,"`multiprocessing` / `ProcessPoolExecutor`",`Separate interpreters sidestep the GIL`],[`Network / disk I/O, many connections`,"`asyncio`",`One thread, no context-switch cost, thousands of tasks`],[`Blocking library calls, modest concurrency`,"`threading` / `ThreadPoolExecutor`",`GIL is released during the blocking call`],[`Numeric arrays`,`NumPy, and stay single-process`,`The heavy loops are C and release the GIL`]]},{t:`note`,k:`tip`,x:`Python 3.13 ships an experimental **free-threaded** build (PEP 703) with the GIL removed, selectable at build time. It is opt-in and single-thread performance still lags. Mentioning it shows you follow the language, but do not claim 'the GIL is gone'.`}]},{id:`memory`,title:`Memory: refcounting and the cycle collector`,blocks:[{t:`p`,x:`CPython uses **reference counting as the primary mechanism**, plus a **generational cycle collector** as a backstop. Every object header carries a count of how many references point at it; when the count hits zero the object is freed immediately.`},{t:`code`,x:`import sys

a = []
print(sys.getrefcount(a))   # 2  -> 'a' plus the temporary argument reference
b = a
print(sys.getrefcount(a))   # 3
del b

 f(lst, n):
    lst.append(1)     # visible outside
    lst = [99]        # NOT visible outside
    n += 1            # NOT visible outside

xs, k = [], 0
f(xs, k)
print(xs, k)          # [1] 0`},{t:`qa`,q:"Explain `is` vs `==`.",a:"`==` compares **values** via `__eq__`. `is` compares **identity** — whether two names point at the same object. Use `is` only for `None`, `True`, `False` and sentinel objects. Small integers (−5..256) and compile-time string literals are cached, so `is` can accidentally look correct on them, which makes it a dangerous habit."},{t:`qa`,q:`What is the difference between a shallow and a deep copy?`,a:"A shallow copy (`list(x)`, `x[:]`, `copy.copy`) makes a new outer container that still references the **same** inner objects. A deep copy (`copy.deepcopy`) recursively duplicates everything, handling cycles via a memo dict. Nested mutable structures are where the difference bites."},{t:`qa`,q:"What are `*args` and `**kwargs`?",a:"In a definition they collect extra arguments: `*args` gathers surplus positionals into a **tuple**, `**kwargs` gathers surplus keywords into a **dict**. At a call site the same symbols mean the opposite — they *unpack* an iterable or mapping into arguments. Parameters after a bare `*` are keyword-only; parameters before a `/` are positional-only."},{t:`qa`,q:`What is a decorator?`,a:"A callable that takes a function and returns a replacement. `@deco` above `def f` is exactly `f = deco(f)`. The wrapper usually takes `*args, **kwargs` so it works with any signature, and should carry `@functools.wraps(func)` to preserve `__name__`, `__doc__` and the signature. A decorator that takes arguments is a factory: three nested levels."},{t:`qa`,q:`What is a closure, and what is late binding?`,a:"A closure is a nested function that keeps access to names from its enclosing scope after that scope has returned; CPython stores them in cells (`func.__closure__`). **Late binding** means the free variable is looked up when the closure is *called*, not when it is defined — which is why `[lambda: i for i in range(3)]` yields three functions that all return 2. Fix with a default argument: `lambda i=i: i`."},{t:`qa`,q:`Explain the LEGB rule.`,a:"Name resolution order: **Local**, **Enclosing** function scopes, **Global** (module), **Builtins**. Assignment anywhere in a function makes the name local for the whole body — even before that line — which is why reading it first raises `UnboundLocalError`. Use `global` to rebind a module name and `nonlocal` to rebind the nearest enclosing function's name."},{t:`qa`,q:'What does `if __name__ == "__main__":` do?',a:'`__name__` is `"__main__"` when a file is run directly and the module\'s own name when it is imported. The guard lets a file be both an executable script and an importable library. It is also load-bearing for `multiprocessing` on Windows/macOS, where child processes re-import the module and would otherwise spawn recursively.'}]},{id:`qa-data`,title:`Data structures`,blocks:[{t:`qa`,q:`list vs tuple — when do you use each?`,a:"`list` is mutable, over-allocates for cheap appends, and models a homogeneous sequence. `tuple` is immutable, exactly sized, **hashable** (so it can be a dict key or set member), faster to construct, and models a fixed-size record. Immutability also serves as a correctness guarantee that nobody downstream will modify your data."},{t:`qa`,q:`How is a Python dict implemented, and why is lookup O(1)?`,a:"It is an open-addressing hash table. `hash(key)` selects a slot; collisions are resolved by probing. Since 3.6 it uses a **compact layout**: a dense array of entries in insertion order plus a sparse array of indices — which is why dicts became smaller and ordered simultaneously. Average lookup is O(1); the worst case is O(n) under adversarial collisions, which is why string hashing is randomised per process by default."},{t:`qa`,q:`Are dicts ordered?`,a:"Yes. Insertion order became an implementation detail in CPython 3.6 and a **language guarantee in 3.7**. `OrderedDict` is still useful for `move_to_end`, `popitem(last=False)`, and order-sensitive equality."},{t:`qa`,q:`Why can't a list be a dict key?`,a:"Dict keys must be hashable, and hashability requires the hash to stay constant for the object's lifetime. Lists are mutable, so their hash could change after insertion and the entry would become unreachable in its bucket. `list.__hash__` is therefore set to `None`. Use a tuple, or `frozenset` for an unordered key."},{t:`qa`,q:"What is the `__hash__`/`__eq__` contract?",a:"If `a == b` then `hash(a)` must equal `hash(b)`. The reverse is not required — unequal objects may collide. Defining `__eq__` on a class automatically sets `__hash__ = None`, making instances unhashable, precisely so you cannot break the contract by accident. Restore it explicitly, usually as `hash((self.a, self.b))` over the same fields you compare."},{t:`qa`,q:`What sorting algorithm does Python use?`,a:`**Timsort** — a hybrid of merge sort and insertion sort that detects existing sorted runs. Worst and average case O(n log n), best case O(n) on nearly-sorted data, O(n) extra space, and crucially **stable**. Stability is what makes multi-key sorting work by sorting on the least significant key first.`},{t:`qa`,q:`How do you remove duplicates while preserving order?`,a:"`list(dict.fromkeys(xs))` — dicts are ordered and keys are unique, so this is a one-line O(n) solution. `list(set(xs))` is O(n) too but loses order. A manual `seen` set with a loop is the version to write if the interviewer wants to see the mechanism.",code:`xs = [3, 1, 3, 2, 1]
print(list(dict.fromkeys(xs)))    # [3, 1, 2]

seen, out = set(), []
for x in xs:
    if x not in seen:
        seen.add(x); out.append(x)`},{t:`qa`,q:`When would you use a deque instead of a list?`,a:"When you push or pop at the **front**. `list.pop(0)` and `list.insert(0, x)` are O(n) because everything shifts; `deque.popleft()` and `appendleft()` are O(1). Use it for queues, BFS frontiers and sliding windows. The trade-off is that indexing into the middle of a deque is O(n)."},{t:`qa`,q:"What does `__slots__` do?",a:"It replaces the per-instance `__dict__` with a fixed array of descriptors. You get roughly 40–50% memory savings and slightly faster attribute access, at the cost of not being able to add attributes dynamically and some multiple-inheritance restrictions. Worth it when you allocate millions of small objects."}]},{id:`qa-oop`,title:`OOP and functions`,blocks:[{t:`qa`,q:"Explain the MRO and what `super()` really does.",a:"The Method Resolution Order is the linearised list of classes Python searches for an attribute, computed by the **C3 linearisation** algorithm: a class precedes its parents, base order is preserved, and each class appears once. `super()` does not mean 'my parent' — it returns a proxy to the **next class in the instance's MRO after the current one**, which is what makes cooperative multiple inheritance work. Inspect it with `Cls.__mro__`."},{t:`qa`,q:"Difference between `@staticmethod`, `@classmethod` and an instance method?",a:"An instance method takes `self` and needs an object. A `@classmethod` takes `cls` and is the standard way to write alternative constructors — using `cls` rather than the hardcoded class name means subclasses get the right type back. A `@staticmethod` takes neither; it is a plain function namespaced inside the class for organisational reasons."},{t:`qa`,q:"`__new__` vs `__init__`?",a:"`__new__` is a static method that **allocates and returns** the instance; `__init__` then initialises the already-created object and must return `None`. You almost never override `__new__` except when subclassing an immutable type (`int`, `str`, `tuple`) or implementing a singleton or object cache.",code:`class Singleton:
    _inst = None
    def __new__(cls, *a, **kw):
        if cls._inst is None:
            cls._inst = super().__new__(cls)
        return cls._inst`},{t:`qa`,q:`Are Python attributes really private?`,a:"No. A single underscore is a convention meaning 'internal'. A double underscore triggers **name mangling** — `__x` inside class `C` becomes `_C__x` — which prevents accidental collisions in subclasses but not deliberate access. Python's model is 'we are all consenting adults'; enforcement is by convention and code review, not the runtime."},{t:`qa`,q:`What is duck typing?`,a:"Behaviour is determined by which methods an object supports, not by its declared type. If it implements `__iter__` you can iterate it; if it implements `__len__` you can call `len()`. This is why `isinstance` checks are often the wrong tool — prefer the abstract base classes in `collections.abc`, or just call the method and catch `AttributeError` (EAFP)."},{t:`qa`,q:`Generator vs iterator vs iterable?`,a:"An **iterable** defines `__iter__` (or old-style `__getitem__`) and can produce a fresh iterator on demand — lists, strings, dicts. An **iterator** defines both `__iter__` and `__next__` and is consumed once. A **generator** is the easiest way to write an iterator: any function containing `yield`, or a generator expression. Every generator is an iterator; every iterator is an iterable; the converse fails in both directions."},{t:`qa`,q:`Why use a generator instead of returning a list?`,a:"Constant memory instead of O(n), the first result is available immediately instead of after the whole computation, infinite sequences become expressible, and pipelines compose lazily so nothing intermediate is materialised. The cost: no `len()`, no indexing, and it is exhausted after a single pass."},{t:`qa`,q:"What does `yield from` do?",a:"It delegates iteration to a sub-iterable, forwarding values out and `send`/`throw` calls in, and it evaluates to the sub-generator's `return` value. Without it you would write `for x in sub: yield x`, which does not forward the coroutine protocol or capture the return value."},{t:`qa`,q:`Explain the mutable default argument problem.`,a:"Default values are evaluated **once**, when the `def` statement runs, and stored in `func.__defaults__`. A `def f(x, acc=[])` therefore shares one list across all calls, and it accumulates. The fix is `acc=None` plus `if acc is None: acc = []` inside. The same trap applies to `{}` and to any object built at definition time, such as `datetime.now()`."},{t:`qa`,q:`Does Python support method overloading?`,a:"Not by signature — a later `def` simply rebinds the name and the earlier one is lost. You achieve the same effect with default arguments, `*args`, or explicit type dispatch. `functools.singledispatch` gives real single-argument dispatch on type. **Overriding** (redefining a parent's method in a subclass) is fully supported, as is operator overloading via dunder methods."}]},{id:`qa-practical`,title:`Practical and performance`,blocks:[{t:`qa`,q:"Why is `str += x` in a loop slow?",a:'Strings are immutable, so each `+=` allocates a new string and copies the entire accumulated content — O(n²) overall. Collect the pieces in a list and call `"".join(parts)` for O(n). CPython has an in-place optimisation when the string has a refcount of 1, but it is fragile and disappears the moment another name references it.'},{t:`qa`,q:"List comprehension vs `for` loop vs `map` — which is fastest?",a:"A comprehension is usually fastest for building a list, because the append is a dedicated `LIST_APPEND` opcode rather than a method lookup and call per item. `map` wins slightly when the function already exists as a builtin (`map(str, xs)`) and loses when you have to write a lambda. A plain loop is the slowest of the three but the most readable once there is real logic. Differences are small — profile before caring."},{t:`qa`,q:`How do you profile and time Python code?`,a:"`timeit` for micro-benchmarks (it disables the GC and runs many repetitions), `cProfile` plus `pstats` for function-level hotspots, `tracemalloc` for memory. Use `time.perf_counter()` rather than `time.time()` for elapsed measurements — it is monotonic and higher resolution.",code:`import timeit, cProfile
print(timeit.timeit("'-'.join(map(str, range(100)))", number=10000))
cProfile.run("main()", sort="cumtime")`},{t:`qa`,q:`Threads, processes, or asyncio?`,a:"**Processes** for CPU-bound pure-Python work: each has its own interpreter and GIL. **asyncio** for high-concurrency I/O with thousands of sockets: one thread, cooperative scheduling, no context-switch cost. **Threads** for blocking I/O at modest concurrency, or when you must call a blocking library that releases the GIL. Mixing them is normal: `loop.run_in_executor` puts blocking calls on a thread pool."},{t:`qa`,q:`What is monkey patching?`,a:"Replacing an attribute of a module or class at runtime — for example swapping `requests.get` for a stub in a test. It works because classes and modules are ordinary mutable objects. It is legitimate for testing and emergency patches, and a maintenance hazard everywhere else because the change is invisible at the call site."},{t:`qa`,q:"What are `*` and `/` in a function signature?",a:"Everything **before** `/` is positional-only, so callers cannot pass it by keyword — which frees the name for `**kwargs` and lets you rename it later without breaking anyone. Everything **after** a bare `*` is keyword-only, which forces readable call sites for boolean flags and options. Both were added to let pure-Python functions express what C builtins always could."},{t:`qa`,q:"What does `@lru_cache` do and when does it break?",a:"It memoises results keyed on the argument tuple, with an LRU eviction bound (`maxsize=None`, or `@cache` in 3.9+, means unbounded). It breaks when arguments are unhashable (lists, dicts), when the function is impure or depends on time or external state, and when applied to methods — the cache holds a strong reference to `self`, so instances never get collected."},{t:`qa`,q:"What is the difference between `.py`, `.pyc`, `.pyd`, `.pyo`?",a:"`.py` is source. `.pyc` is cached bytecode under `__pycache__`, tagged with the interpreter version. `.pyd` is a compiled C extension on Windows (a DLL); on Linux the equivalent is a `.so`. `.pyo` was the old optimised bytecode file and was removed in 3.5 — optimisation level is now part of the `.pyc` filename."},{t:`qa`,q:`How do virtual environments work?`,a:"`python -m venv .venv` creates a directory with its own `site-packages` and a `pyvenv.cfg` pointing at a base interpreter. Activating it puts the venv's `bin` first on `PATH`, so `python` and `pip` resolve there and installs stay project-local. It exists because a single global `site-packages` cannot hold two versions of the same library."},{t:`qa`,q:`What is PEP 8, and which rules matter most?`,a:"The style guide for Python code. The rules that carry real weight: 4-space indentation, `snake_case` for functions and variables, `PascalCase` for classes, `UPPER_SNAKE` for constants, a line limit around 79–100 characters, two blank lines between top-level definitions, imports grouped stdlib / third-party / local. In practice you let `black` and `ruff` enforce it rather than arguing about it."}]}]},{id:`tricky`,num:`11`,title:`Predict the Output`,kicker:`Tricky snippets that separate memorising from understanding`,sections:[{id:`tricky-mutability`,title:`Mutability and binding`,blurb:`Read each snippet, commit to an answer, then reveal.`,blocks:[{t:`guess`,code:`def add(x, lst=[]):

    flags[0:2] = b"\\x00\\x00"

class LRUCache:

        self.data = OrderedDict()

    """Point update, prefix sum. 1-indexed internally."""
    def __init__(self, n):

    def add(self, i, delta):        # O(log n)

        while i <= self.n:

    """Point assign, range query. Swap 'op' and 'identity' for min/max/gcd."""
    def __init__(self, data, op=min, identity=float("inf")):
        self.n = len(data)
        self.op, self.id = op, identity
        self.t = [identity] * (2 * self.n)
        self.t[self.n:] = data
        for i in range(self.n - 1, 0, -1):
            self.t[i] = op(self.t[2*i], self.t[2*i+1])

    def update(self, i, value):          # O(log n)
        i += self.n
        self.t[i] = value

            self.t[i] = self.op(self.t[2*i], self.t[2*i+1])

# now each DISTINCT n is computed once. There are n distinct values.
# time  = (number of distinct states) x (work per state) = n * O(1) = O(n)
# space = cache O(n) + call stack O(n) = O(n)`},{t:`note`,k:`tip`,x:"This is the universal DP formula: **time = number of states × work per state**. For a 2D DP over `i` and `j` with an O(1) transition, that is `O(n·m)`. If the transition loops over k choices, it is `O(n·m·k)`. Say it in exactly those words in an interview."}]},{id:`cx-space`,title:`Space complexity, including the parts people forget`,blocks:[{t:`p`,x:`Space complexity is the **extra** memory your algorithm needs, beyond the input. Three sources, and candidates routinely forget the third.`},{t:`ul`,ord:!0,x:[`**Explicit structures** — the arrays, dicts and sets you allocate.`,`**Output** — sometimes excluded by convention (e.g. 'return all subsets' is inherently O(2ⁿ) output). State your assumption.`,`**The call stack** — every pending recursive frame costs memory. A recursion of depth n is O(n) space even with no arrays at all.`]},{t:`code`,x:`def reverse_iter(a):        # O(1) extra space
    i, j = 0, len(a) - 1
    while i < j:
        a[i], a[j] = a[j], a[i]
        i += 1; j -= 1

def reverse_rec(a, i, j):   # O(n) space -- the STACK, even though nothing is allocated
    if i >= j: return
    a[i], a[j] = a[j], a[i]
    reverse_rec(a, i+1, j-1)

def reverse_copy(a):        # O(n) space -- a new list
    return a[::-1]`},{t:`note`,k:`gotcha`,x:"In Python, slicing **copies**. `helper(arr[1:])` inside a recursion turns an O(n) algorithm into O(n²) time and O(n²) space. Pass indices instead: `helper(arr, i+1)`."},{t:`h`,x:`Rolling arrays: the standard space optimisation`},{t:`code`,x:`# 2D DP where row i only depends on row i-1
dp = [[0] * (m+1) for _ in range(n+1)]     # O(n*m) space
for i in range(1, n+1):
    for j in range(1, m+1):
        dp[i][j] = dp[i-1][j-1] + 1 if match else max(dp[i-1][j], dp[i][j-1])

# keep only two rows -> O(m) space, same O(n*m) time
prev = [0] * (m+1)
for i in range(1, n+1):
    cur = [0] * (m+1)
    for j in range(1, m+1):
        cur[j] = prev[j-1] + 1 if match else max(prev[j], cur[j-1])
    prev = cur`}]},{id:`cx-python`,title:`Hidden costs specific to Python`,blocks:[{t:`p`,x:`Big-O is language-neutral, but the operations you *choose* have different costs in Python than in C++. These are the ones that turn a correct O(n) solution into an accidental O(n²).`},{t:`table`,head:[`What you wrote`,`True cost`,`Fix`],rows:[["`x in my_list`",`O(n)`,"`x in my_set` → O(1)"],["`s += char` in a loop",`O(n²) total`,'collect in a list, `"".join(parts)`'],["`arr.pop(0)` / `arr.insert(0, x)`",`O(n)`,"`collections.deque` → O(1)"],["`arr[1:]` inside recursion",`O(n) copy per call`,`pass an index`],["`list.remove(x)` in a loop",`O(n) each → O(n²)`,`build a new list, or use a set`],["`max(arr)` inside a loop over arr",`O(n²)`,`compute once outside`],["`sorted(...)` inside a loop",`O(n² log n)`,`sort once before the loop`],["`dict.keys()` then indexing","fine, but `.items()` is one pass","iterate `.items()`"],["string concatenation with `+` in join position",`O(n²)`,'`"".join()`']]},{t:`code`,x:`# the classic accidental quadratic
def has_duplicate_slow(arr):
    seen = []
    for x in arr:
        if x in seen:        # O(n) scan, inside an O(n) loop -> O(n^2)
            return True
        seen.append(x)
    return False

def has_duplicate_fast(arr):
    seen = set()
    for x in arr:
        if x in seen:        # O(1) hash probe -> O(n) total
            return True
        seen.add(x)
    return False

def has_duplicate_shortest(arr):
    return len(set(arr)) < len(arr)     # O(n), one C-level pass`},{t:`note`,k:`perf`,x:"Two algorithms with the same Big-O can differ 20× in Python, because builtins loop in C while your `for` loops in bytecode. `sum(arr)` and a manual accumulation are both O(n); the builtin wins massively. Big-O first, then constants."}]},{id:`cx-interview`,title:`How to state complexity in an interview`,blocks:[{t:`p`,x:`Interviewers are not checking whether you memorised a table. They are checking whether you can **derive** it and whether you know what to optimise. Use this script.`},{t:`ul`,ord:!0,x:[`**Define your variables.** 'Let n be the length of the array and m the length of the target string.' Ambiguity here loses points instantly.`,`**State the brute force and its complexity first**, even if you will not code it. 'The naive approach checks every pair, which is O(n²).'`,`**Name the bottleneck.** 'The repeated inner scan is the problem — I'm doing a linear lookup n times.'`,`**Name the fix and the trade.** 'A hash set turns that lookup into O(1), giving O(n) time at the cost of O(n) space.'`,`**Say worst case unless told otherwise**, and mention when average differs — hash tables, quickselect.`,`**Include the recursion stack** in your space answer. Saying 'O(1) space' about a recursive solution is a common miss.`]},{t:`table`,head:[`Growth`,`n = 10`,`n = 1 000`,`n = 1 000 000`,`Feels like`],rows:[[`O(1)`,`1`,`1`,`1`,`instant, always`],[`O(log n)`,`3`,`10`,`20`,`instant, always`],[`O(n)`,`10`,`1 000`,`1 000 000`,`fine`],[`O(n log n)`,`33`,`10 000`,`20 000 000`,`fine — the sorting ceiling`],[`O(n²)`,`100`,`1 000 000`,`10¹²`,`dies past ~10 000`],[`O(2ⁿ)`,`1 024`,`≫ atoms in the universe`,`—`,`only for n ≤ 20`],[`O(n!)`,`3 628 800`,`—`,`—`,`only for n ≤ 10`]]},{t:`note`,k:`ask`,x:"**Read the constraints backwards to find the intended solution.** `n ≤ 10⁵` almost always means O(n log n). `n ≤ 10³` means O(n²) is acceptable. `n ≤ 20` is screaming bitmask or backtracking. `n ≤ 10⁹` means the answer is maths or binary search on the answer — you cannot even loop over the input."}]}]},{id:`practice-arrays`,num:`15`,title:`Practice · Arrays & Strings`,kicker:`Beginner to hard, each with brute force and the optimisation`,sections:[{id:`pa-warmup`,title:`Warm-up: single-pass thinking`,blurb:`Attempt each one before opening the solutions. The approach tabs show the progression.`,blocks:[{t:`p`,x:`These look trivial, and they are — but they establish the habit the whole chapter runs on: **ask what the loop is doing, count it, then ask whether a second pass can be folded into the first**.`},{t:`drill`,lvl:`beginner`,title:`Sum and average of an array`,tag:`traversal`,stmt:`Return the sum and the average of a list of numbers. Handle the empty list without crashing.`,ex:`[4, 8, 15, 16]  ->  sum 43, avg 10.75
[]              ->  sum 0,  avg 0`,hint:`One pass is enough. Guard the division separately.`,approaches:[{name:`Explicit loop`,idea:`Accumulate in a variable. This is the version to write if the interviewer says 'without builtins'.`,code:`def sum_avg(arr):
    total = 0
    for x in arr:          # visits each element exactly once
        total += x
    avg = total / len(arr) if arr else 0
    return total, avg`,time:`O(n)`,space:`O(1)`,why:"The loop body runs once per element, so the operation count is proportional to `n`. Only `total` and `avg` are stored regardless of input size, so extra space is constant. Note `len(arr)` is O(1) in Python — lists cache their length, so it does not add a pass."},{name:`Builtin`,idea:"`sum` runs the same loop in C, so it is the same complexity but a much smaller constant.",code:`def sum_avg(arr):
    total = sum(arr)
    return total, (total / len(arr) if arr else 0)

from statistics import mean       # raises on empty input — guard it yourself`,time:`O(n)`,space:`O(1)`,why:"Identical growth: `sum` still touches every element. The win is constant-factor only — roughly 10–20× because the loop, the addition, and the iteration protocol all happen in C rather than in bytecode. Big-O cannot see this difference, which is exactly why you measure after you optimise the class."}],takeaway:`Builtins do not change complexity, they change constants. Reach for them once the algorithm is already the right shape.`},{t:`drill`,lvl:`beginner`,title:`Second largest element`,tag:`traversal`,stmt:"Find the second largest **distinct** value. Return `None` if there isn't one.",ex:`[3, 9, 9, 1, 7]  ->  7
[5, 5, 5]        ->  None`,hint:`You can track two variables in one pass. Watch what happens when a value equals the current maximum.`,approaches:[{name:`Sort`,idea:`Deduplicate, sort, take the second from the end. Correct and short — say this out loud, then improve it.`,code:`def second_largest(arr):
    uniq = sorted(set(arr))
    return uniq[-2] if len(uniq) >= 2 else None`,time:`O(n log n)`,space:`O(n)`,why:"`set(arr)` is one O(n) pass. `sorted` is O(n log n), which dominates the sum `n + n log n`. Space is O(n) because both the set and the sorted list hold up to n elements. The sort is doing far more work than the question needs — it orders *everything* when we only want the top two."},{name:`Two-variable single pass`,idea:`Carry the best and second-best seen so far. When a new value beats the best, the old best slides down into second.`,code:`def second_largest(arr):
    first = second = None
    for x in arr:
        if first is None or x > first:
            first, second = x, first      # old champion demoted
        elif x != first and (second is None or x > second):
            second = x                    # x != first keeps it DISTINCT
    return second`,time:`O(n)`,space:`O(1)`,why:`One pass, and each iteration does a fixed number of comparisons — at most two — so the total is c·n for a small constant c, which is O(n). Only two variables are held no matter how long the list is, so space is O(1). Compared to sorting we removed the log n factor by only ever maintaining the information we actually need.`}],takeaway:`Whenever a solution starts with 'sort it', ask what the sort is buying you. If you only need the top k, a single pass or a heap does it without the log n.`},{t:`drill`,lvl:`beginner`,title:`Reverse an array in place`,tag:`two pointers`,stmt:`Reverse a list **in place**, without allocating a second list.`,ex:`[1, 2, 3, 4, 5]  ->  [5, 4, 3, 2, 1]`,hint:`Swap the outermost pair, then move both ends inward.`,approaches:[{name:`Two pointers`,idea:`Put one index at each end, swap, and walk them toward each other until they meet.`,code:`def reverse(a):
    i, j = 0, len(a) - 1
    while i < j:
        a[i], a[j] = a[j], a[i]
        i += 1
        j -= 1
    return a`,time:`O(n)`,space:`O(1)`,why:"Each iteration moves the two pointers one step closer, so the loop runs n/2 times — and n/2 is O(n) once the constant is dropped. Nothing is allocated: the tuple swap `a[i], a[j] = a[j], a[i]` builds a temporary 2-tuple on the stack, which is constant size regardless of n."},{name:`Slice (not in place)`,idea:`The idiomatic Python answer, but it builds a new list — worth stating that you know the difference.`,code:`b = a[::-1]        # new list, O(n) extra space
a.reverse()        # in place, O(1) extra space, C-speed
a[:] = a[::-1]     # in place ASSIGNMENT, but the reversed copy exists briefly`,time:`O(n)`,space:`O(n) for the slice, O(1) for .reverse()`,why:"`a[::-1]` must allocate a list of n pointers and fill it, so it is O(n) space. `a.reverse()` swaps in place like the manual version — same complexity, C constant factor. If an interviewer says 'in place', `a[::-1]` alone does not satisfy them."}],takeaway:`Two pointers converging from both ends is the base pattern for reversing, palindromes, and pair-sum on sorted data.`},{t:`drill`,lvl:`easy`,title:`Remove duplicates from a sorted array in place`,tag:`two pointers · LeetCode 26`,stmt:`Given a **sorted** list, remove duplicates in place so each value appears once. Return the new length; elements past it don't matter.`,ex:`[0,0,1,1,1,2,2,3]  ->  length 4, array starts [0,1,2,3,...]`,hint:`Use a slow pointer marking the end of the deduplicated region and a fast pointer scanning ahead.`,approaches:[{name:`Extra list (rejected)`,idea:`Build a new list. Works, but violates the in-place requirement — mention and discard.`,code:`def dedupe(a):
    out = []
    for x in a:
        if not out or out[-1] != x:
            out.append(x)
    a[:] = out
    return len(out)`,time:`O(n)`,space:`O(n)`,why:`One pass, but the output list can be as large as the input when there are no duplicates, so extra space is O(n). The complexity class of the *time* is already optimal — the interviewer is testing the space constraint specifically.`},{name:`Slow / fast pointers`,idea:"`slow` is the index of the last unique element written. `fast` scans forward; whenever it finds something different, we advance `slow` and overwrite.",code:`def dedupe(a):
    if not a:
        return 0
    slow = 0
    for fast in range(1, len(a)):
        if a[fast] != a[slow]:      # sorted, so a difference means a NEW value
            slow += 1
            a[slow] = a[fast]
    return slow + 1`,time:`O(n)`,space:`O(1)`,why:"`fast` makes exactly n−1 iterations and `slow` only ever moves forward, so together they perform at most 2n index moves — linear. No allocation happens; we reuse the input array's own cells, so extra space is O(1). Sortedness is what makes this work: it guarantees every duplicate is adjacent, so comparing against one previous element is enough."}],takeaway:`Slow/fast pointer in-place compaction: the slow index marks 'valid region so far', the fast index scans. Same pattern solves move-zeros and remove-element.`},{t:`drill`,lvl:`easy`,title:`Move all zeros to the end`,tag:`two pointers · LeetCode 283`,stmt:"Move every `0` to the end while keeping the relative order of the non-zero elements. In place.",ex:`[0,1,0,3,12]  ->  [1,3,12,0,0]`,hint:`First write all the non-zeros compactly, then fill the tail.`,approaches:[{name:`Two passes`,idea:`Compact the non-zeros to the front, then zero out everything after them.`,code:`def move_zeros(a):
    slow = 0
    for x in a:
        if x != 0:
            a[slow] = x
            slow += 1
    for i in range(slow, len(a)):
        a[i] = 0
    return a`,time:`O(n)`,space:`O(1)`,why:"Two separate loops, each at most n iterations: n + n = 2n, which is O(n). Two passes over the data is *not* worse than one in Big-O terms — the constant changed, the class did not. Space is O(1) because we only track `slow`."},{name:`One pass with swap`,idea:`Swap each non-zero into the slow slot as you find it. Zeros drift right automatically.`,code:`def move_zeros(a):
    slow = 0
    for fast in range(len(a)):
        if a[fast] != 0:
            a[slow], a[fast] = a[fast], a[slow]
            slow += 1
    return a`,time:`O(n)`,space:`O(1)`,why:`Same asymptotic cost as the two-pass version but with a single traversal and at most n swaps. Worth knowing that it does *more* writes when the array is mostly non-zero (it swaps an element with itself), so 'one pass' is not automatically faster in practice — another reminder that Big-O ties are broken by measurement.`}],takeaway:`'Keep relative order while filtering' is stable partitioning — the slow pointer writes the kept elements in order.`}]},{id:`pa-subarray`,title:`Subarrays, prefix sums and Kadane`,blurb:`The step from O(n³) to O(n) in three clean stages.`,blocks:[{t:`drill`,lvl:`medium`,title:`Maximum subarray sum`,tag:`Kadane · LeetCode 53 · asked at Amazon, Microsoft`,stmt:`Find the largest sum of any **contiguous** subarray. The array can contain negatives, and the subarray must be non-empty.`,ex:`[-2,1,-3,4,-1,2,1,-5,4]  ->  6   (from [4,-1,2,1])
[-3,-1,-2]               ->  -1  (a single element)`,hint:`At each index, ask: is it better to extend the subarray ending here, or start a fresh one at this element?`,approaches:[{name:`Brute force O(n³)`,idea:`Try every start, every end, and sum the slice between them. The obvious first idea — state it, then attack it.`,code:`def max_sub(a):
    best = float("-inf")
    for i in range(len(a)):
        for j in range(i, len(a)):
            total = 0
            for k in range(i, j + 1):     # re-summing from scratch every time
                total += a[k]
            best = max(best, total)
    return best`,time:`O(n³)`,space:`O(1)`,why:`Three nested loops. The outer two enumerate all O(n²) subarrays, and the innermost re-adds up to n elements for each one — n² pairs × n additions = n³. At n = 1 000 that is a billion operations, which Python will not finish in a minute. The waste is obvious once you name it: the inner loop recomputes a sum that overlaps almost entirely with the previous one.`},{name:`Better O(n²)`,idea:"Keep a running total as `j` extends, so the inner sum is free.",code:`def max_sub(a):
    best = float("-inf")
    for i in range(len(a)):
        total = 0
        for j in range(i, len(a)):
            total += a[j]                 # extend instead of recompute
            best = max(best, total)
    return best`,time:`O(n²)`,space:`O(1)`,why:`We deleted the innermost loop by *reusing* the previous sum — a running accumulator turns n additions into one. Two loops remain, giving n(n+1)/2 ≈ n²/2 iterations, so O(n²). This is the single most common optimisation move in array problems: notice that adjacent iterations recompute overlapping work.`},{name:`Optimal O(n) — Kadane`,idea:"Scan once, carrying `cur` = the best sum of a subarray **ending at the current index**. At each element you have exactly two choices: extend the previous subarray, or abandon it and start here. Take whichever is larger.",code:`def max_sub(a):
    best = cur = a[0]
    for x in a[1:]:
        cur = max(x, cur + x)     # start fresh at x, or extend
        best = max(best, cur)     # track the best ending anywhere
    return best

def max_sub_with_indices(a):      # when they ask WHICH subarray
    best = cur = a[0]
    start = bs = be = 0
    for i in range(1, len(a)):
        if a[i] > cur + a[i]:
            cur, start = a[i], i          # restarted here
        else:
            cur += a[i]
        if cur > best:
            best, bs, be = cur, start, i
    return best, (bs, be)`,time:`O(n)`,space:`O(1)`,why:"One pass, constant work per element. The insight that removes the second loop: the best subarray ending at index `i` depends only on the best subarray ending at `i−1` — if that running sum is negative it can only hurt, so we drop it. Because each index's answer is derived from one previous answer in O(1), we never need to revisit earlier positions. That is dynamic programming with a single state variable, which is why the space is O(1) rather than O(n)."}],takeaway:`The O(n³)→O(n²) move is 'stop recomputing overlapping sums'. The O(n²)→O(n) move is 'the answer ending here depends only on the answer ending one step back'. Both moves reappear constantly.`},{t:`drill`,lvl:`medium`,title:`Subarray sum equals K`,tag:`prefix + hash · LeetCode 560 · asked at Google, Meta`,stmt:"Count how many contiguous subarrays sum to exactly `k`. Values may be negative, so the sliding window trick does **not** apply.",ex:`a = [1,1,1], k = 2  ->  2
a = [1,2,3],  k = 3  ->  2   ([1,2] and [3])`,hint:"If `prefix[j] - prefix[i] == k`, then `prefix[i] == prefix[j] - k`. So while scanning, ask how many earlier prefixes had that value.",approaches:[{name:`Brute force O(n²)`,idea:`Every start, extend to every end, keep a running sum.`,code:`def count_k(a, k):
    count = 0
    for i in range(len(a)):
        total = 0
        for j in range(i, len(a)):
            total += a[j]
            if total == k:
                count += 1
    return count`,time:`O(n²)`,space:`O(1)`,why:`n(n+1)/2 subarrays are examined with O(1) work each. Fine up to about n = 5 000 in Python; hopeless at 10⁵.`},{name:`Optimal O(n) — prefix sums + hash map`,idea:"Let `pre` be the running sum up to the current index. A subarray ending here sums to `k` exactly when some earlier prefix equalled `pre - k`. Store how many times each prefix value has occurred, and look up `pre - k` in O(1).",code:`from collections import defaultdict

def count_k(a, k):
    seen = defaultdict(int)
    seen[0] = 1              # the empty prefix — needed for subarrays starting at index 0
    pre = count = 0
    for x in a:
        pre += x
        count += seen[pre - k]    # every earlier prefix of that value gives one subarray
        seen[pre] += 1
    return count`,time:`O(n)`,space:`O(n)`,why:"One pass with an O(1) average dict lookup and insert per element gives O(n) time. The dict can hold up to n distinct prefix values, hence O(n) space — this is the classic **time–space trade**: we bought a factor of n in time by spending a factor of n in memory. The `seen[0] = 1` seed is the part everyone forgets; without it a subarray starting at index 0 whose sum is exactly k goes uncounted."}],takeaway:`'Count subarrays with property X' with negative numbers allowed ⇒ prefix sums in a hash map. With only positives, a sliding window works instead and saves the space.`},{t:`drill`,lvl:`medium`,title:`Product of array except self`,tag:`prefix/suffix · LeetCode 238 · asked at Amazon, Apple`,stmt:"Return an array where `out[i]` is the product of every element **except** `a[i]`. **Division is not allowed** and it must run in O(n).",ex:`[1,2,3,4]  ->  [24,12,8,6]`,hint:`The answer at i is (everything to the left) × (everything to the right). Compute those two sweeps separately.`,approaches:[{name:`Brute force O(n²)`,idea:`For each index, multiply all the others.`,code:`def product_except(a):
    n = len(a)
    return [
        __import__("math").prod(a[j] for j in range(n) if j != i)
        for i in range(n)
    ]`,time:`O(n²)`,space:`O(1) extra (excluding output)`,why:`n indices × an n-element product each. Note the output array itself is O(n), which by convention is usually excluded from the space bound — say which convention you are using.`},{name:`Two arrays`,idea:"Build `left[i]` = product of everything before i, and `right[i]` = product of everything after. Multiply them.",code:`def product_except(a):
    n = len(a)
    left, right = [1] * n, [1] * n
    for i in range(1, n):
        left[i] = left[i-1] * a[i-1]
    for i in range(n-2, -1, -1):
        right[i] = right[i+1] * a[i+1]
    return [left[i] * right[i] for i in range(n)]`,time:`O(n)`,space:`O(n)`,why:`Three separate linear passes: 3n = O(n). Each prefix product is built from the previous one in O(1) — the same 'reuse the neighbour's answer' move as Kadane. Space is O(n) for the two helper arrays.`},{name:`Optimal O(1) extra space`,idea:`Write the left products directly into the output array, then sweep right-to-left multiplying by a single running suffix variable.`,code:`def product_except(a):
    n = len(a)
    out = [1] * n
    for i in range(1, n):
        out[i] = out[i-1] * a[i-1]      # out now holds LEFT products

    suffix = 1
    for i in range(n-1, -1, -1):
        out[i] *= suffix                # fold in the right side
        suffix *= a[i]
    return out`,time:`O(n)`,space:`O(1) extra`,why:"Same two passes, but the right-hand products never need to be stored — only the single running value `suffix` is needed at any moment, because we consume it immediately as we sweep backwards. The output array is required by the problem, so it is not counted as extra space. This is the standard way to turn a two-array prefix/suffix solution into a constant-space one."}],takeaway:"Prefix/suffix decomposition: when `out[i]` needs 'everything left' and 'everything right', two sweeps beat n² — and the second sweep usually collapses into one variable."}]},{id:`pa-hard`,title:`Harder array problems`,blocks:[{t:`drill`,lvl:`medium`,title:`Rotate an array by k positions`,tag:`LeetCode 189 · asked at Microsoft, Amazon`,stmt:"Rotate the list right by `k` steps, in place. `k` can exceed the length.",ex:`[1,2,3,4,5,6,7], k=3  ->  [5,6,7,1,2,3,4]`,hint:`Reverse the whole thing, then reverse the first k and the rest separately. Draw it out for k=3.`,approaches:[{name:`Brute force O(n·k)`,idea:`Rotate by one, k times.`,code:`def rotate(a, k):
    n = len(a)
    for _ in range(k % n):
        last = a.pop()          # O(1)
        a.insert(0, last)       # O(n) -- shifts everything
    return a`,time:`O(n·k)`,space:`O(1)`,why:"`insert(0, x)` shifts every existing element one slot right, which is n work, and we do it k times. With k ≈ n this is O(n²). The `k % n` is essential regardless of approach: rotating by n returns the original, so only the remainder matters."},{name:`Extra array O(n) space`,idea:"Each element at index `i` lands at `(i + k) % n`. Write straight into a new array.",code:`def rotate(a, k):
    n = len(a)
    k %= n
    out = [0] * n
    for i, x in enumerate(a):
        out[(i + k) % n] = x
    a[:] = out
    return a

a[:] = a[-k:] + a[:-k]      # the same idea, one line, still O(n) space`,time:`O(n)`,space:`O(n)`,why:`One pass with an O(1) modulo and store per element. We traded the k factor away entirely by computing each element's final home directly instead of moving it k times. Cost: a full second array.`},{name:`Optimal — triple reverse`,idea:`Reverse everything, then reverse the first k and the remaining n−k separately. The double reversal restores internal order within each block while the blocks have swapped places.`,code:`def rotate(a, k):
    n = len(a)
    k %= n

    def rev(i, j):
        while i < j:
            a[i], a[j] = a[j], a[i]
            i += 1; j -= 1

    rev(0, n - 1)        # [7,6,5,4,3,2,1]
    rev(0, k - 1)        # [5,6,7,4,3,2,1]
    rev(k, n - 1)        # [5,6,7,1,2,3,4]
    return a`,time:`O(n)`,space:`O(1)`,why:`Three reversals, each touching at most n elements: n + k + (n−k) = 2n swaps total, so O(n). Nothing is allocated — every swap reuses the input's own cells. This gets the linear time of the extra-array version *and* the constant space of the naive version, which is why it is the expected answer.`}],takeaway:`Reverse-reverse-reverse is the standard in-place block-swap trick. It also rotates strings and solves 'swap two adjacent blocks' generally.`},{t:`drill`,lvl:`medium`,title:`Merge overlapping intervals`,tag:`sorting · LeetCode 56 · asked at Google, Amazon, Adobe`,stmt:"Given a list of `[start, end]` intervals, merge all overlapping ones and return the result.",ex:`[[1,3],[2,6],[8,10],[15,18]]  ->  [[1,6],[8,10],[15,18]]`,hint:`Sort by start time. Then a new interval either extends the last merged one or begins a new one.`,approaches:[{name:`Sort then sweep`,idea:`Once sorted by start, any interval that overlaps the current merged block must overlap it *at the front*, so a single left-to-right sweep suffices.`,code:`def merge(intervals):
    if not intervals:
        return []
    intervals.sort(key=lambda iv: iv[0])      # sort by START
    out = [intervals[0]]
    for start, end in intervals[1:]:
        if start <= out[-1][1]:               # overlaps the last merged block
            out[-1][1] = max(out[-1][1], end) # max: the last block may fully contain this one
        else:
            out.append([start, end])
    return out`,time:`O(n log n)`,space:`O(n)`,why:`The sort costs O(n log n) and dominates; the sweep is a single O(n) pass with O(1) work per interval. Space is O(n) for the output (and O(log n) for Timsort's internal stack). You cannot beat n log n here in general — the sorted order *is* the information you need, and comparison-sorting has an n log n lower bound. When interviewers ask 'can you do better', the answer is 'only if the inputs are bounded integers, where a bucket/counting approach gets O(n + range)'.`}],takeaway:`Interval problems almost always begin with a sort — by start for merging, by **end** for 'maximum non-overlapping' greedy selection. Knowing which key to sort on is the whole problem.`},{t:`drill`,lvl:`hard`,title:`Trapping rain water`,tag:`LeetCode 42 · asked at Amazon, Google, Goldman Sachs`,stmt:`Given heights of bars of width 1, compute how much water is trapped after raining.`,ex:`[0,1,0,2,1,0,1,3,2,1,2,1]  ->  6`,hint:`Water above bar i = min(tallest to its left, tallest to its right) − height[i]. Now find those two maxima efficiently.`,approaches:[{name:`Brute force O(n²)`,idea:`For every bar, scan left and right to find the bounding walls.`,code:`def trap(h):
    total = 0
    for i in range(len(h)):
        left = max(h[:i+1])         # scans i+1 elements
        right = max(h[i:])          # scans n-i elements
        total += min(left, right) - h[i]
    return total`,time:`O(n²)`,space:`O(1) — but the slices make it O(n)`,why:"Each index triggers two scans totalling n elements, so n × n = n². In Python it is worse than it looks: `h[:i+1]` **copies** a slice, so you also allocate O(n) per iteration. Replacing slices with index loops keeps it O(n²) time but drops the allocation."},{name:`Better — precomputed prefix maxima`,idea:"The two scans are recomputed n times over almost identical data. Precompute `left_max` and `right_max` arrays in two passes.",code:`def trap(h):
    if not h: return 0
    n = len(h)
    left = [0] * n
    right = [0] * n

    left[0] = h[0]
    for i in range(1, n):
        left[i] = max(left[i-1], h[i])        # tallest bar at or before i

    right[-1] = h[-1]
    for i in range(n-2, -1, -1):
        right[i] = max(right[i+1], h[i])      # tallest bar at or after i

    return sum(min(left[i], right[i]) - h[i] for i in range(n))`,time:`O(n)`,space:`O(n)`,why:`Three linear passes = O(n). The n² collapsed because each prefix maximum is computed from the previous one in O(1) — exactly the same 'reuse the neighbour' move as in Kadane and product-except-self. We pay O(n) memory for the two helper arrays.`},{name:`Optimal — two pointers, O(1) space`,idea:`Walk pointers inward from both ends, tracking the running max on each side. The key insight: whichever side has the **smaller** running max is the side whose water level is already decided, because the taller side guarantees a wall exists over there.`,code:`def trap(h):
    if not h: return 0
    lo, hi = 0, len(h) - 1
    left_max = right_max = 0
    total = 0

    while lo < hi:
        if h[lo] < h[hi]:
            # left bar is the shorter wall -> left_max fully determines the water here
            if h[lo] >= left_max:
                left_max = h[lo]           # new wall, no water
            else:
                total += left_max - h[lo]  # water fills up to left_max
            lo += 1
        else:
            if h[hi] >= right_max:
                right_max = h[hi]
            else:
                total += right_max - h[hi]
            hi -= 1
    return total`,time:`O(n)`,space:`O(1)`,why:"Each iteration advances exactly one pointer and they only ever move toward each other, so the loop runs n times total — linear. The space drops to constant because we never store the full prefix arrays: at any moment we only need the running maximum on each side, and the comparison `h[lo] < h[hi]` guarantees the side we process is the one whose answer does not depend on unseen data. That guarantee is the whole trick, and articulating *why it is safe* is what the interviewer is listening for."}],takeaway:`The progression brute → prefix arrays → two pointers is the canonical hard-array arc. When a prefix/suffix array is only read in a monotone order, a two-pointer sweep usually replaces it with O(1) space.`},{t:`drill`,lvl:`medium`,title:`Longest palindromic substring`,tag:`expand around centre · LeetCode 5 · asked at Amazon, Microsoft`,stmt:`Return the longest substring that reads the same forwards and backwards.`,ex:`"babad"  ->  "bab" (or "aba")
"cbbd"   ->  "bb"`,hint:`Every palindrome has a centre. There are 2n−1 possible centres — n single characters and n−1 gaps between characters.`,approaches:[{name:`Brute force O(n³)`,idea:`Check every substring for palindromicity.`,code:`def longest_pal(s):
    best = ""
    for i in range(len(s)):
        for j in range(i, len(s)):
            sub = s[i:j+1]              # O(n) slice
            if sub == sub[::-1] and len(sub) > len(best):   # O(n) check
                best = sub
    return best`,time:`O(n³)`,space:`O(n)`,why:`O(n²) substrings, each costing O(n) to slice and reverse-compare. The slice copy is the hidden cost Python adds on top of the comparison.`},{name:`Expand around centre`,idea:`Rather than testing substrings, *grow* them. Pick each of the 2n−1 centres and expand outward while the characters match.`,code:`def longest_pal(s):
    if not s: return ""
    start = end = 0

    def expand(l, r):
        while l >= 0 and r < len(s) and s[l] == s[r]:
            l -= 1
            r += 1
        return l + 1, r - 1          # last valid bounds

    for i in range(len(s)):
        l1, r1 = expand(i, i)        # odd-length centre
        if r1 - l1 > end - start:
            start, end = l1, r1
        l2, r2 = expand(i, i + 1)    # even-length centre (the gap)
        if r2 - l2 > end - start:
            start, end = l2, r2

    return s[start:end + 1]`,time:`O(n²)`,space:`O(1)`,why:'2n−1 centres, each expanding at most n/2 steps in each direction, gives O(n²) worst case — hit by a string like `"aaaa..."`. But we removed the third factor of n by never slicing or reversing: expansion compares one character pair at a time and stops early. Space is O(1) because we track only four indices and slice once at the end.'},{name:`Optimal — Manacher's O(n)`,idea:`Reuse palindrome information already computed: if you are inside a known palindrome, your mirror position's radius is a valid starting guess. Rarely required, but worth naming.`,code:`def longest_pal(s):
    if not s: return ""
    t = "#" + "#".join(s) + "#"      # unify odd/even by interleaving separators
    n = len(t)
    p = [0] * n                       # p[i] = radius of the palindrome centred at i
    centre = right = 0

    for i in range(n):
        if i < right:
            p[i] = min(right - i, p[2 * centre - i])   # mirror
        while i - p[i] - 1 >= 0 and i + p[i] + 1 < n and t[i - p[i] - 1] == t[i + p[i] + 1]:
            p[i] += 1
        if i + p[i] > right:
            centre, right = i, i + p[i]

    k = max(range(n), key=lambda i: p[i])
    start = (k - p[k]) // 2
    return s[start:start + p[k]]`,time:`O(n)`,space:`O(n)`,why:"The `right` boundary only ever moves forward across the whole run, so the total number of character comparisons in the inner `while` is bounded by n — an amortised argument, exactly like `list.append`. Each individual expansion may be long, but their sum is linear. Space is O(n) for the transformed string and the radius array. In an interview, describing expand-around-centre and *mentioning* that Manacher achieves O(n) is usually the full-credit answer."}],takeaway:`'Expand around centre' beats 'test every substring' because growing reuses the comparison you already did. Amortised reasoning — total work bounded even when individual steps aren't — is what makes Manacher linear.`}]}]},{id:`practice-hash`,num:`16`,title:`Practice · Hashing, Two Pointers, Windows`,kicker:`The three patterns that kill most O(n²) solutions`,sections:[{id:`ph-hash`,title:`Hashing: trading space for time`,blurb:`Whenever an inner loop is searching, a hash set or map usually deletes it.`,blocks:[{t:`p`,x:`Almost every O(n²)→O(n) improvement in this section is the same move: **the inner loop is asking 'have I seen this before?', and a hash structure answers that in O(1) instead of O(n)**. The price is O(n) memory. Say that trade out loud in an interview.`},{t:`drill`,lvl:`beginner`,title:`Contains duplicate`,tag:`LeetCode 217`,stmt:"Return `True` if any value appears at least twice.",ex:`[1,2,3,1]  ->  True
[1,2,3,4]  ->  False`,approaches:[{name:`Brute force O(n²)`,idea:`Compare every pair.`,code:`def has_dup(a):
    for i in range(len(a)):
        for j in range(i + 1, len(a)):
            if a[i] == a[j]:
                return True
    return False`,time:`O(n²)`,space:`O(1)`,why:`n(n−1)/2 comparisons in the worst case (no duplicates, so we never exit early). Constant space since nothing is stored.`},{name:`Sort first`,idea:`Duplicates become adjacent after sorting.`,code:`def has_dup(a):
    a = sorted(a)
    return any(a[i] == a[i+1] for i in range(len(a) - 1))`,time:`O(n log n)`,space:`O(n)`,why:`The sort dominates; the adjacent scan is O(n). Better than n² but still pays a log factor we do not need — sorting produces a *total order*, and we only asked a yes/no question about equality.`},{name:`Optimal — hash set`,idea:`Track what you have seen; stop the moment a value repeats.`,code:`def has_dup(a):
    seen = set()
    for x in a:
        if x in seen:        # O(1) average
            return True
        seen.add(x)
    return False

def has_dup_short(a):
    return len(set(a)) < len(a)     # same complexity, one C-level pass`,time:`O(n) average`,space:`O(n)`,why:"One pass with an O(1)-average hash probe and insert per element. Worst case is O(n²) if every key collides, which requires an adversarial hash — Python randomises string hashing per process specifically to make that impractical. The set can hold up to n elements, hence O(n) space. Note the early-exit version can use less memory in practice when a duplicate appears early, while `len(set(a))` always builds the whole set."}],takeaway:`'Have I seen this?' ⇒ set. 'How many times / where did I see it?' ⇒ dict.`},{t:`drill`,lvl:`easy`,title:`Two Sum`,tag:`LeetCode 1 · asked everywhere`,stmt:"Return the indices of the two numbers that add to `target`. Exactly one solution exists; you may not use the same element twice.",ex:`a = [2,7,11,15], target = 9  ->  [0,1]`,hint:"For each x you need `target - x`. Can you check whether you've already passed it?",approaches:[{name:`Brute force O(n²)`,idea:`Check every pair.`,code:`def two_sum(a, target):
    for i in range(len(a)):
        for j in range(i + 1, len(a)):
            if a[i] + a[j] == target:
                return [i, j]
    return []`,time:`O(n²)`,space:`O(1)`,why:`All n(n−1)/2 pairs in the worst case. This is the answer to give first — it proves you understand the problem before you optimise it.`},{name:`Sort + two pointers`,idea:`On sorted data, move pointers inward based on whether the sum is too big or too small. Only valid if you can return **values**; sorting destroys the original indices.`,code:`def two_sum_values(a, target):
    a = sorted(a)
    lo, hi = 0, len(a) - 1
    while lo < hi:
        s = a[lo] + a[hi]
        if s == target:  return [a[lo], a[hi]]
        if s < target:   lo += 1     # need bigger -> raise the floor
        else:            hi -= 1     # need smaller -> lower the ceiling
    return []`,time:`O(n log n)`,space:`O(n)`,why:"Sort dominates at n log n; the two-pointer sweep is O(n) because the pointers only move inward, so together they take at most n steps. Worth knowing because it generalises to 3Sum, but for this exact problem the hash version is strictly better — and if indices are required you would have to sort `(value, index)` pairs."},{name:`Optimal — one-pass hash map`,idea:`As you scan, ask whether the complement has already appeared. Store value → index as you go.`,code:`def two_sum(a, target):
    seen = {}                    # value -> index
    for i, x in enumerate(a):
        need = target - x
        if need in seen:         # O(1)
            return [seen[need], i]
        seen[x] = i              # store AFTER checking, so we never reuse i
    return []`,time:`O(n) average`,space:`O(n)`,why:"Single pass, O(1) average dict lookup and insert per element. The inner loop of the brute force existed only to *search* for the complement — replacing that search with a hash probe removes the entire factor of n. Inserting after the check is what prevents pairing an element with itself, e.g. `target = 6` with a single `3` in the array."}],takeaway:`When a nested loop searches for a specific value, a hash map removes it. Watch the insert-before-vs-after-check detail — it is where off-by-one bugs live.`},{t:`drill`,lvl:`easy`,title:`Majority element (appears more than n/2 times)`,tag:`Boyer-Moore · LeetCode 169 · asked at Adobe, Amazon`,stmt:`Find the element appearing more than ⌊n/2⌋ times. Assume it always exists.`,ex:`[2,2,1,1,1,2,2]  ->  2`,hint:`Think of each majority element cancelling one non-majority element. What survives?`,approaches:[{name:`Hash count`,idea:`Count occurrences, return the max.`,code:`from collections import Counter

def majority(a):
    return Counter(a).most_common(1)[0][0]`,time:`O(n)`,space:`O(n)`,why:`One pass to count, one to find the max. Optimal in time already — the interviewer's follow-up will be about the O(n) space.`},{name:`Sort`,idea:`An element occupying more than half the array must sit at the middle index after sorting.`,code:`def majority(a):
    return sorted(a)[len(a) // 2]`,time:`O(n log n)`,space:`O(n)`,why:`Cute and correct, because a block of more than n/2 identical values must cover position n//2 no matter where it starts. Slower than the counting version — offer it as a one-liner, not as the answer.`},{name:`Optimal — Boyer-Moore voting`,idea:`Keep a candidate and a counter. A matching element votes +1, a different one votes −1. When the count hits zero, adopt a new candidate.`,code:`def majority(a):
    candidate = None
    count = 0
    for x in a:
        if count == 0:
            candidate = x
        count += 1 if x == candidate else -1
    return candidate            # guaranteed correct ONLY if a majority exists

# if existence is not guaranteed, verify in a second pass:
# return candidate if a.count(candidate) > len(a) // 2 else None`,time:`O(n)`,space:`O(1)`,why:`One pass with two variables. **Why it works:** pair off each majority element with one non-majority element. Since the majority appears more than n/2 times, it strictly outnumbers everything else combined, so it cannot be fully cancelled — whatever survives at the end must be it. Space drops from O(n) to O(1) because we never store the distribution, only the current net vote.`}],takeaway:`Counting is the obvious O(n) time answer; the interesting follow-up is always O(1) space. Voting/cancellation arguments are the tool for 'appears more than half the time'.`},{t:`drill`,lvl:`medium`,title:`Longest consecutive sequence`,tag:`LeetCode 128 · asked at Google, Meta`,stmt:`Find the length of the longest run of consecutive integers present in an **unsorted** array. Required: O(n).`,ex:`[100,4,200,1,3,2]  ->  4   (1,2,3,4)`,hint:`Only start counting from a number whose predecessor is absent — those are the sequence starts.`,approaches:[{name:`Sort`,idea:`Sort, then walk counting consecutive runs.`,code:`def longest_consec(a):
    if not a: return 0
    a = sorted(set(a))
    best = cur = 1
    for i in range(1, len(a)):
        if a[i] == a[i-1] + 1:
            cur += 1
            best = max(best, cur)
        else:
            cur = 1
    return best`,time:`O(n log n)`,space:`O(n)`,why:`Sorting dominates. Perfectly good — but the problem explicitly asks for O(n), which is the signal that a hash-based solution is expected.`},{name:`Optimal — hash set with start detection`,idea:"Put everything in a set. For each value, only begin a walk if `x-1` is absent — meaning `x` is the start of its run. Then walk upward.",code:`def longest_consec(a):
    s = set(a)
    best = 0
    for x in s:
        if x - 1 in s:          # not a start; some other iteration handles this run
            continue
        length = 1
        while x + length in s:  # walk the run upward
            length += 1
        best = max(best, length)
    return best`,time:`O(n)`,space:`O(n)`,why:"It *looks* quadratic because of the nested `while`, and this is the part interviewers probe. The guard `if x - 1 in s: continue` means the inner walk runs **only once per sequence**, starting at its smallest element. Across the whole loop each element is visited by an inner walk at most once, so the total inner work is O(n) — an amortised argument, not a per-iteration one. Add the O(n) set construction and O(n) outer loop and you get O(n) overall, with O(n) space for the set."}],takeaway:`A nested loop is not automatically quadratic. Count total work across all iterations, not the worst single iteration — that reasoning is exactly what distinguishes a strong candidate here.`},{t:`drill`,lvl:`medium`,title:`Group anagrams`,tag:`hashing · LeetCode 49 · asked at Amazon, Uber`,stmt:`Group words that are anagrams of one another.`,ex:`["eat","tea","tan","ate","nat","bat"]
->  [["eat","tea","ate"],["tan","nat"],["bat"]]`,hint:`Anagrams need a canonical form that is identical for the whole group.`,approaches:[{name:`Pairwise comparison`,idea:`Compare each word against each existing group's representative.`,code:`def group_anagrams(words):
    groups = []
    for w in words:
        for g in groups:
            if sorted(g[0]) == sorted(w):
                g.append(w); break
        else:
            groups.append([w])
    return groups`,time:`O(n² · k log k)`,space:`O(n·k)`,why:`n words × up to n groups × an O(k log k) sort per comparison, where k is the word length. The repeated re-sorting of the same representatives is pure waste.`},{name:`Sorted-string key`,idea:`Sort each word's letters to get a canonical key, then bucket by that key in a dict.`,code:`from collections import defaultdict

def group_anagrams(words):
    groups = defaultdict(list)
    for w in words:
        groups["".join(sorted(w))].append(w)     # canonical form
    return list(groups.values())`,time:`O(n · k log k)`,space:`O(n·k)`,why:`Each of the n words is sorted once at O(k log k), then inserted in O(k) (hashing a length-k string reads all k characters). The n² factor vanished because dict lookup replaced the linear scan over groups. Space holds all words plus their keys: O(n·k).`},{name:`Character-count key`,idea:`For a fixed alphabet, a 26-length tuple of counts is a canonical form that costs O(k) instead of O(k log k).`,code:`def group_anagrams(words):
    groups = defaultdict(list)
    for w in words:
        counts = [0] * 26
        for c in w:
            counts[ord(c) - 97] += 1
        groups[tuple(counts)].append(w)          # tuple is hashable; list is not
    return list(groups.values())`,time:`O(n · k)`,space:`O(n·k)`,why:"Building the count vector is one pass over the word, O(k), and hashing a fixed 26-tuple is O(1) in the alphabet size. We removed the log k factor by exploiting the bounded alphabet — the sort was ordering letters we only needed to *count*. In practice the sorted-string version is often faster in Python because `sorted` runs in C while the counting loop runs in bytecode; the asymptotically better solution loses on constants until k is large."}],takeaway:`'Group by equivalence' ⇒ find a canonical key and bucket in a dict. Choosing the cheapest valid canonical form is the optimisation.`}]},{id:`ph-window`,title:`Sliding window`,blurb:`For contiguous subarrays or substrings under a constraint.`,blocks:[{t:`p`,x:"A sliding window maintains a range `[left, right]` and an invariant. The right edge always advances; the left edge advances only to restore the invariant. Because **each pointer moves forward at most n times**, the total work is O(n) even though the code contains a nested `while`."},{t:`code`,x:`# the universal skeleton
left = 0
state = ...                     # whatever summarises the window
for right in range(len(a)):
    add(a[right], state)                    # grow the window
    while not valid(state):                 # shrink until the invariant holds
        remove(a[left], state)
        left += 1
    best = max(best, right - left + 1)      # record the answer`,cap:`Fixed-size windows drop the while and just evict a[right - k] each step.`},{t:`drill`,lvl:`easy`,title:`Maximum sum of a subarray of size k`,tag:`fixed window`,stmt:"Given an array and an integer `k`, return the largest sum of any `k` consecutive elements.",ex:`[2,1,5,1,3,2], k = 3  ->  9  (from [5,1,3])`,approaches:[{name:`Brute force`,idea:`Sum each window from scratch.`,code:`def max_window(a, k):
    return max(sum(a[i:i+k]) for i in range(len(a) - k + 1))`,time:`O(n·k)`,space:`O(k)`,why:"There are n−k+1 windows and each `sum` re-adds k elements. The slice also copies k elements each time, hence O(k) space per iteration. When k ≈ n/2 this is quadratic."},{name:`Optimal — rolling sum`,idea:`Slide the window: add the entering element, subtract the leaving one.`,code:`def max_window(a, k):
    window = sum(a[:k])
    best = window
    for i in range(k, len(a)):
        window += a[i] - a[i - k]     # +entering  -leaving
        best = max(best, window)
    return best`,time:`O(n)`,space:`O(1)`,why:`One O(k) setup plus n−k iterations of O(1) work. Consecutive windows overlap in k−1 elements, so recomputing the full sum discards work we already did — the update reuses it with two arithmetic operations. This is the same 'reuse the neighbour's answer' principle as prefix sums, applied to a fixed-width range.`}],takeaway:`Fixed window ⇒ maintain a rolling aggregate. Adding the newcomer and evicting the departer is always O(1) for sums; for max/min it needs a monotonic deque.`},{t:`drill`,lvl:`medium`,title:`Longest substring without repeating characters`,tag:`variable window · LeetCode 3 · asked at Amazon, Bloomberg, Adobe`,stmt:`Return the length of the longest substring with all-distinct characters.`,ex:`"abcabcbb"  ->  3  ("abc")
"bbbbb"     ->  1
"pwwkew"    ->  3  ("wke")`,hint:`When you hit a repeat, the window's left edge must jump past the previous occurrence of that character.`,approaches:[{name:`Brute force O(n³)`,idea:`Check every substring for uniqueness.`,code:`def longest(s):
    best = 0
    for i in range(len(s)):
        for j in range(i, len(s)):
            sub = s[i:j+1]
            if len(set(sub)) == len(sub):     # O(k) check on an O(k) slice
                best = max(best, len(sub))
    return best`,time:`O(n³)`,space:`O(n)`,why:`O(n²) substrings × O(n) to build the slice and its set. Dies past a few thousand characters.`},{name:`Window with a set`,idea:`Grow right; while the new character is already in the window, shrink from the left.`,code:`def longest(s):
    window = set()
    left = best = 0
    for right, c in enumerate(s):
        while c in window:              # shrink until c is free
            window.remove(s[left])
            left += 1
        window.add(c)
        best = max(best, right - left + 1)
    return best`,time:`O(n)`,space:`O(min(n, alphabet))`,why:"The inner `while` looks like it could make this quadratic, but `left` never decreases and can advance at most n times **in total across the whole run**. So the combined pointer movement is bounded by 2n — amortised O(n). Space is bounded by the window size, which cannot exceed the alphabet size (128 for ASCII), so it is effectively O(1) for fixed alphabets."},{name:`Optimal — jump with last-seen map`,idea:"Instead of shrinking one step at a time, jump `left` directly past the duplicate's last position.",code:`def longest(s):
    last = {}                    # char -> most recent index
    left = best = 0
    for right, c in enumerate(s):
        if c in last and last[c] >= left:
            left = last[c] + 1   # jump, don't crawl
        last[c] = right
        best = max(best, right - left + 1)
    return best`,time:`O(n)`,space:`O(min(n, alphabet))`,why:"Same O(n) class, but now strictly one pass with no inner loop at all — each character is visited exactly once. The `last[c] >= left` guard matters: a stale entry from *before* the current window must be ignored, otherwise `left` would jump backwards and the window would break. This version also generalises better to 'at most k distinct characters' variants."}],takeaway:`Variable window: right always advances, left only advances. Prove linearity by noting each pointer traverses the array once — that argument is what the interviewer wants to hear.`},{t:`drill`,lvl:`hard`,title:`Minimum window substring`,tag:`LeetCode 76 · asked at Meta, Amazon, LinkedIn`,stmt:'Given strings `s` and `t`, return the shortest substring of `s` containing every character of `t` including multiplicities. Return `""` if none exists.',ex:`s = "ADOBECODEBANC", t = "ABC"  ->  "BANC"`,hint:`Track how many required characters are still missing. Expand until nothing is missing, then contract while it stays valid.`,approaches:[{name:`Brute force`,idea:`Test every substring against the requirement.`,code:`from collections import Counter

def min_window(s, t):
    need = Counter(t)
    best = ""
    for i in range(len(s)):
        for j in range(i, len(s)):
            window = Counter(s[i:j+1])
            if all(window[c] >= need[c] for c in need):
                if not best or j - i + 1 < len(best):
                    best = s[i:j+1]
                break
    return best`,time:`O(n² · (n + m))`,space:`O(n + m)`,why:`O(n²) substrings, each rebuilt and recounted from scratch. Unusable, but stating it establishes the baseline you are about to beat.`},{name:`Optimal — window with a 'missing' counter`,idea:"Keep `need` as a deficit map. `missing` counts how many required characters are still unsatisfied. Expand right until `missing == 0`, then shrink left as far as validity allows, recording the best window.",code:`from collections import Counter

def min_window(s, t):
    if not s or not t:
        return ""
    need = Counter(t)
    missing = len(t)                 # counts multiplicities, not distinct chars
    left = 0
    best = (float("inf"), 0, 0)

    for right, c in enumerate(s):
        if need[c] > 0:              # this char was still needed
            missing -= 1
        need[c] -= 1                 # may go negative = surplus

        while missing == 0:          # window is valid -> try to shrink it
            if right - left + 1 < best[0]:
                best = (right - left + 1, left, right)
            need[s[left]] += 1
            if need[s[left]] > 0:    # popping this one breaks validity
                missing += 1
            left += 1
