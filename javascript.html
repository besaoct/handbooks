}));`},{q:`What is the difference between PUT and PATCH?`,d:1,p:`NodeHTTP`,c:[`AMZ`,`TCS`,`SHOP`,`STRP`],a:"`PUT` replaces the entire resource and is idempotent — sending it twice leaves the same state. `PATCH` applies a partial modification and is not necessarily idempotent. `POST` creates and is not idempotent, which is why retrying a payment `POST` needs an idempotency key."},{q:`Which HTTP status codes should an API actually use?`,d:1,p:`NodeHTTP`,c:[`AMZ`,`STRP`,`SHOP`,`TCS`],a:"200 OK, 201 Created with a `Location`, 204 No Content for deletes; 400 malformed, 401 unauthenticated, 403 authenticated-but-forbidden, 404 missing, 409 conflict, 422 semantically invalid, 429 rate-limited with `Retry-After`; 500 unexpected, 503 with `Retry-After` when shedding load. The 401/403 distinction is a common interview checkpoint."},{q:`How do you implement rate limiting in a Node API?`,d:2,p:`NodeHTTP`,c:[`AMZ`,`STRP`,`CLDF`,`ATLS`],a:"A counter per key in Redis so it is shared across instances — a per-process counter silently multiplies your limit by the instance count. Token bucket allows bursts and suits user-facing APIs; a sliding-window counter is cheap and accurate. Always return `429` with `Retry-After` and rate-limit headers."},{q:`What is the N+1 query problem in an API?`,d:2,p:`NodeHTTP`,c:[`AMZ`,`SHOP`,`ATLS`,`META`],a:"Fetching a list with one query then one query per item for related data — invisible with three test rows and fatal with a thousand. Fix by joining, by batching with a single `WHERE id IN (…)`, or with a DataLoader that coalesces per-item requests within one tick and caches by key."},{q:`How would you design authentication for a REST API?`,d:3,p:`NodeHTTP`,c:[`AMZ`,`STRP`,`ATLS`,`PYPL`],a:"A short-lived access token (JWT or opaque) plus a long-lived refresh token in an `HttpOnly`, `Secure`, `SameSite` cookie, with rotation and reuse detection on refresh. Keep a server-side revocation list or use short expiry, since a JWT cannot otherwise be revoked. Hash passwords with argon2 or bcrypt — never a fast hash."},{q:`What security middleware belongs on every Node service?`,d:2,p:`Security`,c:[`AMZ`,`STRP`,`CLDF`],a:"`helmet` for security headers including CSP and HSTS; strict CORS with an origin allowlist rather than `*`; a body-size limit to stop memory exhaustion; rate limiting; input validation with a schema library such as zod; and `express-rate-limit`'s trust-proxy configuration set correctly, or every client appears to share one IP."}],ae=[{q:"Implement `Array.prototype.map`.",d:2,p:`Polyfill`,c:[`AMZ`,`TCS`,`FLPK`,`PAYTM`],a:"Iterate by index, skip holes with an `in` check to match native sparse behaviour, and pass `(value, index, array)` plus the optional `thisArg`.",code:`Array.prototype.myMap = function (cb, thisArg) {
  if (typeof cb !== 'function') throw new TypeError(cb + ' is not a function');
  const out = new Array(this.length);
  for (let i = 0; i < this.length; i++) {
    if (i in this) out[i] = cb.call(thisArg, this[i], i, this);
  }
  return out;

}`},{q:`Implement an LRU cache with O(1) get and put.`,d:3,p:`DSA`,c:[`AMZ`,`GOOG`,`META`,`MSFT`,`FLPK`],a:"A `Map` gives insertion-ordered iteration, so delete-then-set moves an entry to the most recent position and `keys().next().value` is the least recent. That is the whole algorithm without needing a hand-built doubly linked list.",code:`class LRU {

sion avoids a `RangeError` on inputs thousands of levels deep."},{q:`Implement a promise-based sleep and use it to build a rate-limited queue.`,d:2,p:`DSA`,c:[`AMZ`,`UBER`,`STRP`],a:"`sleep = ms => new Promise(r => setTimeout(r, ms))`. A rate-limited queue then runs tasks with a minimum spacing, or uses a token bucket refilled on a timer for burst tolerance."},{q:`Write a function that runs N async tasks with at most K in flight.`,d:3,p:`DSA`,c:[`AMZ`,`GOOG`,`UBER`,`STRP`],a:`Spawn K worker loops that each claim the next index from a shared counter and await the task. Safe without locks because JavaScript is single-threaded, so no interleaving occurs between the read and the increment.`},{q:`Serialise and deserialise a binary tree.`,d:3,p:`DSA`,c:[`AMZ`,`GOOG`,`META`],a:"Preorder traversal writing `null` markers gives an unambiguous encoding; deserialise by consuming the same sequence recursively. Level-order with markers is the alternative and is easier to read for debugging."},{q:`Implement a virtualised list for 100,000 rows.`,d:3,p:`DSA`,c:[`META`,`ATLS`,`AIRB`,`FLPK`],a:"Render only the visible window plus an overscan buffer: compute `startIndex` from `scrollTop / rowHeight`, render `visibleCount` rows, and position them with a spacer of total height plus a `translateY` offset. Variable heights need a measured-offset cache and binary search."},{q:`Write a function to chunk an array into groups of n.`,d:1,p:`DSA`,c:[`TCS`,`AMZ`,`ZOHO`,`PAYTM`],a:"`Array.from({ length: Math.ceil(arr.length / n) }, (_, i) => arr.slice(i * n, i * n + n))`. Guard `n < 1`, which would otherwise loop forever in a manual implementation."},{q:`Find the first non-repeating character in a string.`,d:1,p:`DSA`,c:[`TCS`,`AMZ`,`INFY`,`ZOHO`],a:"Count with a `Map` in one pass — `Map` preserves insertion order — then scan for the first entry with count 1. O(n) time and O(k) space, versus O(n²) for `indexOf === lastIndexOf`."},{q:"What is the difference between `interface` and `type`?",d:1,p:`TS`,c:[`MSFT`,`AMZ`,`ATLS`,`EPAM`],a:"`interface` supports declaration merging and is idiomatic for object shapes and public APIs. `type` can express unions, intersections, tuples, mapped and conditional types, and primitives. Prefer `interface` for objects you may extend, `type` for everything else — the performance difference is negligible in most codebases."},{q:"What is the difference between `any`, `unknown` and `never`?",d:2,p:`TS`,c:[`MSFT`,`AMZ`,`ATLS`],a:"`any` disables checking and spreads silently. `unknown` is the safe top type — you must narrow before using it, which is what an API boundary should return. `never` is the bottom type: an empty union, the return type of a function that always throws, and what an exhaustive `switch` narrows to in its default branch."},{q:`What are generics used for and when do you need a constraint?`,d:2,p:`TS`,c:[`MSFT`,`AMZ`,`ATLS`,`EPAM`],a:"To relate input and output types instead of widening to `any`: `function first<T>(a: T[]): T | undefined`. Add `extends` when the body needs a capability — `<T extends { id: string }>` — so the compiler allows the property access while still preserving the concrete type at the call site."},{q:`What is a discriminated union and why is it the key TypeScript pattern?`,d:2,p:`TS`,c:[`MSFT`,`ATLS`,`STRP`,`VERC`],a:"A union of object types sharing a literal `kind` field. Narrowing on that field gives exhaustive, type-safe branching, and adding a variant produces a compile error in every `switch` that does not handle it — which is how you make illegal states unrepresentable rather than merely documented."},{q:"What are `Partial`, `Pick`, `Omit`, `Record` and `ReturnType`?",d:1,p:`TS`,c:[`MSFT`,`AMZ`,`ATLS`],a:"Built-in utility types: make all properties optional; select or exclude named properties; build a key-to-value map; and extract a function's return type. Combined with `typeof` they let you derive types from values rather than maintaining two parallel definitions."},{q:`What is a type guard?`,d:2,p:`TS`,c:[`MSFT`,`ATLS`,`AMZ`],a:"A function returning `x is T`, which narrows the type in the caller's branch. Built-in narrowing comes from `typeof`, `instanceof`, `in` and literal comparisons. An `asserts x is T` signature narrows for the rest of the enclosing scope instead — useful for validation helpers."},{q:"What does `satisfies` do?",d:2,p:`TS`,c:[`MSFT`,`VERC`,`ATLS`],a:"Checks that a value conforms to a type **without widening it**, so you keep the precise literal types while still catching mistakes. `const config = {...} satisfies Config` validates the shape but leaves keys and literal values narrow for downstream inference — which a type annotation would discard."},{q:`What is the difference between a mock, a stub and a spy?`,d:2,p:`Testing`,c:[`AMZ`,`ATLS`,`MSFT`,`EPAM`],a:`A **spy** records calls while keeping real behaviour. A **stub** replaces behaviour with a canned response. A **mock** is a stub with assertions about how it was called. Prefer spies and stubs; heavy mocking couples tests to implementation and makes refactoring break them.`},{q:`How do you test asynchronous code reliably?`,d:2,p:`Testing`,c:[`AMZ`,`ATLS`,`STRP`],a:"Return or await the promise so the runner tracks it; use fake timers to advance `setTimeout` deterministically rather than sleeping; and assert on outcomes rather than on timing. Never use a bare `setTimeout` to 'wait' — that is how a suite becomes flaky."},{q:`What makes a test flaky and how do you fix it?`,d:2,p:`Testing`,c:[`GOOG`,`AMZ`,`ATLS`,`NFLX`],a:`Shared mutable state between tests, real timers and clocks, real network, and ordering dependencies. Fix by isolating state per test, injecting the clock, stubbing the network, and randomising test order in CI so hidden coupling surfaces immediately rather than in six months.`},{q:`What should you actually assert in a unit test?`,d:1,p:`Testing`,c:[`AMZ`,`ATLS`,`EPAM`],a:`Observable behaviour through the public interface — the return value, the emitted event, the call made to a collaborator. Asserting on private state or on the exact sequence of internal calls produces tests that fail on every refactor while still missing real regressions.`},{q:`How would you design a real-time collaborative editor?`,d:3,p:`SysDesign`,c:[`GOOG`,`ATLS`,`META`,`AIRB`],a:`WebSockets for transport; CRDTs or operational transformation to merge concurrent edits without a lock; per-document sharding so one document's traffic lands on one node; presence in Redis with a TTL heartbeat; and periodic snapshots plus an operation log so a reconnecting client can catch up from its last sequence number.`},{q:`How would you design a front-end for a feed with 10,000 items?`,d:3,p:`SysDesign`,c:[`META`,`SNAP`,`FLPK`,`AIRB`],a:"Windowed rendering so only the visible rows exist in the DOM; keyset pagination rather than offset so pages are stable; an `IntersectionObserver` sentinel for loading; optimistic updates with rollback; and images lazy-loaded with reserved dimensions so CLS stays near zero."},{q:`How would you design a Node service handling file uploads?`,d:3,p:`SysDesign`,c:[`AMZ`,`SHOP`,`DBX`,`UBER`],a:`Never buffer: stream directly to object storage, or better issue a **pre-signed URL** so the file never touches your servers at all. Validate the content type by sniffing magic bytes rather than trusting the extension, enforce a size limit at the proxy, scan asynchronously, and record metadata in a database keyed by the storage object.`},{q:`How would you add observability to a Node service?`,d:2,p:`NodeProd`,c:[`AMZ`,`NFLX`,`UBER`,`DDOG`],a:"Structured JSON logs with a correlation ID propagated via `AsyncLocalStorage`; RED metrics (rate, errors, duration) per endpoint plus event-loop lag and heap size; and distributed tracing with OpenTelemetry. Event-loop lag is the Node-specific signal that tells you something is blocking."},{q:"What is `AsyncLocalStorage` and what problem does it solve?",d:3,p:`NodeProd`,c:[`AMZ`,`NFLX`,`UBER`,`DDOG`],a:"Node's continuation-local storage: a store that persists across `await` boundaries and callbacks for one logical operation. It is how you attach a request ID or a tenant context to every log line and database call without threading a parameter through every function signature."}],oe={Engine:`Engine & Execution`,Types:`Types & Coercion`,Scope:`Scope & Closures`,This:`this, call, apply, bind`,Objects:`Objects & Prototypes`,Classes:`Classes & OOP`,Functions:`Functions & FP`,Arrays:`Arrays & Iteration`,Iterators:`Iterators & Generators`,EventLoop:`Event Loop`,Promises:`Promises & async/await`,ES6:`ES6+ Features`,Errors:`Errors & Debugging`,Memory:`Memory & Performance`,Regex:`Regex & Strings`,DOM:`DOM & Events`,Browser:`Browser APIs & Storage`,Network:`HTTP, Fetch & CORS`,Security:`Web Security`,Perf:`Web Performance`,NodeCore:`Node Runtime`,Modules:`Modules: CJS & ESM`,NodeFS:`Node Core Modules`,Streams:`Streams & Buffers`,NodeHTTP:`HTTP & Express`,NodeConc:`Cluster & Workers`,NodeProd:`Node in Production`,Testing:`Testing & Tooling`,Polyfill:`Implement It`,DSA:`Coding Problems`,SysDesign:`System Design`,TS:`TypeScript`},se={GOOG:`Google`,META:`Meta`,AMZ:`Amazon`,MSFT:`Microsoft`,APPL:`Apple`,NFLX:`Netflix`,UBER:`Uber`,ATLS:`Atlassian`,STRP:`Stripe`,SHOP:`Shopify`,AIRB:`Airbnb`,LINK:`LinkedIn`,SNAP:`Snap`,DBX:`Dropbox`,SFDC:`Salesforce`,ADBE:`Adobe`,ORCL:`Oracle`,IBM:`IBM`,PYPL:`PayPal`,TWLO:`Twilio`,VERC:`Vercel`,GTHB:`GitHub`,SPOT:`Spotify`,BKNG:`Booking.com`,ZLND:`Zalando`,TCS:`TCS`,INFY:`Infosys`,WIPRO:`Wipro`,COG:`Cognizant`,ACC:`Accenture`,CAP:`Capgemini`,HCL:`HCL`,TECHM:`Tech Mahindra`,ZOHO:`Zoho`,FRSH:`Freshworks`,FLPK:`Flipkart`,SWGY:`Swiggy`,ZOMT:`Zomato`,PAYTM:`Paytm`,PHPE:`PhonePe`,RZRP:`Razorpay`,CRED:`CRED`,MYNT:`Myntra`,OLA:`Ola`,DREAM:`Dream11`,EPAM:`EPAM`,TWTR:`X (Twitter)`,COIN:`Coinbase`,DDOG:`Datadog`,CLDF:`Cloudflare`,GS:`Goldman Sachs`,FIG:`Figma`,JPMC:`JPMorgan`,DELOITTE:`Deloitte`},ce={1:{label:`Easy`,c:`#3f7a45`,bg:`#eaf3ea`},2:{label:`Medium`,c:`#b4
