                      │  process.nextTick*  │
                      └──────────┬──────────┘
                                 │ empty?
                                 ▼
                      ┌─────────────────────┐
                      │   RENDER (browser)  │  ← rAF, style, layout, paint
                      └──────────┬──────────┘   at most ~60x/second
                                 ▼
                      ┌─────────────────────┐
                      │  MACROTASK QUEUE    │  ← take exactly ONE
                      │  setTimeout         │
                      │  setInterval        │
                      │  I/O, events        │
                      │  setImmediate (Node)│
                      └──────────┬──────────┘
                                 │
                                 └──▶ back to the stack

THE RULE:  run a macrotask → drain ALL microtasks → maybe render
           → run the next macrotask → drain ALL microtasks → …

* process.nextTick has its own queue drained BEFORE promise microtasks`,cap:`Memorise this diagram. Every ordering puzzle is an application of it.`},{t:`q`,lvl:`medium`,title:`Order these eight operations`,tag:`the canonical event loop question`,stmt:`Predict the exact output order, then justify each position.`,approaches:[{name:`The code`,idea:`Synchronous, microtasks, then macrotasks.`,code:`console.log('1 sync start');

setTimeout(() => console.log('2 timeout 0'), 0);

Promise.resolve().then(() => console.log('3 promise A'));

queueMicrotask(() => console.log('4 microtask'));

Promise.resolve().then(() => {
  console.log('5 promise B');
  Promise.resolve().then(() => console.log('6 nested promise'));
});

setTimeout(() => console.log('7 timeout 10'), 10);

(async () => {
  console.log('8 async fn body');        // SYNCHRONOUS until the first await
  await null;
  console.log('9 after await');          // becomes a microtask
})();

console.log('10 sync end');`,out:`1 sync start
8 async fn body
10 sync end
--- stack empty, drain microtasks ---
3 promise A
4 microtask
5 promise B
9 after await
6 nested promise
--- microtasks empty, take one macrotask ---
2 timeout 0
7 timeout 10`,why:"Three things to notice. An `async` function body runs **synchronously** up to its first `await` — that is why `8` appears before `10`. The microtask queue is FIFO, so `3`, `4`, `5`, `9` come in scheduling order; `6` was queued *during* the drain and still runs before any macrotask, because the queue is drained to exhaustion rather than snapshot. And the two timeouts are separate macrotasks, so the loop returns to the microtask check between them."},{name:`The mental procedure`,idea:`Four passes, applied in order.`,code:`1. Read the file top to bottom. Everything not inside a callback
   is SYNCHRONOUS — log it first, in source order.
   (including an async function body up to its first await)

2. Collect what was scheduled as MICROTASKS:
   .then / .catch / .finally callbacks
   the continuation after each await
   queueMicrotask
   -> emit them FIFO, and append any queued during the drain

3. (browser) rAF callbacks, then style/layout/paint

4. Take ONE macrotask (earliest timer, then I/O), run it,
   then go back to step 2.`,why:"Applying this procedure mechanically answers every ordering question, including the Node ones. The single most common mistake is treating an `async` function as if it were deferred — it is not; only the part after `await` is."}],takeaway:"Sync → all microtasks → render → one macrotask → all microtasks → … An async function body is synchronous until its first `await`."},{t:`guess`,code:`console.log('A');

setTimeout(() => {
  console.log('B');
  Promise.resolve().then(() => console.log('C'));
}, 0);

setTimeout(() => console.log('D'), 0);

Promise.resolve().then(() => console.log('E'));

console.log('F');`,out:`A
F
E
B
C
D`,why:"After the synchronous `A` and `F`, the microtask `E` runs. Then the **first** macrotask fires, logging `B` and queueing microtask `C`. Critically, the loop drains microtasks **between macrotasks**, so `C` runs before the second timeout `D`. Getting `C` before `D` is the point of this question — a candidate who says `B, D, C` is treating macrotasks as a batch."},{t:`q`,lvl:`hard`,title:`Starve the event loop`,tag:`why microtasks can hang a page`,stmt:`Show how an infinite microtask chain freezes the browser while an infinite macrotask chain does not, and explain the difference.`,approaches:[{name:`The difference`,idea:`Microtasks are drained to exhaustion; macrotasks are taken one at a time.`,code:`// FREEZES THE TAB — the microtask queue never empties, so the
// browser never reaches the render step or any macrotask
function starve() {
  Promise.resolve().then(starve);
}
starve();
// no rendering, no clicks, no timers, forever

// DOES NOT FREEZE — each iteration is a separate macrotask, so the
// loop gets to render and process input between them
function polite() {
  setTimeout(polite, 0);
}
polite();
// page stays responsive; the tab still repaints

// also freezes: a long synchronous loop
while (Date.now() < end) { }        // blocks everything, same effect`,why:"The rule 'drain **all** microtasks' includes ones added during the drain, so a self-scheduling microtask is an infinite loop the event loop cannot escape. A self-scheduling macrotask yields control after each iteration. This is the practical reason to be careful with recursive promise chains, and why `queueMicrotask` should never be used for work that could repeat unboundedly."},{name:`Yielding correctly`,idea:`Chunk long work so the loop can render and handle input.`,code:`// BAD: blocks for seconds
function processAll(items) {
  for (const item of items) heavyWork(item);   // 1e6 items
}

// GOOD: yield to the event loop between chunks
async function processAll(items, chunkSize = 500) {
  for (let i = 0; i < items.length; i += chunkSize) {
    for (const item of items.slice(i, i + chunkSize)) heavyWork(item);
    await new Promise(r => setTimeout(r, 0));   // yield: MACROtask
  }
}

// BETTER: yield only when the browser says it needs the frame
async function processAll(items) {
  let i = 0;
  while (i < items.length) {
    const deadline = performance.now() + 5;     // 5ms budget per frame
    while (i < items.length && performance.now() < deadline) {
      heavyWork(items[i++]);
    }
    await new Promise(r => requestAnimationFrame(r));
  }
}

// BEST for genuinely CPU-bound work: move it off the main thread
const worker = new Worker('process.js');
worker.postMessage(items);`,why:"`await Promise.resolve()` does **not** yield — it queues a microtask, which runs before rendering, so the page stays frozen. You must yield with a macrotask (`setTimeout`) or a frame callback. The 5 ms budget version is the shape used by React's scheduler: do as much as fits in the frame, then hand control back. For work measured in seconds, none of this is enough and a worker is the right answer."}],takeaway:"`await Promise.resolve()` does not yield to the browser — it queues a microtask. Yield with `setTimeout` or `requestAnimationFrame`, and move CPU-bound work to a worker."}]},{id:`el-node`,title:`Node's event loop`,blurb:`Node's loop has named phases and two extra queues. Most ordering surprises in Node come from those two.`,blocks:[{t:`code`,x:`   ┌──────────────────────────────┐
┌─▶│           timers             │  setTimeout, setInterval callbacks
│  └──────────────┬───────────────┘
│  ┌──────────────▼───────────────┐
│  │      pending callbacks       │  deferred system errors (e.g. ECONNREFUSED)
│  └──────────────┬───────────────┘
│  ┌──────────────▼───────────────┐
│  │       idle, prepare          │  internal
│  └──────────────┬───────────────┘      ┌────────────────┐
│  ┌──────────────▼───────────────┐      │   incoming:    │
│  │            poll              │◀─────┤ connections,   │
│  │  retrieve new I/O events;    │      │ data, etc.     │
│  │  BLOCKS here when idle       │      └────────────────┘
│  └──────────────┬───────────────┘
│  ┌──────────────▼───────────────┐
│  │            check             │  setImmediate callbacks
│  └──────────────┬───────────────┘
│  ┌──────────────▼───────────────┐
└──┤       close callbacks        │  socket.on('close'), etc.
   └──────────────────────────────┘

BETWEEN EVERY PHASE (and between each callback), Node drains:
   1. the process.nextTick queue   ← higher priority
   2. the microtask queue          ← promises

That priority order is Node-specific and is the source of most
"why did this run first" confusion.`,cap:"libuv's phases. `poll` is where Node spends its idle time."},{t:`q`,lvl:`hard`,title:"`setTimeout(0)` versus `setImmediate`",tag:`the Node ordering question`,stmt:`Explain why the order of these two is non-deterministic at the top level but deterministic inside an I/O callback.`,approaches:[{name:`At the top level — non-deterministic`,idea:`It depends on how long process startup took.`,code:`setTimeout(() => console.log('timeout'), 0);
setImmediate(() => console.log('immediate'));

// run this 10 times and you will see BOTH orders:
//   timeout, immediate
//   immediate, timeout

// WHY: setTimeout(fn, 0) is clamped to 1ms. The loop enters the
// timers phase and asks "has 1ms elapsed since scheduling?"
//   - if process startup took >= 1ms  -> the timer is ready, fires first
//   - if startup was faster           -> timers phase finds nothing,
//                                        loop proceeds to check phase,
//                                        immediate fires first
// The answer depends on machine load. It is genuinely a race.`,why:"This is a favourite question because the correct answer is 'it is non-deterministic, and here is the mechanism'. Candidates who confidently give one fixed order have memorised a blog post. The clamping of `setTimeout(fn, 0)` to 1 ms is specified behaviour, not an implementation quirk."},{name:`Inside an I/O callback — deterministic`,idea:`You are already past the timers phase.`,code:`const fs = require('fs');

fs.readFile(__filename, () => {
  setTimeout(() => console.log('timeout'), 0);
  setImmediate(() => console.log('immediate'));
});

// ALWAYS:
//   immediate
//   timeout

// WHY: the callback runs in the POLL phase. The next phase is
// CHECK, where setImmediate lives — so it fires on this same
// turn. The timer must wait for the loop to come all the way
// around to the timers phase on the NEXT iteration.`,why:"The rule that follows: **inside an I/O callback, `setImmediate` always beats `setTimeout(0)`**. This is why `setImmediate` is the correct choice for 'run after the current I/O completes but before any timers' — for example, deferring work in a stream handler without letting a timer jump ahead of it."},{name:`process.nextTick — a third option`,idea:`Not part of the loop at all; it runs before everything.`,code:`setTimeout(() => console.log('1 timeout'), 0);
setImmediate(() => console.log('2 immediate'));
Promise.resolve().then(() => console.log('3 promise'));
process.nextTick(() => console.log('4 nextTick'));
console.log('5 sync');

// output:
// 5 sync
// 4 nextTick     <- nextTick queue drains FIRST
// 3 promise      <- then microtasks
// 1 timeout / 2 immediate  (racy, as above)

// nextTick can STARVE the loop, just like microtasks:
function starve() { process.nextTick(starve); }
starve();       // the event loop never advances. No I/O ever completes.`,why:"`process.nextTick` has a dedicated queue drained before promise microtasks, which makes it the highest-priority deferral in Node. Its legitimate use is narrow: letting a caller attach listeners before you emit an event, or making an API consistently asynchronous. The Node docs themselves recommend `setImmediate` for almost everything else, precisely because `nextTick` can starve the loop."}],takeaway:"Top level: `setTimeout(0)` vs `setImmediate` is a genuine race. Inside I/O: `setImmediate` always wins. `process.nextTick` beats both and can starve the loop."},{t:`guess`,setup:`// Node.js`,code:`console.log('start');

setTimeout(() => {
  console.log('t1');
  process.nextTick(() => console.log('t1-tick'));
  Promise.resolve().then(() => console.log('t1-promise'));
}, 0);

setTimeout(() => console.log('t2'), 0);

process.nextTick(() => console.log('tick1'));
Promise.resolve().then(() => console.log('p1'));

console.log('end');`,out:`start
end
tick1
p1
t1
t1-tick
t1-promise
t2`,why:"Sync first (`start`, `end`). Then the nextTick queue (`tick1`), then microtasks (`p1`). Then the timers phase: `t1` runs, and **before moving to the next timer callback** Node drains nextTick then microtasks — hence `t1-tick`, `t1-promise`, and only then `t2`. The drain happens between individual callbacks, not merely between phases, which is the detail this question tests."},{t:`q`,lvl:`hard`,title:"What actually happens during `fs.readFile`",tag:`libuv and the thread pool`,stmt:`Trace a file read from the JavaScript call to the callback firing, naming every component involved.`,approaches:[{name:`The path`,idea:`Node is single-threaded for JavaScript, not for I/O.`,code:`fs.readFile('big.txt', cb);

1. JS calls into the fs binding (C++)
2. libuv sees this is FILE I/O, which has no portable async syscall
   -> it submits the work to the THREAD POOL (4 threads by default)
3. JS returns IMMEDIATELY; the main thread continues
4. a pool thread performs the blocking read(2) syscall
5. on completion, the thread pushes the result to the completion queue
   and signals the loop
6. the POLL phase picks it up and runs cb on the MAIN thread

// which operations use the thread pool:
//   fs.*            (all file I/O)
//   dns.lookup      (but NOT dns.resolve — that is real async network)
//   crypto.pbkdf2, scrypt, randomBytes, and zlib
//
// which use the OS's async facilities (epoll/kqueue/IOCP) instead:
//   net / http sockets — NO thread pool involvement

process.env.UV_THREADPOOL_SIZE = 8;   // must be set BEFORE any I/O`,why:"The distinction between thread-pool I/O and epoll-based network I/O is the important part. Network sockets scale to tens of thousands of concurrent connections because the OS notifies the loop; file operations do not, because there is no portable async file API — so four concurrent `readFile` calls saturate the default pool, and a fifth waits. This is why a service doing heavy file or crypto work benefits from raising `UV_THREADPOOL_SIZE`, while one doing pure HTTP does not."},{name:`The blocking mistake`,idea:`One synchronous call stops everything for every user.`,code:`// BLOCKS THE ENTIRE PROCESS — every request, every timer
app.get('/report', (req, res) => {
  const data = fs.readFileSync('huge.csv');   // 2 seconds of nothing
  res.send(process(data));
});

// also blocking, and much less obvious:
JSON.parse(hugeString);                 // synchronous, no way around it
crypto.pbkdf2Sync(pw, salt, 1e6, 64, 'sha512');
someArray.sort(expensiveComparator);    // 1e7 elements
new RegExp(userInput).test(long);       // catastrophic backtracking (ReDoS)

// the fixes, in order of preference:
//   1. use the async variant                 fs.promises.readFile
//   2. stream instead of buffering           createReadStream
//   3. move it to a worker thread            new Worker(...)
//   4. move it out of the process            a queue + separate service`,why:"The 'Node is fast because it is non-blocking' claim holds only while nothing blocks. A single synchronous 200 ms operation in a request handler caps the whole process at five requests per second regardless of how many cores the machine has. `JSON.parse` on a large payload is the one people miss most often, because it does not look like I/O."}],takeaway:`File, DNS-lookup, crypto and zlib go to a four-thread pool; sockets use epoll/kqueue and do not. Anything synchronous blocks every concurrent request in the process.`},{t:`qa`,q:`Is the event loop part of JavaScript?`,a:"No. The ECMAScript specification defines **jobs** and a job queue — that is where promise microtasks come from — but it defines no event loop, no timers and no I/O. The event loop is specified by the host: the HTML specification for browsers, and libuv for Node. That is why `setTimeout` behaves differently in the two, why Node has `setImmediate` and browsers do not, and why microtask ordering is the only part that is identical everywhere."},{t:`qa`,q:"Why is `setTimeout(fn, 0)` not actually zero?",a:"The HTML specification clamps timeouts to a minimum of **1 ms**, and additionally clamps nested timeouts to **4 ms** after five levels of nesting — a rule from 2010 to stop runaway timer loops. Beyond that, the delay is a *minimum*, not a guarantee: the callback runs only once the stack is empty, all microtasks are drained, and the timers phase is reached. A long synchronous block or a busy microtask queue can delay a `setTimeout(fn, 0)` by seconds. Background tabs clamp much harder, often to once per second or worse."},{t:`qa`,q:"What is the difference between `queueMicrotask` and `Promise.resolve().then`?",a:"Functionally almost none — both queue a microtask. `queueMicrotask` is more direct and slightly cheaper because it allocates no promise, and it is clearer about intent. The meaningful difference is error handling: an exception in a `queueMicrotask` callback becomes an uncaught global error, whereas one inside `.then` rejects the resulting promise and can be caught downstream. Use `queueMicrotask` for fire-and-forget deferral and promises when the result matters."},{t:`qa`,q:"Where does `requestAnimationFrame` fit?",a:"Between the microtask drain and the paint, at most once per display refresh. Callbacks registered with it run just before style calculation and layout, which makes it the correct place for visual updates — writing to the DOM there means the change is painted in the same frame with no intermediate layout. It is also automatically throttled to near-zero in a background tab, unlike `setTimeout`, which makes it the better choice for animation on every axis. It does not exist in Node."}]}]},y={id:`promises`,num:`09`,title:`Promises & async/await`,kicker:`States, chaining, the four combinators, cancellation and every error-handling trap`,sections:[{id:`pr-model`,title:`The promise model`,blocks:[{t:`code`,x:`A promise is a state machine with exactly three states and
ONE irreversible transition:

           ┌──────────┐
           │ PENDING  │
           └────┬─────┘
        resolve │ reject
        ┌───────┴────────┐
        ▼                ▼
  ┌───────────┐    ┌───────────┐
  │ FULFILLED │    │ REJECTED  │      once settled, FOREVER settled
  │  (value)  │    │ (reason)  │      further calls are ignored
  └───────────┘    └───────────┘

.then(onFulfilled, onRejected)   -> a NEW promise
.catch(onRejected)               -> .then(undefined, onRejected)
.finally(onFinally)              -> runs either way, PASSES THROUGH
                                    the original value/reason

Every .then callback runs as a MICROTASK — never synchronously,
even if the promise is already settled.`,cap:`Three states, one transition, and every handler is a microtask.`},{t:`q`,lvl:`medium`,title:`What each link in a chain returns`,tag:`chaining semantics`,stmt:"Explain how the return value of a `.then` callback determines the next promise, covering all four cases.",approaches:[{name:`The four cases`,idea:`Return a value, a promise, nothing, or throw.`,code:`Promise.resolve(1)
  .then(v => v + 1)               // 1. plain value -> fulfils with 2
  .then(v => Promise.resolve(v * 10))  // 2. a promise -> ADOPTS it -> 20
  .then(v => { console.log(v); })      // 3. no return -> fulfils with undefined
  .then(v => { throw new Error('x'); })// 4. throws -> REJECTS the next one
  .then(v => console.log('skipped'))   //    skipped: it has no onRejected
  .catch(e => {
    console.log('caught', e.message);
    return 'recovered';                //    catch RETURNS -> chain fulfils again
  })
  .then(v => console.log(v))           //    'recovered'
  .finally(() => console.log('done')); //    runs, passes value through`,out:`20
caught x
recovered
done`,why:"Case 2 is the important one: returning a promise **adopts** it, so the chain waits and unwraps a single level rather than fulfilling with a promise object. Case 4 shows that a `.then` without an `onRejected` handler is transparent to rejections — they skip forward to the next `.catch`. And a `.catch` that returns normally puts the chain back into the fulfilled state, which is how recovery works."},{name:`finally is not then`,idea:`It ignores its return value — except for a promise or a throw.`,code:`Promise.resolve('value')
  .finally(() => 'ignored')
  .then(v => console.log(v));       // 'value' — NOT 'ignored'

Promise.reject(new Error('boom'))
  .finally(() => console.log('cleanup'))
  .catch(e => console.log('still rejected:', e.message));

// but finally CAN change the outcome by throwing
Promise.resolve('value')
  .finally(() => { throw new Error('from finally'); })
  .catch(e => console.log(e.message));   // 'from finally'

// and it WAITS for a returned promise before passing through
Promise.resolve('v')
  .finally(() => new Promise(r => setTimeout(r, 1000)))
  .then(v => console.log(v));       // 'v', one second later`,why:"`finally` is for cleanup that must not alter the result — closing a spinner, releasing a lock. It passes the original value or reason through, which is exactly right for that job. The two exceptions are worth knowing: it can still reject by throwing, and it delays the chain if it returns a promise."}],takeaway:"Return a value to continue, a promise to adopt it, throw to reject. `catch` returning normally resumes the fulfilled path. `finally` passes through."},{t:`guess`,code:`console.log('1');
const p = new Promise((resolve) => {
  console.log('2');                 // executor is SYNCHRONOUS
  resolve('3');
  console.log('4');                 // still runs after resolve
});
p.then(v => console.log(v));
console.log('5');`,out:`1
2
4
5
3`,why:"The executor function passed to `new Promise` runs **synchronously and immediately** — that is why `2` and `4` appear before `5`. `resolve()` does not return from the executor; code after it still runs, which is a common source of bugs where cleanup happens after the promise has already settled. The `.then` callback is a microtask, so `3` comes last after the synchronous script finishes."},{t:`q`,lvl:`hard`,title:`The four combinators`,tag:`all, allSettled, race, any`,stmt:`For each, state what settles it, what the result looks like, and when it is the right choice.`,approaches:[{name:`Comparison`,idea:`They differ on when they settle and what they collect.`,code:`const ok   = (v, ms) => new Promise(r => setTimeout(() => r(v), ms));
const fail = (e, ms) => new Promise((_, j) => setTimeout(() => j(new Error(e)), ms));

// Promise.all — ALL fulfil, or the FIRST rejection wins
await Promise.all([ok('a', 10), ok('b', 20)]);       // ['a', 'b']
await Promise.all([ok('a', 10), fail('x', 5)]);      // rejects with Error('x')
//   fails fast: does NOT wait for the others, but does not cancel them either

// Promise.allSettled — waits for EVERY one, never rejects
await Promise.allSettled([ok('a', 10), fail('x', 5)]);
// [ { status: 'fulfilled', value: 'a' },
//   { status: 'rejected', reason: Error('x') } ]

// Promise.race — the first to SETTLE, fulfilled or rejected
await Promise.race([ok('a', 50), fail('x', 10)]);    // rejects with Error('x')

// Promise.any — the first to FULFIL; rejects only if ALL reject
await Promise.any([fail('x', 5), ok('b', 20)]);      // 'b'
await Promise.any([fail('x', 5), fail('y', 10)]);
//   rejects with AggregateError, .errors = [Error('x'), Error('y')]`,why:"`all` is fail-fast, which is right when every result is needed and a partial answer is useless. `allSettled` is right for independent operations where you want a report — sending ten notifications, warming five caches. `race` is for timeouts. `any` is for redundancy: hit three mirrors and take whichever answers first."},{name:"The trap in `all`",idea:`Fail-fast does not mean cancel — the other work continues.`,code:`// this rejects at 10ms, but the 5-second request keeps running
await Promise.all([
  fetch('/slow'),          // 5 seconds — NOT aborted
  fetch('/broken'),        // rejects at 10ms
]);

// to actually cancel, thread an AbortSignal through:
const ac = new AbortController();
try {
  await Promise.all([
    fetch('/slow',   { signal: ac.signal }),
    fetch('/broken', { signal: ac.signal }),
  ]);
} catch (e) {
  ac.abort();              // now the slow one is genuinely cancelled
  throw e;
}

// another trap: an unhandled rejection among the losers
const results = await Promise.all([a, b, c]);   // 'a' rejects first
// if 'b' also rejects later, that rejection is now UNHANDLED
// -> use allSettled when several may fail independently`,why:"A promise represents a result, not a running operation, so nothing about `Promise.all` rejecting stops the other work — the requests still complete, the CPU is still spent, and their rejections may surface as unhandled. This is the single most misunderstood aspect of the combinators."},{name:`Timeouts`,idea:"`race` plus a rejecting timer, with the modern alternatives.",code:`const timeout = (ms) =>
  new Promise((_, rej) =>
    setTimeout(() => rej(new Error('timeout')), ms));

const withTimeout = (p, ms) => Promise.race([p, timeout(ms)]);

await withTimeout(fetch('/slow'), 3000);

// leak: the timer keeps running after the race resolves.
// In Node this holds the process open. Clear it:
function withTimeout(p, ms) {
  let t;
  const timer = new Promise((_, rej) => {
    t = setTimeout(() => rej(new Error('timeout')), ms);
  });
  return Promise.race([p, timer]).finally(() => clearTimeout(t));
}

// modern built-ins:
AbortSignal.timeout(3000);                        // an auto-aborting signal
fetch('/slow', { signal: AbortSignal.timeout(3000) });
AbortSignal.any([userAbort.signal, AbortSignal.timeout(3000)]);`,why:"The uncleaned timer is a real bug in Node: an outstanding `setTimeout` is a handle that prevents the process exiting, so a service using this pattern hangs on shutdown. `AbortSignal.timeout` is the better answer for anything that accepts a signal, because it also **cancels the underlying request** rather than merely ignoring its result."}],takeaway:"`all` fails fast, `allSettled` reports everything, `race` settles first, `any` fulfils first. None of them cancel — thread an `AbortSignal` if you need that."}]},{id:`pr-async`,title:`async/await in practice`,blocks:[{t:`q`,lvl:`medium`,title:`Sequential when you meant parallel`,tag:`the most common async performance bug`,stmt:`Find and fix the performance bug, then show the three ways to run independent work concurrently.`,approaches:[{name:`The bug`,idea:"Every `await` in a loop serialises.",code:`// 3 seconds — each await blocks the next iteration
async function loadAll(ids) {
  const users = [];
  for (const id of ids) {
    users.push(await fetchUser(id));     // 1s each, one at a time
  }
  return users;
}

// also sequential, and much less obvious:
async function load() {
  const a = await fetchA();     // 1s
  const b = await fetchB();     // 1s — did not need to wait for A
  return [a, b];                // total: 2s
}`,why:"`await` means 'suspend until this settles'. In a loop, the second request is not even *created* until the first resolves. The two-variable version is the sneakier one, because it reads like ordinary sequential code and there is no visual signal that `fetchB` was independent."},{name:`Fix — start first, await later`,idea:`Create the promises eagerly; await them afterwards.`,code:`async function load() {
  const pa = fetchA();          // starts NOW
  const pb = fetchB();          // starts NOW, concurrently
  return [await pa, await pb];  // total: 1s
}

// for a collection: map to promises, then Promise.all
async function loadAll(ids) {
  return Promise.all(ids.map(id => fetchUser(id)));   // all at once
}

// destructuring reads best
const [user, posts, prefs] = await Promise.all([
  fetchUser(id), fetchPosts(id), fetchPrefs(id),
]);`,cx:`O(max) instead of O(sum) in wall-clock time`,why:"The rule: **calling** an async function starts the work; `await` only decides when you block for the result. Separating those two moments is the entire fix. `ids.map(fn)` produces an array of already-running promises, which is why `Promise.all` over a `map` is concurrent while a `for...of` with `await` is not."},{name:`Bounded concurrency`,idea:`All-at-once is wrong for 10,000 items — you need a pool.`,code:`async function mapLimit(items, limit, fn) {
  const results = new Array(items.length);
  let next = 0;

  async function worker() {
    while (next < items.length) {
      const i = next++;                    // claim an index atomically
      results[i] = await fn(items[i], i);  // (single-threaded, so safe)
    }
  }

  await Promise.all(
    Array.from({ length: Math.min(limit, items.length) }, worker)
  );
  return results;
}

// 10,000 URLs, at most 5 in flight
const pages = await mapLimit(urls, 5, (u) => fetch(u).then(r => r.text()));`,cx:"O(n) work · at most `limit` concurrent operations",why:"`Promise.all` over 10,000 fetches opens 10,000 sockets at once, which exhausts file descriptors, trips rate limits and often performs *worse* than a bounded pool. The worker pattern here spawns `limit` loops that each pull the next index — the shared `next++` is safe precisely because JavaScript is single-threaded, so no two workers can interleave between the read and the increment."}],takeaway:"Calling starts the work; `await` only decides when you block. Use `Promise.all` over a `map` for independent work, and a bounded pool once the count is large."},{t:`q`,lvl:`hard`,title:`Error handling in async code`,tag:`every trap in one problem`,stmt:`Identify the error-handling bug in each snippet.`,approaches:[{name:`1 — try/catch does not catch callbacks`,idea:`The callback runs on a later turn, with a different stack.`,code:`// BROKEN: the throw happens on a timer turn, long after try/catch exited
try {
  setTimeout(() => { throw new Error('boom'); }, 0);
} catch (e) {
  console.log('never reached');
}
// -> uncaught exception, crashes the process in Node

// FIX: handle it inside the callback, or promisify
const delay = (ms) => new Promise(r => setTimeout(r, ms));
try {
  await delay(0);
  throw new Error('boom');
} catch (e) { console.log('caught'); }        // works`,why:"`try/catch` is lexical and synchronous: it protects the stack frames created while it is on the stack. A callback invoked later runs from an empty stack, so nothing wraps it. This is the fundamental reason promises exist — they carry errors along the chain instead of relying on the stack."},{name:`2 — forgetting to await`,idea:`A rejection with no handler becomes global.`,code:`async function handler() {
  try {
    save(data);            // MISSING await — returns a promise nobody watches
  } catch (e) {
    console.log('never reached');
  }
}
// -> unhandledRejection; in Node 15+ this TERMINATES the process by default

// FIX
try { await save(data); } catch (e) { /* handled */ }

// deliberate fire-and-forget must still attach a handler:
void save(data).catch(err => logger.error(err));

// and always install a last-resort net:
process.on('unhandledRejection', (reason) => {
  logger.fatal({ reason }, 'unhandled rejection');
  process.exit(1);                       // fail fast; let the supervisor restart
});`,why:"Since Node 15 an unhandled rejection is fatal by default, which is the right choice — a silently swallowed rejection means the program is in an unknown state. The `void x.catch(...)` idiom is how you signal deliberate fire-and-forget to both readers and linters."},{name:`3 — losing the stack across boundaries`,idea:`Rethrowing bare destroys the context.`,code:`// BAD: the original error and its stack are gone
try { await db.query(sql); }
catch (e) { throw new Error('database failed'); }

// GOOD: chain with cause (ES2022)
try { await db.query(sql); }
catch (e) { throw new Error('loading user 991 failed', { cause: e }); }

// the whole chain is then walkable:
function chain(err) {
  const out = [];
  while (err) { out.push(\`\${err.name}: \${err.message}\`); err = err.cause; }
  return out.join('\\n  caused by: ');
}

// also: an async stack trace stops at the await boundary unless
// the runtime supports async stack traces (V8 does, since 2018)`,why:"`cause` is the standard way to wrap an error without losing the original, and it is supported by Node's inspector, `util.inspect` and most loggers. Wrapping matters because the low-level error says *what* failed and the wrapper says *what you were trying to do* — you need both to diagnose anything."},{name:`4 — a for-loop with try inside`,idea:`Where you place the try decides whether one failure stops everything.`,code:`// one failure aborts the whole loop
try {
  for (const id of ids) await process(id);
} catch (e) { /* the rest never ran */ }

// each failure is isolated; the loop continues
for (const id of ids) {
  try { await process(id); }
  catch (e) { logger.warn({ id, e }, 'skipping'); }
}

// concurrent with per-item outcomes
const results = await Promise.allSettled(ids.map(process));
const failed = results
  .map((r, i) => ({ r, id: ids[i] }))
  .filter(x => x.r.status === 'rejected');`,why:"This is a design decision rather than a bug, and it should be deliberate: 'stop on first failure' is right for a transactional sequence, 'continue and report' is right for independent items. The `allSettled` version is usually what a batch job wants, since it gives you both the successes and a list of exactly what to retry."}],takeaway:"`try/catch` cannot cross a callback boundary. Always `await` or `.catch` a promise, chain errors with `cause`, and put the `try` where you want the failure boundary."},{t:`guess`,code:`async function f() {
  return 1;
}
async function g() {
  return Promise.resolve(2);
}
async function h() {
  throw new Error('e');
}

console.log(f());
f().then(v => console.log('f:', v));
g().then(v => console.log('g:', v));
h().catch(e => console.log('h:', e.message));

Promise.resolve().then(() => console.log('m1'))
  .then(() => console.log('m2'))
  .then(() => console.log('m3'));`,out:`Promise { 1 }
m1
f: 1
m2
g: 2
h: e
m3`,why:"An async function **always** returns a promise, so `console.log(f())` prints the promise, not `1`. The interleaving is the interesting part: `f` returns a plain value so it resolves in one microtask tick, but `g` returns a **promise**, which costs two extra ticks to adopt — the spec requires resolving a thenable to queue an additional job. That is why `g: 2` lands after `m2` rather than alongside `f: 1`, and it is the mechanism behind the classic `async/await` ordering puzzles."},{t:`q`,lvl:`hard`,title:`Retry with exponential backoff`,tag:`asked at every backend interview`,stmt:`Write a retry helper with exponential backoff, jitter, a cap, an abort signal, and a predicate for which errors are retryable.`,approaches:[{name:`Solution`,idea:`Loop, await, back off, and give up on non-retryable errors.`,code:`const sleep = (ms, signal) => new Promise((res, rej) => {
  const t = setTimeout(res, ms);
  signal?.addEventListener('abort', () => {
    clearTimeout(t);
    rej(new DOMException('Aborted', 'AbortError'));
  }, { once: true });
});

async function retry(fn, {
  attempts = 5,
  baseMs = 200,
  maxMs = 10_000,
  factor = 2,
  signal,
  retryOn = (e) => !e.status || e.status >= 500 || e.status === 429,
} = {}) {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    signal?.throwIfAborted();
    try {
      return await fn(i);
    } catch (e) {
      lastErr = e;
      if (e.name === 'AbortError' || !retryOn(e) || i === attempts - 1) throw e;

      // full jitter: random between 0 and the exponential ceiling
      const ceiling = Math.min(maxMs, baseMs * factor ** i);
      const wait = Math.random() * ceiling;

      // honour a server's Retry-After if present
      const after = Number(e.headers?.get?.('retry-after')) * 1000;
      await sleep(Number.isFinite(after) && after > 0 ? after : wait, signal);
    }
  }
  throw lastErr;
}

const data = await retry(
  () => fetch('/api').then(r => {
    if (!r.ok) { const e = new Error(r.statusText); e.status = r.status; throw e; }
    return r.json();
  }),
  { attempts: 4, signal: AbortSignal.timeout(20_000) }
);`,cx:`O(attempts) calls · total wait bounded by attempts × maxMs`,why:"Four details separate this from a naive loop. **Jitter** is essential — without it, every client that failed at the same moment retries at the same moment and recreates the spike; full jitter (random between 0 and the ceiling) spreads them best. The **`retryOn` predicate** prevents retrying a 400, which will never succeed and merely wastes the user's time. Honouring **`Retry-After`** is what a well-behaved client does when a server rate-limits it. And **abort support** means a page navigation or a timeout can cancel the whole retry sequence rather than leaving it running."}],takeaway:`Retry needs jitter, a cap, a retryable-error predicate and cancellation. Retrying a 4xx is a bug; retrying without jitter is a self-inflicted thundering herd.`},{t:`qa`,q:`What is promise chaining, and why is it better than nested callbacks?`,a:"Each `.then` returns a new promise, so operations compose into a flat sequence instead of nesting. Beyond readability, chaining gives you three things callbacks do not: errors propagate automatically to the nearest `.catch` rather than needing to be forwarded by hand at every level; the return value determines the next step uniformly; and the whole chain is a value you can pass around, store or combine. Callback nesting also has no way to express 'wait for these three in parallel' without a manual counter."},{t:`qa`,q:`Can you cancel a promise?`,a:"No — a promise represents a result and has no reference to the work producing it, so there is nothing to cancel. What you cancel is the **operation**, using `AbortController`: pass its `signal` into `fetch`, into your own async functions, or into an event listener, and call `abort()`. The promise then rejects with an `AbortError`. `Promise.race` against a timeout only makes you *stop waiting*; the underlying request continues consuming resources."},{t:`qa`,q:"What is the difference between `return promise` and `return await promise` in a try block?",a:"Inside a `try`, they differ. `return somePromise` returns before the promise settles, so a later rejection escapes the `try` and is **not** caught by its `catch`. `return await somePromise` suspends inside the `try`, so a rejection is caught locally. Outside a `try` the two are equivalent apart from an extra microtask tick, which is why linters flag redundant `return await` there but should not flag it inside `try`.",code:`async function bad()  { try { return fetchIt(); }       catch { return 'caught'; } }
async function good() { try { return await fetchIt(); } catch { return 'caught'; } }
// if fetchIt rejects: bad() REJECTS, good() resolves to 'caught'`},{t:`qa`,q:`What is a thenable, and why does it matter?`,a:"Any object with a callable `.then` method. The promise resolution procedure treats thenables as promises: resolving with one causes the chain to adopt it, calling its `then` to obtain the eventual value. This is what makes promises interoperable with older libraries such as jQuery deferreds and Bluebird. It is also a hazard — an object that happens to have a `then` property will be treated as a promise if you resolve with it, which surprises anyone who names a property `then` on a data object."}]}]},b={id:`node`,num:`10`,title:`Node.js: Runtime & Modules`,kicker:`Architecture, CommonJS vs ESM, core modules, and what blocks the loop`,sections:[{id:`nd-arch`,title:`What Node actually is`,blocks:[{t:`code`,x:`┌─────────────────────────────────────────────────────┐
│                   YOUR JAVASCRIPT                   │
├─────────────────────────────────────────────────────┤
│   Node standard library  (JS)                       │
│   fs · http · path · events · stream · crypto       │
├─────────────────────────────────────────────────────┤
│   node bindings  (C++)                              │
├──────────────────────────┬──────────────────────────┤
│          V8              │         libuv            │
│  parses and runs JS      │  event loop              │
│  manages the heap        │  thread pool (4)         │
│                          │  epoll/kqueue/IOCP       │
└──────────────────────────┴──────────────────────────┘

Node = V8 + libuv + a standard library.
It is not a language, a framework, or a web server.`,node:!0,cap:`The whole architecture. Everything Node-specific lives in the bottom two layers.`},{t:`q`,lvl:`medium`,title:`Which operations block, and which do not`,tag:`the question behind most Node performance problems`,stmt:`Classify each operation as event-loop-blocking, thread-pool, or OS-async, and explain the consequence.`,approaches:[{name:`The three categories`,idea:`Only one of them lets other requests proceed unimpeded.`,code:`// 1. BLOCKS THE EVENT LOOP — every concurrent request waits
fs.readFileSync('big.json');
JSON.parse(hugeString);              // no async variant exists
crypto.pbkdf2Sync(pw, salt, 1e6, 64, 'sha512');
bigArray.sort(expensiveComparator);
/(a+)+b/.test(evilInput);            // catastrophic backtracking (ReDoS)
for (let i = 0; i < 1e9; i++) {}

// 2. THREAD POOL (4 threads by default) — concurrent, but capped
fs.readFile / writeFile / stat       // ALL file I/O
dns.lookup                           // but NOT dns.resolve
crypto.pbkdf2 / scrypt / randomBytes
zlib.gzip / gunzip
//  -> 5 concurrent readFile calls: the 5th waits for a free thread
//  -> process.env.UV_THREADPOOL_SIZE = 16   (before any I/O)

// 3. OS ASYNC (epoll/kqueue/IOCP) — no thread involved at all
net / http sockets
//  -> this is why Node handles 10,000 concurrent connections
//     on one thread, and why file I/O does not scale the same way`,why:`The distinction people miss is that category 2 is **capped**, not unlimited: a service reading many files concurrently saturates four threads while the CPU sits idle. Category 3 is what the 'Node is good at I/O' claim actually refers to — sockets are registered with the OS and the loop is notified on readiness, so concurrency is bounded by memory rather than threads.`},{name:`Measuring the damage`,idea:`Event-loop lag is the Node-specific health metric.`,code:`// measure how late a timer fires — that lag IS your added latency
let last = process.hrtime.bigint();
setInterval(() => {
  const now = process.hrtime.bigint();
  const lagMs = Number(now - last) / 1e6 - 500;
  if (lagMs > 50) console.warn('event loop lag', lagMs.toFixed(1), 'ms');
  last = now;
}, 500);

// production: the built-in histogram
import { monitorEventLoopDelay } from 'node:perf_hooks';
const h = monitorEventLoopDelay({ resolution: 10 });
h.enable();
setInterval(() => {
  console.log('p99 lag', (h.percentile(99) / 1e6).toFixed(1), 'ms');
  h.reset();
}, 10_000);`,why:`Every millisecond of event-loop lag is added directly to the latency of every concurrent request, which is why it is the first metric to graph in a Node service. A p99 lag above a few tens of milliseconds means something synchronous is running in the request path — and the histogram tells you it is happening even when average lag looks fine.`},{name:`The fixes`,idea:`In order of preference.`,code:`// 1. use the async variant
await fs.promises.readFile(path);

// 2. stream instead of buffering
await pipeline(createReadStream(src), gzip(), createWriteStream(dst));

// 3. chunk and yield for unavoidable CPU work
for (let i = 0; i < items.length; i += 1000) {
  process(items.slice(i, i + 1000));
  await new Promise(setImmediate);       // let the loop breathe
}

// 4. move it to a worker thread
const worker = new Worker('./hash.js', { workerData: password });

// 5. move it out of the process entirely
await queue.add('generate-report', { userId });`,why:"Option 3 is the one worth knowing precisely: `await new Promise(setImmediate)` yields a full loop turn, so pending I/O callbacks and timers run between chunks. `await Promise.resolve()` would **not** work — it queues a microtask, which runs before the loop advances, so the loop is still starved."}],takeaway:`Sockets are OS-async and scale; file, DNS-lookup, crypto and zlib share four threads; anything synchronous blocks every concurrent request. Graph event-loop lag.`},{t:`guess`,setup:`// Node.js, run from the command line`,code:`const fs = require('fs');
console.log('1');
setTimeout(() => console.log('2'), 0);
setImmediate(() => console.log('3'));
fs.readFile(__filename, () => {
  console.log('4');
  setTimeout(() => console.log('5'), 0);
  setImmediate(() => console.log('6'));
  process.nextTick(() => console.log('7'));
});
process.nextTick(() => console.log('8'));
console.log('9');`,out:`1
9
8            nextTick queue drains before anything else
2 / 3        RACY at top level — either order
4            the I/O callback, in the poll phase
7            nextTick drains before moving on
6            setImmediate: the CHECK phase is next after poll
5            the timer waits for the next loop iteration`,why:"Two rules produce this. `process.nextTick` drains before promise microtasks and before the loop advances, so `8` beats both timers. And **inside an I/O callback** the ordering of `setImmediate` versus `setTimeout(0)` becomes deterministic — you are in the poll phase, check comes next, so `6` beats `5`. At the top level that same pair is a genuine race decided by how long startup took."}]},{id:`nd-modules`,title:`CommonJS and ES modules`,blocks:[{t:`table`,head:[``,`CommonJS`,`ES Modules`],rows:[[`Syntax`,"`require` / `module.exports`","`import` / `export`"],[`Loading`,`Synchronous, at runtime`,`Asynchronous, statically analysed`],[`Specifiers`,`Can be computed at runtime`,"Must be static string literals (`import()` for dynamic)"],[`Bindings`,`**Copies** of values at require time`,`**Live bindings** — reassignment is visible to importers`],[`Hoisting`,`Executes in order encountered`,`All imports hoisted and resolved before any body runs`],[`Strict mode`,`Only if declared`,`Always`],["Top-level `await`",`No`,`Yes`],[`Tree shaking`,`No — the shape is not statically known`,`Yes`],["`__dirname`",`Available`,"Use `import.meta.dirname`"],["`this` at top level","`module.exports`","`undefined`"]]},{t:`q`,lvl:`hard`,title:`Live bindings versus value copies`,tag:`the difference that actually bites`,stmt:`Show a case where the same code behaves differently under CommonJS and ESM, and explain why.`,approaches:[{name:`The difference`,idea:`CJS copies the value; ESM references the binding.`,code:`// ── counter.js ────────────────────────────────
let count = 0;
export function increment() { count++; }
export { count };

// ── main.mjs (ESM) ────────────────────────────
import { count, increment } from './counter.js';
console.log(count);   // 0
increment();
console.log(count);   // 1   <- LIVE binding, sees the reassignment

// ── counter.cjs ───────────────────────────────
let count = 0;
module.exports = { count, increment: () => count++ };

// ── main.cjs ──────────────────────────────────
const { count, increment } = require('./counter.cjs');
console.log(count);   // 0
increment();
console.log(count);   // 0   <- a COPY, taken at destructure time

// CJS workaround: export a getter, or access through the namespace
const counter = require('./counter.cjs');
counter.increment();
console.log(counter.count);   // reads the property each time`,why:`This is why singletons, feature flags and lazily-initialised connections behave differently between the two systems. Under CJS, destructuring at import time snapshots the value; under ESM the import is a read-only *view* of the exporter's variable. Note you still cannot assign to an imported binding in ESM — only the exporting module may change it.`},{name:`Circular dependencies`,idea:`Both break, but ESM breaks loudly.`,code:`// ── a.js requires b.js, which requires a.js back

// CJS: the second require gets a PARTIAL exports object
// a.cjs
exports.name = 'a';
const b = require('./b.cjs');
console.log('a sees b.name =', b.name);   // undefined  <- silent
exports.ready = true;

// b.cjs
const a = require('./a.cjs');
console.log('b sees a.name =', a.name);   // 'a' — assigned before the cycle
console.log('b sees a.ready =', a.ready); // undefined — not yet assigned
exports.name = 'b';

// ESM: hoisting means functions work, but a let/const throws clearly
// a.mjs
import { bValue } from './b.mjs';
export const aValue = 'a';
console.log(bValue);   // ReferenceError: Cannot access 'bValue'
                       //   before initialization  <- LOUD`,why:"The CJS failure is the dangerous one because it is silent: you get `undefined` and the bug surfaces far from its cause. ESM's TDZ turns the same situation into an immediate, precise error. In both cases the real fix is to restructure — extract the shared piece into a third module — rather than to reorder requires and hope."},{name:`Interop`,idea:`Importing CJS from ESM and vice versa.`,code:`// ESM importing CJS: the whole module.exports becomes the default
import pkg from 'some-cjs-package';         // works
import { named } from 'some-cjs-package';   // works only if Node's
   // static analysis can detect the named export — often it cannot

// the reliable form:
import pkg from 'some-cjs-package';
const { named } = pkg;

// CJS importing ESM: must use dynamic import (returns a promise)
const { thing } = await import('./esm-module.mjs');

// getting __dirname in ESM
import { fileURLToPath } from 'node:url';
const __dirname = import.meta.dirname;              // Node 20.11+
// older: path.dirname(fileURLToPath(import.meta.url))

// getting require in ESM, when a package has no ESM build
import { createRequire } from 'node:module';
const require = createRequire(import.meta.url);`,why:"Named-export detection from CJS is done by static analysis of the source (cjs-module-lexer) and fails on anything dynamic — reassigning `module.exports` in a conditional, for example. That is why importing the default and destructuring afterwards always works while named imports sometimes do not, and why library authors ship dual builds with conditional `exports`."}],takeaway:`ESM gives live bindings, static analysis and tree shaking; CJS gives value copies and runtime flexibility. Circular deps fail silently in CJS and loudly in ESM.`},{t:`qa`,q:"How does Node resolve a bare specifier like `require('lodash')`?",a:"It walks up from the requiring file's directory checking each `node_modules` folder, then reads the package's `exports` field — or falls back to `main`, then `index.js`. Relative specifiers try the exact path, then the `.js`/`.json`/`.node` extensions, then as a directory. The resolved module is cached in `require.cache` keyed by absolute path, so a module body runs exactly once per process."},{t:`qa`,q:"What does the `exports` field do that `main` did not?",a:"It defines a package's **public** entry points and blocks deep imports into internal files, so `require('pkg/lib/internal')` fails unless you exported it. It also supports conditional resolution — `import`, `require`, `node`, `browser`, `types`, `default` — which is how one package ships both CJS and ESM builds. Order matters: `types` must come first and `default` last."},{t:`qa`,q:`Why is every Node module a singleton, and when is that a problem?`,a:`Because the module cache runs each module body once and returns the same exports object thereafter. That is convenient for connection pools and configuration, and a problem for tests that need fresh state, and for any module holding mutable globals. Prefer exporting a factory function over exporting a live instance when the consumer might reasonably want more than one.`}]},{id:`nd-streams`,title:`Streams, buffers and backpressure`,blocks:[{t:`q`,lvl:`hard`,title:`Why buffering fails and streaming does not`,tag:`the Node scaling question`,stmt:"Explain what happens to memory when 50 users download a 2 GB file with `readFile` versus with a stream, and write the correct pipeline.",approaches:[{name:`The failure`,idea:`Buffering allocates the whole payload per concurrent request.`,code:`// 2 GB × 50 concurrent = 100 GB. The process dies long before that.
app.get('/download', async (req, res) => {
  const data = await fs.promises.readFile('huge.zip');   // whole file in RAM
  res.send(data);
});
// also: Buffer has a hard maximum (buffer.constants.MAX_LENGTH,
// ~4 GB on 64-bit) — beyond it readFile throws outright.`,why:`Node's default heap is around 4 GB and a Buffer lives outside it, but the process still has to hold it. The deeper problem is that memory scales with concurrency: a single test download looks fine and the failure only appears under load, which is why this reaches production.`},{name:`Streaming`,idea:`Constant memory regardless of file size or concurrency.`,code:`import { pipeline } from 'node:stream/promises';
import { createReadStream, createWriteStream } from 'node:fs';
import { createGzip } from 'node:zlib';

app.get('/download', async (req, res) => {
  try {
    await pipeline(createReadStream('huge.zip'), res);
  } catch (err) {
    if (err.code !== 'ERR_STREAM_PREMATURE_CLOSE') next(err);
  }
});
// memory stays at ~64 KB per request (the highWaterMark)

// a transform pipeline: read, parse, compress, write
await pipeline(
  createReadStream('in.csv'),
  parseCsv(),
  createGzip(),
  createWriteStream('out.gz')
);`,why:"`pipeline` is the important detail. Plain `.pipe()` does **not** forward errors or clean up — if the destination fails, the source stays open and leaks a file descriptor, and repeated failures exhaust the process's descriptor limit. `pipeline` propagates the error, destroys every stream in the chain, and resolves or rejects once. The premature-close check handles the normal case of a client disconnecting mid-download."},{name:`Backpressure`,idea:`The mechanism that makes streaming safe.`,code:`// write() returns FALSE when the internal buffer exceeds highWaterMark
// a correct producer stops and waits for 'drain'

// BROKEN: ignores the return value — memory grows without bound
for (const row of millionRows) dest.write(serialise(row));

// CORRECT, by hand:
for (const row of millionRows) {
  if (!dest.write(serialise(row))) {
    await once(dest, 'drain');
  }
}

// CORRECT, and simpler — generators respect backpressure automatically
await pipeline(
  async function* () { for (const row of millionRows) yield serialise(row); },
  dest
);`,why:"Backpressure is the whole reason streams exist rather than just being an incremental API. Without it a fast producer feeding a slow consumer buffers everything in between, which is the same out-of-memory failure with extra steps. Async generators as a pipeline source are the cleanest modern way to write a producer, because the `yield` naturally suspends until the consumer is ready."}],takeaway:"Buffering scales memory with file size × concurrency; streaming keeps it at one `highWaterMark` per request. Always use `pipeline`, never bare `.pipe()`."},{t:`qa`,q:`What are the four stream types?`,a:"**Readable** (a source, like `fs.createReadStream`), **Writable** (a sink, like an HTTP response), **Duplex** (both independently, like a TCP socket), and **Transform** (a duplex where output is a function of input, like `zlib.createGzip`). A Transform is where you put your own parsing or mapping logic in a pipeline."},{t:`qa`,q:"What is a Buffer and why does `Buffer.allocUnsafe` exist?",a:"A `Buffer` is a fixed-length view of raw bytes outside the V8 heap, and a subclass of `Uint8Array`. `Buffer.alloc(n)` zero-fills; `allocUnsafe(n)` skips that step and is faster, but the memory may contain fragments of previously freed data — including other requests' payloads. It is safe only when you immediately overwrite every byte, which is why `alloc` is the default you should reach for."},{t:`qa`,q:"What happens when an EventEmitter emits `'error'` with no listener?",a:"Node throws it, which usually crashes the process. That is deliberate — an unhandled socket or stream error should be loud rather than silently swallowed. Attach an `'error'` handler to every emitter and stream, including ones you only write to, and remember that `pipeline` does this for you across a whole chain."}]}]},x={id:`predict`,num:`11`,title:`Predict the Output`,kicker:`Thirty snippets that separate memorised syntax from understood semantics`,sections:[{id:`pr-async`,title:`Ordering and async`,blurb:`Co ReferenceError: Cannot access 'y' before initialization`,why:"`typeof` on an undeclared name is safe and returns `\"undefined\"` — but it is **not** safe in the TDZ, where any access throws regardless of how you reach it. This is one of the very few contexts in which `typeof` can throw, and distinguishing `Cannot access 'y' before initialization` (the binding exists) from `y is not defined` (it does not) is the point of the question."}]}]},ee=[{q:`Is JavaScript compiled or interpreted?`,d:1,p:`Engine`,c:[`GOOG`,`AMZ`,`TCS`],a:`Both. The engine parses to an AST, compiles to bytecode, interprets it, then JIT-compiles hot functions to machine code — and deoptimises back when its type assumptions break. It is compiled at run time rather than ahead of it.`},{q:`What is the difference between the JavaScript engine and the runtime?`,d:1,p:`Engine`,c:[`AMZ`,`MSFT`,`INFY`],a:"The engine (V8, SpiderMonkey, JavaScriptCore) implements the ECMAScript language. The runtime is the engine plus host APIs — the DOM, `fetch` and `localStorage` in a browser; `fs`, `http` and `Buffer` in Node. `setTimeout` is a host API, not part of the language."},{q:`What are Ignition and TurboFan?`,d:2,p:`Engine`,c:[`GOOG`,`META`],a:`V8's interpreter and optimising compiler. Ignition compiles the AST to bytecode and executes it while collecting type feedback; TurboFan (with Maglev as a mid-tier since 2023) recompiles hot functions into machine code specialised to the observed types.`},{q:`What is deoptimisation and what triggers it?`,d:3,p:`Engine`,c:[`GOOG`,`META`,`NFLX`],a:"Discarding optimised machine code and falling back to bytecode because a compiled-in assumption was violated — a new argument type, a changed object shape, an unexpected `undefined`. Frequent deopt-reopt cycles are far slower than never optimising, which is why type stability matters."},{q:`What is an inline cache?`,d:3,p:`Engine`,c:[`GOOG`,`META`],a:`A per-call-site memo of the object shapes previously seen there. Monomorphic (one shape) is the fast path; polymorphic (2–4) is slower; megamorphic (5+) makes the engine give up specialising and use a generic dispatch for every call.`},{q:`What is a hidden class or shape?`,d:3,p:`Engine`,c:[`GOOG`,`META`,`NFLX`],a:"V8's internal descriptor of which properties an object has and in what order. Objects built by the same literal in the same order share one, so a compiled property access works for all of them. Adding properties in different orders, or using `delete`, breaks the sharing and pushes access sites toward megamorphic."},{q:"Why is `delete obj.prop` slow?",d:2,p:`Engine`,c:[`GOOG`,`AMZ`],a:"It changes the object's hidden class and often forces it into dictionary mode, where properties are stored in a hash table rather than at fixed offsets — so every subsequent access is slower, permanently. Set the property to `undefined` or `null` in hot paths, or use a `Map`."},{q:`What does 'JavaScript is single-threaded' actually mean?`,d:1,p:`Engine`,c:[`AMZ`,`TCS`,`META`],a:`One call stack, so exactly one piece of JavaScript runs at a time. The runtime is not single-threaded: libuv has a thread pool, the browser has separate rendering and network threads. Workers give real parallelism, isolated by message passing rather than shared memory.`},{q:`What is the call stack?`,d:1,p:`Engine`,c:[`TCS`,`INFY`,`AMZ`],a:"A LIFO stack of execution contexts. Calling a function pushes a frame holding its locals, arguments, `this` and return address; returning pops it. Exceeding the fixed size (~1 MB) throws `RangeError: Maximum call stack size exceeded`."},{q:`How do you read a stack trace?`,d:1,p:`Engine`,c:[`AMZ`,`ATLS`,`TCS`],a:`Top-down is innermost-first: the first line is where the error was thrown, each following line is its caller, and the bottom is the entry point. The actual bug is often a frame or two below the top, where a bad value was produced.`},{q:`Why is the maximum recursion depth not a fixed number?`,d:2,p:`Engine`,c:[`GOOG`,`AMZ`],a:`The limit is bytes of stack, not frames. A function with eight parameters and several locals has a much larger frame than one with none, so it overflows at a fraction of the depth. It also varies by engine, build and platform.`},{q:`Does JavaScript have tail call optimisation?`,d:2,p:`Engine`,c:[`GOOG`,`APPL`],a:`It is in the ES2015 specification for strict mode, but only JavaScriptCore (Safari) implemented it. V8 and SpiderMonkey shipped it behind flags then removed it, largely because it destroys stack traces. Assume you do not have it: convert deep recursion to iteration or a trampoline.`},{q:`What is a trampoline?`,d:3,p:`Engine`,c:[`GOOG`,`ATLS`],a:`A loop that repeatedly calls a function which returns another function (a thunk) instead of recursing. Each step's frame pops before the next is pushed, so stack depth stays constant while the recursive structure is preserved. It requires accumulator-passing style.`},{q:`What is the difference between the stack and the heap?`,d:1,p:`Engine`,c:[`AMZ`,`MSFT`,`TCS`],a:`The stack holds execution contexts and primitive values in fixed-size frames, allocated and freed automatically in LIFO order. The heap holds objects, arrays, functions and closures — variable-sized, garbage collected. A variable holding an object stores a stack reference to heap memory.`},{q:`How does TC39 add features to the language?`,d:1,p:`Engine`,c:[`GOOG`,`MSFT`],a:`Five stages: 0 strawperson, 1 proposal, 2 draft, 3 candidate (spec complete, engines implement), 4 finished (two implementations, ships in the next annual release). Stage 3 is when a feature becomes usable behind a transpiler; stage 4 is when it is real.`},{q:`What is hoisting?`,d:1,p:`Scope`,c:[`TCS`,`INFY`,`AMZ`,`WIPRO`],a:"The consequence of execution contexts being built in two phases: a creation phase that registers every declaration in the scope, then an execution phase that runs the code. `var` bindings are initialised to `undefined` at creation; `let`/`const`/`class` are created but left uninitialised."},{q:"Are `let` and `const` hoisted?",d:2,p:`Scope`,c:[`AMZ`,`GOOG`,`META`],a:`Yes — saying they are not is the common wrong answer. The binding exists from the top of the block, which is why it shadows an outer variable on lines above the declaration. It is merely *uninitialised* until the declaration runs, and touching it before then throws.`},{q:`What is the Temporal Dead Zone?`,d:2,p:`Scope`,c:[`AMZ`,`META`,`ATLS`],a:"The window between a `let`/`const`/`class` binding being created at the top of its block and being initialised at its declaration line. Access in that window throws `ReferenceError: Cannot access 'x' before initialization` — distinct from `x is not defined`, which means no binding exists at all."},{q:"Does `typeof` throw in the TDZ?",d:2,p:`Scope`,c:[`GOOG`,`META`],a:'Yes. `typeof undeclaredName` is famously safe and returns `"undefined"`, but `typeof letInTDZ` throws a `ReferenceError`. It is one of the very few places `typeof` can throw, and a common trick question.'},{q:`How do function declarations and function expressions differ in hoisting?`,d:1,p:`Scope`,c:[`TCS`,`AMZ`,`INFY`],a:"A declaration is fully hoisted — binding and body — so it can be called before it appears. A function expression assigned to `var` hoists only the variable, which is `undefined` until the assignment runs, so calling it early gives `TypeError: f is not a function`."},{q:"What does `var` do that `let` does not?",d:1,p:`Scope`,c:[`TCS`,`INFY`,`COG`],a:"Function-scoped rather than block-scoped, so it leaks out of `if` and `for` blocks; initialised to `undefined` rather than TDZ; silently redeclarable; and creates a property on the global object when declared at top level in a script. There is no case where `var` is better in new code."},{q:"Why does `var i` in a loop with closures log the final value?",d:2,p:`Scope`,c:[`AMZ`,`GOOG`,`META`,`TCS`],a:"There is exactly one `i` for the whole function, and every closure captures that binding rather than a snapshot of its value. By the time the deferred callbacks run, the loop has finished. `let` in a `for` header creates a fresh binding per iteration, which is a specific rule added for this reason."},{q:`Name four fixes for the loop-closure problem.`,d:2,p:`Scope`,c:[`AMZ`,`META`,`TCS`],a:"`let` in the loop header; an IIFE taking the value as a parameter; `bind` or `setTimeout`'s extra-args form to capture the value; or `forEach`/`map`, where the callback parameter is a new binding per call."},{q:`What is lexical scope?`,d:1,p:`Scope`,c:[`AMZ`,`GOOG`,`TCS`],a:`Scope determined by where code is **written**, not where it is called from. A function's scope chain is fixed at definition time. This is why a function defined at top level cannot see a caller's locals, even when that caller is on the stack — which would be possible under dynamic scoping.`},{q:`What is the scope chain?`,d:1,p:`Scope`,c:[`TCS`,`AMZ`],a:`The chain of environment records a function can reach: its own, then its defining scope's, outward to global. Lookup walks outward and stops at the first match. It never walks inward and never follows the call stack.`},{q:`How many primitive types does JavaScript have?`,d:1,p:`Types`,c:[`TCS`,`INFY`,`AMZ`,`COG`],a:"Seven: `number`, `string`, `boolean`, `undefined`, `null`, `symbol`, `bigint`. Everything else is an object, including arrays, functions, dates and regexes."},{q:'Why is `typeof null` `"object"`?',d:1,p:`Types`,c:[`AMZ`,`META`,`TCS`],a:"A bug from the original 1995 implementation: values were stored with a type tag, the object tag was `0`, and the null pointer was also all zeros. Fixing it would break the web, so it was kept. Check for null with `value === null`."},{q:"What is the difference between `null` and `undefined`?",d:1,p:`Types`,c:[`TCS`,`AMZ`,`INFY`,`WIPRO`],a:"`undefined` is absence by default — unassigned variables, missing properties, missing arguments, no return value. `null` is absence on purpose, assigned by you. Default parameters trigger on `undefined` only, never on `null`, and `JSON.stringify` drops `undefined` properties but keeps `null`."},{q:`List the falsy values.`,d:1,p:`Types`,c:[`TCS`,`AMZ`,`INFY`,`ZOHO`],a:'`false`, `0`, `-0`, `0n`, `""`, `null`, `undefined`, `NaN` — eight of them. Everything else is truthy, including `"0"`, `"false"`, `[]` and `{}`. The empty-array case is why `if (arr)` is wrong and `if (arr.length)` is right.'},{q:"Why does `0.1 + 0.2 !== 0.3`?",d:1,p:`Types`,c:[`AMZ`,`GOOG`,`TCS`,`GS`],a:"Numbers are IEEE-754 doubles, so a value must be a sum of powers of two. `0.1` and `0.2` are not exactly representable and their tiny errors survive addition. Compare with a tolerance (`Math.abs(a-b) < Number.EPSILON`) or use integers of the smallest unit."},{q:"What is `Number.MAX_SAFE_INTEGER` and why does it matter?",d:2,p:`Types`,c:[`AMZ`,`STRP`,`PYPL`],a:"2^53 − 1 = 9007199254740991. Above it, consecutive integers are no longer distinguishable as doubles — `9007199254740992 === 9007199254740993` is `true`. This is why backend IDs like Twitter snowflakes must be transported as strings, not JSON numbers."},{q:"Why is `NaN !== NaN`?",d:1,p:`Types`,c:[`AMZ`,`GOOG`,`TCS`],a:"IEEE-754 defines it: two unknown non-numbers have no reason to be the same. Test with `Number.isNaN(x)` or `x !== x`. Note `Object.is(NaN, NaN)` is `true`, and `[NaN].includes(NaN)` is `true` while `[NaN].indexOf(NaN)` is `-1`, because `includes` uses SameValueZero and `indexOf` uses `===`."},{q:"What is the difference between `isNaN` and `Number.isNaN`?",d:1,p:`Types`,c:[`AMZ`,`META`,`ZOHO`],a:"The global `isNaN` coerces its argument first, so `isNaN('abc')` is `true` — almost anything non-numeric passes. `Number.isNaN` does no coercion and is `true` only for the actual NaN value. The same distinction applies to `isFinite` versus `Number.isFinite`."},{q:"Explain the `==` algorithm.",d:3,p:`Types`,c:[`GOOG`,`META`,`AMZ`,`MSFT`],a:"Same type → `===` semantics. `null == undefined` → true. `null`/`undefined` versus anything else → false, with no coercion. Number vs string → `ToNumber` the string. Boolean on either side → `ToNumber` it and restart. Object vs primitive → `ToPrimitive` the object and restart. Otherwise false."},{q:"Why is `null == 0` false but `null >= 0` true?",d:3,p:`Types`,c:[`GOOG`,`META`],a:"`==` has an explicit rule refusing to coerce `null` to anything except `undefined`. Relational operators use a different algorithm that calls `ToNumber`, turning `null` into `0`. So `null` is not equal to zero, not less than zero, and greater-than-or-equal to zero simultaneously — a genuine specification wart."},{q:"When is `==` acceptable?",d:1,p:`Types`,c:[`AMZ`,`ATLS`,`ZOHO`],a:"For `value == null`, which tests for null or undefined in one comparison and nothing else. That is why `??` and `?.` use the same nullish definition. Everywhere else use `===` with an explicit conversion."},{q:"What is `ToPrimitive`?",d:3,p:`Types`,c:[`GOOG`,`META`],a:'The internal operation converting an object to a primitive. It checks `Symbol.toPrimitive` first, then tries `valueOf` and `toString` in an order chosen by the hint: `"string"` tries `toString` first, `"number"` and `"default"` try `valueOf` first. `Date` uniquely treats `"default"` as `"string"`.'},{q:'Why does `[] + {}` give `"[object Object]"` but `{} + []` give `0`?',d:3,p:`Types`,c:[`GOOG`,`META`,`AMZ`],a:'Parsing, not coercion. At statement position a leading `{` is a **block**, so the second expression is just `+[]` — a unary plus on an empty array, which stringifies to `""` and converts to `0`. Wrap it in parentheses and you get `"[object Object]"` back.'},{q:"Why does `'3' - 1` give `2` but `'3' + 1` give `'31'`?",d:1,p:`Types`,c:[`TCS`,`AMZ`,`INFY`],a:"`+` is overloaded: if either operand becomes a string after `ToPrimitive`, it concatenates. Every other arithmetic operator has only a numeric meaning, so it calls `ToNumber` on both sides. That single asymmetry explains most coercion surprises."},{q:`How do you check whether a value is an array?`,d:1,p:`Types`,c:[`AMZ`,`GOOG`,`TCS`],a:'`Array.isArray(v)`. `typeof` returns `"object"` for arrays, and `instanceof Array` fails across realms — an array from an iframe or worker has a different `Array.prototype`. `Array.isArray` checks an internal slot, so it works everywhere.'},{q:"How would you write a reliable `typeOf` helper?",d:2,p:`Types`,c:[`AMZ`,`ATLS`,`ADBE`],a:"Handle `null` and `NaN` explicitly, return `typeof` for primitives and functions, and otherwise use `Object.prototype.toString.call(v).slice(8, -1).toLowerCase()`, which reads an internal tag and works across realms.",code:`const typeOf = v => v === null ? 'null'
  : Number.isNaN(v) ? 'nan'
  : typeof v !== 'object' && typeof v !== 'function' ? typeof v
  : Object.prototype.toString.call(v).slice(8, -1).toLowerCase();`},{q:`What is the difference between copying a primitive and copying an object?`,d:1,p:`Types`,c:[`TCS`,`AMZ`,`INFY`],a:`Assigning a primitive copies the value; assigning an object copies the **reference**, so both names denote the same object and a mutation through either is visible through both. Reassigning one of them rebinds only that variable and leaves the other pointing at the original.`},{q:"Why does `const` not make an object immutable?",d:1,p:`Types`,c:[`TCS`,`AMZ`,`META`],a:"`const` freezes the **binding**, not the value — the variable cannot be pointed at something else, but the object it references is fully mutable. `Object.freeze` makes properties non-writable, and even that is shallow."},{q:"Compare spread, `Object.assign`, `structuredClone` and the JSON round-trip.",d:2,p:`Types`,c:[`AMZ`,`META`,`ATLS`],a:"Spread and `Object.assign` are shallow, evaluate getters, and skip the prototype and non-enumerables. `structuredClone` is deep and handles cycles, `Date`, `Map`, `Set` and typed arrays, but throws on functions and drops class prototypes. The JSON round-trip silently destroys `Date`, `Map`, `Set`, `undefined`, `NaN` and functions, and throws on cycles and BigInt."},{q:`How do you deep-clone an object with circular references?`,d:3,p:`Types`,c:[`AMZ`,`GOOG`,`ATLS`],a:"`structuredClone` handles them natively. Hand-rolled, keep a `WeakMap` of already-cloned objects and return the memoised copy on revisit — which also correctly preserves shared references rather than duplicating them."},{q:"What is `Object.is` and how does it differ from `===`?",d:2,p:`Types`,c:[`AMZ`,`META`],a:"SameValue semantics, which differ from `===` on exactly two cases: `Object.is(NaN, NaN)` is `true`, and `Object.is(0, -0)` is `false`. Everywhere else they agree. `Array.prototype.includes` uses SameValueZero, which is `Object.is` except that `+0` and `-0` are equal."},{q:"When would you use `BigInt`?",d:2,p:`Types`,c:[`STRP`,`COIN`,`GS`],a:"Exact integers beyond 2^53 − 1: large IDs, cryptography, nanosecond timestamps, financial minor units at scale. Literals take an `n` suffix. BigInt and Number cannot be mixed in arithmetic — `1n + 1` throws — which is deliberate, and it cannot be `JSON.stringify`d without a replacer."},{q:"What is a `Symbol` and what is it used for?",d:2,p:`Types`,c:[`AMZ`,`GOOG`,`ATLS`],a:"A unique, immutable primitive usable as a property key that can never collide with a string key. Used for metadata on third-party objects, for private-ish fields before `#` existed, and for the well-known symbols that hook into language behaviour: `Symbol.iterator`, `Symbol.asyncIterator`, `Symbol.toPrimitive`, `Symbol.hasInstance`, `Symbol.toStringTag`."},{q:"What is the difference between `Symbol('x')` and `Symbol.for('x')`?",d:2,p:`Types`,c:[`GOOG`,`ATLS`],a:"`Symbol('x')` creates a brand-new unique symbol every call; the string is only a description for debugging. `Symbol.for('x')` looks up a global registry shared across realms and returns the same symbol for the same key, which is how cross-frame or cross-worker symbol coordination works."},{q:`What is boxing?`,d:2,p:`Types`,c:[`AMZ`,`MSFT`],a:"When you access a property on a primitive, the engine temporarily wraps it in the corresponding object (`String`, `Number`, `Boolean`) so the prototype method can be found, then discards the wrapper. That is why `'abc'.toUpperCase()` works and why `'abc'.foo = 1` silently does nothing — the wrapper is thrown away."},{q:"What does `String(x)` do that `x.toString()` does not?",d:1,p:`Types`,c:[`TCS`,`AMZ`],a:'`String(null)` and `String(undefined)` work and give `"null"` / `"undefined"`; calling `.toString()` on either throws a `TypeError`. `String` also handles symbols, which throw with implicit concatenation. Template literals and `+ \'\'` use `ToString`, which itself calls `ToPrimitive` on objects.'},{q:"What is the difference between `parseInt` and `Number`?",d:1,p:`Types`,c:[`TCS`,`AMZ`,`INFY`],a:"`parseInt` parses a **leading** integer and stops at the first invalid character, so `parseInt('12px')` is `12`. `Number` requires the whole string to be numeric, so `Number('12px')` is `NaN`. `parseInt` also takes a radix — always pass `10`, since a leading `0x` is otherwise interpreted as hex."},{q:"Why is `['1','2','3'].map(parseInt)` not `[1,2,3]`?",d:2,p:`Types`,c:[`AMZ`,`META`,`GOOG`],a:"`map` passes `(value, index, array)`, so it calls `parseInt('1',0)`, `parseInt('2',1)`, `parseInt('3',2)`. Radix 0 is treated as 10, radix 1 is invalid (`NaN`), and `'3'` is not a valid base-2 digit (`NaN`). The result is `[1, NaN, NaN]`. Use `map(Number)` or `map(s => parseInt(s, 10))`."},{q:"What does `void 0` mean and why is it used?",d:2,p:`Types`,c:[`GOOG`,`MSFT`],a:"`void` evaluates its operand and returns `undefined`. `void 0` is a guaranteed way to produce `undefined` — historically useful because `undefined` was writable as a global before ES5. Minifiers still emit it because it is shorter, and `void promise` marks a deliberate fire-and-forget."}],te=[{q:"What are the rules for determining `this`?",d:2,p:`This`,c:[`AMZ`,`GOOG`,`META`,`TCS`],a:"In precedence order: arrow function (lexical, unchangeable); `new` (the fresh object); explicit `call`/`apply`/`bind`; implicit (the object before the last dot); default (`undefined` in strict mode, `globalThis` in sloppy). Read the call site, not the definition."},{q:"Why does `const f = obj.method; f()` lose `this`?",d:1,p:`This`,c:[`TCS`,`AMZ`,`INFY`],a:"The `obj.` was only how you located the function; it does not travel with it. Extracting it produces a bare function reference, so calling it uses the default binding. Fix with `bind`, an arrow wrapper, or a class-field arrow."},{q:"What is `this` at the top level of a script, a module and Node CommonJS?",d:2,p:`This`,c:[`AMZ`,`MSFT`,`NFLX`],a:"`window` in a classic browser script, `undefined` in an ES module (modules are always strict), and `module.exports` — an empty object — in a Node CommonJS file. Use `globalThis` when you genuinely want the global object."},{q:"How do `call`, `apply` and `bind` differ?",d:1,p:`This`,c:[`TCS`,`AMZ`,`INFY`,`COG`],a:"`call(thisArg, a, b)` invokes immediately with comma-separated arguments. `apply(thisArg, [a, b])` invokes immediately with an array. `bind(thisArg, a)` invokes nothing — it returns a new permanently-bound function, optionally partially applied."},{q:`Can you rebind a bound function?`,d:2,p:`This`,c:[`AMZ`,`META`],a:"No. `bind` produces an exotic bound function with a fixed internal `[[BoundThis]]`; a later `.call` or `.bind` on it is ignored for the receiver. The one exception is `new` — a bound function used as a constructor ignores the bound `this` and uses the newly created object."},{q:"How would you implement `Function.prototype.bind`?",d:3,p:`Polyfill`,c:[`AMZ`,`GOOG`,`META`,`FLPK`],a:"Return a wrapper that applies the target with the bound `this` and merged arguments; detect construction with `this instanceof bound` and pass the new object instead; and set `bound.prototype = Object.create(target.prototype)` so `instanceof` still works.",code:`Function.prototype.myBind = function (thisArg, ...bound) {
  const target = this;
  function fn(...args) {
    return target.apply(this instanceof fn ? this : thisArg, [...bound, ...args]);
  }
  if (target.prototype) fn.prototype = Object.create(target.prototype);
  return fn;
};`},{q:"How would you implement `Function.prototype.call`?",d:3,p:`Polyfill`,c:[`AMZ`,`META`,`FLPK`],a:"Attach the function to the target object under a `Symbol` key so implicit binding sets `this`, invoke it through the dot, then delete the key in a `finally` so cleanup happens even on a throw.",code:`Function.prototype.myCall = function (ctx, ...args) {
  ctx = ctx == null ? globalThis : Object(ctx);
  const k = Symbol();
  Object.defineProperty(ctx, k, { value: this, configurable: true });
  try { return ctx[k](...args); } finally { delete ctx[k]; }
