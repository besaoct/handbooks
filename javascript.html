};`},{q:`List every difference between arrow and regular functions.`,d:2,p:`This`,c:[`AMZ`,`GOOG`,`TCS`,`ATLS`],a:"Arrows have no own `this`, no `arguments`, no `super`, no `new.target` and no `prototype`; they cannot be constructed with `new` and cannot be generators; and they are bound by the enclosing scope rather than the call site. They are also expressions, so they sit in the TDZ rather than being fully hoisted."},{q:`When is an arrow function the wrong choice?`,d:2,p:`This`,c:[`AMZ`,`META`,`TCS`],a:"Object methods and prototype methods that need `this` from the caller; constructors; and DOM event listeners that rely on `this` being the element. The rule: arrow when you want to inherit `this`, regular function when the caller should supply it."},{q:"Why does an arrow function in an object literal not get the object as `this`?",d:2,p:`This`,c:[`AMZ`,`GOOG`],a:"Object literals do not create a scope. An arrow defined directly in one inherits `this` from whatever surrounds the literal — the module or the enclosing function — never from the object being built."},{q:"What does `new` actually do?",d:2,p:`This`,c:[`AMZ`,`GOOG`,`TCS`,`META`],a:"Creates an empty object; links its `[[Prototype]]` to the constructor's `.prototype`; calls the constructor with `this` bound to it; and returns that object **unless** the constructor explicitly returns a different object, which wins. A returned primitive is ignored."},{q:"What is `new.target`?",d:2,p:`This`,c:[`GOOG`,`MSFT`,`ATLS`],a:"Inside a function it holds the constructor invoked with `new`, or `undefined` for a plain call. Used to enforce `new`, and in class hierarchies it holds the most-derived constructor — which is how abstract base classes detect direct instantiation."},{q:"What does the `thisArg` parameter of `map` and `forEach` do?",d:1,p:`This`,c:[`AMZ`,`TCS`],a:"It sets `this` inside a non-arrow callback: `arr.map(function (x) { return x * this.k; }, obj)`. Most iteration methods accept it and it is widely forgotten. It has no effect on arrow callbacks, which ignore any attempt to set `this`."},{q:"What is the difference between `e.target` and `e.currentTarget`?",d:2,p:`DOM`,c:[`AMZ`,`META`,`ATLS`],a:"`target` is the deepest element the event originated on — possibly a child. `currentTarget` is the element the listener is attached to, and equals `this` in a non-arrow listener. Event delegation relies on the distinction: you attach to a parent and read `target` to find what was clicked."},{q:`What is a property descriptor?`,d:2,p:`Objects`,c:[`AMZ`,`GOOG`,`MSFT`],a:"The record describing a property: `value`, `writable`, `enumerable`, `configurable` for a data property, or `get`, `set`, `enumerable`, `configurable` for an accessor. Literal assignment defaults them all to `true`; `Object.defineProperty` defaults them all to `false`."},{q:"What does `enumerable: false` change?",d:2,p:`Objects`,c:[`AMZ`,`MSFT`],a:"The property is hidden from `for...in`, `Object.keys`, `Object.entries`, spread and `JSON.stringify`. It is still readable and still shows in `Object.getOwnPropertyNames` and `Reflect.ownKeys`. Class methods and `Error.prototype.message` are non-enumerable, which is why `JSON.stringify(err)` gives `{}`."},{q:`Compare every way to enumerate an object's properties.`,d:2,p:`Objects`,c:[`AMZ`,`GOOG`,`ATLS`],a:"`for...in` walks own **and inherited** enumerable string keys. `Object.keys/values/entries` are own enumerable strings. `getOwnPropertyNames` adds non-enumerables. `getOwnPropertySymbols` gives symbol keys. `Reflect.ownKeys` gives everything own. Avoid `for...in` — a polluted prototype leaks into it."},{q:`What is the specified order of object keys?`,d:2,p:`Objects`,c:[`GOOG`,`META`,`AMZ`],a:"Integer-like string keys first in ascending numeric order, then other string keys in insertion order, then symbol keys in insertion order. So `{b:1, 2:2, a:3, 1:4}` enumerates as `1, 2, b, a`. If insertion order matters, use a `Map`."},{q:`What is the prototype chain?`,d:1,p:`Objects`,c:[`TCS`,`AMZ`,`INFY`,`GOOG`],a:"Each object has an internal `[[Prototype]]` link to another object. A property lookup that misses walks the chain outward until it finds the key or reaches `null`. That is how `arr.map` is found on `Array.prototype` without being an own property of the array."},{q:"What is the difference between `__proto__` and `prototype`?",d:2,p:`Objects`,c:[`AMZ`,`GOOG`,`TCS`,`META`],a:"`__proto__` is a legacy accessor for an object's actual `[[Prototype]]` link and exists on every object. `.prototype` exists only on constructor **functions** and is the object that instances will be linked to. So `new Foo().__proto__ === Foo.prototype`. Use `Object.getPrototypeOf` rather than `__proto__`."},{q:"Why is `Object.setPrototypeOf` discouraged in hot code?",d:3,p:`Objects`,c:[`GOOG`,`META`,`NFLX`],a:"Changing an object's prototype invalidates every inline cache that has seen that object, forcing deoptimisation. It is far cheaper to create the object with the right prototype using `Object.create` or a constructor than to reassign it later."},{q:"What does `Object.create(null)` give you?",d:2,p:`Objects`,c:[`AMZ`,`GOOG`,`ATLS`],a:'An object with no prototype at all — no `toString`, no `hasOwnProperty`, no `constructor`. That makes it safe as a dictionary for untrusted keys, since `"__proto__"` and `"constructor"` behave as ordinary keys rather than as prototype-pollution vectors. A `Map` is usually the better modern answer.'},{q:`What is prototype pollution?`,d:3,p:`Security`,c:[`GOOG`,`ATLS`,`SFDC`,`CLDF`],a:'An attacker setting a property on `Object.prototype` — typically through a recursive merge or `set(obj, path, value)` helper that accepts `"__proto__"` or `"constructor.prototype"` in the path. Every object then inherits the injected property, which can bypass checks or inject configuration. Guard by rejecting those keys and using `Object.create(null)` or `Map` for untrusted data.'},{q:"How would you implement `instanceof`?",d:3,p:`Polyfill`,c:[`AMZ`,`META`,`FLPK`],a:"Honour `Symbol.hasInstance` first if present; otherwise walk the object's prototype chain looking for the constructor's `.prototype`, returning false for primitives.",code:`function myInstanceOf(o, C) {
  const h = C[Symbol.hasInstance];
  if (typeof h === 'function') return !!h.call(C, o);
  if (o == null || (typeof o !== 'object' && typeof o !== 'function')) return false;
  let p = Object.getPrototypeOf(o);
  while (p) { if (p === C.prototype) return true; p = Object.getPrototypeOf(p); }
  return false;
}`},{q:"How would you implement `Object.create`?",d:2,p:`Polyfill`,c:[`AMZ`,`TCS`,`FLPK`],a:"Create an empty constructor, set its `.prototype` to the given object, and return `new F()` — the instance is then linked to that prototype and nothing else.",code:`function myCreate(proto, descriptors) {
  function F() {}
  F.prototype = proto;
  const o = new F();
  if (descriptors) Object.defineProperties(o, descriptors);
  return o;
}`},{q:`Why does assigning to an inherited property not modify the prototype?`,d:2,p:`Objects`,c:[`AMZ`,`GOOG`,`META`],a:"Assignment always creates an **own** property on the receiver, shadowing the inherited one. The prototype is unchanged, and other instances still see its value. Deleting the own property reveals the prototype's value again — which is why `delete a.x` can appear to 'restore' a value."},{q:"What is the difference between `hasOwnProperty` and `in`?",d:1,p:`Objects`,c:[`TCS`,`AMZ`,`INFY`],a:"`in` searches the whole prototype chain; `hasOwnProperty` checks only own properties. Prefer `Object.hasOwn(obj, key)` (ES2022) — it works on objects created with `Object.create(null)` and cannot be shadowed by a property literally named `hasOwnProperty`."},{q:"What do `Object.freeze`, `seal` and `preventExtensions` do?",d:2,p:`Objects`,c:[`AMZ`,`MSFT`,`ATLS`],a:"`freeze`: no adding, removing or writing properties — but **shallow**, so nested objects stay mutable. `seal`: no adding or removing, existing properties still writable. `preventExtensions`: no adding, everything else unchanged. All three fail silently in sloppy mode and throw in strict."},{q:`How do you deep-freeze an object?`,d:2,p:`Objects`,c:[`AMZ`,`ATLS`],a:"Recurse over `Object.getOwnPropertyNames`, freezing any object-valued property before freezing the parent. Guard against cycles with a `WeakSet` if the structure may be circular.",code:`const deepFreeze = (o, seen = new WeakSet()) => {
  if (!o || typeof o !== 'object' || seen.has(o)) return o;
  seen.add(o);
  for (const k of Object.getOwnPropertyNames(o)) deepFreeze(o[k], seen);
  return Object.freeze(o);
};`},{q:`What is optional chaining and what exactly does it short-circuit on?`,d:1,p:`ES6`,c:[`AMZ`,`TCS`,`ATLS`],a:"`?.` returns `undefined` instead of throwing when the value before it is `null` or `undefined` — and only those two, not other falsy values. It short-circuits the **rest of the chain**, so `a?.b.c` is safe even without a second `?.`. Also works as `?.[key]` and `?.()`."},{q:"What is the difference between `??` and `||`?",d:1,p:`ES6`,c:[`AMZ`,`TCS`,`META`,`INFY`],a:"`||` falls back on any falsy value, so `0 || 10` is `10` and `'' || 'x'` is `'x'` — usually a bug for numeric or string defaults. `??` falls back only on `null` and `undefined`. They cannot be mixed without parentheses, which is a deliberate syntax error to prevent ambiguity."},{q:"Is `class` just syntactic sugar over prototypes?",d:2,p:`Classes`,c:[`AMZ`,`GOOG`,`META`,`TCS`],a:"Mostly, but not exactly. A class throws if called without `new`, is always strict, has non-enumerable methods, sits in the TDZ, supports `super` and `#private`, and can correctly extend built-ins like `Array` and `Error` — none of which a plain function can reproduce."},{q:"How do you implement inheritance without `class`?",d:2,p:`Classes`,c:[`TCS`,`AMZ`,`INFY`],a:"Three steps: call the parent constructor with `Parent.call(this, ...)` for instance fields; set `Child.prototype = Object.create(Parent.prototype)` to link prototypes without sharing them; and repair `Child.prototype.constructor`, which step two overwrote, as a non-enumerable property."},{q:`What are private class fields and how are they enforced?`,d:2,p:`Classes`,c:[`AMZ`,`GOOG`,`ATLS`],a:"`#name` fields are enforced by the language: access from outside is a **syntax error at parse time**, not a runtime check. They are invisible to `Object.keys`, `JSON.stringify` and `structuredClone` — which means cloning an instance silently loses its private state. `#x in obj` is the brand-check idiom."},{q:`What are static blocks and private statics?`,d:2,p:`Classes`,c:[`GOOG`,`MSFT`],a:"`static { ... }` (ES2022) runs once when the class is defined, with access to private statics — used for complex initialisation that a field initialiser cannot express. `static #count` gives class-level private state, useful for instance counters and registries."},{q:`Are static members inherited?`,d:2,p:`Classes`,c:[`AMZ`,`MSFT`],a:"Yes. `class B extends A` links `B.[[Prototype]]` to `A`, so `B` inherits `A`'s statics. Inside a static method `this` is the class it was **called on**, so `B.create()` in an inherited `static create() { return new this(); }` constructs a `B`."},{q:"Why must `super()` come before `this` in a derived constructor?",d:2,p:`Classes`,c:[`AMZ`,`GOOG`,`MSFT`],a:"In a derived class the instance is created by the **base** constructor, so `this` is in a TDZ until `super()` returns. Touching it earlier throws `ReferenceError: Must call super constructor before accessing 'this'`. This is also why extending built-ins works — only real `super()` can initialise their internal slots."},{q:"What breaks when you extend `Error`?",d:2,p:`Classes`,c:[`AMZ`,`ATLS`,`STRP`],a:'`this.name` is inherited as `"Error"`, so logs lie about the type — set it explicitly. `JSON.stringify(err)` gives `{}` because `message` and `stack` are non-enumerable. And transpiling class-extends-Error to ES5 silently breaks `instanceof`, because `Error.call(this)` cannot initialise the internal slots.'},{q:"What is `Symbol.species`?",d:3,p:`Classes`,c:[`GOOG`,`MSFT`],a:"A static getter deciding which constructor derived methods use when creating new instances. By default `MyArray.prototype.map` returns a `MyArray`; overriding `static get [Symbol.species]() { return Array; }` makes it return a plain `Array` — useful when your subclass has an incompatible constructor signature."},{q:`What is a mixin and how do you implement one?`,d:2,p:`Classes`,c:[`AMZ`,`GOOG`,`ATLS`],a:"Reusable behaviour applied to multiple unrelated classes. Two forms: copying descriptors onto a prototype (`Object.assign` is wrong if the mixin has getters — it invokes them), or a class factory `const M = Base => class extends Base { ... }`, which builds a real prototype chain so `super` and `instanceof` work."},{q:`When should you prefer composition over inheritance?`,d:2,p:`Classes`,c:[`AMZ`,`GOOG`,`ATLS`,`MSFT`],a:"When capabilities combine along more than one axis, when you would otherwise want multiple inheritance, or when behaviour must change at runtime. Inheritance forces one taxonomy chosen up front — the classic failure is `Penguin extends Bird` inheriting a `fly` it must then override to throw."},{q:`What are getters and setters, and what should you avoid in them?`,d:1,p:`Classes`,c:[`TCS`,`AMZ`,`MSFT`],a:"Accessor properties defined with `get`/`set` that look like data but run code. Avoid expensive work or side effects in a getter — `JSON.stringify`, spread and devtools all invoke getters, sometimes repeatedly, and a getter that fetches or mutates produces baffling behaviour."},{q:`How do you make a class abstract?`,d:2,p:`Classes`,c:[`MSFT`,`AMZ`,`EPAM`],a:"Check `new.target` in the constructor and throw when it equals the abstract class itself, so only subclasses can be instantiated. For abstract methods, define them to throw, or check for their presence in the constructor.",code:`class Shape {
  constructor() {
    if (new.target === Shape) throw new TypeError('Shape is abstract');
  }
  area() { throw new Error('not implemented'); }
}`}],S=[{q:`Describe the event loop in one rule.`,d:2,p:`EventLoop`,c:[`AMZ`,`GOOG`,`META`,`TCS`],a:`Run synchronous code to completion, drain the **entire** microtask queue (including tasks added during the drain), optionally render, then take exactly **one** macrotask — and repeat. Every ordering puzzle follows from that.`},{q:`What goes in the microtask queue versus the macrotask queue?`,d:2,p:`EventLoop`,c:[`AMZ`,`META`,`ATLS`],a:"Microtasks: promise callbacks, the continuation after each `await`, `queueMicrotask`, `MutationObserver`, and in Node `process.nextTick` (in a separate higher-priority queue). Macrotasks: `setTimeout`, `setInterval`, `setImmediate`, I/O completions, and UI events."},{q:`Does an async function body run asynchronously?`,d:2,p:`EventLoop`,c:[`AMZ`,`GOOG`,`META`],a:"No — it runs **synchronously up to the first `await`**. Only the continuation after each `await` becomes a microtask. This is why a `console.log` at the top of an async function appears before code that follows the call."},{q:"Why does an infinite microtask chain freeze the page but an infinite `setTimeout` chain does not?",d:3,p:`EventLoop`,c:[`GOOG`,`META`,`AMZ`],a:`Microtasks are drained to exhaustion, including ones queued during the drain — so a self-scheduling microtask never lets the loop reach rendering or any macrotask. A self-scheduling macrotask yields after each iteration, so the browser can paint and handle input between them.`},{q:"Does `await Promise.resolve()` yield to the browser?",d:3,p:`EventLoop`,c:[`GOOG`,`META`],a:"No. It queues a **microtask**, which runs before rendering — so the page stays frozen. To actually yield, await a macrotask (`setTimeout(r, 0)`) or a frame (`requestAnimationFrame`). This is the most common mistake when trying to chunk long work."},{q:`How do you process a large array without freezing the UI?`,d:3,p:`EventLoop`,c:[`GOOG`,`META`,`ATLS`],a:"Chunk the work and yield between chunks with `setTimeout` or `requestAnimationFrame`, ideally using a time budget (do as much as fits in ~5 ms per frame). For genuinely CPU-bound work measured in seconds, move it to a Web Worker instead."},{q:"Why is `setTimeout(fn, 0)` not zero?",d:1,p:`EventLoop`,c:[`AMZ`,`TCS`,`META`],a:`HTML clamps timeouts to a minimum of 1 ms, and to 4 ms after five levels of nesting. Beyond that the delay is a **minimum**: the callback runs only once the stack is empty and microtasks are drained, so a long synchronous block can delay it by seconds. Background tabs clamp far harder.`},{q:`Name Node's event loop phases in order.`,d:3,p:`EventLoop`,c:[`AMZ`,`NFLX`,`UBER`,`PYPL`],a:"timers → pending callbacks → idle/prepare → poll → check → close callbacks. Between every phase, and between individual callbacks, Node drains the `process.nextTick` queue and then the promise microtask queue."},{q:"Why is the order of `setTimeout(0)` and `setImmediate` non-deterministic at the top level?",d:3,p:`EventLoop`,c:[`AMZ`,`NFLX`,`UBER`],a:"`setTimeout(fn, 0)` is clamped to 1 ms. Whether the timers phase finds it ready on the first loop iteration depends on how long process startup took — so on a fast machine `setImmediate` runs first, on a slower one the timer does. It is a genuine race."},{q:`Why is that order deterministic inside an I/O callback?`,d:3,p:`EventLoop`,c:[`AMZ`,`NFLX`,`UBER`],a:"An I/O callback runs in the **poll** phase, and the very next phase is **check**, where `setImmediate` lives — so it fires on the same loop turn. The timer must wait for the loop to come back around to the timers phase. Inside I/O, `setImmediate` always wins."},{q:"What is `process.nextTick` and when should you use it?",d:3,p:`EventLoop`,c:[`AMZ`,`NFLX`,`UBER`],a:"A Node-specific queue drained before promise microtasks, making it the highest-priority deferral. Legitimate uses are narrow: letting a caller attach listeners before you emit, or making an API consistently async. It can starve the event loop, so Node's own docs recommend `setImmediate` for almost everything else."},{q:`Which Node operations use the libuv thread pool?`,d:3,p:`EventLoop`,c:[`AMZ`,`NFLX`,`PYPL`],a:"`fs.*`, `dns.lookup`, `crypto` (pbkdf2, scrypt, randomBytes) and `zlib` — four threads by default, tunable with `UV_THREADPOOL_SIZE` before any I/O. Network sockets do **not**: they use epoll/kqueue/IOCP, which is why they scale to tens of thousands of connections."},{q:"Where does `requestAnimationFrame` fit in the loop?",d:2,p:`EventLoop`,c:[`GOOG`,`META`,`ATLS`],a:"After the microtask drain and before style, layout and paint, at most once per display refresh. It is the correct place for visual updates, and it auto-throttles to near zero in a background tab — which `setTimeout` does not."},{q:"What is the difference between `queueMicrotask` and `Promise.resolve().then`?",d:2,p:`EventLoop`,c:[`GOOG`,`META`],a:"Both queue a microtask; `queueMicrotask` is cheaper because it allocates no promise. The meaningful difference is error handling: a throw inside `queueMicrotask` becomes an uncaught global error, while one inside `.then` rejects the returned promise and can be caught downstream."},{q:`What are the states of a promise?`,d:1,p:`Promises`,c:[`TCS`,`AMZ`,`INFY`,`COG`],a:"Pending, fulfilled or rejected. The transition from pending is **irreversible** and happens once; later `resolve`/`reject` calls are ignored. 'Settled' means fulfilled or rejected; 'resolved' means locked in to a value, which may itself be a pending promise."},{q:`Is the promise executor synchronous?`,d:2,p:`Promises`,c:[`AMZ`,`META`,`GOOG`],a:"Yes — the function passed to `new Promise` runs immediately and synchronously. Code after `resolve()` inside it still executes. Only the `.then` callbacks are deferred, always as microtasks even if the promise is already settled."},{q:`What determines the value of the next promise in a chain?`,d:2,p:`Promises`,c:[`AMZ`,`GOOG`,`META`],a:"Returning a plain value fulfils with it; returning a promise **adopts** it and unwraps one level; returning nothing fulfils with `undefined`; and throwing rejects. A `.then` without an `onRejected` is transparent to rejections, which pass through to the next `.catch`."},{q:"How does `.finally` differ from `.then`?",d:2,p:`Promises`,c:[`AMZ`,`ATLS`],a:`It runs on both paths and **ignores its return value**, passing the original value or reason through — which is exactly right for cleanup. Two exceptions: it can still reject by throwing, and returning a promise delays the chain until that promise settles.`},{q:"Compare `Promise.all`, `allSettled`, `race` and `any`.",d:2,p:`Promises`,c:[`AMZ`,`GOOG`,`META`,`ATLS`],a:"`all`: fulfils with all values, rejects on the first rejection (fail-fast). `allSettled`: waits for every one and never rejects, giving status objects. `race`: settles as the first one settles, fulfilled or rejected. `any`: fulfils with the first fulfilment, rejects with an `AggregateError` only if all reject."},{q:"Does `Promise.all` cancel the other promises when one rejects?",d:2,p:`Promises`,c:[`AMZ`,`GOOG`,`STRP`],a:"No. A promise is a result, not a handle on running work — the other requests still complete and consume resources, and their later rejections may surface as unhandled. Thread an `AbortSignal` through if you need real cancellation."},{q:`Can you cancel a promise?`,d:2,p:`Promises`,c:[`AMZ`,`GOOG`,`META`],a:"Not the promise itself — you cancel the **operation** with `AbortController`, passing its `signal` into `fetch` or your own async function, after which the promise rejects with an `AbortError`. `Promise.race` against a timeout only makes you stop waiting; the work continues."},{q:`How do you add a timeout to a promise?`,d:2,p:`Promises`,c:[`AMZ`,`STRP`,`ATLS`],a:"`Promise.race` against a rejecting timer — but clear the timer in a `.finally`, or in Node the outstanding handle keeps the process alive. Better, use `AbortSignal.timeout(ms)` with anything that accepts a signal, since that also cancels the underlying work."},{q:`What is the most common async performance bug?`,d:2,p:`Promises`,c:[`AMZ`,`GOOG`,`META`,`ATLS`],a:"Awaiting inside a loop when the operations are independent, which serialises them. Calling an async function starts the work; `await` only decides when you block. Use `Promise.all(items.map(fn))` — or a bounded pool once the count is large."},{q:"Why is `Promise.all` over 10,000 fetches a bad idea?",d:2,p:`Promises`,c:[`AMZ`,`UBER`,`STRP`],a:`It opens all 10,000 at once, exhausting sockets and file descriptors and tripping server rate limits — often performing worse than a bounded pool. Use a concurrency-limited map that runs N workers each pulling the next index.`},{q:`Write a concurrency-limited async map.`,d:3,p:`Promises`,c:[`AMZ`,`UBER`,`STRP`,`ATLS`],a:"Spawn `limit` worker loops that each claim the next index and await the task. The shared counter is safe because JavaScript is single-threaded, so no two workers can interleave between the read and the increment.",code:`async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let i = 0;
  const worker = async () => {
    while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); }
  };
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return out;
}`},{q:"Why does `try/catch` not catch an error thrown inside `setTimeout`?",d:2,p:`Promises`,c:[`AMZ`,`TCS`,`META`],a:"`try/catch` protects the stack frames created while it is on the stack. The timer callback runs later from an empty stack, so nothing wraps it — the throw becomes an uncaught exception. This is the fundamental reason promises exist: they carry errors along the chain rather than relying on the stack."},{q:`What happens to an unhandled promise rejection in Node?`,d:2,p:`Promises`,c:[`AMZ`,`NFLX`,`UBER`],a:"Since Node 15 it **terminates the process** by default, which is correct — a swallowed rejection leaves the program in an unknown state. Mark deliberate fire-and-forget with `void p.catch(log)` and install a `process.on('unhandledRejection')` handler that logs and exits."},{q:"What is the difference between `return p` and `return await p` inside a try block?",d:3,p:`Promises`,c:[`GOOG`,`META`,`ATLS`],a:"`return p` returns before the promise settles, so a later rejection escapes the `try` and is **not** caught. `return await p` suspends inside the `try`, so the rejection is caught locally. Outside a `try` they are equivalent apart from an extra microtask tick."},{q:`What is a thenable?`,d:2,p:`Promises`,c:[`GOOG`,`AMZ`],a:"Any object with a callable `.then`. The resolution procedure adopts thenables as promises, which is what makes jQuery deferreds and Bluebird interoperable. It is also a hazard: a data object with a property named `then` will be treated as a promise if you resolve with it."},{q:`Why does resolving with a promise cost extra microtask ticks?`,d:3,p:`Promises`,c:[`GOOG`,`META`],a:"The spec requires resolving a thenable to queue an additional job to call its `then`, and another to deliver the result — so `async function g() { return Promise.resolve(2); }` settles two ticks later than one returning a plain value. This is the mechanism behind the classic async ordering puzzles."},{q:"How would you implement `Promise.all`?",d:3,p:`Polyfill`,c:[`AMZ`,`META`,`FLPK`,`ATLS`],a:`Track a remaining counter, write each result into its index to preserve order, resolve when the counter hits zero, and reject immediately on any rejection. Handle the empty-array case by resolving at once.`,code:`Promise.myAll = (xs) => new Promise((res, rej) => {
  const arr = [...xs]; const out = new Array(arr.length); let left = arr.length;
  if (!left) return res([]);
  arr.forEach((p, i) => Promise.resolve(p).then(
    v => { out[i] = v; if (--left === 0) res(out); }, rej));
});`},{q:"How would you implement `Promise.allSettled`?",d:3,p:`Polyfill`,c:[`AMZ`,`META`,`FLPK`],a:"Map each input to a promise that never rejects — it resolves to a status object either way — then delegate to `Promise.all`.",code:`Promise.mySettled = (xs) => Promise.all(
  [...xs].map(p => Promise.resolve(p).then(
    value  => ({ status: 'fulfilled', value }),
    reason => ({ status: 'rejected', reason })))
);`},{q:`How would you implement a retry with exponential backoff?`,d:3,p:`Promises`,c:[`AMZ`,`STRP`,`UBER`,`ATLS`],a:"Loop with a try/catch; on failure, check a `retryOn` predicate so you never retry a 4xx, sleep for a **jittered** exponential delay capped at a maximum, honour `Retry-After` if present, and support an `AbortSignal` so the whole sequence can be cancelled."},{q:`Why does a retry need jitter?`,d:2,p:`Promises`,c:[`AMZ`,`UBER`,`STRP`,`CLDF`],a:`Without it, every client that failed at the same moment retries at the same moment, recreating the spike on a fixed cadence and preventing the service from recovering. Full jitter — a random delay between 0 and the exponential ceiling — spreads them best.`},{q:"What is the difference between `arguments` and rest parameters?",d:1,p:`Functions`,c:[`TCS`,`AMZ`,`INFY`],a:"`arguments` is array-like with no array methods, absent in arrow functions, aliased to the named parameters in sloppy mode, and a deoptimisation hint. Rest parameters give a real array, work in arrows, and only collect the parameters after the named ones."},{q:"What does `fn.length` return?",d:1,p:`Functions`,c:[`AMZ`,`GOOG`,`ZOHO`],a:"The number of parameters **before** the first one with a default value or the rest parameter. So `(a, b = 1, ...c) => {}` has length 1. This matters for `curry` implementations, which use it as the default arity and therefore break on functions with defaults."},{q:`When are default parameter values evaluated?`,d:2,p:`Functions`,c:[`AMZ`,`GOOG`],a:"At call time, left to right, and only when the argument is `undefined` — never for `null`, `0`, `''` or `false`. Later defaults can reference earlier parameters, and the parameter list has its own scope that sits between the outer scope and the function body."},{q:`What is the difference between currying and partial application?`,d:2,p:`Functions`,c:[`AMZ`,`GOOG`,`ATLS`],a:"Currying transforms `f(a,b,c)` into `f(a)(b)(c)` — one argument at a time, arity preserved. Partial application fixes some arguments and returns a function of the rest, any number at a time. `bind` does partial application; every curried function supports it."},{q:"Write a `curry` supporting both `f(1)(2)(3)` and `f(1,2)(3)`.",d:3,p:`Polyfill`,c:[`AMZ`,`META`,`FLPK`,`ATLS`],a:`Accumulate arguments and call the target once you have enough, otherwise return a collector that recurses with the merged list.`,code:`const curry = (fn, arity = fn.length) =>
  function curried(...args) {
    return args.length >= arity
      ? fn.apply(this, args)
      : (...more) => curried.apply(this, [...args, ...more]);
  };`},{q:"What is the difference between `compose` and `pipe`?",d:1,p:`Functions`,c:[`AMZ`,`ATLS`,`GOOG`],a:"Same function, opposite fold direction. `compose(f,g,h)(x)` is `f(g(h(x)))` — right to left, matching mathematical notation. `pipe(f,g,h)(x)` is `h(g(f(x)))` — left to right, matching execution order and generally easier to read."},{q:`Explain debounce versus throttle.`,d:2,p:`Functions`,c:[`AMZ`,`GOOG`,`META`,`FLPK`,`ATLS`],a:`Debounce waits for a **quiet period** and then fires once — right for search-as-you-type, autosave and resize-complete. Throttle fires at most once per interval regardless of burst density — right for scroll, mousemove and drag, where you need updates *during* the activity.`},{q:`What does a production debounce need beyond a timer?`,d:3,p:`Functions`,c:[`AMZ`,`META`,`ATLS`],a:"`cancel` (essential — a debounced callback firing after a component unmounts is a leak and a React warning), `flush` for explicit commit on submit, a `leading` option, `pending()`, and preservation of `this` and the latest arguments."},{q:"When should you throttle with `requestAnimationFrame` instead of a millisecond interval?",d:2,p:`Functions`,c:[`GOOG`,`META`,`ATLS`],a:`Whenever the handler paints. Running more often than the display refreshes is wasted by definition, and rAF self-adjusts to the actual frame rate — 120 Hz on a fast display, near zero in a background tab — which a fixed interval cannot do.`},{q:`What is memoisation and what must a production version handle?`,d:2,p:`Functions`,c:[`AMZ`,`GOOG`,`ATLS`,`FLPK`],a:"Caching results keyed by arguments in a closure. Production concerns: recurse through the **wrapper** or the cache is never hit; key objects by identity in a `WeakMap` rather than by `JSON.stringify`; and bound the cache with an LRU, because an unbounded memo on user input is a memory leak."},{q:`What makes a function pure and why does it matter?`,d:1,p:`Functions`,c:[`AMZ`,`ATLS`,`GOOG`],a:`Its return value depends only on its arguments and it causes no observable side effects — no mutation, no I/O, no reading the clock or mutable globals. Purity buys testability without mocks, safe memoisation, safe reordering, and referential transparency, which is what makes React's rendering model work.`},{q:`What is a higher-order function?`,d:1,p:`Functions`,c:[`TCS`,`AMZ`,`INFY`],a:"One that takes a function as an argument, returns one, or both. `map`, `filter`, `reduce`, `setTimeout`, `addEventListener`, `debounce` and every decorator qualify. They let you abstract over behaviour rather than only over values."},{q:`What is an IIFE and why do the parentheses matter?`,d:1,p:`Functions`,c:[`TCS`,`AMZ`,`INFY`],a:"An immediately-invoked function expression. A statement cannot begin with `function`, so wrapping it in parentheses puts the parser in expression context. Before modules it was the standard way to create a private scope; the still-useful modern form is the async IIFE for top-level `await` in non-module code."}],ne=[{q:`Which array methods mutate and which return a new array?`,d:1,p:`Arrays`,c:[`TCS`,`AMZ`,`INFY`,`META`],a:"Mutate: `push`, `pop`, `shift`, `unshift`, `splice`, `sort`, `reverse`, `fill`, `copyWithin`. Copy: `slice`, `concat`, `map`, `filter`, `flat`, `flatMap`, and the ES2023 additions `toSorted`, `toReversed`, `toSpliced`, `with`."},{q:"What are `toSorted`, `toReversed` and `with`?",d:1,p:`Arrays`,c:[`META`,`VERC`,`ATLS`],a:"ES2023 copying versions of the mutating methods, ideal for immutable state. `arr.with(2, 'x')` replaces one index without mutation, replacing the awkward `[...a.slice(0,2), 'x', ...a.slice(3)]` idiom."},{q:"Why does `[10, 9, 1].sort()` give `[1, 10, 9]`?",d:1,p:`Arrays`,c:[`TCS`,`AMZ`,`INFY`,`ZOHO`],a:"The default comparator converts every element to a string and compares UTF-16 code units, so `'10'` sorts before `'9'`. Always pass a comparator: `(a, b) => a - b` for numbers."},{q:"Is `Array.prototype.sort` stable?",d:2,p:`Arrays`,c:[`GOOG`,`META`,`AMZ`],a:`Guaranteed stable since ES2019 — equal elements keep their relative order. That makes the sort-by-successive-keys idiom valid. Before then V8 used an unstable quicksort for arrays over ten elements, so the technique silently broke on large inputs.`},{q:`How do you sort strings correctly for a locale?`,d:2,p:`Arrays`,c:[`GOOG`,`BKNG`,`ZLND`],a:"`localeCompare`, or better an `Intl.Collator` created once and reused — it is far faster on large arrays. Its `numeric: true` option gives natural ordering of embedded numbers, so `'file 9'` sorts before `'file 10'`."},{q:`What is a sparse array and why does it matter?`,d:2,p:`Arrays`,c:[`GOOG`,`META`,`AMZ`],a:"An array with holes, created by `new Array(3)` or `[1, , 3]`. The older methods — `map`, `filter`, `forEach`, `reduce` — **skip holes**, while spread, `Array.from` and `for...of` treat them as `undefined`. That is why `new Array(n).map(...)` silently does nothing and `Array.from({length: n}, (_, i) => i)` is the reliable range idiom."},{q:"What is the O(n²) trap in `reduce`?",d:2,p:`Arrays`,c:[`GOOG`,`META`,`AMZ`],a:"Spreading the accumulator each iteration — `(acc, x) => [...acc, x]` — copies the whole array every time. At 10,000 elements that is 50 million copies. Mutate the accumulator you created instead; it is private to the reduce."},{q:"When is `reduce` the wrong tool?",d:2,p:`Arrays`,c:[`AMZ`,`ATLS`,`GOOG`],a:"When the body has branching and side effects, or when it is building several unrelated results at once. Three separate passes with `filter`/`map` cost microseconds and read far better. Reserve `reduce` for genuine folds: sums, min/max, grouping, flattening, composing."},{q:`How do you group an array by a key?`,d:1,p:`Arrays`,c:[`AMZ`,`TCS`,`ATLS`],a:"`Object.groupBy(items, fn)` or `Map.groupBy(items, fn)` (ES2024) — use the `Map` version when the keys are not strings. Before that, a `reduce` pushing into `(acc[key] ??= [])`."},{q:"What is the difference between `includes` and `indexOf`?",d:1,p:`Arrays`,c:[`TCS`,`AMZ`],a:"`includes` uses SameValueZero, so it finds `NaN`; `indexOf` uses `===` and returns `-1` for `NaN`. `includes` also returns a boolean directly rather than requiring a `!== -1` comparison."},{q:`How do you flatten a deeply nested array?`,d:1,p:`Arrays`,c:[`TCS`,`AMZ`,`FLPK`],a:"`arr.flat(Infinity)`. Hand-rolled, recurse and concat, or use a stack for very deep structures to avoid overflowing. `flatMap` is `map` then `flat(1)` in one pass, which is cheaper than doing both."},{q:`How do you remove duplicates from an array?`,d:1,p:`Arrays`,c:[`TCS`,`AMZ`,`INFY`,`ZOHO`],a:"`[...new Set(arr)]` for primitives — O(n) and it treats `NaN` correctly. For objects, deduplicate by a key with a `Map`: `[...new Map(arr.map(o => [o.id, o])).values()]`, which also keeps the last occurrence."},{q:"What is the difference between `slice` and `splice`?",d:1,p:`Arrays`,c:[`TCS`,`INFY`,`COG`,`AMZ`],a:"`slice(start, end)` returns a shallow copy of a range and does not mutate. `splice(start, deleteCount, ...items)` mutates in place, removes and/or inserts, and returns the removed elements. The names are similar and the behaviours are opposite."},{q:"What is the complexity of `shift` and `unshift`?",d:2,p:`Arrays`,c:[`AMZ`,`GOOG`],a:"O(n), because every remaining element must be reindexed. `push` and `pop` are O(1) amortised. Building a queue with `arr.shift()` is O(n²) overall — use two stacks, or an index pointer that advances instead of removing."},{q:`How do you create an array of length n filled with a computed value?`,d:1,p:`Arrays`,c:[`TCS`,`AMZ`,`ZOHO`],a:"`Array.from({ length: n }, (_, i) => i * 2)`. `new Array(n).fill(0)` works for a constant, but `new Array(n).map(...)` does not, because the array is sparse and `map` skips holes."},{q:"Why is `arr.fill([])` dangerous?",d:2,p:`Arrays`,c:[`AMZ`,`TCS`],a:"Every slot holds the **same** array reference, so pushing into one appears to push into all. Use `Array.from({length: n}, () => [])` to build a distinct object per slot. The same trap applies to `Object.fromEntries` with a shared default."},{q:`What are the iterable and iterator protocols?`,d:2,p:`Iterators`,c:[`AMZ`,`GOOG`,`ATLS`],a:"An object is **iterable** if it has a `[Symbol.iterator]()` method returning an iterator. An object is an **iterator** if it has `next()` returning `{value, done}`, optionally with `return()` for early exit and `throw()` for delegation. Implement the first and `for...of`, spread, destructuring and `Array.from` all work."},{q:`Which built-ins are iterable?`,d:1,p:`Iterators`,c:[`TCS`,`AMZ`],a:"`Array`, `String`, `Map`, `Set`, `TypedArray`, `arguments`, `NodeList` and generators. Plain **objects are not** — `for...of {}` throws. Use `Object.entries` or make the type iterable by defining `[Symbol.iterator]`."},{q:"What is the difference between `for...in` and `for...of`?",d:1,p:`Iterators`,c:[`TCS`,`AMZ`,`INFY`,`COG`],a:"`for...in` iterates enumerable string **keys**, including inherited ones, on any object — usually the wrong choice. `for...of` iterates **values** via `Symbol.iterator`, works only on iterables, and correctly invokes the iterator's cleanup on `break`."},{q:`Why do generators make cleanup automatic?`,d:3,p:`Iterators`,c:[`GOOG`,`ATLS`],a:"Breaking out of a `for...of` calls the iterator's `return()`, which for a generator resumes execution at its `finally` block. So wrapping a resource in `try/finally` inside a generator guarantees it is released on early exit, throw or completion."},{q:"What does `yield*` do that a manual loop does not?",d:3,p:`Iterators`,c:[`GOOG`,`META`],a:"It forwards the full protocol — `next(v)`, `throw(e)` and `return(v)` — to the delegate, and evaluates to the delegate's `return` value. A `for (const x of inner()) yield x;` only forwards values, so two-way communication and early termination break."},{q:`What is two-way communication in a generator?`,d:3,p:`Iterators`,c:[`GOOG`,`META`,`NFLX`],a:"`next(v)` sends `v` into the generator as the **result of the suspended `yield` expression**, so `const a = yield 1` receives whatever the consumer passes next. This is what lets generators model coroutines, and it is how early async libraries such as `co` implemented `await` before it existed."},{q:`How do async generators help with paginated APIs?`,d:3,p:`Iterators`,c:[`AMZ`,`STRP`,`SHOP`,`ATLS`],a:"An `async function*` can `yield*` each page's items while looping over `nextUrl`, so the caller writes a flat `for await (const item of ...)` and never sees pages. `break` stops the loop **and** prevents the next page being fetched, because the generator stays suspended at the `await`."},{q:`Why are generators useful for infinite sequences?`,d:3,p:`Iterators`,c:[`GOOG`,`META`],a:"They are demand-driven: nothing downstream can pull a value the upstream has not produced, so a `map`/`filter`/`take` pipeline over an infinite source uses O(1) memory and generates only the values actually consumed. The array equivalent would need to materialise every intermediate collection."},{q:"When would you use a `Map` over a plain object?",d:1,p:`Iterators`,c:[`AMZ`,`GOOG`,`TCS`,`ATLS`],a:"Non-string keys; guaranteed insertion order even for numeric-looking keys; frequent adds and deletes (`delete` on an object deoptimises it); a real `.size`; and untrusted keys, since object keys collide with prototype properties. Use an object for fixed-shape records and anything you must `JSON.stringify`."},{q:"What is a `WeakMap` for?",d:2,p:`Iterators`,c:[`AMZ`,`GOOG`,`META`],a:`Associating data with an object without keeping that object alive — entries vanish when the key becomes unreachable. Ideal for per-DOM-node caches, private instance state and identity-keyed memoisation. Keys must be objects, and it is not enumerable or sizeable because that would make GC observable.`},{q:"What is a `WeakRef` and `FinalizationRegistry`?",d:3,p:`Memory`,c:[`GOOG`,`META`,`NFLX`],a:"`WeakRef` holds a reference that does not prevent collection; `deref()` returns the value or `undefined`. `FinalizationRegistry` runs a callback after collection. Both are explicitly discouraged for general use — collection timing is unspecified and varies by engine, so they suit caches and diagnostics, not correctness."},{q:`What does destructuring do with defaults and renaming?`,d:1,p:`ES6`,c:[`TCS`,`AMZ`,`INFY`],a:"`const { a: x = 1, b: { c } = {} } = obj` renames `a` to `x`, defaults it when `undefined` (not `null`), and safely destructures a nested object by defaulting the intermediate. Array destructuring supports holes (`[, second]`) and a rest element."},{q:`How do you swap two variables without a temp?`,d:1,p:`ES6`,c:[`TCS`,`ZOHO`,`INFY`],a:"`[a, b] = [b, a]`. Note a leading semicolon is needed if the previous line did not end with one, because the parser would otherwise read `]` as an index into the previous expression."},{q:`What is the difference between rest and spread?`,d:1,p:`ES6`,c:[`TCS`,`AMZ`,`INFY`],a:"Same `...` token, opposite directions. Rest **collects** remaining items into an array or object, and appears in parameter lists and destructuring patterns. Spread **expands** an iterable or object's properties, and appears in calls, array literals and object literals."},{q:`What is the difference between spreading an array and spreading an object?`,d:2,p:`ES6`,c:[`AMZ`,`GOOG`],a:"Array spread uses `Symbol.iterator`, so it works on any iterable and throws on a plain object. Object spread copies own enumerable properties — including symbols, and **invoking getters** — and works on any value, ignoring primitives. `{...'ab'}` gives `{0:'a',1:'b'}`."},{q:`What are tagged template literals?`,d:2,p:`ES6`,c:[`GOOG`,`META`,`VERC`],a:"A function called with the literal's string parts and interpolated values: `tag`strings${v}``. The tag receives `(strings, ...values)` and `strings.raw` for unescaped text. Used by styled-components, `graphql` tags, and safe-HTML escaping helpers that sanitise every interpolated value."},{q:`What are labelled statements used for?`,d:2,p:`ES6`,c:[`AMZ`,`GOOG`],a:"Breaking or continuing an **outer** loop from inside a nested one: `outer: for (…) { for (…) { break outer; } }`. It is the only structured way to exit multiple levels without a flag variable or extracting a function."},{q:"What does `Object.fromEntries` do?",d:1,p:`ES6`,c:[`AMZ`,`ATLS`],a:"Builds an object from `[key, value]` pairs — the inverse of `Object.entries`. Combined they give you object map/filter: `Object.fromEntries(Object.entries(o).filter(([k, v]) => v != null))`. It also converts a `Map`, `URLSearchParams` or `FormData` to a plain object."},{q:`What are logical assignment operators?`,d:1,p:`ES6`,c:[`AMZ`,`TCS`,`META`],a:"`||=`, `&&=` and `??=`, which assign only when the left side is falsy, truthy or nullish respectively. They **short-circuit**, so `obj.x ??= expensive()` does not evaluate the right side when `x` is already set — unlike `obj.x = obj.x ?? expensive()`."},{q:"What is numeric separator syntax and what is `Array.prototype.at`?",d:1,p:`ES6`,c:[`TCS`,`AMZ`],a:"`1_000_000` is a readability-only separator ignored by the parser. `at(i)` indexes an array or string with support for **negative** indices, so `arr.at(-1)` is the last element without `arr[arr.length - 1]`."},{q:`What are the built-in error types?`,d:1,p:`Errors`,c:[`TCS`,`AMZ`,`INFY`],a:"`Error`, `TypeError` (wrong type or calling a non-function), `ReferenceError` (undeclared or TDZ), `SyntaxError` (parse failure), `RangeError` (out of range, stack overflow), `URIError`, `EvalError`, and `AggregateError` from `Promise.any`. Subclass `Error` for your own."},{q:`How do you create a custom error correctly?`,d:2,p:`Errors`,c:[`AMZ`,`ATLS`,`STRP`],a:'Extend `Error`, call `super(message, { cause })`, and set `this.name` explicitly — otherwise the inherited name is `"Error"` and every log line is wrong. Add `Error.captureStackTrace?.(this, MyError)` in Node to keep the constructor out of the trace.'},{q:"What is `error.cause`?",d:2,p:`Errors`,c:[`AMZ`,`ATLS`,`STRP`],a:"The ES2022 standard way to wrap an error without losing the original: `new Error('loading user failed', { cause: err })`. The low-level error says what failed, the wrapper says what you were attempting — you need both, and the chain is walkable via repeated `.cause`."},{q:"Why does `JSON.stringify(err)` return `{}`?",d:2,p:`Errors`,c:[`AMZ`,`ATLS`],a:"`message` and `stack` are non-enumerable own properties, so `stringify` skips them. Serialise explicitly with `{ name, message, stack, cause }`, or define a `toJSON` on your custom error class. This catches out anyone logging errors as JSON."},{q:"Where should you place `try` in an async loop?",d:2,p:`Errors`,c:[`AMZ`,`ATLS`,`UBER`],a:"It is a deliberate choice. `try` **around** the loop stops everything on the first failure — right for a transactional sequence. `try` **inside** isolates each item — right for batch processing. For concurrency with per-item outcomes, use `Promise.allSettled` and partition the results."},{q:`What is the difference between an operational and a programmer error?`,d:2,p:`Errors`,c:[`AMZ`,`NFLX`,`UBER`],a:"Operational errors are expected runtime conditions — a failed request, an invalid input, a full disk — and should be handled and retried. Programmer errors are bugs, such as reading a property of `undefined`; the right response is to crash and let a supervisor restart, because the process state is unknown."},{q:"What do `uncaughtException` and `unhandledRejection` do in Node?",d:2,p:`Errors`,c:[`AMZ`,`NFLX`,`UBER`],a:"They are last-resort hooks for logging, not for recovery — after an uncaught exception the process state is undefined. Log with full context, flush, then `process.exit(1)` and let your supervisor restart. Since Node 15 an unhandled rejection is fatal by default, which is the correct behaviour."},{q:`How does JavaScript garbage collection work?`,d:2,p:`Memory`,c:[`AMZ`,`GOOG`,`META`],a:`Mark and sweep from a set of roots — the global object, the current stack, and active timers and listeners. Anything unreachable is collected. V8 is generational: most objects die young in a small, frequently-scavenged nursery, and survivors are promoted to an old space collected less often with a concurrent mark-compact.`},{q:`Name the four common memory leaks in JavaScript.`,d:2,p:`Memory`,c:[`AMZ`,`GOOG`,`META`,`ATLS`],a:"Event listeners never removed (the emitter is a root and holds a closure over your component); timers and intervals never cleared; unbounded caches and arrays; and detached DOM nodes still referenced by JavaScript. Accidental globals from a missing `var` in sloppy mode are a fifth."},{q:`What is a detached DOM node?`,d:2,p:`Memory`,c:[`GOOG`,`META`,`ATLS`],a:`A node removed from the document but still referenced by JavaScript — typically stored in an array or captured by a closure. It retains its whole subtree, so a single stale reference can hold megabytes. Find them with the 'Detached elements' view or a heap snapshot in devtools.`},{q:"How do you use `AbortController` to prevent listener leaks?",d:2,p:`Memory`,c:[`GOOG`,`META`,`ATLS`,`VERC`],a:"Pass `{ signal }` to every `addEventListener` and to `fetch`, then a single `controller.abort()` on teardown removes them all and cancels in-flight requests. It removes the entire class of 'forgot one `removeEventListener`' bugs.",code:`const ac = new AbortController();
el.addEventListener('click', onClick, { signal: ac.signal });
fetch(url, { signal: ac.signal });
// teardown
ac.abort();`},{q:`How do you find a memory leak in practice?`,d:3,p:`Memory`,c:[`GOOG`,`META`,`NFLX`,`AMZ`],a:"Take a heap snapshot, exercise the suspect flow several times, take another, and compare with 'Objects allocated between snapshots' — anything that grows monotonically across cycles is a leak. Then follow the **retainer path** to find which root is holding it. In Node, `--inspect` plus `heapdump`, or `process.memoryUsage()` trended over time."},{q:`Why does type stability matter for performance?`,d:3,p:`Memory`,c:[`GOOG`,`META`,`NFLX`],a:`The JIT specialises a function to the types it has observed and skips runtime checks. Mixed types at one call site push its inline cache to megamorphic, where the engine stops specialising entirely. Keeping arguments and object shapes consistent is worth far more than any micro-optimisation.`},{q:`What is the cost of creating closures in a hot loop?`,d:2,p:`Memory`,c:[`GOOG`,`META`],a:`Each iteration allocates a new function object and, if it captures anything, an environment record — pressure on the nursery and more GC work. It rarely matters, but in a loop running millions of times, hoisting the function outside and passing state as arguments is measurably cheaper.`}],re=[{q:`Describe the three phases of event propagation.`,d:1,p:`DOM`,c:[`AMZ`,`META`,`TCS`,`FLPK`],a:"Capturing (window down to the target), target, then bubbling (target back up to window). Listeners run in bubbling phase by default; pass `{ capture: true }` for the descent. Focus, scroll and most media events do not bubble."},{q:`What is event delegation and why use it?`,d:1,p:`DOM`,c:[`AMZ`,`META`,`FLPK`,`ATLS`],a:"Attach one listener to a common ancestor and use `e.target.closest(selector)` to identify what was interacted with. One listener instead of thousands, it works for elements added later, and there is nothing to remove when children are destroyed.",code:`list.addEventListener('click', (e) => {
  const item = e.target.closest('[data-id]');
  if (!item || !list.contains(item)) return;
  handle(item.dataset.id);
});`},{q:"What is the difference between `stopPropagation` and `preventDefault`?",d:1,p:`DOM`,c:[`AMZ`,`META`,`TCS`],a:"`preventDefault` cancels the browser's default action — following a link, submitting a form, scrolling — but the event keeps propagating. `stopPropagation` halts propagation but the default still happens. `stopImmediatePropagation` also blocks other listeners on the same element."},{q:`What is a passive event listener?`,d:2,p:`DOM`,c:[`GOOG`,`META`,`ATLS`],a:"`{ passive: true }` promises you will not call `preventDefault`, so the browser can start scrolling without waiting for your handler to finish. Chrome makes `touchstart` and `wheel` passive by default on the document for this reason; calling `preventDefault` in a passive listener is ignored with a console warning."},{q:"What is the difference between `innerHTML`, `textContent` and `innerText`?",d:1,p:`DOM`,c:[`AMZ`,`META`,`TCS`,`FLPK`],a:"`innerHTML` parses HTML — an XSS vector with untrusted input. `textContent` returns all text including hidden elements and does not trigger reflow. `innerText` is layout-aware: it respects CSS visibility and **forces a reflow to read**, which makes it noticeably slower in loops."},{q:`What causes layout thrashing and how do you avoid it?`,d:3,p:`Perf`,c:[`GOOG`,`META`,`ATLS`,`NFLX`],a:"Interleaving reads of layout properties (`offsetHeight`, `getBoundingClientRect`, `scrollTop`) with writes, so each read forces a synchronous reflow of pending writes. Batch all reads, then all writes — or use `requestAnimationFrame` to defer the write phase.",code:`// bad: read/write/read/write -> N reflows
for (const el of els) el.style.height = el.offsetHeight * 2 + 'px';

// good: read all, then write all -> 1 reflow
const hs = els.map(el => el.offsetHeight);
els.forEach((el, i) => { el.style.height = hs[i] * 2 + 'px'; });`},{q:`What is the difference between reflow and repaint?`,d:2,p:`Perf`,c:[`GOOG`,`META`,`AMZ`],a:"Reflow (layout) recomputes geometry and is expensive, cascading to descendants — triggered by size, position, font or content changes. Repaint only redraws pixels, triggered by colour or visibility changes. `transform` and `opacity` skip both and are composited on the GPU, which is why they are the only properties to animate."},{q:`What is a DocumentFragment for?`,d:2,p:`Perf`,c:[`AMZ`,`META`,`TCS`],a:"An off-document container you append many nodes to, then insert once — so the browser reflows a single time rather than per node. Appending the fragment moves its children and leaves the fragment empty. `el.append(...nodes)` achieves the same batching in modern browsers."},{q:"How do `MutationObserver`, `IntersectionObserver` and `ResizeObserver` differ?",d:2,p:`DOM`,c:[`GOOG`,`META`,`ATLS`],a:"`MutationObserver` reports DOM changes asynchronously as microtasks. `IntersectionObserver` reports when an element enters or leaves a viewport or root — the correct way to do lazy loading and infinite scroll without scroll handlers. `ResizeObserver` reports element size changes, which no event previously exposed."},{q:`How do you implement infinite scroll without a scroll listener?`,d:2,p:`DOM`,c:[`META`,`FLPK`,`SNAP`,`ATLS`],a:"Put a sentinel element after the last item and observe it with an `IntersectionObserver`. When it intersects, load the next page. This runs off the main thread's scroll path, avoids throttling logic entirely, and stops automatically when you unobserve."},{q:"What is the difference between `HTMLCollection` and `NodeList`?",d:2,p:`DOM`,c:[`AMZ`,`TCS`,`META`],a:"`HTMLCollection` (from `getElementsByTagName`, `children`) is **live** — it updates as the DOM changes, which makes removing elements in a forward loop skip items. `querySelectorAll` returns a **static** `NodeList`. Only `NodeList` has `forEach`; convert either with `Array.from` before iterating."},{q:`What is the shadow DOM?`,d:2,p:`DOM`,c:[`GOOG`,`SFDC`,`ATLS`],a:"An encapsulated subtree attached with `attachShadow({mode:'open'})`. Styles inside do not leak out and outside styles do not leak in, apart from inherited properties and CSS custom properties — which is the intended styling API. It is what makes web components composable without class-name collisions."},{q:"How do you defer script execution, and what is the difference between `defer` and `async`?",d:1,p:`DOM`,c:[`AMZ`,`GOOG`,`TCS`,`META`],a:"Both download in parallel with parsing. `defer` executes after parsing completes, **in document order** — right for scripts with dependencies. `async` executes as soon as it downloads, in arbitrary order, blocking the parser at that moment — right only for independent scripts like analytics. Module scripts are deferred by default."},{q:`Compare localStorage, sessionStorage, cookies and IndexedDB.`,d:1,p:`Browser`,c:[`AMZ`,`META`,`TCS`,`FLPK`],a:"`localStorage`: ~5 MB, synchronous, string-only, persists forever, per-origin. `sessionStorage`: same but cleared with the tab. Cookies: ~4 KB, sent with **every** matching request, the only one servers see. `IndexedDB`: asynchronous, hundreds of megabytes, structured data and blobs — the right choice for anything non-trivial."},{q:"Why is `localStorage` a performance risk?",d:2,p:`Browser`,c:[`GOOG`,`META`,`ATLS`],a:`It is **synchronous** and blocks the main thread on every read and write, including disk I/O on a cold read. Reading it in a scroll handler or on every render is a measurable jank source. Read once into memory at startup and write with a debounce.`},{q:`What are the cookie attributes that matter for security?`,d:2,p:`Security`,c:[`AMZ`,`GOOG`,`STRP`,`PYPL`],a:"`HttpOnly` blocks JavaScript access, which is the main defence against session theft via XSS. `Secure` restricts it to HTTPS. `SameSite=Lax` (the default) or `Strict` mitigates CSRF. `Path` and `Domain` scope it; `Max-Age`/`Expires` control lifetime. A session cookie without `HttpOnly` is a finding in any audit."},{q:`What is XSS and how do you prevent it?`,d:2,p:`Security`,c:[`AMZ`,`GOOG`,`META`,`STRP`,`CLDF`],a:"Injecting script into a page through unescaped output. Prevent by using `textContent` rather than `innerHTML`, escaping on output for the correct context (HTML, attribute, URL, JS each differ), sanitising with DOMPurify when HTML is genuinely needed, and deploying a Content Security Policy as defence in depth. Frameworks escape by default — `dangerouslySetInnerHTML` is where it re-enters."},{q:`What is CSRF and how is it prevented?`,d:2,p:`Security`,c:[`AMZ`,`STRP`,`PYPL`,`GOOG`],a:"A third-party site causing an authenticated request using the victim's cookies. Prevent with `SameSite` cookies, a synchroniser token the attacker cannot read, and checking `Origin`/`Referer` for state-changing requests. Token-in-header auth is immune because the browser does not attach it automatically."},{q:`Explain CORS and the preflight request.`,d:2,p:`Network`,c:[`AMZ`,`GOOG`,`META`,`ATLS`,`FLPK`],a:"The browser blocks a page from **reading** cross-origin responses unless the server opts in with `Access-Control-Allow-Origin`. Non-simple requests — custom headers, methods beyond GET/POST/HEAD, or a JSON content type — trigger an `OPTIONS` **preflight** first. CORS is enforced by the browser only; it is not a server-side security control."},{q:"Why does `Access-Control-Allow-Origin: *` fail with credentials?",d:2,p:`Network`,c:[`AMZ`,`GOOG`,`STRP`],a:"With `credentials: 'include'`, the spec forbids the wildcard — the server must echo the specific origin and also send `Access-Control-Allow-Credentials: true`. This exists so a server cannot accidentally expose authenticated data to every origin at once."},{q:"What is the difference between `fetch` and `XMLHttpRequest`?",d:1,p:`Network`,c:[`AMZ`,`TCS`,`META`],a:"`fetch` is promise-based, streams response bodies, and integrates with `AbortSignal`. Its notable surprise is that it **does not reject on HTTP errors** — a 404 or 500 resolves normally, so you must check `res.ok`. It also does not send cookies cross-origin unless you set `credentials`, and it has no upload progress event, which is why XHR persists for uploads."},{q:`How do you cancel a fetch?`,d:1,p:`Network`,c:[`AMZ`,`META`,`ATLS`],a:"Pass an `AbortController`'s `signal` and call `abort()`; the promise rejects with an `AbortError`, which you should distinguish from real failures. `AbortSignal.timeout(ms)` gives an auto-aborting signal, and `AbortSignal.any([...])` combines a user cancel with a timeout."},{q:`When would you use a Web Worker?`,d:2,p:`Browser`,c:[`GOOG`,`META`,`ATLS`,`FIG`],a:"CPU-bound work that would block the main thread: parsing large JSON, image processing, encryption, diffing, running a spreadsheet engine. Workers have no DOM access and communicate by structured-cloned messages, so the cost is serialisation — use `Transferable` objects or `SharedArrayBuffer` for large binary data to avoid copying."},{q:`What is a Service Worker and how does it differ from a Web Worker?`,d:2,p:`Browser`,c:[`GOOG`,`META`,`SPOT`],a:"A Service Worker is a network proxy for its scope — it intercepts `fetch` events, enabling offline support, caching strategies and push notifications. It is event-driven, terminated when idle, and shared across tabs. A Web Worker is a private background thread for computation with no network interception."},{q:`Explain the browser critical rendering path.`,d:2,p:`Perf`,c:[`GOOG`,`META`,`AMZ`,`NFLX`],a:`HTML → DOM, CSS → CSSOM, combined into the render tree, then layout (geometry), paint (pixels), and composite (layers). CSS is render-blocking and synchronous scripts are parser-blocking, which is why critical CSS is inlined and scripts are deferred.`},{q:`What are the Core Web Vitals?`,d:2,p:`Perf`,c:[`GOOG`,`META`,`SHOP`,`BKNG`],a:`**LCP** — largest contentful paint, under 2.5 s, driven by server response and image loading. **INP** — interaction to next paint, under 200 ms, driven by long main-thread tasks. **CLS** — cumulative layout shift, under 0.1, fixed by reserving space for images and ads. INP replaced FID in 2024 because FID only measured the first interaction.`},{q:`How do you reduce a large JavaScript bundle?`,d:2,p:`Perf`,c:[`GOOG`,`META`,`VERC`,`SHOP`],a:"Code-split by route and by interaction with dynamic `import()`; ensure tree shaking works by using ESM and marking the package `sideEffects: false`; replace heavy dependencies (moment → date-fns or `Intl`); analyse with a bundle visualiser; and serve modern syntax to modern browsers rather than transpiling everything to ES5."},{q:`What is the difference between a CDN cache and the browser cache?`,d:2,p:`Perf`,c:[`CLDF`,`AMZ`,`NFLX`],a:"The browser cache is per-user and controlled by `Cache-Control`; the CDN cache is shared across users and can be purged centrally. Use `Cache-Control: public, max-age=31536000, immutable` for content-hashed assets, and `no-cache` with an `ETag` for HTML so the CDN revalidates while still serving instantly on a match."},{q:`What is a Content Security Policy?`,d:3,p:`Security`,c:[`GOOG`,`CLDF`,`STRP`,`ATLS`],a:"A response header restricting where scripts, styles and other resources may load from, and whether inline script is allowed. A strict CSP using nonces or hashes makes most XSS unexploitable even when an injection exists. Start in `Content-Security-Policy-Report-Only` mode to find violations before enforcing."},{q:`What is clickjacking and how do you prevent it?`,d:2,p:`Security`,c:[`GOOG`,`STRP`,`PYPL`],a:"Framing your page invisibly over a decoy so the user's clicks hit your UI. Prevent with `Content-Security-Policy: frame-ancestors 'none'` (the modern control) or the legacy `X-Frame-Options: DENY`. Never rely on JavaScript frame-busting, which is trivially defeated."},{q:"Why should JWTs not be stored in `localStorage`?",d:2,p:`Security`,c:[`AMZ`,`STRP`,`ATLS`,`PYPL`],a:"Any XSS can read `localStorage` and exfiltrate the token, and unlike a cookie it cannot be marked `HttpOnly`. Prefer an `HttpOnly`, `Secure`, `SameSite` cookie for the session, or keep a short-lived access token in memory with a refresh token in an `HttpOnly` cookie. Also remember a JWT cannot be revoked before expiry without server-side state."},{q:`What does the same-origin policy actually restrict?`,d:2,p:`Security`,c:[`GOOG`,`AMZ`,`META`],a:"Reading cross-origin **responses**, DOM access across frames, and cookie/storage access. It does not block **sending** cross-origin requests, which is why CSRF exists. Origin is scheme + host + port, so `http` and `https` on the same host are different origins."},{q:`How do WebSockets differ from Server-Sent Events and long polling?`,d:2,p:`Network`,c:[`AMZ`,`UBER`,`SNAP`,`ATLS`],a:`WebSockets are full-duplex over a single upgraded connection — right for chat and collaborative editing. SSE is server-to-client only over plain HTTP, with automatic reconnection and event IDs built in — right for notifications and live feeds, and it works through more proxies. Long polling is the fallback that works everywhere and costs the most.`}],ie=[{q:`What is Node.js, precisely?`,d:1,p:`NodeCore`,c:[`AMZ`,`TCS`,`INFY`,`UBER`],a:"A runtime pairing V8 with libuv and a standard library of host APIs — `fs`, `net`, `http`, `crypto`, `Buffer`, `process`. V8 runs the JavaScript; libuv provides the event loop, the thread pool and cross-platform async I/O. Node is not a language, a framework or a web server."},{q:`What is libuv responsible for?`,d:2,p:`NodeCore`,c:[`AMZ`,`NFLX`,`UBER`],a:`The event loop and its phases, the four-thread worker pool for file/DNS/crypto/zlib work, and abstraction over epoll (Linux), kqueue (macOS/BSD) and IOCP (Windows) for socket readiness. It is what makes non-blocking I/O portable.`},{q:`Why does one synchronous operation harm every request?`,d:2,p:`NodeCore`,c:[`AMZ`,`NFLX`,`UBER`,`PYPL`],a:"All requests share one JavaScript thread, so a 200 ms blocking call caps the whole process at five requests per second regardless of cores. The offenders that do not look like I/O are `JSON.parse` on a large payload, `readFileSync`, synchronous crypto, sorting huge arrays and catastrophic regex backtracking."},{q:"What is `UV_THREADPOOL_SIZE` and when should you change it?",d:3,p:`NodeCore`,c:[`AMZ`,`NFLX`,`PYPL`],a:"The libuv worker pool size, default 4, which serves `fs`, `dns.lookup`, `crypto` and `zlib`. Raise it for file- or crypto-heavy services, since four concurrent `readFile` calls saturate it. It must be set before any I/O, and it does nothing for HTTP throughput because sockets do not use the pool."},{q:"What does `process.nextTick` do differently from `setImmediate`?",d:3,p:`NodeCore`,c:[`AMZ`,`NFLX`,`UBER`],a:"`nextTick` callbacks run in their own queue drained before promise microtasks and before the loop advances — so a recursive `nextTick` starves the loop entirely. `setImmediate` runs in the check phase, after poll. Node's own guidance is to prefer `setImmediate` for deferral."},{q:"What is in the `process` object that you should know?",d:1,p:`NodeCore`,c:[`AMZ`,`TCS`,`UBER`],a:"`argv` and `env` for input, `exit`/`exitCode` and the `SIGTERM`/`SIGINT` handlers for shutdown, `memoryUsage()` and `cpuUsage()` for diagnostics, `hrtime.bigint()` for precise timing, `cwd()`, `platform`, `version`, and the `uncaughtException`/`unhandledRejection` last-resort hooks."},{q:`How do you implement graceful shutdown in Node?`,d:3,p:`NodeProd`,c:[`AMZ`,`UBER`,`NFLX`,`STRP`],a:"On `SIGTERM`: stop accepting new connections with `server.close()`, fail readiness so the load balancer drains you, wait for in-flight requests with a hard timeout, close database pools and queues, then `process.exit(0)`. Without the drain wait, every in-flight request during a deploy becomes a 502.",code:`process.on('SIGTERM', async () => {
  server.close();                       // stop accepting
  await Promise.race([drain(), sleep(15000)]);
  await Promise.all([db.end(), queue.close()]);
  process.exit(0);
});`},{q:"What are `worker_threads` and when do you use them?",d:3,p:`NodeConc`,c:[`AMZ`,`NFLX`,`UBER`,`ATLS`],a:"Real OS threads inside one process, each with its own V8 isolate and event loop, communicating by message passing or `SharedArrayBuffer`. Use them for CPU-bound work — image processing, compression, heavy parsing — so the main thread keeps serving requests. They do not help with I/O, which is already async."},{q:"What is the difference between `cluster` and `worker_threads`?",d:2,p:`NodeConc`,c:[`AMZ`,`UBER`,`NFLX`],a:"`cluster` forks whole **processes** sharing a listening socket, giving you one core's worth of throughput each with full isolation — a crash takes down one worker. `worker_threads` are threads inside one process, cheaper to create and able to share memory, but a fatal error can take down everything. Cluster for scaling HTTP; threads for offloading CPU."},{q:`How do you scale a Node service across cores?`,d:2,p:`NodeConc`,c:[`AMZ`,`UBER`,`PYPL`],a:"Run one process per core — with `cluster`, or better with an external supervisor such as PM2, systemd or a container orchestrator, which also handles restarts and rolling deploys. Keep processes stateless so any can serve any request, and put sessions in Redis rather than in memory."},{q:"What is the difference between `spawn`, `exec`, `execFile` and `fork`?",d:2,p:`NodeConc`,c:[`AMZ`,`UBER`,`TCS`],a:"`spawn` streams output and is right for long-running or large-output commands. `exec` buffers output through a **shell** — convenient, injectable, and it fails on output over `maxBuffer`. `execFile` skips the shell, which is the safe default. `fork` spawns a Node child with an IPC channel for `send`/`message`."},{q:`How do you avoid command injection when running a subprocess?`,d:2,p:`Security`,c:[`AMZ`,`GOOG`,`STRP`],a:"Use `execFile` or `spawn` with an argument **array** and no shell, so user input can never be interpreted as shell syntax. Never build a command string with template literals. If a shell is genuinely required, validate against an allowlist rather than trying to escape."},{q:`What are the differences between CommonJS and ES modules?`,d:2,p:`Modules`,c:[`AMZ`,`GOOG`,`NFLX`,`VERC`],a:"CJS is synchronous, dynamic (`require` can be conditional), resolved at runtime, and gives you a **copy** of primitive exports. ESM is static and hoisted, asynchronously resolved, supports top-level `await` and tree shaking, and gives **live bindings** — the importer sees later reassignments. ESM is also always strict and has no `__dirname` or `require`."},{q:`What is a live binding?`,d:3,p:`Modules`,c:[`GOOG`,`VERC`,`ATLS`],a:"An ESM import references the exporting module's binding rather than copying its value, so if the module reassigns the variable the importer sees the new value. With CJS, `const { count } = require('./m')` captures the value at that moment and never updates — which is why counters and lazily initialised singletons behave differently between the two."},{q:`How do you use ESM in Node?`,d:1,p:`Modules`,c:[`AMZ`,`VERC`,`ATLS`],a:'Set `"type": "module"` in `package.json`, or use the `.mjs` extension. Then `import` requires **file extensions** in relative specifiers, `__dirname` is replaced by `import.meta.dirname` (or `fileURLToPath(import.meta.url)`), and `require` is unavailable — though `module.createRequire` provides an escape hatch.'},{q:"Can you `require` an ES module?",d:2,p:`Modules`,c:[`AMZ`,`VERC`,`NFLX`],a:"Historically no, because ESM resolution is asynchronous — you had to use dynamic `import()`, which returns a promise. Node 22+ supports `require()` of a synchronous ESM graph behind a flag, and 23+ enables it by default. Dynamic `import()` remains the portable answer."},{q:"What is the `exports` field in package.json?",d:3,p:`Modules`,c:[`VERC`,`GOOG`,`ATLS`],a:"It defines a package's public entry points and **blocks deep imports** into internal files, which `main` never did. It supports conditional exports — `import`, `require`, `node`, `browser`, `types`, `default` — so one package can ship dual CJS/ESM builds. Order matters: `default` must come last, and `types` first for TypeScript."},{q:"How does Node resolve `require('lodash')`?",d:2,p:`Modules`,c:[`AMZ`,`TCS`,`NFLX`],a:"It walks up from the current directory checking each `node_modules` for `lodash`, then reads its `package.json` `exports` or `main`, falling back to `index.js`. Relative paths try the exact file, then `.js`/`.json`/`.node`, then as a directory. The resolved module is cached in `require.cache` by absolute path."},{q:`What is the module cache and when does it cause bugs?`,d:2,p:`Modules`,c:[`AMZ`,`NFLX`,`ATLS`],a:"A module's body executes **once**; subsequent `require`s return the same exports object. That makes every module a singleton — convenient for connection pools, and a hazard when a module holds mutable state that tests need to reset. Deleting from `require.cache` is the usual escape and is best avoided outside tests."},{q:`How do circular dependencies behave in CJS versus ESM?`,d:3,p:`Modules`,c:[`GOOG`,`AMZ`,`VERC`],a:"In CJS the second `require` gets a **partially populated** exports object — whatever was assigned before the cycle — so you silently receive `undefined`. In ESM, hoisting means function declarations are available, but touching an uninitialised `let`/`const` throws a clear TDZ `ReferenceError`. Restructure rather than working around either."},{q:`What is tree shaking and what prevents it?`,d:2,p:`Modules`,c:[`GOOG`,`VERC`,`SHOP`,`META`],a:'Eliminating unused exports, which requires **static** ESM imports so the bundler can prove nothing is used. It is defeated by CommonJS, by dynamic property access on a namespace import, and by side effects at module top level — declare `"sideEffects": false` in `package.json` so the bundler may drop untouched modules entirely.'},{q:`What is a Buffer?`,d:1,p:`NodeFS`,c:[`AMZ`,`TCS`,`NFLX`],a:"A fixed-length view of raw bytes outside the V8 heap, a subclass of `Uint8Array`. It is how Node represents binary data — file contents, socket payloads, crypto output. Always use `Buffer.alloc(n)` rather than the deprecated `new Buffer(n)`, which returned uninitialised memory and leaked adjacent data."},{q:"Why is `Buffer.allocUnsafe` unsafe?",d:2,p:`Security`,c:[`AMZ`,`GOOG`,`NFLX`],a:"It skips zero-filling, so the buffer contains whatever was previously in that memory — potentially fragments of other requests' data. It is faster and legitimate when you immediately overwrite every byte; otherwise use `Buffer.alloc`."},{q:`What are the four stream types?`,d:2,p:`Streams`,c:[`AMZ`,`NFLX`,`UBER`],a:`Readable (source), Writable (sink), Duplex (both, like a TCP socket), and Transform (a duplex that modifies as data passes, like gzip or a CSV parser). All of them handle backpressure, which is the reason to use streams at all.`},{q:`What is backpressure and how do streams handle it?`,d:3,p:`Streams`,c:[`AMZ`,`NFLX`,`UBER`,`ATLS`],a:"A fast producer overwhelming a slow consumer. `writable.write()` returns `false` when its buffer exceeds `highWaterMark`; a correct producer pauses until `'drain'`. `pipe` and `pipeline` do this automatically — hand-rolled loops that ignore the return value are how Node processes run out of memory."},{q:"Why use `pipeline` instead of `pipe`?",d:2,p:`Streams`,c:[`AMZ`,`NFLX`,`UBER`],a:"`pipe` does **not** forward errors or clean up: if the destination fails, the source is left open and leaks a file descriptor. `stream.pipeline` (or `pipeline` from `stream/promises`) propagates errors, destroys every stream in the chain, and gives you a single completion callback or promise.",code:`import { pipeline } from 'node:stream/promises';
await pipeline(
  createReadStream('in.csv'),
  parseCsv(),
  createGzip(),
  createWriteStream('out.gz')
);`},{q:`When should you stream instead of buffering?`,d:2,p:`Streams`,c:[`AMZ`,`NFLX`,`UBER`,`SHOP`],a:"Whenever the data can exceed a few megabytes or arrives incrementally: file uploads and downloads, proxying, CSV or NDJSON processing, video. Buffering a 2 GB file with `readFile` needs 2 GB of RAM per concurrent request, and Buffers larger than `buffer.constants.MAX_LENGTH` throw outright."},{q:`What is the difference between flowing and paused stream modes?`,d:3,p:`Streams`,c:[`AMZ`,`NFLX`],a:"In paused mode you pull with `read()`; attaching a `'data'` listener or calling `pipe()` switches to flowing mode, where data is pushed at you as fast as it arrives. Attaching `'data'` and then doing slow async work without pausing is a classic memory blow-up — use `for await...of`, which respects backpressure automatically."},{q:`How do you read a large file line by line?`,d:2,p:`NodeFS`,c:[`AMZ`,`TCS`,`NFLX`],a:"`readline.createInterface({ input: createReadStream(path), crlfDelay: Infinity })` and `for await (const line of rl)`. It is memory-constant and handles both line endings. Splitting a `readFile` result on `\\n` needs the whole file in memory and breaks on `\\r\\n`."},{q:"What is the difference between `fs`, `fs/promises` and `fs.*Sync`?",d:1,p:`NodeFS`,c:[`AMZ`,`TCS`,`INFY`],a:"Callback API, promise API, and blocking API. Use `fs/promises` in application code. `*Sync` is acceptable only at startup — reading config before the server listens — and never inside a request handler, where it blocks every concurrent user."},{q:"Why should you use `path.join` rather than string concatenation?",d:1,p:`NodeFS`,c:[`AMZ`,`TCS`,`MSFT`],a:"It normalises separators across platforms and collapses `..` and `.` segments. For untrusted input, `path.join` alone is **not** enough — a `../../etc/passwd` still escapes. Resolve to an absolute path and verify it starts with your allowed base directory before opening anything."},{q:"What is `EventEmitter` and what is its main leak risk?",d:1,p:`NodeFS`,c:[`AMZ`,`TCS`,`NFLX`,`UBER`],a:"Node's synchronous pub/sub base class: `on`, `once`, `emit`, `off`. Listeners are called **synchronously** in registration order. The leak risk is adding listeners without removing them — Node warns at 11 on one event, and the warning is usually a real bug rather than a limit to raise."},{q:"What happens if an EventEmitter emits `'error'` with no listener?",d:2,p:`Errors`,c:[`AMZ`,`NFLX`,`UBER`],a:"Node throws the error, which typically crashes the process. This is deliberate: an unhandled stream or socket error should be loud rather than silent. Always attach an `'error'` handler to every emitter and stream, including ones you only write to."},{q:`What is middleware in Express?`,d:1,p:`NodeHTTP`,c:[`AMZ`,`TCS`,`INFY`,`FLPK`],a:"A function `(req, res, next)` in an ordered chain. It can inspect and mutate the request, end the response, or call `next()` to continue — or `next(err)` to jump to error middleware. Order is everything: body parsers and auth must be registered before the routes that depend on them."},{q:`How does error-handling middleware differ?`,d:2,p:`NodeHTTP`,c:[`AMZ`,`TCS`,`FLPK`],a:"It takes **four** parameters, `(err, req, res, next)` — Express detects error handlers by arity — and must be registered last. In Express 4, errors thrown in an **async** handler are not caught: you must `next(err)` explicitly or wrap handlers. Express 5 forwards rejected promises automatically."},{q:`How do you handle async errors in Express 4?`,d:2,p:`NodeHTTP`,c:[`AMZ`,`FLPK`,`SHOP`],a:"Wrap each async handler so rejections reach `next`, or upgrade to Express 5. Without the wrapper, a rejected promise in a handler produces a hung request and an unhandled rejection.",code:`const wrap = (fn) => (req, res, next) =>
  Promise.resolve(fn(req, res, next)).catch(next);

app.get('/u/:id', wrap(async (req, res) => {
  res.json(await getUser(req.params.id));
