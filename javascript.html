  this.classList.add('active');       // works — this is btn
});

// an arrow does NOT
btn.addEventListener('click', () => {
  this.classList.add('active');       // this is the outer scope!
});

// FIX: use event.currentTarget, which always works
btn.addEventListener('click', (e) => {
  e.currentTarget.classList.add('active');
});
// note: e.target is what was CLICKED (possibly a child),
//       e.currentTarget is what the listener is ATTACHED to`,why:"The DOM sets `this` to the element for regular-function listeners, which arrows deliberately ignore. `e.currentTarget` is the reliable answer because it works in both styles and makes the intent explicit — and the `target` versus `currentTarget` distinction is essential once event delegation enters the picture."}],takeaway:"`this` is lost whenever a method is detached from its object. Arrows fix callbacks, `currentTarget` fixes DOM listeners, and closures avoid the problem altogether."},{t:`guess`,code:`const obj = {
  x: 10,
  f() { return this.x; },
  g: () => this?.x,
  h() { return (() => this.x)(); },
  i() { return (function () { return this?.x; })(); },
};
console.log(obj.f(), obj.g(), obj.h(), obj.i());

const { f } = obj;
console.log(typeof f);
try { f(); } catch (e) { console.log(e.constructor.name); }`,out:`10 undefined 10 undefined
"function"
TypeError`,why:"`f` is implicit binding, so `10`. `g` is an arrow at object-literal level — object literals create no scope, so its `this` is the module's, giving `undefined`. `h` is an arrow *inside* a method, inheriting that method's `this`, so `10`. `i` is a plain function call, so `this` is `undefined` in strict mode and the optional chain saves it. The detached `f()` throws because `this` is `undefined` and `undefined.x` is a `TypeError`."}]},{id:`th-polyfill`,title:`call, apply and bind — including polyfills`,blocks:[{t:`table`,head:[``,`Invokes immediately?`,`Arguments`,`Returns`],rows:[["`fn.call(thisArg, a, b)`",`Yes`,`Comma-separated`,`The function's return value`],["`fn.apply(thisArg, [a, b])`",`Yes`,`An array or array-like`,`The function's return value`],["`fn.bind(thisArg, a)`",`**No**`,`Comma-separated (partial application)`,`A new bound function`]]},{t:`q`,lvl:`hard`,title:"Implement `call`, `apply` and `bind` from scratch",tag:`the classic polyfill trio · asked at every level`,stmt:"Write each without using the built-in versions, handling edge cases including `new` on a bound function.",hint:"For `call`, the trick is to temporarily make the function a property of the target object so implicit binding does the work.",approaches:[{name:`call`,idea:`Attach the function to the object, invoke it via the dot, remove it.`,code:`Function.prototype.myCall = function (thisArg, ...args) {
  if (typeof this !== 'function') {
    throw new TypeError('myCall must be called on a function');
  }
  // sloppy-mode semantics: null/undefined -> globalThis; primitives boxed
  thisArg = thisArg == null ? globalThis : Object(thisArg);

  // a unique key so we cannot collide with an existing property
  const key = Symbol('fn');
  Object.defineProperty(thisArg, key, {
    value: this, enumerable: false, configurable: true, writable: true,
  });

  try {
    return thisArg[key](...args);      // implicit binding does the work
  } finally {
    delete thisArg[key];               // clean up even if it threw
  }
};

function greet(greeting, punct) { return greeting + ', ' + this.name + punct; }
greet.myCall({ name: 'Ada' }, 'Hi', '!');   // "Hi, Ada!"`,cx:`O(1)`,why:"The whole trick is rule 4: making the function a property of `thisArg` means calling it through the dot sets `this` correctly. Three details separate a good answer from a passable one: using a `Symbol` key so you cannot overwrite a real property, `defineProperty` with `enumerable: false` so the temporary key never appears in `Object.keys`, and `try/finally` so the cleanup happens even when the function throws."},{name:`apply`,idea:`Identical, but the arguments arrive as an array-like.`,code:`Function.prototype.myApply = function (thisArg, argsArray) {
  if (typeof this !== 'function') throw new TypeError('not a function');
  thisArg = thisArg == null ? globalThis : Object(thisArg);

  let args = [];
  if (argsArray != null) {
    if (typeof argsArray !== 'object') {
      throw new TypeError('CreateListFromArrayLike called on non-object');
    }
    args = Array.from(argsArray);      // handles arguments, NodeList, etc.
  }

  const key = Symbol('fn');
  Object.defineProperty(thisArg, key, { value: this, configurable: true });
  try { return thisArg[key](...args); } finally { delete thisArg[key]; }
};

Math.max.myApply(null, [3, 1, 4, 1, 5]);   // 5`,cx:`O(n) in argument count`,why:"`Array.from` rather than a spread is deliberate: it accepts genuine array-likes such as `arguments` and `NodeList`, which do not have `Symbol.iterator` in every environment. The `null` argsArray case must be allowed (it means no arguments), while a non-object non-null value throws — matching the specification."},{name:`bind`,idea:`Return a new function that remembers the receiver and any preset arguments.`,code:`Function.prototype.myBind = function (thisArg, ...boundArgs) {
  if (typeof this !== 'function') throw new TypeError('not a function');
  const target = this;

  function bound(...callArgs) {
    // KEY CASE: called with 'new' -> ignore thisArg, use the new object
    const isNew = this instanceof bound;
    return target.apply(isNew ? this : thisArg, [...boundArgs, ...callArgs]);
  }

  // preserve the prototype chain so 'new bound()' produces
  // an instance of the ORIGINAL constructor
  if (target.prototype) {
    bound.prototype = Object.create(target.prototype);
  }
  return bound;
};

// partial application
const add = (a, b, c) => a + b + c;
add.myBind(null, 1, 2)(3);          // 6

// and the 'new' case that most answers miss:
function Point(x, y) { this.x = x; this.y = y; }
const BoundPoint = Point.myBind({ ignored: true }, 10);
const p = new BoundPoint(20);
p.x;                                 // 10   — bound arg
p.y;                                 // 20   — call arg
p instanceof Point;                  // true — prototype preserved
// the bound 'this' was correctly IGNORED because we used new`,cx:`O(1) to bind · O(args) per call`,why:'The `new` case is what interviewers use to separate memorised answers from understood ones. The specification says a bound function used as a constructor ignores its bound `this` and uses the freshly created object — so the `this instanceof bound` check detects construction, and `Object.create(target.prototype)` makes `instanceof Point` hold. The real `bind` also sets `length` (original length minus bound args) and `name` (`"bound Point"`), which is worth mentioning.'}],takeaway:"`call`/`apply` exploit implicit binding via a temporary symbol property. `bind` must ignore its receiver when invoked with `new` and must preserve the prototype chain."},{t:`q`,lvl:`medium`,title:`Arrow functions versus regular functions`,tag:`six concrete differences`,stmt:`List every way an arrow function differs from a regular function, and say when each difference makes arrows the wrong choice.`,approaches:[{name:`The six differences`,idea:`Arrows are not just shorter syntax.`,code:`// 1. NO OWN this — lexical, cannot be rebound
const arrow = () => this;
arrow.call({ a: 1 });              // this is still the outer scope

// 2. NO arguments OBJECT
function f() { return arguments; }      // [Arguments] { '0': 1 }
const g = () => arguments;              // ReferenceError (or outer's)
const h = (...args) => args;            // use rest instead

// 3. CANNOT BE A CONSTRUCTOR
const A = () => {};
new A();                           // TypeError: A is not a constructor
// arrows have no [[Construct]] and no .prototype property

// 4. NO OWN super OR new.target
class B extends A {
  m() { return () => super.m(); }  // arrow can USE super lexically
}

// 5. NOT HOISTED as a callable
sayHi();                           // works — declaration
function sayHi() {}
sayBye();                          // TypeError — const in TDZ
const sayBye = () => {};

// 6. NO name inference in some positions, and
//    cannot be a generator: 'async () => {}' is fine,
//    but there is no arrow generator syntax`,why:"Differences 1 and 3 are the ones with real consequences. No own `this` is why arrows fix callbacks and break DOM listeners and object methods. No `[[Construct]]` is why an arrow can never be a class or constructor — and also why it has no `prototype` property at all, which occasionally surprises people inspecting objects."},{name:`When arrows are wrong`,idea:`Four cases where a regular function is required.`,code:`// ✗ OBJECT METHODS that need 'this'
const bad = { n: 1, get: () => this.n };      // undefined
const ok  = { n: 1, get() { return this.n; } };

// ✗ PROTOTYPE METHODS
Foo.prototype.bad = () => this.x;              // wrong this
Foo.prototype.ok  = function () { return this.x; };

// ✗ DOM EVENT HANDLERS relying on 'this' being the element
el.addEventListener('click', function () { this.remove(); });

// ✗ CONSTRUCTORS / anything used with new

// ✓ arrows are RIGHT for:
//   callbacks inside methods         arr.map(x => this.scale * x)
//   short pure functions             const double = x => x * 2
//   promise chains                   .then(r => r.json())
//   class fields needing binding     handleClick = () => { ... }`,why:"The rule that covers all four: use an arrow when you *want* the surrounding `this`, and a regular function when you want the caller to supply one. Object and prototype methods are defined to receive their `this` from the call site, so an arrow there is always a bug."}],takeaway:"Arrows have no own `this`, `arguments`, `super`, `new.target` or `prototype`, and cannot be constructed. Use them when you want to inherit `this`, never when the caller should supply it."},{t:`guess`,code:`function Counter() {
  this.n = 0;
  setTimeout(function () { this.n++; }, 0);
  setTimeout(() => { this.n++; }, 0);
}
const c = new Counter();
setTimeout(() => console.log(c.n), 10);

const o = { n: 0, inc: function () { this.n++; } };
const detached = o.inc;
try { detached(); } catch (e) { console.log('threw'); }
o.inc.call(o); console.log(o.n);`,out:`1                  only the arrow incremented c.n
threw
1`,why:"The regular-function timeout callback is invoked by the timer with no receiver, so `this` is `undefined` in strict mode (or the global object in sloppy mode, where it would create a global `NaN` instead of throwing — a classic silent bug). The arrow inherits `this` from the `Counter` constructor, so it correctly increments the instance. `detached()` throws for the same reason, and `.call(o)` restores the binding explicitly."},{t:`qa`,q:"What is `this` at the top level of a script, a module and Node?",a:"In a classic browser `<script>`, top-level `this` is `window`. In an **ES module** it is `undefined`, because modules are always strict and have no global `this`. In a Node **CommonJS** file it is `module.exports` — an empty object — which surprises everyone the first time. Inside any function called plainly, it is `undefined` in strict mode and `globalThis` in sloppy mode. Use `globalThis` when you actually want the global object, since it works in every environment."},{t:`qa`,q:"What does `new` actually do?",a:"Four steps. It creates a new empty object; sets that object's `[[Prototype]]` to the constructor's `.prototype`; calls the constructor with `this` bound to the new object; and returns the new object **unless** the constructor explicitly returns a different object, in which case that wins (returning a primitive is ignored). That last rule is what makes the factory-returning-an-object pattern work inside a constructor.",code:`function New(Ctor, ...args) {
  const obj = Object.create(Ctor.prototype);
  const ret = Ctor.apply(obj, args);
  return (ret !== null && typeof ret === 'object') || typeof ret === 'function'
    ? ret : obj;
}`},{t:`qa`,q:"What is `new.target`?",a:"Inside a function, `new.target` is the constructor that was invoked with `new`, or `undefined` for a plain call. It lets a function detect how it was called — historically used to enforce `new` (`if (!new.target) throw new TypeError('use new')`) or to auto-apply it. In a class hierarchy it holds the *most derived* constructor, which is how abstract base classes are implemented: `if (new.target === Shape) throw new TypeError('Shape is abstract')`."}]}]},h={id:`objects`,num:`05`,title:`Objects, Prototypes & Classes`,kicker:`Property descriptors, the prototype chain, classes, inheritance and mixins`,sections:[{id:`ob-props`,title:`Properties and descriptors`,blocks:[{t:`p`,x:"Every property in JavaScript is described by a **property descriptor** — a small record of attributes. Most of the time you never see it, but it explains why some properties cannot be overwritten, why some are invisible to `Object.keys`, and how getters work."},{t:`code`,x:`// DATA descriptor
{ value: 42, writable: true, enumerable: true, configurable: true }

// ACCESSOR descriptor
{ get() {...}, set(v) {...}, enumerable: true, configurable: true }

  writable      can the value be reassigned?
  enumerable    does it show in for...in, Object.keys, spread, JSON?
  configurable  can the descriptor be changed, or the property deleted?

// literal assignment defaults everything to TRUE
const o = {};
o.a = 1;
Object.getOwnPropertyDescriptor(o, 'a');
// { value: 1, writable: true, enumerable: true, configurable: true }

// defineProperty defaults everything to FALSE
Object.defineProperty(o, 'b', { value: 2 });
Object.getOwnPropertyDescriptor(o, 'b');
// { value: 2, writable: false, enumerable: false, configurable: false }

o.b = 99;               // silently ignored in sloppy mode
                        // TypeError in strict mode
Object.keys(o);         // ['a']  — 'b' is not enumerable
JSON.stringify(o);      // '{"a":1}'`,cap:`The defaults flip depending on how you create the property. This catches people constantly.`},{t:`q`,lvl:`medium`,title:`Build a read-only, hidden, computed property set`,tag:`descriptors in practice`,stmt:`Create an object with a constant ID that cannot be changed or deleted, a hidden internal field, and a computed full name.`,approaches:[{name:`Solution`,idea:"One `defineProperties` call, three different descriptor shapes.",code:`const user = {};

Object.defineProperties(user, {
  id: {
    value: 'u_991',
    writable: false, enumerable: true, configurable: false,
  },
  _internal: {
    value: { cacheKey: 'abc' },
    writable: true, enumerable: false, configurable: true,
  },
  first: { value: 'Ada',     writable: true, enumerable: true },
  last:  { value: 'Lovelace', writable: true, enumerable: true },
  fullName: {
    get() { return this.first + ' ' + this.last; },
    set(v) { [this.first, this.last] = v.split(' '); },
    enumerable: true, configurable: true,
  },
});

user.fullName;                 // 'Ada Lovelace'
user.fullName = 'Grace Hopper';
user.first;                    // 'Grace'

Object.keys(user);             // ['id','first','last','fullName']
                               //   _internal is hidden
JSON.stringify(user);
// '{"id":"u_991","first":"Grace","last":"Hopper","fullName":"Grace Hopper"}'
//   note: the GETTER is invoked and its result serialised

'use strict';
user.id = 'hacked';            // TypeError: Cannot assign to read only property
delete user.id;                // TypeError: Cannot delete property`,why:"Three things worth noticing. Non-writable assignment fails **silently in sloppy mode** and throws only in strict — which is a strong argument for always being in strict mode. `JSON.stringify` invokes enumerable getters, so a computed property is serialised as data. And `configurable: false` is irreversible: you can never re-configure or delete that property afterwards, even to make it writable again."}],takeaway:"Literal assignment gives you all-true descriptors; `defineProperty` gives you all-false. `configurable: false` is a one-way door."},{t:`q`,lvl:`medium`,title:`Iterate object properties correctly`,tag:`the six ways, and which to use`,stmt:`Compare every way to enumerate an object's properties, including inherited, non-enumerable and symbol keys.`,approaches:[{name:`The comparison`,idea:`They differ on three axes: own vs inherited, enumerable vs not, and string vs symbol.`,code:`const proto = { inherited: 1 };
const obj = Object.create(proto);
obj.own = 2;
Object.defineProperty(obj, 'hidden', { value: 3, enumerable: false });
obj[Symbol('sym')] = 4;

for (const k in obj) console.log(k);        // 'own', 'inherited'
                                            //   OWN + INHERITED enumerable strings
Object.keys(obj);                           // ['own']
Object.values(obj);                         // [2]
Object.entries(obj);                        // [['own', 2]]
Object.getOwnPropertyNames(obj);            // ['own','hidden'] — incl. non-enum
Object.getOwnPropertySymbols(obj);          // [Symbol(sym)]
Reflect.ownKeys(obj);                       // ['own','hidden',Symbol(sym)]
                                            //   EVERYTHING own`,out:`own
inherited
['own']
[2]
[['own', 2]]
['own', 'hidden']
[Symbol(sym)]
['own', 'hidden', Symbol(sym)]`,why:"`for...in` is the only one that walks the prototype chain, which is why it is almost always the wrong tool — it will happily enumerate properties someone added to `Object.prototype`. If you must use it, guard with `Object.hasOwn(obj, k)`. `Reflect.ownKeys` is the complete own-property list and is what you need for a faithful clone."},{name:`Key ordering`,idea:`Property order is specified, and it is not insertion order.`,code:`const o = { b: 1, 2: 2, a: 3, 1: 4, [Symbol('s')]: 5 };
Object.keys(o);          // ['1', '2', 'b', 'a']

// the specified order for own property keys:
//   1. integer-like string keys, ASCENDING NUMERIC order
//   2. other string keys, INSERTION order
//   3. symbol keys, INSERTION order
//
// "integer-like" means a canonical array index: '0','1','42'
//   NOT '01', '1.5', '-1', or ' 1'

const m = new Map([['b', 1], [2, 2], ['a', 3]]);
[...m.keys()];           // ['b', 2, 'a']  — Map is PURE insertion order`,why:"This is why using numeric-looking string keys in an object silently reorders them, and it is a real bug source when serialising ordered data. If insertion order matters, use a `Map` — it guarantees it for keys of any type, and it also allows non-string keys."}],takeaway:"`Object.keys` for the common case, `Reflect.ownKeys` for completeness, `Map` when order or non-string keys matter. Avoid `for...in`."}]},{id:`ob-proto`,title:`The prototype chain`,blurb:"JavaScript has no classes at the object level. It has objects that delegate to other objects — and `class` is syntax over that.",blocks:[{t:`code`,x:`const arr = [1, 2, 3];
arr.map(x => x);

// where did .map come from? Lookup walks the chain:
//
//   arr                    own: 0,1,2,length   ── no 'map'
//     │ [[Prototype]]
//     ▼
//   Array.prototype        map, filter, push…  ── FOUND
//     │
//     ▼
//   Object.prototype       toString, hasOwnProperty…
//     │
//     ▼
//   null                   end of the chain

Object.getPrototypeOf(arr) === Array.prototype;            // true
Object.getPrototypeOf(Array.prototype) === Object.prototype; // true
Object.getPrototypeOf(Object.prototype);                   // null

// the three terms people confuse:
//   __proto__          the ACTUAL link on an instance (legacy accessor)
//   [[Prototype]]      the spec name for that internal slot
//   .prototype         a property on CONSTRUCTOR FUNCTIONS ONLY —
//                      the object that instances will link to

function Foo() {}
const f = new Foo();
Object.getPrototypeOf(f) === Foo.prototype;   // true
f.prototype;                                   // undefined — instances have none
Foo.prototype.constructor === Foo;             // true`,cap:"`.prototype` lives on the constructor; `[[Prototype]]` lives on the instance."},{t:`note`,k:`gotcha`,x:"Never use `__proto__` in new code. It is a legacy accessor standardised only for web compatibility. Use `Object.getPrototypeOf` / `Object.setPrototypeOf` to read and write, and `Object.create(proto)` to establish the link at construction. `setPrototypeOf` on an existing object is also a serious deoptimisation — V8 invalidates inline caches for that object, so it should never appear in a hot path."},{t:`q`,lvl:`hard`,title:"Implement `new`, `instanceof`, `Object.create` and `inherits`",tag:`prototype mechanics · asked at senior level`,stmt:`Write each from first principles.`,approaches:[{name:`Object.create`,idea:"Create an object whose `[[Prototype]]` is the given object.",code:`function myCreate(proto, descriptors) {
  if (typeof proto !== 'object' && typeof proto !== 'function') {
    throw new TypeError('Object prototype may only be an Object or null');
  }
  // the classic trick: an empty constructor whose .prototype is proto
  function F() {}
  F.prototype = proto;
  const obj = new F();
  if (descriptors) Object.defineProperties(obj, descriptors);
  return obj;
}

const animal = { speak() { return this.name + ' makes a sound'; } };
const dog = myCreate(animal, { name: { value: 'Rex', enumerable: true } });
dog.speak();                        // 'Rex makes a sound'
Object.getPrototypeOf(dog) === animal;   // true`,why:"`new F()` links the result to `F.prototype`, which we set to `proto` — so the new object delegates to `proto` without inheriting anything else. This is exactly what `Object.create` does, and it is worth knowing because `Object.create(null)` produces an object with **no** prototype at all: no `toString`, no `hasOwnProperty`, and therefore safe to use as a dictionary without key collisions."},{name:`new`,idea:`Create, link, call, and decide what to return.`,code:`function myNew(Ctor, ...args) {
  if (typeof Ctor !== 'function') throw new TypeError('not a constructor');

  // 1. create an object linked to Ctor.prototype
  const obj = Object.create(Ctor.prototype);

  // 2. run the constructor with 'this' = the new object
  const result = Ctor.apply(obj, args);

  // 3. an OBJECT return wins; a primitive return is ignored
  return (result !== null && typeof result === 'object') ||
         typeof result === 'function'
    ? result
    : obj;
}

function Point(x, y) { this.x = x; this.y = y; }
const p = myNew(Point, 1, 2);
p instanceof Point;                 // true

// the override rule in action:
function Weird() { this.a = 1; return { b: 2 }; }
myNew(Weird).b;                     // 2 — the returned object wins
function Weird2() { this.a = 1; return 42; }
myNew(Weird2).a;                    // 1 — primitive return ignored`,why:"Step 3 is the rule most people forget, and it is what makes the 'constructor returning a different object' pattern work — used by `Promise` subclass tricks and by some singleton implementations. Note that a `function` return also wins, since functions are objects."},{name:`instanceof`,idea:"Walk the prototype chain looking for the constructor's `.prototype`.",code:`function myInstanceOf(obj, Ctor) {
  if (typeof Ctor !== 'function') throw new TypeError('Right-hand side must be callable');
  // honour the customisation hook first
  const hasInstance = Ctor[Symbol.hasInstance];
  if (typeof hasInstance === 'function') return !!hasInstance.call(Ctor, obj);

  if (obj === null || (typeof obj !== 'object' && typeof obj !== 'function')) {
    return false;                   // primitives are never instances
  }
  const target = Ctor.prototype;
  let proto = Object.getPrototypeOf(obj);
  while (proto !== null) {
    if (proto === target) return true;
    proto = Object.getPrototypeOf(proto);
  }
  return false;
}

class A {} class B extends A {}
myInstanceOf(new B(), A);           // true — walks up through B.prototype
myInstanceOf('str', String);        // false — primitive, not an object
myInstanceOf(new String('s'), String);  // true — boxed object`,cx:`O(depth of the prototype chain)`,why:"The `Symbol.hasInstance` branch is what a complete answer includes: a class can override `instanceof` entirely by defining that static method, which is how libraries implement duck-typed checks. The primitive case is the other detail — `'str' instanceof String` is `false` because a primitive string is not an object and has no prototype chain of its own."},{name:`ES5 inheritance`,idea:"What `class X extends Y` compiles to conceptually.",code:`function Animal(name) { this.name = name; }
Animal.prototype.speak = function () { return this.name + ' makes a sound'; };

function Dog(name, breed) {
  Animal.call(this, name);          // 1. inherit INSTANCE properties (super)
  this.breed = breed;
}

// 2. inherit PROTOTYPE methods
Dog.prototype = Object.create(Animal.prototype);
// 3. repair the constructor pointer, which step 2 clobbered
Object.defineProperty(Dog.prototype, 'constructor', {
  value: Dog, writable: true, configurable: true, enumerable: false,
});

Dog.prototype.speak = function () {
  return Animal.prototype.speak.call(this) + ' (a bark)';   // "super"
};

const d = new Dog('Rex', 'lab');
d.speak();                          // 'Rex makes a sound (a bark)'
d instanceof Dog && d instanceof Animal;   // true

// the WRONG version people write:
Dog.prototype = Animal.prototype;   // now they are the SAME object —
                                    // adding to Dog.prototype pollutes Animal`,why:"Three separate steps, each fixing a different thing: `Animal.call(this)` copies instance fields, `Object.create` links the prototypes without sharing them, and the `constructor` repair restores a property that step 2 overwrote. The `enumerable: false` matters because the native `constructor` is non-enumerable — a plain assignment would make it show up in `for...in`. Seeing this makes `class` syntax feel like a considerable improvement rather than mere sugar."}],takeaway:"`new` = create + link + call + maybe-override-return. `instanceof` walks the chain. ES5 inheritance needs three steps, and getting the `constructor` repair right is the detail that marks experience."},{t:`guess`,code:`function Foo() {}
Foo.prototype.x = 1;
const a = new Foo();
const b = new Foo();

a.x = 99;                    // shadows, does not modify the prototype
console.log(a.x, b.x);

delete a.x;
console.log(a.x);

Foo.prototype.x = 42;
console.log(a.x, b.x);

console.log(Object.hasOwn(a, 'x'), 'x' in a);`,out:`99 1
1
42 42
false true`,why:"Assignment **always** creates an own property on the receiver; it never writes through to the prototype. So `a.x = 99` shadows the inherited value for `a` alone, and deleting the own property reveals the prototype's value again. Mutating `Foo.prototype.x` afterwards is visible to every instance that has not shadowed it — that is live delegation, not copying. The last line shows the distinction the whole model rests on: `hasOwn` checks only the object, `in` checks the whole chain."}]},{id:`ob-classes`,title:`Classes`,blocks:[{t:`code`,x:`class Animal {
  // public field — assigned per instance, before the constructor body
  legs = 4;
  // private field — syntax-enforced, not just convention
  #id = crypto.randomUUID();
  // static members belong to the class itself
  static kingdom = 'Animalia';
  static #count = 0;
  // static initialisation block (ES2022) — runs once at class definition
  static { console.log('Animal class defined'); }

  constructor(name) {
    this.name = name;
    Animal.#count++;
  }

  speak() { return \`\${this.name} makes a sound\`; }     // on the prototype

  get id() { return this.#id; }                         // accessor
  set nickname(v) { this.name = v.trim(); }

  static create(name) { return new this(name); }        // 'this' = the class
  static get count() { return Animal.#count; }

  // brand check using a private field
  static isAnimal(o) { return #id in o; }
}

class Dog extends Animal {
  constructor(name, breed) {
    super(name);              // MUST come before any use of 'this'
    this.breed = breed;
  }
  speak() { return super.speak() + ' (a bark)'; }
}`,cap:`Everything modern class syntax gives you, in one place.`},{t:`table`,head:[`Feature`,`Class`,`ES5 function`],rows:[[`Hoisting`,`Hoisted but in the **TDZ** — cannot use before declaration`,`Fully hoisted`],[`Strict mode`,`Always, automatically`,`Only if declared`],["Called without `new`",`**TypeError**`,"Runs, with `this` undefined or global"],[`Methods enumerable`,"No — invisible to `for...in`","Yes, if assigned to `.prototype`"],["`super`",`Built in`,"Manual `Parent.prototype.m.call(this)`"],[`Private state`,"`#field`, enforced at parse time","Closure or `_name` convention"],[`Static inheritance`,`Automatic — statics are inherited`,`Manual copying`]]},{t:`q`,lvl:`hard`,title:`Extend a built-in, and the trap in doing so`,tag:`subclassing Array and Error`,stmt:"Subclass `Array` and `Error` correctly, and explain what goes wrong without the fixes.",approaches:[{name:`Extending Error`,idea:`Two things need repairing: the name and the prototype under transpilation.`,code:`class ValidationError extends Error {
  constructor(message, field, options) {
    super(message, options);          // 'options' carries { cause }
    this.name = 'ValidationError';    // otherwise it prints "Error"
    this.field = field;
    // keeps this constructor out of the stack trace (V8 only)
    Error.captureStackTrace?.(this, ValidationError);
  }
}

try {
  throw new ValidationError('email is invalid', 'email', {
    cause: new TypeError('not a string'),
  });
} catch (e) {
  console.log(e.name);              // 'ValidationError'
  console.log(e instanceof ValidationError, e instanceof Error);  // true true
  console.log(e.field);             // 'email'
  console.log(e.cause.message);     // 'not a string'
  console.log(e.stack.split('\\n')[0]);  // 'ValidationError: email is invalid'
}

// JSON.stringify(err) gives '{}' — message and stack are non-enumerable.
// If you need to serialise errors:
const serialise = (e) => ({ name: e.name, message: e.message, stack: e.stack });`,why:"`this.name` is required because `Error.prototype.name` is inherited as `\"Error\"`, so without it every log line lies about the type. `cause` (ES2022) is the correct way to chain errors and is far better than stuffing the original into a custom property. The `JSON.stringify` result being `'{}'` catches out anyone logging errors as JSON — `message` and `stack` are non-enumerable own properties."},{name:`Extending Array`,idea:"It mostly works, and `Symbol.species` is the escape hatch.",code:`class Stack extends Array {
  peek() { return this[this.length - 1]; }
  get isEmpty() { return this.length === 0; }
}

const s = new Stack();
s.push(1, 2, 3);
s.peek();                 // 3
s.length;                 // 3  — the exotic length behaviour is inherited
s instanceof Array;       // true

// derived methods return the SUBCLASS by default:
s.map(x => x * 2) instanceof Stack;      // true
s.filter(Boolean) instanceof Stack;      // true

// override that with Symbol.species when you want plain arrays back:
class Stack2 extends Array {
  static get [Symbol.species]() { return Array; }
}
new Stack2(1,2,3).map(x => x) instanceof Stack2;   // false — plain Array

// the constructor trap, inherited from Array:
new Stack(3);             // length 3, EMPTY — not [3]
new Stack(1, 2);          // [1, 2]
Stack.of(3);              // [3] — use .of() to avoid the ambiguity`,why:"`Symbol.species` decides which constructor derived methods use when creating new instances. The default of 'same subclass' is usually right, but if your subclass constructor has a different signature it will break — which is exactly why `species` exists. The single-numeric-argument trap is inherited from `Array` itself and is the reason `Array.of` was added."},{name:`The transpilation trap`,idea:`Down-levelling classes to ES5 breaks built-in subclassing.`,code:`// with target: 'es5', 'class X extends Error' compiles to a function
// that calls Error.call(this) — which IGNORES 'this' and returns a
// fresh Error. The result:
class MyError extends Error {}
new MyError('x') instanceof MyError;    // FALSE when transpiled to ES5

// the workaround, if you must target ES5:
class MyError extends Error {
  constructor(msg) {
    super(msg);
    Object.setPrototypeOf(this, MyError.prototype);   // repair the link
  }
}

// the real fix: target ES2015+ . Every environment that matters
// has supported real classes since 2017.`,why:"This is a genuinely common production bug in older toolchains, and it fails in the worst way — `instanceof` silently returns `false`, so error-handling branches never fire. `Error`, `Array` and `Map` all use internal slots that `Function.prototype.call` cannot initialise, which is why only real `super` works. If you see `setPrototypeOf` repairs in a codebase, this is why."}],takeaway:"Extending `Error` needs `this.name`; extending `Array` gives you `Symbol.species` control. Never transpile class-extends-builtin to ES5 — `instanceof` breaks silently."},{t:`q`,lvl:`medium`,title:`Composition over inheritance, with mixins`,tag:`the design question`,stmt:`Implement mixins two ways, and explain when to prefer composition over an inheritance hierarchy.`,approaches:[{name:`Object mixins`,idea:`Copy behaviour onto a prototype.`,code:`const CanFly = {
  fly() { return \`\${this.name} flies\`; },
  get altitude() { return this._alt ?? 0; },
};
const CanSwim = {
  swim() { return \`\${this.name} swims\`; },
};

class Duck { constructor(name) { this.name = name; } }
Object.assign(Duck.prototype, CanFly, CanSwim);

new Duck('Donald').fly();    // 'Donald flies'

// CAREFUL: Object.assign copies VALUES and INVOKES getters.
// To copy accessors intact, move the descriptors:
function mixin(target, ...sources) {
  for (const src of sources) {
    for (const key of Reflect.ownKeys(src)) {
      if (key === 'constructor') continue;
      Object.defineProperty(target, key,
        Object.getOwnPropertyDescriptor(src, key));
    }
  }
  return target;
}`,why:"The descriptor-copying version matters whenever a mixin defines getters — `Object.assign` would call the getter once and copy its return value as a static data property, silently turning a computed property into a frozen snapshot. This is the same trap as spreading an object with getters."},{name:`Class-factory mixins`,idea:"A function taking a base class and returning a subclass, so `super` works.",code:`const Serializable = (Base) => class extends Base {
  toJSON() { return { ...this, _type: this.constructor.name }; }
  static fromJSON(json) { return Object.assign(new this(), json); }
};

const Timestamped = (Base) => class extends Base {
  constructor(...args) { super(...args); this.createdAt = Date.now(); }
  touch() { this.updatedAt = Date.now(); return this; }
};

class Model {}
class User extends Serializable(Timestamped(Model)) {
  constructor(name) { super(); this.name = name; }
}

const u = new User('Ada');
u.createdAt;                  // set by the Timestamped mixin's constructor
JSON.stringify(u);            // includes _type: 'User'
u instanceof Model;           // true — a real chain, not copying

// the chain that was built:
//   User -> Serializable(...) -> Timestamped(...) -> Model -> Object`,why:"This builds a genuine prototype chain, so `super` calls work, `instanceof` is correct at every level, and each mixin can participate in construction. It is the technique behind libraries like Polymer and lit. The cost is a deeper chain — each mixin adds a link, which slows property lookup slightly and makes stack traces noisier."},{name:`Why composition usually wins`,idea:`Inheritance couples you to a hierarchy you must predict in advance.`,code:`// INHERITANCE: forces a single taxonomy
class Animal {}
class Bird extends Animal { fly() {} }
class Penguin extends Bird {}          // ...but penguins cannot fly
// -> now you override fly() to throw, which breaks the contract
//    (the Liskov substitution problem, in three lines)

// COMPOSITION: capabilities are independent
const makeAnimal = (name) => ({ name });
const withFlight = (o) => ({ ...o, fly: () => \`\${o.name} flies\` });
const withSwim   = (o) => ({ ...o, swim: () => \`\${o.name} swims\` });

const duck    = withSwim(withFlight(makeAnimal('duck')));
const penguin = withSwim(makeAnimal('penguin'));    // simply has no fly

// prefer INHERITANCE when:
//   there is a genuine "is-a" relationship that will not change
//   you need instanceof, or a framework requires a base class
//   the hierarchy is shallow (one or two levels)

// prefer COMPOSITION when:
//   capabilities combine in ways you cannot fully predict
//   you would otherwise need multiple inheritance
//   the behaviour needs to change at runtime`,why:`The penguin example is the classic illustration and it is short enough to actually use in an interview. The deeper point is that inheritance forces you to commit to one axis of variation up front, whereas composition lets capabilities be mixed freely — and requirements almost always turn out to vary along more than one axis.`}],takeaway:"Class-factory mixins give real `super` and `instanceof`; object mixins are simpler but need descriptor copying. Reach for composition unless the 'is-a' relationship is genuine and stable."},{t:`guess`,code:`class A {
  static x = 'A';
  static who() { return this.x; }
}
class B extends A { static x = 'B'; }

console.log(A.who(), B.who());

class C {
  constructor() { console.log(new.target.name); }
}
class D extends C {}
new C(); new D();

class E { m() {} }
console.log(Object.keys(E.prototype).length);
console.log(typeof E, E.prototype.constructor === E);`,out:`A B
C
D
0
"function" true`,why:"Statics are inherited and `this` inside a static method is the class it was **called on**, so `B.who()` finds `B.x`. `new.target` holds the most-derived constructor, which is how abstract base classes detect direct instantiation. Class methods are **non-enumerable**, so `Object.keys(E.prototype)` is empty — unlike ES5 prototype assignment, which produces enumerable methods that pollute `for...in`. And a class is still a function under the hood."},{t:`qa`,q:"Is `class` just syntactic sugar?",a:"Mostly, but not entirely — there are behaviours you cannot reproduce with functions. A class throws if called without `new`; its body is always strict; its methods are non-enumerable; it is in the TDZ rather than fully hoisted; `super` and `#private` have no function equivalent; and `extends` of a built-in like `Array` or `Error` works correctly in a way `Parent.call(this)` cannot, because those constructors initialise internal slots. So 'sugar over prototypes' is the right intuition for the *inheritance model*, and wrong as a claim about equivalence."},{t:`qa`,q:"What is `Object.freeze` and how deep does it go?",a:"It makes an object non-extensible and marks every own property non-writable and non-configurable. It is **shallow** — nested objects remain fully mutable. Frozen assignment fails silently in sloppy mode and throws in strict. `Object.seal` is weaker: no adding or removing properties, but existing ones can still be written. `Object.preventExtensions` is weakest: no new properties, everything else unchanged. For deep immutability, recurse over `Object.getOwnPropertyNames` and freeze each object value.",code:`const deepFreeze = (o) => {
  for (const k of Object.getOwnPropertyNames(o)) {
    const v = o[k];
    if (v && typeof v === 'object') deepFreeze(v);
  }
  return Object.freeze(o);
};`},{t:`qa`,q:"What is `Object.create(null)` for?",a:'It creates an object with **no prototype**, so it has no inherited properties at all — no `toString`, no `hasOwnProperty`, no `constructor`. That makes it the correct choice for a dictionary keyed by untrusted strings: with a normal object, a key of `"__proto__"` or `"constructor"` behaves surprisingly and is a prototype-pollution vector. The trade-off is that you must use `Object.keys(o)` and `Object.hasOwn(o, k)` rather than methods on the object, and `console.log` renders it as `[Object: null prototype]`. A `Map` is usually the better modern answer.'}]}]},g={id:`functions`,num:`06`,title:`Functions & Functional Patterns`,kicker:`Parameters, rest/spread, currying, composition, debounce, throttle and recursion`,sections:[{id:`fn-params`,title:`Parameters and arguments`,blocks:[{t:`code`,x:`function demo(a, b = a * 2, ...rest) {
  console.log(a, b, rest);
  console.log(demo.length);      // 1 — counts params BEFORE the first
                                 //     default or rest
  console.log(arguments.length); // actual arguments passed
}
demo(1);          // 1 2 []
demo(1, 5, 6, 7); // 1 5 [6, 7]

// defaults are evaluated at CALL time, left to right,
// and can reference earlier parameters
function f(a, b = a + 1, c = b + 1) { return [a, b, c]; }
f(1);             // [1, 2, 3]

// a default only fires for undefined — never for null
function g(x = 'def') { return x; }
g();              // 'def'
g(undefined);     // 'def'
g(null);          // null
g(0);             // 0

// defaults create their own SCOPE, before the body's scope
function h(x = 1, y = x) { var x = 99; return [x, y]; }
h();              // [99, 1]  — y saw the PARAMETER x, not the var`,cap:`Four separate behaviours that each cause bugs: length, undefined-only defaults, left-to-right evaluation, and the parameter scope.`},{t:`q`,lvl:`medium`,title:"`arguments` versus rest parameters",tag:`and why rest always wins`,stmt:"List every difference and show three things `arguments` does that surprise people.",approaches:[{name:`Solution`,idea:"`arguments` is an array-like relic; rest gives a real array.",code:`function old() {
  console.log(Array.isArray(arguments));    // false — array-LIKE
  arguments.map;                            // undefined — no array methods
  Array.from(arguments);                    // converting is required
  return typeof arguments;                  // 'object'
}

const modern = (...args) => {
  Array.isArray(args);                      // true — a real array
  return args.map(x => x * 2);              // methods just work
};

// SURPRISE 1: in sloppy mode, arguments is LINKED to the parameters
function sloppy(a) {
  arguments[0] = 99;
  return a;                                 // 99 (!) — they alias
}
function strictFn(a) {
  'use strict';
  arguments[0] = 99;
  return a;                                 // unchanged — no aliasing
}

// SURPRISE 2: arrows have no arguments at all
const arrow = () => arguments;              // ReferenceError, or the
                                            //   ENCLOSING function's

// SURPRISE 3: touching arguments deoptimises the function in V8
//   (leaks it, forces materialisation of the object)`,why:"The sloppy-mode aliasing is the one worth knowing: `arguments` and the named parameters are two views of the same storage, so mutating one changes the other. Strict mode severs the link, which is a good reason to always be strict. Rest parameters have none of these problems, produce a real array, and are the only option in arrows."}],takeaway:"Use rest parameters. `arguments` is array-like, absent in arrows, aliased in sloppy mode, and a deoptimisation hint."},{t:`q`,lvl:`medium`,title:`Currying and partial application`,tag:`asked at every functional-leaning company`,stmt:"Explain the difference between the two, then write a `curry` that supports both `f(1)(2)(3)` and `f(1, 2)(3)`.",approaches:[{name:`The distinction`,idea:`They are related but not the same thing.`,code:`// CURRYING: transform f(a,b,c) into f(a)(b)(c)
//   — always one argument at a time, arity preserved

// PARTIAL APPLICATION: fix some arguments, get a function of the rest
//   — any number at a time, arity reduced

const add3 = (a, b, c) => a + b + c;

// partial application with bind
const add1and2 = add3.bind(null, 1, 2);
add1and2(3);                        // 6

// currying
const curried = (a) => (b) => (c) => a + b + c;
curried(1)(2)(3);                   // 6`,why:`Currying is a transformation of the function's shape; partial application is supplying some arguments now and the rest later. Every curried function supports partial application, but not every partial application is currying. Interviewers often use the terms loosely — defining both crisply is the differentiator.`},{name:`Flexible curry`,idea:`Accumulate arguments until you have enough, then call.`,code:`function curry(fn, arity = fn.length) {
  return function curried(...args) {
    if (args.length >= arity) return fn.apply(this, args);
    return function (...more) {
      return curried.apply(this, [...args, ...more]);
    };
  };
}

const add = curry((a, b, c) => a + b + c);
add(1)(2)(3);        // 6
add(1, 2)(3);        // 6
add(1)(2, 3);        // 6
add(1, 2, 3);        // 6

// practical: build reusable specialised functions
const fetchFrom = curry((base, path, opts) => fetch(base + path, opts));
const api = fetchFrom('https://api.example.com');
const users = api('/users');
users({ method: 'GET' });`,cx:`O(1) per partial call · O(arity) memory for the accumulated args`,why:"The recursion works because `curried` calls itself with the accumulated arguments — each partial call returns a new collector rather than invoking. Using `fn.length` as the default arity is why it fails on functions with defaults or rest parameters, which is exactly why the `arity` parameter is exposed. Passing `this` through with `apply` keeps it usable as a method."},{name:`Placeholder curry`,idea:`Lodash-style, allowing arguments to be supplied out of order.`,code:`const _ = Symbol('placeholder');

function curryWithHoles(fn, arity = fn.length) {
  return function curried(...args) {
    const filled = args.filter(a => a !== _).length;
    const hasHoles = args.includes(_);
    if (filled >= arity && !hasHoles) return fn.apply(this, args);

    return function (...more) {
      const merged = args.map(a => (a === _ && more.length ? more.shift() : a));
      return curried.apply(this, [...merged, ...more]);
    };
  };
}

const divide = curryWithHoles((a, b) => a / b);
const halve = divide(_, 2);         // fix the SECOND argument
halve(10);                          // 5
const tenOver = divide(10);
tenOver(2);                         // 5`,why:"The placeholder lets you fix any position, not just a prefix — which is what makes `divide(_, 2)` possible where `bind` cannot help. Using a `Symbol` for the placeholder guarantees it can never collide with a legitimate argument value, which a sentinel string or object could."}],takeaway:"Currying reshapes arity one argument at a time; partial application fixes some arguments. A flexible curry accumulates until `args.length >= arity`."},{t:`q`,lvl:`medium`,title:`Compose and pipe`,tag:`function composition`,stmt:"Implement `compose` and `pipe`, including async variants, and say when each reads better.",approaches:[{name:`Synchronous`,idea:"`reduce` over the function list, threading the value.",code:`// compose: right to left, like f(g(h(x))) in mathematics
const compose = (...fns) => (x) =>
  fns.reduceRight((acc, fn) => fn(acc), x);

// pipe: left to right, like a shell pipeline
const pipe = (...fns) => (x) =>
  fns.reduce((acc, fn) => fn(acc), x);

const trim  = s => s.trim();
const lower = s => s.toLowerCase();
const slug  = s => s.replace(/\\s+/g, '-');

compose(slug, lower, trim)('  Hello World  ');   // 'hello-world'
pipe(trim, lower, slug)('  Hello World  ');      // 'hello-world'

// multi-argument first function
const pipeN = (...fns) => (...args) =>
  fns.slice(1).reduce((acc, fn) => fn(acc), fns[0](...args));`,cx:`O(n) in the number of functions`,why:"`pipe` reads in execution order and is what most people find clearer; `compose` matches mathematical notation and the order you would write nested calls. They are the same function with the fold direction reversed. The `pipeN` variant handles the common case where only the first function is multi-argument."},{name:`Async`,idea:`Await between steps, so any function may return a promise.`,code:`const pipeAsync = (...fns) => (x) =>
  fns.reduce((p, fn) => p.then(fn), Promise.resolve(x));

// or with async/await, which handles sync and async transparently
const pipeAsync2 = (...fns) => async (x) => {
  let acc = x;
  for (const fn of fns) acc = await fn(acc);
  return acc;
};

const loadUser  = (id) => fetch(\`/users/\${id}\`).then(r => r.json());
const getPosts  = (u) => fetch(\`/posts?u=\${u.id}\`).then(r => r.json());
const countThem = (posts) => posts.length;

await pipeAsync2(loadUser, getPosts, countThem)(991);`,cx:`O(n) sequential — each step waits for the previous`,why:"`await` on a non-promise resolves immediately, so the same pipeline accepts a mix of sync and async steps with no special casing. Note this is strictly sequential by design — if the steps were independent you would want `Promise.all` instead, and choosing sequential when parallel was possible is a common performance mistake."}],takeaway:"`pipe` is `reduce`, `compose` is `reduceRight`. The async version is a `for...of` with `await`, and it is sequential by construction."}]},{id:`fn-timing`,title:`Debounce, throttle and rate control`,blurb:`Two functions asked in almost every front-end interview, and confused with each other in almost every answer.`,blocks:[{t:`code`,x:`events:    │││││││        ││││        │      ││││││││
           ─────────────────────────────────────────────▶

DEBOUNCE   wait for a QUIET PERIOD, then fire once
(trailing)         ▲              ▲       ▲          ▲
                   fires only after the burst stops

THROTTLE   fire at most once per interval, ignore the rest
(leading)  ▲    ▲    ▲    ▲    ▲    ▲    ▲    ▲    ▲
           regular cadence regardless of burst density

USE DEBOUNCE for: search-as-you-type, autosave, resize-complete,
                  validating a field after the user stops typing
USE THROTTLE for: scroll handlers, mousemove, drag, infinite scroll,
                  anything that must update DURING the activity`,cap:`Debounce waits for silence. Throttle enforces a rate.`},{t:`q`,lvl:`hard`,title:`Implement debounce with leading, trailing and cancel`,tag:`the most-asked front-end implementation`,stmt:"Write a production-quality `debounce` supporting immediate mode, cancellation, flushing and a return value.",approaches:[{name:`Basic`,idea:`Reset a timer on every call; only the last one survives.`,code:`function debounce(fn, delay) {
  let timer;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

const search = debounce((q) => console.log('searching', q), 300);
search('a'); search('ab'); search('abc');
// only 'abc' runs, 300ms after the last call`,cx:`O(1) per call`,why:"The whole mechanism is `clearTimeout` before `setTimeout` — each call cancels the pending one. `fn.apply(this, args)` preserves both the receiver and the **latest** arguments, which is what you want: a debounced search should use the final query, not the first."},{name:`Full version`,idea:`Add leading edge, cancel, flush and pending.`,code:`function debounce(fn, delay, { leading = false, trailing = true } = {}) {
  let timer = null, lastArgs = null, lastThis = null, result;

  function invoke() {
    result = fn.apply(lastThis, lastArgs);
    lastArgs = lastThis = null;
    return result;
  }

  function debounced(...args) {
    lastArgs = args; lastThis = this;
    const callNow = leading && timer === null;

    clearTimeout(timer);
    timer = setTimeout(() => {
      timer = null;
      if (trailing && lastArgs) invoke();      // skip if leading already ran
    }, delay);

    if (callNow) return invoke();
    return result;                             // last known result
  }

  debounced.cancel = () => {
    clearTimeout(timer);
    timer = null; lastArgs = lastThis = null;
  };
  debounced.flush = () => (lastArgs ? (clearTimeout(timer), timer = null, invoke()) : result);
  debounced.pending = () => timer !== null;

  return debounced;
}

const save = debounce(doSave, 1000);
input.addEventListener('input', save);
form.addEventListener('submit', () => save.flush());   // save immediately
component.onUnmount = () => save.cancel();             // avoid a stale call`,cx:`O(1) per call · one timer`,why:"`cancel` is the one people forget and the one that matters most in practice — a debounced callback that fires after a component unmounts is a classic React warning and a real memory-retention path. `flush` handles the 'user hit save before the autosave timer' case. Returning the last result keeps the function usable in expressions, matching lodash's behaviour."}],takeaway:"Debounce = clear-then-set a timer. Production versions need `cancel` for teardown and `flush` for explicit commit."},{t:`q`,lvl:`hard`,title:`Implement throttle three ways`,tag:`timestamp, timer, and both edges`,stmt:`Write throttle using a timestamp, using a timer, and supporting both leading and trailing edges. Say which is correct for a scroll handler.`,approaches:[{name:`Timestamp (leading edge)`,idea:`Record when you last ran; ignore calls inside the window.`,code:`function throttle(fn, interval) {
  let last = 0;
  return function (...args) {
    const now = Date.now();
    if (now - last >= interval) {
      last = now;
      return fn.apply(this, args);
    }
  };
}

// fires IMMEDIATELY on the first call, then at most once per interval.
// the FINAL call in a burst is dropped — so a scroll handler using
// this may never see the resting position.`,cx:`O(1), no timer allocated`,why:`The simplest correct throttle and the cheapest — no timers at all. Its weakness is that the trailing call is lost: if the user stops scrolling 50 ms into a 200 ms window, the last position is never handled, and the UI ends up slightly stale.`},{name:`Timer (trailing edge)`,idea:`Schedule one call at the end of each window.`,code:`function throttle(fn, interval) {
  let timer = null, lastArgs = null;
  return function (...args) {
    lastArgs = args;
    if (timer) return;
    timer = setTimeout(() => {
      timer = null;
      fn.apply(this, lastArgs);
    }, interval);
  };
}
// does NOT fire immediately — there is always one interval of lag`,cx:`O(1) · one timer per window`,why:`This guarantees the final state is handled but adds latency to the first call, which feels unresponsive on a click or a drag start. Neither single-edge version is right for most UI work, which is why the combined one exists.`},{name:`Both edges`,idea:`Fire immediately, then again at the end if more calls arrived.`,code:`function throttle(fn, interval, { leading = true, trailing = true } = {}) {
  let last = 0, timer = null, lastArgs = null, lastThis = null;

  return function (...args) {
    const now = Date.now();
    if (!last && !leading) last = now;          // suppress the first call
    const remaining = interval - (now - last);
    lastArgs = args; lastThis = this;

    if (remaining <= 0 || remaining > interval) {   // clock-change guard
      if (timer) { clearTimeout(timer); timer = null; }
      last = now;
      fn.apply(lastThis, lastArgs);
    } else if (!timer && trailing) {
      timer = setTimeout(() => {
        last = leading ? Date.now() : 0;
        timer = null;
        fn.apply(lastThis, lastArgs);
      }, remaining);
    }
  };
}

window.addEventListener('scroll', throttle(updateHeader, 100));
// fires at once, every 100ms during, and once more when scrolling stops`,cx:`O(1) · at most one pending timer`,why:"This is the version to write when asked for 'a throttle for a scroll handler': immediate response, a steady cadence during the burst, and a final call so the resting state is correct. The `remaining > interval` check guards against a system clock jumping backwards, which would otherwise wedge the throttle. For pure visual updates, `requestAnimationFrame` throttling is better still — it aligns with the frame rate instead of a fixed millisecond value."},{name:`rAF throttle`,idea:`For anything that paints, throttle to the display refresh.`,code:`function rafThrottle(fn) {
  let queued = false, lastArgs;
  return function (...args) {
    lastArgs = args;
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      fn.apply(this, lastArgs);
    });
  };
}

window.addEventListener('scroll', rafThrottle(() => {
  header.style.transform = \`translateY(\${window.scrollY * 0.5}px)\`;
}));`,why:"Running a paint-affecting handler more often than the display refreshes is wasted work by definition. `requestAnimationFrame` self-adjusts to the actual frame rate — 120 Hz on a fast display, throttled to near zero in a background tab — which a fixed interval cannot do. This is the correct default for scroll-linked animation."}],takeaway:"Timestamp throttle drops the trailing call; timer throttle delays the leading one. Use both edges for scroll, and `requestAnimationFrame` for anything that paints."},{t:`guess`,setup:`const log = throttleLeading(console.log, 100);   // timestamp version
const deb = debounce(console.log, 100);`,code:`// calls at t = 0, 50, 90, 300
log('a'); // t=0
log('b'); // t=50
log('c'); // t=90
log('d'); // t=300

deb('a'); deb('b'); deb('c');   // t = 0, 50, 90
deb('d');                        // t = 300`,out:`throttle: 'a' at t=0,  'd' at t=300     ('b','c' dropped)
debounce: 'c' at t=190, 'd' at t=400   (fires 100ms after the LAST call)`,why:"Throttle keeps the **first** of each window and discards the rest; debounce keeps the **last** and waits for silence. The debounced `'c'` fires at 190 because the timer restarted at t=90. This is the concrete difference to state when asked: throttle guarantees a rate, debounce guarantees quiet before acting."},{t:`qa`,q:`What is a pure function and why does it matter?`,a:"One whose return value depends only on its arguments and which causes no observable side effects — no mutation of inputs or outer state, no I/O, no reading of mutable globals or the clock. Purity buys you testability without mocks, safe memoisation, safe reordering and parallelisation, and referential transparency, which is what makes React's rendering model and `useMemo` work. The practical discipline is to concentrate impurity at the edges and keep the core of a system pure."},{t:`qa`,q:`What are higher-order functions?`,a:"Functions that take a function as an argument, return one, or both. `map`, `filter`, `reduce`, `setTimeout`, `addEventListener`, `debounce`, `curry` and every decorator are higher-order. They matter because they let you abstract over **behaviour** rather than only over values — the entire array-method vocabulary is a set of higher-order functions that replaced hand-written loops."},{t:`qa`,q:`What is tail call optimisation and does JavaScript have it?`,a:`A tail call is a function call in the final position of a function, where nothing remains to do after it returns. An engine can then reuse the current stack frame instead of pushing a new one, making recursion constant-space. ES2015 **specifies** proper tail calls in strict mode, but only JavaScriptCore (Safari) implemented it — V8 and SpiderMonkey shipped it behind flags and then abandoned it, largely because it makes stack traces useless. So in practice: assume no TCO, and convert deep recursion to iteration or a trampoline.`}]}]},_={id:`arrays`,num:`07`,title:`Arrays, Iterables & Generators`,kicker:`Every array method, the iteration protocols, generators and lazy sequences`,sections:[{id:`ar-methods`,title:`The array method vocabulary`,blocks:[{t:`table`,head:[`Method`,`Mutates?`,`Returns`,`Note`],rows:[["`push` / `pop`",`**Yes**`,`New length / removed item`,`O(1) at the end`],["`shift` / `unshift`",`**Yes**`,`Removed item / new length`,`O(n) — reindexes everything`],["`splice(i, del, ...add)`",`**Yes**`,`Array of removed items`,`The general-purpose mutator`],["`sort` / `reverse`",`**Yes**`,`The same array`,"`toSorted` / `toReversed` are the copying versions (ES2023)"],["`fill` / `copyWithin`",`**Yes**`,`The same array`,``],["`slice(start, end)`",`No`,`A shallow copy of a range`,`Negative indices count from the end`],["`concat` / `flat` / `flatMap`",`No`,`New array`,"`flat(Infinity)` for full depth"],["`map` / `filter`",`No`,`New array`,"`map` always returns the same length"],["`reduce` / `reduceRight`",`No`,`Anything`,`Give it an initial value`],["`find` / `findIndex` / `findLast`",`No`,`Element / index`,`Short-circuits at the first match`],["`some` / `every`",`No`,`Boolean`,"Short-circuit; `every([])` is `true`"],["`includes` / `indexOf`",`No`,`Boolean / index`,"`includes` finds `NaN`, `indexOf` does not"],["`at(i)`",`No`,`Element`,"`at(-1)` is the last element"],["`join` / `toString`",`No`,`String`,"`null` and `undefined` become empty strings"],["`entries` / `keys` / `values`",`No`,`Iterator`,"Use with `for...of`"],["`group` / `Object.groupBy`",`No`,`Object / Map`,`ES2024`]]},{t:`note`,k:`tip`,x:"ES2023 added **copying versions of every mutating method**: `toSorted`, `toReversed`, `toSpliced` and `with(index, value)`. They are the right default in any code that treats data as immutable — React state, Redux reducers, anything you might memoise. `arr.with(2, 'x')` replaces `[...arr.slice(0,2), 'x', ...arr.slice(3)]`."},{t:`q`,lvl:`medium`,title:"`reduce` as the universal method",tag:`and when not to use it`,stmt:"Implement `map`, `filter`, `groupBy` and a pipeline with `reduce`, then say when `reduce` is the wrong tool.",approaches:[{name:`Everything with reduce`,idea:`Fold a collection into anything.`,code:`const nums = [1, 2, 3, 4, 5];

// map
nums.reduce((acc, x) => [...acc, x * 2], []);        // O(n²) — spread copies!
nums.reduce((acc, x) => { acc.push(x * 2); return acc; }, []);  // O(n)

// filter
nums.reduce((acc, x) => (x % 2 ? [...acc, x] : acc), []);

// groupBy
const people = [
  { name: 'Ada', dept: 'eng' }, { name: 'Bo', dept: 'ops' },
  { name: 'Cy', dept: 'eng' },
];
people.reduce((acc, p) => {
  (acc[p.dept] ??= []).push(p);
  return acc;
}, {});
// { eng: [Ada, Cy], ops: [Bo] }

// ES2024 built-in, and clearer:
Object.groupBy(people, p => p.dept);
Map.groupBy(people, p => p.dept);     // when keys are not strings

// count occurrences
'mississippi'.split('').reduce((m, c) => (m[c] = (m[c] || 0) + 1, m), {});

// compose a pipeline
const pipeline = [trim, lower, slug].reduce((f, g) => (x) => g(f(x)));`,why:"The first `map` version is the trap: spreading the accumulator on every iteration copies it, making an O(n) operation O(n²). At 10,000 elements that is 50 million copies. This idiom is common in tutorials and is a genuine performance bug — mutate the accumulator you created, since it is private to the reduce."},{name:`When not to use reduce`,idea:`Clarity usually beats cleverness.`,code:`// HARD TO READ
const result = data.reduce((acc, item) => {
  if (item.active) {
    acc.total += item.value;
    acc.ids.push(item.id);
    if (item.value > acc.max) acc.max = item.value;
  }
  return acc;
}, { total: 0, ids: [], max: -Infinity });

// CLEARER, and the extra passes are almost never the bottleneck
const active = data.filter(d => d.active);
const total  = active.reduce((s, d) => s + d.value, 0);
const ids    = active.map(d => d.id);
const max    = Math.max(...active.map(d => d.value));

// use reduce when you are genuinely FOLDING to one value:
//   sum, min/max, groupBy, flatten, building a Map, composing functions
// use map/filter/for...of when you are TRANSFORMING or SELECTING`,why:"Three passes over an array of a few thousand items costs microseconds; a reduce that four people misread costs hours. Reserve `reduce` for actual folds, and reach for `for...of` when the loop body has branching and side effects — it is more readable and often faster because there is no per-item function call."}],takeaway:"Never spread the accumulator inside a `reduce` — that is O(n²). Use `reduce` for genuine folds, `Object.groupBy` for grouping, and `for...of` when the body gets complex."},{t:`q`,lvl:`medium`,title:`Sorting correctly`,tag:`the default comparator is a trap`,stmt:"Explain why `[10, 9, 1].sort()` gives the wrong answer, then write comparators for numbers, strings with locale, multiple keys and stability.",approaches:[{name:`The default`,idea:"`sort` converts everything to strings.",code:`[10, 9, 1].sort();              // [1, 10, 9]  — string comparison!
['b', 'a', 'C'].sort();         // ['C', 'a', 'b'] — uppercase sorts first
[undefined, 3, 1].sort();       // [1, 3, undefined] — undefined always last

// numeric
[10, 9, 1].sort((a, b) => a - b);          // ascending
[10, 9, 1].sort((a, b) => b - a);          // descending

// strings with locale awareness
['ä', 'z', 'a'].sort();                              // ['a','z','ä'] — code units
['ä', 'z', 'a'].sort((a, b) => a.localeCompare(b));  // ['a','ä','z'] — correct

// fast for large arrays: build the collator once
const cmp = new Intl.Collator('de', { sensitivity: 'base', numeric: true }).compare;
['Datei 10', 'Datei 9'].sort(cmp);          // natural numeric ordering`,why:"The default comparator calls `String(x)` on each element and compares UTF-16 code units, which is why `10` sorts before `9`. `localeCompare` is correct but allocates a collator per call; `Intl.Collator` created once and reused is an order of magnitude faster on large arrays, and its `numeric: true` option gives natural sorting of embedded numbers."},{name:`Multi-key and stability`,idea:`Chain comparators, and rely on the guaranteed stability.`,code:`// sort by dept ascending, then salary descending, then name
const by = (...cmps) => (a, b) => {
  for (const c of cmps) { const r = c(a, b); if (r) return r; }
  return 0;
};
const asc  = (k) => (a, b) => (a[k] > b[k]) - (a[k] < b[k]);
const desc = (k) => (a, b) => (b[k] > a[k]) - (b[k] < a[k]);

people.sort(by(asc('dept'), desc('salary'), asc('name')));

// STABILITY: since ES2019, sort is guaranteed stable — equal
// elements keep their relative order. So this also works:
people.sort(asc('name'));      // first
people.sort(asc('dept'));      // then — ties preserve the name order

// Schwartzian transform: when the key is expensive to compute
const sorted = items
  .map(item => ({ item, key: expensiveKey(item) }))   // compute ONCE each
  .sort((a, b) => a.key - b.key)
  .map(x => x.item);`,cx:`O(n log n) comparisons · the transform makes it O(n) key computations instead of O(n log n)`,why:`Guaranteed stability (ES2019) is what makes the sort-twice idiom valid — before that, V8 used an unstable quicksort for arrays over ten elements and the technique silently broke on large inputs. The Schwartzian transform matters when the sort key requires parsing a date or walking an object: a naive comparator recomputes it O(n log n) times.`}],takeaway:"Always pass a comparator. `sort` is stable since ES2019, so you can sort by successive keys. Reuse an `Intl.Collator` for large string sorts."},{t:`guess`,code:`const a = new Array(3);
console.log(a, a.length);
console.log(a.map(x => 1));
console.log([...a]);
console.log(Array.from(a));
console.log(a.fill(0));

const b = [1, , 3];
console.log(b.length, b.map(x => x * 2), b.filter(() => true));`,out:`[ <3 empty items> ] 3
[ <3 empty items> ]        map SKIPS holes
[ undefined, undefined, undefined ]   spread does NOT
[ undefined, undefined, undefined ]
[ 0, 0, 0 ]
3 [ 2, <1 empty item>, 6 ] [ 1, 3 ]`,why:"`new Array(3)` creates a **sparse** array with a length but no elements. The older iteration methods — `map`, `filter`, `forEach`, `reduce` — skip holes entirely, while the newer iterator-based operations (spread, `Array.from`, `for...of`) treat them as `undefined`. This inconsistency is why `Array.from({length: n}, (_, i) => i)` is the reliable way to build a range and `new Array(n).map(...)` silently does nothing."}]},{id:`ar-iter`,title:`Iteration protocols and generators`,blocks:[{t:`code`,x:`ITERABLE PROTOCOL
  an object is iterable if it has a [Symbol.iterator] method
  that returns an ITERATOR

ITERATOR PROTOCOL
  an object is an iterator if it has next() returning
    { value: any, done: boolean }
  optionally: return(v)  — called on early exit (break, throw, destructure)
              throw(e)   — used by generator delegation

WHO CONSUMES ITERABLES
  for...of          spread [...x]        destructuring [a, b] = x
  Array.from        Promise.all/race     new Map/Set/WeakMap
  yield*            Object.fromEntries

BUILT-IN ITERABLES
  Array  String  Map  Set  TypedArray  arguments  NodeList
  generators      (NOT plain objects — they are not iterable)`,cap:"Two protocols. Implement `[Symbol.iterator]` and every consumer above works with your type."},{t:`q`,lvl:`medium`,title:`Make an object iterable, four ways`,tag:`the iteration protocol`,stmt:"Make a `Range` class work with `for...of` and spread, using a manual iterator, a generator, delegation, and by making it its own iterator.",approaches:[{name:`Manual iterator`,idea:"Return an object with a `next` method.",code:`class Range {
  constructor(start, end, step = 1) {
    Object.assign(this, { start, end, step });
  }
  [Symbol.iterator]() {
    let current = this.start;
    const { end, step } = this;
    return {
      next: () => current < end
        ? { value: (current += step) - step, done: false }
        : { value: undefined, done: true },
      // called on break / throw / early destructure — clean up here
      return: () => { console.log('cleanup'); return { done: true }; },
      [Symbol.iterator]() { return this; },   // make the ITERATOR iterable too
    };
  }
}

[...new Range(0, 5)];              // [0, 1, 2, 3, 4]
for (const n of new Range(0, 10, 3)) console.log(n);   // 0 3 6 9`,why:"Two details matter. State lives in the closure created by `[Symbol.iterator]`, so each `for...of` over the same `Range` starts fresh — putting the counter on `this` would make the range single-use. And `return()` is called when a loop exits early, which is where you release file handles or connections; forgetting it is how iterator-based resources leak."},{name:`Generator`,idea:"Far less code, and `return()` handling comes free.",code:`class Range {
  constructor(start, end, step = 1) {
    Object.assign(this, { start, end, step });
  }
  *[Symbol.iterator]() {
    for (let i = this.start; i < this.end; i += this.step) yield i;
  }
}

// a generator IS an iterator and IS iterable, so this just works
[...new Range(0, 5)];
const [a, b] = new Range(10, 99);   // 10, 11

// and try/finally gives you cleanup on early exit automatically
function* readLines(file) {
  const handle = open(file);
  try {
    for (const line of handle) yield line;
  } finally {
    handle.close();                 // runs on break, throw, or completion
  }
}`,why:"A generator function returns an object satisfying both protocols, so one line replaces the whole manual construction. The `try/finally` behaviour is the underrated part: when a consumer `break`s out of a `for...of`, the generator's `return()` is invoked, which resumes execution at the `finally` block — so resource cleanup is automatic and correct."},{name:`Delegation with yield*`,idea:`Compose iterables without manual looping.`,code:`function* inner() { yield 1; yield 2; }
function* outer() {
  yield 0;
  yield* inner();          // delegates: forwards next/throw/return
  yield* [3, 4];           // any iterable
  yield* 'ab';             // strings are iterable
  return 'done';           // becomes the VALUE of the yield* expression
}
[...outer()];              // [0, 1, 2, 3, 4, 'a', 'b']

// recursive tree traversal in four lines
function* walk(node) {
  yield node.value;
  for (const child of node.children ?? []) yield* walk(child);
}
[...walk(tree)];`,why:"`yield*` is not just a loop shortcut — it forwards `next(v)`, `throw(e)` and `return(v)` to the delegate, which a manual `for (const x of inner()) yield x;` does not. Recursive traversal is where it shines: the four-line `walk` above replaces a manual stack and is genuinely readable."},{name:`Self-iterating object`,idea:"The pattern used by `Map.prototype.entries` and friends.",code:`const counter = {
  n: 0,
  next() { return this.n < 3 ? { value: this.n++, done: false } : { done: true }; },
  [Symbol.iterator]() { return this; },     // I am my own iterator
};

[...counter];       // [0, 1, 2]
[...counter];       // []  — EXHAUSTED, state was on the object

// this is exactly why built-in iterators behave the same way:
const it = [1, 2, 3][Symbol.iterator]();
[...it];            // [1, 2, 3]
[...it];            // []`,why:"Returning `this` from `[Symbol.iterator]` makes an iterator usable directly in `for...of`, which is why you can write `for (const [k,v] of map.entries())`. The cost is that the object is single-use, since its state is shared. Knowing which of your types are re-iterable and which are one-shot is a real API design decision."}],takeaway:"Implement `[Symbol.iterator]` and every consumer works. Generators give you the protocol plus automatic cleanup via `try/finally`. `yield*` forwards the full protocol, not just values."},{t:`q`,lvl:`hard`,title:`Lazy infinite sequences`,tag:`generators as pipelines`,stmt:`Build a lazy pipeline over an infinite sequence, and explain the memory difference versus arrays.`,approaches:[{name:`Solution`,idea:`Generators produce values on demand, so nothing is materialised.`,code:`function* naturals() { let n = 1; while (true) yield n++; }

function* map(it, fn)   { for (const x of it) yield fn(x); }
function* filter(it, p) { for (const x of it) if (p(x)) yield x; }
function* take(it, n)   { for (const x of it) { if (n-- <= 0) return; yield x; } }
function* takeWhile(it, p) { for (const x of it) { if (!p(x)) return; yield x; } }

const result = [...take(
  filter(map(naturals(), n => n * n), n => n % 3 === 1),
  5
)];
// [1, 16, 49, 100, 169]
// only ~13 numbers were ever generated. Nothing was stored.

// the array equivalent is impossible:
//   naturals().map(...)   -> would need an infinite array first

// composable pipe
const pipe = (src, ...ops) => ops.reduce((it, op) => op(it), src);
pipe(naturals(),
     it => map(it, n => n * n),
     it => filter(it, n => n % 3 === 1),
     it => take(it, 5));`,cx:`O(1) memory regardless of sequence length`,why:"Each `yield` suspends the generator with its stack frame intact and hands one value to the consumer. Nothing downstream can pull a value the upstream has not produced, so the pipeline is demand-driven end to end. The array version would need to build every intermediate collection — for a million elements that is three million allocations against the generator's zero."},{name:`Real use: paginated APIs`,idea:`Async generators turn pagination into a flat loop.`,code:`async function* fetchAllPages(url) {
  let next = url;
  while (next) {
    const res = await fetch(next);
    const { items, nextUrl } = await res.json();
    yield* items;                       // flatten pages into items
    next = nextUrl;
  }
}

// the caller never sees pages at all
for await (const item of fetchAllPages('/api/users')) {
  console.log(item.name);
  if (item.name === 'target') break;    // stops fetching MORE PAGES too
}

// bound it, compose it
async function* takeAsync(it, n) {
  for await (const x of it) { if (n-- <= 0) return; yield x; }
}
for await (const u of takeAsync(fetchAllPages('/api/users'), 100)) { }`,why:"This is the single most useful practical application of generators. The consumer writes a flat loop and pagination disappears; `break` stops the loop *and* prevents the next page from being requested, because the generator is suspended at the `await` and never resumes. Doing this with callbacks or manual page counters is considerably more code and easy to get wrong."}],takeaway:"Generators make sequences lazy and composable. `for await...of` over an async generator turns paginated APIs into a single flat loop with correct early termination."},{t:`guess`,code:`function* gen() {
  const a = yield 1;
  console.log('got', a);
  const b = yield 2;
  console.log('got', b);
  return 3;
}
const g = gen();
console.log(g.next());
console.log(g.next('x'));
console.log(g.next('y'));
console.log(g.next());`,out:`{ value: 1, done: false }
got x
{ value: 2, done: false }
got y
{ value: 3, done: true }
{ value: undefined, done: true }`,why:"`next(v)` sends `v` **into** the generator as the result of the currently suspended `yield` expression — this is two-way communication, and it is what makes generators able to model coroutines. The first `next()` argument is always discarded because there is no suspended `yield` yet. Note `return 3` produces `{value: 3, done: true}`, and `for...of` **ignores** that final value, which is why `[...gen()]` is `[1, 2]` and not `[1, 2, 3]`."},{t:`qa`,q:"What is the difference between `for...in` and `for...of`?",a:"`for...in` iterates **enumerable string keys**, including inherited ones, in the specified property order — it works on any object and is almost always the wrong choice, because a polluted prototype leaks into your loop. `for...of` iterates **values** via `Symbol.iterator`, works only on iterables, respects `break`/`continue`/`return` correctly, and calls the iterator's cleanup on early exit. Use `for...of` for arrays and iterables, and `Object.keys`/`entries` for objects."},{t:`qa`,q:`Are plain objects iterable?`,a:"No. `for...of {}` throws `TypeError: obj is not iterable`, because plain objects have no `Symbol.iterator`. Iterate them with `Object.keys`, `Object.values` or `Object.entries`, or make a specific object iterable by defining `[Symbol.iterator]`. `Map` and `Set` *are* iterable and are usually the better structure when you want ordered iteration with arbitrary keys."},{t:`qa`,q:"When would you use a `Map` over a plain object?",a:"When keys are not strings (a `Map` accepts objects, numbers and symbols as real keys); when insertion order matters for keys that look numeric; when you add and delete frequently (`Map` is optimised for it, and `delete` on an object deoptimises it into dictionary mode); when you need `.size` without `Object.keys().length`; and when the keys come from untrusted input, since object keys collide with prototype properties. Use a plain object for fixed, known-shape records and anything you need to `JSON.stringify`."},{t:`qa`,q:"What is a `WeakMap` for?",a:`Associating data with an object without preventing that object from being garbage collected. Entries are held weakly, so when the key becomes unreachable the entry disappears — which is exactly what you want for caching computed values per DOM node, storing private state per instance, or memoising by object identity. The trade-offs are that keys must be objects, and it is not enumerable or sizeable, because exposing that would make garbage collection observable.`}]}]},v={id:`eventloop`,num:`08`,title:`The Event Loop`,kicker:`Call stack, task queues, microtasks, rendering, and how Node's loop differs`,sections:[{id:`el-model`,title:`The model`,blurb:`One rule explains every async ordering question you will ever be asked: the microtask queue is drained completely before the next macrotask.`,blocks:[{t:`code`,x:`                      ┌─────────────────────┐
                      │     CALL STACK      │
                      │  runs JS to         │
                      │  completion         │
                      └──────────┬──────────┘
                                 │ empty?
                                 ▼
                      ┌─────────────────────┐
                      │  MICROTASK QUEUE    │  ← drained COMPLETELY
                      │  promise callbacks  │    including any added
                      │  queueMicrotask     │    while draining
                      │  MutationObserver   │
