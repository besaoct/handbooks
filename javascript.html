    │
    │  ── Tokenizer / Lexer ────────────────────────
    ▼    breaks characters into tokens
tokens:  [const] [x] [=] [42] [;]
    │
    │  ── Parser ───────────────────────────────────
    ▼    builds an Abstract Syntax Tree
AST:     VariableDeclaration
           └─ VariableDeclarator
                ├─ Identifier "x"
                └─ NumericLiteral 42
    │
    │  ── Ignition (V8 interpreter) ────────────────
    ▼    compiles the AST to bytecode
bytecode:  LdaSmi [42]
           Star0
           ...
    │
    │  ── execution + profiling ────────────────────
    ▼    counts calls, records observed types
       is this function "hot"?
            │
       yes  ▼
    ── Maglev / TurboFan (optimising compilers) ────
       emits specialised machine code based on the
       types actually seen so far
            │
       types change unexpectedly?
            ▼
       DEOPTIMISE — throw away the optimised code,
       fall back to bytecode, try again later`,cap:`V8's pipeline. Other engines differ in naming but not in shape.`},{t:`note`,k:`why`,x:`The profiling-and-specialising step is why **type stability matters for performance**. If a function is always called with numbers, TurboFan emits code that assumes numbers and skips the checks. Pass it a string once and that assumption breaks, the optimised code is discarded, and the function falls back to the interpreter. This is the entire basis of most real-world JavaScript performance advice.`},{t:`q`,lvl:`medium`,title:`Why does this function get slower after the fifth call?`,tag:`JIT deoptimisation`,stmt:`Explain what the engine does differently between the two loops, and why the second is dramatically slower despite doing the same arithmetic.`,approaches:[{name:`The observation`,idea:`Same operation, same count, wildly different time.`,code:`function add(a, b) {
  return a + b;
}

// LOOP A — always numbers
let t = performance.now();
for (let i = 0; i < 1e7; i++) add(i, i + 1);
console.log('monomorphic:', performance.now() - t);

// LOOP B — types keep changing
const vals = [1, 'a', {}, [], true, null];
t = performance.now();
for (let i = 0; i < 1e7; i++) add(vals[i % 6], vals[(i + 1) % 6]);
console.log('polymorphic:', performance.now() - t);`,out:`monomorphic: 12.4
polymorphic: 340.7          // ~27x slower`,why:`The arithmetic is identical. What changed is what the engine could assume.`},{name:`What the engine does`,idea:`Inline caches record the shapes seen at each call site.`,code:`// after many calls with only numbers, the call site's
// inline cache is MONOMORPHIC: "always (number, number)"
//   -> TurboFan emits: add two machine integers. No checks.

// with 6 different types, the cache goes:
//   monomorphic (1 shape)
//   -> polymorphic (2-4 shapes: still cached, slower)
//   -> MEGAMORPHIC (5+ shapes: cache gives up entirely)
//   -> every call does a full generic dispatch:
//        is it a string? a number? does it need toPrimitive?
//        does + mean concat or add?

// worse: '+' on mixed types triggers ToPrimitive coercion,
// which can call valueOf() and toString() at runtime`,why:`An **inline cache** is a small per-call-site memo of the object shapes previously observed there. Monomorphic sites are the fast path. Once a site sees more than four shapes it becomes megamorphic and the engine stops trying to specialise it at all — every call goes through the slow generic path. This is why the advice 'keep your functions monomorphic' is not folklore.`},{name:`The practical rule`,idea:`Stability beats cleverness.`,code:`// SLOW: one function handling many types
function format(v) {
  if (typeof v === 'string') return v.trim();
  if (typeof v === 'number') return v.toFixed(2);
  if (Array.isArray(v)) return v.join(',');
  return String(v);
}

// FASTER: separate monomorphic functions
const formatString = (s) => s.trim();
const formatNumber = (n) => n.toFixed(2);
const formatArray  = (a) => a.join(',');

// also: keep object SHAPES stable
// SLOW — different hidden classes
const a = { x: 1 };  a.y = 2;      // shape: {x} then {x,y}
const b = { y: 2 };  b.x = 1;      // shape: {y} then {y,x}  <- different!

// FAST — same shape, same order, initialised together
const c = { x: 1, y: 2 };
const d = { x: 3, y: 4 };          // identical hidden class`,why:"Objects have **hidden classes** (V8 calls them Maps): an internal descriptor of which properties exist in which order. Two objects created with the same literal in the same order share one hidden class, so a property access compiled for one works for the other. Adding properties in different orders creates different hidden classes and pushes the access site toward megamorphic. Initialise all properties in the constructor, in a consistent order, and never `delete` properties in a hot path — `delete` forces the object into slow dictionary mode."}],takeaway:`Type-stable functions and shape-stable objects let the JIT specialise. Mixed types at one call site force a generic slow path that no micro-optimisation can recover.`},{t:`qa`,q:`Is JavaScript interpreted or compiled?`,a:`Both, and the distinction is not a property of the language. A modern engine parses to an AST, compiles to bytecode, interprets that bytecode, and JIT-compiles hot functions to machine code — then deoptimises back to bytecode when its assumptions break. So JavaScript is compiled, just at run time rather than ahead of it. What the language *specification* requires is only the observable behaviour; how an engine achieves it is unconstrained.`},{t:`qa`,q:`What is the difference between an engine, a runtime and the language?`,a:"The **language** is ECMAScript — the specification of syntax and semantics, defining `Array`, `Promise`, closures and so on. An **engine** (V8, SpiderMonkey, JavaScriptCore) implements it. A **runtime** is the engine plus the host environment's APIs: the browser adds the DOM, `fetch`, `localStorage`; Node adds `fs`, `http`, `Buffer`, `process`. This is why `setTimeout` is not JavaScript — it is a host API. The specification defines no I/O at all."},{t:`qa`,q:`What does 'JavaScript is single-threaded' actually mean?`,a:"One call stack, so exactly one piece of JavaScript executes at a time in a given realm. It does **not** mean the runtime is single-threaded: the browser has separate threads for rendering, networking and timers, and Node has libuv's thread pool doing file I/O and crypto. Your code never runs in parallel with itself, which is why you never need locks — but the work your code triggers frequently does. Web Workers and `worker_threads` give real parallelism, at the cost of message-passing isolation rather than shared memory."},{t:`qa`,q:`What is the ECMAScript specification and how do features get added?`,a:`ECMAScript is maintained by TC39 and released annually — ES2015 (ES6) was the large one; each year since has added a smaller set. Proposals move through five stages: 0 strawperson, 1 proposal, 2 draft, 3 candidate (spec text complete, engines start implementing), 4 finished (two independent implementations, included in the next release). Practically, stage 3 is when a feature becomes usable behind a transpiler, and stage 4 is when it is real.`}]},{id:`run-stack`,title:`The call stack and execution contexts`,blocks:[{t:`p`,x:"When a function is called, the engine creates an **execution context** and pushes it onto the call stack. That context holds everything the function needs: its variables, its `this`, and a reference to the scope it was defined in. Understanding this one structure explains hoisting, closures, `this`, and stack overflow all at once."},{t:`code`,x:`function third()  { console.log('in third'); }
function second() { third(); }
function first()  { second(); }
first();

// the stack over time, top of stack on top:
//
//  t0        t1         t2          t3          t4
//                                 ┌────────┐
//                     ┌────────┐  │ third  │  ┌────────┐
//         ┌────────┐  │ second │  │ second │  │ second │
//         │ first  │  │ first  │  │ first  │  │ first  │
// ┌─────┐ ├────────┤  ├────────┤  ├────────┤  ├────────┤
// │ glo │ │  glo   │  │  glo   │  │  glo   │  │  glo   │
// └─────┘ └────────┘  └────────┘  └────────┘  └────────┘
//
// each frame stores: local variables, arguments,
// the value of 'this', and where to return to`,cap:`The stack is LIFO. The topmost frame is what is currently executing.`},{t:`q`,lvl:`easy`,title:`Read a stack trace`,tag:`debugging fundamentals`,stmt:`Explain what each line of this stack trace tells you and in what order the calls happened.`,approaches:[{name:`Solution`,idea:`A stack trace is the call stack printed top-down at the moment of the error.`,code:`function parseUser(raw) {
  return JSON.parse(raw);          // throws here
}
function loadUser(id) {
  return parseUser(localStorage.getItem(id));
}
function init() {
  return loadUser('user:1');
}
init();`,out:`SyntaxError: Unexpected token u in JSON at position 0
    at JSON.parse (<anonymous>)
    at parseUser (app.js:2:15)      <- where it threw
    at loadUser  (app.js:5:10)      <- who called that
    at init      (app.js:8:10)      <- who called that
    at app.js:10:1                  <- top-level`,why:'Read it **top-down as innermost-first**: the first line is where the error occurred, and each subsequent line is the caller. The bottom is where the chain started. The actual bug here is not in `parseUser` at all — `localStorage.getItem` returned `null`, which `JSON.parse` stringified to `"undefined"`. The trace tells you the path; the fix is usually one or two frames below the top.'}],takeaway:`Top of a stack trace = where it broke. Bottom = where it started. The bug is often in a middle frame, not the top one.`},{t:`q`,lvl:`medium`,title:`Blow the stack, then fix it`,tag:`recursion limits`,stmt:`Why does this throw, at roughly what depth, and what are the three ways to make it work for n = 100000?`,approaches:[{name:`The problem`,idea:`Each recursive call adds a frame; the stack has a fixed size.`,code:`function sum(n) {
  if (n === 0) return 0;
  return n + sum(n - 1);       // NOT a tail call: the '+' happens after
}
sum(100000);`,out:`RangeError: Maximum call stack size exceeded
// typically fails around 10,000-15,000 frames in V8,
// depending on frame size (locals, arguments)`,why:"The stack is a fixed-size memory region — roughly 1 MB in browsers, ~984 KB default in Node. Each frame stores locals, arguments and a return address, so the maximum depth depends on how large your frames are. Note this is **not** a tail call: `n + sum(n-1)` must keep `n` alive while the recursive call runs, so the frame cannot be reused. Proper tail calls are in the ES2015 spec but only Safari implements them."},{name:`Fix 1 — iterate`,idea:`The most reliable answer, and usually the right one.`,code:`function sum(n) {
  let total = 0;
  for (let i = 1; i <= n; i++) total += i;
  return total;
}
sum(100000);   // 5000050000`,cx:`O(n) time · O(1) space`,why:`Any recursion whose depth scales with input size is a stack overflow waiting for a larger input. Converting to a loop moves the state from the stack into a variable. This is not a compromise — it is faster and uses constant space.`},{name:`Fix 2 — explicit stack`,idea:`When the recursion is genuinely tree-shaped, use a heap-allocated stack.`,code:`// recursive tree walk: overflows on a deep tree
function walk(node, visit) {
  visit(node);
  for (const child of node.children) walk(child, visit);
}

// iterative: the stack is now an array on the heap,
// which can grow to millions of entries
function walk(root, visit) {
  const stack = [root];
  while (stack.length) {
    const node = stack.pop();
    visit(node);
    // push in reverse to preserve left-to-right order
    for (let i = node.children.length - 1; i >= 0; i--) {
      stack.push(node.children[i]);
    }
  }
}`,cx:`O(n) time · O(depth) heap instead of O(depth) stack`,why:"The heap is bounded by available memory rather than by the ~1 MB stack, so this handles depths that recursion cannot. The reversal when pushing is the detail people get wrong: `pop()` takes the last element, so pushing children in order would visit them backwards."},{name:`Fix 3 — trampoline`,idea:`Keep the recursive style, but return a thunk instead of recursing.`,code:`function trampoline(fn) {
  return (...args) => {
    let result = fn(...args);
    while (typeof result === 'function') result = result();
    return result;
  };
}

// return a THUNK rather than calling directly
function sumRec(n, acc = 0) {
  if (n === 0) return acc;
  return () => sumRec(n - 1, acc + n);   // <- not called yet
}

const sum = trampoline(sumRec);
sum(100000);   // 5000050000, no stack growth`,cx:`O(n) time · O(1) stack`,why:"Each recursive step returns immediately with a function to call next, so its frame pops before the next one is pushed — the stack never grows beyond one frame plus the trampoline. It requires the recursion to be in **accumulator-passing style**, which is why `acc` had to be threaded through. Useful when you want to preserve a recursive formulation for readability, or in mutually recursive state machines."}],takeaway:`Recursion depth is bounded by ~1 MB of stack. Iterate for linear recursion, use an explicit array-stack for trees, trampoline when you must keep the recursive shape.`},{t:`guess`,code:`let depth = 0;
function probe() {
  depth++;
  probe();
}
try { probe(); } catch (e) {
  console.log(e.constructor.name, 'at depth ~' + depth);
}

function probe2(a, b, c, d, e, f, g, h) {
  depth2++;
  probe2(a, b, c, d, e, f, g, h);
}`,out:`RangeError at depth ~11000     (varies by engine and build)
// probe2, with 8 arguments per frame, overflows MUCH earlier`,why:"The limit is measured in **bytes**, not frames. Every argument and local variable widens the frame, so a function with eight parameters overflows at a fraction of the depth of one with none. This is why 'the stack limit is about 10,000' is only ever a rough figure, and why you cannot rely on a recursion depth being safe just because it worked in one place. Node lets you raise it with `--stack-size`, which is almost always the wrong fix."}]},{id:`run-hoisting`,title:`Hoisting, the TDZ, and the two-phase model`,blurb:`Hoisting is not magic. It is what you see when you understand that every execution context is built in two phases.`,blocks:[{t:`p`,x:`Before a single line of a function body runs, the engine scans it and creates bindings for every declaration it finds. Only then does execution begin. That two-phase process — **creation** then **execution** — is the whole of hoisting.`},{t:`code`,x:`console.log(a);      // undefined   <- declared, not yet assigned
console.log(b);      // ReferenceError: Cannot access 'b' before initialization
console.log(c);      // ReferenceError: c is not defined
console.log(f());    // "hi"        <- fully hoisted
console.log(g);      // undefined
console.log(g());    // TypeError: g is not a function

var a = 1;
let b = 2;
function f() { return 'hi'; }
var g = function () { return 'yo'; };

// ── CREATION PHASE, before any line executes ──────────────
//   var a          -> binding created, initialised to undefined
//   let b          -> binding created, UNINITIALISED (in the TDZ)
//   function f     -> binding created AND assigned the function
//   var g          -> binding created, initialised to undefined
//   (c is never declared, so no binding exists at all)
//
// ── EXECUTION PHASE ───────────────────────────────────────
//   assignments happen in source order`,cap:`Four declaration forms, four different behaviours — all explained by the creation phase.`},{t:`table`,head:[`Declaration`,`Hoisted?`,`Initialised at creation?`,`Scope`,`Redeclarable?`],rows:[["`var`",`Yes`,"Yes — to `undefined`",`Function`,`Yes`],["`let`",`Yes`,`No — TDZ until the line runs`,`Block`,`No`],["`const`",`Yes`,`No — TDZ, and must be initialised`,`Block`,`No`],["`function` declaration",`Yes`,`Yes — the whole function`,`Block (in strict mode)`,`Yes`],["`class`",`Yes`,`No — TDZ`,`Block`,`No`],[`function *expression*`,`Only the variable`,"As per `var`/`let`/`const`",`As per the keyword`,`As per the keyword`]]},{t:`note`,k:`gotcha`,x:'The common phrasing "`let` and `const` are not hoisted" is **wrong**, and the correction is a good interview answer. They are hoisted — the binding exists from the top of the block, which is why `let x = 1` inside a block shadows an outer `x` even on lines above it. What differs is that the binding is *uninitialised* until the declaration executes, and touching it before then is a `ReferenceError`. That window is the Temporal Dead Zone.'},{t:`q`,lvl:`medium`,title:"Prove that `let` is hoisted",tag:`TDZ · a favourite follow-up`,stmt:"Write code that demonstrates a `let` binding exists before its declaration line, distinguishing it from a variable that does not exist at all.",approaches:[{name:`Solution`,idea:`Shadowing is the proof: the inner binding blocks the outer one from the top of the block.`,code:`let x = 'outer';

{
  // if 'let x' below were NOT hoisted, this would log 'outer'
  console.log(x);        // ReferenceError: Cannot access 'x' before initialization
  let x = 'inner';
}

// compare with a name that genuinely does not exist:
{
  console.log(nope);     // ReferenceError: nope is not defined
}

// two DIFFERENT errors — and the difference is the whole point:
//   "Cannot access 'x' before initialization"  -> binding EXISTS, in TDZ
//   "nope is not defined"                      -> no binding anywhere`,why:"If `let x` were not hoisted, the `console.log` would find the outer `x` and print `'outer'`. It does not — the inner binding shadows it from the opening brace. The two distinct error messages are the observable proof, and being able to name that difference is what separates a memorised answer from an understood one."}],takeaway:"`let` and `const` **are** hoisted. They are just uninitialised until their declaration runs. 'Cannot access before initialization' means the binding exists; 'is not defined' means it does not."},{t:`guess`,code:`function f() {
  console.log(typeof x);
  console.log(typeof y);
  var x = 1;
  let y = 2;
}
f();`,out:`"undefined"
ReferenceError: Cannot access 'y' before initialization`,why:'`typeof` is famously safe on undeclared variables — `typeof neverDeclared` returns `"undefined"` rather than throwing. But it is **not** safe in the TDZ: accessing a `let` binding before initialisation throws regardless of how you access it, including through `typeof`. This is one of the few places where `typeof` can throw, and it is a common trick question.'},{t:`guess`,code:`var x = 1;
function outer() {
  console.log(x);
  var x = 2;
}
outer();`,out:`undefined`,why:"The `var x = 2` inside `outer` creates a function-scoped binding hoisted to the top of `outer`, initialised to `undefined`. So the `console.log` resolves `x` to the **local** binding, not the global one — and the local has not been assigned yet. This is the classic shadowing-by-hoisting bug, and it is exactly why `let` was introduced: with `let x = 2`, the same code throws a clear `ReferenceError` instead of silently logging `undefined`."},{t:`guess`,code:`console.log(f());
console.log(g());

function f() { return 'declaration'; }
var g = function () { return 'expression'; };`,out:`"declaration"
TypeError: g is not a function`,why:"A function **declaration** is fully hoisted — both the binding and the function body are available from the top of the scope. A function **expression** assigned to `var g` hoists only the variable, which holds `undefined` until the assignment line runs; calling `undefined` gives a `TypeError`. This asymmetry is why declarations can be called before they appear in source and expressions cannot."},{t:`q`,lvl:`hard`,title:`The loop-variable closure problem`,tag:`the single most-asked JavaScript question`,stmt:"Why does the `var` version log `3` three times, and give four different fixes.",hint:"Ask how many bindings of `i` exist in each version.",approaches:[{name:`The problem`,idea:"`var` creates **one** binding for the whole function; every callback closes over the same one.",code:`for (var i = 0; i < 3; i++) {
  setTimeout(() => console.log(i), 0);
}
// 3, 3, 3

// there is exactly ONE 'i'. By the time any timeout runs,
// the loop has finished and that single 'i' holds 3.
//
//   ┌─────────────┐
//   │  i  =  3    │ <── all three closures point here
//   └─────────────┘`,why:`Closures capture **variables, not values**. All three arrow functions reference the same binding, and they all run after the loop completes. Nothing about the timing is unusual — the same thing happens with any deferred callback.`},{name:`Fix 1 — let`,idea:"`let` in a `for` header creates a fresh binding per iteration.",code:`for (let i = 0; i < 3; i++) {
  setTimeout(() => console.log(i), 0);
}
// 0, 1, 2

//   ┌───────┐  ┌───────┐  ┌───────┐
//   │ i = 0 │  │ i = 1 │  │ i = 2 │
//   └───────┘  └───────┘  └───────┘
//       ▲          ▲          ▲
//   closure 1  closure 2  closure 3`,why:"This is a special rule in the specification, not a general property of `let`: in a `for` statement, each iteration gets a **new binding** copied from the previous iteration's final value. It exists precisely because this bug was so common. Note it applies to the `for(let ...)` header specifically — a `let` declared *inside* the body would also work, for the ordinary reason that block scope creates a new binding per block entry."},{name:`Fix 2 — IIFE`,idea:`The pre-ES6 answer: create a new function scope per iteration.`,code:`for (var i = 0; i < 3; i++) {
  (function (j) {
    setTimeout(() => console.log(j), 0);
  })(i);          // <- 'i' is COPIED into parameter 'j'
}
// 0, 1, 2`,why:"Passing `i` as an argument copies its current value into a new parameter binding that lives in a new function scope. Every iteration therefore closes over a distinct `j`. This is what everyone wrote before 2015, and recognising it in legacy code is worth knowing."},{name:`Fix 3 — bind the value`,idea:`Bake the value into the callback at creation time.`,code:`for (var i = 0; i < 3; i++) {
  setTimeout(console.log.bind(null, i), 0);
}
// 0, 1, 2

// or with the extra-args form of setTimeout:
for (var i = 0; i < 3; i++) {
  setTimeout((j) => console.log(j), 0, i);
}
// 0, 1, 2`,why:"Both evaluate `i` immediately and store the resulting value, rather than capturing the variable. `setTimeout`'s third-and-beyond arguments are passed to the callback, which is a genuinely underused feature. The general principle: if you capture a value at creation time rather than reading a variable at call time, the aliasing problem disappears."},{name:`Fix 4 — forEach`,idea:`Often the cleanest: the callback parameter is a fresh binding by construction.`,code:`[0, 1, 2].forEach((i) => {
  setTimeout(() => console.log(i), 0);
});
// 0, 1, 2

// or when you started with a count:
Array.from({ length: 3 }, (_, i) =>
  setTimeout(() => console.log(i), 0)
);`,why:"Every call to the callback creates a new execution context with its own `i` parameter, so no sharing is possible. This is why the bug is far rarer in code written with array methods than in code written with C-style loops — the fix is structural rather than something you have to remember."}],takeaway:"Closures capture bindings, not values. `var` gives one binding per function; `let` in a `for` header gives one per iteration. When in doubt, pass the value as an argument."}]}]},f={id:`types`,num:`02`,title:`Values, Types & Coercion`,kicker:`Primitives, references, the coercion algorithm, ==, NaN and every type-check trap`,sections:[{id:`ty-primitives`,title:`Primitives and references`,blocks:[{t:`p`,x:"JavaScript has **seven primitive types** and one object type. Everything that is not a primitive — arrays, functions, dates, regexes, `Map` — is an object. That single split explains copying, equality, mutation and the entire `==` table."},{t:`table`,head:[`Type`,"`typeof`",`Example`,`Notes`],rows:[["`number`",'`"number"`',"`42`, `3.14`, `NaN`, `Infinity`",`IEEE-754 double. One numeric type for both ints and floats`],["`string`",'`"string"`',"`'hi'`, `` `t${x}` ``",`UTF-16 code units. Immutable`],["`boolean`",'`"boolean"`',"`true`, `false`",``],["`undefined`",'`"undefined"`',"`undefined`",`Absence by default — unassigned, missing, no return`],["`null`",'**`"object"`**',"`null`","Absence on purpose. The `typeof` result is a 1995 bug, kept for compatibility"],["`symbol`",'`"symbol"`',"`Symbol('id')`",`Unique, never equal to another symbol. Used for non-colliding keys`],["`bigint`",'`"bigint"`',"`9007199254740993n`","Arbitrary-precision integers. Cannot be mixed with `number`"],["`object`",'`"object"` / `"function"`',"`{}`, `[]`, `()=>{}`, `new Date()`",'Everything else. Functions report `"function"`']]},{t:`q`,lvl:`beginner`,title:`Copy by value versus copy by reference`,tag:`the foundational distinction`,stmt:`Explain precisely what is copied in each assignment below, and why the last two behave differently.`,approaches:[{name:`Solution`,idea:`Primitives copy the value. Objects copy the reference — the pointer, not the thing.`,code:`// PRIMITIVE: the value itself is copied
let a = 10;
let b = a;
b = 20;
console.log(a);            // 10  — untouched

// OBJECT: the REFERENCE is copied; both point at one object
let o1 = { n: 10 };
let o2 = o1;
o2.n = 20;
console.log(o1.n);         // 20  — same object

// REASSIGNMENT rebinds the variable, it does not mutate
let o3 = { n: 10 };
let o4 = o3;
o4 = { n: 99 };            // o4 now points somewhere else
console.log(o3.n);         // 10  — o3 still points at the original`,out:`10
20
10`,why:"A variable holding an object stores a **reference**. `o2 = o1` copies that reference, so both names denote the same object and a mutation through either is visible through both. `o4 = {...}` does something different: it replaces what `o4` points at, leaving `o3` untouched. The distinction between **mutating through a reference** and **rebinding a variable** is the source of most confusion here, and it is also why `const` does not make an object immutable."}],takeaway:`Primitives copy values; objects copy references. Mutation is visible through every reference; reassignment is visible through none.`},{t:`guess`,code:`const obj = { a: 1 };
obj.a = 2;              // ?
obj.b = 3;              // ?
obj = { a: 1 };         // ?

const arr = [1, 2];
arr.push(3);            // ?
arr = [];               // ?`,out:`obj.a = 2   ✓ works — mutating the object
obj.b = 3   ✓ works — mutating the object
obj = {...} ✗ TypeError: Assignment to constant variable
arr.push(3) ✓ works — mutating the array
arr = []    ✗ TypeError: Assignment to constant variable`,why:"`const` makes the **binding** constant, not the value. The variable cannot be pointed at something else, but the object it points at is fully mutable. For genuine immutability you need `Object.freeze(obj)` — which is also shallow, so `Object.freeze({a: {b: 1}})` still allows `obj.a.b = 2`. Deep freezing requires recursion, and `structuredClone` or a library is usually the better answer."},{t:`q`,lvl:`medium`,title:`Copy an object properly`,tag:`shallow vs deep · asked constantly`,stmt:`Four ways to copy an object. For each, say exactly what it does with nested objects, functions, dates and circular references.`,approaches:[{name:`Shallow: spread / assign`,idea:`Copies own enumerable properties one level deep.`,code:`const src = { a: 1, nested: { b: 2 } };

const copy1 = { ...src };
const copy2 = Object.assign({}, src);

copy1.a = 99;
console.log(src.a);              // 1   — top level is independent

copy1.nested.b = 99;
console.log(src.nested.b);       // 99  — nested is SHARED

// also: spread does NOT copy
//   - the prototype              (Object.create(proto) to preserve)
//   - non-enumerable properties
//   - getters/setters — it INVOKES getters and copies the result`,cx:`O(n) in own properties`,why:"The most common bug in React and Redux code: spreading state, mutating a nested object, and wondering why the original changed. Spread is one level. It is also worth knowing it *evaluates* getters rather than copying them — `{...objWithGetter}` gives you a plain data property holding whatever the getter returned at that moment."},{name:`Deep: structuredClone`,idea:`The modern built-in. Handles almost everything correctly.`,code:`const src = {
  a: 1,
  nested: { b: 2 },
  when: new Date(),
  map: new Map([['k', 'v']]),
  buf: new Uint8Array([1, 2, 3]),
};
src.self = src;                     // circular!

const deep = structuredClone(src);
deep.nested.b = 99;
console.log(src.nested.b);          // 2   — fully independent
console.log(deep.when instanceof Date);  // true — type preserved
console.log(deep.self === deep);         // true — cycle preserved

// what it CANNOT clone:
structuredClone({ fn: () => {} });  // DataCloneError
// also fails on: DOM nodes, Error objects (pre-2022), class instances
//   lose their prototype and come back as plain objects`,cx:`O(n) in total nodes`,why:"Available in all modern browsers and Node 17+, and it is the correct default for deep copying data. It handles cycles, `Date`, `Map`, `Set`, `RegExp`, typed arrays and `ArrayBuffer`. The two things to remember are that it **throws on functions** and that class instances lose their prototype — they come back as plain objects with the same own properties, which silently breaks any method calls."},{name:`Deep: JSON round-trip`,idea:`The old trick. Convenient and lossy in five specific ways.`,code:`const deep = JSON.parse(JSON.stringify(src));

// silently DESTROYS:
JSON.parse(JSON.stringify({
  fn:   () => {},              // -> key removed entirely
  und:  undefined,             // -> key removed entirely
  sym:  Symbol('x'),           // -> key removed entirely
  date: new Date(),            // -> ISO STRING, no longer a Date
  nan:  NaN,                   // -> null
  inf:  Infinity,              // -> null
  map:  new Map([['a', 1]]),   // -> {}  (empty object!)
  set:  new Set([1, 2]),       // -> {}
  big:  10n,                   // -> TypeError: cannot serialize BigInt
}));
// and THROWS on circular references:
//   TypeError: Converting circular structure to JSON

// in an ARRAY, undefined becomes null rather than being dropped:
JSON.parse(JSON.stringify([1, undefined, 3]));   // [1, null, 3]`,cx:`O(n), plus the cost of serialising to a string and back`,why:"It works for plain JSON-shaped data and quietly corrupts everything else. The `Map` → `{}` case is especially nasty because it fails silently rather than throwing. Use it only when you know the data is JSON-safe, and prefer `structuredClone` otherwise."},{name:`Deep: hand-rolled`,idea:`When you need control over classes, functions or specific types.`,code:`function deepClone(value, seen = new WeakMap()) {
  if (value === null || typeof value !== 'object') return value;
  if (seen.has(value)) return seen.get(value);          // cycles

  let out;
  if (Array.isArray(value))      out = [];
  else if (value instanceof Date) return new Date(value);
  else if (value instanceof Map)  out = new Map();
  else if (value instanceof Set)  out = new Set();
  else if (value instanceof RegExp) return new RegExp(value.source, value.flags);
  else out = Object.create(Object.getPrototypeOf(value));  // keep the class

  seen.set(value, out);

  if (value instanceof Map) {
    for (const [k, v] of value) out.set(deepClone(k, seen), deepClone(v, seen));
  } else if (value instanceof Set) {
    for (const v of value) out.add(deepClone(v, seen));
  } else {
    for (const key of Reflect.ownKeys(value)) {           // incl. symbols
      out[key] = deepClone(value[key], seen);
    }
  }
  return out;
}`,cx:`O(n) time · O(n) space for the seen map`,why:"The `WeakMap` of already-cloned objects is what makes this cycle-safe, and returning the memoised copy also preserves shared references correctly — if two properties point at the same object, the clone's two properties point at one clone rather than two. `Object.create(getPrototypeOf(value))` preserves class identity, which `structuredClone` does not. `Reflect.ownKeys` includes symbol keys, which a `for...in` loop would miss."}],takeaway:"`structuredClone` is the right default. Spread is one level. JSON round-trip silently destroys `Date`, `Map`, `undefined` and functions."}]},{id:`ty-coercion`,title:`Coercion: the actual algorithm`,blurb:`Coercion looks arbitrary until you learn the three abstract operations it is built from. Then every case is derivable.`,blocks:[{t:`p`,x:"The specification defines a handful of internal operations: `ToPrimitive`, `ToNumber`, `ToString` and `ToBoolean`. Every implicit conversion in the language is one of these being invoked. Learn them once and you never have to memorise a table again."},{t:`code`,x:`ToPrimitive(input, hint)
  hint is "number" (default), "string", or "default"

  1. if input is already a primitive -> return it
  2. if input[Symbol.toPrimitive] exists -> call it with the hint
  3. otherwise try methods in an order decided by the hint:
       hint "string"  ->  toString()  then  valueOf()
       hint "number"  ->  valueOf()   then  toString()
       hint "default" ->  same as "number"   (except Date, which
                          treats "default" as "string")
  4. first result that is a primitive wins
  5. if neither returns a primitive -> TypeError

WHO USES WHICH HINT
  String(obj), \`\${obj}\`, obj + ''   ->  "string"  (template/String)
  +obj, obj * 1, obj - 1, Number(obj) ->  "number"
  obj1 + obj2, obj == prim            ->  "default"`,cap:`Every implicit conversion of an object goes through this.`},{t:`q`,lvl:`medium`,title:"Derive `[] + {}` and `{} + []` from first principles",tag:`the classic`,stmt:`Explain both results using ToPrimitive, and say why they differ.`,approaches:[{name:`Solution`,idea:`One is an expression; the other is a block followed by a unary plus.`,code:`[] + {}
// both operands are objects, so '+' calls ToPrimitive(x, "default")
//   ToPrimitive([], "default") -> valueOf() returns [] (not primitive)
//                              -> toString() returns ""      ✓
//   ToPrimitive({}, "default") -> valueOf() returns {} (not primitive)
//                              -> toString() returns "[object Object]" ✓
// "" + "[object Object]"  ->  "[object Object]"

{} + []
// AT THE START OF A STATEMENT, {} is parsed as an empty BLOCK,
// not an object literal. What remains is:
//   +[]
//   ToNumber([]) -> ToPrimitive([], "number") -> "" -> Number("") -> 0
// result: 0

// force it to be an expression and you get the first answer back:
({} + [])        // "[object Object]"
console.log({} + []);   // "[object Object]"  <- already an expression`,out:`"[object Object]"
0
"[object Object]"`,why:'The difference has nothing to do with coercion asymmetry and everything to do with **parsing**. At statement position, a leading `{` starts a block. This is the same rule that makes `{}` at the start of a line a block and requires the parenthesis in an IIFE. Once you know that, `+[]` is straightforward: an empty array stringifies to `""`, and `Number("")` is `0`.'}],takeaway:"A leading `{` at statement position is a block, not an object. Everything else follows from ToPrimitive."},{t:`code`,x:`ToNumber
  undefined  ->  NaN
  null       ->  0
  true/false ->  1 / 0
  ""         ->  0          (empty and whitespace-only -> 0)
  "  12  "   ->  12         (trimmed, then parsed)
  "12px"     ->  NaN        (must be the WHOLE string)
  "0x1f"     ->  31         (hex is understood)
  "1e3"      ->  1000
  []         ->  0          ("" -> 0)
  [7]        ->  7          ("7" -> 7)
  [1,2]      ->  NaN        ("1,2" -> NaN)
  {}         ->  NaN        ("[object Object]" -> NaN)
  BigInt     ->  TypeError with Number(), works with explicit conversion

ToBoolean — only EIGHT falsy values, everything else is truthy
  false, 0, -0, 0n, "", null, undefined, NaN
  -> note: "0", "false", [], {}, function(){} are all TRUTHY`,cap:`Memorise the eight falsy values. Everything else is truthy — including empty arrays and objects.`},{t:`guess`,code:`console.log(1 + '2');
console.log('3' - 1);
console.log('3' + 1);
console.log(1 + true);
console.log(1 + null);
console.log(1 + undefined);
console.log('5' * '2');
console.log([] + []);
console.log([1,2] + [3,4]);`,out:`"12"        string concat wins for +
2           - has no string meaning, so both go ToNumber
"31"        + with a string means concat
2           true -> 1
1           null -> 0
NaN         undefined -> NaN
10          * is always numeric
""          "" + ""
"1,23,4"    "1,2" + "3,4"`,why:"`+` is the only arithmetic operator that is overloaded for strings: if **either** operand becomes a string after ToPrimitive, it concatenates; otherwise it adds numerically. Every other arithmetic operator (`-`, `*`, `/`, `%`, `**`) has only the numeric meaning, so it always calls ToNumber on both sides. That single asymmetry explains `'3' - 1 === 2` but `'3' + 1 === '31'`."},{t:`q`,lvl:`hard`,title:"The `==` algorithm, completely",tag:`loose equality · asked to filter candidates`,stmt:"State the full rules for `==`, then explain why `null == undefined` is true but `null == 0` is false.",approaches:[{name:`The rules`,idea:`Seven steps, applied in order, and only five of them ever matter in practice.`,code:`x == y

1. same type?           -> use === semantics, done
2. null == undefined    -> TRUE   (and vice versa)
3. null/undefined vs anything else -> FALSE. No coercion. Ever.
4. number == string     -> ToNumber(string), compare
5. boolean on either side -> ToNumber(boolean), RESTART
6. object vs primitive  -> ToPrimitive(object), RESTART
7. otherwise            -> false

// worked examples, step by step:
null == undefined   // rule 2                      -> true
null == 0           // rule 3: null vs number      -> false
null >= 0           // NOT ==; relational ops use ToNumber
                    //   -> 0 >= 0                 -> true   (!)
undefined == 0      // rule 3                      -> false
'' == 0             // rule 4: ToNumber('') = 0    -> true
'0' == false        // rule 5: false -> 0; rule 4: '0' -> 0 -> true
[] == false         // rule 5: false -> 0
                    // rule 6: [] -> ''
                    // rule 4: '' -> 0             -> true
[] == ![]           // ![] is false -> same as above -> true
'1' == 1            // rule 4                      -> true
[1] == 1            // rule 6: [1] -> '1'; rule 4  -> true
NaN == NaN          // rule 1, and NaN !== NaN     -> false`,why:"Rule 3 is the one that produces the famous inconsistency: `null == 0` is false because `==` explicitly refuses to coerce `null`, but `null >= 0` is true because **relational** operators use a different algorithm that does call ToNumber, turning `null` into `0`. So `null` is not equal to zero, not less than zero, and greater-than-or-equal to zero — all at once. This is a genuine wart, not a misunderstanding."},{name:`When == is acceptable`,idea:`Exactly one idiom is worth using.`,code:`// the one good use: check for null OR undefined in one test
if (value == null) {
  // true for null and undefined, false for 0, '', false, NaN
}

// equivalent to:
if (value === null || value === undefined) { }

// this is why ?? and ?. use the same "nullish" definition:
value ?? fallback        // fallback only when null/undefined
obj?.prop                // short-circuits only on null/undefined

// everywhere else, use === and convert explicitly:
if (Number(input) === 0)   { }
if (String(id) === '42')   { }`,why:"`x == null` is idiomatic, concise, and correct — it is the only loose comparison that most style guides permit. Everywhere else, the explicit conversion documents intent and cannot surprise a reader. The nullish operators `??` and `?.` were added precisely because 'null or undefined, but not other falsy values' is such a common check."}],takeaway:"`==` never coerces `null` or `undefined` to anything else — that is rule 3, and it explains the `null == 0` / `null >= 0` inconsistency. Use `===`, except for the `x == null` idiom."},{t:`guess`,code:`console.log([] == ![]);
console.log([] == []);
console.log({} == {});
console.log('' == 0);
console.log('0' == 0);
console.log('' == '0');
console.log(null == 0);
console.log(null >= 0);`,out:`true      [] -> '' -> 0, and ![] is false -> 0
false     two DIFFERENT objects; == compares references
false     same reason
true      '' -> 0
true      '0' -> 0
false     both strings already: '' !== '0'
false     rule 3: null coerces to nothing
true      relational ops DO convert null to 0`,why:"Lines 2 and 3 are the important ones: when both sides are objects, `==` behaves exactly like `===` and compares **references**, so two structurally identical objects are never equal. No coercion happens because rule 1 applies — they are the same type. This is why deep-equality helpers exist, and why `[1,2] == [1,2]` catching people out is really a reference-identity question rather than a coercion question."},{t:`q`,lvl:`medium`,title:`Check a type reliably`,tag:`typeof, instanceof and the tag trick`,stmt:"Write a `typeOf(value)` that correctly reports `'null'`, `'array'`, `'date'`, `'regexp'`, `'nan'` and the primitives, and explain why `typeof` and `instanceof` each fail.",approaches:[{name:`Why the built-ins fail`,idea:`Three separate problems.`,code:`// typeof is too coarse and has one historical bug
typeof null           // "object"   <- the 1995 bug
typeof []             // "object"
typeof new Date()     // "object"
typeof /x/            // "object"
typeof NaN            // "number"   <- technically true, rarely useful
typeof function(){}   // "function" <- the one object it distinguishes

// instanceof walks the prototype chain, so it breaks across realms
const iframeArray = window.frames[0].Array;
const arr = new iframeArray(1, 2, 3);
arr instanceof Array  // FALSE — different realm, different Array.prototype
Array.isArray(arr)    // true  — checks the internal slot instead

// and it is fooled by prototype manipulation
class Fake { static [Symbol.hasInstance]() { return true; } }
'anything' instanceof Fake   // true`,why:"`typeof null === 'object'` is a bug preserved for compatibility: in the original implementation, values were tagged and the object tag was 0, as was the null pointer. `instanceof` failing across iframes and worker boundaries is the practical problem — each realm has its own `Array.prototype`, so a cross-realm array is not `instanceof` your `Array`. That is exactly why `Array.isArray` exists."},{name:`The tag trick`,idea:"`Object.prototype.toString` exposes an internal tag that survives realms.",code:`function typeOf(v) {
  if (v === null) return 'null';
  if (Number.isNaN(v)) return 'nan';
  const t = typeof v;
  if (t !== 'object' && t !== 'function') return t;      // primitives
  // "[object Date]" -> "date"
  return Object.prototype.toString.call(v).slice(8, -1).toLowerCase();
}

typeOf(null);          // 'null'
typeOf(undefined);     // 'undefined'
typeOf(NaN);           // 'nan'
typeOf(42);            // 'number'
typeOf('hi');          // 'string'
typeOf(10n);           // 'bigint'
typeOf(Symbol());      // 'symbol'
typeOf([]);            // 'array'
typeOf({});            // 'object'
typeOf(new Date());    // 'date'
typeOf(/x/);           // 'regexp'
typeOf(new Map());     // 'map'
typeOf(() => {});      // 'function'
typeOf(Promise.resolve()); // 'promise'
typeOf(new Error());   // 'error'`,cx:`O(1)`,why:'`Object.prototype.toString` reads `Symbol.toStringTag` or, for built-ins, an internal slot — neither of which depends on the prototype chain, so it works across realms. Calling it with `.call(v)` is required because most objects override `toString`. The `slice(8, -1)` strips the fixed `"[object "` prefix and trailing `"]"`. Note that classes can lie by setting `Symbol.toStringTag`, so this is a convention check, not a security boundary.'},{name:`The targeted checks`,idea:`In real code, prefer the specific check to a generic type function.`,code:`Array.isArray(v)                      // cross-realm safe
Number.isNaN(v)                       // NOT the global isNaN
Number.isInteger(v)
Number.isFinite(v)                    // NOT the global isFinite
v instanceof Date && !isNaN(v)        // a VALID date
typeof v === 'function'
v !== null && typeof v === 'object'   // "is an object"
Object.getPrototypeOf(v) === Object.prototype   // a PLAIN object

// the global vs Number. distinction matters:
isNaN('abc')          // true  — coerces first, so almost anything is "NaN"
Number.isNaN('abc')   // false — no coercion; only actual NaN is NaN
isFinite('42')        // true  — coerces
Number.isFinite('42') // false — no coercion`,why:"The global `isNaN` and `isFinite` coerce their argument, which makes them nearly useless — `isNaN('abc')` is `true` because `Number('abc')` is `NaN`, not because `'abc'` is NaN. The `Number.` versions added in ES6 do no coercion and are what you almost always want. Getting this distinction right is a common interview checkpoint."}],takeaway:"`typeof` for primitives and functions, `Array.isArray` for arrays, `Number.isNaN` never the global one, and `Object.prototype.toString.call` when you need a cross-realm tag."},{t:`guess`,code:`console.log(0.1 + 0.2);
console.log(0.1 + 0.2 === 0.3);
console.log(0.1 + 0.2 - 0.3);
console.log(Number.MAX_SAFE_INTEGER);
console.log(9007199254740992 === 9007199254740993);
console.log(0.5 + 0.25 === 0.75);`,out:`0.30000000000000004
false
5.551115123125783e-17
9007199254740991
true                      // both round to the same double!
true                      // exact: both are powers of two`,why:"Numbers are IEEE-754 doubles: 52 bits of mantissa, so a value must be representable as a sum of powers of two. `0.5` and `0.25` are exact; `0.1` and `0.2` are not, and the tiny representation errors survive addition. Above 2^53 consecutive integers are no longer distinguishable, which is `Number.MAX_SAFE_INTEGER` — and why IDs from a backend should be transported as strings, not numbers. Compare floats with a tolerance (`Math.abs(a - b) < Number.EPSILON`) or use `BigInt` for exact integers."},{t:`qa`,q:"Why is `NaN !== NaN`?",a:"Because IEEE-754 defines it that way: NaN is 'not a number', and two unknown non-numbers have no reason to be the same unknown. Practically it means you cannot test for NaN with `===`. Use `Number.isNaN(x)` (no coercion) or `x !== x`, which is true only for NaN and is what `Number.isNaN` does internally. Note `Object.is(NaN, NaN)` is `true` — `Object.is` uses SameValue semantics, which differ from `===` on exactly two values: NaN, and `+0`/`-0`.",code:`NaN === NaN            // false
Number.isNaN(NaN)      // true
Object.is(NaN, NaN)    // true
[NaN].includes(NaN)    // true  — includes uses SameValueZero
[NaN].indexOf(NaN)     // -1    — indexOf uses ===  (!)`},{t:`qa`,q:"What is the difference between `null` and `undefined`?",a:'`undefined` means **absent by default** — a declared-but-unassigned variable, a missing property, a missing argument, or a function with no `return`. `null` means **absent on purpose** — you assigned it to signal \'no value\'. The engine produces `undefined`; you produce `null`. They are loosely equal (`null == undefined`) but not strictly equal, `typeof null` is the historical `"object"` while `typeof undefined` is `"undefined"`, and default parameters trigger on `undefined` only, never on `null`.',code:`function f(x = 10) { return x; }
f();            // 10  — undefined triggers the default
f(undefined);   // 10
f(null);        // null — null does NOT trigger it

JSON.stringify({ a: undefined, b: null });   // '{"b":null}'`},{t:`qa`,q:`What are the eight falsy values?`,a:'`false`, `0`, `-0`, `0n`, `""`, `null`, `undefined`, `NaN`. Everything else is truthy — including `"0"`, `"false"`, `[]`, `{}`, and every function. The empty-array case catches people out constantly: `if (arr)` is true even for `[]`, so you need `if (arr.length)`. `document.all` is a ninth, historical falsy value in browsers, kept for legacy feature detection.'},{t:`qa`,q:"When would you use `BigInt`?",a:"When you need exact integers beyond 2^53 − 1: large database IDs, financial values in minor units at very large scale, cryptography, high-precision timestamps in nanoseconds. Literals take an `n` suffix (`123n`). The constraint is that BigInt and Number **cannot be mixed** in arithmetic — `1n + 1` throws a `TypeError` — which is deliberate, since silently converting would reintroduce precision loss. It is also slower than Number and cannot be `JSON.stringify`d without a custom replacer."}]}]},p={id:`scope`,num:`03`,title:`Scope & Closures`,kicker:`Lexical scope, the scope chain, closures, IIFEs, and the memory implications`,sections:[{id:`sc-scope`,title:`Lexical scope and the scope chain`,blocks:[{t:`p`,x:`JavaScript uses **lexical** (static) scope: where a variable can be resolved is determined by where the code is *written*, not by where the function is *called from*. Every execution context carries a reference to its outer environment, and that chain of references is the scope chain.`},{t:`code`,x:`const g = 'global';

function outer() {
  const o = 'outer';

  function inner() {
    const i = 'inner';
    console.log(i, o, g);      // resolves all three
    console.log(typeof x);     // "undefined" — never found, but typeof is safe
  }

  inner();
}
outer();

// the scope chain of 'inner' at the moment it runs:
//
//   inner scope       { i }
//        │ [[Environment]]
//        ▼
//   outer scope       { o, inner }
//        │
//        ▼
//   global scope      { g, outer }
//        │
//        ▼
//      null
//
// lookup walks OUTWARD and stops at the first match.
// it never walks inward, and never follows the CALL stack.`,cap:`Scope resolution follows the lexical nesting, not the call order.`},{t:`q`,lvl:`medium`,title:`Lexical versus dynamic scope`,tag:"why `this` feels different",stmt:"Predict the output, then explain why JavaScript variables are lexically scoped but `this` behaves dynamically.",approaches:[{name:`Solution`,idea:"Variables look at where the function was written; `this` looks at how it was called.",code:`const name = 'global';

function whoAmI() {
  console.log('variable :', name);   // lexical — always 'global'
  console.log('this     :', this?.name);  // dynamic — depends on the call
}

const obj = { name: 'object', whoAmI };

whoAmI();        // variable: global   |  this: undefined (strict) / global
obj.whoAmI();    // variable: global   |  this: object

// even though whoAmI ran "inside" obj, 'name' still resolves
// lexically to the global — the call site cannot change scope.`,out:`variable : global
this     : undefined
variable : global
this     : object`,why:"This is the single most useful framing for `this`. Variable lookup is decided at authoring time by nesting; `this` is decided at call time by the call form. That is why arrow functions were added — they make `this` lexical too, removing the one place where JavaScript behaves dynamically. If a language had dynamic scoping for variables, `name` would resolve to `'object'` in the second call; JavaScript does not do that, and never has."}],takeaway:"Variables: lexical, decided by where the code sits. `this`: dynamic, decided by how the function is called — unless it is an arrow function."},{t:`guess`,code:`function a() { console.log(x); }
function b() { const x = 'b'; a(); }
const x = 'global';
b();`,out:`"global"`,why:'`a` is *written* at the top level, so its scope chain goes straight to global — it never sees `b`\'s local `x`, even though `b` is on the call stack when `a` runs. Under **dynamic** scoping (as in Bash or older Lisps) this would print `"b"`. Being able to state the difference is a strong signal, because it shows you understand scope as a property of source structure rather than of runtime.'},{t:`q`,lvl:`easy`,title:`Block scope versus function scope`,tag:`var vs let/const`,stmt:"Show three concrete bugs that `var`'s function scoping causes and that `let` fixes.",approaches:[{name:`Bug 1 — leaking out of blocks`,idea:"`var` ignores `{}` entirely except for function bodies.",code:`function f() {
  if (true) {
    var a = 1;
    let b = 2;
  }
  console.log(a);   // 1            — var leaked out of the block
  console.log(b);   // ReferenceError — let is confined to the block
}

// worse, in a loop:
for (var i = 0; i < 3; i++) { }
console.log(i);     // 3 — i survives the loop

for (let j = 0; j < 3; j++) { }
console.log(j);     // ReferenceError`,why:"`var` has exactly two scopes: function and global. Braces belonging to `if`, `for`, `while` or a bare block do nothing. This makes it impossible to have a genuinely temporary variable inside a branch, and it is why `var` declarations conventionally moved to the top of functions — because that is where they effectively were anyway."},{name:`Bug 2 — silent redeclaration`,idea:"`var` lets you declare the same name twice with no warning.",code:`var user = 'ada';
// ... 200 lines later, in the same function ...
var user = getUserFromCache();   // silently clobbers. No error.

let admin = 'ada';
let admin = 'bob';   // SyntaxError: Identifier 'admin' has already been declared

// the same protection applies to parameters:
function f(x) { let x = 1; }     // SyntaxError
function g(x) { var x = 1; }     // fine, silently shadows the parameter`,why:"Redeclaration errors are a compile-time check, so they catch merge accidents and copy-paste mistakes before the code ever runs. `var` gives you nothing here — the second declaration is simply an assignment to the existing binding."},{name:`Bug 3 — the loop closure`,idea:`One binding shared by every iteration, covered fully in chapter 01.`,code:`const fns = [];
for (var i = 0; i < 3; i++) fns.push(() => i);
console.log(fns.map(f => f()));   // [3, 3, 3]

const fns2 = [];
for (let j = 0; j < 3; j++) fns2.push(() => j);
console.log(fns2.map(f => f())); // [0, 1, 2]`,why:"`let` in a `for` header is specified to create a fresh binding per iteration. It is the reason the classic interview question mostly disappeared from real codebases after 2015."}],takeaway:"Default to `const`, use `let` when you must reassign, and use `var` only when maintaining old code. There is no case where `var` is the better choice in new code."}]},{id:`sc-closures`,title:`Closures`,blurb:`A closure is not a special feature you opt into. Every function in JavaScript is one.`,blocks:[{t:`p`,x:"A **closure** is a function together with the lexical environment it was created in. When a function is created, it stores a hidden `[[Environment]]` reference to the scope around it — and that reference keeps the scope alive for as long as the function is alive, even after the outer function has returned."},{t:`code`,x:`function makeCounter() {
  let count = 0;                 // lives in makeCounter's environment

  return function increment() {
    count++;                     // still resolvable after makeCounter returns
    return count;
  };
}

const c1 = makeCounter();
const c2 = makeCounter();        // a SEPARATE environment

console.log(c1(), c1(), c1());   // 1 2 3
console.log(c2());               // 1  — independent state

// after makeCounter() returns, its stack frame is gone,
// but its ENVIRONMENT survives on the heap because
// 'increment' holds a reference to it:
//
//   c1 ──▶ increment ──[[Environment]]──▶ { count: 3 }
//   c2 ──▶ increment ──[[Environment]]──▶ { count: 1 }`,out:`1 2 3
1`,cap:`Each call to makeCounter creates a new environment. The returned function keeps it alive.`},{t:`note`,k:`why`,x:`Engines do not keep the *whole* outer scope — V8 performs escape analysis and retains only the variables the inner function actually references. This is usually an optimisation you never notice, but it does mean debugger output can differ from what you expect: a variable you can see in source may not exist in the closure's captured scope because nothing referenced it.`},{t:`q`,lvl:`medium`,title:`Private state with closures`,tag:`the module pattern`,stmt:"Implement a bank account with a balance that genuinely cannot be modified from outside, then compare closures with `#private` class fields.",approaches:[{name:`Closure`,idea:`Variables in the enclosing scope are unreachable from outside by construction.`,code:`function createAccount(initial = 0) {
  let balance = initial;                    // truly private
  const history = [];

  return {
    deposit(amount) {
      if (amount <= 0) throw new RangeError('deposit must be positive');
      balance += amount;
      history.push({ type: 'deposit', amount, at: Date.now() });
      return balance;
    },
    withdraw(amount) {
      if (amount > balance) throw new RangeError('insufficient funds');
      balance -= amount;
      history.push({ type: 'withdraw', amount, at: Date.now() });
      return balance;
    },
    get balance() { return balance; },       // read-only view
    get history() { return [...history]; },  // defensive copy
  };
}

const acct = createAccount(100);
acct.deposit(50);              // 150
console.log(acct.balance);     // 150
acct.balance = 999999;         // silently ignored — getter only
console.log(acct.balance);     // 150
console.log(acct.history);     // a COPY; mutating it changes nothing`,why:"There is no syntax that reaches `balance` from outside — not bracket access, not `Object.keys`, not a debugger expression in another scope. That is stronger than a naming convention like `_balance`, which is merely a request. The `history` getter returns a copy, because returning the array itself would let a caller `push` fabricated entries — an easily missed hole in otherwise-encapsulated code."},{name:`Private class fields`,idea:`The modern equivalent, with real syntax support.`,code:`class Account {
  #balance = 0;                              // genuinely private
  #history = [];
  static #instances = 0;                     // private static too

  constructor(initial = 0) {
    this.#balance = initial;
    Account.#instances++;
  }

  deposit(amount) {
    if (amount <= 0) throw new RangeError('deposit must be positive');
    this.#balance += amount;
    this.#history.push({ type: 'deposit', amount });
    return this.#balance;
  }

  get balance() { return this.#balance; }

  // brand check: works without try/catch
  static isAccount(o) { return #balance in o; }
}

const a = new Account(100);
a.#balance;                    // SyntaxError at PARSE time, not runtime
Object.keys(a);                // []  — invisible to reflection
JSON.stringify(a);             // '{}' — not serialised`,why:"`#private` fields are enforced by the language, not by scoping. Access from outside is a **syntax error**, caught before the code runs, which is stronger than the closure version's runtime invisibility. They are also invisible to `Object.keys`, `JSON.stringify` and `structuredClone` — the last of which is a real gotcha, since cloning an instance silently loses its private state."},{name:`Choosing`,idea:`Memory profile and ergonomics differ.`,code:`// CLOSURE: one copy of every method PER INSTANCE
//   10,000 accounts = 10,000 deposit functions
//   ✓ true privacy, works everywhere, composable
//   ✗ more memory; no inheritance; instanceof does not work

// CLASS: methods live once on the prototype
//   10,000 accounts = 1 deposit function
//   ✓ memory-efficient, inheritance, instanceof, better devtools
//   ✗ 'this' binding pitfalls; needs modern runtime

// practical rule:
//   few instances, functional style, factory needed  -> closure
//   many instances, inheritance, framework code      -> class`,why:"The per-instance method cost is the concrete difference and the one worth quoting. For a handful of objects it is irrelevant; for tens of thousands it is measurable. The closure version also loses `instanceof` and prototype-based extension, which matters more in library code than in application code."}],takeaway:"Closures give privacy through unreachability; `#fields` give it through syntax. Closures cost one function per instance; classes share methods on the prototype."},{t:`q`,lvl:`medium`,title:`Memoise a function`,tag:`closures for caching · asked everywhere`,stmt:"Write a `memoize` that caches results by arguments, then extend it to handle object arguments and bounded memory.",approaches:[{name:`Basic`,idea:"A `Map` in the closure, keyed by a serialisation of the arguments.",code:`function memoize(fn) {
  const cache = new Map();
  return function (...args) {
    const key = JSON.stringify(args);
    if (cache.has(key)) return cache.get(key);
    const result = fn.apply(this, args);
    cache.set(key, result);
    return result;
  };
}

const slowFib = (n) => (n < 2 ? n : slowFib(n - 1) + slowFib(n - 2));
const fib = memoize(function f(n) {
  return n < 2 ? n : fib(n - 1) + fib(n - 2);   // recurse through the MEMO
});

console.time('memo');  fib(35);      console.timeEnd('memo');    // ~0.1ms
console.time('slow');  slowFib(35);  console.timeEnd('slow');    // ~90ms`,cx:`O(1) lookup · O(distinct calls) memory`,why:"The critical detail is that the recursive call goes through `fib` (the memoised wrapper), not through the inner function — recursing internally would skip the cache and give you no benefit at all. `fn.apply(this, args)` preserves the receiver so the memoised version still works as a method. `JSON.stringify` as the key works only for JSON-safe arguments and treats `{a:1,b:2}` and `{b:2,a:1}` as different keys, which is the first limitation to fix."},{name:`Object arguments`,idea:`Use a nested Map/WeakMap trie so object identity is the key.`,code:`function memoize(fn) {
  const root = new Map();

  return function (...args) {
    let node = root;
    for (const arg of args) {
      const isObj = arg !== null && (typeof arg === 'object' || typeof arg === 'function');
      // objects go in a WeakMap so they can be garbage collected
      const bucket = isObj
        ? (node.weak ??= new WeakMap())
        : (node.prim ??= new Map());
      if (!bucket.has(arg)) bucket.set(arg, new Map());
      node = bucket.get(arg);
    }
    if (!node.hasValue) { node.value = fn.apply(this, args); node.hasValue = true; }
    return node.value;
  };
}

const dist = memoize((a, b) => Math.hypot(a.x - b.x, a.y - b.y));
const p = { x: 0, y: 0 }, q = { x: 3, y: 4 };
dist(p, q);   // computed
dist(p, q);   // cached — same object identities`,cx:`O(arity) lookup · objects held weakly`,why:"Keying on identity rather than serialisation is both faster (no stringify) and correct for objects that cannot be serialised. Using a `WeakMap` for object arguments means a cached entry does not keep its key object alive — when the last reference to `p` disappears, the entry becomes collectable. That is the difference between a cache and a leak."},{name:`Bounded (LRU)`,idea:`An unbounded memo on user input is a memory leak with extra steps.`,code:`function memoizeLRU(fn, limit = 500) {
  const cache = new Map();          // Map preserves insertion order
  return function (...args) {
    const key = JSON.stringify(args);
    if (cache.has(key)) {
      const v = cache.get(key);
      cache.delete(key); cache.set(key, v);   // move to most-recent
      return v;
    }
    const v = fn.apply(this, args);
    cache.set(key, v);
    if (cache.size > limit) {
      cache.delete(cache.keys().next().value);  // evict oldest
    }
    return v;
  };
}`,cx:`O(1) get/set/evict · O(limit) memory`,why:"`Map` iterates in insertion order, so `cache.keys().next().value` is the least-recently-used key once you re-insert on every hit. Delete-then-set is what moves an entry to the back. This is the whole LRU algorithm in four lines and is a common standalone interview question in its own right — see chapter 21."}],takeaway:`Memoisation is a closure over a cache. Recurse through the wrapper, key objects by identity in a WeakMap, and always bound the cache when the input space is unbounded.`},{t:`q`,lvl:`hard`,title:`Closures that leak memory`,tag:`the cost of capturing`,stmt:`Identify the leak in each snippet and fix it.`,approaches:[{name:`Leak 1 — capturing more than you need`,idea:`A closure keeps its whole captured environment alive.`,code:`function setup() {
  const hugeData = new Array(1e7).fill('x');   // ~80 MB
  const id = hugeData.length;

  return function () {
    console.log(id);        // only needs 'id'...
  };
}
const fn = setup();
// ...but in some engines/older builds the whole environment,
// including hugeData, is retained because both are in one scope

// FIX: narrow the capture explicitly
function setup() {
  let hugeData = new Array(1e7).fill('x');
  const id = hugeData.length;
  hugeData = null;                    // release before returning
  return () => console.log(id);
}`,why:"Modern V8 does escape analysis and usually retains only referenced variables, but this is an optimisation rather than a guarantee — it can be defeated by `eval`, by `with`, or by a debugger being attached. Explicitly nulling a large captured value before returning is cheap insurance in code that holds long-lived callbacks."},{name:`Leak 2 — listeners that outlive their target`,idea:`The listener closes over the component; the emitter holds the listener.`,code:`class Widget {
  constructor(el) {
    this.el = el;
    this.data = new Array(1e6);
    // 'this' is captured, and window holds the listener FOREVER
    window.addEventListener('resize', () => this.redraw());
  }
  redraw() { }
}

// FIX 1: keep a reference and remove it
class Widget {
  constructor(el) {
    this.onResize = () => this.redraw();
    window.addEventListener('resize', this.onResize);
  }
  destroy() { window.removeEventListener('resize', this.onResize); }
}

// FIX 2: AbortController — one signal cancels many listeners
class Widget {
  #ac = new AbortController();
  constructor(el) {
    const { signal } = this.#ac;
    window.addEventListener('resize', () => this.redraw(), { signal });
    document.addEventListener('keydown', (e) => this.onKey(e), { signal });
  }
  destroy() { this.#ac.abort(); }     // removes ALL of them
}`,why:"This is the most common real-world leak in front-end code: the DOM node is removed, the component is discarded, but `window` still holds a listener that closes over it, so the whole object graph is retained. The `AbortController` form is the modern answer — one `abort()` detaches every listener registered with that signal, so you cannot forget one."},{name:`Leak 3 — timers and unbounded caches`,idea:`Anything the runtime holds a reference to is a GC root.`,code:`// a repeating timer keeps its closure alive forever
const t = setInterval(() => process(bigThing), 1000);
// FIX: clearInterval(t) on teardown

// an unbounded cache is a leak by design
const cache = new Map();
function get(user) { cache.set(user.id, user); }   // grows forever
// FIX: bound it (LRU) or use WeakMap keyed by the object

// WeakMap: entries vanish when the key is collected
const meta = new WeakMap();
function tag(node, info) { meta.set(node, info); }
// when the DOM node is removed and unreferenced, the entry goes too`,why:`The mental model that catches all three: a value is retained if it is reachable from a **root** — the global object, the current stack, or an active timer/listener registration. Closures matter because they make reachability non-obvious: a function you can no longer call can still be retaining megabytes, because the emitter that holds it is a root.`}],takeaway:"A closure keeps its environment alive as long as the function is reachable. Leaks come from listeners, timers and unbounded caches — use `AbortController`, `clearInterval` and `WeakMap`."},{t:`q`,lvl:`medium`,title:`The IIFE and the module pattern`,tag:`pre-module history, still seen in the wild`,stmt:`Explain what an IIFE is, why the wrapping parentheses are required, and how the revealing module pattern worked before ES modules.`,approaches:[{name:`The parsing rule`,idea:"A statement cannot begin with `function`, so you make it an expression.",code:`// SyntaxError: function statement requires a name
function () { }();

// the parens make it an EXPRESSION
(function () { console.log('ran'); })();     // Crockford style
(function () { console.log('ran'); }());     // Nicholas Zakas style

// any operator that forces expression context works:
!function () { }();
+function () { }();
void function () { }();
;(function () { }());            // leading ; guards against ASI issues

// arrow functions need parens too, for the same reason
(() => console.log('ran'))();

// async IIFE — still genuinely useful for top-level await
// in CommonJS or non-module scripts
(async () => {
  const data = await fetch('/api').then(r => r.json());
  console.log(data);
})();`,why:"The rule is the same one that makes `{}` a block at statement position: the parser decides between statement and expression from the first token. Wrapping in parentheses puts the parser in expression context, where `function` starts a function expression. The leading semicolon idiom exists because if the previous line ended without one, automatic semicolon insertion would try to *call* whatever it produced."},{name:`The revealing module pattern`,idea:`One IIFE per file gave privacy and a controlled public surface.`,code:`var Counter = (function () {
  // ── private ────────────────────────────
  var count = 0;
  function validate(n) {
    if (typeof n !== 'number') throw new TypeError('number required');
  }

  // ── public ─────────────────────────────
  function increment(by) { validate(by); count += by; return count; }
  function reset() { count = 0; }
  function value() { return count; }

  return { increment: increment, reset: reset, value: value };
})();

Counter.increment(5);   // 5
Counter.count;          // undefined — not exposed
Counter.validate;       // undefined — not exposed

// the "global namespace pollution" problem this solved:
// before modules, every top-level var in every script tag
// shared ONE global object. Two libraries both defining
// 'utils' would silently overwrite each other.`,why:`Everything ES modules give you — private module scope, an explicit export list, no global pollution — this pattern approximated with a function. Recognising it matters because a great deal of production JavaScript still looks like this, and because it makes the *purpose* of modules concrete rather than abstract. jQuery, Underscore and Backbone were all built this way.`}],takeaway:`An IIFE creates a scope where the language did not give you one. ES modules made it unnecessary, but the pattern is everywhere in code written before 2016 — and the async IIFE is still useful.`},{t:`guess`,code:`function make() {
  const fns = [];
  for (var i = 0; i < 3; i++) {
    fns.push(function () { return i; });
  }
  return fns;
}
const [a, b, c] = make();
console.log(a(), b(), c());

function make2() {
  const fns = [];
  for (var i = 0; i < 3; i++) {
    (function (i) { fns.push(function () { return i; }); })(i);
  }
  return fns;
}
const [d, e, f] = make2();
console.log(d(), e(), f());`,out:`3 3 3
0 1 2`,why:"In `make`, all three closures capture the single function-scoped `i`, which is `3` after the loop. In `make2`, the IIFE parameter `i` shadows the outer `i` and receives a **copy** of its current value, creating a distinct binding per iteration. Note the inner parameter is deliberately named `i` too — shadowing is what makes the pattern read naturally, and it is why this idiom looks confusing at first glance."},{t:`qa`,q:`What is a closure, in one sentence?`,a:`A function bundled with a reference to the lexical environment it was defined in, which lets it access those variables after the outer function has returned. Every JavaScript function is a closure; the term is only interesting when the outer scope has outlived its call. The practical consequences are private state, memoisation, function factories, partial application, and the memory-retention behaviour that causes leaks.`},{t:`qa`,q:`Do closures capture values or variables?`,a:"Variables — bindings, not snapshots. That is why the `var` loop logs `3` three times, and why mutating a captured variable is visible to every closure over it. To capture a value instead, copy it into a new binding: pass it as an argument, use `let` in a `for` header, or destructure it into a new `const`."},{t:`qa`,q:`Do closures cost memory?`,a:`Yes, but usually less than feared. A closure retains only the variables it actually references, thanks to escape analysis, and the environment is heap-allocated so it is collected once the function becomes unreachable. The real costs are: one function object per instance if you create methods per object rather than on a prototype, and unintended retention when a long-lived root (a listener, a timer, a module-level cache) holds a closure over something large.`}]}]},m={id:`this`,num:`04`,title:"`this`, call, apply & bind",kicker:"The five binding rules, losing `this`, arrow functions and hand-written polyfills",sections:[{id:`th-rules`,title:`The binding rules, in precedence order`,blurb:"`this` is not decided by where a function is written. It is decided by how it is called — and there are exactly five ways.",blocks:[{t:`code`,x:`Determining 'this' — check these IN ORDER, first match wins:

1. ARROW FUNCTION
   no own 'this' at all. Inherits from the enclosing lexical
   scope at DEFINITION time. call/apply/bind cannot change it.

2. new BINDING            new Foo()
   'this' = the brand-new object being constructed

3. EXPLICIT BINDING       fn.call(obj) / fn.apply(obj) / fn.bind(obj)
   'this' = the object you passed
   (a bound function's binding is permanent and beats a later .call)

4. IMPLICIT BINDING       obj.fn()
   'this' = the object BEFORE THE DOT at the call site
   (only the last dot matters: a.b.c() -> this is b)

5. DEFAULT BINDING        fn()
   strict mode / ES module  -> undefined
   sloppy mode              -> globalThis`,cap:`Read the call site, not the definition. Work down the list until one applies.`},{t:`q`,lvl:`medium`,title:`Apply the rules to eight call sites`,tag:`the core exercise`,stmt:"For each call, name which rule applies and what `this` is.",approaches:[{name:`Solution`,idea:`Look only at the call site.`,code:`'use strict';
const obj = {
  name: 'obj',
  regular() { return this?.name; },
  arrow: () => this?.name,          // 'this' = module scope, not obj
  nested() {
    const inner = () => this?.name; // arrow inherits from 'nested'
    return inner();
  },
};

obj.regular();                      // rule 4 -> 'obj'
obj.arrow();                        // rule 1 -> undefined (module this)
obj.nested();                       // rule 1 inherits rule 4 -> 'obj'

const f = obj.regular;
f();                                // rule 5 -> undefined (strict)

f.call({ name: 'called' });         // rule 3 -> 'called'
f.bind({ name: 'bound' })();        // rule 3 -> 'bound'
f.bind({ name: 'a' }).call({ name: 'b' });  // rule 3, bind WINS -> 'a'

const deep = { a: { b: { name: 'deep', get() { return this.name; } } } };
deep.a.b.get();                     // rule 4, LAST dot -> 'deep'

new (function () { this.name = 'ctor'; return this.name; })();  // rule 2`,out:`'obj'
undefined
'obj'
undefined
'called'
'bound'
'a'          <- bind is permanent
'deep'`,why:"Two results are worth dwelling on. `obj.arrow()` gives `undefined` because an arrow at the top level of an object literal is **not** inside a function — object literals do not create scope, so its `this` comes from the module or script, never from `obj`. And `bind` beating a later `.call` is because `bind` returns an *exotic bound function* whose internal `[[BoundThis]]` slot is fixed; `.call` on it is simply ignored for the receiver."}],takeaway:"Only the call site matters, and only the last dot. Arrows have no `this` of their own, and `bind` is permanent."},{t:`q`,lvl:`medium`,title:"Losing `this` — five ways it happens and how to fix each",tag:`the most common real bug`,stmt:"Each snippet loses `this`. Explain why and give the fix.",approaches:[{name:`1 — passing a method as a callback`,idea:`Extracting a method detaches it from its receiver.`,code:`class Timer {
  constructor() { this.seconds = 0; }
  tick() { this.seconds++; }          // 'this' is undefined when detached
  start() {
    setInterval(this.tick, 1000);     // BROKEN: TypeError on this.seconds
  }
}

// FIX A: arrow wrapper — 'this' from start()
start() { setInterval(() => this.tick(), 1000); }

// FIX B: bind
start() { setInterval(this.tick.bind(this), 1000); }

// FIX C: class field arrow — bound at construction, per instance
class Timer {
  seconds = 0;
  tick = () => { this.seconds++; };   // arrow captures instance 'this'
  start() { setInterval(this.tick, 1000); }   // works detached
}`,why:"`setInterval(this.tick)` passes the function object alone — the `this.` part was just how you *found* it, not something that travels with it. Fix C is the React-class idiom and the most robust for callbacks, at the cost of one function per instance rather than one on the prototype."},{name:`2 — array methods`,idea:"The callback runs with its own `this`.",code:`const cart = {
  items: [1, 2, 3],
  tax: 0.2,
  totalBroken() {
    return this.items.map(function (i) {
      return i * (1 + this.tax);      // 'this' is undefined here
    });
  },
  // FIX A: arrow
  totalA() { return this.items.map((i) => i * (1 + this.tax)); },
  // FIX B: thisArg — most array methods accept a second argument
  totalB() {
    return this.items.map(function (i) { return i * (1 + this.tax); }, this);
  },
  // FIX C: capture in a variable (the pre-ES6 idiom)
  totalC() {
    const self = this;
    return this.items.map(function (i) { return i * (1 + self.tax); });
  },
};`,why:"`map`, `forEach`, `filter`, `some`, `every`, `find` and `flatMap` all accept an optional `thisArg` as their second parameter — genuinely useful and widely forgotten. Note it has no effect on an arrow callback, because arrows ignore any attempt to set `this`."},{name:`3 — destructuring a method off an object`,idea:`Destructuring is extraction, so the receiver is lost.`,code:`const api = {
  base: 'https://x.com',
  get(path) { return this.base + path; },
};

const { get } = api;
get('/users');            // TypeError: Cannot read properties of undefined

// FIX: bind at destructure time
const { get } = api;
const boundGet = get.bind(api);

// or design the API not to need 'this' at all:
const makeApi = (base) => ({ get: (path) => base + path });
const { get } = makeApi('https://x.com');
get('/users');            // works — closes over 'base', no 'this'`,why:"The last version is the deeper fix: a factory returning closures has no `this` to lose. This is a large part of why functional-style module design avoids the problem entirely, and why library authors often expose standalone functions rather than methods."},{name:`4 — nested regular function`,idea:"An inner `function` gets its own `this`, defaulting to undefined.",code:`const obj = {
  data: [1, 2],
  run() {
    function helper() {
      return this.data;   // undefined — helper was called plainly
    }
    return helper();
  },
};

// FIX: arrow inherits from run()
run() {
  const helper = () => this.data;
  return helper();
}`,why:"This is rule 5 firing inside rule 4. `helper()` is a plain call, so nothing binds `this` and it defaults to `undefined` in strict mode. Before arrows existed, the standard fix was `const self = this` — which is exactly what an arrow does automatically."},{name:`5 — DOM listeners and arrows`,idea:`Here the arrow is the *problem*, not the fix.`,code:`// a regular function listener gets 'this' = the element
btn.addEventListener('click', function () {
